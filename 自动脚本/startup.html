<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>蔚蓝星区开局</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a2f;
      --panel-soft: #18233d;
      --line: #2b3a60;
      --line-hot: #4d679d;
      --text: #eef3ff;
      --muted: #9eabc8;
      --accent: #87a7ff;
      --accent-soft: rgba(135, 167, 255, 0.14);
      --good: #95d8a6;
      --bad: #ff9a9a;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: linear-gradient(180deg, #09101d, #0d1426 48%, #0a1020); color: var(--text); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    body { padding: 20px; }
    button, input { font: inherit; }
    input {
      width: 100%;
      padding: 10px 12px;
      color: var(--text);
      background: #0f1730;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
    }
    input:focus { border-color: var(--line-hot); }
    .app {
      max-width: 1320px;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(12, 18, 34, 0.96);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .hero {
      padding: 24px 28px 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(135, 167, 255, 0.08), rgba(135, 167, 255, 0.02));
    }
    .hero h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .hero p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }
    .layout {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      min-height: 860px;
    }
    .sidebar {
      padding: 20px;
      border-right: 1px solid var(--line);
      background: rgba(10, 15, 28, 0.72);
    }
    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: rgba(15, 22, 40, 0.72);
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }
    .panel + .panel { margin-top: 14px; }
    .section-title {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 13px;
      letter-spacing: 1px;
      font-weight: 700;
    }
    .tiny {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
    .value {
      font-size: 22px;
      font-weight: 700;
    }
    .good { color: var(--good); }
    .bad { color: var(--bad); }
    .steps {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .step {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: #121a2f;
    }
    .step.active {
      border-color: var(--line-hot);
      background: var(--accent-soft);
    }
    .step strong {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .step span {
      color: var(--muted);
      font-size: 12px;
    }
    .content {
      flex: 1;
      padding: 18px 20px;
      overflow: auto;
    }
    .view { display: none; }
    .view.active { display: block; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
      transition: border-color .18s ease, transform .18s ease, background .18s ease;
    }
    .card:hover {
      border-color: var(--line-hot);
      transform: translateY(-2px);
    }
    .card.selected {
      border-color: var(--accent);
      background: rgba(135, 167, 255, 0.12);
    }
    .card.disabled {
      opacity: 0.52;
      cursor: not-allowed;
    }
    .card h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      min-height: 24px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.02);
      color: var(--muted);
      font-size: 12px;
    }
    .desc {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
    }
    .kv {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      gap: 8px;
      margin-top: 8px;
      font-size: 13px;
    }
    .kv .k { color: var(--muted); }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .chip, .btn {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #11182d;
      color: var(--text);
      padding: 9px 12px;
      cursor: pointer;
    }
    .chip.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .btn.primary {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .skill-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
    }
    .skill-card {
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
    }
    .skill-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .skill-head strong { font-size: 15px; }
    .skill-level { color: var(--accent); font-weight: 700; }
    .skill-actions {
      display: flex;
      gap: 8px;
    }
    .skill-actions button {
      flex: 1;
      min-height: 38px;
    }
    .footer {
      padding: 16px 20px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 10px;
      background: rgba(15, 22, 40, 0.72);
    }
    .status {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
    .empty {
      padding: 40px 16px;
      border: 1px dashed var(--line);
      border-radius: 14px;
      color: var(--muted);
      text-align: center;
    }
    .label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
    }
    @media (max-width: 980px) {
      body { padding: 10px; }
      .layout { grid-template-columns: 1fr; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
      .steps { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hero">
      <h1>蔚蓝星区开局面板</h1>
      <p id="load-status">正在读取世界书中的开局数据。</p>
    </div>
    <div class="layout">
      <aside class="sidebar">
        <div class="panel">
          <div class="section-title">开局预算</div>
          <div class="value" id="tp-remaining">0 TP</div>
          <div class="tiny" id="tp-detail">总计 0 / 已用 0</div>
        </div>
        <div class="panel">
          <div class="section-title">当前选择</div>
          <div class="tiny" id="selection-summary">尚未开始。</div>
        </div>
        <div class="panel">
          <div class="section-title">世界书来源</div>
          <div class="tiny" id="worldbook-label">未读取</div>
        </div>
        <div class="panel">
          <div class="section-title">阶段要求</div>
          <div class="tiny">
            1. 先选 1 艘开局舰船并命名。<br>
            2. 再选 1 名兼容观星者。<br>
            3. 分配技能点或直接套用预设。<br>
            4. 选定开局条目后注入开局。
          </div>
        </div>
      </aside>
      <section class="main">
        <div class="topbar">
          <div>
            <div style="font-size:18px;font-weight:700;" id="phase-title">阶段 1 / 舰船</div>
            <div class="tiny" id="phase-desc">选择唯一开局舰船，并填写舰名。</div>
          </div>
          <div style="width:min(480px, 100%);">
            <div class="steps">
              <div class="step active" id="step-1"><strong>1. 舰船</strong><span>船体与命名</span></div>
              <div class="step" id="step-2"><strong>2. 观星者</strong><span>兼容驱动</span></div>
              <div class="step" id="step-3"><strong>3. 技能</strong><span>预设或手调</span></div>
              <div class="step" id="step-4"><strong>4. 开局</strong><span>地点与描述</span></div>
            </div>
          </div>
        </div>
        <div class="content">
          <section class="view active" id="view-1">
            <div class="panel" style="margin-bottom:14px;">
              <label class="label" for="ship-name">舰船名称</label>
              <input id="ship-name" placeholder="请输入你的开局舰名">
            </div>
            <div class="grid" id="ship-grid"></div>
          </section>
          <section class="view" id="view-2">
            <div class="panel" style="margin-bottom:14px;">
              <label class="label" for="stargazer-name">观星者称呼</label>
              <input id="stargazer-name" placeholder="可自定义你对观星者的称呼">
            </div>
            <div class="grid" id="stargazer-grid"></div>
          </section>
          <section class="view" id="view-3">
            <div class="panel" style="margin-bottom:14px;">
              <div class="section-title">技能预设</div>
              <div class="toolbar" id="preset-toolbar"></div>
              <div class="tiny">技能点按当前数据结构直接写回，花费等于各技能等级总和。</div>
            </div>
            <div class="skill-grid" id="skill-grid"></div>
          </section>
          <section class="view" id="view-4">
            <div class="panel">
              <div class="section-title">开局</div>
              <div class="grid" id="story-grid"></div>
            </div>
          </section>
        </div>
        <div class="footer">
          <div class="status" id="footer-status">等待数据载入。</div>
          <div style="display:flex;gap:10px;">
            <button class="btn" id="prev-btn" disabled>上一步</button>
            <button class="btn primary" id="next-btn" disabled>下一步</button>
          </div>
        </div>
      </section>
    </div>
  </div>
  <script>
    var DEFAULT_SKILL_ORDER = ["导弹", "炮术", "战机", "算法", "工程", "工业", "科学", "驾驶", "装甲", "护盾", "同调"];
    var WORLDBOOK_NAME = typeof getCurrentCharPrimaryLorebook === "function" ? getCurrentCharPrimaryLorebook() : "";
    var ENTRY_COMMENTS = ["__INIT_DATA__", "__开局JSON__"];

    var DATA = null;
    var BOOT_PROMISE = null;
    var state = {
      phase: 1,
      shipKey: "",
      shipName: "",
      stargazerKey: "",
      stargazerName: "",
      skillPreset: "",
      skillLevels: {},
      storyKey: ""
    };

    function $(id) { return document.getElementById(id); }
    function esc(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }
    function clone(value) {
      return JSON.parse(JSON.stringify(value == null ? null : value));
    }
    function text(value, fallback) {
      if (value == null || value === "") return fallback || "";
      return String(value);
    }
    function numberOf(value) {
      var matched = String(value == null ? "" : value).match(/-?\d+(\.\d+)?/);
      return matched ? Number(matched[0]) : 0;
    }
    function ownKeys(obj) {
      return Object.keys(obj || {});
    }
    function setLoadStatus(message, bad) {
      $("load-status").textContent = message;
      $("load-status").style.color = bad ? "var(--bad)" : "var(--muted)";
    }
    function findDataNode(node, attrName) {
      while (node && node !== document) {
        if (node.getAttribute && node.getAttribute(attrName) != null) return node;
        node = node.parentNode;
      }
      return null;
    }
    function normalizeStargazerReq(value) {
      if (!value) return { stable: 0, bitrate: 0, precision: 0, raw: "" };
      if (typeof value === "number") {
        return { stable: Number(value) || 0, bitrate: 0, precision: 0, raw: String(value) };
      }
      if (typeof value === "string") {
        var stableMatch = value.match(/稳态[^0-9-]*(-?\d+(\.\d+)?)/);
        var bitrateMatch = value.match(/比特率[^0-9-]*(-?\d+(\.\d+)?)/);
        var precisionMatch = value.match(/精度[^0-9-]*(-?\d+(\.\d+)?)/);
        return {
          stable: stableMatch ? Number(stableMatch[1]) : 0,
          bitrate: bitrateMatch ? Number(bitrateMatch[1]) : 0,
          precision: precisionMatch ? Number(precisionMatch[1]) : 0,
          raw: value
        };
      }
      return {
        stable: Number(value["稳态增益"] || value.stable || 0),
        bitrate: Number(value["比特率"] || value.bitrate || 0),
        precision: Number(value["精度"] || value.precision || 0),
        raw: JSON.stringify(value)
      };
    }
    function normalizeInitData(raw) {
      if (!raw || typeof raw !== "object") throw new Error("开局数据为空或格式错误。");

      var result = {
        worldbook: WORLDBOOK_NAME || "未识别",
        rules: { tp: 24 },
        ships: {},
        stargazers: {},
        skillPresets: raw.skill_presets || {},
        beginningPlots: raw.beginning_plots || {},
        originals: {
          ships: raw.ships || {},
          specialShips: raw.special_ships || {},
          stargazers: raw.stargazers || {},
          beginningPlots: raw.beginning_plots || {}
        }
      };

      var mergedShips = {};
      var baseShips = raw.ships || {};
      var specialShips = raw.special_ships || {};
      var key = "";

      for (key in baseShips) {
        if (Object.prototype.hasOwnProperty.call(baseShips, key)) mergedShips[key] = baseShips[key];
      }
      for (key in specialShips) {
        if (Object.prototype.hasOwnProperty.call(specialShips, key)) mergedShips[key] = specialShips[key];
      }

      for (key in mergedShips) {
        if (!Object.prototype.hasOwnProperty.call(mergedShips, key)) continue;
        var ship = mergedShips[key] || {};
        var resources = ship.fitting_resources || {};
        result.ships[key] = {
          price: Number(ship.price || 0),
          desc: ship.description || "",
          shipType: ship.ship_type || "",
          tonnage: ship.tonnage || "",
          hardpoints: ship.hardpoint_layout || "",
          slots: ship.slot_layout || "",
          manufacturer: ship.manufacturer || "",
          pg: Number(resources.pg || 0),
          cpu: Number(resources.cpu || 0),
          isSpecial: !!ship.is_special,
          stargazerReq: normalizeStargazerReq(ship.stargazer_drive_requirement || ship.stargazer_interface_role || "")
        };
      }

      for (key in (raw.stargazers || {})) {
        if (!Object.prototype.hasOwnProperty.call(raw.stargazers, key)) continue;
        var item = raw.stargazers[key] || {};
        var profile = item.static_profile || {};
        var perf = profile["性能参数"] || profile.performance || {};
        result.stargazers[key] = {
          price: Number(item.price || 0),
          camp: item.faction || "",
          role: item.identity || "",
          desc: item.notes || profile["描述"] || item.appearance || "",
          perf: {
            stable: numberOf(perf["稳态增益"] || perf.stable_gain),
            bitrate: numberOf(perf["比特率"] || perf.bitrate),
            precision: numberOf(perf["精度"] || perf.precision)
          }
        };
      }

      for (key in (raw.beginning_plots || {})) {
        if (!Object.prototype.hasOwnProperty.call(raw.beginning_plots, key)) continue;
        var plot = raw.beginning_plots[key] || {};
        result.beginningPlots[key] = {
          location: text(plot.location),
          description: text(plot.description)
        };
      }

      return result;
    }
    function loadInitDataFromWorldbook() {
      return getWorldbook(WORLDBOOK_NAME).then(function (worldbook) {
        var entry = null;
        var i = 0;
        for (i = 0; i < worldbook.length; i++) {
          if (worldbook[i] && ENTRY_COMMENTS.indexOf(worldbook[i].comment) !== -1) {
            entry = worldbook[i];
            break;
          }
        }
        if (!entry || !entry.content) {
          throw new Error("世界书中未找到 " + ENTRY_COMMENTS.join(" / ") + " 条目。");
        }
        $("worldbook-label").textContent = text(WORLDBOOK_NAME, "当前角色主世界书") + " / " + entry.comment;
        return normalizeInitData(JSON.parse(entry.content));
      });
    }
    function ensureBootData() {
      if (BOOT_PROMISE) return BOOT_PROMISE;
      setLoadStatus("正在读取世界书中的开局数据。", false);
      BOOT_PROMISE = loadInitDataFromWorldbook().then(function (data) {
        DATA = data;
        resetSkillLevels();
        setLoadStatus("开局数据载入完成，可以开始选择。", false);
        $("footer-status").textContent = "开局数据已就绪。";
        $("next-btn").disabled = false;
        renderAll();
        return DATA;
      }).catch(function (error) {
        $("footer-status").textContent = "开局数据载入失败。";
        $("next-btn").disabled = true;
        setLoadStatus("世界书读取失败：" + error.message, true);
        throw error;
      });
      return BOOT_PROMISE;
    }
    function resetSkillLevels() {
      var merged = {};
      var i = 0;
      var presetName = "";
      var skill = "";
      for (i = 0; i < DEFAULT_SKILL_ORDER.length; i++) merged[DEFAULT_SKILL_ORDER[i]] = 0;
      for (presetName in (DATA.skillPresets || {})) {
        if (!Object.prototype.hasOwnProperty.call(DATA.skillPresets, presetName)) continue;
        for (skill in (DATA.skillPresets[presetName] || {})) {
          if (Object.prototype.hasOwnProperty.call(DATA.skillPresets[presetName], skill) && !Object.prototype.hasOwnProperty.call(merged, skill)) {
            merged[skill] = 0;
          }
        }
      }
      state.skillLevels = merged;
    }
    function getSkillNames() {
      return ownKeys(state.skillLevels);
    }
    function getShipCost() {
      return state.shipKey && DATA.ships[state.shipKey] ? Number(DATA.ships[state.shipKey].price || 0) : 0;
    }
    function getStargazerCost() {
      return state.stargazerKey && DATA.stargazers[state.stargazerKey] ? Number(DATA.stargazers[state.stargazerKey].price || 0) : 0;
    }
    function getSkillCost() {
      var keys = getSkillNames();
      var sum = 0;
      var i = 0;
      for (i = 0; i < keys.length; i++) sum += Number(state.skillLevels[keys[i]] || 0);
      return sum;
    }
    function getTotalTp() {
      return Number((DATA && DATA.rules && DATA.rules.tp) || 0);
    }
    function getUsedTp() {
      return getShipCost() + getStargazerCost() + getSkillCost();
    }
    function getRemainingTp() {
      return getTotalTp() - getUsedTp();
    }
    function getCurrentShip() {
      return state.shipKey ? DATA.ships[state.shipKey] : null;
    }
    function isStargazerCompatible(stargazerKey) {
      var ship = getCurrentShip();
      var sg = DATA.stargazers[stargazerKey];
      var req = null;
      var missing = [];
      if (!ship || !sg) return { ok: false, reason: "数据缺失" };
      req = ship.stargazerReq || { stable: 0, bitrate: 0, precision: 0 };
      if (Number(req.stable || 0) > Number(sg.perf.stable || 0)) missing.push("稳态增益不足");
      if (Number(req.bitrate || 0) > Number(sg.perf.bitrate || 0)) missing.push("比特率不足");
      if (Number(req.precision || 0) > Number(sg.perf.precision || 0)) missing.push("精度不足");
      return missing.length ? { ok: false, reason: missing.join(" / ") } : { ok: true, reason: "兼容" };
    }
    function phaseValid(phase) {
      if (phase === 1) return !!state.shipKey && !!String(state.shipName || "").replace(/^\s+|\s+$/g, "");
      if (phase === 2) return !!state.stargazerKey && isStargazerCompatible(state.stargazerKey).ok;
      if (phase === 3) return getRemainingTp() >= 0;
      if (phase === 4) return !!state.storyKey;
      return false;
    }
    function setPhase(nextPhase) {
      if (nextPhase < 1) nextPhase = 1;
      if (nextPhase > 4) nextPhase = 4;
      state.phase = nextPhase;
      renderAll();
    }
    function renderHeader() {
      var config = {
        1: ["阶段 1 / 舰船", "选择唯一开局舰船，并填写舰名。"],
        2: ["阶段 2 / 观星者", "根据舰船驱动需求选择兼容观星者。"],
        3: ["阶段 3 / 技能", "套用预设或手动分配技能等级。"],
        4: ["阶段 4 / 开局", "确定开局地点与描述后，直接注入开局。"]
      };
      var i = 0;
      $("phase-title").textContent = config[state.phase][0];
      $("phase-desc").textContent = config[state.phase][1];
      for (i = 1; i <= 4; i++) {
        $("step-" + i).className = i === state.phase ? "step active" : "step";
      }
      $("prev-btn").disabled = state.phase === 1;
      $("next-btn").textContent = state.phase === 4 ? "开始游戏" : "下一步";
    }
    function renderSidebar() {
      var parts = [];
      $("tp-remaining").textContent = String(getRemainingTp()) + " TP";
      $("tp-remaining").className = "value " + (getRemainingTp() >= 0 ? "good" : "bad");
      $("tp-detail").textContent = "总计 " + getTotalTp() + " / 已用 " + getUsedTp();

      parts.push("舰船：" + (state.shipKey || "未选择"));
      parts.push("舰名：" + (state.shipName || "未命名"));
      parts.push("观星者：" + (state.stargazerKey || "未选择"));
      parts.push("称呼：" + (state.stargazerName || "未填写"));
      parts.push("技能预设：" + (state.skillPreset || "无"));
      parts.push("开局：" + (state.storyKey || "未选择"));
      $("selection-summary").innerHTML = parts.map(function (line) {
        return esc(line);
      }).join("<br>");
    }
    function renderShipGrid() {
      var keys = ownKeys(DATA.ships);
      var html = "";
      var i = 0;
      if (!keys.length) {
        $("ship-grid").innerHTML = '<div class="empty">当前世界书没有可选舰船。</div>';
        return;
      }
      for (i = 0; i < keys.length; i++) {
        var key = keys[i];
        var item = DATA.ships[key];
        html += '<article class="card' + (state.shipKey === key ? ' selected' : '') + '" data-ship="' + esc(key) + '">';
        html += '<h3>' + esc(key) + '</h3>';
        html += '<div class="meta">';
        html += '<span class="badge">' + esc(item.shipType || "未知舰型") + '</span>';
        html += '<span class="badge">' + esc(item.tonnage || "未知吨位") + '</span>';
        html += '<span class="badge">' + esc(String(item.price)) + ' TP</span>';
        html += '</div>';
        html += '<div class="kv"><div class="k">制造商</div><div>' + esc(item.manufacturer || "未记录") + '</div></div>';
        html += '<div class="kv"><div class="k">炮位</div><div>' + esc(item.hardpoints || "未记录") + '</div></div>';
        html += '<div class="kv"><div class="k">槽位</div><div>' + esc(item.slots || "未记录") + '</div></div>';
        html += '<div class="kv"><div class="k">资源</div><div>PG ' + esc(item.pg) + ' / CPU ' + esc(item.cpu) + '</div></div>';
        html += '<p class="desc">' + esc(item.desc || "暂无描述") + '</p>';
        html += '</article>';
      }
      $("ship-grid").innerHTML = html;
    }
    function renderStargazerGrid() {
      var keys = ownKeys(DATA.stargazers);
      var html = "";
      var i = 0;
      if (!keys.length) {
        $("stargazer-grid").innerHTML = '<div class="empty">当前世界书没有可选观星者。</div>';
        return;
      }
      for (i = 0; i < keys.length; i++) {
        var key = keys[i];
        var item = DATA.stargazers[key];
        var compat = state.shipKey ? isStargazerCompatible(key) : { ok: false, reason: "请先选舰船" };
        var cls = "card";
        if (state.stargazerKey === key) cls += " selected";
        if (!compat.ok) cls += " disabled";
        html += '<article class="' + cls + '" data-stargazer="' + esc(key) + '">';
        html += '<h3>' + esc(key) + '</h3>';
        html += '<div class="meta">';
        html += '<span class="badge">' + esc(item.camp || "未知阵营") + '</span>';
        html += '<span class="badge">' + esc(String(item.price)) + ' TP</span>';
        html += '<span class="badge ' + (compat.ok ? "good" : "bad") + '">' + esc(compat.reason) + '</span>';
        html += '</div>';
        html += '<div class="kv"><div class="k">身份</div><div>' + esc(item.role || "未记录") + '</div></div>';
        html += '<div class="kv"><div class="k">稳态增益</div><div>' + esc(item.perf.stable) + '</div></div>';
        html += '<div class="kv"><div class="k">比特率</div><div>' + esc(item.perf.bitrate) + '</div></div>';
        html += '<div class="kv"><div class="k">精度</div><div>' + esc(item.perf.precision) + '</div></div>';
        html += '<p class="desc">' + esc(item.desc || "暂无描述") + '</p>';
        html += '</article>';
      }
      $("stargazer-grid").innerHTML = html;
    }
    function renderPresetToolbar() {
      var keys = ownKeys(DATA.skillPresets);
      var html = "";
      var i = 0;
      if (!keys.length) {
        $("preset-toolbar").innerHTML = '<span class="tiny">当前世界书没有技能预设。</span>';
        return;
      }
      for (i = 0; i < keys.length; i++) {
        html += '<button class="chip' + (state.skillPreset === keys[i] ? ' active' : '') + '" data-preset="' + esc(keys[i]) + '">' + esc(keys[i]) + '</button>';
      }
      $("preset-toolbar").innerHTML = html;
    }
    function renderSkillGrid() {
      var keys = getSkillNames();
      var html = "";
      var i = 0;
      for (i = 0; i < keys.length; i++) {
        var skill = keys[i];
        html += '<div class="skill-card">';
        html += '<div class="skill-head"><strong>' + esc(skill) + '</strong><span class="skill-level">LV ' + esc(state.skillLevels[skill]) + '</span></div>';
        html += '<div class="skill-actions">';
        html += '<button class="btn" data-skill-minus="' + esc(skill) + '">-1</button>';
        html += '<button class="btn" data-skill-plus="' + esc(skill) + '">+1</button>';
        html += '</div>';
        html += '</div>';
      }
      $("skill-grid").innerHTML = html;
    }
    function renderStoryGrid() {
      var keys = ownKeys(DATA.beginningPlots);
      var html = "";
      var i = 0;
      if (!keys.length) {
        $("story-grid").innerHTML = '<div class="empty">当前世界书没有开局条目。</div>';
        return;
      }
      for (i = 0; i < keys.length; i++) {
        var key = keys[i];
        var item = DATA.beginningPlots[key] || {};
        html += '<article class="card' + (state.storyKey === key ? ' selected' : '') + '" data-story="' + esc(key) + '">';
        html += '<h3>' + esc(key) + '</h3>';
        html += '<div class="kv"><div class="k">地点</div><div>' + esc(item.location || "未记录") + '</div></div>';
        html += '<p class="desc">' + esc(item.description || "暂无描述") + '</p>';
        html += '</article>';
      }
      $("story-grid").innerHTML = html;
    }
    function renderViews() {
      var i = 0;
      for (i = 1; i <= 4; i++) {
        $("view-" + i).className = i === state.phase ? "view active" : "view";
      }
    }
    function renderAll() {
      if (!DATA) return;
      renderHeader();
      renderSidebar();
      renderViews();
      renderShipGrid();
      renderStargazerGrid();
      renderPresetToolbar();
      renderSkillGrid();
      renderStoryGrid();
    }
    function applySkillPreset(presetName) {
      var preset = DATA.skillPresets[presetName] || {};
      var next = {};
      var skills = getSkillNames();
      var i = 0;
      var nextCost = 0;
      var budgetWithoutSkills = getShipCost() + getStargazerCost();
      for (i = 0; i < skills.length; i++) {
        next[skills[i]] = Number(preset[skills[i]] || 0);
        nextCost += Number(next[skills[i]] || 0);
      }
      if (getTotalTp() - budgetWithoutSkills - nextCost < 0) {
        alert("转生点不足，无法套用该技能预设。");
        return;
      }
      state.skillLevels = next;
      state.skillPreset = presetName;
      renderAll();
    }
    function updateSkill(skill, delta) {
      var current = Number(state.skillLevels[skill] || 0);
      var nextValue = Math.max(0, Math.min(5, current + delta));
      var diff = nextValue - current;
      if (nextValue === current) return;
      if (diff > 0 && getRemainingTp() - diff < 0) {
        alert("转生点不足，无法继续加点。");
        return;
      }
      state.skillLevels[skill] = nextValue;
      state.skillPreset = "";
      renderAll();
    }
    function buildLaunchPayload() {
      var shipKey = state.shipKey;
      var stargazerKey = state.stargazerKey;
      var storyKey = state.storyKey;
      var shipData = clone((DATA.originals.ships || {})[shipKey] || (DATA.originals.specialShips || {})[shipKey] || {});
      var stargazerData = clone((DATA.originals.stargazers || {})[stargazerKey] || {});
      var storyData = clone((DATA.originals.beginningPlots || {})[storyKey] || {});
      var packagedShip = {};
      var packagedStargazer = {};
      var packagedPlot = {};

      shipData.pilot = shipData.pilot || "{{user}}";
      shipData.stargazer_interface_role = state.stargazerName || stargazerKey;

      if (!stargazerData.additional_info) stargazerData.additional_info = {};
      stargazerData.additional_info.ship_id = state.shipName;

      packagedShip[state.shipName] = shipData;
      packagedStargazer[state.stargazerName || stargazerKey] = stargazerData;
      packagedPlot[storyKey] = storyData;

      return {
        system: {
          module: "AzureSectorStartup",
          version: "1.0.0"
        },
        meta: {
          worldbook: DATA.worldbook,
          sourceEntryComments: ENTRY_COMMENTS
        },
        selection: {
          shipTemplate: shipKey,
          shipName: state.shipName,
          stargazerTemplate: stargazerKey,
          stargazerName: state.stargazerName || stargazerKey,
          skillPreset: state.skillPreset || null,
          skillLevels: clone(state.skillLevels),
          story: storyKey,
          totalTP: getTotalTp(),
          usedTP: getUsedTp(),
          remainingTP: getRemainingTp()
        },
        initData: {
          ships: packagedShip,
          stargazers: packagedStargazer,
          skills: clone(state.skillLevels),
          beginning_plot: packagedPlot
        }
      };
    }
    function injectLaunch() {
      var payload = null;
      var body = "";
      var prompt = "";
      if (!phaseValid(4)) {
        alert("请先完成舰船、观星者、技能和开局剧情选择。");
        return;
      }

      payload = buildLaunchPayload();
      body = JSON.stringify(payload, null, 2);
      prompt = [
        "[系统指令：玩家已完成《蔚蓝星域的观星者》开局选择。请严格依据下方 JSON 初始化角色、舰船、观星者、技能与开局，并立即开始正式叙事。]",
        "",
        "要求：",
        "1. 忽略任何旧的示例开局，以下 JSON 为唯一准入数据。",
        "2. 将所选舰船、观星者、技能与开局写入当前游戏状态。",
        "3. 观星者应绑定到玩家当前舰船，舰船名使用 shipName。",
        "4. 采用所选开局中的地点与描述作为正式开场依据。",
        "5. 输出开场叙事后，再进行必要的变量更新。",
        "",
        "```json",
        body,
        "```"
      ].join("\n");

      if (typeof createChatMessages === "function") {
        return Promise.resolve(createChatMessages([{ role: "user", message: prompt }])).then(function () {
          $("footer-status").textContent = "开局配置已注入聊天。";
          $("next-btn").textContent = "已注入";
          $("next-btn").disabled = true;
        });
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(prompt).then(function () {
          $("footer-status").textContent = "环境不支持直接注入，已复制到剪贴板。";
          alert("当前环境未提供 createChatMessages，开局指令已复制到剪贴板。");
        });
      }
      console.log(prompt);
      $("footer-status").textContent = "环境不支持直接注入，请从控制台复制。";
      alert("当前环境不支持直接注入，请按 F12 在控制台复制开局指令。");
      return Promise.resolve();
    }
    function bindEvents() {
      $("ship-name").addEventListener("input", function () {
        state.shipName = String(this.value || "").replace(/^\s+|\s+$/g, "");
        renderSidebar();
      });
      $("stargazer-name").addEventListener("input", function () {
        state.stargazerName = String(this.value || "").replace(/^\s+|\s+$/g, "");
        renderSidebar();
      });
      $("prev-btn").addEventListener("click", function () {
        if (state.phase > 1) setPhase(state.phase - 1);
      });
      $("next-btn").addEventListener("click", function () {
        if (!phaseValid(state.phase)) {
          if (state.phase === 1) return alert("请先选定开局舰船，并填写舰名。");
          if (state.phase === 2) return alert("请先选择一名与当前舰船兼容的观星者。");
          if (state.phase === 3) return alert("请检查技能点是否超出预算。");
          if (state.phase === 4) return alert("请先选择开局剧情。");
        }
        if (state.phase < 4) setPhase(state.phase + 1);
        else injectLaunch();
      });

      document.addEventListener("click", function (event) {
        var shipNode = findDataNode(event.target, "data-ship");
        var sgNode = null;
        var presetNode = null;
        var minusNode = null;
        var plusNode = null;
        var storyNode = null;
        var key = "";
        var price = 0;
        var refund = 0;
        var compat = null;

        if (shipNode) {
          key = shipNode.getAttribute("data-ship");
          price = Number((DATA.ships[key] || {}).price || 0);
          refund = getShipCost();
          if (getRemainingTp() + refund - price < 0) {
            alert("转生点不足，无法选择该舰船。");
            return;
          }
          state.shipKey = key;
          if (!state.shipName) state.shipName = key;
          $("ship-name").value = state.shipName;
          if (state.stargazerKey && !isStargazerCompatible(state.stargazerKey).ok) {
            state.stargazerKey = "";
          }
          renderAll();
          return;
        }

        sgNode = findDataNode(event.target, "data-stargazer");
        if (sgNode) {
          key = sgNode.getAttribute("data-stargazer");
          compat = isStargazerCompatible(key);
          if (!compat.ok) {
            alert("该观星者与当前舰船不兼容：" + compat.reason);
            return;
          }
          price = Number((DATA.stargazers[key] || {}).price || 0);
          refund = getStargazerCost();
          if (getRemainingTp() + refund - price < 0) {
            alert("转生点不足，无法选择该观星者。");
            return;
          }
          state.stargazerKey = key;
          if (!state.stargazerName) state.stargazerName = key;
          $("stargazer-name").value = state.stargazerName;
          renderAll();
          return;
        }

        presetNode = findDataNode(event.target, "data-preset");
        if (presetNode) {
          applySkillPreset(presetNode.getAttribute("data-preset"));
          return;
        }

        minusNode = findDataNode(event.target, "data-skill-minus");
        if (minusNode) {
          updateSkill(minusNode.getAttribute("data-skill-minus"), -1);
          return;
        }

        plusNode = findDataNode(event.target, "data-skill-plus");
        if (plusNode) {
          updateSkill(plusNode.getAttribute("data-skill-plus"), 1);
          return;
        }

        storyNode = findDataNode(event.target, "data-story");
        if (storyNode) {
          state.storyKey = storyNode.getAttribute("data-story");
          renderAll();
        }
      });
    }

    bindEvents();
    ensureBootData();
  </script>
</body>
</html>
