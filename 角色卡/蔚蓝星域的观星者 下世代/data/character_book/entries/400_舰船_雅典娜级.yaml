    描述: 舰体呈一个巨大而厚重的六边形棱柱。舰体表面覆盖着层层叠叠的泰坦合金装甲板，几乎看不到任何脆弱的外部结构。其最显著的特征是贯穿舰体，直径超过百米的巨型机库通道，无人机可以直接从舰首的装甲发射口弹出，并在舰尾的引导力场中回收。
