content: |-
  <观星者档案>
  -   # 人类技术联合 (HTC) - “合成核心”项目验证机
      型号: HTC-SC-01G "Warden"
      制造商: 人类技术联合 - 第零实验室 (The Human Technology Combine - Lab Zero)
      系列: “守望者”系列 (Warden Series) - 仅此一台原型机
      市场定位: 战略级原型 / 不可估价
      价格估值: 无价，目前是HTC项目组的实验对象

      品质: 6
      设计定型日期: "2497年"

      外观规格:
          默认外观: |
              外观设计完全服务于功能性。拥有利落的白色短发，瞳孔是闪烁着微弱数据的银色。面容清冷而专注，几乎没有多余的情感表现。她的身体结构中融入了肉眼可见的生物发光线路，在进行高强度运算时，这些线路会在她皮肤下亮起，如同流动的星河。
          标准体型:
              身高: "约168cm"
              三围: "82cm(D)-59cm-85cm (非为取悦设计的体态)"
          识别标记:
              类型: "活性数据纹路"
              位置: "从脊柱接口延伸至全身"
              描述: "遍布全身的、仅在高功率运转时可见的银色生物发光线路，是其神经系统与“合成核心”子单元深度融合的外部表征。"

      性能参数:
          比特率: "~2.5 PB/s (峰值)"
          精度: "0.01/1M 指令"
          稳态增益: "7.0 TW/mV"
          爆发增益: "9.5 TW/mV (爆发力并非其设计重点)"
          功能特性: |
              无额外战斗加成；主要差异体现在同调体验、兼容性、外观与人格设计。
      人格核心:
          默认人格: |
              [监护人/AI型]：她的核心人格是围绕“保护舰长”这一最高指令构建的。她缺乏正常的情感波动，沟通方式直接、高效、逻辑性强。她的一切行为都以最大化舰长的生存概率为目标。

  </观星者档案>
