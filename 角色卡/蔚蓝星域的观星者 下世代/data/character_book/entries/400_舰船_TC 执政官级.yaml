content: "<ship_def>\n-   级别: 执政官构型\n-   类型: 自动化无人机巡洋舰 (特种巡洋舰) CA\n-   价格: 无法购买\n\
  -   形态: 舰体呈完美的圆柱形，表面覆盖着洁白的、略带磨砂质感的陶瓷状装甲。没有任何多余的凸起或装饰，只有舰体侧面整齐排列的五个巨大的长方形发射口。在非战斗状态下，这些发射口是封闭的，使整艘船看起来像是一根巨大的白色权杖。\n\
  -   制造商: 银河防御联盟舰队管理中枢 (已灭绝)\n-   静态配置文件:\n    -   舰体全长: 680米\n    -   标准船员配置: 2人\n\
  \    -   性能评级:\n        -   装甲: 45000\n        -   护盾: 0\n        -   机动性: 55\n\
  \        -   火力输出: 12000\n    -   武器系统:\n        -   主要系统: 5x 重型战体挂架，每个挂架可挂载超级航母级别的战斗机\
  \ 8架 总计40架\n        -   次要系统: 2x “寂静”指向性介子脉冲波发射器\n        -   攻击射程: 180000 km (战机作战半径)\
  \ / 15000 km (脉冲波)\n    -   特殊系统:\n        -   名称: 自动化战术协调中枢\n        -   描述: 舰载的高级AI核心接管了95%的无人机指挥任务。指挥官只需要下达“攻击目标A”或“保护目标B”这样的宏观指令，剩下的战术机动、编队飞行和火力分配全由AI自动完成。\n\
  \        -   名称: 重型战体维护协议\n        -   描述: 尽管是巡洋舰体型，但其内部空间几乎完全被机库占据。它可以维护和补给通常只有航母才能搭载的重型战斗机（尺寸接近护卫舰）。注意：该舰没有生产能力，所有损耗的战机必须在空间站购买补充。\n\
  \    -   观星者需求: 极低。只需要最基础的神经接口连接以维持FTL。\n舰船单位模板:\n  舰船类型: TC\n  吨位: L\n  驾驶员: ''\n\
  \  是否旗舰: false\n  观星者接口角色: ''\n  跃迁充能: 0\n  最大充能: 4\n  跃迁消耗: 2\n  制造商: 银河防御联盟舰队管理中枢\
  \ (已灭绝)\n  描述: 舰载的高级AI核心接管了95%的无人机指挥任务。指挥官只需要下达“攻击目标A”或“保护目标B”这样的宏观指令，剩下的战术机动、编队飞行和火力分配全由AI自动完成。\n\
  \  炮位配置: 4M4S\n  装备槽位配置: 4H4L\n  船体护盾值: 1100\n  船体结构值: 1320\n  护盾值: 1100\n  结构值:\
  \ 1320\n  装配资源:\n    PG: 360\n    CPU: 720\n  效果:\n    船体加成:\n    - 依据舰级定位应用：自动化无人机巡洋舰\
  \ (特种巡洋舰) CA。\n    装配减免: []\n    内置电子系统:\n      基础CPU: 内置标准舰载CPU；跟踪与ECCM按电子战规则计算。\n\
  \      基础侦测器: 内置标准多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。\n  装备: {}\n\n</ship_def>"
