  制造商: 共和国太空军造船厂
  描述: 舰体粗犷而充满力量感，如同一头蓄势待发的钢铁巨龙。舰首是巨大的收束器和主武器发射口，舰身两侧布满了外露的散热管道和白色的装甲鳞片。舰体后部是四台巨大的高出力效率推进器，喷射着炽热的等离子体。整艘船没有丝毫多余的装饰，每一寸结构都在为最纯粹的破坏力服务。
  舰船单位模板:
