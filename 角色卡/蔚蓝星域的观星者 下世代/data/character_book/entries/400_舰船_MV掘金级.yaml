content: "<ship_def>\n舰船类型: MV\n舰种: 采矿驳船\n舰体类别: 常规型\n“别跟我谈什么地质勘探报告，我只看资产负债表。那块石头，要么变成信用点，要么就毫无价值。”——泰坦重工董事会会议纪要\n\
  -   级别: 掘金级 (Prospector-class)\n-   类型: 采矿驳船 MV\n-   价格: 12M\n-   形态: 舰体设计是辛迪加模块化哲学的极致体现。核心是一个细长的引擎与居住段，外部通过标准化的结构臂连接着多个巨大的、可替换的采矿模块和货柜。整艘船看起来像是一个拼凑起来的、但效率惊人的工业怪物。\n\
  -   制造商: 泰坦重工 (资源开采方案部)\n-   静态配置文件:\n    -   舰体全长: 1700米 (标准配置)\n    -   标准船员配置:\
  \ 12人\n    -   性能评级:\n        -   装甲: 11000\n        -   护盾: 11000\n        -  \
  \ 机动性: 15\n        -   火力输出: 50 (自卫无人机挂架为选装模块)\n    -   武器系统:\n        -   主要系统:\
  \ 2x MKII 多光谱共振破碎器\n        -   次要系统: 无 (可付费加装“黄蜂”武装无人机挂架)\n        -   攻击射程: 2.5\
  \ km (采矿设备有效范围)\n    -   特殊系统:\n        -   名称: “套利者”勘探扫描阵列\n        -   描述: “掘金”级可以选择安装一套先进的小行星成分扫描阵列。该系统能够快速分析目标小行星的矿物构成和纯度，并实时与星区市场价格进行比对，为操作员计算出开采该小行星的“预期投资回报率”。这使得辛迪加的矿业公司能够优先开采价值最高的矿脉，实现利润最大化。\n\
  \    -   观星者需求: 同样只需要基础型号的观星者。辛迪加是观星者二手市场的位置，大量从其他势力淘汰下来的老旧型号最终都会被安装在这些采矿驳船上，榨干她们最后的价值。\n\
  \n舰船单位模板:\n  舰船类型: MV\n  吨位: M\n  驾驶员: ''\n  是否旗舰: false\n  观星者接口角色: ''\n  跃迁充能:\
  \ 0\n  最大充能: 6\n  跃迁消耗: 1\n  炮位配置: 2M\n  装备槽位配置: 2H4L\n  船体护盾值: 240\n  船体结构值: 560\n\
  \  护盾值: 240\n  结构值: 560\n  装配资源:\n    PG: 180\n    CPU: 380\n  效果:\n    船体加成:\n\
  \    - 采矿模块开采效率 +20%\n    内置电子系统:\n      基础CPU: 内置民用舰载CPU。\n      基础侦测器: 内置矿物勘探扫描器。\n\
  \  装备: {}\n</ship_def>"
