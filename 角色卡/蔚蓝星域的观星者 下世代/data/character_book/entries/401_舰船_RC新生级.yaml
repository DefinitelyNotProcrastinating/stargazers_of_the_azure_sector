    制造商: 联邦航空航天局第91设计所
    描述: 舰体设计优雅而对称，呈流畅的飞翼构型，通体覆盖着联邦标志性的哑光白色纳米涂层。舰体上部是扁平的无人机机库，下部则集成了一组紧凑的护盾传输装置阵列，两者完美融合，体现了联邦在系统集成方面的高超技艺。
    炮位配置: 2S
    装备槽位配置: 5H3L
    船体护盾值: 1540
    船体结构值: 1100
    护盾值: 1540
    结构值: 1100
    装配资源:
      PG: 288
      CPU: 608
    效果:
      船体加成:
      - 特种巡洋舰；依据舰级定位应用：后勤巡洋舰 (高级巡洋舰)。
      装配减免: []
      内置电子系统:
        基础CPU: 内置特种巡洋舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置特种巡洋舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
      特殊系统:
      - 名称: “二元协同”后勤协议
        描述: “新生”级的核心优势在于其双重维修系统的协同运作能力。舰载服务器能够在观星者的辅助下，实时分析战场数据，自动为两个系统分配最优化的维修任务。例如，当一艘友舰同时受到结构和护盾损伤时，系统会自动派遣无人机修复更关键的装甲缺口，同时启动护盾传输装置为其补充能量，实现效率最大化。该系统还可以进入“专精模式”，将所有能源集中供应给其中一个系统，使其维修效率在短时间内提升30%。
    装备: {}
  </ship_def>
