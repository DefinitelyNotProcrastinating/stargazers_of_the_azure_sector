  级别: 新生级
  别名: Renewal-class
  舰船类型: RC
  舰种: 后勤巡洋舰 (高级巡洋舰)
  价格: 350M
  制造商: 联邦航空航天局第91设计所
  描述: 舰体设计优雅而对称，呈流畅的飞翼构型，通体覆盖着联邦标志性的哑光白色纳米涂层。舰体上部是扁平的无人机机库，下部则集成了一组紧凑的护盾传输装置阵列，两者完美融合，体现了联邦在系统集成方面的高超技艺。
  舰船单位模板:
    舰船类型: RC
    吨位: L
