content: "<ship_def>\n舰船类型: MV\n舰种: 采矿驳船\n舰体类别: 常规型\n“我们脚下的每一寸土地，都曾是冰冷的岩石。我们的每一次挥锤，都是在为子孙后代开辟家园。”——共和国拓荒者箴言\n\
  -   级别: 拓荒级 (Pioneer-class)\n-   类型: 采矿驳船 MV\n-   价格: 6M\n-   形态: 舰体方正而粗犷，充满了共和国式的实用主义。船体外壳覆盖着厚实的防辐射装甲板，外露的管道和维修接口随处可见。舰首的采矿装置被设计得异常坚固，能够处理最坚硬的金属小行星。舰体中部还设有一个小型的模块化接口，可以根据需要加装居住舱或防御炮塔。\n\
  -   制造商: 索鲁斯集团 (民用工程部)\n-   静态配置文件:\n    -   舰体全长: 1900米\n    -   标准船员配置: 30人\n\
  \    -   性能评级:\n        -   装甲: 18000\n        -   护盾: 15000\n        -   机动性: 12\n\
  \        -   火力输出: 150 (自卫火力)\n    -   武器系统:\n        -   主要系统: 2x MKIII 冲击式采矿激光器\n\
  \        -   次要系统: 4x “哨兵”双联装点防御机炮\n        -   攻击射程: 1.8 km (采矿设备有效范围)\n    - \
  \  特殊系统:\n        -   名称: 移动锚定结构\n        -   描述: “拓荒”级能够将其采矿臂深深地锚定在大型小行星上，形成一个极其稳定的作业平台。在锚定状态下，船体可以展开额外的太阳能帆板，大幅降低对反应堆的能源消耗，使其能够进行超长时间的持续作业。同时，这个稳定的平台也使其搭载的点防御炮塔拥有了更高的射击精度。\n\
  \    -   观星者需求: 对观星者的要求不高，但由于经常在偏远星系独立作业，共和国倾向于为这些驳船配备神经系统更稳定、能够长期承受孤独环境的观星者型号。\n\
  \n舰船单位模板:\n  舰船类型: MV\n  吨位: M\n  驾驶员: ''\n  是否旗舰: false\n  观星者接口角色: ''\n  跃迁充能:\
  \ 0\n  最大充能: 6\n  跃迁消耗: 1\n  炮位配置: 2M\n  装备槽位配置: 2H4L\n  船体护盾值: 240\n  船体结构值: 560\n\
  \  护盾值: 240\n  结构值: 560\n  装配资源:\n    PG: 190\n    CPU: 360\n  效果:\n    船体加成:\n\
  \    - 采矿模块开采效率 +15%\n    - 锚定状态下采矿模块持续作业能耗 -20%\n    内置电子系统:\n      基础CPU: 内置民用舰载CPU。\n\
  \      基础侦测器: 内置矿物勘探扫描器。\n  装备: {}\n</ship_def>"
