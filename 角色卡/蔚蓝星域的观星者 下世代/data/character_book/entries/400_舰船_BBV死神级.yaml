content: "<ship_def>\n级别: 死神级\n别名: Reaper-class\n舰船类型: BBV\n舰种: 航空战列舰 (高级战列舰)\n价格:\
  \ ''\n制造商: 奇戎基因 (特别项目部 - 定制)\n描述: 舰体设计充满了哥特式的、病态的美感。修长的舰身主体呈深邃的黑色，如同出鞘的利刃，上面用银线勾勒出复杂的、类似天使羽翼的纹路。舰体中部集成了两座战列舰级的主炮塔，后半段则是扁平化的、内置式的无人机机库。整艘船在“机动模式”下看起来像一艘放大了的突击巡洋舰，但在切换到“猎杀模式”时，舰体两侧会展开巨大的、如同骨翼般的散热器和能量传导矩阵，散发出不祥的血红色光芒。\n\
  舰船单位模板:\n  舰船类型: BBV\n  吨位: XL\n  驾驶员: ''\n  是否旗舰: false\n  观星者接口角色: ''\n  跃迁充能:\
  \ 0\n  最大充能: 4\n  跃迁消耗: 3\n  制造商: 奇戎基因 (特别项目部 - 定制)\n  描述: 舰体设计充满了哥特式的、病态的美感。修长的舰身主体呈深邃的黑色，如同出鞘的利刃，上面用银线勾勒出复杂的、类似天使羽翼的纹路。舰体中部集成了两座战列舰级的主炮塔，后半段则是扁平化的、内置式的无人机机库。整艘船在“机动模式”下看起来像一艘放大了的突击巡洋舰，但在切换到“猎杀模式”时，舰体两侧会展开巨大的、如同骨翼般的散热器和能量传导矩阵，散发出不祥的血红色光芒。\n\
  \  炮位配置: 2L4C\n  装备槽位配置: 7H5L\n  船体护盾值: 3920\n  船体结构值: 2800\n  护盾值: 3920\n  结构值:\
  \ 2800\n  装配资源:\n    PG: 1152\n    CPU: 2432\n  效果:\n    船体加成:\n    - 依据舰级定位应用：航空战列舰\
  \ (高级战列舰)。\n    装配减免: []\n    内置电子系统:\n      基础CPU: 内置主力舰级舰载CPU；跟踪与ECCM按电子战规则计算。\n\
  \      基础侦测器: 内置主力舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。\n    特殊系统:\n    - 名称: 双相作战协议\n\
  \      描述: '专为AA-014“米迦勒”的神经特性而设计的战术切换系统，允许她在两种截然不同的作战模式间切换。\\n**机动模式**: 将能源优先供应给引擎和跃迁核心，收回所有外部散热器，以巡洋舰级别的机动性进行长距离的追踪和索敌。\\\
  n**猎杀模式**: 展开散热骨翼，将反应堆的全部输出灌注到武器系统中。主炮充能速度提升50%，锁定精度提升30%，无人机AI的攻击性协议被解锁至最高级别。在此模式下，舰船的防御能力和机动性会大幅下降，完全依赖“米迦勒”精准的判断来规避伤害。'\n\
  \  装备: {}\n</ship_def>"
