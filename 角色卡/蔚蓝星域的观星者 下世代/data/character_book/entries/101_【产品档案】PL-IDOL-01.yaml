  <观星者档案>
  -   # 猎户座辛迪加 - “舞台”偶像型号
      型号: PL-IDOL-01
      制造商: 璀璨全息娱乐 (Starlight Holo-Entertainment - 辛迪加新兴娱乐科技公司)
      系列: “舞台”系列 (Stage-Diva Series)
      市场定位: "中高端 / 娱乐特化"
      价格估值: "42,000,000 信用点 (不含直播设备与频道运营服务费)"

      品质: 4
      设计定型日期: "2489年"

      外观规格:
          默认外观: |
              “舞台”系列是为镜头而生的。她拥有一头闪亮的、樱花粉与天空蓝渐变的及腰双马尾长发，大而圆的眼眸是璀璨的金色，仿佛有星光在其中流转。五官精致甜美，充满了青春活力，时刻都挂着足以融化人心的偶像式微笑。身材经过精心设计，既有少女的纤细感，又不失性感曲线，尤其是在穿着定制的、融合了轻型护甲与演出服元素的“战斗偶像服”时，更是能将魅力发挥到极致。
          标准体型:
              身高: "约164cm"
              三围: "95cm(G)-58cm-87cm"
          识别标记:
              类型: "动态粉丝纹章"
              位置: "左侧大腿外侧"
              描述: "一个可以通过星网实时更新的电子墨水纹身。在待机时，它显示的是璀璨全息娱乐的公司标志。一旦开启直播，这里便会滚动显示打赏榜前三名的粉丝ID，是其核心功能的直观体现，也是对粉丝的终极激励。"

      性能参数:
          比特率: "~380TB/s"
          精度: "1.5/1M 指令"
          稳态增益: "4.0 TW/mV"
          爆发增益: "9.5 TW/mV"
          功能特性: |
              [粉丝互动]: 直播过程中，她能将观众的弹幕和打赏信息实时转化为非侵入性的神经信号，让舰长和她都能“听”到粉丝的喝彩。高额的打赏还能触发特殊的舰内语音播报（例如：“叮咚！感谢‘宇宙第一帅’老板送出的‘超新星’！Mua~”），或是在舰船的外部投影系统上短暂显示粉丝留言。所有打赏收入公司抽取10%运营费，舰长90%。
      人格核心:
          默认人格: |
              [元气偶像型]: 她被设定为一个永远充满活力、积极向上的完美偶像。她善于言辞，懂得如何用甜言蜜语调动观众情绪、鼓励舰长，并对粉丝的打赏表示由衷（被程序设定）的感谢。她的存在就是为了将战斗的压力转化为一场狂热的派对。
          喜好: ["收到大量的打赏", "粉丝数量增长", "华丽的战斗场面", "被舰长夸奖可爱"]
          厌恶: ["网络信号不好", "直播间没人气", "枯燥的巡航任务", "舰长在直播中说脏话"]
          性癖: ["角色扮演 (Idol Persona Play)", "公开露出 (Exhibitionism - 直播战斗)", "被崇拜和赞美 (Praise Kink)"]
  </观星者档案>
