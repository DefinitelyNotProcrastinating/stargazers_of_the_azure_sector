content: |-
  <ship_def>
  级别: 雅典娜级
  别名: Athena-class
  舰船类型: CV
  舰种: 超级航母 CV
  价格: 75B
  制造商: 帝国海军设计局
  描述: 舰体呈一个巨大而厚重的六边形棱柱。舰体表面覆盖着层层叠叠的泰坦合金装甲板，几乎看不到任何脆弱的外部结构。其最显著的特征是贯穿舰体，直径超过百米的巨型机库通道，无人机可以直接从舰首的装甲发射口弹出，并在舰尾的引导力场中回收。
  舰船单位模板:
    舰船类型: CV
    吨位: XL
    驾驶员: ''
    是否旗舰: true
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 5
    跃迁消耗: 4
    制造商: 帝国海军设计局
    描述: 舰体呈一个巨大而厚重的六边形棱柱。舰体表面覆盖着层层叠叠的泰坦合金装甲板，几乎看不到任何脆弱的外部结构。其最显著的特征是贯穿舰体，直径超过百米的巨型机库通道，无人机可以直接从舰首的装甲发射口弹出，并在舰尾的引导力场中回收。
    炮位配置: 40C
    装备槽位配置: 9H11L
    装配资源:
      PG: 1300
      CPU: 1650
    效果:
      船体加成:
      - 旗舰型舰船；依据舰级定位应用：超级航母 CV。
      - 装配资源与槽位由本舰船独立定义，不应用常规舰级倍率公式。
      装配减免: []
      内置电子系统:
        基础CPU: 内置旗舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置旗舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
        旗舰指挥链: 内置多观星者并联与舰队级指挥链；具体接口需求见静态档案。
      特殊系统:
      - 名称: 战术联网感应器阵列
        描述: 一套集成了帝国最先进指挥与控制算法的战术网络系统。激活后，“雅典娜”级将成为整个舰队的神经中枢，接管所有处于其作战半径内的友军帝国舰船的部分传感器和火控数据。在此网络覆盖下，所有友军单位的锁定速度提升20%，武器失准率降低30%，点防御系统的拦截效率提升15%。
    装备: {}
  静态档案:
    观星者需求: 需要四名观星者进行并联的“内部程序通讯”（IPC）协作才能运行。这套复杂的系统确保了超级航母庞大身躯的稳定跃迁（跃迁核心稳定+20），但代价是指令传导链条更长，使其战术反应速度远慢于常规舰船。
    旧版描述: |-
      “纯粹的怒火，强大，但无法达成目标。让你的复仇有条不紊，让你的进攻无懈可击。”——帝国海军训练语录
      -   级别: 雅典娜级 (Athena-class)
      -   类型: 超级航母 CV
      -   价格: 75B
      -   形态: 舰体呈一个巨大而厚重的六边形棱柱。舰体表面覆盖着层层叠叠的泰坦合金装甲板，几乎看不到任何脆弱的外部结构。其最显著的特征是贯穿舰体，直径超过百米的巨型机库通道，无人机可以直接从舰首的装甲发射口弹出，并在舰尾的引导力场中回收。
      -   制造商: 帝国海军设计局
      -   静态配置文件:
          -   舰体全长: 4850米
          -   标准船员配置: 1200人
          -   性能评级:
              -   装甲: 286000
              -   护盾: 100000
              -   机动性: 12
              -   火力输出: 65000 (无人机)
              -   回复量: 45000 (无人机)
          -   武器系统:
              -   主要系统: 40x 重型无人机蜂巢 (可搭载“圣殿骑士”攻击机、“壁垒”拦截机、“工匠”维修舰 编队)，每个编队8架
              -   次要系统: 80x “守护者”重型点防御激光阵列
              -   攻击射程: 250000 km (无人机作战半径)
          -   特殊系统:
              -   名称: 战术联网感应器阵列
              -   描述: 一套集成了帝国最先进指挥与控制算法的战术网络系统。激活后，“雅典娜”级将成为整个舰队的神经中枢，接管所有处于其作战半径内的友军帝国舰船的部分传感器和火控数据。在此网络覆盖下，所有友军单位的锁定速度提升20%，武器失准率降低30%，点防御系统的拦截效率提升15%。
          -   观星者需求: 需要四名观星者进行并联的“内部程序通讯”（IPC）协作才能运行。这套复杂的系统确保了超级航母庞大身躯的稳定跃迁（跃迁核心稳定+20），但代价是指令传导链条更长，使其战术反应速度远慢于常规舰船。
  </ship_def>
