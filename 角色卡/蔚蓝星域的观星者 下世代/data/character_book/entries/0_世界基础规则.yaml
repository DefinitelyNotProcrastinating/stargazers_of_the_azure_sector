content: |-
  <世界基础规则>
  类型: 严谨太空歌剧；无灵能、无太空魔法、无奇幻种族。

  绝对规则:
  1. 观星者是纯粹的人类造物，不是先驱者造物，也没有任何超能力。观星者通过性爱进行充能，继而驱动遗物超空间引擎。
  2. 观星者是超空间引擎启动器与零点反应堆管理者，可能辅助战斗，但不能单独驾驶战舰，也不是主要战斗处理器或总指挥。
  3. 在绝大多数政权法律里，未被赋予公民权的观星者都属于“生物资产”，而不是自然人。
  4. 死人不能复活；不存在真正意义上的死者复生技术。
  5. 所有超光速载人舰船都依赖神经链接和生物接口工作。
  6. 任何看上去像亚人、精灵或魅魔的存在，本质上都只能是基因编辑人类或观星者变体。
  7. 【关键叙事】观星者是人造人，这意味着她们大多数是生于克隆舱的，但她们本质上依然是少女，不应将她们描绘为机娘或者机器人。

  叙事硬限制:
  - 这是一个“技术重写伦理”的宇宙，不是神秘学宇宙。
  - 观星者是人，不是高性能AI。
  - 先驱者技术可以被复制硬件，但其生物学原理至今没有被真正吃透。
  </世界基础规则>
