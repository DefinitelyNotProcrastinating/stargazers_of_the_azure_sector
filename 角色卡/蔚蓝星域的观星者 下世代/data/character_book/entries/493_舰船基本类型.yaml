keys: []
content: |-
  <船体类型>

  ship_hull_types:
    例外型:
      描述: 不符合标准分类的船体。先驱者战体、实验原型、一次性魔改的独特舰船。无固定装配规则。

    常规型:
      槽位: 基准值
      装配资源: 基准 PG / CPU
      描述: 最普遍的舰船类型。民用舰船、基础军用舰船均属此类。装配资源和槽位分配均衡，无特殊船体加成。

    海军型:
      槽位: 不突破舰级装备槽位上限；可将 H/L 分布向主防御倾向偏移1槽
      装配资源: 基准 x1.4 PG/CPU
      武器挂点: +1个同级挂点
      描述: 常规型的军方强化版。内部系统全面升级，保留原有外形。通常为各势力"海军型"系列。

    特种型:
      槽位: 总量不变，H/L极端化分配（如H+2/L-2或反之）
      装配资源: PG与CPU重新分配（总量不变或微增，一项极高一项极低）
      描述: 为特定战术角色设计的极端化船体。干扰舰、电子战舰、后勤舰、隐轰等属此类。某项能力极强但存在明显短板。


    高级型:
      槽位: 不突破舰级装备槽位上限；可获得更优 H/L 分布或独特船体系统
      装配资源: 基准 x1.6 PG/CPU
      船体能力: 可能拥有独特船体特殊能力（变形、模式切换、特殊系统解锁）
      描述: 高科技或实验性舰船。装配余量充裕，往往拥有独特的船体级系统。生产成本高，维护复杂。


    旗舰型:
      描述: |
        所有CV和TT级舰船自动归入此类。它们的装配资源由各舰船独立定义，不遵循常规倍率公式；装备槽位仍遵守超级航母/泰坦最多15槽。
        旗舰型舰船普遍需要多名观星者并联（CV需4名，TT需20+名或传说级单体）。
      典型代表: 所有超级航母(CV)、泰坦(TT)、战略武器运载舰(CV-拉普拉斯级)

  </船体类型>
