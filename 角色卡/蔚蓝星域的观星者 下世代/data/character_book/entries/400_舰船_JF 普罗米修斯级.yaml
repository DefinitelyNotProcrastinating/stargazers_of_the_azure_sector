content: "<ship_def>\n舰船类型: JF\n舰种: 战略隐形货舰\n舰体类别: 高级型\n-   级别: 普罗米修斯级\n-   类型: 战略隐形货舰\
  \ (超级货舰) JF\n-   价格: 35B (350亿 信用点)\n-   形态: 舰体设计极度扁平化，像是一只巨大的、被拉长的银色鳐鱼。表面覆盖着复杂的六边形热散逸瓦片，能在隐形模式下完美遮蔽引擎废热。舰体没有任何突出的舰桥结构，控制中枢位于深埋于装甲之下的全封闭舱室。其货舱并非传统的集装箱挂载点，而是三个内置的巨型反重力稳定舱，能够容纳体积惊人的货物而不影响舰体流线型。\n\
  -   制造商: 联邦联合物流系统 (Federated Logistics Systems)\n-   静态配置文件:\n    -   舰体全长: 3200米\n\
  \    -   标准船员配置: 120人 (高度自动化)\n    -   性能评级:\n        -   装甲: 102000\n        -\
  \   护盾: 5000\n        -   机动性: 15\n        -   火力输出: 0\n        -   货仓容量: 1,850,000\
  \ m³ (基础) / 2,200,000 m³ (扩展)\n    -   武器系统:\n        -   无。该舰船完全依赖隐形和护航生存。\n  \
  \  -   特殊系统:\n        -   名称: 超重型隐形装置\n        -   描述: 联邦隐形技术的工业级应用。该装置能够生成一个覆盖全舰的光学与电子伪装场，使这艘3公里长的巨舰在雷达上彻底消失。**限制**:\
  \ 由于能耗巨大且会干扰跃迁场稳定性，该装置无法在跃迁引擎启动时或跃迁过程中开启。这意味着它在进出星门或进行跃迁校准的几分钟内是最脆弱的。然而，一旦进入亚光速巡航，它就是不可捉摸的幽灵。\n\
  \    -   观星者需求: 增益需达到4TW/mV\n\n舰船单位模板:\n  舰船类型: JF\n  吨位: XL\n  驾驶员: ''\n  是否旗舰:\
  \ true\n  观星者接口角色: ''\n  跃迁充能: 0\n  最大充能: 4\n  跃迁消耗: 2\n  炮位配置: ''\n  装备槽位配置: 5H7L\n\
  \  船体护盾值: 3600\n  船体结构值: 8400\n  护盾值: 3600\n  结构值: 8400\n  装配资源:\n    PG: 960\n\
  \    CPU: 1250\n  效果:\n    船体加成:\n    - 基础货舱容量 1850000 m³\n    - 扩展货舱容量 2200000\
  \ m³\n    - 超重型隐形装置启用时无法启动跃迁引擎\n    内置电子系统:\n      基础CPU: 内置高级运输舰载CPU。\n      基础侦测器:\
  \ 内置低可视航行侦测器。\n  装备: {}\n</ship_def>"
