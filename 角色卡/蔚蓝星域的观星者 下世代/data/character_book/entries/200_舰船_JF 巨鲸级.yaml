content: |-
  <ship_def>
  舰船类型: JF
  舰种: 超级货舰
  舰体类别: 常规型
  “工业是贸易的基石。”——《星际航运导报》评测
  -   级别: 巨鲸级
  -   类型: 超级货舰 (Jumbo Freighter) - JF
  -   价格: 12B (120亿 信用点)
  -   形态: 舰体是一个长达6000米的矩形框架，内部密集堆叠着标准化的超巨型货柜。为了保护这些脆弱的货物，舰体外层覆盖着厚重的工业级复合装甲板，没有任何流线型设计，看起来就像一块漂浮在太空中的巨大金属砖块。舰桥位于舰体尾部的上方，极其微小，仿佛是大象背上的一只苍蝇。引擎喷口巨大而粗糙，喷射着浑浊的等离子流。
  -   制造商: 辛迪加联合政府造船厂 (重型工业运输部)
  -   静态配置文件:
      -   舰体全长: 6200米
      -   标准船员配置: 15人
      -   性能评级:
          -   装甲: 220000
          -   护盾: 500
          -   机动性: 5
          -   火力输出: 0
          -   运载能力: 2,500,000 m³ (常规货舱) + 500,000 m³ (舰队维护舱)
      -   武器系统:
          -   主要系统: 无
          -   次要系统: 无
          -   攻击射程: N/A
      -   特殊系统:
          -   名称: “求生者”紧急呼叫阵列
          -   描述: 辛迪加为了保护其资产而专门设计的超高功率通讯系统。该系统独立于舰船主能源，拥有自己的备用电池组。一旦激活，它会利用舰体巨大的结构作为天线，在全频段通过安赛波广播明文求救信号（SOS）。这种信号具有极强的穿透力和抗干扰性，普通的电子战干扰很难将其完全压制。这确保了即便在海盗的电子封锁下，也能将遇袭坐标发送给最近的企业安全部队（CSF）或保险公司。
      -   观星者需求: 只需要4TW/mV的稳态增益即可。

  舰船单位模板:
    舰船类型: JF
    吨位: XL
    驾驶员: ''
    是否旗舰: false
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 3
    跃迁消耗: 2
    炮位配置: ''
    装备槽位配置: 6H8L
    装配资源:
      PG: 600
      CPU: 760
    效果:
      船体加成:
      - 常规货舱容量 2500000 m³
      - 舰队维护舱容量 500000 m³
      内置电子系统:
        基础CPU: 内置民用运输舰载CPU。
        基础侦测器: 内置民用航行侦测器。
    装备: {}
  </ship_def>
