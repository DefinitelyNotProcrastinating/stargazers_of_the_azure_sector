content: "[\n  {\n    \"func_name\": \"clean_romanceable_roles\",\n    \"func_body\": \"if (!state.static['主角'] || !state.static['主角']['可攻略角色'] || typeof state.static['主角']['可攻略角色'] !== 'object') return;\\nfor (const [name, role] of Object.entries(state.static['主角']['可攻略角色'])) {\\n  if (!role || typeof role !== 'object' || !role['种族']) {\\n    delete state.static['主角']['可攻略角色'][name];\\n  }\\n}\",\n    \"periodic\": true,\n    \"order\": \"last\",\n    \"sequence\": 10,\n    \"func_params\": []\n  },\n  {\n    \"func_name\": \"clean_inventory\",\n    \"func_body\": \"if (!state.static['主角'] || !state.static['主角']['物品栏'] || typeof state.static['主角']['物品栏'] !== 'object') return;\\nfor (const [name, item] of Object.entries(state.static['主角']['物品栏'])) {\\n  if (!item || typeof item !== 'object' || (item['堆叠'] ?? 0) <= 0) {\\n    delete state.static['主角']['物品栏'][name];\\n  }\\n}\",\n    \"periodic\": true,\n    \"order\": \"last\",\n    \"sequence\": 20,\n    \"func_params\": []\n  },\n  {\n    \"func_name\": \"normalize_stargazer_lust\",\n    \"func_body\": \"if (!state.static['主角'] || !state.static['主角']['可攻略角色'] || typeof state.static['主角']['可攻略角色'] !== 'object') return;\\nfor (const role of Object.values(state.static['主角']['可攻略角色'])) {\\n  if (role && role['种族'] === '观星者' && typeof role['欲望'] === 'number' && role['欲望'] < 0) {\\n    role['欲望'] = 0;\\n  }\\n}\",\n    \"periodic\": true,\n    \"order\": \"last\",\n    \"sequence\": 30,\n    \"func_params\": []\n  },\n  {\n    \"func_name\": \"close_event\",\n    \"func_body\": \"const player = state.static && state.static['主角'];\\nconst runtime = player && player['_工业系统'];\\nconst events = runtime && runtime['事件'];\\nconst key = String(id ?? '');\\nif (!key || !events || typeof events !== 'object' || !events[key]) return;\\nconst event = events[key];\\nif (!Array.isArray(runtime['事件历史'])) runtime['事件历史'] = [];\\nruntime['事件历史'].push({ID: key, 类型: event['类型'], 目标: event['目标'], 结果: 'AI关闭', 时间: state.time || ''});\\nif (runtime['事件历史'].length > 20) runtime['事件历史'].splice(0, runtime['事件历史'].length - 20);\\ndelete events[key];\\nif (player['特殊事件'] && typeof player['特殊事件'] === 'object') delete player['特殊事件'][key];\\n\",\n    \"periodic\": false,\n    \"order\": \"normal\",\n    \"sequence\": 900,\n    \"func_params\": [\n      \"id\"\n    ]\n  },\n  {\n    \"func_name\": \"settle_industry\",\n    \"func_body\": \"const DAY_MS = 86400000;\\nconst EPS = 1e-9;\\nconst root = state.static || (state.static = {});\\nconst player = root['主角'];\\nif (!player || typeof player !== 'object') return;\\n\\nconst isObject = value => value && typeof value === 'object' && !Array.isArray(value);\\nconst finite = (value, fallback = 0) => {\\n  const number = Number(value);\\n  return Number.isFinite(number) ? number : fallback;\\n};\\nconst positive = value => Math.max(0, finite(value));\\nconst round = value => Math.abs(value) < EPS ? 0 : Number(value.toFixed(6));\\nconst hash = text => {\\n  let value = 2166136261;\\n  for (const char of String(text)) {\\n    value ^= char.charCodeAt(0);\\n    value = Math.imul(value, 16777619);\\n  }\\n  return value >>> 0;\\n};\\nconst random01 = seed => hash(seed) / 4294967296;\\nconst pickWeighted = (rows, seed) => {\\n  const usable = rows.filter(row => row && positive(row.weight) > EPS);\\n  const total = usable.reduce((sum, row) => sum + positive(row.weight), 0);\\n  if (!(total > EPS)) return null;\\n  let roll = random01(seed) * total;\\n  for (const row of usable) {\\n    roll -= positive(row.weight);\\n    if (roll < EPS) return row.value;\\n  }\\n  return usable[usable.length - 1].value;\\n};\\nconst sanitizeRates = (value, allowSupply) => {\\n  const result = {};\\n  if (!isObject(value)) return result;\\n  for (const key of Object.keys(value).sort()) {\\n    if (!allowSupply && key === '补给') continue;\\n    const amount = positive(value[key]);\\n    if (amount > EPS) result[key] = amount;\\n  }\\n  return result;\\n};\\nconst ensureObject = (owner, key) => {\\n  if (!isObject(owner[key])) owner[key] = {};\\n  return owner[key];\\n};\\n\\nconst runtime = ensureObject(player, '_工业系统');\\nruntime['版本'] = 2;\\nruntime['事件计数器'] = Math.max(0, Math.floor(finite(runtime['事件计数器'])));\\nruntime['轮次计数器'] = Math.max(0, Math.floor(finite(runtime['轮次计数器'])));\\nconst events = ensureObject(runtime, '事件');\\nif (!Array.isArray(runtime['事件历史'])) runtime['事件历史'] = [];\\n\\nconst getResource = name => {\\n  if (name === '信用点') return positive(player['信用点']);\\n  const stock = ensureObject(player, '库存');\\n  if (['矿物', '食物', '金属', '补给'].includes(name) || Object.prototype.hasOwnProperty.call(stock, name)) {\\n    return positive(stock[name]);\\n  }\\n  const item = ensureObject(player, '物品栏')[name];\\n  return isObject(item) ? positive(item['堆叠']) : 0;\\n};\\nconst setResource = (name, value) => {\\n  const amount = round(Math.max(0, value));\\n  if (name === '信用点') {\\n    player['信用点'] = amount;\\n    return;\\n  }\\n  const stock = ensureObject(player, '库存');\\n  if (['矿物', '食物', '金属', '补给'].includes(name) || Object.prototype.hasOwnProperty.call(stock, name)) {\\n    stock[name] = amount;\\n    return;\\n  }\\n  const inventory = ensureObject(player, '物品栏');\\n  if (amount <= EPS) {\\n    if (isObject(inventory[name])) delete inventory[name];\\n    return;\\n  }\\n  if (!isObject(inventory[name])) inventory[name] = {'品质': 1, '堆叠': 0, '效果': {}, '描述': '工业生产物'};\\n  inventory[name]['堆叠'] = amount;\\n};\\n\\nconst buildings = isObject(player['建筑']) ? player['建筑'] : {};\\nconst ships = isObject(player['舰船']) ? player['舰船'] : {};\\nconst buildingBlocked = name => Object.values(events).some(event =>\\n  isObject(event) && event['目标'] === name && ['缺货', '入侵'].includes(event['类型']) &&\\n  !['已关闭', '已失效'].includes(event['阶段'])\\n);\\nconst productionMultiplier = name => {\\n  const loss = isObject(runtime['永久修正']) ? finite(runtime['永久修正'][name], 1) : 1;\\n  return Math.max(0, Math.min(1, loss));\\n};\\nconst collectNodes = () => {\\n  const rows = [];\\n  for (const name of Object.keys(buildings).sort()) {\\n    const asset = buildings[name];\\n    if (!isObject(asset) || asset['状态'] !== '运行') continue;\\n    const input = sanitizeRates(asset['输入'], true);\\n    if (buildingBlocked(name) && Object.keys(input).length) continue;\\n    rows.push({kind: '建筑', name, input, output: sanitizeRates(asset['输出'], true), multiplier: productionMultiplier(name)});\\n  }\\n  for (const name of Object.keys(ships).sort()) {\\n    const asset = ships[name];\\n    if (!isObject(asset) || (asset['状态'] && !['运行', '现役', '可用'].includes(asset['状态']))) continue;\\n    rows.push({kind: '舰船', name, input: sanitizeRates(asset['输入'], false), output: sanitizeRates(asset['输出'], false), multiplier: 1});\\n  }\\n  return rows.filter(row => Object.keys(row.input).length || Object.keys(row.output).length);\\n};\\nconst settleOneDay = () => {\\n  const rows = collectNodes();\\n  const resources = [...new Set(rows.flatMap(row => [...Object.keys(row.input), ...Object.keys(row.output)]))].sort();\\n  const opening = Object.fromEntries(resources.map(name => [name, getResource(name)]));\\n  const allocations = new Map(rows.map(row => [row, {}]));\\n  for (const resource of resources) {\\n    let remaining = opening[resource];\\n    let active = rows.filter(row => positive(row.input[resource]) > EPS);\\n    while (remaining > EPS && active.length) {\\n      const share = remaining / active.length;\\n      let distributed = 0;\\n      const next = [];\\n      for (const row of active) {\\n        const got = positive(allocations.get(row)[resource]);\\n        const unmet = positive(row.input[resource]) - got;\\n        const grant = Math.min(unmet, share);\\n        allocations.get(row)[resource] = got + grant;\\n        distributed += grant;\\n        if (unmet - grant > EPS) next.push(row);\\n      }\\n      if (!(distributed > EPS)) break;\\n      remaining -= distributed;\\n      active = next;\\n    }\\n  }\\n  const consumed = Object.fromEntries(resources.map(name => [name, 0]));\\n  const produced = Object.fromEntries(resources.map(name => [name, 0]));\\n  for (const row of rows) {\\n    let ratio = 1;\\n    for (const [resource, demand] of Object.entries(row.input)) {\\n      if (demand > EPS) ratio = Math.min(ratio, positive(allocations.get(row)[resource]) / demand);\\n    }\\n    ratio = Math.max(0, Math.min(1, ratio));\\n    for (const [resource, demand] of Object.entries(row.input)) consumed[resource] += demand * ratio;\\n    for (const [resource, amount] of Object.entries(row.output)) produced[resource] += amount * ratio * row.multiplier;\\n  }\\n  for (const resource of resources) setResource(resource, opening[resource] - consumed[resource] + produced[resource]);\\n};\\n\\nconst endMs = Date.parse(state.time);\\nif (Number.isFinite(endMs)) {\\n  let cursorMs = Date.parse(runtime['最后结算时间']);\\n  if (!Number.isFinite(cursorMs) || cursorMs > endMs) cursorMs = endMs - positive(state.dtime);\\n  const days = Math.max(0, Math.floor((endMs - cursorMs) / DAY_MS));\\n  for (let day = 0; day < days; day += 1) settleOneDay();\\n  runtime['最后结算时间'] = new Date(cursorMs + days * DAY_MS).toISOString();\\n}\\n\\nconst archiveEvent = (id, event, reason) => {\\n  runtime['事件历史'].push({ID: id, 类型: event['类型'], 目标: event['目标'], 结果: reason, 时间: state.time || ''});\\n  if (runtime['事件历史'].length > 20) runtime['事件历史'].splice(0, runtime['事件历史'].length - 20);\\n  delete events[id];\\n};\\nconst setBuildingState = (name, value) => {\\n  if (isObject(buildings[name])) buildings[name]['状态'] = value;\\n};\\nconst advanceEvent = (id, event) => {\\n  if (!isObject(event) || !Number.isFinite(endMs)) return;\\n  const autoCloseMs = Date.parse(event['自动关闭时间']);\\n  if (Number.isFinite(autoCloseMs) && endMs >= autoCloseMs) {\\n    archiveEvent(id, event, '自然结束');\\n    return;\\n  }\\n  let guard = 0;\\n  while (guard++ < 8) {\\n    const nextMs = Date.parse(event['下一阶段时间']);\\n    if (!Number.isFinite(nextMs) || endMs < nextMs) break;\\n    const type = event['类型'];\\n    const phase = event['阶段'];\\n    if (type === '入侵' && phase === '预警') {\\n      event['阶段'] = '准备中';\\n      event['下一阶段时间'] = new Date(nextMs + positive(event['准备天数']) * DAY_MS).toISOString();\\n    } else if (type === '入侵' && phase === '准备中') {\\n      event['阶段'] = '航行中';\\n      event['下一阶段时间'] = new Date(nextMs + positive(event['航行天数']) * DAY_MS).toISOString();\\n    } else if (type === '入侵' && phase === '航行中') {\\n      const defense = Math.max(0, Math.min(100, finite(buildings[event['目标']]?.['防御指数'])));\\n      const captured = random01(id + '|结果') < Math.max(0.15, 0.65 - defense / 200);\\n      setBuildingState(event['目标'], captured ? '被接管' : '损毁');\\n      event['阶段'] = captured ? '入侵成功：已被接管' : '入侵成功：已损毁';\\n      event['结果已应用'] = true;\\n      event['下一阶段时间'] = null;\\n    } else if (type === '破坏' && phase === '潜入中') {\\n      const modifiers = ensureObject(runtime, '永久修正');\\n      modifiers[event['目标']] = round(Math.max(0.25, finite(modifiers[event['目标']], 1) * finite(event['产能倍率'], 0.85)));\\n      event['阶段'] = '破坏成功：产能永久受损';\\n      event['结果已应用'] = true;\\n      event['下一阶段时间'] = null;\\n    } else if (type === '掠夺' && phase === '逼近中') {\\n      const resource = event['资源'] || '信用点';\\n      setResource(resource, getResource(resource) - positive(event['数量']));\\n      event['阶段'] = '掠夺成功：资源已支付';\\n      event['结果已应用'] = true;\\n      event['下一阶段时间'] = null;\\n    } else break;\\n  }\\n};\\nfor (const id of Object.keys(events).sort()) if (events[id]) advanceEvent(id, events[id]);\\n\\nconst MAP = {\\n  '太阳禁卫区':[230,205], '共和国之心':[600,250], '天鹅座摇篮':[300,450], '贸易风走廊':[550,450],\\n  '巨蛇之喉':[300,700], '避难所星团':[350,700], '卡戎之渡':[300,680], '幽灵之幕':[900,750],\\n  '新应许之地':[800,250], '黄金阶梯':[950,350], '静谧之海':[1000,150], '钴蓝边境':[978,672],\\n  '暗红星座':[998,750], '璨辉星座':[968,700], '暗色星座':[100,850], '塔伯里斯星座':[1200,1000]\\n};\\nconst HOMES = {'泰拉帝国':'太阳禁卫区','自由世界共和国':'共和国之心','天鹅座技术联邦':'天鹅座摇篮','猎户座辛迪加':'贸易风走廊','星火姐妹会':'避难所星团','铁血盟约':'巨蛇之喉','人类技术联合':'幽灵之幕'};\\nconst nodeForLocation = location => Object.keys(MAP).find(name => String(location || '').includes(name));\\nconst travelDays = (faction, location, seed) => {\\n  const from = MAP[HOMES[faction]];\\n  const to = MAP[nodeForLocation(location)];\\n  if (!from || !to) return 2 + Math.floor(random01(seed) * 6);\\n  return Math.max(1, Math.ceil(Math.hypot(from[0] - to[0], from[1] - to[1]) / 250));\\n};\\n\\nconst eligibleBuildings = Object.keys(buildings).sort().filter(name => {\\n  const asset = buildings[name];\\n  return isObject(asset) && !['损毁', '被接管', '封存'].includes(asset['状态']);\\n});\\nconst dtime = positive(state.dtime);\\nif (Number.isFinite(endMs) && dtime > 0 && eligibleBuildings.length) {\\n  runtime['轮次计数器'] += 1;\\n  const roundNo = runtime['轮次计数器'];\\n  const seed = `${state.time}|事件轮次|${roundNo}`;\\n  const activeCount = Object.keys(events).length;\\n  const elapsedDays = Math.max(1, Math.floor(dtime / DAY_MS));\\n  const chance = Math.min(0.18, 0.035 * Math.sqrt(elapsedDays)) * Math.pow(0.65, activeCount);\\n  if (random01(seed) < chance) {\\n    const target = pickWeighted(eligibleBuildings.map(name => {\\n      const asset = buildings[name];\\n      const security = Math.max(-1000, Math.min(100, finite(asset['安等'], finite(player['所处位置安全等级']))));\\n      const defense = Math.max(0, Math.min(100, finite(asset['防御指数'])));\\n      return {value: name, weight: 1 + Math.max(0, 50 - security) / 25 + Math.max(0, 60 - defense) / 40};\\n    }), seed + '|目标');\\n    const reputations = isObject(root['势力声望']) ? root['势力声望'] : (isObject(player['势力声望']) ? player['势力声望'] : {});\\n    const factionRows = Object.keys(HOMES).sort().map(name => ({value: name, weight: 1 + Math.max(0, -finite(reputations[name]))}));\\n    const faction = pickWeighted(factionRows, seed + '|势力') || '边境掠夺者';\\n    const hostility = Math.max(0, -finite(reputations[faction]));\\n    const defense = Math.max(0, Math.min(100, finite(buildings[target]?.['防御指数'])));\\n    const invasionAllowed = defense < Math.min(100, 35 + hostility * 0.65);\\n    const researchLike = /(科研|研究|实验)/.test(`${buildings[target]?.['类型'] || ''}${buildings[target]?.['描述'] || ''}`);\\n    const type = pickWeighted([\\n      {value: '入侵', weight: invasionAllowed ? 1 + hostility / 20 : 0},\\n      {value: '破坏', weight: 1 + hostility / 35},\\n      {value: '掠夺', weight: 1.2 + hostility / 45},\\n      {value: '缺货', weight: 2.5},\\n      {value: '研究突破', weight: researchLike ? 2.5 : 0.4},\\n      {value: '机遇', weight: 3}\\n    ], seed + '|类型');\\n    runtime['事件计数器'] += 1;\\n    const id = `${target}${type}事件${runtime['事件计数器']}`;\\n    const event = {ID: id, 类型: type, 目标: target, 势力: faction, 创建时间: state.time, 结果已应用: false};\\n    if (type === '入侵') {\\n      event['阶段'] = '预警'; event['关闭策略'] = '手动';\\n      event['准备天数'] = 2 + Math.floor(random01(seed + '|准备') * 4);\\n      event['航行天数'] = travelDays(faction, buildings[target]?.['位置'], seed + '|航行');\\n      event['下一阶段时间'] = new Date(endMs + DAY_MS).toISOString();\\n    } else if (type === '破坏') {\\n      event['阶段'] = '潜入中'; event['关闭策略'] = '手动'; event['产能倍率'] = 0.8;\\n      event['下一阶段时间'] = new Date(endMs + (2 + Math.floor(random01(seed + '|破坏') * 4)) * DAY_MS).toISOString();\\n    } else if (type === '掠夺') {\\n      event['阶段'] = '逼近中'; event['关闭策略'] = '手动'; event['资源'] = '信用点'; event['数量'] = 100 + Math.floor(random01(seed + '|数量') * 900);\\n      event['下一阶段时间'] = new Date(endMs + travelDays(faction, buildings[target]?.['位置'], seed + '|掠夺') * DAY_MS).toISOString();\\n    } else {\\n      const duration = 2 + Math.floor(random01(seed + '|持续') * 6);\\n      event['阶段'] = type === '研究突破' ? '效率提升中' : (type === '缺货' ? '供应中断' : '等待把握');\\n      event['关闭策略'] = '自动'; event['自动关闭时间'] = new Date(endMs + duration * DAY_MS).toISOString();\\n      if (type === '研究突破') event['研究效率倍率'] = 1.5;\\n    }\\n    events[id] = event;\\n  }\\n}\\n\\nplayer['工业资产简表'] = {};\\nfor (const name of Object.keys(buildings).sort()) {\\n  const asset = buildings[name];\\n  if (!isObject(asset)) continue;\\n  player['工业资产简表'][name] = {类型: asset['类型'] || '建筑', 位置: asset['位置'] || '', 状态: asset['状态'] || '', 描述: asset['描述'] || ''};\\n}\\nplayer['特殊事件'] = Object.fromEntries(Object.keys(events).sort().map(id => {\\n  const event = events[id];\\n  const summary = {ID: id, 类型: event['类型'], 目标: event['目标'], 势力: event['势力'], 阶段: event['阶段'], 下一阶段时间: event['下一阶段时间'] || null, 自动关闭时间: event['自动关闭时间'] || null};\\n  return [id, summary];\\n}));\\nconst breakthroughs = Object.values(events).filter(event => isObject(event) && event['类型'] === '研究突破');\\nplayer['科研进展'] = {\\\"全局效率倍率\\\": round(breakthroughs.reduce((value, event) => value * finite(event['研究效率倍率'], 1), 1)), \\\"活跃突破\\\": breakthroughs.map(event => event.ID)};\\n\",\n    \"periodic\": true,\n    \"order\": \"last\",\n    \"sequence\": 1000,\n    \"func_params\": []\n  }\n]"
