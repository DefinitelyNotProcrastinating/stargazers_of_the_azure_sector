content: |-
  [
    {
      "func_name": "clean_romanceable_roles",
      "func_body": "if (!state.static['主角'] || !state.static['主角']['可攻略角色'] || typeof state.static['主角']['可攻略角色'] !== 'object') return;\nfor (const [name, role] of Object.entries(state.static['主角']['可攻略角色'])) {\n  if (!role || typeof role !== 'object' || !role['种族']) {\n    delete state.static['主角']['可攻略角色'][name];\n  }\n}",
      "periodic": true,
      "order": "last",
      "sequence": 10,
      "func_params": []
    },
    {
      "func_name": "clean_inventory",
      "func_body": "if (!state.static['主角'] || !state.static['主角']['物品栏'] || typeof state.static['主角']['物品栏'] !== 'object') return;\nfor (const [name, item] of Object.entries(state.static['主角']['物品栏'])) {\n  if (!item || typeof item !== 'object' || (item['堆叠'] ?? 0) <= 0) {\n    delete state.static['主角']['物品栏'][name];\n  }\n}",
      "periodic": true,
      "order": "last",
      "sequence": 20,
      "func_params": []
    },
    {
      "func_name": "normalize_stargazer_lust",
      "func_body": "if (!state.static['主角'] || !state.static['主角']['可攻略角色'] || typeof state.static['主角']['可攻略角色'] !== 'object') return;\nfor (const role of Object.values(state.static['主角']['可攻略角色'])) {\n  if (role && role['种族'] === '观星者' && typeof role['欲望'] === 'number' && role['欲望'] < 0) {\n    role['欲望'] = 0;\n  }\n}",
      "periodic": true,
      "order": "last",
      "sequence": 30,
      "func_params": []
    },
    {
      "func_name": "resupply",
      "func_body": "const resources = ['信用点', '矿物', '食物', '金属', '补给'];\nif (!resources.includes(resource)) return;\nconst delta = Number(amount);\nif (!Number.isFinite(delta) || delta === 0) return;\nconst player = state.static && state.static['主角'];\nif (!player || typeof player !== 'object') return;\nif (!player['库存'] || typeof player['库存'] !== 'object' || Array.isArray(player['库存'])) player['库存'] = {};\nconst current = resource === '信用点' ? Number(player['信用点']) : Number(player['库存'][resource]);\nconst next = Math.max(0, (Number.isFinite(current) ? current : 0) + delta);\nconst rounded = Math.abs(next) < 1e-9 ? 0 : Number(next.toFixed(6));\nif (resource === '信用点') player['信用点'] = rounded;\nelse player['库存'][resource] = rounded;",
      "periodic": false,
      "order": "normal",
      "sequence": 900,
      "func_params": [
        "resource",
        "amount"
      ]
    },
    {
      "func_name": "settle_industry",
      "func_body": "const DAY_MS = 86400000;\nconst EPS = 1e-9;\nconst resources = ['信用点', '矿物', '食物', '金属', '补给'];\nconst player = state.static && state.static['主角'];\nif (!player || typeof player !== 'object') return;\nconst endMs = Date.parse(state.time);\nconst dtimeMs = Number(state.dtime);\nif (!Number.isFinite(endMs) || !Number.isFinite(dtimeMs) || dtimeMs <= 0) return;\nlet startMs = endMs - dtimeMs;\nconst cursorMs = Date.parse(player['_工业最后结算时间']);\nif (Number.isFinite(cursorMs)) {\n  if (cursorMs >= endMs) return;\n  startMs = Math.max(startMs, cursorMs);\n}\nif (!(endMs > startMs)) return;\nif (!player['库存'] || typeof player['库存'] !== 'object' || Array.isArray(player['库存'])) player['库存'] = {};\nconst finiteNonNegative = value => {\n  const number = Number(value);\n  return Number.isFinite(number) && number > 0 ? number : 0;\n};\nconst round = value => Math.abs(value) < EPS ? 0 : Number(value.toFixed(6));\nconst readResource = resource => resource === '信用点'\n  ? finiteNonNegative(player['信用点'])\n  : finiteNonNegative(player['库存'][resource]);\nconst writeResource = (resource, value) => {\n  const normalized = round(Math.max(0, value));\n  if (resource === '信用点') player['信用点'] = normalized;\n  else player['库存'][resource] = normalized;\n};\nconst opening = Object.fromEntries(resources.map(resource => [resource, readResource(resource)]));\nconst buildings = player['建筑'] && typeof player['建筑'] === 'object' && !Array.isArray(player['建筑'])\n  ? player['建筑']\n  : {};\nconst rows = [];\nfor (const name of Object.keys(buildings).sort()) {\n  const building = buildings[name];\n  if (!building || typeof building !== 'object' || building['状态'] !== '运行') continue;\n  const deployedMs = Date.parse(building['部署日']);\n  if (!Number.isFinite(deployedMs)) continue;\n  const activeStartMs = Math.max(startMs, deployedMs);\n  if (!(endMs > activeStartMs)) continue;\n  const days = (endMs - activeStartMs) / DAY_MS;\n  const rawStack = building['堆叠'] === undefined ? 1 : Number(building['堆叠']);\n  const stack = Number.isFinite(rawStack) ? Math.max(0, rawStack) : 0;\n  if (!(stack > EPS)) continue;\n  const maintenance = building['每日维护'] && typeof building['每日维护'] === 'object' ? building['每日维护'] : {};\n  const input = building['每日输入'] && typeof building['每日输入'] === 'object' ? building['每日输入'] : {};\n  const output = building['每日输出'] && typeof building['每日输出'] === 'object' ? building['每日输出'] : {};\n  const demand = {};\n  const production = {};\n  for (const resource of resources) {\n    demand[resource] = (finiteNonNegative(maintenance[resource]) + finiteNonNegative(input[resource])) * days * stack;\n    production[resource] = finiteNonNegative(output[resource]) * days * stack;\n  }\n  rows.push({ name, weight: stack, demand, production, allocation: Object.fromEntries(resources.map(resource => [resource, 0])) });\n}\nfor (const resource of resources) {\n  let remaining = opening[resource];\n  let active = rows.filter(row => row.demand[resource] > EPS);\n  while (remaining > EPS && active.length > 0) {\n    const totalWeight = active.reduce((sum, row) => sum + row.weight, 0);\n    if (!(totalWeight > EPS)) break;\n    const sharePerBuilding = remaining / totalWeight;\n    let distributed = 0;\n    const nextActive = [];\n    for (const row of active) {\n      const unmet = row.demand[resource] - row.allocation[resource];\n      const granted = Math.min(unmet, sharePerBuilding * row.weight);\n      row.allocation[resource] += granted;\n      distributed += granted;\n      if (unmet - granted > EPS) nextActive.push(row);\n    }\n    if (!(distributed > EPS)) break;\n    remaining -= distributed;\n    active = nextActive;\n  }\n}\nconst consumed = Object.fromEntries(resources.map(resource => [resource, 0]));\nconst produced = Object.fromEntries(resources.map(resource => [resource, 0]));\nfor (const row of rows) {\n  let ratio = 1;\n  let hasDemand = false;\n  for (const resource of resources) {\n    const demand = row.demand[resource];\n    if (demand > EPS) {\n      hasDemand = true;\n      ratio = Math.min(ratio, row.allocation[resource] / demand);\n    }\n  }\n  ratio = hasDemand ? Math.max(0, Math.min(1, ratio)) : 1;\n  if (!(ratio > EPS)) continue;\n  for (const resource of resources) {\n    consumed[resource] += row.demand[resource] * ratio;\n    produced[resource] += row.production[resource] * ratio;\n  }\n}\nfor (const resource of resources) {\n  writeResource(resource, opening[resource] - consumed[resource] + produced[resource]);\n}\nplayer['_工业最后结算时间'] = state.time;",
      "periodic": true,
      "order": "last",
      "sequence": 1000,
      "func_params": []
    }
  ]
