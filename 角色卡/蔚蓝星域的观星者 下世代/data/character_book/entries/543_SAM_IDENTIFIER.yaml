      "func_body": "if (!state.static['主角'] || !state.static['主角']['可攻略角色'] || typeof state.static['主角']['可攻略角色'] !== 'object') return;\nfor (const [name, role] of Object.entries(state.static['主角']['可攻略角色'])) {\n  if (!role || typeof role !== 'object' || !role['种族']) {\n    delete state.static['主角']['可攻略角色'][name];\n  }\n}",
