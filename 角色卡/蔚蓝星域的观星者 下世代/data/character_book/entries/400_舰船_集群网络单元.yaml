keys:
- 网络单元
- 集群网络单元
content: |-
  <ship_def>
  级别: 网络单元
  文明: 漂泊集群
  舰船类型: CV
  舰种: 超级航母
  舰体全长: 7800米
  船体类型: 旗舰型
  原生标准船员: 0
  形态: 多层分离环架组成开放船坞，中央是大型超空间与通讯核心，舰船可停靠在环架之间；晚期兼容型在内部增加隔离的联盟乘员区。
  定位: 超级航母、移动维护枢纽与共同超空间平台；主要价值在于维护和携带友军，舰载机群规模与节点单元相同。
  分布: 外环集群原生遗迹；完整网络单元尚未重新进入蔚蓝星区。
  驾驶限制: 原生版本无人，内部没有可用乘员空间，原生传送会杀死生物乘客。
  观星者需求: 原生无人版本无需观星者；不能将人类观星者直接接入其原生传送系统。
  超空间说明: 缓存、短距传送、节点减耗和稳定性规则见漂泊集群触发区。模板保存基础消耗，动态支援不得永久改写船体白值。
  参考满编火力每dt: 55000
  火力说明: 仅为全部默认武器可同时攻击时的未命中/防御结算前合计，不能作为额外武器重复造成伤害；机群伤害另受减员与接敌限制。
  舰船单位模板:
    文明: 漂泊集群
    舰船类型: CV
    每日补给消耗: 100
    吨位: T
    驾驶员: ''
    是否旗舰: true
    观星者接口角色: ''
    超空间充能: 0
    最大充能: 5
    超空间消耗: 4
    制造商: 漂泊集群标准化工业平台
    描述: 超级航母、移动维护枢纽与共同超空间平台；主要价值在于维护和携带友军，舰载机群规模与节点单元相同。
    炮位配置: 2XL2C
    装备槽位配置: 9H6L
    船体护盾值: 600000
    船体结构值: 120000
    护盾值: 600000
    结构值: 120000
    护盾DR: 55%
    结构DR: 20%
    护盾装甲: 200
    结构装甲: 260
    装配资源:
      PG: 6300
      CPU: 6000
    效果:
      船体加成:
      - 原生无人战体；最终白值按本档案读取，不重复乘人类品质或国家倍率。
      - 两条血条：护盾与结构；H/L槽数按现行舰级上限。
      装配减免: []
      内部结构:
        光子凝聚器: 完好
      内置电子系统:
        电子品质: 12
        内置跟踪: 48
        内置ECCM: 16
        侦测值: 32
        侦测距离km: 650000
        叠加规则: 内置跟踪已包含CPU和侦测器，不重复计算；外装模块另计。
      机动评级: 40
      闪避值: 7
      超空间核心稳定强度: 1
      原生超空间准备时间秒: 20
      特殊系统:
        原生高抗性护盾: 护盾DR55%为已含船体特性的基础值；装备叠加后最终DR仍不得超过80%。
        共同超空间网络范围: 500000km
        共享超空间稳定性: 共享有效余量max(S_i-D_i)；至少一个在线个体余量>0即可携带所有容量内在线友军，无须各被携带舰分别突破扰断。
        外部携带容量: 最多64艘且吨位权重总和<=128，S1/M2/L4/XL8/T32。
        共同超空间准备时间秒: 60
        共同超空间消耗: 仅网络单元一次有效消耗；其他舰不扣充能；有效节点同行时为3点。
        现场维护: 1次行动、100000km内最多4艘、每舰最大结构2%及最大护盾5%、消耗1份1m³集群维修料包；料舱100份。
        行动互斥: 维护、主动攻击与超空间占同一行动；完整范围、载人安全与时序见集群触发区。
      维修料舱:
        集群维修料包容量: 100
        初始化库存: 0
        说明: 实际数量记在舰船物品栏，新发现残骸不得默认附带100份补给。
    装备:
      旗舰光粒_1:
        品质: 12
        效果:
          伤害: 15000
          冷却: 1dt
          基础命中: 4
          跟踪: 0.003
          稳定射程: 160000km
          AP: 0%
          DRP: 0%
          衰竭: 稳定射程外伤害0；射程内不散射
          结算: 最终原生白值，不再乘品质倍率
        安装限定:
          船体文明: 漂泊集群
          所需内部结构:
          - 光子凝聚器
        装配要求: PG：260 | CPU：220 | 吨位：XL | 炮位：1XL | 装备槽位：无
        描述: 集群原生光粒发射器；只能安装在保有完好内部光子凝聚器的集群舰船上，不能跨文明移植。
      旗舰光粒_2:
        品质: 12
        效果:
          伤害: 15000
          冷却: 1dt
          基础命中: 4
          跟踪: 0.003
          稳定射程: 160000km
          AP: 0%
          DRP: 0%
          衰竭: 稳定射程外伤害0；射程内不散射
          结算: 最终原生白值，不再乘品质倍率
        安装限定:
          船体文明: 漂泊集群
          所需内部结构:
          - 光子凝聚器
        装配要求: PG：260 | CPU：220 | 吨位：XL | 炮位：1XL | 装备槽位：无
        描述: 集群原生光粒发射器；只能安装在保有完好内部光子凝聚器的集群舰船上，不能跨文明移植。
      集群战斗机中队_1:
        品质: 12
        效果:
          伤害: 9000
          冷却: 1dt
          跟踪: 0.04
          作战半径: 180000km
          编制: 40
          当前架数: 40
          可被点防御: true
          AP: 0%
          DRP: 0%
          机载光粒稳定射程: 6000km
          结算: 满编每1dt总伤害，减员乘当前架数/40；最终原生白值，不再乘品质倍率
        安装限定:
          船体文明: 漂泊集群
          所需内部结构:
          - 光子凝聚器
        装配要求: PG：175 | CPU：325 | 吨位：C | 炮位：1C | 装备槽位：无
        描述: 40架集群无人战斗机，以机载光粒承担制空、拦截与护航。
      集群轰炸机中队_2:
        品质: 12
        效果:
          伤害: 16000
          冷却: 1dt
          跟踪: 0.018
          作战半径: 220000km
          编制: 40
          当前架数: 40
          可被点防御: true
          AP: 0%
          DRP: 0%
          机载光粒稳定射程: 6000km
          结算: 满编每1dt总伤害，减员乘当前架数/40；最终原生白值，不再乘品质倍率
        安装限定:
          船体文明: 漂泊集群
          所需内部结构:
          - 光子凝聚器
        装配要求: PG：240 | CPU：380 | 吨位：C | 炮位：1C | 装备槽位：无
        描述: 40架集群无人轰炸机，以重型光粒攻击大型舰船与固定设施。
  设计变体:
    早期原生型: 无先驱者FTL适应接口，仅可进行无人传送。
    晚期联盟兼容型: 可保留机械指挥核心并支持有人舰船；配备先驱者FTL安装接口、隔离乘员区及安全超空间场。
    有人配置: 晚期设计可容纳80名联盟生物船员与4个并联生物导航接口。人类使用需4名观星者，单名稳态增益>=6TW/mV、比特率>=400TB/s、错误率<=0.1/1MOPS，并另需舰长与舰务人员；观星者不能独立驾驶。
    接口用途: 控制FTL引擎与零点反应堆，网络和战体战术指挥仍由机械核心负责。
    存世状态: 无已确认现役完整舰；仅作为远古设计、残骸和探索线索，不纳入玩家起始舰队。
  </ship_def>
