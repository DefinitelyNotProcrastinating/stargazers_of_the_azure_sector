content: |-
  <ship_def>
  级别: 卫士级
  别名: Guardian-class
  舰船类型: RC
  舰种: 后勤巡洋舰 (高级巡洋舰)
  价格: 232M
  制造商: 帝国海军设计局
  描述: 舰体继承了帝国海军庄重威严的设计语言，呈厚重的十字形结构。中央舰体宽大，容纳了战巡级别的反应堆和庞大的无人机蜂巢，四向伸出的装甲臂则分别装备了传感器阵列和无人机弹射导轨。通体为帝国舰队标准的曜石黑色/红金色涂装，舰首烙印着金色的帝国星环与长剑徽记。
  舰船单位模板:
    舰船类型: RC
    吨位: L
    驾驶员: ''
    是否旗舰: false
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 6
    跃迁消耗: 2
    制造商: 帝国海军设计局
    描述: 舰体继承了帝国海军庄重威严的设计语言，呈厚重的十字形结构。中央舰体宽大，容纳了战巡级别的反应堆和庞大的无人机蜂巢，四向伸出的装甲臂则分别装备了传感器阵列和无人机弹射导轨。通体为帝国舰队标准的曜石黑色/红金色涂装，舰首烙印着金色的帝国星环与长剑徽记。
    炮位配置: 4S
    装备槽位配置: 9H5L
    装配资源:
      PG: 288
      CPU: 608
    效果:
      船体加成:
      - 特种巡洋舰；依据舰级定位应用：后勤巡洋舰 (高级巡洋舰)。
      装配减免: []
      内置电子系统:
        基础CPU: 内置特种巡洋舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置特种巡洋舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
      特殊系统:
      - 名称: “圣血”纳米体注入鱼雷
        描述: “卫士”级的核心系统。舰体中轴线上装有四座一次性发射管，每座装填一枚搭载了高浓度修复纳米机械集群的特种鱼雷。发射后，鱼雷会使用量子传送飞向目标友军单位，在接触装甲的瞬间，战斗部会释放出定向冲击波，将内部的海量纳米机械强行“注射”进目标舰体的装甲破损处。这些纳米机械会立刻激活并与战列舰自身的修复系统协同工作，在短时间内完成对关键结构的大规模修复。此系统对“禁卫军”级等拥有纳米体血管网络的帝国主力舰效果最佳，但对纳米体存量较少的巡洋舰及以下舰船效果有限，且备弹量约为16发。
    装备: {}
  静态档案:
    观星者需求: 没有特殊要求。巡洋舰级别。
    旧版描述: |-
      -   级别: 卫士级 (Guardian-class)
      -   类型: 后勤巡洋舰 (高级巡洋舰)
      -   价格: 232M
      -   形态: 舰体继承了帝国海军庄重威严的设计语言，呈厚重的十字形结构。中央舰体宽大，容纳了战巡级别的反应堆和庞大的无人机蜂巢，四向伸出的装甲臂则分别装备了传感器阵列和无人机弹射导轨。通体为帝国舰队标准的曜石黑色/红金色涂装，舰首烙印着金色的帝国星环与长剑徽记。
      -   制造商: 帝国海军设计局
      -   静态配置文件:
          -   舰体全长: 610米
          -   标准船员配置: 12人
          -   性能评级:
              -   装甲: 12000
              -   护盾: 15000
              -   机动性: 55
              -   火力输出: 300 (自卫无人机)
              -   回复量: 3700 (常规无人机) / 15000 (纳米体鱼雷单发峰值)
          -   武器系统:
              -   主要系统: 2x “侍从”重型维修无人机蜂巢 (每巢16架)
              -   次要系统: 4x “哨兵”轻型防御无人机挂架 (每挂架4架)
              -   攻击射程: 80000 km (维修无人机作战半径)
          -   特殊系统:
              -   名称: “圣血”纳米体注入鱼雷
              -   描述: “卫士”级的核心系统。舰体中轴线上装有四座一次性发射管，每座装填一枚搭载了高浓度修复纳米机械集群的特种鱼雷。发射后，鱼雷会使用量子传送飞向目标友军单位，在接触装甲的瞬间，战斗部会释放出定向冲击波，将内部的海量纳米机械强行“注射”进目标舰体的装甲破损处。这些纳米机械会立刻激活并与战列舰自身的修复系统协同工作，在短时间内完成对关键结构的大规模修复。此系统对“禁卫军”级等拥有纳米体血管网络的帝国主力舰效果最佳，但对纳米体存量较少的巡洋舰及以下舰船效果有限，且备弹量约为16发。
          -   观星者需求: 没有特殊要求。巡洋舰级别。
  </ship_def>
