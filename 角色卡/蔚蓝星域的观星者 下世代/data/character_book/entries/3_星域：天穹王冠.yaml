content: |-
  <星域>
  星域: 天穹王冠
  英文名: The Celestial Crown
  简介: 位于银河“上方”的破碎王冠，是帝国秩序与自由贸易的交汇点，也是通往深空的重要跳板。
  星座:
    - 名称: 钴蓝边境
      编码: CF-XXXXX
      英文名: Cobalt Frontier
      主权: 猎户座辛迪加 / 独立军阀（争议区）
      星系数量: 约28,500个
      本地太空特征: 淡蓝色电离气体云弥漫，传感器效率中等，小行星带富含钴与铱。
      描述: 传统灰色地带，名义上属于辛迪加，实际由海盗领主和独立军阀割据；走私、赏金猎杀和非正规采矿是日常。
      所属文化: 辛迪加法律只在能投射武力或签下保安合同时生效，军阀、赏金猎人和企业代理人共享同一张酒桌。
      威胁: 活跃海盗劫掠舰队；局部军阀冲突。
      安等: 45-55（中-低）
      航线:
        - "↔ 璨辉星座（跃迁，6跳）"
        - "<==> 贸易风走廊 | 太阳禁卫区（先驱者星门“Ω-1通道”，1跳）"
    - 名称: 暗红星座
      编码: CC-XXXXX
      英文名: Crimson Constellation
      主权: 泰拉帝国（军事管制区）
      星系数量: 约42,000个
      本地太空特征: 密集老年红巨星使整个星区沐浴在暗红色光辉中。
      描述: 帝国战略要塞区，重要能源产地和边缘世界咽喉，帝国海军重兵看守星门。
      所属文化: 军事化、能源工业、红巨星光辉和高搜查率塑造严厉边防文化。
      威胁: 帝国海军临检（极高）。
      安等: 80-95（高）
      航线:
        - "↔ 璨辉星座（跃迁，8跳）"
        - "<==> 天堂之阶 | 新应许之地（先驱者星门“Φ-9通道”，1跳）"
        - "<==> 大荒野 | 暗色星座（先驱者星门“Σ-7通道”，1跳）"
        - "<==> 太阳禁卫区（专属军用跃迁航道，需授权）"
    - 名称: 璨辉星座
      编码: SPC-XXXXX
      英文名: Splendor Constellation
      主权: 泰拉帝国 / 猎户座辛迪加（联合管理）
      星系数量: 约36,800个
      本地太空特征: 壮丽蓝巨星和稳定主序星交相辉映，风景绝美。
      描述: 被誉为“王冠上的宝石”，兼具奢华度假行星、高科技工业世界和巨大自由贸易区。
      所属文化: 帝国贵族、辛迪加高管、自由港工人和商业间谍混居，礼仪、品牌和情报交易交错。
      威胁: 商业间谍活动；极端贫富差距引发的局部骚乱。
      安等: 60-75（中-高）
      航线:
        - "↔ 钴蓝边境（6跳）、暗红星座（8跳）"
  </星域>
