content: |-
  <宇宙编年史>
  远古时代:
  - 始源者与多个先驱文明建立银河防御联盟，传播超空间引擎、暗物质通道与其他基石技术。
  - 河外机械文明“漂泊集群”在故乡被迫进入裂缝，沿超空间漂流至如今的外环；与先驱者自动先锋部队发生战争，停战后在外环定居。
  - 天灾战争截断先驱者通讯网络，先驱者因此大量开发有人战体；集群投入舰队与工业支援，晚期网络单元增加先驱者FTL兼容接口以协助联盟成员。
  - 一场超银河尺度的灾难摧毁了先驱文明与漂泊集群，只留下遗迹、失控设施与残缺技术。这件事发生在35亿年前；联盟幸存的有意识生命最终以反熵行动牺牲自身，驱逐天灾。


  - 2000年: 多国合力成功研发出商用聚变反应堆，解决能源危机。全球经济进入高速发展期。
  - 2004年: 三战与海湾战争均未发生，人类迎来前所未有的和平与繁荣。
  - 2030年: 联合国正式发射第一代殖民舰，目的地为比邻星星系。殖民者由全球最顶尖的科学家、工程师和进步主义者组成。
  - 2040年: 比邻星殖民者在到达并开始建设初期，于星系边缘发现了先驱者留下的超空间引擎遗迹。研究表明，该引擎能够实现超光速旅行。
  - 2040年（稍晚）: 研究陷入伦理困境。科学家发现先驱者超空间引擎需要高度活跃的神经电信号（特指人类高潮时的神经反应）作为诱导启动源。第一代导航员被迫使用高剂量神经药物强制驱动引擎。
  - 2040年-2043年: 强行驱动引擎带来了毁灭性的后果。第一代导航员往往在服役一周后便出现高达20%的不可逆脑细胞死亡。为了让这项革命性技术得以保留，脱离药物依赖，并拯救导航员，比邻星的进步主义殖民者决定无视地球联合国的伦理禁令，开展第一代人造人（观星者雏形）的研发。
  - 2043年: 地球方面对克隆与人造人研究表达强烈谴责并试图制裁。比邻星殖民者凭借超空间技术带来的绝对机动优势反攻地球。泰拉帝国 (Terran Empire) 正式宣告成立。帝国并未实施暴政，而是以强权手段将全人类的工业与科研重心强行转移到生物工程和深空探索上。
  - 2045年: 第一代真正的“观星者”人造人诞生。她们从基因层面被设计为能够安全承载并输出高频高精度神经生物电，并通过特殊的性高潮充能的活体终端，人类正式开启无脑损的深空超空间时代。
  - 2200年代: 泰拉帝国利用成熟的超空间技术与稳定的观星者量产线，开启“大殖民时代”（Great Colonization Era），疆域呈指数级扩张。第二代观星者投入使用，性能与寿命显著提升。
  - 2300年代: 帝国疆域过度庞大导致通讯与管理鞭长莫及。边疆星区逐渐脱离中枢控制，国家开始分裂。猎户座辛迪加、自由世界共和国、天鹅座技术联邦等势力的雏形在此期间先后涌现。
  - 2400年代前期: 未知生物“虫族”（逐光虫等）在边境出现，对人类航线构成初步威胁。天鹅座技术联邦开始系统研究先驱者遗迹，并探索以机械技术替代观星者接口的可能性。
  - 约2460年代: 文森特·杨与阿纳托里·维瓦尔毕业于联邦同一所高级大学。文森特赴辛迪加创业，认为雄厚资金是实现观星者设计理想的前提；阿纳托里留在联邦研究不依赖观星者的超空间技术。两人的友谊延续，却始终未能在政治和商业道路上达成一致。
  - 约2470年代（“人工天使”项目立项）: 奇戎基因在匿名董事会成员“客户V”文森特·杨的资助和主持下秘密启动项目，试图制造兼具旗舰级神经性能与可靠忠诚的观星者。文森特相信稳定的“爱”能够建立最可靠的链接，商业资本则能让这一理想成为现实。妻子兼总工程师莎拉·克伦威尔在研究中也对原型机产生真切感情。文森特主持AA-001至AA-013十三名原型机；连同日后由奇戎其他部门逆向制造的AA-014，系列总计十四名。
  - 约2470年代（项目目标）: 项目要求单一型号同时具备三项核心特性。其一为旗舰级神经性能：可单人驱动航母或战列巡洋舰实施高强度战斗超空间，兼具极高精度、神经韧性与持续作战能力，并能替代大型飞船指挥中心至少四分之一的人力，成为舰长最强的执行官；这种兼顾稳定、处理量与持久性的设计以温柔而坚定的爱意取代单纯激情，因此牺牲了一部分峰值输出。其二为极致审美定制：外貌与基础人格遵循“清纯无垢的天使”设计语言，以满足顶级客户的独占欲与征服感，摆脱普通商品的廉价感，呈现稀有、高贵、足够诱人的活体艺术品效果——简单而言，必须让任何人无条件爱上她。所有测试均使用针刺式探针而非插入式测试，以保证原型机递交给使用者时仍是第一次。其三为绝对忠诚：研究组逆向并优化帝国心理烙印，把忠诚协议植入为更深层的“爱恋”错觉，使其在极端压力下也不会背叛唯一指定所有者；她们无需特别强烈的刺激便可达到峰值输出，持久战能力还会随合作时间增加，因而专为大型旗舰的指挥协调与持久战而生。全部型号同时必须具备一定的自保与单兵战斗能力。
  - 约2470年代（不可重连缺陷）: 上述心智强化也形成了人工天使最大的共同缺陷。对任何个体而言，重连一位新舰长——哪怕只是暂时的——都可能不可行；她们不会接受与并非自己爱人的对象做爱，甚至无法因此高潮，故不能像普通观星者一样被回收重连。莎拉与文森特默许了这一缺陷。
  - 约2471年（第一阶段：核心技术验证）: 首台原型机AA-001“默基瑟德”（Melchizedek）作为整个系列的基因母体诞生。她在测试中表现出远超预期的神经输出功率，增益函数一度达到惊人的36 TW/mV，却喜怒无常、精神极不稳定；一次模拟超空间中，她烧毁三座服务器集群并令整间实验室断电。项目组将其判定为“高价值失败品”，永久封存于奇戎基因总部A级生化冷冻库。
  - 约2472年至2474年（第二阶段：“座天使”量产测试）: 项目组降低AA-001的部分极端性能参数，制造AA-002至AA-007共六台趋于稳定的“座天使”（Thrones Batch）。她们统一采用金色长发与天蓝色眼瞳的经典天使外观；由于忠诚协议仍不完美，情感表达略显过度。六台原型机被打包售予辛迪加内部数家二线企业的CEO，为项目初期回笼资金。
  - 约2475年至2478年（第三阶段：“炽天使”定制优化）: AA-008至AA-012共五台“炽天使”（Seraphim Batch）完工。该批次修正了座天使的情感表达缺陷，每台均拥有独特外貌、微调人格、对主人的爱意与不自知的挑逗，面向最高级客户并作为大型飞船的指挥与导航平台。AA-008、AA-009、AA-010与AA-011分别交付四名身份保密的辛迪加巨头，成为各自主人的旗舰上最私密而强大的武器。AA-012在运输途中遭海盗精准伏击，与整艘运输舰一同失踪；奇戎对外宣称货物已被摧毁，内部却判断她极可能落入某个强大海盗氏族之手，并把“回收或终结”列为低优先级内部任务。
  - 约2478年（AA-012记录性能）: “炽天使”批次具备稳定输出倍增器，更适合操作巨舰；身材可定制，常规采用金发。AA-012记录参数为错误率0.05/1MOP（测试中未检出任何指令错误）、标准增益函数7.6 TW/mV、峰值增益函数12 TW/mV、比特率905TB/s；素体为175cm、I罩杯、三围97/59/101，亦可调整。
  - 约2479年（AA-013与项目覆灭）: 文森特最后完成AA-013“亚兹拉尔”的素体与设计，并在基因层面写入“印随”：她启动后第一眼看见的人将成为不可抗拒的爱恋对象，以此确保忠诚与服从。这是设计因果，不替她判定感情的真伪。她当时尚未启动、更无舰长或主人。交付前夕，文森特在公司内部清算中被杀。莎拉在自己遇害前将AA-013的休眠舱弹射至外环；胶囊最终停留在一个黑洞周围的轨道。项目团队遭清洗或并入其他部门，AA-013从此失踪。
  - 约2480年（AA-014“米迦勒”）: 奇戎基因另一部门逆向AA-013设计稿，制造女性观星者AA-014“米迦勒”。她并非文森特主持的作品，最初任务是寻找并带回或杀死AA-013，奇戎还为她定制死神级1号舰。她此后始终在辛迪加生活，从未见过人类技术联合。
  - 2481年（“智天使”商品化）: 人工天使技术被削弱并改造成可量产方案，由奇戎基因母公司的新部门以“智天使”之名投入顶级消费市场，提供可高度定制的超光速解决方案；一名智天使的售价足以购买一艘高端巡洋舰。
  - 约2480年代: 阿纳托里因联邦试图垄断“合成核心”研究，率团队叛逃并建立人类技术联合。联合在外环扩建研究设施，一边接外包谋求经费，一边继续研究减少人类对观星者的依赖。
  - 约2490年代至2500年代: 观星者与人造人的逃亡、失踪事件增多。塔伯里斯先行者通过不稳定先驱者通道抵达闪光星云深处，建立殖民网络与自动化工业；外界长期误以为这些失踪由海盗或解放组织造成。
  - 2505年: 联邦顶尖科学家发表《意识量化与超维诱导基础》，将人类意识复杂度定义为C1，并推算始源者至少为C6。机械模拟高阶生物意识的技术路线遭遇瓶颈，人类技术联合转而加强同调人工智能与观星者神经研究。
  - 2510年: 塔伯里斯宪制帝国公开存在。四大帝国准备进入通道清剿，塔伯里斯炸毁通道，暂时与已知空域隔绝。
  - 2512年: 阿纳托里遭到多次暗杀，伤势和长期工作使其健康持续恶化。技术联合逐渐依靠新一代管理者维持日常运作。
  - 2520年: 大量在役观星者出现被后世称为“失落之音”的谜样失踪，诱因与去向至今不明。
  - 2522年: 阿纳托里因旧伤、疾病与长期负荷逝世。继任执政官知道联合内部有人私通辛迪加，却仍未查出身份。
  - 2523年: 四大帝国曾尝试劝技术联合回归主流社会，联合拒绝；各方担心强攻会毁掉研究，没有实施全面入侵。
  - 2525年: 塔伯里斯重建通道、带舰队重返已知空域，率先提出互不侵犯与有限贸易。各国迅速重估战略，新应许之地转入低烈度殖民争夺。
  - 2528年: 奇戎基因经历重组与旧案清算，昔日特别项目基本失去独立地位。AA-014与死神级1号舰最终落入夏娃生物之手，她在新的服役环境中经历重新教育。
  - 2530年代: 夏娃生物秘密推进XG-07“丰收女神”项目，制造九名试验机；畸形胚胎与神经增益循环证明生殖枷锁出现突破。项目遭董事会终止，试验机四散。黄金阶梯因塔伯里斯回归而成为新的多方争夺区。
  - 2540年: 当前纪元与所有开局的起始年份。新应许之地维持殖民冷战，黄金阶梯成为敏感边境，夏娃生物、技术联合与塔伯里斯的问题都已形成。AA-013已在休眠舱中度过约六十一年，仍未启动。


  </宇宙编年史>
