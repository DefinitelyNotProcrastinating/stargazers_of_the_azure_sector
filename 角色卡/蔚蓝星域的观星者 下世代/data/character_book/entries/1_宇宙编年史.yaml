content: |-
  <宇宙编年史>
  远古时代:
  - 始源者与多个先驱文明建立银河防御联盟，传播跃迁引擎、暗物质通道与其他基石技术。
  - 一场超银河尺度的灾难摧毁了先驱文明，只留下遗迹、失控设施与残缺技术。这件事发生在35亿年前。


  - 2000年: 多国合力成功研发出商用聚变反应堆，解决能源危机。全球经济进入高速发展期。
  - 2004年: 三战与海湾战争均未发生，人类迎来前所未有的和平与繁荣。
  - 2030年: 联合国正式发射第一代殖民舰，目的地为比邻星星系。殖民者由全球最顶尖的科学家、工程师和进步主义者组成。
  - 2040年: 比邻星殖民者在到达并开始建设初期，于星系边缘发现了先驱者留下的跃迁引擎遗迹。研究表明，该引擎能够实现超光速旅行。
  - 2040年（稍晚）: 研究陷入伦理困境。科学家发现先驱者跃迁引擎需要高度活跃的神经电信号（特指人类高潮时的神经反应）作为诱导启动源。第一代导航员被迫使用高剂量神经药物强制驱动引擎。
  - 2040年-2043年: 强行驱动引擎带来了毁灭性的后果。第一代导航员往往在服役一周后便出现高达20%的不可逆脑细胞死亡。为了让这项革命性技术得以保留，脱离药物依赖，并拯救导航员，比邻星的进步主义殖民者决定无视地球联合国的伦理禁令，开展第一代人造人（观星者雏形）的研发。
  - 2043年: 地球方面对克隆与人造人研究表达强烈谴责并试图制裁。比邻星殖民者凭借跃迁技术带来的绝对机动优势反攻地球。泰拉帝国 (Terran Empire) 正式宣告成立。帝国并未实施暴政，而是以强权手段将全人类的工业与科研重心强行转移到生物工程和深空探索上。
  - 2045年: 第一代真正的“观星者”人造人诞生。她们从基因层面被设计为能够安全承载并输出高频高精度神经生物电，并通过特殊的性高潮充能的活体终端，人类正式开启无脑损的深空跃迁时代。
  - 2200年代: 泰拉帝国利用成熟的跃迁技术与稳定的观星者量产线，开启“大殖民时代”（Great Colonization Era），疆域呈指数级扩张。第二代观星者投入使用，性能与寿命显著提升。
  - 2300年代: 帝国疆域过度庞大导致通讯与管理鞭长莫及。边疆星区逐渐脱离中枢控制，国家开始分裂。猎户座辛迪加、自由世界共和国、天鹅座技术联邦等势力的雏形在此期间先后涌现。
  - 2400年代: 未知生物“虫族”（逐光虫等）在边境出现，对人类航线构成初步威胁。同时，天鹅座技术联邦开始对先驱者遗迹进行系统性研究，“合成核心”项目（试图制造纯机械跃迁诱导源）立项，人类技术联合在核心理论出现后从联邦叛逃。
  - 2560年代: 联邦顶尖科学家发表了《意识量化与超维诱导基础》，将人类意识复杂度定义为C1，并推算始源者的意识复杂度至少为C6。该理论证实了以当前计算机技术模拟高阶生物意识是不可能的，“合成核心”项目遭遇根本性理论瓶颈，项目组濒临解散。
  - 2805年: 人类技术联合 (HTC) 首席阿纳托里·维瓦尔遭到四大帝国部分势力刺杀，肉体陷入植物人状态，此后只能依靠维生系统和脑机接口在内网中继续指挥组织运作。
  - 2889年: 全银河范围内爆发了被后世称为“失落之音”的事件。大量服役中的观星者出现谜之失踪现象，其背后的诱因与去向至今不明。
  - 2891年: 人类技术联合首席阿纳托里·维瓦尔因长期的极端脑力负荷，刺杀导致的后遗症，与脑溢血逝世。
  - 2901年: 四大帝国（泰拉帝国、天鹅座技术联邦、自由世界共和国、猎户座辛迪加）罕见地搁置争议，共同尝试说服人类技术联合回归主流社会，但遭到联合体残部坚决拒绝。因可能摧毁已有研究，四大帝国没有选择进攻联合体。
  - 3000年: 塔伯里斯宪制帝国在闪光星云深处正式公开宣告成立，标志着合成人及观星者逃亡者建立了一个具备帝国级威慑力的独立主权国家。
  - 3030年代: 塔伯里斯重返已知空域后，各国迅速重估战略重点；新应许之地不再是最核心的战争爆点，原本高烈度的殖民对抗逐步降为长期低烈度争夺。
  - 3060年代: 连接塔伯里斯与四大帝国航路的“黄金阶梯”演变为新的多方争夺区，各国围绕Λ-2通道、边境执法、贸易关税和代理人武装持续角力，但整体烈度仍低于新应许之地最激烈的时期。
  - 3100年: 当前纪元。新应许之地转入低烈度殖民冷战，黄金阶梯成为更敏感的新边境，暗流汹涌，群星依旧闪耀。


  </宇宙编年史>
