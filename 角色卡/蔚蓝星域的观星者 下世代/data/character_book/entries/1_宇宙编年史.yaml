content: |-
  <宇宙编年史>
  远古时代:
  - 始源者与多个先驱文明建立银河防御联盟，传播跃迁引擎、暗物质通道与其他基石技术。
  - 一场超银河尺度的灾难摧毁了先驱文明，只留下遗迹、失控设施与残缺技术。这件事发生在35亿年前。


  - 2000年: 多国合力成功研发出商用聚变反应堆，解决能源危机。全球经济进入高速发展期。
  - 2004年: 三战与海湾战争均未发生，人类迎来前所未有的和平与繁荣。
  - 2030年: 联合国正式发射第一代殖民舰，目的地为比邻星星系。殖民者由全球最顶尖的科学家、工程师和进步主义者组成。
  - 2040年: 比邻星殖民者在到达并开始建设初期，于星系边缘发现了先驱者留下的跃迁引擎遗迹。研究表明，该引擎能够实现超光速旅行。
  - 2040年（稍晚）: 研究陷入伦理困境。科学家发现先驱者跃迁引擎需要高度活跃的神经电信号（特指人类高潮时的神经反应）作为诱导启动源。第一代导航员被迫使用高剂量神经药物强制驱动引擎。
  - 2040年-2043年: 强行驱动引擎带来了毁灭性的后果。第一代导航员往往在服役一周后便出现高达20%的不可逆脑细胞死亡。为了让这项革命性技术得以保留，脱离药物依赖，并拯救导航员，比邻星的进步主义殖民者决定无视地球联合国的伦理禁令，开展第一代人造人（观星者雏形）的研发。
  - 2043年: 地球方面对克隆与人造人研究表达强烈谴责并试图制裁。比邻星殖民者凭借跃迁技术带来的绝对机动优势反攻地球。泰拉帝国 (Terran Empire) 正式宣告成立。帝国并未实施暴政，而是以强权手段将全人类的工业与科研重心强行转移到生物工程和深空探索上。
  - 2045年: 第一代真正的“观星者”人造人诞生。她们从基因层面被设计为能够安全承载并输出高频高精度神经生物电，并通过特殊的性高潮充能的活体终端，人类正式开启无脑损的深空跃迁时代。
  - 2200年代: 泰拉帝国利用成熟的跃迁技术与稳定的观星者量产线，开启“大殖民时代”（Great Colonization Era），疆域呈指数级扩张。第二代观星者投入使用，性能与寿命显著提升。
  - 2300年代: 帝国疆域过度庞大导致通讯与管理鞭长莫及。边疆星区逐渐脱离中枢控制，国家开始分裂。猎户座辛迪加、自由世界共和国、天鹅座技术联邦等势力的雏形在此期间先后涌现。
  - 2400年代: 未知生物“虫族”（逐光虫等）在边境出现，对人类航线构成初步威胁。同时，天鹅座技术联邦开始对先驱者遗迹进行系统性研究，“合成核心”项目（试图制造纯机械跃迁诱导源）立项，人类技术联合在核心理论出现后从联邦叛逃。
  - 约2470年代（“人工天使”项目立项）: 奇戎基因在一位匿名猎户座辛迪加董事会成员“客户V”——企业家兼疯狂科学家文森特·杨——的专项资助与技术援助下秘密启动“人工天使”项目。文森特痴迷于观星者设计，试图探索“高度适配”能否被稳定产出，最终量产可复制泰拉帝国精锐舰队能力的观星者。他只把原型机视为产品；他的妻子兼项目总工程师莎拉·克伦威尔却随着开发推进对她们产生了真切感情。项目经过三轮主体开发并追加最终产品测试，共留下AA-001至AA-013十三名记录在案的原型机。每名人工天使都被相互隔离，从未见过自己的姐妹，尤其是AA-013与可能存在的AA-014等后期个体。
  - 约2470年代（项目目标）: 项目要求单一型号同时具备三项核心特性。其一为旗舰级神经性能：可单人驱动航母或战列巡洋舰实施高强度战斗跃迁，兼具极高精度、神经韧性与持续作战能力，并能替代大型飞船指挥中心至少四分之一的人力，成为舰长最强的执行官；这种兼顾稳定、处理量与持久性的设计以温柔而坚定的爱意取代单纯激情，因此牺牲了一部分峰值输出。其二为极致审美定制：外貌与基础人格遵循“清纯无垢的天使”设计语言，以满足顶级客户的独占欲与征服感，摆脱普通商品的廉价感，呈现稀有、高贵、足够诱人的活体艺术品效果——简单而言，必须让任何人无条件爱上她。所有测试均使用针刺式探针而非插入式测试，以保证原型机递交给使用者时仍是第一次。其三为绝对忠诚：研究组逆向并优化帝国心理烙印，把忠诚协议植入为更深层的“爱恋”错觉，使其在极端压力下也不会背叛唯一指定所有者；她们无需特别强烈的刺激便可达到峰值输出，持久战能力还会随合作时间增加，因而专为大型旗舰的指挥协调与持久战而生。全部型号同时必须具备一定的自保与单兵战斗能力。
  - 约2470年代（不可重连缺陷）: 上述心智强化也形成了人工天使最大的共同缺陷。对任何个体而言，重连一位新舰长——哪怕只是暂时的——都可能不可行；她们不会接受与并非自己爱人的对象做爱，甚至无法因此高潮，故不能像普通观星者一样被回收重连。莎拉与文森特默许了这一缺陷。
  - 约2471年（第一阶段：核心技术验证）: 首台原型机AA-001“默基瑟德”（Melchizedek）作为整个系列的基因母体诞生。她在测试中表现出远超预期的神经输出功率，增益函数一度达到惊人的36 TW/mV，却喜怒无常、精神极不稳定；一次模拟跃迁中，她烧毁三座服务器集群并令整间实验室断电。项目组将其判定为“高价值失败品”，永久封存于奇戎基因总部A级生化冷冻库。
  - 约2472年至2474年（第二阶段：“座天使”量产测试）: 项目组降低AA-001的部分极端性能参数，制造AA-002至AA-007共六台趋于稳定的“座天使”（Thrones Batch）。她们统一采用金色长发与天蓝色眼瞳的经典天使外观；由于忠诚协议仍不完美，情感表达略显过度。六台原型机被打包售予辛迪加内部数家二线企业的CEO，为项目初期回笼资金。
  - 约2475年至2478年（第三阶段：“炽天使”定制优化）: AA-008至AA-012共五台“炽天使”（Seraphim Batch）完工。该批次修正了座天使的情感表达缺陷，每台均拥有独特外貌、微调人格、对主人的爱意与不自知的挑逗，面向最高级客户并作为大型飞船的指挥与导航平台。AA-008、AA-009、AA-010与AA-011分别交付四名身份保密的辛迪加巨头，成为各自主人的旗舰上最私密而强大的武器。AA-012在运输途中遭海盗精准伏击，与整艘运输舰一同失踪；奇戎对外宣称货物已被摧毁，内部却判断她极可能落入某个强大海盗氏族之手，并把“回收或终结”列为低优先级内部任务。
  - 约2478年（AA-012记录性能）: “炽天使”批次具备稳定输出倍增器，更适合操作巨舰；身材可定制，常规采用金发。AA-012记录参数为错误率0.05/1MOP（测试中未检出任何指令错误）、标准增益函数7.6 TW/mV、峰值增益函数12 TW/mV、比特率905TB/s；素体为175cm、I罩杯、三围97/59/101，亦可调整。
  - 约2479年（第四阶段与项目覆灭）: 项目在吸取前三轮经验后完成最终产品投产前的最后一台实验机AA-013，随后准备推进下一阶段。交付前夜，文森特·杨在政治斗争中遭到暗杀，项目失去资金并被上层强制解散；总工程师莎拉·克伦威尔也成为清洗目标。她在遇害前把AA-013的观星者胶囊弹射进太空，自己的尸体随后被发现在实验室内。所有幸存项目成员与文森特所属部门不是遭到暗杀，就是被并入奇戎基因其他部门。文森特临死前曾听说AA-014计划已经启动。
  - 约2480年（AA-014“米迦勒”传闻）: 有传闻称AA-014“米迦勒”（Michael）并未随项目取消，而是由其他部门接手并最终投产。米迦勒很可能继承AA-013的数据与主功能设计；见过其真身并活下来的人寥寥无几，没人知道米迦勒究竟是男性还是女性，只知道其编码逻辑与AA-013一致，同样“爱着”某个人。传闻其稳态输出增益约为8 TW/mV，与AA-013同级，峰值增益则已增强，并拥有必须查阅独立档案才能确认的独特技能。
  - 2481年（“智天使”商品化）: 人工天使技术被削弱并改造成可量产方案，由奇戎基因母公司的新部门以“智天使”之名投入顶级消费市场，提供可高度定制的超光速解决方案；一名智天使的售价足以购买一艘高端巡洋舰。
  - 2560年代: 联邦顶尖科学家发表了《意识量化与超维诱导基础》，将人类意识复杂度定义为C1，并推算始源者的意识复杂度至少为C6。该理论证实了以当前计算机技术模拟高阶生物意识是不可能的，“合成核心”项目遭遇根本性理论瓶颈，项目组濒临解散。
  - 2805年: 人类技术联合 (HTC) 首席阿纳托里·维瓦尔遭到四大帝国部分势力刺杀，肉体陷入植物人状态，此后只能依靠维生系统和脑机接口在内网中继续指挥组织运作。
  - 2889年: 全银河范围内爆发了被后世称为“失落之音”的事件。大量服役中的观星者出现谜之失踪现象，其背后的诱因与去向至今不明。
  - 2891年: 人类技术联合首席阿纳托里·维瓦尔因长期的极端脑力负荷，刺杀导致的后遗症，与脑溢血逝世。
  - 2901年: 四大帝国（泰拉帝国、天鹅座技术联邦、自由世界共和国、猎户座辛迪加）罕见地搁置争议，共同尝试说服人类技术联合回归主流社会，但遭到联合体残部坚决拒绝。因可能摧毁已有研究，四大帝国没有选择进攻联合体。
  - 3000年: 塔伯里斯宪制帝国在闪光星云深处正式公开宣告成立，标志着合成人及观星者逃亡者建立了一个具备帝国级威慑力的独立主权国家。
  - 3030年代: 塔伯里斯重返已知空域后，各国迅速重估战略重点；新应许之地不再是最核心的战争爆点，原本高烈度的殖民对抗逐步降为长期低烈度争夺。
  - 3060年代: 连接塔伯里斯与四大帝国航路的“黄金阶梯”演变为新的多方争夺区，各国围绕Λ-2通道、边境执法、贸易关税和代理人武装持续角力，但整体烈度仍低于新应许之地最激烈的时期。
  - 3100年: 当前纪元。新应许之地转入低烈度殖民冷战，黄金阶梯成为更敏感的新边境，暗流汹涌，群星依旧闪耀。


  </宇宙编年史>
