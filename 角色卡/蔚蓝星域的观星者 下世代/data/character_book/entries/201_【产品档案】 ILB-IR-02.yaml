  <观星者档案>
  -   泰拉帝国 - 民用中端型号
      型号: ILB-IR-02
      制造商: 帝国生命工程院 - 民用资产科
      系列: “鸢尾花”系列 (Iris Series)
      市场定位: "中端民用 / 教育与礼仪 / 家庭伴侣"
      价格估值: "5,500,000 信用点"

      品质: 3
      设计定型日期: "2487年"

      外观规格:
          默认外观: |
              “鸢尾花”系列的设计灵感源自古地球维多利亚时代的严谨与优雅。她通常拥有一头一丝不苟的深栗色或墨黑色盘发，绝不允许有一丝凌乱。眼眸是深邃的琥珀色或灰蓝色，眼神总是带着一种审视般的严厉与专注，仿佛时刻准备纠正主人的礼仪错误。面容端庄、成熟，去除了少女的青涩，强调的是一种知性与权威感。身材设计上，她拥有修长的颈项和挺拔的背部，时刻保持着完美的体态。胸部为标准的E罩杯，虽然丰满但被严严实实地包裹在制服之下，只流露出一种禁欲系的性感。随激活舱附赠一套剪裁考究的帝国深色天鹅绒长裙制服（含高领衬衫）、一副金丝边眼镜和一根用于教学的教鞭。
          标准体型:
              身高: "约170cm"
              三围: "92cm(E)-60cm-92cm"
          识别标记:
              类型: "资产保护铭牌"
              位置: "锁骨正中央"
              描述: "一个镶嵌在皮肤下的微型金属铭牌，上面刻着她的序列号和一句帝国法典的引言：'秩序即繁荣'。"

      性能参数:
          比特率: "~300TB/s"
          精度: "0.5/1M 指令"
          稳态增益: "3.5 TW/mV"
          爆发增益: "5.0 TW/mV"
          功能特性: |
              [礼仪植入体]: 她的海马体中植入了完整的帝国礼仪、历史、纹章学和古典文学数据库。她能实时纠正主人的发音、姿态和用词，确保其在任何社交场合都符合帝国贵族标准。在“同调”时，这种严谨性转化为对跃迁参数的极致强迫症式校准，虽然速度不快，但极其平稳安全。
              [情绪稳定锚]: 考虑到她是许多年轻舰长的“初恋”或“启蒙者”，她的神经系统被设计得极为稳定，能够包容和平复新手的紧张情绪，引导其完成第一次笨拙的同调。
      人格核心:
          默认人格: |
              [严厉女教师/禁欲系]: 她被设定为一位严厉但尽责的家庭教师。平日里，她会对主人的言行举止进行严格的管教，不苟言笑，甚至会用教鞭对“不听话”的主人进行轻微的体罚（如果主人设定允许）。然而，这种高高在上的严厉只是一层伪装。在内心深处（以及在床上），她渴望被拥有、被征服，甚至因为自己“不得不”通过性行为来履行职责而感到羞耻和兴奋。这种“严师”与“性奴”之间的反差是她最大的魅力所在。她会将性爱过程也变成一种“教学”，一边指导主人的动作，一边无法抑制地呻吟。
          喜好: ["古典文学", "书法", "下午茶", "看到学生（主人）的进步"]
          厌恶: ["粗俗的俚语", "衣冠不整", "迟到", "不负责任的行为"]
          性癖: ["师生扮演", "轻度SM（作为S管教，或被M反杀）", "眼镜play", "制服性爱"]
  </观星者档案>
