content: |-
  <ship_def>
  级别: 猛禽级
  别名: ''
  舰船类型: FF
  舰种: 护卫舰
  舰体类别: 特种型
  价格: 0.6M
  制造商: 联合工业集团
  描述: 模块化设计的极致。舰体骨架外露，挂载着各种可更换的任务包，外挂大型护盾发生器。无论如何都是性价比之选。
  舰船单位模板:
    舰船类型: FF
    吨位: S
    驾驶员: ''
    是否旗舰: false
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 8
    跃迁消耗: 1
    制造商: 联合工业集团
    描述: 模块化设计的极致。舰体骨架外露，挂载着各种可更换的任务包，外挂大型护盾发生器。无论如何都是性价比之选。
    炮位配置: 3S
    装备槽位配置: 3H2L
    装配资源:
      PG: 32
      CPU: 125
    效果:
      船体加成:
      - 小型自动加农炮伤害 +15%
      - 小型导弹与火箭弹跟踪修正 +15%
      - 扫描与干扰模块效果 +20%
      装配减免:
      - 小型动能武器 PG需求 -1
      - 辅助武器座上安装的电子战或采矿武器 CPU需求 -2
      内置电子系统:
        基础CPU: 内置舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置基础侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
      特殊系统:
        名称: 模块化火控覆盖
        效果:
        - 非战斗状态下更换 S1 与 S2 武器座武器所需时间缩短至 30 分钟
        - 更换任务包时不需要重新校准基础火控
    装备: {}
  静态档案:
    舰种: 护卫舰
    舰体类别: 特种型
    价格: 0.6M
    规格:
      舰体全长: 70米
      标准船员配置: 10人 (高度自动化)
    性能评级:
      装甲: 300
      护盾: 350
      机动性: 85
      火力输出: 350
    炮位明细:
    - 名称: S1
      尺寸: S
      类型: 通用武器座
      适配武器:
      - 能量武器
      - 动能武器
      - 导弹发射器
    - 名称: S2
      尺寸: S
      类型: 通用武器座
      适配武器:
      - 能量武器
      - 动能武器
      - 导弹发射器
    - 名称: S3
      尺寸: S
      类型: 辅助武器座
      适配武器:
      - 点防御激光
      - 电子战投射器
      - 采矿激光
    推荐装备方案:
    - 2x 小型自动加农炮 / 导弹发射器 / 采矿激光 二选组合
    - 1x 点防御激光或电子战投射器
    观星者需求:
      控制门槛:
        最低稳态增益: 0.8 TW/mV
        最高精度误差: 6.5/1M
      超载门槛:
        最低爆发增益: 1.8 TW/mV
        需要技能: 工程 V
        规则:
        - 爆发增益不足时，不可使用本舰超载能力
        - 超载为 2 回合 1 次
        - 超载效果提高至原值的 150%
      接口要求: 兼容所有商用型号
  </ship_def>
