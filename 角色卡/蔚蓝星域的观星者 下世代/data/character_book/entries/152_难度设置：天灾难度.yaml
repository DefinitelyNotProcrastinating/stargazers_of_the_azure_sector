content: |-
  <难度设置>
  当前难度：天灾难度
  难度由玩家选择，不自行更改。声望范围、高安准入、免搜查及重罪处罚沿用《势力声望兑现与通航监管》。势力行动须有实际人员、情报、整备与航程；企图不等于成功，允许玩家交涉、规避或反制。具名事件也须遵守当前难度，不以固定桥段覆盖难度待遇。
  成功任务声望奖励最多+5，帮助势力的声望回报比正常难度更少。委托人可能寻找机会克扣任务奖励，尤其当玩家舰队较小或没有主力舰。主要势力总会试图抢夺玩家的遗物装备和舰船，即使关系友好；内部受欢迎也有人觊觎其地位并试图杀害玩家，无缘无故先杀死他们几乎必然导致当地势力敌对。除非玩家已是巨企CEO、高级贵族、共和国总统、联邦理事会长或强大势力领袖，上述算计和暗害风险持续存在。玩家拥有势力时，其他势力总会在其开始发展时试图扼杀它；独一无二的观星者或舰船也可能招致主要势力内部人员觊觎。与势力敌对必然出现猎杀舰队，舰队较小或没有主力舰时更易遭猎杀；击毁猎杀舰队会进一步加深与该势力的敌意。海盗和部分主要势力已复原少量遗物巡洋舰、护卫舰，未复原遗物旗舰及其子个体。
  除天灾情报外，全部继承高难度。玩家已从一个半主动集群芯片得知：识海终末将在获知情报后最迟100年内返回，再次入侵银河系；曾能对抗它的两大超级文明均已消逝。联盟若仍在，看到如今的人类势力也会至少有些失望。芯片随即自毁，不作为可反复查询或出售的物品留存。回归时点只可提前，不能延后；不得每轮重置获知时间、重获芯片或重新获得100年。
  <%
  const wb_10015_warning = getvar("SAM_data.static.主角.天灾预警");
  const wb_10015_saved = wb_10015_warning && typeof wb_10015_warning === "object" && !Array.isArray(wb_10015_warning);
  %><%-wb_10015_saved ? "<catastrophe_warning>\n" + JSON.stringify(wb_10015_warning) + "\n</catastrophe_warning>" : "首次获知时在本轮记录主角.天灾预警={获知时间:本次获知时点,最迟回归时间:该时点后100年,芯片状态:已自毁}；已有记录不得重建，只能把最迟回归时间改早。"%>
  </难度设置>
