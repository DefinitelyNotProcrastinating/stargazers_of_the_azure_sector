    T1_导弹与鱼雷:
      说明: 发射后传送至目标附近，末段完成接敌；点防御、目标机动与爆炸范围决定实际伤害。
      字段: [炮位, 伤害, 冷却, 作战射程, 命中, 爆炸半径, AP, DRP, PG, CPU]
      S_轻型导弹发射器: {炮位: 1S, 伤害: 70, 冷却: 1dt, 作战射程: 22000km, 爆炸半径: 45m, AP: 0%, DRP: 0%, PG: 1, CPU: 10, 命中: 95}
