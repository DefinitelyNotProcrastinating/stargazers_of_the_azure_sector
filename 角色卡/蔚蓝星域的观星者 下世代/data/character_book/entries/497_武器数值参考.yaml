keys:
- 武器基准
- 武器数值
- T1武器
content: |-
  <武器数值参考>
  weapon_value_reference:
    使用原则: |
      本条目提供常规舰载武器的 T1 基准数值。T1 等同品质1。
      生成新武器时，先选择武器类型与炮位大小，再取 T1 数值乘以品质系统中的对应乘数 vector。
      最终伤害 = T1伤害 x 效果倍率；最终 PG/CPU = T1装配消耗 x 装配倍率，四舍五入到整数，最低为1。
      伤害表示该武器在 1dt 内能打出的基础伤害值；若没有特别说明，常规武器冷却统一为 1dt。
      暂不需要伤害类型。每件攻击武器只记录一个命中值；其他字段记录基础伤害、射程、炮位和装配资源，炮塔另有转动速度，导弹另有爆炸半径。

    炮位规则: |
      炮位只代表武器大小，不代表武器技术类型。
      所有XL武器对小型高速目标的跟踪都慢：XL炮塔沿用0.0010至0.0030rad/s的低转动速度，只按转速档抵消机动；XL鱼雷用爆炸范围、单发命中与目标机动结算，同样不能可靠清理小船。大型主炮必须依赖中小炮位或护航舰防身。
      激光炮塔、快子炮塔、磁轨炮、RKKV炮塔、导弹、鱼雷、常规无人机投射器等武器均共享 S/M/L/XL 炮位。
      例如 1M 炮位既可安装中型快子炮，也可安装中型导弹发射器。是否可装配只由炮位大小、吨位限制、PG/CPU 和特殊规则决定。
      遗物火炮的文明与内部结构属于硬性特殊规则：光粒炮仅限保有完好光子凝聚器的集群舰船；裂解射线（熵分解炮）要求先驱者舰船或明确列出的ACX-00渡鸦级例外，且熵聚焦线路完好。渡鸦级材料来自先驱者残骸并保留原生线路；两类火炮仍不是通用S/M/L/XL武器，PG/CPU与炮位满足仍须通过安装限定校验。
      L级武器的T1装配PG基准为90至110，主炮约100，导弹与鱼雷略低；高品质仍按装配倍率计算，不得回退到旧的24至52PG基准。
      常规武器不占用 H/L 装备槽位，只占用炮位。
      C槽是大型旗舰级舰载机中队库，不属于常规炮塔/导弹/无人机炮位；1个C槽只能安装1个舰载机中队。常规情况下只有CVL/CV/CVT/TT可以拥有C槽；更小舰体只有在自身档案明确标记 `C槽例外: true` 时才可例外。
      一些航母可能无法安装常规舰炮，或者只有C槽。若舰船只有C槽，则只能通过舰载机中队输出。
      普通航母CVL最多2C，工业旗舰最多3C（固定档案写明机库类别: 工业旗舰），超级航母CV/CVT最多5C；工业旗舰上限优先于CV舰级。泰坦辅助机库最多2C，死神级例外最多2C。上限不是额外赠送的炮位，实际数量仍取舰船固定档案；不得靠品质、模块、扩容或分拆中队增加C槽。
      T槽是超级武器独有位置，只能安装超级武器，且必须安装与舰船T槽种类完全一致的同族超级武器。

    射程与命中模型:
      炮塔: |
        每件炮塔只保存一个命中整数和一个转动速度rad/s；转速仅按战斗规程查档抵消目标机动，不能当作第二个命中值。
        装配时将舰船电子系统与常驻火控增幅合入该武器当前命中一次；品质倍率不直接乘命中。每门炮塔独立取一次D100。
        最佳射程内距离减值0，最佳射程外至失准边界10；超出边界不能有效射击。
      光束散射: 最佳射程内伤害系数1，最佳射程外至失准边界仍按既有线性散射降低命中后的初始伤害一次。
      磁轨与RKKV: 失准区只降低命中，不降低命中后的单发伤害。
      导弹与鱼雷: |
        不保存末段速度或末段跟踪窗口；只保存一个命中值与爆炸半径。范围越大的型号可设更高命中，但对小目标按目标直径/爆炸直径分散伤害。
        导弹传送后仍须按叙事经过末段接敌，不在发射瞬间自动命中；可用点防御按既有规则拦截。

