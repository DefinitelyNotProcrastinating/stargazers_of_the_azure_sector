      XL_超重型鱼雷阵列: {炮位: 1XL, 伤害: 6500, 冷却: 1dt, 作战射程: 250000km, 爆炸半径: 2200m, AP: 25%, DRP: 8%, PG: 90, CPU: 90, 命中: 75}
