    T1_采矿武器:
      说明: 采矿武器占用常规炮位，用于岩体剥离与矿物开采；战斗伤害很低。采矿强度只描述作业能力，不直接绕过工业结算向库存生成资源。
      字段: [炮位, 采矿强度, 岩体剥离, 伤害, 最佳射程, 失准射程, 转动速度, 命中, PG, CPU]
      S_轻型采矿激光: {炮位: 1S, 采矿强度: 1.0, 岩体剥离: 40/作业轮, 伤害: 20, 最佳射程: 2500km, 失准射程: 3500km, 转动速度: 0.15, 命中: 90, PG: 3, CPU: 10}
      M_冲击式采矿激光器: {炮位: 1M, 采矿强度: 2.5, 岩体剥离: 110/作业轮, 伤害: 50, 最佳射程: 5000km, 失准射程: 7000km, 转动速度: 0.05, 命中: 85, PG: 10, CPU: 20}

    T1_常规无人机投射:
      说明: 常规无人机使用 S/M/L 常规炮位，对应轻型/中型/重型无人机编队。表内伤害为整个编队在1dt内的基础伤害，不是单架伤害。
      字段: [炮位, 伤害, 冷却, 作战半径, 命中, 可被点防御, AP, DRP, PG, CPU]
      S_轻型无人机编队: {炮位: 1S, 伤害: 90, 冷却: 1dt, 作战半径: 30000km, 可被点防御: true, AP: 0%, DRP: 0%, PG: 5, CPU: 15, 命中: 100}
      M_中型无人机编队: {炮位: 1M, 伤害: 280, 冷却: 1dt, 作战半径: 60000km, 可被点防御: true, AP: 5%, DRP: 0%, PG: 15, CPU: 30, 命中: 100}
      L_重型无人机编队: {炮位: 1L, 伤害: 900, 冷却: 1dt, 作战半径: 120000km, 可被点防御: true, AP: 10%, DRP: 0%, PG: 100, CPU: 60, 命中: 100}

    T1_航母舰载机中队:
      说明: |
        舰载机中队只能安装到C槽。1个C槽 = 1个舰载机中队。
        1C对应1个标准满编40架的中队；相同中队可自动合并为堆叠记录，但按堆叠数占用同数量C槽，各字段保持每个中队的数值；编制与当前架数记录在该对象的效果中，不把40架拆成40件装备。伤害是满编中队每1dt总伤害，不再乘40；减员后乘当前架数/编制，当前架数限于0至编制。PG/CPU按完整机库消耗，不随减员下降；补机必须消耗实际库存。
        常规航母按自身炮位配置安装C槽中队。普通航母CVL最多2C，工业旗舰最多3C（固定档案写明机库类别: 工业旗舰），超级航母CV/CVT最多5C；工业旗舰上限优先于CV舰级。泰坦辅助机库最多2C，死神级例外最多2C。上限不是额外赠送的炮位，实际数量仍取舰船固定档案；不得靠品质、模块、扩容或分拆中队增加C槽。
      字段: [炮位, 编制, 伤害, 冷却, 作战半径, 命中, 可被点防御, AP, DRP, PG, CPU]
      C_战斗机中队: {炮位: 1C, 编制: 40, 当前架数: 40, 伤害: 2600, 冷却: 1dt, 作战半径: 180000km, 可被点防御: true, AP: 5%, DRP: 0%, PG: 175, CPU: 325, 命中: 100}
      C_截击机中队: {炮位: 1C, 编制: 40, 当前架数: 40, 伤害: 1900, 冷却: 1dt, 作战半径: 160000km, 可被点防御: true, AP: 0%, DRP: 0%, PG: 150, CPU: 350, 命中: 100}
      C_轰炸机中队: {炮位: 1C, 编制: 40, 当前架数: 40, 伤害: 4750, 冷却: 1dt, 作战半径: 220000km, 可被点防御: true, AP: 18%, DRP: 5%, PG: 240, CPU: 380, 命中: 100}

    集群原生舰载机:
      说明: 集群拦截机是小型无人机体，单个C槽可容纳160架；编制以装备明示值为准，仍只记录为1件中队装备。以下为完整装备数据，数值是原生白值，不再乘品质倍率。
      集群拦截机:
        品质: 12
        标签: [武器, 舰载机, 拦截, 无人, 集群, C]
        描述: 即使在决战纪元也很先进的轻型无人拦截机，以密集机群拦截导弹和射弹，也能有效攻击敌人；舰载无人机工厂可制造替补机体。
        效果:
          编制: 160
          当前架数: 160
          单机伤害: 40
          伤害: 6400
          冷却: 1dt
          命中: 100
          作战半径: 160000km
          机载武器射程: 6000km
          可被点防御: true
          AP: 0%
          DRP: 0%
          机载武器: 微型脉冲束；不是光粒炮，不依赖母舰的光子凝聚器。
          单机机体: 每架护盾40、结构15、护盾DR20%、结构DR10%、护盾装甲1、结构装甲1、闪避20。
          结算: N为当前实际参战架数，M为单机伤害40；机群每1dt基础总伤害=N×M。伤害6400为满编白值，减员后按当前架数/编制缩放；不能再乘160或品质倍率。
          拦截: 可拦截已侦测且进入机载武器射程的导弹、鱼雷与实体射弹，按点防御及实际弹道窗口判定，不保证全部拦截；不能拦截光束、裂解射线或光粒。每dt将当前架数分配为拦截组和攻击组，两者之和不得超过当前架数；对舰伤害只计算攻击组N×40，拦截组不能在同dt重复贡献对舰输出。
          工厂补员: 仅在玩家主动发出组装无人机的指令后，由已装配且供电、原生控制与残存制造线可用的损毁的无人机工厂执行指定数量的补员。每小时最多组装8架，每批1至8架消耗金属1、补给1；金属碎片须实际回收、清理并按金属计量入库，不可重复计入物品栏和库存。按实际完成批次扣库存并增加本中队当前架数，最多恢复至编制160。未下令、材料不足或时间未经过时不能补员；不会在后台自动生产，也不会因航行、时间推进或机群减员而自动开始或续产。不在战斗dt内瞬间复活，不生产额外中队或修复损毁机库。
        安装限定:
          船体文明: 漂泊集群
        装配要求: PG：150 | CPU：350 | 吨位：C | 炮位：1C | 装备槽位：无

    T级超级武器_T1:
      说明: |
        T级武器仍然占用1T炮位，并必须匹配舰船的 `T槽种类`。
        T槽只能安装超级武器，且只能安装同族超级武器；禁止跨阵营、跨文明、跨技术谱系混装。
        T级武器有明确特殊考量，因此可以拥有长冷却；其表内伤害为单次发射伤害，不视为1dt持续输出。
      旗舰级末日光矛: {炮位: 1T, T槽种类: 能量末日武器, 伤害: 80000, 冷却: 10dt, 最佳射程: 350000km, 失准射程: 525000km, 命中: 75, 转动速度: 0.0010, 命中模型: 百分制炮塔与光束散射, AP: 25%, DRP: 15%, PG: 900, CPU: 650}
      战略鱼雷阵列: {炮位: 1T, T槽种类: 战略鱼雷, 伤害: 120000, 冷却: 12dt, 作战射程: 300000km, 爆炸半径: 5000m, 命中: 70, AP: 35%, DRP: 20%, PG: 780, CPU: 520}
      广域电子压制核心: {炮位: 1T, T槽种类: 电子战核心, 伤害: 0, 冷却: 10dt, 效果: "全场干扰 D100 <= 45，持续2dt", PG: 520, CPU: 950}
      指挥增幅矩阵: {炮位: 1T, T槽种类: 指挥矩阵, 伤害: 0, 冷却: 12dt, 效果: "友方舰队主防御DR +10%，友方武器白值伤害 +10%，持续3dt", PG: 650, CPU: 820}

    字段规则: |
      每件攻击武器只记录一个 `命中` 值；炮塔另记录 `转动速度`，导弹另记录 `爆炸半径`，舰载机的命中固定100。
      `伤害` 必须直接记录可用于战斗结算的基础伤害标量。
      `AP` 表示穿透目标装甲值的比例；`DRP` 表示穿透目标DR的比例。
      常规武器若没有特殊冷却，统一写 `冷却: 1dt`。
      每件炮塔武器必须写唯一 `命中` 与 `转动速度`；激光/快子另写 `最佳射程` 和 `失准射程`，并按既有光束散射结算。
      磁轨/RKKV武器必须写 `最佳射程` 与 `失准射程`，并在效果中说明失准区降低命中率而非降低伤害。
      导弹/鱼雷必须写唯一 `命中`、`作战射程` 和 `爆炸半径`；不写末段速度与末段跟踪窗口。
      SD隐形轰炸舰固定使用 `2L`，只能安装 `L_巡航导弹发射器`、`L_鱼雷发射管` 或满足相同“大型导弹/大型鱼雷”定义的专属武器；不得安装任何其他L武器。
      常规无人机必须使用 `1S/1M/1L` 炮位，不得使用C槽。
      舰载机中队必须使用 `1C` 炮位；C槽不得安装常规无人机、炮塔、导弹或非中队机库模块。
      T槽必须使用 `1T` 炮位，并且 `T槽种类` 必须与舰船完全一致。
      暂不写伤害类型；若未来启用伤害类型，应作为新字段追加，不替换现有伤害标量。

