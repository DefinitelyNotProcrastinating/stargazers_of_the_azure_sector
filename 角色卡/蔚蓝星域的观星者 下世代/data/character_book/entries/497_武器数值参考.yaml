      L_重型脉冲激光: {炮位: 1L, 伤害: 850, 冷却: 1dt, 最佳射程: 42000km, 失准射程: 63000km, 转动速度: 0.020, AP: 0%, DRP: 0%, PG: 100, CPU: 48, 命中: 90}
      L_重型集束激光: {炮位: 1L, 伤害: 1150, 冷却: 1dt, 最佳射程: 72000km, 失准射程: 108000km, 转动速度: 0.011, AP: 10%, DRP: 0%, PG: 105, CPU: 54, 命中: 90}
