      字段: [炮位, 伤害, 冷却, 最佳射程, 失准射程, 转动速度, 命中, AP, DRP, PG, CPU]
      S_轻型脉冲激光: {炮位: 1S, 伤害: 80, 冷却: 1dt, 最佳射程: 6000km, 失准射程: 9000km, 转动速度: 0.22, AP: 0%, DRP: 0%, PG: 3, CPU: 8, 命中: 95}
