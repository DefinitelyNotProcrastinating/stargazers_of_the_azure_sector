      S_200mm单装磁轨炮: {炮位: 1S, 伤害: 95, 冷却: 1dt, 最佳射程: 6000km, 失准射程: 12000km, 转动速度: 0.20, AP: 10%, DRP: 0%, PG: 2, CPU: 7, 命中: 90}
