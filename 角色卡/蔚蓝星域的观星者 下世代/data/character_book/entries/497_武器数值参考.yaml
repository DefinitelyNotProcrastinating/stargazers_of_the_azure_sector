keys:
- 武器基准
- 武器数值
- T1武器
content: |-
  <武器数值参考>
  weapon_value_reference:
    使用原则: |
      本条目提供常规舰载武器的 T1 基准数值。T1 等同品质1。
      生成新武器时，先选择武器类型与炮位大小，再取 T1 数值乘以品质系统中的对应乘数 vector。
      最终伤害 = T1伤害 x 效果倍率；最终 PG/CPU = T1装配消耗 x 装配倍率，四舍五入到整数，最低为1。
      伤害表示该武器在 1dt 内能打出的基础伤害值；若没有特别说明，常规武器冷却统一为 1dt。
      暂不需要伤害类型。武器只记录基础伤害、命中/衰减模型、射程、炮位和装配资源。

    炮位规则: |
      炮位只代表武器大小，不代表武器技术类型。
      激光炮塔、快子炮塔、磁轨炮、RKKV炮塔、导弹、鱼雷、常规无人机投射器等武器均共享 S/M/L/XL 炮位。
      例如 1M 炮位既可安装中型快子炮，也可安装中型导弹发射器。是否可装配只由炮位大小、吨位限制、PG/CPU 和特殊规则决定。
      常规武器不占用 H/L 装备槽位，只占用炮位。
      C槽是航母专属舰载机中队槽，不属于常规炮塔/导弹/无人机炮位；1个C槽只能安装1个舰载机中队。
      一些航母可能无法安装常规舰炮，或者只有C槽。若舰船只有C槽，则只能通过舰载机中队输出。
      超级航母的C槽数量通常为常规航母的两倍。
      T槽是超级武器独有位置，只能安装超级武器，且必须安装与舰船T槽种类完全一致的同族超级武器。

    射程与命中模型:
      激光炮塔与快子炮塔: |
        远距离必定命中，但存在聚焦不足。
        在最佳射程内造成100%基础伤害。
        失准边界固定为最佳射程的150%；从最佳射程外开始，每超出最佳射程0.5%的距离损失1%伤害。
        到达150%最佳射程时伤害降为0；超过150%最佳射程完全无法造成伤害。
        表内“失准射程”写作 150%最佳射程边界。
      磁轨炮与RKKV炮塔: |
        可能完全miss。
        在最佳射程内使用正常命中判定；进入失准射程后不降低单发伤害，但大幅降低命中率。
        表内“失准射程”表示命中率开始严重恶化直到几乎无法命中的距离边界。
      导弹与鱼雷: |
        导弹发射后瞬移到目标附近，仅需跟踪最终接敌的一小段时间。
        导弹不使用长时间飞行射程；表内射程表示可锁定并投送的最大作战距离。
        导弹使用目标大小、末段跟踪窗口和点防御拦截决定最终有效伤害。

    T1_激光炮塔:
      说明: 高可靠命中，射程中等，伤害稳定；靠失准衰减而非miss惩罚远距离射击。
      字段: [炮位, 伤害, 冷却, 最佳射程, 失准射程, 跟踪, AP, DRP, PG, CPU]
      S_轻型脉冲激光: {炮位: 1S, 伤害: 80, 冷却: 1dt, 最佳射程: 6000km, 失准射程: 9000km, 跟踪: 0.22, AP: 0%, DRP: 0%, PG: 3, CPU: 8}
      S_轻型集束激光: {炮位: 1S, 伤害: 100, 冷却: 1dt, 最佳射程: 9000km, 失准射程: 13500km, 跟踪: 0.14, AP: 5%, DRP: 0%, PG: 4, CPU: 10}
      M_中型脉冲激光: {炮位: 1M, 伤害: 260, 冷却: 1dt, 最佳射程: 15000km, 失准射程: 22500km, 跟踪: 0.075, AP: 0%, DRP: 0%, PG: 14, CPU: 22}
      M_中型集束激光: {炮位: 1M, 伤害: 340, 冷却: 1dt, 最佳射程: 30000km, 失准射程: 45000km, 跟踪: 0.045, AP: 8%, DRP: 0%, PG: 17, CPU: 26}
      L_重型脉冲激光: {炮位: 1L, 伤害: 850, 冷却: 1dt, 最佳射程: 42000km, 失准射程: 63000km, 跟踪: 0.020, AP: 0%, DRP: 0%, PG: 38, CPU: 48}
      L_重型集束激光: {炮位: 1L, 伤害: 1150, 冷却: 1dt, 最佳射程: 72000km, 失准射程: 108000km, 跟踪: 0.011, AP: 10%, DRP: 0%, PG: 44, CPU: 54}
      XL_聚焦光矛: {炮位: 1XL, 伤害: 4800, 冷却: 1dt, 最佳射程: 150000km, 失准射程: 225000km, 跟踪: 0.0030, AP: 12%, DRP: 0%, PG: 115, CPU: 90}
      XL_阳电子光矛: {炮位: 1XL, 伤害: 6200, 冷却: 1dt, 最佳射程: 200000km, 失准射程: 300000km, 跟踪: 0.0018, AP: 15%, DRP: 0%, PG: 135, CPU: 105}

    T1_快子炮塔:
      说明: 更高瞬时伤害与更长射程，装配更重；同样必定命中并按聚焦不足衰减。
      字段: [炮位, 伤害, 冷却, 最佳射程, 失准射程, 跟踪, AP, DRP, PG, CPU]
      S_1GW快子束: {炮位: 1S, 伤害: 105, 冷却: 1dt, 最佳射程: 9000km, 失准射程: 13500km, 跟踪: 0.12, AP: 5%, DRP: 0%, PG: 4, CPU: 10}
      M_8GW裂相快子炮: {炮位: 1M, 伤害: 330, 冷却: 1dt, 最佳射程: 32000km, 失准射程: 48000km, 跟踪: 0.040, AP: 8%, DRP: 0%, PG: 17, CPU: 26}
      L_25GW弧矛级快子脊炮: {炮位: 1L, 伤害: 1180, 冷却: 1dt, 最佳射程: 72000km, 失准射程: 108000km, 跟踪: 0.010, AP: 12%, DRP: 0%, PG: 43, CPU: 53}
      XL_重相位快子枪阵: {炮位: 1XL, 伤害: 6800, 冷却: 1dt, 最佳射程: 230000km, 失准射程: 345000km, 跟踪: 0.0015, AP: 15%, DRP: 5%, PG: 150, CPU: 115}

    T1_磁轨炮与RKKV炮塔:
      说明: 单位伤害高，命中失败风险高；失准区只降低命中率，不降低命中后的伤害。
      字段: [炮位, 伤害, 冷却, 最佳射程, 失准射程, 跟踪, AP, DRP, PG, CPU]
      S_200mm单装磁轨炮: {炮位: 1S, 伤害: 95, 冷却: 1dt, 最佳射程: 6000km, 失准射程: 12000km, 跟踪: 0.20, AP: 10%, DRP: 0%, PG: 2, CPU: 7}
      S_速射RKKV抛射器: {炮位: 1S, 伤害: 120, 冷却: 1dt, 最佳射程: 4500km, 失准射程: 9000km, 跟踪: 0.16, AP: 15%, DRP: 0%, PG: 3, CPU: 8}
      M_中型磁轨炮: {炮位: 1M, 伤害: 300, 冷却: 1dt, 最佳射程: 24000km, 失准射程: 48000km, 跟踪: 0.055, AP: 15%, DRP: 0%, PG: 13, CPU: 20}
      M_RKKV穿甲炮: {炮位: 1M, 伤害: 420, 冷却: 1dt, 最佳射程: 18000km, 失准射程: 36000km, 跟踪: 0.038, AP: 25%, DRP: 5%, PG: 18, CPU: 24}
      L_重型磁轨炮: {炮位: 1L, 伤害: 1050, 冷却: 1dt, 最佳射程: 65000km, 失准射程: 130000km, 跟踪: 0.012, AP: 18%, DRP: 0%, PG: 38, CPU: 45}
      L_RKKV脊炮: {炮位: 1L, 伤害: 1550, 冷却: 1dt, 最佳射程: 85000km, 失准射程: 170000km, 跟踪: 0.007, AP: 30%, DRP: 8%, PG: 52, CPU: 58}
      XL_超重型磁轨炮: {炮位: 1XL, 伤害: 5600, 冷却: 1dt, 最佳射程: 190000km, 失准射程: 380000km, 跟踪: 0.0018, AP: 20%, DRP: 5%, PG: 125, CPU: 90}
      XL_RKKV质量投射脊炮: {炮位: 1XL, 伤害: 8200, 冷却: 1dt, 最佳射程: 220000km, 失准射程: 440000km, 跟踪: 0.0010, AP: 35%, DRP: 10%, PG: 165, CPU: 105}

    T1_导弹与鱼雷:
      说明: 共享炮位，瞬移到目标附近后进行末段跟踪；点防御和目标机动是主要反制。
      字段: [炮位, 伤害, 冷却, 作战射程, 末段跟踪窗口, 爆炸半径, 末段速度, AP, DRP, PG, CPU]
      S_轻型导弹发射器: {炮位: 1S, 伤害: 70, 冷却: 1dt, 作战射程: 22000km, 末段跟踪窗口: 1dt, 爆炸半径: 45m, 末段速度: 4200m/s, AP: 0%, DRP: 0%, PG: 2, CPU: 10}
      S_火箭弹发射器: {炮位: 1S, 伤害: 95, 冷却: 1dt, 作战射程: 9000km, 末段跟踪窗口: 1dt, 爆炸半径: 35m, 末段速度: 5200m/s, AP: 0%, DRP: 0%, PG: 2, CPU: 8}
      M_重型导弹发射器: {炮位: 1M, 伤害: 240, 冷却: 1dt, 作战射程: 50000km, 末段跟踪窗口: 1dt, 爆炸半径: 130m, 末段速度: 3000m/s, AP: 5%, DRP: 0%, PG: 11, CPU: 24}
      M_重型突击导弹发射器: {炮位: 1M, 伤害: 340, 冷却: 1dt, 作战射程: 28000km, 末段跟踪窗口: 1dt, 爆炸半径: 110m, 末段速度: 3400m/s, AP: 8%, DRP: 0%, PG: 13, CPU: 22}
      L_巡航导弹发射器: {炮位: 1L, 伤害: 850, 冷却: 1dt, 作战射程: 110000km, 末段跟踪窗口: 1dt, 爆炸半径: 420m, 末段速度: 1800m/s, AP: 10%, DRP: 0%, PG: 32, CPU: 58}
      L_鱼雷发射管: {炮位: 1L, 伤害: 1750, 冷却: 1dt, 作战射程: 75000km, 末段跟踪窗口: 1dt, 爆炸半径: 850m, 末段速度: 900m/s, AP: 20%, DRP: 5%, PG: 44, CPU: 54}
      XL_超重型鱼雷阵列: {炮位: 1XL, 伤害: 6500, 冷却: 1dt, 作战射程: 250000km, 末段跟踪窗口: 1dt, 爆炸半径: 2200m, 末段速度: 450m/s, AP: 25%, DRP: 8%, PG: 115, CPU: 90}
      XL_末日鱼雷: {炮位: 1XL, 伤害: 12000, 冷却: 1dt, 作战射程: 300000km, 末段跟踪窗口: 1dt, 爆炸半径: 5200m, 末段速度: 240m/s, AP: 35%, DRP: 12%, PG: 160, CPU: 120}

    T1_常规无人机投射:
      说明: 常规无人机使用 S/M/L 常规炮位，对应轻型/中型/重型无人机编队。表内伤害为整个编队在1dt内的基础伤害，不是单架伤害。
      字段: [炮位, 伤害, 冷却, 作战半径, 跟踪, 可被点防御, AP, DRP, PG, CPU]
      S_轻型无人机编队: {炮位: 1S, 伤害: 90, 冷却: 1dt, 作战半径: 30000km, 跟踪: 0.24, 可被点防御: true, AP: 0%, DRP: 0%, PG: 5, CPU: 15}
      M_中型无人机编队: {炮位: 1M, 伤害: 280, 冷却: 1dt, 作战半径: 60000km, 跟踪: 0.085, 可被点防御: true, AP: 5%, DRP: 0%, PG: 15, CPU: 30}
      L_重型无人机编队: {炮位: 1L, 伤害: 900, 冷却: 1dt, 作战半径: 120000km, 跟踪: 0.030, 可被点防御: true, AP: 10%, DRP: 0%, PG: 38, CPU: 60}

    T1_航母舰载机中队:
      说明: |
        舰载机中队只能安装到C槽。1个C槽 = 1个舰载机中队。
        若无特殊说明，1个中队视为8架战斗机或8架轰炸机。
        常规航母按自身炮位配置安装C槽中队；超级航母的C槽数量通常为常规航母的两倍。
      字段: [炮位, 编制, 伤害, 冷却, 作战半径, 跟踪, 可被点防御, AP, DRP, PG, CPU]
      C_战斗机中队: {炮位: 1C, 编制: 8架战斗机, 伤害: 520, 冷却: 1dt, 作战半径: 180000km, 跟踪: 0.040, 可被点防御: true, AP: 5%, DRP: 0%, PG: 35, CPU: 65}
      C_截击机中队: {炮位: 1C, 编制: 8架截击机, 伤害: 380, 冷却: 1dt, 作战半径: 160000km, 跟踪: 0.070, 可被点防御: true, AP: 0%, DRP: 0%, PG: 30, CPU: 70}
      C_轰炸机中队: {炮位: 1C, 编制: 8架轰炸机, 伤害: 950, 冷却: 1dt, 作战半径: 220000km, 跟踪: 0.018, 可被点防御: true, AP: 18%, DRP: 5%, PG: 48, CPU: 76}

    T级超级武器_T1:
      说明: |
        T级武器仍然占用1T炮位，并必须匹配舰船的 `T槽种类`。
        T槽只能安装超级武器，且只能安装同族超级武器；禁止跨阵营、跨文明、跨技术谱系混装。
        T级武器有明确特殊考量，因此可以拥有长冷却；其表内伤害为单次发射伤害，不视为1dt持续输出。
      旗舰级末日光矛: {炮位: 1T, T槽种类: 能量末日武器, 伤害: 80000, 冷却: 10dt, 最佳射程: 350000km, 失准射程: 525000km, 命中模型: 聚焦衰减, AP: 25%, DRP: 15%, PG: 900, CPU: 650}
      战略鱼雷阵列: {炮位: 1T, T槽种类: 战略鱼雷, 伤害: 120000, 冷却: 12dt, 作战射程: 300000km, 爆炸半径: 5000m, 末段速度: 180m/s, AP: 35%, DRP: 20%, PG: 780, CPU: 520}
      广域电子压制核心: {炮位: 1T, T槽种类: 电子战核心, 伤害: 0, 冷却: 10dt, 效果: "全场干扰 D100 <= 45，持续2dt", PG: 520, CPU: 950}
      指挥增幅矩阵: {炮位: 1T, T槽种类: 指挥矩阵, 伤害: 0, 冷却: 12dt, 效果: "友方舰队主防御DR +10%，友方武器白值伤害 +10%，持续3dt", PG: 650, CPU: 820}

    字段规则: |
      `伤害` 必须直接记录可用于战斗结算的基础伤害标量。
      `AP` 表示穿透目标装甲值的比例；`DRP` 表示穿透目标DR的比例。
      常规武器若没有特殊冷却，统一写 `冷却: 1dt`。
      激光/快子武器必须写 `最佳射程` 与 `失准射程`；失准射程默认等于最佳射程150%。
      磁轨/RKKV武器必须写 `最佳射程` 与 `失准射程`，并在效果中说明失准区降低命中率而非降低伤害。
      导弹/鱼雷必须写 `作战射程`、`末段跟踪窗口`、`爆炸半径` 与 `末段速度`。
      常规无人机必须使用 `1S/1M/1L` 炮位，不得使用C槽。
      舰载机中队必须使用 `1C` 炮位；C槽不得安装常规无人机、炮塔、导弹或非中队机库模块。
      T槽必须使用 `1T` 炮位，并且 `T槽种类` 必须与舰船完全一致。
      暂不写伤害类型；若未来启用伤害类型，应作为新字段追加，不替换现有伤害标量。

  </武器数值参考>
