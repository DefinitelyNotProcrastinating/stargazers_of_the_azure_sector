      S_1GW快子束: {炮位: 1S, 伤害: 105, 冷却: 1dt, 最佳射程: 9000km, 失准射程: 13500km, 转动速度: 0.12, AP: 5%, DRP: 0%, PG: 4, CPU: 10, 命中: 95}
