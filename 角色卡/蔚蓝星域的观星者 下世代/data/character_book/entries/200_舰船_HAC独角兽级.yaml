content: |-
  <ship_def>
  级别: 独角兽级
  别名: ''
  舰船类型: HAC
  舰种: 重型突击巡洋舰 (高级巡洋舰) CA
  价格: 180M
  制造商: 星轨航天公司
  描述: 与辛迪加其他舰船棱角分明、充满工业感的设计截然不同，“独角兽”级的舰体线条流畅而优雅，呈修长的纺锤形，舰首微微上翘，如同神话生物的犄角。武器系统被巧妙地内嵌入舰体，整体外观简洁而高雅，内部收购价是1.8亿。“独角兽”级的诞生是一个传奇。其最初的概念草图据说来自辛迪加最大航空航天复合体“星轨航天”CEO的12岁女儿。
  舰船单位模板:
    舰船类型: HAC
    吨位: L
    驾驶员: ''
    是否旗舰: false
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 6
    跃迁消耗: 2
    制造商: 星轨航天公司
    描述: 与辛迪加其他舰船棱角分明、充满工业感的设计截然不同，“独角兽”级的舰体线条流畅而优雅，呈修长的纺锤形，舰首微微上翘，如同神话生物的犄角。武器系统被巧妙地内嵌入舰体，整体外观简洁而高雅，内部收购价是1.8亿。“独角兽”级的诞生是一个传奇。其最初的概念草图据说来自辛迪加最大航空航天复合体“星轨航天”CEO的12岁女儿。
    炮位配置: 10M6C12S
    装备槽位配置: 9H5L
    装配资源:
      PG: 288
      CPU: 608
    效果:
      船体加成:
      - 依据舰级定位应用：重型突击巡洋舰 (高级巡洋舰) CA。
      装配减免: []
      内置电子系统:
        基础CPU: 内置巡洋舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置巡洋舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
      特殊系统:
        名称: “虹光”环形护盾发生器
        描述: 一项源自对先驱者遗物逆向工程的实验性技术，结合了来自CEO女儿的创意。传统的护盾发生器是将能量投射到舰体外层形成护盾，而“虹光”系统则是在舰体周围吸引并产生一个持续旋转的能量环。这个能量环本身就是一个高效的能量存储和传导介质，使得维持护盾所需的持续功率输入显著降低。这不仅减少了对反应堆的压力，将更多能源解放给引擎和武器系统，其旋转的特性也使得护盾在受到攻击时，能量能够更快地从其他区域补充过来，提升了护盾的恢复速度，使得这艘船在战斗中能自我修复。但由于需要将大部分内部空间交给它，该船体只能使用导弹。
    装备: {}
  静态档案:
    观星者需求: 对观星者的要求较为宽泛。由于其平衡的设计，高效的能源系统和自律的武器系统，大多数中端以上的观星者都能胜任，是适应性极强的平台。
    旧版描述: |-
      -   级别: 独角兽级
      -   类型: 重型突击巡洋舰 (高级巡洋舰) CA
      -   价格: 180M
      -   形态: 与辛迪加其他舰船棱角分明、充满工业感的设计截然不同，“独角兽”级的舰体线条流畅而优雅，呈修长的纺锤形，舰首微微上翘，如同神话生物的犄角。武器系统被巧妙地内嵌入舰体，整体外观简洁而高雅，内部收购价是1.8亿。“独角兽”级的诞生是一个传奇。其最初的概念草图据说来自辛迪加最大航空航天复合体“星轨航天”CEO的12岁女儿。
      -   制造商: 星轨航天公司
      -   静态配置文件:
          -   舰体全长: 560米
          -   标准船员配置: 12人
          -   性能评级:
              -   装甲: 19000
              -   护盾: 22000
              -   机动性: 65
              -   火力输出: 3500
          -   武器系统:
              -   主要系统: 10x MK-II “专注”通用中型巡航导弹发射器
              -   次要系统: 6x 无人机挂架，12x 轻型点防御系统
              -   攻击射程: 100000 km
          -   特殊系统:
              -   名称: “虹光”环形护盾发生器
              -   描述: 一项源自对先驱者遗物逆向工程的实验性技术，结合了来自CEO女儿的创意。传统的护盾发生器是将能量投射到舰体外层形成护盾，而“虹光”系统则是在舰体周围吸引并产生一个持续旋转的能量环。这个能量环本身就是一个高效的能量存储和传导介质，使得维持护盾所需的持续功率输入显著降低。这不仅减少了对反应堆的压力，将更多能源解放给引擎和武器系统，其旋转的特性也使得护盾在受到攻击时，能量能够更快地从其他区域补充过来，提升了护盾的恢复速度，使得这艘船在战斗中能自我修复。但由于需要将大部分内部空间交给它，该船体只能使用导弹。
          -   观星者需求: 对观星者的要求较为宽泛。由于其平衡的设计，高效的能源系统和自律的武器系统，大多数中端以上的观星者都能胜任，是适应性极强的平台。
