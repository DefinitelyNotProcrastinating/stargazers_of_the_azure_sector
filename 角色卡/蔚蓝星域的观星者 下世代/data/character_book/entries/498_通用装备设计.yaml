content: |-
  <通用装备设计>
  # 通用舰船装备设计流程

  ## 目标
  当创建、改装或描述舰船装备时，必须先确定模块类别，再确定吨位、H/L 槽位、PG、CPU 与量化效果。
  所有可拆卸模块统一存储于 `主角.舰船.舰船名.装备.装备名`。

  ## 标准设计流程
  1. 确定模块类别：舰炮、防御、电子、工程、推进、能源或其他。
     - 遗物火炮先核对文明与内部结构：光粒炮只能装在保有完好光子凝聚器的集群舰船上；裂解射线（熵分解炮）要求先驱者舰船或ACX-00渡鸦级这一明确例外，且熵聚焦线路完好。渡鸦级材料来自先驱者残骸并保留原生线路；原生内部结构不能用普通模块加装到其他文明舰船上。
     - 文明专用遗物武器填写 `安装限定` 对象，保存对应的 `船体文明` 和 `所需内部结构`；裂解射线额外填写 `例外舰型: [ACX-00渡鸦级]`。船体保存 `文明`、档案 `船体型号` 及 `效果.内部结构`，文明匹配或明确例外型号匹配之后，仍须核对内部结构。安装限定对象在复制、打捞与转移时一并保留，不得自行扩充例外舰型。
  2. 确定模块吨位：
     - 挂点代码只允许 `S/M/L/XL/C/T`：`L` 为战列舰级火炮，`XL` 为旗舰级火炮，`C` 为航母机库槽位，`T` 为超级武器槽位。
     - 非舰炮模块只允许 `S/M/L/XL/N`。
     - `N` 表示常规通用模块，可以安装至任意吨位舰船，例如通用电脑、标准协处理器。
     - `S/M/L/XL` 非舰炮模块只能安装至同吨位舰船。
  3. 确定槽位：
     - 舰炮只消耗炮位挂点，不占用 H/L 装备槽位。
     - 非舰炮模块根据类别消耗 H 或 L 装备槽位，不占用炮位。
     - 每艘舰船最多拥有 `1T`。`T` 槽只能安装超级武器；舰船与超级武器都必须填写 `T槽种类`，且值完全一致。禁止跨阵营或跨技术体系混装超级武器。
     - `C` 槽只能安装舰载机中队，不能安装常规无人机、武器或机库模块。常规情况下只有 CVL/CV/CVT/TT 可拥有 C 槽；低于航母级的舰体必须由自身档案明确标记 `C槽例外: true`。普通航母CVL最多2C，工业旗舰最多3C（固定档案写明机库类别: 工业旗舰），超级航母CV/CVT最多5C；工业旗舰上限优先于CV舰级。泰坦辅助机库最多2C，死神级例外最多2C。上限不是额外赠送的炮位，实际数量仍取舰船固定档案；不得靠品质、模块、扩容或分拆中队增加C槽。1C对应1个标准满编40架的中队；相同中队可自动合并为堆叠记录，但按堆叠数占用同数量C槽，各字段保持每个中队的数值；编制与当前架数记录在该对象的效果中，不把40架拆成40件装备。伤害是满编中队每1dt总伤害，不再乘40；减员后乘当前架数/编制，当前架数限于0至编制。PG/CPU按完整机库消耗，不随减员下降；补机必须消耗实际库存。
     - SD 隐形轰炸舰是固定装配船体：只拥有 `2L` 炮位和 `0H0L` 装备槽，两个炮位都只能安装大型导弹或大型鱼雷。
  4. 确定 PG 与 CPU：
     - 正数表示消耗资源。
     - 负数表示提供额外资源，例如副反应堆 `PG：-20`，协处理器 `CPU：-15`。
     - 资源扩展模块仍必须占用至少一个 H/L 装备槽位。
  5. 填写量化效果。禁止只写“更强”“更快”或“更难命中”。随机机制必须写为 `D100 <= x`。
     - 每件攻击武器只保存一个 `命中` 整数，装配时把常驻电子火控加成合入一次。炮塔另写 `转动速度`，导弹另写 `爆炸半径`，舰载机命中固定100；炮塔按战斗规程掷一个D100，光束命中后仍应用一次距离散射。
     - 舰载工业设施若有自动每日产耗，装备对象须逐件填写 `输入`、`输出` 和 `状态: 关闭`；装入舰船时仍默认为关闭，玩家在前端开启并保存后才由SAM结算。堆叠设备共用该装备条目的状态，输入/输出按单件参数乘实际件数。

  ## H/L 槽位分类
  低功率槽位_L:
    原则: |
      用于不需要持续高能量通量，但会占用舰体内部空间、结构支撑或计算资源的模块。
    常见模块:
      - ECCM 与抗干扰模块
      - 电脑、火控电脑、协处理器、算法模块
      - 装甲板、副装甲板、结构强化件
      - 低功率被动工程模块

  高功率槽位_H:
    原则: |
      用于需要持续或瞬时高能量通量的模块。舰体需要为它们提供大功率超导电缆、能量总线、散热与隔离硬件。
    常见模块:
      - 护盾扩展器、护盾增幅器、主动护盾模块
      - 副反应堆、反应堆调控元件、能源模块
      - ECM 与主动干扰模块
      - 额外主动传感器、高功率扫描阵列
      - 主动推进、主动维修与其他高通量模块

  ## 防御模块可选属性
  护盾模块:
    可选属性: `护盾: int`
    说明: |
      当模块直接增加舰船护盾容量时填写。仅提供抗性、恢复、稳定性或其他机制时可以省略。
    示例:
      护盾扩展器:
        品质: 1
        标签: [护盾, 模块]
        护盾: 300
        描述: 提供护盾容量的标准高功率模块。
        效果:
          护盾容量: +300
        装配要求: "PG：12 | CPU：8 | 吨位：M | 炮位：无 | 装备槽位：1H"

  装甲模块:
    可选属性: `结构装甲: int`
    说明: |
      装甲不再拥有独立血条。装甲板、结构强化件与装甲硬化器必须作用于结构层，填写 `结构装甲`、`结构DR` 或 `结构维修`。
      钢板/装甲板是唯一装备，必须填写 `唯一组: 钢板`；同一艘舰船最多安装1套，无论模块名称、品质或吨位是否不同。
    示例:
      驱逐舰钢板:
        品质: 1
        标签: [装甲, 模块]
        唯一组: 钢板
        结构装甲: 110
        描述: 安装于驱逐舰结构框架上的低功率钢板套件。
        效果:
          结构装甲: +110
        装配要求: "PG：16 | CPU：8 | 吨位：M | 炮位：无 | 装备槽位：1L"

  ## 舰船槽位分布
  盾抗船:
    原则: |
      通常拥有更多 H 槽与更少 L 槽，以安装护盾扩展器、护盾增幅器和主动护盾模块。
      盾抗船将更多舰体能量总线与高功率硬件留给防御系统。

  甲抗船:
    原则: |
      通常拥有更多 L 槽与更少 H 槽，以安装装甲板、结构强化件与被动防御模块。

  ## 标准模块模板
  ```json
  {
    "模块名": {
      "品质": 1,
      "标签": ["模块类别"],
      "描述": "string",
      "效果": {
        "效果名": "量化描述"
      },
      "护盾": "int，可选，护盾扩展器",
      "护盾装甲": "int，可选，护盾层固定减伤",
      "结构装甲": "int，可选，结构层固定减伤",
      "护盾DR": "str，可选，护盾百分比减伤",
      "结构DR": "str，可选，结构百分比减伤",
      "唯一组": "str，可选；钢板固定填写为钢板",
      "装配要求": "PG：0 | CPU：0 | 吨位：N | 炮位：无 | 装备槽位：1L"
    }
  }
  ```
  </通用装备设计>
