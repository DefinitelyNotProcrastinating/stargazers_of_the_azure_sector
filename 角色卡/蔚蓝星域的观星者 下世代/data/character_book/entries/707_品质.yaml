keys: []
content: |-
  <品质总则>
  # 通用品质系统（整数品质）

  品质系统:
    概述: |
      当前版本统一使用整数品质体系，也就是品质0-18。
      所有装备、模块、工业资产、舰船子系统、特殊造物，都应优先使用整数品质记录。
      叙事中禁止生硬说出“品质7装备”“品质12模块”，应改用自然语言：量产货、改装件、海军规格、原型机、定制件、超前科技、先驱者遗物等。
      品质编号主要用于：变量记录、数值查询、制造门槛、工业判定、电子战计算、掉落稀有度和系统检索。

    叙事规则: |
      正文中尽量不直接出现 T 编号。
      代之以对应档位的自然描述。
      只有在面板、变量、规则结算、物品档案、数据库字段中，才明确写出 T 编号。

  品质档位表:
    品质0:
      分类: 例外
      叙事称呼: 异常物 / 规则外产物
      描述: 不符合标准品质体系的物品，效果完全由单独规则决定

    品质1:
      分类: 基础
      叙事称呼: 量产货
      描述: 所有基准数值的标准参考点

    品质2:
      分类: 改装
      叙事称呼: 民用改件
      描述: 在品质1基础上进行轻度优化
    品质3:
      分类: 改装
      叙事称呼: 优化改件
      描述: 比品质2更成熟的强化版本
    品质4:
      分类: 改装
      叙事称呼: 进阶改件
      描述: 性能与代价同步上升
    品质5:
      分类: 改装
      叙事称呼: 极限改件
      描述: 民间与黑市体系中的高端常规改装

    品质6:
      分类: 优良
      叙事称呼: 优良品
      描述: 工艺显著高于量产线的专业产品

    品质7:
      分类: 海军
      叙事称呼: 海军规格
      描述: 军方专供型号，强调装配效率与制式稳定性

    品质8:
      分类: 原型
      叙事称呼: 试作件
      描述: 实验室或军工厂小批量样机
    品质9:
      分类: 原型
      叙事称呼: 原型件
      描述: 性能跃升明显，但成本与兼容性波动较大
    品质10:
      分类: 原型
      叙事称呼: 完整原型
      描述: 接近定型的高端实验型号

    品质11:
      分类: 定制
      叙事称呼: 定制件
      描述: 为特定平台、特定舰长或特定任务打造
    品质12:
      分类: 定制
      叙事称呼: 顶级定制件
      描述: 高度专门化的精品装备

    品质13:
      分类: 超前科技
      叙事称呼: 尖端实验品
      描述: 代表当代科技极限的前沿产物
    品质14:
      分类: 超前科技
      叙事称呼: 战略级实验品
      描述: 已经超出常规工业链条的稳定供给能力
    品质15:
      分类: 超前科技
      叙事称呼: 巅峰科技产物
      描述: 当代文明在可复制领域内的极限

    品质16:
      分类: 先驱者
      叙事称呼: 先驱者遗物
      描述: 直接源自先驱者技术，通常无法量产复制

    品质17:
      分类: 保留
      叙事称呼: 未定义超规格产物
      描述: 预留给未来技术体系

    品质18:
      分类: 保留
      叙事称呼: 未定义超规格产物
      描述: 预留给未来技术体系

  旧品质迁移映射:
    说明: |
      以下映射用于把旧世界里的“品质1-7”内容迁移到当前 T 系统。
      这不是逐字替换，而是用于估算技术档位和数值区间。
    映射表:
      旧品质1_粗制: 品质1
      旧品质2_标准: 品质2-品质5
      旧品质3_精良: 品质6
      旧品质4_上等: 品质7
      旧品质5_史诗: 品质8-品质10
      旧品质6_传奇: 品质11-品质15
      旧品质7_神话: 品质16+

  通用强度倍率:
    说明: |
      当规则只需要一个“品质强度倍率”时，优先查本表。
      这张表用于大多数泛用品质比较、特殊效果强度、词条上限估算、掉落稀有度感知。
      它不是装配倍率，也不是工业倍率，而是通用强度倍率。
    系数表:
      品质1: 1.00
      品质2: 1.05
      品质3: 1.10
      品质4: 1.15
      品质5: 1.20
      品质6: 1.50
      品质7: 1.50
      品质8: 2.60
      品质9: 2.80
      品质10: 3.00
      品质11: 3.30
      品质12: 4.00
      品质13: 4.50
      品质14: 5.00
      品质15: 6.00
      品质16: 8.00
      品质17: 10.00
      品质18: 12.00

  工业科研倍率:
    说明: |
      当制造、研发、工业、基地、舰载工位需要按品质拉开生产力差距时，优先查本表。
      这张表服务于工业系统，表达的是“工业/科研能力层级”。
    系数表:
      品质1: 1
      品质2: 1.2
      品质3: 1.5
      品质4: 1.8
      品质5: 2.2
      品质6: 3
      品质7: 3
      品质8: 6
      品质9: 8
      品质10: 10
      品质11: 15
      品质12: 20
      品质13: 30
      品质14: 45
      品质15: 60
      品质16: 100
      品质17: 150
      品质18: 220

  电子系统基础值:
    说明: |
      电子战、火控、侦测、ECM、ECCM若需要直接从整数品质取基础值，优先查本表。
      设备的最终数值 = 电子基础值 × 对应设备乘数。
    基础值表:
      品质1: 1
      品质2: 2
      品质3: 3
      品质4: 4
      品质5: 5
      品质6: 6
      品质7: 6
      品质8: 12
      品质9: 16
      品质10: 20
      品质11: 26
      品质12: 32
      品质13: 40
      品质14: 48
      品质15: 60
      品质16: 80
      品质17: 100
      品质18: 120

  词条容量参考:
    说明: |
      用于估算该品质通常允许多少个显著词条、附加效果或特殊模块化功能。
      若某个装备或系统已有独立词条规则，以独立规则为准。
    参考表:
      品质1: 0
      品质2: 1
      品质3: 1
      品质4: 1
      品质5: 2
      品质6: 2
      品质7: 2
      品质8: 3
      品质9: 3
      品质10: 4
      品质11: 4
      品质12: 5
      品质13: 5
      品质14: 6
      品质15: 6
      品质16: 7+
      品质17: 保留
      品质18: 保留

  使用规则:
    优先级: |
      若某个子系统已有专用品质表，则优先使用子系统自己的表。
      若没有，则按本文件提供的“通用强度倍率 / 工业科研倍率 / 电子系统基础值”进行换算。
    变量记录: |
      变量中推荐直接使用整数品质记录。
      若需要自然语言展示，再从本表映射为“量产货”“海军规格”“原型件”等叙事称呼。
    禁止项: |
      禁止继续把旧“粗制/标准/精良/上等/史诗/传奇/神话”当作当前世界的主品质字段。
      旧称呼只用于迁移映射，不再作为现行标准。

  </品质总则>
