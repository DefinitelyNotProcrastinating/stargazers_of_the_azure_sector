content: |-
  <舰船基础数值设定>

  ship_hp_baselines:
    核心原则: |
      1. 舰船血量永远只由两条血条构成：护盾 + 结构。装甲不再拥有单独血条。
      2. 每个舰船单位都必须拥有以下4个字段：`船体护盾值`、`船体结构值`、`护盾值`、`结构值`。
      3. 护盾与结构分别拥有自己的 DR 与装甲值。DR 是百分比减伤，装甲值是每次受击时的固定减伤。
      4. 护盾未归零时，常规伤害优先打护盾；护盾归零后，溢出伤害继续打结构。明确写有穿透、绕盾或直击结构的武器按武器规则执行。
      5. 最大护盾 = `船体护盾值` + 所有装备提供的 `护盾`；最大结构 = `船体结构值` + 所有装备提供的 `结构值`。当前 `护盾值` 与 `结构值` 不得超过对应最大值。

    必备字段: |
      新建或更新舰船时，若该舰船参与战斗，至少记录：
      {
        "船体护盾值": 0,
        "船体结构值": 0,
        "护盾值": 0,
        "结构值": 0,
        "护盾DR": "5%",
        "护盾装甲": 0,
        "结构DR": "20%",
        "结构装甲": 0
      }
      `护盾DR` 与 `结构DR` 可以被船体品质、船体特性、装备、技能和临时效果修改。
      `护盾装甲` 与 `结构装甲` 由吨位、船体特性、装备和临时效果提供。

    伤害结算: |
      1. 命中后先确认承伤层：护盾层或结构层。
      2. 有效伤害 = max(0, 原始伤害 × (1 - 对应DR) - 对应装甲)。
      3. 对小额持续伤害、环境伤害或剧情性擦伤，若有效伤害被装甲完全抵消，可以记为 0。
      4. 对明确造成实体贯穿、内部爆炸、熵分解、时空撕裂等效果的武器，可部分或全部忽略护盾装甲、结构装甲或 DR，但必须在武器效果中写明。
      5. 多段伤害逐段结算装甲；单次大伤害只结算一次装甲。

    基础总血量:
      说明: 基础总血量是分配 `船体护盾值` 与 `船体结构值` 前的参考值
      FF: 500
      AF: 800
      DD: 800
      AD: 1000
      SD: 850
      TD: 900
      CA: 1600
      HAC: 2200
      ESC: 1800
      RC: 1700
      SC: 1800
      TC: 2200
      BC: 2800
      BB: 5200
      BBV: 5600
      MV: 800
      CVL: 9000
      ICV: 9000
      JF: 12000
      CV: 18000
      DN: 22000
      CVT: 24000
      TT: 60000

    防御倾向分配: |
      舰船必须选择一种默认防御倾向，用乘数从基础总血量生成血条上限：
      - 盾抗船：船体护盾值 = 基础总血量 × 0.7；船体结构值 = 基础总血量 × 0.5。
      - 甲抗船：船体护盾值 = 基础总血量 × 0.3；船体结构值 = 基础总血量 × 0.7。
      - 均衡船：船体护盾值 = 基础总血量 × 0.5；船体结构值 = 基础总血量 × 0.6。

    基础DR:
      护盾DR: 5%
      结构DR: 20%
      上限: |
        常规护盾DR、结构DR、护盾硬化器、结构/装甲硬化器叠加后的最终 DR 上限均为 80%，不管叠加了多少抗性装备。

    吨位基础装甲:
      说明: 装甲值不是血条，而是每次受击时的固定减伤。护盾装甲保护护盾层，结构装甲保护结构层。
      FF: {"护盾装甲": 5, "结构装甲": 12}
      DD: {"护盾装甲": 8, "结构装甲": 20}
      CA: {"护盾装甲": 15, "结构装甲": 40}
      BC: {"护盾装甲": 22, "结构装甲": 65}
      BB: {"护盾装甲": 35, "结构装甲": 110}
      CVL: {"护盾装甲": 45, "结构装甲": 150}
      CV: {"护盾装甲": 80, "结构装甲": 260}
      DN: {"护盾装甲": 95, "结构装甲": 320}
      TT: {"护盾装甲": 180, "结构装甲": 650}
      变体继承: |
        AF 继承 FF，AD/SD/TD/MV 继承 DD，HAC/ESC/RC/SC/TC 继承 CA，BBV 继承 BB，ICV/JF 继承 CVL，CVT 继承 CV。
        具体舰船可因船体特性、势力风格或品质上调/下调 10%-30%。

    品质修正: |
      船体品质可以提供额外 HP 与基础 DR。必须写成乘数或明确百分比，不得只写“更耐打”。
      - 普通量产型：HP x1.0；基础DR无修正。
      - 精良/军规型：HP x1.1；主防御层 DR +3%。
      - 海军型：HP x1.2；主防御层 DR +5%。
      - 高级型/高科技型：HP x1.25；主防御层 DR +8%，副防御层 DR +3%。
      - 旗舰型：HP 与 DR 由舰船条目独立定义，但仍必须遵守 `护盾 + 结构` 双血条结构。

    装备字段规则: |
      1. 护盾扩展器必须使用 `护盾` 字段记录其提供的最大护盾量，例如 `"护盾": 180`。
      2. 护盾硬化器必须写明 `护盾DR` 或具体伤害类型抗性；最终常规 DR 不得超过 80%。
      3. 护盾装甲模块必须写明 `护盾装甲`，表示护盾层固定减伤的增减值。
      4. 装甲甲板不提供独立血条，必须写明 `结构装甲` 与可选 `结构DR`，例如 `"结构装甲": 90, "结构DR": "+5%"`。
      5. 装甲硬化器必须写明 `结构DR` 或具体伤害类型抗性；最终常规 DR 不得超过 80%。

  </舰船基础数值设定>
