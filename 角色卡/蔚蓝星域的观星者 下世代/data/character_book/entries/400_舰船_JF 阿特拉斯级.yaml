content: "<ship_def>\n舰船类型: JF\n舰种: 超级货舰\n舰体类别: 常规型\n“它不美，甚至可以说是丑陋和臃肿的。但当你看到它缓缓驶入港口，卸下足够建造一座城市的物资时，你会明白，它才是帝国繁荣的基石。”——帝国贸易部部长，针对“阿特拉斯”级首航的讲话\n\
  \n-   **级别**: 阿特拉斯级\n-   **类型**: 超级货舰 (Jumbo Freighter) JF\n-   **价格**: 1.2B (12亿信用点)\n\
  -   **形态**: 它本质上就是一个加装了引擎和舰桥的巨型长方体金属砖块。舰体长达5200米，通体覆盖着数米厚未经抛光的黑色重型工业装甲板，上面布满了铆钉、加强筋和巨大的起重机结构。为了最大化内部空间，它的舰桥被设计成一个微小的凸起，位于舰体最前端的顶部，宛如一只趴在巨兽头顶的蚂蚁。舰尾是四个巨大的亚光速引擎喷口，在航行时喷吐着浑浊的等离子尾焰。没有护盾发生器的光晕，它就像一座在太空中漂流的黑色山脉，给人一种沉重、迟缓但不可摧毁的压迫感。\n\
  -   **制造商**: 赫克勒斯重工 (民用部门)\n-   **静态配置文件**:\n    -   **舰体全长**: 5200米\n    -   **标准船员配置**:\
  \ 18人\n    -   **性能评级**:\n        -   **装甲**: 240000\n        -   **护盾**: 0\n  \
  \      -   **机动性**: 8\n        -   **火力输出**: 0\n        -   **货舱容量**: 1,250,000\
  \ m³ (标准) / 2,500,000 m³ (扩展货柜挂载模式)\n    -   **武器系统**:\n        -   **无**。虽然有预留的点防御基座，但绝大多数船东为了节省成本和电力，选择直接焊死。遇到海盗时，唯一的战术就是：“求救，然后硬抗”。\n\
  \    -   **特殊系统**:\n        -   无\n    -   **观星者需求**:\n        -   **低门槛**: 仅需3TW/mV的稳态即可驱动。\n\
  \n舰船单位模板:\n  舰船类型: JF\n  吨位: XL\n  驾驶员: ''\n  是否旗舰: true\n  观星者接口角色: ''\n  跃迁充能:\
  \ 0\n  最大充能: 3\n  跃迁消耗: 2\n  炮位配置: ''\n  装备槽位配置: 5H7L\n  船体护盾值: 3600\n  船体结构值: 8400\n\
  \  护盾值: 3600\n  结构值: 8400\n  装配资源:\n    PG: 620\n    CPU: 700\n  效果:\n    船体加成:\n\
  \    - 标准货舱容量 1250000 m³\n    - 扩展货柜挂载模式货舱容量 2500000 m³\n    内置电子系统:\n      基础CPU:\
  \ 内置民用运输舰载CPU。\n      基础侦测器: 内置民用航行侦测器。\n  装备: {}\n</ship_def>"
