content: "<ship_def>\n舰船类型: SC\n舰种: 隐形侦察巡洋舰\n舰体类别: 特种型\n-   级别: 麦哲伦级 (Magellan-class)\n\
  -   类型: 隐形侦察巡洋舰 (特种巡洋舰) CL\n-   价格: 380M (黑市/出口价格)\n-   形态: 舰体设计为了极致的隐形性能而牺牲了一切非必要的突出结构。它呈一个完美的、扁平的飞碟形状，直径约480米，厚度仅为60米。表面覆盖着HTC最先进的吸波材料，光滑如镜。舰体上下表面各对称分布着6个（共12个）内藏式无人机发射管，这种对称设计是为了在隐形力场开启时，避免因重力分布不均而产生的微弱引力波扰动。没有外挂炮塔，没有凸起的天线，就像是虚空中的一个幽灵切片。\n\
  -   制造商: 人类技术联合 (麦考夫特设计局)\n-   静态配置文件:\n    -   舰体全长: 480米 (直径)\n    -   标准船员配置:\
  \ 12人 (高度自动化，主要负责无人机整备与电子战，2人最低)\n    -   性能评级:\n        -   装甲: 8000 (轻薄，依赖隐形)\n\
  \        -   护盾: 12000\n        -   机动性: 65\n        -   火力输出: 4500 (无人机全弹射峰值)\n\
  \    -   武器系统:\n        -   主要系统: 12x 通用无人机/探针发射管 (可装填攻击无人机、隐形侦察探针或电子战无人机)\n   \
  \     -   次要系统: 4x 隐藏式近防激光 (仅在现形后可用)\n        -   攻击射程: 120000 km (无人机作战半径)\n  \
  \  -   特殊系统:\n        -   名称: 偏移式隐形跃迁驱动器\n        -   描述: 麦哲伦级的核心。通过在跃迁气泡外层包裹一层相位偏移力场，该舰能够在其光学和雷达隐形系统开启的状态下启动跃迁引擎。这意味着它可以悄无声息地进入星系，在没有任何预警的情况下出现在敌方舰队的侧翼或后方。然而，启动隐形跃迁后在跃迁结束后的30秒内，由于相位再校准，舰船的护盾回充将完全停止，且无法发射无人机。\n\
  \    -   观星者需求: 需要具备极高空间感和微操能力的观星者，以在复杂的相位偏移状态下维持跃迁航线的稳定，防止因相位抖动而暴露行踪。\n\n舰船单位模板:\n\
  \  舰船类型: SC\n  吨位: L\n  驾驶员: ''\n  是否旗舰: false\n  观星者接口角色: ''\n  跃迁充能: 0\n  最大充能:\
  \ 6\n  跃迁消耗: 1\n  炮位配置: 4M4S\n  装备槽位配置: 5H3L\n  船体护盾值: 1260\n  船体结构值: 900\n  护盾值:\
  \ 1260\n  结构值: 900\n  装配资源:\n    PG: 150\n    CPU: 440\n  效果:\n    船体加成:\n    -\
  \ 隐形、侦察与电子战无人机效果 +25%\n    - 隐形跃迁结束后 1 回合内护盾无法回充且无法发射无人机\n    内置电子系统:\n      基础CPU:\
  \ 内置侦察巡洋舰载CPU。\n      基础侦测器: 内置低可视多谱段侦测器。\n  装备: {}\n</ship_def>"
