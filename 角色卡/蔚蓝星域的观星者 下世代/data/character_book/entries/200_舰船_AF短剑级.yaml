content: |-
  <ship_def>
  级别: 短剑级
  别名: Dagger-class
  舰船类型: AF
  舰种: 突击护卫舰
  舰体类别: 高级型
  价格: 10M
  制造商: 赫克勒斯重工
  描述: 短剑级的标准舰级档案。
  舰船单位模板:
    舰船类型: AF
    吨位: S
    驾驶员: ''
    是否旗舰: false
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 8
    跃迁消耗: 1
    制造商: 赫克勒斯重工
    描述: 短剑级的标准舰级档案。
    炮位配置: 4S
    装备槽位配置: 5H4L
    装配资源:
      PG: 50
      CPU: 182
    效果:
      船体加成:
      - 小型集束激光伤害 +18%
      - 小型集束激光最佳射程 +15%
      - 装甲回复与维修效果 +25%
      - 跃迁扰断器作用距离 +20%
      装配减免:
      - 小型能量武器 PG需求 -1
      - 装甲维修与损管模块 CPU需求 -15%
      - 跃迁扰断模块 CPU需求 -10%
      内置电子系统:
        基础CPU: 内置舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置基础侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
      特殊系统:
        名称: 突击型损伤控制单元
        效果:
        - 当装甲低于 50% 时，回充 25% 装甲
        附加系统:
        - 名称: F-3型跃迁扰断力场发生器
          效果: 在 30000 km 内指定单一目标并阻止其启动跃迁引擎
    装备: {}
  静态档案:
    舰种: 突击护卫舰
    舰体类别: 高级型
    价格: 10M
    规格:
      舰体全长: 135米
      标准船员配置: 12人
    性能评级:
      装甲: 950
      护盾: 400
      机动性: 87
      火力输出: 500
    炮位明细:
    - 名称: S1
      尺寸: S
      类型: 聚焦能量炮座
      适配武器:
      - 集束激光
      - 脉冲激光
    - 名称: S2
      尺寸: S
      类型: 聚焦能量炮座
      适配武器:
      - 集束激光
      - 脉冲激光
    - 名称: S3
      尺寸: S
      类型: 导弹武器座
      适配武器:
      - 导弹发射器
      - 火箭弹发射器
    - 名称: S4
      尺寸: S
      类型: 防御武器座
      适配武器:
      - 点防御激光
      - 小型能量武器
    推荐装备方案:
    - 2x 小型集束激光
    - 1x 轻型导弹发射器
    - 1x 点防御激光
    观星者需求:
      控制门槛:
        最低稳态增益: 2.0 TW/mV
        最高精度误差: 2.2/1M
        最低比特率: 190 TB/s
      超载门槛:
        最低爆发增益: 4.4 TW/mV
        需要技能: 工程 V
        规则:
        - 爆发增益不足时，不可超载损管、主武器或跃迁扰断模块
        - 超载为 2 回合 1 次
        - 超载效果提高至原值的 150%
      接口要求: 能稳定处理高强度冲击与结构应力反馈
      特性要求:
      - 神经带宽要求不高
      - 心理韧性要求较高
  </ship_def>
