content: "<ship_def>\n级别: 黑鹰级\n别名: Black Hawk-class\n舰船类型: DN\n舰种: 无畏舰 DN (Dreadnought)\n\
  价格: 12B (造价) / 300B+ (黑市收藏价)\n制造商: 人类技术联合\n描述: 舰体呈一个完美的、巨大的黑色飞碟形状，直径约3200米。表面覆盖着能够吸收几乎所有频段雷达波的特种吸波材料。在非战斗状态下，它看起来就像是一个漂浮在太空中的巨大黑色圆盘。当武器系统激活时，飞碟的边缘会裂开，露出内部密密麻麻的鱼雷加速发射管和无人机弹射口。其推进器也是内藏式的，喷口经过特殊冷却处理，几乎没有红外特征。\n\
  舰船单位模板:\n  舰船类型: DN\n  吨位: XL\n  驾驶员: ''\n  是否旗舰: true\n  观星者接口角色: ''\n  跃迁充能: 0\n\
  \  最大充能: 5\n  跃迁消耗: 4\n  制造商: 人类技术联合\n  描述: 舰体呈一个完美的、巨大的黑色飞碟形状，直径约3200米。表面覆盖着能够吸收几乎所有频段雷达波的特种吸波材料。在非战斗状态下，它看起来就像是一个漂浮在太空中的巨大黑色圆盘。当武器系统激活时，飞碟的边缘会裂开，露出内部密密麻麻的鱼雷加速发射管和无人机弹射口。其推进器也是内藏式的，喷口经过特殊冷却处理，几乎没有红外特征。\n\
  \  炮位配置: 12XL2L\n  装备槽位配置: 7H5L\n  船体护盾值: 15400\n  船体结构值: 11000\n  护盾值: 15400\n\
  \  结构值: 11000\n  装配资源:\n    PG: 1800\n    CPU: 1800\n  效果:\n    船体加成:\n    - 旗舰型舰船；依据舰级定位应用：无畏舰\
  \ DN (Dreadnought)。\n    - 装配资源与槽位由本舰船独立定义，不应用常规舰级倍率公式。\n    装配减免: []\n    内置电子系统:\n\
  \      基础CPU: 内置旗舰级舰载CPU；跟踪与ECCM按电子战规则计算。\n      基础侦测器: 内置旗舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。\n\
  \      旗舰指挥链: 内置多观星者并联与舰队级指挥链；具体接口需求见舰船条目。\n    特殊系统:\n    - 名称: 超大型物质偏移模块\n   \
  \   描述: 除了常规的光学和雷达隐形外，该系统能将舰船的相位略微偏移出当前光锥。虽然因为巨大的能耗和质量无法在隐形状态下启动跃迁引擎，但它允许“黑鹰”级在常规航行中几乎完全消失。结合其“能量回收”护盾系统，被击中时护盾发生器产生的废热和紊乱能量会被导回系统，维持隐形力场的稳定，只要护盾不破，隐形就能在受击后极短时间内恢复。\n\
  \    - 名称: 精确量子定位仪\n      描述: 其发射的重型鱼雷在离开发射管后，会利用自带的微型跃迁核心进行一次短距的量子传送。鱼雷会分解为亚原子粒子流，瞬间跨越数万公里的距离，直接在目标舰船的近防炮射程内（约1000-2000公里处）重组并点火冲刺。这使得拦截这种鱼雷几乎是不可能的任务，因为留给点防御系统的反应时间只有零点几秒，而其他的重型鱼雷在量子传送后落地距离可能在8000km外。\n\
  \  装备: {}\n</ship_def>"
