    制造商: 辛迪加联合太空公司 (SJSC.inc) - 多家企业联合制造
    描述: 舰体是一个协调的蓝灰色模块化平台。核心来自四个不同的企业亲密无间的合作，上面挂载了密密麻麻的武器模块、护盾发生器、引擎和居住区。舰首是一个可开合的工业作业平台，既可以作为武器发射口，也能在非战斗时用于开采小行星。
    炮位配置: 8XL8C1T
    装备槽位配置: 9H6L
    船体护盾值: 42000
    船体结构值: 30000
    护盾值: 42000
