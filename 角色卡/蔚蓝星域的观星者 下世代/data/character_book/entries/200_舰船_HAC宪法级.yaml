content: |-
  <ship_def>
  级别: 宪法级
  别名: ''
  舰船类型: HAC
  舰种: 重型突击巡洋舰 (高级巡洋舰) CA
  价格: 301M
  制造商: 联邦航空航天局第620设计所
  描述: 舰体呈经典的碟形，中心隆起部分是舰桥和反应堆所在，圆盘边缘均匀分布着武器炮塔和传感器阵列。通体覆盖着联邦标志性的哑光白色装甲，表面光滑，没有任何多余的装饰，充满了功能主义的美感。
  舰船单位模板:
    舰船类型: HAC
    吨位: L
    驾驶员: ''
    是否旗舰: false
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 6
    跃迁消耗: 2
    制造商: 联邦航空航天局第620设计所
    描述: 舰体呈经典的碟形，中心隆起部分是舰桥和反应堆所在，圆盘边缘均匀分布着武器炮塔和传感器阵列。通体覆盖着联邦标志性的哑光白色装甲，表面光滑，没有任何多余的装饰，充满了功能主义的美感。
    炮位配置: 8M12C
    装备槽位配置: 9H5L
    装配资源:
      PG: 288
      CPU: 608
    效果:
      船体加成:
      - 依据舰级定位应用：重型突击巡洋舰 (高级巡洋舰) CA。
      装配减免: []
      内置电子系统:
        基础CPU: 内置巡洋舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置巡洋舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
      特殊系统:
        名称: 战术跃迁核心稳定器
        描述: 激活后，该系统会从主反应堆中抽取额外能量，在跃迁核心周围生成一个高强度的时空稳定力场。该力场能够有效抵消外部的跃迁干扰信号。在此系统运行期间，舰船的跃迁核心稳定强度将获得 **+2** 的增益，这意味着敌方需要至少三点强度的跃迁干扰才能阻止其跃迁。然而，该系统能耗巨大，会显著降低武器系统的回充速度。有经验的指挥官会撤走护盾被清空的宪法级。
    装备: {}
  静态档案:
    观星者需求: 需要具备极高神经稳定性的观星者，能够承受稳定器启动时对跃迁核心产生的巨大能量负荷，并长时间维持高强度的护盾输出。
    旧版描述: |-
      -   级别: 宪法级
      -   类型: 重型突击巡洋舰 (高级巡洋舰) CA
      -   价格: 301M
      -   形态: 舰体呈经典的碟形，中心隆起部分是舰桥和反应堆所在，圆盘边缘均匀分布着武器炮塔和传感器阵列。通体覆盖着联邦标志性的哑光白色装甲，表面光滑，没有任何多余的装饰，充满了功能主义的美感。
      -   制造商: 联邦航空航天局第620设计所
      -   静态配置文件:
          -   舰体全长: 575米 (直径)
          -   标准船员配置: 16人
          -   性能评级:
              -   装甲: 18000
              -   护盾: 25000
              -   机动性: 50
              -   火力输出: 3000
          -   武器系统:
              -   主要系统: 8x PLS-M 中型阳电子炮塔
              -   次要系统: 12x 防御无人机发射巢
              -   攻击射程: 105000 km
          -   特殊系统:
              -   名称: 战术跃迁核心稳定器
              -   描述: 激活后，该系统会从主反应堆中抽取额外能量，在跃迁核心周围生成一个高强度的时空稳定力场。该力场能够有效抵消外部的跃迁干扰信号。在此系统运行期间，舰船的跃迁核心稳定强度将获得 **+2** 的增益，这意味着敌方需要至少三点强度的跃迁干扰才能阻止其跃迁。然而，该系统能耗巨大，会显著降低武器系统的回充速度。有经验的指挥官会撤走护盾被清空的宪法级。
          -   观星者需求: 需要具备极高神经稳定性的观星者，能够承受稳定器启动时对跃迁核心产生的巨大能量负荷，并长时间维持高强度的护盾输出。
  </ship_def>
