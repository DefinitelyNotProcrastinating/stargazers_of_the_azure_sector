  <星系总览>
  ### 星图与跃迁规则
  | 类别 | 项目 | 规则 |
  | :--- | :--- | :--- |
  | 索引 | 星图层级 | 星域 > 星座 > 星系 > 最近星体 > 具体位置 |
  | 索引 | 启动规则 | 本条目常驻，只提供索引、导航硬规则和一句话简介；任何星域、星座、国家或势力的详细设定由对应触发条目补充。 |
  | 跃迁 | 同星座 | 单次跃迁仅限同星座内。 |
  | 跃迁 | 跨星座 | 需要多次跃迁。 |
  | 跃迁 | 跨星域 | 优先使用先驱者暗物质隧道、星门或大型虫洞；常规跃迁通常需要40-60跳。 |
  | 跃迁 | 虫洞 | 不稳定虫洞会在数小时或数天内随机变化或坍塌，目的地常为未知虫洞星域。 |
  | 连接符号 | `<==>` | 星域级稳定移动方式，包含星门、大型虫洞或先驱者管道。 |
  | 连接符号 | `↔` | 星区级跃迁航线。 |
  | 连接符号 | `<~>` | 不稳定虫洞连接。 |
  | 导航 | 位置格式 | 星域\|星座\|星系名称\|最近星体\|具体位置 |
  | 导航 | 空间站格式 | 星域\|星座\|星系名称\|最近星体\|星体名 空间站名 |
  | 导航 | 禁止事项 | 不允许瞬移；跨星域旅行必须经过指定星门、管道或虫洞。 |
  | 导航 | 星门名 | Ω-1、Σ-4、Σ-7、Φ-7、Φ-9、Λ-2、Γ-10、X-783 必须写准。 |
  | 导航 | 星系命名 | 始源之环以外通常使用 AB-XXXX 格式；例如 NC-959 表示新应许之地-959 星系。 |
  | 导航 | 空间站命名 | 通常使用 AB-XXXX-X 轨道空间站 或 星体名 设施名。 |

  ### 安等与军力尺度
  | 类别 | 范围或对象 | 含义 |
  | :--- | :--- | :--- |
  | 安等 | -1000以下 | 高维度敌对实体横行。 |
  | 安等 | -1000到0 | 绝对无法无天。 |
  | 安等 | 0到50 | 巡逻极少，海盗、走私者和军事行动常见。 |
  | 安等 | 50到70 | 巡逻中等，警用舰队反应较慢。 |
  | 安等 | 70到90 | 巡逻频繁，空间站附近相对安全。 |
  | 安等 | 90到100 | 首都、船坞或核心星系，有警用舰队和军队共同把守。 |
  | 军力 | 帝国级国家 | 各有几十万艘战斗飞船和更多民用飞船，才能控制星域。 |
  | 军力 | 海盗势力 | 小型数百艘，大型可达数千至上万艘飞船。 |
  </星系总览>

