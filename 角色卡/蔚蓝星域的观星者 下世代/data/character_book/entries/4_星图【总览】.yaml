content: |-
  <星系总览>
  星图层级: 星域 > 星座 > 星系 > 最近星体 > 具体位置
  启动规则: 本条目常驻，只提供索引、导航硬规则和一句话简介；任何星域/星座/国家/势力的详细设定由对应触发条目补充。
  跃迁规则:
    同星座: 单次跃迁仅限同星座内。
    跨星座: 需要多次跃迁。
    跨星域: 优先使用先驱者暗物质隧道、星门或大型虫洞；常规跃迁通常需要40-60跳。
    虫洞: 不稳定虫洞会在数小时或数天内随机变化或坍塌，目的地常为未知虫洞星域。
  连接符号:
    "<==>": 星域级稳定移动方式，包含星门/大型虫洞/先驱者管道。
    "↔": 星区级跃迁航线。
    "<~>": 不稳定虫洞连接。
  导航硬规则:
    位置格式: 星域|星座|星系名称|最近星体|具体位置
    空间站格式: 星域|星座|星系名称|最近星体|星体名 空间站名
    禁止: 不允许瞬移；跨星域旅行必须经过指定星门/管道/虫洞。
    星门名: Ω-1、Σ-4、Σ-7、Φ-7、Φ-9、Λ-2、Γ-10、X-783 必须写准。
    星系命名: 始源之环以外通常使用 AB-XXXX 格式；例如 NC-959 表示新应许之地-959 星系。
    空间站命名: 通常使用 AB-XXXX-X 轨道空间站 或 星体名 设施名。
  安等:
    "-1000以下": 高维度敌对实体横行。
    "-1000到0": 绝对无法无天。
    "0到50": 巡逻极少，海盗、走私者和军事行动常见。
    "50到70": 巡逻中等，警用舰队反应较慢。
    "70到90": 巡逻频繁，空间站附近相对安全。
    "90到100": 首都/船坞/核心星系，有警用舰队和军队共同把守。
  军力尺度:
    帝国级国家: 各有几十万艘战斗飞船和更多民用飞船，才能控制星域。
    海盗势力: 小型数百艘，大型可达数千至上万艘飞船。
  </星系总览>

  <星域索引>
  - 星域: 始源之环
    简介: 人类文明的摇篮，四大势力核心疆域，航线最密，冲突最烈。
    星座:
      - 太阳禁卫区: 泰拉帝国首都泰拉所在地，宏伟古典且管制极严。
      - 共和国之心: 自由世界共和国心脏，商业繁荣、思想自由、情报密集。
      - 天鹅座摇篮: 天鹅座技术联邦科技与工业中心，戴森云与研究站密布。
      - 贸易风走廊: 连接三大强权的黄金航道，财富与罪恶交织。
  - 星域: 蛮荒边界
    简介: 帝国势力边缘，机遇与亡命徒共存的法律真空。
    星座:
      - 巨蛇之喉: 铁血盟约主宰的残骸都市与银河最大黑市之一。
      - 避难所星团: 星火姐妹会的脉冲星避风港，叛逃者与秘密基地聚集。
      - 卡戎之渡: 废弃战场与太空坟场，小型掠夺团体活动频繁。
  - 星域: 遗忘之海
    简介: 远离核心的深空，布满古老秘密、先驱遗迹和未知异常。
    星座:
      - 幽灵之幕: 人类技术联合隐藏在暗物质星云深处的秘密根据地。
      - 先驱者之墓: 时空结构脆弱的考古禁区，自动防御系统仍在运作。
      - 阿比斯深渊: 以超大质量黑洞为中心的极端引力异常区。
  - 星域: 天穹王冠
    简介: 银河上方的破碎王冠，是帝国秩序与自由贸易的交汇跳板。
    星座:
      - 钴蓝边境: 辛迪加与独立军阀争议区，灰色贸易和非法采矿频繁。
      - 暗红星座: 泰拉帝国军事管制要塞区，红巨星光辉下的战略咽喉。
      - 璨辉星座: 帝国与辛迪加联合管理的奢华自由贸易区。
  - 星域: 天堂之阶
    简介: 通往银河核心的门户，旧殖民前线与新边境博弈并存。
    星座:
      - 新应许之地: 大量类地行星引发的殖民争夺已降为低烈度长期对峙。
      - 黄金阶梯: 塔伯里斯与四大国家交界的新争夺区，围绕通道、贸易与边境秩序角力。
      - 静谧之海: 联邦深空探索舰队寻找科学现象与先驱遗迹的前沿。
  - 星域: 闪光星云
    简介: 年轻恒星和电离气体构成的壮丽星云，光学传感器效果大幅下降。
    星座:
      - 塔伯里斯星座: 塔伯里斯宪制帝国核心腹地，戴森云掩护下的合成人文明工业心脏。
  - 星域: 大荒野
    简介: 资源丰富但环境恶劣的边疆星域，法律空白且逐光虫活跃。
    星座:
      - 暗色星座: 塔伯里斯宪制帝国与铁血盟约争夺的武装采矿区。
      - 女妖星旋: 双中子星构成的极端引力与辐射航道。
  - 星域: 未知虫洞星域
    简介: 通过不稳定虫洞进入的神秘区域，物理法则可能与已知宇宙不同。
    星座:
      - W-J0001A 无星之海: 完全虚无的口袋宇宙，中心悬浮1:4:9方块。
      - W-B2005C 自我倒影: 高维存在残渣污染的精神危害空间。
      - W-C1101B 大陆架: 通向未知宇宙的单向超空间裂隙。
  </星域索引>
