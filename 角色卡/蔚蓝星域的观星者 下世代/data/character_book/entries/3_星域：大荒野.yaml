content: |-
  <星域>
  星域: 大荒野
  简介: 资源丰富但环境恶劣的边疆星域，法律的真空地带。
  星座:
    - 名称: 暗色星座
      编码: MC-XXX
      英文名: Murky Constellation
      主权: 塔伯里斯宪制帝国 / 铁血盟约（争议区）
      星系数量: 约888,400个
      本地太空特征: 高度放射性的熔岩行星，以及双方势力建造的武装采矿平台。
      描述: 以8个熔融星球为主的星系群，塔伯里斯自动化船坞与铁血盟约秘密矿场犬牙交错，是双方围绕战略矿产和舰船产能长期拉扯的争议区。
      威胁: 塔伯里斯工业舰队；铁血盟约私掠舰队；逐光虫（高度）。
      安等: -200
      航线:
        - "<==> 蛮荒边界 | 巨蛇之喉（先驱者星门“Σ-4通道”，1跳）"
        - "↔ 女妖星旋（跃迁，15跳）"
    - 名称: 女妖星旋
      编码: BV-XXX
      英文名: Banshee's Vortex
      主权: 无
      星系数量: 2个（中子星系统）
      本地太空特征: 强大引力场和X射线暴，任何常规护盾都会被迅速剥离。
      描述: 两颗中子星相互绕行形成的极端引力与辐射环境，是宇宙中最危险的航道之一。
      威胁: 极端引力与辐射；逐光虫巢穴（极度）。
      安等: -500
      航线:
        - "↔ 暗色星座（15跳）"
  </星域>
