keys: []
content: |-
  <variable_list>
  Here are the variable lists. There will be no additional variables to consider.

  **核心系统**
  *   `string time` (特殊变量, ISO 8601格式)
  *   `int 主角.所处位置安全等级`
      *   `安等根变量，范围建议为 -100 到 100`

  **主角核心**
  *   `string 主角.位置`
  *   `string 主角.外貌`
  *   `string 主角.背景故事`（既定个人档案；不拆分为技能、等级或经验变量）
  *   `number 主角.信用点`（信用点唯一真值）
  **主角资产**
  *   `object 主角.库存`
      *   `格式: {"矿物": number, "食物": number, "金属": number, "补给": number}`
      *   `当前使用统一库存，不按星区划分；信用点仍存放于 主角.信用点`
      *   `剧情资源变化可对具体路径使用 delta；工业周期结算由SAM独占`
  *   `object 主角._工业系统`（SAM只读运行态，不发送给AI）
  *   `object 主角.工业资产简表`（AI只读：名称、类型、位置、状态、描述）
  *   `object 主角.特殊事件`（AI只读；结束事件只能调用 close_event(id)）
  *   `object 主角.科研进展`（AI只读）
  *   `object 主角.可攻略角色`
      *   `格式: {"object_name": Object}`
      *   `object_name` 就是角色唯一名称 / 显示名，必须外移为对象键
      *   `每个角色都必须至少有 种族 字段`
      *   `若 种族 = 观星者，则必须拥有 品质、充能数量、比特率、精度、稳态增益、爆发增益等观星者专属结构与数值`
      *   `观星者品质只允许 标准/衍生/精良/上等/先进/高级/唯一；实际充能读取独立数值字段 充能数量`
  *   `object 主角.舰船`
      *   `格式: {"object_name": Object}`
      *   `object_name` 就是舰船唯一名称，必须外移为对象键
      *   `每艘舰船必须拥有 吨位、每日补给消耗、炮位配置、装备槽位配置、船体护盾值、船体结构值、护盾值、结构值、装配资源、效果、装备`
      *   `工业舰可有稀疏输入/输出，但二者禁止包含补给；舰船不会触发随机事件`
  *   `object 主角.物品栏`
      *   `格式: {"物品名": {"品质": int, "堆叠": number, "效果": {"效果名": "量化描述"}, "描述": string}}`
      *   `主角全部可存取物品只存放于此处；舰船的装备字段只记录已装配装备`
  *   `object 主角.任务`
      *   `格式: {"object_name": Object}`
  *   `object 主角.建筑`
      *   `格式: {"object_name": Object}`
      *   `仅存放固定太空设施、轨道炮塔、空间站、船坞、采矿平台等建筑对象`
      *   `产业建筑只使用稀疏输入/输出；不存在产业模板、产业模型、每日维护或独立库存`
      *   `防御指数为0至100；随机事件只以建筑为目标`

  **星区新闻**
  *   `object 新闻`
      *   `固定包含 大事件1-3、本地事件1-3、邂逅1-3 九个字符串槽位`

  **势力声望**
  *   `int 势力声望.泰拉帝国`
  *   `int 势力声望.自由世界共和国`
  *   `int 势力声望.天鹅座技术联邦`
  *   `int 势力声望.猎户座辛迪加`
  *   `int 势力声望.星火姐妹会`
  *   `int 势力声望.铁血盟约`
  *   `int 势力声望.人类技术联合`
  *   `int 势力声望.保存者姐妹会`
  *   `int 势力声望.海盗势力`

  ---
  </variable_list>
