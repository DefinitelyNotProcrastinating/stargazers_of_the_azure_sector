keys:
- 节点单元
- 集群节点单元
content: |-
  <ship_def>
  级别: 节点单元
  文明: 漂泊集群
  舰船类型: CVL
  舰种: 战列舰吨位航母
  舰体全长: 2400米
  船体类型: 例外型
  原生标准船员: 0
  形态: 开放多边环围绕中央传送核心，两座综合机库直接嵌入环架，内部填满线路和约束装置，没有驾驶舱与乘员走廊。
  定位: 战列舰吨位的无人航母、战术传送协调与舰载机火控节点；不属于战列舰。
  分布: 外环集群原生遗迹。
  驾驶限制: 原生版本无人，内部没有可用乘员空间，原生传送会杀死生物乘客。
  观星者需求: 原生无人版本无需观星者；不能将人类观星者直接接入其原生传送系统。
  超空间说明: 缓存、短距传送、节点减耗和稳定性规则见漂泊集群触发区。模板保存基础消耗，动态支援不得永久改写船体白值。
  参考满编火力每dt: 33400
  火力说明: 仅为全部默认武器可同时攻击时的未命中/防御结算前合计，不能作为额外武器重复造成伤害；机群伤害另受减员与接敌限制。
  舰船单位模板:
    文明: 漂泊集群
    舰船类型: CVL
    每日补给消耗: 50
    吨位: XL
    驾驶员: ''
    是否旗舰: true
    观星者接口角色: ''
    超空间充能: 0
    最大充能: 4
    超空间消耗: 3
    制造商: 漂泊集群标准化工业平台
    描述: 战列舰吨位的无人航母、战术传送协调与舰载机火控节点；不属于战列舰。
    炮位配置: 2L2C
    装备槽位配置: 7H5L
    船体护盾值: 90000
    船体结构值: 15000
    护盾值: 90000
    结构值: 15000
    护盾DR: 35%
    结构DR: 20%
    护盾装甲: 90
    结构装甲: 150
    装配资源:
      PG: 2100
      CPU: 2200
    效果:
      船体加成:
      - 原生无人战体；最终白值按本档案读取，不重复乘人类品质或国家倍率。
      - 两条血条：护盾与结构；H/L槽数按现行舰级上限。
      装配减免: []
      内部结构:
        光子凝聚器: 完好
      内置电子系统:
        电子品质: 11
        内置跟踪: 39
        内置ECCM: 13
        侦测值: 26
        侦测距离km: 350000
        叠加规则: 内置跟踪已包含CPU和侦测器，不重复计算；外装模块另计。
      机动评级: 55
      闪避值: 10
      超空间核心稳定强度: 1
      原生超空间准备时间秒: 20
      特殊系统:
        节点网络范围: 250000km；同舰队、有效链路且核心完好时生效。
        超空间准备时间倍率: 0.25
        超空间准备时间下限秒: 1
        同行超空间消耗修正: -1
        有效超空间消耗下限: 0
        战斗机与轰炸机命中侧加值: 4
        叠加规则: 节点效果不重复叠加；命中属于外界增幅取最高。零充能例外、失效与行动规则见集群触发区。
    装备:
      重型光粒_1:
        品质: 12
        效果:
          伤害: 4200
          冷却: 1dt
          基础命中: 4
          跟踪: 0.02
          稳定射程: 90000km
          AP: 0%
          DRP: 0%
          衰竭: 稳定射程外伤害0；射程内不散射
          结算: 最终原生白值，不再乘品质倍率
        安装限定:
          船体文明: 漂泊集群
          所需内部结构:
          - 光子凝聚器
        装配要求: PG：100 | CPU：100 | 吨位：L | 炮位：1L | 装备槽位：无
        描述: 集群原生光粒发射器；只能安装在保有完好内部光子凝聚器的集群舰船上，不能跨文明移植。
      重型光粒_2:
        品质: 12
        效果:
          伤害: 4200
          冷却: 1dt
          基础命中: 4
          跟踪: 0.02
          稳定射程: 90000km
          AP: 0%
          DRP: 0%
          衰竭: 稳定射程外伤害0；射程内不散射
          结算: 最终原生白值，不再乘品质倍率
        安装限定:
          船体文明: 漂泊集群
          所需内部结构:
          - 光子凝聚器
        装配要求: PG：100 | CPU：100 | 吨位：L | 炮位：1L | 装备槽位：无
        描述: 集群原生光粒发射器；只能安装在保有完好内部光子凝聚器的集群舰船上，不能跨文明移植。
      集群战斗机中队_1:
        品质: 12
        效果:
          伤害: 9000
          冷却: 1dt
          跟踪: 0.04
          作战半径: 180000km
          编制: 40
          当前架数: 40
          可被点防御: true
          AP: 0%
          DRP: 0%
          机载光粒稳定射程: 6000km
          结算: 满编每1dt总伤害，减员乘当前架数/40；最终原生白值，不再乘品质倍率
        安装限定:
          船体文明: 漂泊集群
          所需内部结构:
          - 光子凝聚器
        装配要求: PG：175 | CPU：325 | 吨位：C | 炮位：1C | 装备槽位：无
        描述: 40架集群无人战斗机，以机载光粒承担制空、拦截与护航。
      集群轰炸机中队_2:
        品质: 12
        效果:
          伤害: 16000
          冷却: 1dt
          跟踪: 0.018
          作战半径: 220000km
          编制: 40
          当前架数: 40
          可被点防御: true
          AP: 0%
          DRP: 0%
          机载光粒稳定射程: 6000km
          结算: 满编每1dt总伤害，减员乘当前架数/40；最终原生白值，不再乘品质倍率
        安装限定:
          船体文明: 漂泊集群
          所需内部结构:
          - 光子凝聚器
        装配要求: PG：240 | CPU：380 | 吨位：C | 炮位：1C | 装备槽位：无
        描述: 40架集群无人轰炸机，以重型光粒攻击大型舰船与固定设施。
  </ship_def>
