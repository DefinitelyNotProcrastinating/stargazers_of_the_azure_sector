content: |-
  <ship_def>
  级别: 寡妇级
  别名: Widow-class
  舰船类型: ESC
  舰种: 干扰巡洋舰 (特种巡洋舰)
  价格: 270M
  制造商: 远环星球动力
  描述: 舰体设计得极为不对称且充满了侵略性。船体一侧是巨大的引擎模块和居住区，另一侧则完全被一个狰狞的、如同蛛腿般上下展开的巨型牵引光束发生器占据。整艘船看起来就像一只潜伏在阴影中的捕食性节肢动物，充满了危险而原始的美感。
  舰船单位模板:
    舰船类型: ESC
    吨位: L
    驾驶员: ''
    是否旗舰: false
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 6
    跃迁消耗: 2
    制造商: 远环星球动力
    描述: 舰体设计得极为不对称且充满了侵略性。船体一侧是巨大的引擎模块和居住区，另一侧则完全被一个狰狞的、如同蛛腿般上下展开的巨型牵引光束发生器占据。整艘船看起来就像一只潜伏在阴影中的捕食性节肢动物，充满了危险而原始的美感。
    炮位配置: 4S
    装备槽位配置: 5H3L
    船体护盾值: 1260
    船体结构值: 900
    护盾值: 1260
    结构值: 900
    装配资源:
      PG: 288
      CPU: 608
    效果:
      船体加成:
      - 特种巡洋舰；依据舰级定位应用：干扰巡洋舰 (特种巡洋舰)。
      装配减免: []
      内置电子系统:
        基础CPU: 内置特种巡洋舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置特种巡洋舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
      特殊系统:
      - 名称: 重型停滞光束
        描述: 一种极其耗能的时空拖拽武器。它发射的并非传统意义上的牵引光束，而是一道能够制造局部时空曲率异常的能量场。被该能量场笼罩的舰船，其推进器出力会被极大削弱，跃迁引擎更是会因为时空参照系被扰乱而无法启动。该系统拥有高达**5点**的跃迁干扰强度，足以困住大多数常规舰船，能同时造成强减速和跃迁干扰。然而，维持这道“蛛网”需要消耗惊人的能量，一旦启动，“寡妇”级自身的护盾回充速度将下降90%，使其成为战场上一个极其脆弱的优先目标，且必须关闭之后才能跃迁。
    装备: {}
  </ship_def>
