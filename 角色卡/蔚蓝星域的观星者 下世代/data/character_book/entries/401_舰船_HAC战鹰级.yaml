  <ship_def>
  级别: 战鹰级
  别名: ''
  舰船类型: HAC
  舰种: 重型突击巡洋舰 (高级巡洋舰) CA
  价格: 200M
  制造商: 索鲁斯集团
  描述: 舰体线条极具侵略性，呈流线型的矛头状。巨大的引擎喷口占据了舰体后部的大部分空间，两侧的武器模块被整合在舰体侧面的机翼结构和舰体头部上。整艘船看起来就像一头准备捕食的猛禽，充满了速度与力量感。
  舰船单位模板:
    舰船类型: HAC
