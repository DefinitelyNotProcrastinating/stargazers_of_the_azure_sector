    跃迁消耗: 2
    制造商: 索鲁斯集团
    描述: 舰体线条极具侵略性，呈流线型的矛头状。巨大的引擎喷口占据了舰体后部的大部分空间，两侧的武器模块被整合在舰体侧面的机翼结构和舰体头部上。整艘船看起来就像一头准备捕食的猛禽，充满了速度与力量感。
    炮位配置: 6M4S
    装备槽位配置: 5H3L
    船体护盾值: 1680
    船体结构值: 1200
    护盾值: 1680
    结构值: 1200
    装配资源:
      PG: 288
      CPU: 608
    效果:
      船体加成:
      - 依据舰级定位应用：重型突击巡洋舰 (高级巡洋舰) CA。
      装配减免: []
      内置电子系统:
        基础CPU: 内置巡洋舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置巡洋舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
      特殊系统:
        名称: 紧急护盾注入器
        描述: 该系统连接着数个一次性使用的超高密度电容器组。当舰船护盾濒临崩溃时，舰长可以激活此系统。在1.5秒的延迟后，电容器组会将储存的全部能量瞬间释放到护盾发生器中，使其护盾值在极短时间内完全恢复。这是一项强大的生存技能，但也代价高昂。每次使用都会消耗一组电容器，补充这些电容器需要在空间站或大型补给舰上进行，且费用不菲。
    装备: {}
  </ship_def>
