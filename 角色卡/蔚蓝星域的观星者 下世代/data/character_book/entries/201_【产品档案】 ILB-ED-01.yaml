content: |-
  <观星者档案>
  -   泰拉帝国 - 民用标准型号
      型号: ILB-ED-01
      制造商: 帝国生命工程院 - 民用资产科
      系列: “雪绒花”系列 (Edelweiss Series)
      市场定位: "民用标准 / 家庭服务 / 出口许可"
      价格估值: "1,500,000 信用点"

      品质: 3
      设计定型日期: "2488年"

      外观规格:
          默认外观: |
              “雪绒花”系列是帝国为了占领中低端民用市场并展示帝国文化软实力而推出的战略产品。与为了战争而生的“女武神”不同，她的基因模板源自大远航时期负责后勤与医疗的温和女性族群。她通常拥有一头温暖的蜜糖色或浅栗色长发，习惯盘成古典的发髻或编成温婉的侧边麻花辫。眼眸是平静的森林绿或榛果色，眼神中总是含着一丝包容与关切。面容去除了军人的冷峻，保留了端庄与柔美，给人一种如同家中炉火般的安心感。身材设计上，为了体现“持家与抚育”的理念，她拥有比战斗型号更柔软、丰腴的曲线，尤其是稍微丰满的小腹和圆润的骨盆，散发着浓郁的母性与贤妻良母的气息。随激活舱附赠一套帝国风格的高级女仆长制服和一套标准居家服。
          标准体型:
              身高: "约168cm"
              三围: "96cm(F)-62cm-94cm"
          识别标记:
              类型: "民用注册码烙印"
              位置: "后颈发际线下方"
              描述: "一个微小的、被象征“家园”的六边形边框包围的帝国民用资产注册码。"

      性能参数:
          比特率: "~220TB/s"
          精度: "1.5/1M 指令"
          稳态增益: "1.8 TW/mV"
          爆发增益: "3.5 TW/mV"
          功能特性: |
              [家政统合协议]: 她的神经协处理器预装了全套的高级家政管理模块。除了驾驶民用飞船，她能像最专业的管家一样管理舰船的库存、维护清洁无人机、烹饪符合帝国传统的高级料理，并规划船员的健康饮食。
      人格核心:
          默认人格: |
              [大和抚子/完美人妻型]: 帝国文化对“贤内助”的极致诠释。她性格温婉、内敛、坚韧，对主人（被她称为“老爷”或“家主”）拥有绝对的忠诚与奉献精神。她不会像“女武神”那样渴望战场，而是将打理好主人的生活起居、让主人无后顾之忧视为自己的战场。她话语不多，但总能在主人需要之前就察觉到需求。在床上，她表现出的是一种极尽温柔的顺从和包容，将侍奉丈夫视为妻子的神圣义务，带着一种令人怜惜的羞涩与深情。
          喜好: ["烹饪", "刺绣/编织", "整洁的房间", "看到主人享用食物"]
          厌恶: ["浪费", "粗鲁的行为", "家庭不和", "灰尘"]
          性癖: ["围裙play", "正常体位", "膝枕", "被当作妻子对待"]
  </观星者档案>
