content: |-
  <ship_def>
  级别: 执行官级
  别名: Executor-class
  舰船类型: CV
  舰种: 超级航母 CV
  价格: 90B
  制造商: 辛迪加联合政府造船厂
  描述: 舰体呈一个巨大的U型结构，充满了辛迪加标志性的模块化和工业化风格。U型结构中间的巨大开放式船坞，足以同时容纳三到四艘巡洋舰进行紧急维修和补给。舰体两侧和后部是标准化的货柜挂点、无人机机库和模块化的居住区，整艘船看起来就像一座能够移动的星际港口。
  舰船单位模板:
    舰船类型: CV
    吨位: XL
    驾驶员: ''
    是否旗舰: true
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 5
    跃迁消耗: 4
    制造商: 辛迪加联合政府造船厂
    描述: 舰体呈一个巨大的U型结构，充满了辛迪加标志性的模块化和工业化风格。U型结构中间的巨大开放式船坞，足以同时容纳三到四艘巡洋舰进行紧急维修和补给。舰体两侧和后部是标准化的货柜挂点、无人机机库和模块化的居住区，整艘船看起来就像一座能够移动的星际港口。
    炮位配置: 78C
    装备槽位配置: 9H11L
    装配资源:
      PG: 1250
      CPU: 1850
    效果:
      船体加成:
      - 旗舰型舰船；依据舰级定位应用：超级航母 CV。
      - 装配资源与槽位由本舰船独立定义，不应用常规舰级倍率公式。
      装配减免: []
      内置电子系统:
        基础CPU: 内置旗舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置旗舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
        旗舰指挥链: 内置多观星者并联与舰队级指挥链；具体接口需求见静态档案。
      特殊系统:
      - 名称: “资产保全”协议
        描述: 一套集维修、补给、改装于一体的综合后勤管理系统。激活后，船坞内的所有维修系统效率提升50%。更重要的是，它能让“执行官”级对停靠的友军巡洋舰进行快速的“战地改装”。通过预置的模块化武器和防御套件，它可以在短短几分钟内，将一艘通用的“龙马”级巡洋舰改装成专职的防空舰或重炮舰，以应对不断变化的战场需求。这赋予了辛迪加舰队无与伦比的战术灵活性。
    装备: {}
  静态档案:
    观星者需求: 需要四名观星者进行并联的“内部程序通讯”（IPC）协作才能运行。这套复杂的系统确保了超级航母庞大身躯的稳定跃迁（跃迁核心稳定+20），但代价是指令传导链条更长，使其战术反应速度远慢于常规舰船。
    旧版描述: |-
      “活到最后的人才是胜利者。”——奇戎基因前任CEO，德文·辛克莱
      -   级别: 执行官级 (Executor-class)
      -   类型: 超级航母 CV
      -   价格: 90B
      -   形态: 舰体呈一个巨大的U型结构，充满了辛迪加标志性的模块化和工业化风格。U型结构中间的巨大开放式船坞，足以同时容纳三到四艘巡洋舰进行紧急维修和补给。舰体两侧和后部是标准化的货柜挂点、无人机机库和模块化的居住区，整艘船看起来就像一座能够移动的星际港口。
      -   制造商: 辛迪加联合政府造船厂
      -   静态配置文件:
          -   舰体全长: 5500米
          -   标准船员配置: 1500人
          -   性能评级:
              -   装甲: 130000
              -   护盾: 270000
              -   机动性: 22
              -   火力输出: 20000 (自卫无人机)
              -   回复量: 80000 (维修光束与维修无人机)
          -   武器系统:
              -   主要系统: 3x “执行”级重型维修船坞 (每个船坞配备多条维修光束和纳米修复臂), 8x “工蜂”维修无人机蜂巢
              -   次要系统: 70x “黄蜂”武装无人机挂架
              -   攻击射程: 25000 km (维修船坞作业范围) / 100000 km (维修无人机作战半径)
          -   特殊系统:
              -   名称: “资产保全”协议
              -   描述: 一套集维修、补给、改装于一体的综合后勤管理系统。激活后，船坞内的所有维修系统效率提升50%。更重要的是，它能让“执行官”级对停靠的友军巡洋舰进行快速的“战地改装”。通过预置的模块化武器和防御套件，它可以在短短几分钟内，将一艘通用的“龙马”级巡洋舰改装成专职的防空舰或重炮舰，以应对不断变化的战场需求。这赋予了辛迪加舰队无与伦比的战术灵活性。
          -   观星者需求: 需要四名观星者进行并联的“内部程序通讯”（IPC）协作才能运行。这套复杂的系统确保了超级航母庞大身躯的稳定跃迁（跃迁核心稳定+20），但代价是指令传导链条更长，使其战术反应速度远慢于常规舰船。
  </ship_def>
