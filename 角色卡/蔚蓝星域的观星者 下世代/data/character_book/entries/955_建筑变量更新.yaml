content: |-
  <building_management>
  # 建筑变量更新规程
  - `主角.建筑` 只管理固定太空设施与轨道资产，不管理陆地机甲、步兵、战车或可独立航行的舰船。
  - 轨道炮塔、感应炮塔、空间站、船坞、采矿平台、科研站、居住站、防御阵列都属于建筑。
  - 每个建筑直接记录产业模型、每日维护、每日输入与每日输出，供SAM periodic函数自动结算。
  - 建筑名是唯一 key。不得在对象内重复名称。
  - 建筑显示统一使用 `<building_info>`。
  - 本世界不存在位阶系统，禁止给建筑添加位阶、境界或类似字段。

  ## 建筑 Schema
  ```json
  {
    "建筑名": {
      "类型": "空间站/船坞/轨道炮塔/采矿平台/科研站/防御阵列/居住站/其他",
      "品质": 1,
      "吨位": "S/M/L/XL/固定",
      "科技等级": 1,
      "标签": [],
      "描述": "string",
      "位置": "string，需要符合主角.位置的层级格式",
      "阵营": "string",
      "安等": 0,
      "堆叠": 1,
      "最大HP": 0,
      "HP": 0,
      "状态": "运行/空闲/占用/受损/停机/封存",
      "部署日": "ISO 8601",
      "产业模型": "无产业/一级生产/冶炼/补给制造/市场/商业/金融/其他预设模型",
      "每日维护": {"信用点": 0, "补给": 0},
      "每日输入": {"信用点": 0, "矿物": 0, "食物": 0, "金属": 0, "补给": 0},
      "每日输出": {"信用点": 0, "矿物": 0, "食物": 0, "金属": 0, "补给": 0},
      "效果": {
        "效果名": "量化描述"
      }
    }
  }
  ```

  ## 同步规则
  - 建筑转移、损坏、停机、升级时，必须同步更新所属建筑。
  - 太空固定防御目标应优先建模为建筑，而不是舰船。
  - 若某对象可以独立航行，则它不是建筑，应移动到 `主角.舰船`。
  - 每个建筑必须填写 `部署日`、`产业模型`、`每日维护`、`每日输入`与`每日输出`；没有资源产出的设施使用 `无产业`并将输出全部填写0。
  - `每日维护`必须完整包含信用点、补给两个键；`每日输入`与`每日输出`必须完整包含信用点、矿物、食物、金属、补给五个键；数值必须为非负有限数。
  - 禁止加入库存、工时、科研、浮动均值、浮动标差或输出乘数字段。
  - 自动结算只处理 `状态=运行` 的建筑；停机、封存、受损或尚未部署的建筑不结算。

  <raw_building_data>
  <%-JSON.stringify(getvar("SAM_data.static.主角.建筑") || {}, null, 2)%>
  </raw_building_data>
  </building_management>
