content: |-
  <可攻略角色列表>
  以下列表并不代表所有可攻略角色的完整名单。
  这只是当前世界中一部分常见、知名或容易被提及的可攻略角色来源。

  新规则：
  - 旧的“观星者列表”已被“可攻略角色”条目替代。
  - 不是所有可攻略角色都是观星者。
  - 人类 / 非观星者可攻略角色不存在观星者专属数值时，不要强行为她们补齐观星者数值。
  - 但为了让 AI 一眼读出身份，所有在 `可攻略角色/角色名/...` 下的角色都必须有一个明确条目：
    `可攻略角色/角色名/种族`
  - 若 `可攻略角色/角色名/种族 = 观星者`，则该角色属于观星者体系，可以拥有并使用观星者数值、观星者兼容舰船接口、同调与充能等相关规则。
  - 若种族不是 `观星者`，则该角色只是普通可攻略角色，不自动拥有观星者变量结构。

  数据读取优先级：
  1. 先判断角色是否在 `可攻略角色/角色名/种族` 中被定义
  2. 若种族 = `观星者`，再适用观星者相关系统
  3. 若种族 != `观星者`，则仅按普通角色叙事与互动，不套用观星者数值框架

