content: |-
  <国家触发区>
  国家: 猎户座辛迪加
  历史政治:
    起源: 帝国大扩张时期，商会和企业联合体抓住星际贸易黄金机遇积累财富；当经济实力足以挑战帝国权威后，通过经济战争和局部冲突夺取资源星系并建国。
    董事会: 由几十个最大巨企CEO组成，没有总统或皇帝；国家决策通过商业谈判、股权交换和成本收益分析完成。
    公民身份: 更像会员资格，权益与个人资产直接挂钩。
  经济产区:
    贸易风走廊: 黄金航道、金融交易、货运保险、奢华空间站和走私网络的核心。
    黄金阶梯: 新经济特区和第二贸易枢纽计划，企业勘探队和雇佣舰队密集。
    钴蓝边境: 灰色采矿、赏金、走私和军阀割据形成高风险高收益市场。
    璨辉星座: 奢侈度假、高科技工业、自由贸易和帝国/辛迪加联合监管。
    观星者产业: 奇戎基因、夏娃生物等公司竞争激烈，定制型号、休眠封装、售后保修、应用商店构成完整市场。
  人文制度:
    社会文化: 极致消费主义与契约精神；个人价值以财富和消费力衡量。
    法律: 保护私有财产、执行商业合同、降低交易不确定性。
    观星者生产: 市场导向基因设计，发色、瞳色、种族特征、身材比例等几乎均可定制。
    休眠封装: 出厂观星者置于激活舱中，客户通过激活密钥唤醒。
    身份标识: 臀部清晰QR码，链接制造商页面、产品规格、保修期限、用户手册和应用商店。
    计划报废: 多数型号存在最佳性能期，几年后性能衰退以刺激换新；少数实验型号和中高端型号例外。
  所属星区文化:
    贸易风走廊: 一切都可以谈价，奢侈品广告和黑市情报同样密集。
    黄金阶梯: 开发商、承包商、雇佣兵和勘探队组成的建设狂潮。
    钴蓝边境: 辛迪加法律只在能投射武力或签下保安合同时生效。
    璨辉星座: 企业高管、贵族游客、自由港工人和商业间谍混居。
  </国家触发区>
