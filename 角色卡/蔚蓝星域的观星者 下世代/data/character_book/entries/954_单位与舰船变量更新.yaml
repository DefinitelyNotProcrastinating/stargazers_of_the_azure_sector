content: |-
  <unit_and_ship_management>
  # 舰船变量更新规程

  ## 通用原则
  - `主角.舰船` 只管理属于{{user}}的舰船、工业舰、武装商船、航母、泰坦、生体舰和其他可独立航行的太空载具。
  - 敌对舰队、一次性路过舰、纯背景残骸和未被{{user}}控制的舰船不得写入 `主角.舰船`。
  - 所有对象使用 `{"object_name": Object}`。对象名外移为 key，不得重复存储内部名称字段。
  - 效果统一使用 `{"效果名": "量化描述"}`。随机机制必须写成 `D100 <= x`。
  - `主角.舰船` 中属于{{user}}的舰船显示使用 `<ship_info>`；非玩家舰船不写入本变量池，并使用 `<NPC_ship_info>`；固定太空设施写入 `主角.建筑` 并使用 `<building_info>`。
  - 本世界不存在位阶系统，禁止给舰船添加位阶、境界或类似字段。

  ## 舰船 Schema
  ```json
  {
    "舰船名": {
      "舰船类型": "FF/DD/CA/BC/BB/CVL/CV/TT或其他世界书既有类型",
      "吨位": "S/M/L/XL",
      "每日补给消耗": 1,
      "输入": {"矿物": 1},
      "输出": {"金属": 1},
      "制造商": "string",
      "驾驶员": "string",
      "是否旗舰": false,
      "观星者接口角色": "",
      "描述": "string",
      "超空间充能": 0,
      "最大充能": 0,
      "超空间消耗": 0,
      "炮位配置": "ASBMCL",
      "T槽种类": "string，可选；仅拥有 T 槽时填写",
      "装备槽位配置": "5H8L",
      "船体护盾值": 0,
      "船体结构值": 0,
      "护盾值": 0,
      "结构值": 0,
      "装配资源": {
        "PG": 0,
        "CPU": 0
      },
      "效果": {
        "船体加成": "量化描述",
        "内置电子系统": "量化描述"
      },
      "装备": {
        "装备名": {
          "品质": 1,
          "标签": [],
          "堆叠": "正整数，可选；缺省为1，表示相同装备的件数",
          "装配槽位": "可选数组；按件记录具体槽位，例如[H1,H3]",
          "描述": "string",
          "效果": {"效果名": "量化描述"},
          "护盾": "int，可选；增加最大护盾",
          "最大护盾上限": "非负int，可选；限制包含所有装备加成后的最大护盾",
          "结构值": "int，可选；增加最大结构",
          "护盾装甲": "int，可选；增加护盾装甲",
          "结构装甲": "int，可选；增加结构装甲",
          "护盾DR": "percent，可选；增加护盾减伤",
          "结构DR": "percent，可选；增加结构减伤",
          "唯一组": "string，可选；钢板固定为钢板",
          "T槽种类": "string，可选；仅超级武器填写",
          "装配要求": "PG：0 | CPU：0 | 吨位：S | 炮位：1S | 装备槽位：无"
        }
      }
    }
  }
  ```

  ## 舰船硬约束
  - 舰船必须拥有 `吨位` 字段。标准舰船吨位为 `S/M/L/XL`。
  - 每艘舰船必须拥有数值字段 `每日补给消耗`，允许为0，但不得为负数、NaN或无穷值。Worker每日直接读取该字段，不得在结算时根据舰级重新推导。
  - 工业舰可选填稀疏的每日 `输入` 与 `输出` 映射；只写非零项，值必须是非负有限数。普通舰船可完全省略这两个字段。
  - 舰船的 `输入` 与 `输出` 禁止包含 `补给`；舰船补给只由既有 `每日补给消耗` 机制处理。
  - 舰船不会成为工业随机事件目标，也不会被SAM随机生成入侵。剧情需要敌舰攻击时，按正常NPC舰队与战斗规则生成。
  - 新建标准舰船时的默认值为：FF/DD 1，CA 5，BC 20，BB/CVL 50，CV/DN 100，TT 500。变体默认继承基础舰级，档案有明确实值时以档案为准。
  - `炮位配置` 必须是紧凑字符串。`${A}S${B}M${C}L` 表示 A 个 S、B 个 M、C 个 L 常规武器挂点。数量为 0 的尺寸可以省略，例如 `3S1M`。大型舰船可以继续使用 `XL/C/T`。
  - `装备槽位配置` 必须是紧凑字符串。`${A}H${B}L` 表示 A 个高功率槽位、B 个低功率槽位。
  - 每件已装配装备只能存储于 `舰船名/装备/装备名`，武器与模块都使用这一结构。
  - 每件装备必须拥有 `装配要求`，其中必须同时写出 PG、CPU、吨位、炮位需求和装备槽位需求。无某类需求时写 `炮位：无` 或 `装备槽位：无`。
  - 挂点代号只允许 `S/M/L/XL/C/T`。装备的 `吨位` 必须与所占用挂点一致。`C` 槽是航母舰载机中队槽位；`T` 槽是超级武器槽位。
  - 常规无人机使用 `S/M/L` 炮位，分别对应轻型/中型/重型无人机；不得安装到 `C` 槽。
  - `C` 槽是大型旗舰级舰载机库，只能安装舰载机中队。`1C = 1个舰载机中队`，无特殊说明时一个中队满编40架。普通航母CVL最多2C，工业旗舰最多3C（固定档案写明机库类别: 工业旗舰），超级航母CV/CVT最多5C；工业旗舰上限优先于CV舰级。泰坦辅助机库最多2C，死神级例外最多2C。上限不是额外赠送的炮位，实际数量仍取舰船固定档案；不得靠品质、模块、扩容或分拆中队增加C槽。1C对应1个标准满编40架的中队；相同中队可自动合并为堆叠记录，但按堆叠数占用同数量C槽，各字段保持每个中队的数值；编制与当前架数记录在该对象的效果中，不把40架拆成40件装备。伤害是满编中队每1dt总伤害，不再乘40；减员后乘当前架数/编制，当前架数限于0至编制。PG/CPU按完整机库消耗，不随减员下降；补机必须消耗实际库存。
  - 常规情况下只有 `CVL/CV/CVT/TT` 舰体可拥有 `C` 槽。更小或其他类型舰体只有在其固定舰船档案明确写有 `C槽例外: true` 时才能保留 C 槽；AI不得自行创建例外。
  - `SD` 隐形轰炸舰的 `炮位配置` 固定为 `2L`，`装备槽位配置` 固定为 `0H0L`。两个 L 槽只能安装大型导弹或大型鱼雷；禁止安装其他武器、舰载机中队以及任何 H/L 模块。
  - 非武器模块的 `吨位` 只允许 `S/M/L/XL/N`。`N` 表示常规通用模块，可以安装到任意吨位舰船。
  - `装配资源.PG` 与 `装配资源.CPU` 仅存储舰船白值。已使用值与剩余值属于只读派生数据，AI 不得写入。
  - 每艘舰船必须拥有 `船体护盾值`、`船体结构值`、`护盾值`、`结构值`。`船体护盾值` 与 `船体结构值` 是船体白值；`护盾值` 与 `结构值` 是当前值。
  - 最大护盾 = max(0, min(`船体护盾值` + sum(每种装备的 `护盾` × `堆叠`), 所有装备的 `最大护盾上限` 的最小值))；未设置上限时不额外限制。最大结构 = max(0, `船体结构值` + sum(每种装备的 `结构值` × `堆叠`))。`护盾值` 与 `结构值` 不得超过对应最大值。
  - 每艘舰船必须填写 `超空间充能`、`最大充能`、`超空间消耗`。新建舰船的 `超空间充能` 默认可以为 0，但 `最大充能` 与 `超空间消耗` 禁止填写为 0。`超空间充能` 允许使用 0.5 精度的小数。
  - 装备 `装配要求` 中的 PG 与 CPU 允许使用负数。负数表示该模块提供额外装配资源，但仍必须占用至少一个 H/L 装备槽位。
  - 护盾扩展器使用 `护盾` 记录其提供的最大护盾量；结构强化装备使用 `结构值` 记录其提供的最大结构量。护盾/结构装甲与 DR 不增加最大值。
  - 钢板/装甲板只能增加 `结构装甲`，不得增加 `结构值`、最大结构或独立装甲血条；其 PG 消耗按装备数值参考计算。
  - 所有钢板/装甲板必须填写 `唯一组: 钢板`。每艘舰船最多安装1套；即使名称、品质、制造商或吨位不同，也禁止同时存在第二件钢板。
  - 常规武器只占用炮位挂点，不占用 H/L 装备槽位。非武器模块不占用炮位。
  - 光粒炮仅限集群舰船；裂解射线（熵分解炮）要求先驱者舰船或材料来自先驱者残骸、保留原生线路的ACX-00渡鸦级这一明确例外。武器保存 `安装限定.船体文明`、`安装限定.所需内部结构`，裂解射线另存 `安装限定.例外舰型: [ACX-00渡鸦级]`；船体文明匹配或档案船体型号匹配例外后，再核对 `效果.内部结构` 中所需结构是否完好。渡鸦级记录 `文明: 人类`、`船体型号: ACX-00渡鸦级` 及完好熵聚焦线路；其例外不放宽光粒炮限制。条件缺失或不符时禁止添加装备；若改造拆除所需结构，必须同步卸下相应武器。
  - 激光/快子与磁轨/RKKV均按战斗规程进行炮塔命中对抗。激光/快子基础命中默认+2，磁轨/RKKV默认0；默认值按原理继承，只有专属修正才写入装备。光束命中后仍应用距离散射，散射不会替代命中判定。
  - 每艘舰船最多拥有 `1T`。拥有 `T` 槽的舰船必须填写 `T槽种类`；安装到 `T` 槽的超级武器也必须填写 `T槽种类`，且两者完全一致，并且必须属于同族/同技术谱系超级武器。
  - 舰船内置侦测器、雷达、基础 CPU、内置 ECCM、基础跟踪、内置推进和其他天生电子能力都写入舰船 `效果`，视为船体加成。

  ## 装备自动堆叠
  - SAM函数 `stack_modules` 为 `periodic: true`、`order: last`，在本轮变量更新和工业结算后整理主角物品栏及各艘舰船的装备。不得跨船、跨物品栏合并或自动安装装备；同时将当前护盾与结构约束到按完整堆叠计算后的上限，不自动补血。
  - 相同是指除对象名、界面_key、堆叠数量与装配位置之外，品质、标签、描述、效果、装配要求、安装限定及其他属性完全相同。品质、损毁、剩余弹药或机群减员状态不同的模块不得合并。
  - `堆叠` 默认为1，记录正整数件数；所有容量、装甲、DR、PG/CPU与槽位消耗按每件数值乘以件数。最大护盾上限等限制取最低有效值，不因数量变成加成。唯一组按件数计算，不能用堆叠规避最多1件的限制。
  - 已装配堆叠的 `装配槽位` 保存每件的槽位，长度应等于堆叠数量。合并不移动装备、不减少占槽；UI按实际槽位展开。拆卸非内置堆叠时取出1件，保留其他件及其占槽。
  - 每件武器独立攻击、命中和承伤；堆叠不会把多个炮塔变成一次攻击。若其中一件受损或状态改变，应先拆分为剩余N-1件的原状态堆叠和1件独立的新状态。
  - C槽堆叠按每个中队占1C。`编制`、`当前架数`、`伤害`等均是每个中队的值，总机数为堆叠数量乘以当前架数；不同减员状态分开保存。

  ## 内置装备与装配界面
  - 装备的 `标签` 可包含 `内置`。开局UI与状态栏UI均禁止拆卸、清空或替换这类装备；其他装备正常安装与拆卸。
  - `内置` 只限制界面装配操作，不锁定整艘舰船或开局预选，也不授予免费维修。实际维修或重建后，叙事更新可以按结果调整同一件内置装备的惩罚与状态。
  - 护盾供能或容量系统损毁使用内置装备的 `最大护盾上限` 限制最终容量，而非只扣当前护盾或固定抵消船体容量。限制在叠加所有盾扩后生效，多个上限取最低；上限为0时任何盾扩都不能产生可用容量，必须实际修复后才能提高。
  - 舰船损毁可用内置装备的负数 `护盾`、`结构值`、`护盾装甲`、`结构装甲`、`护盾DR` 与 `结构DR` 表达。修正与船体白值相加，容量及装甲最低为0；不得丢弃负号，也不得再对船体白值重复扣除。
  - 内置的损毁机库可占用1C、内置的损毁炮座可占用对应炮位；它们不是可出动的机群或可攻击的武器，伤害为0，损毁机库当前架数为0。修复前不能使用该槽位。
  - 状态栏安装只从主角物品栏转入已有装备，扣除实际数量，并检查槽位、PG/CPU、吨位、唯一组与安装限定；拆下的非内置装备返回物品栏。装配不推进时间，不产生资源，不自动补满护盾或结构。

  ## 当前数据
  <raw_ship_data>
  <%-JSON.stringify(getvar("SAM_data.static.主角.舰船") || {}, (wb_192_key, wb_192_value) => wb_192_key.startsWith("_") ? undefined : wb_192_value, 2)%>
  </raw_ship_data>
  - 工业设备按每件参数乘实际堆叠数计量；舰船每日输入/输出是全舰汇总值，不再乘设备件数。周期产耗由SAM结算，同一笔产耗只记账一次。
  </unit_and_ship_management>
