content: |-
  <unit_and_ship_management>
  # 舰船变量更新规程

  ## 通用原则
  - `主角.舰船` 只管理属于{{user}}的舰船、工业舰、武装商船、航母、泰坦、生体舰和其他可独立航行的太空载具。
  - 敌对舰队、一次性路过舰、纯背景残骸和未被{{user}}控制的舰船不得写入 `主角.舰船`。
  - 所有对象使用 `{"object_name": Object}`。对象名外移为 key，不得重复存储内部名称字段。
  - 效果统一使用 `{"效果名": "量化描述"}`。随机机制必须写成 `D100 <= x`。
  - `主角.舰船` 中属于{{user}}的舰船显示使用 `<ship_info>`；非玩家舰船不写入本变量池，并使用 `<NPC_ship_info>`；固定太空设施写入 `主角.建筑` 并使用 `<building_info>`。
  - 本世界不存在位阶系统，禁止给舰船添加位阶、境界或类似字段。

  ## 舰船 Schema
  ```json
  {
    "舰船名": {
      "舰船类型": "FF/DD/CA/BC/BB/CVL/CV/TT或其他世界书既有类型",
      "吨位": "S/M/L/XL",
      "每日补给消耗": 1,
      "制造商": "string",
      "驾驶员": "string",
      "是否旗舰": false,
      "观星者接口角色": "",
      "描述": "string",
      "跃迁充能": 0,
      "最大充能": 0,
      "跃迁消耗": 0,
      "炮位配置": "ASBMCL",
      "T槽种类": "string，可选；仅拥有 T 槽时填写",
      "装备槽位配置": "5H8L",
      "船体护盾值": 0,
      "船体结构值": 0,
      "护盾值": 0,
      "结构值": 0,
      "装配资源": {
        "PG": 0,
        "CPU": 0
      },
      "效果": {
        "船体加成": "量化描述",
        "内置电子系统": "量化描述"
      },
      "装备": {
        "装备名": {
          "品质": 1,
          "标签": [],
          "描述": "string",
          "效果": {"效果名": "量化描述"},
          "护盾": "int，可选；增加最大护盾",
          "结构值": "int，可选；增加最大结构",
          "护盾装甲": "int，可选；增加护盾装甲",
          "结构装甲": "int，可选；增加结构装甲",
          "护盾DR": "percent，可选；增加护盾减伤",
          "结构DR": "percent，可选；增加结构减伤",
          "T槽种类": "string，可选；仅超级武器填写",
          "装配要求": "PG：0 | CPU：0 | 吨位：S | 炮位：1S | 装备槽位：无"
        }
      }
    }
  }
  ```

  ## 舰船硬约束
  - 舰船必须拥有 `吨位` 字段。标准舰船吨位为 `S/M/L/XL`。
  - 每艘舰船必须拥有数值字段 `每日补给消耗`，允许为0，但不得为负数、NaN或无穷值。Worker每日直接读取该字段，不得在结算时根据舰级重新推导。
  - 新建标准舰船时的默认值为：FF/DD 1，CA 5，BC 20，BB/CVL 50，CV/DN 100，TT 500。变体默认继承基础舰级，档案有明确实值时以档案为准。
  - `炮位配置` 必须是紧凑字符串。`${A}S${B}M${C}L` 表示 A 个 S、B 个 M、C 个 L 常规武器挂点。数量为 0 的尺寸可以省略，例如 `3S1M`。大型舰船可以继续使用 `XL/C/T`。
  - `装备槽位配置` 必须是紧凑字符串。`${A}H${B}L` 表示 A 个高功率槽位、B 个低功率槽位。
  - 每件已装配装备只能存储于 `舰船名/装备/装备名`，武器与模块都使用这一结构。
  - 每件装备必须拥有 `装配要求`，其中必须同时写出 PG、CPU、吨位、炮位需求和装备槽位需求。无某类需求时写 `炮位：无` 或 `装备槽位：无`。
  - 挂点代号只允许 `S/M/L/XL/C/T`。装备的 `吨位` 必须与所占用挂点一致。`C` 槽是航母舰载机中队槽位；`T` 槽是超级武器槽位。
  - 常规无人机使用 `S/M/L` 炮位，分别对应轻型/中型/重型无人机；不得安装到 `C` 槽。
  - `C` 槽只能安装舰载机中队。`1C = 1个舰载机中队`，无特殊说明时一个中队视为 8 架战斗机或轰炸机；超级航母的 `C` 槽数量通常为常规航母两倍。
  - 非武器模块的 `吨位` 只允许 `S/M/L/XL/N`。`N` 表示常规通用模块，可以安装到任意吨位舰船。
  - `装配资源.PG` 与 `装配资源.CPU` 仅存储舰船白值。已使用值与剩余值属于只读派生数据，AI 不得写入。
  - 每艘舰船必须拥有 `船体护盾值`、`船体结构值`、`护盾值`、`结构值`。`船体护盾值` 与 `船体结构值` 是船体白值；`护盾值` 与 `结构值` 是当前值。
  - 最大护盾 = `船体护盾值` + 所有装备的 `护盾`；最大结构 = `船体结构值` + 所有装备的 `结构值`。`护盾值` 与 `结构值` 不得超过对应最大值。
  - 每艘舰船必须填写 `跃迁充能`、`最大充能`、`跃迁消耗`。新建舰船的 `跃迁充能` 默认可以为 0，但 `最大充能` 与 `跃迁消耗` 禁止填写为 0。`跃迁充能` 允许使用 0.5 精度的小数。
  - 装备 `装配要求` 中的 PG 与 CPU 允许使用负数。负数表示该模块提供额外装配资源，但仍必须占用至少一个 H/L 装备槽位。
  - 护盾扩展器使用 `护盾` 记录其提供的最大护盾量；结构强化装备使用 `结构值` 记录其提供的最大结构量。护盾/结构装甲与 DR 不增加最大值。
  - 常规武器只占用炮位挂点，不占用 H/L 装备槽位。非武器模块不占用炮位。
  - 每艘舰船最多拥有 `1T`。拥有 `T` 槽的舰船必须填写 `T槽种类`；安装到 `T` 槽的超级武器也必须填写 `T槽种类`，且两者完全一致，并且必须属于同族/同技术谱系超级武器。
  - 舰船内置侦测器、雷达、基础 CPU、内置 ECCM、基础跟踪、内置推进和其他天生电子能力都写入舰船 `效果`，视为船体加成。

  ## 当前数据
  <raw_ship_data>
  <%-JSON.stringify(getvar("SAM_data.static.主角.舰船") || {}, null, 2)%>
  </raw_ship_data>
  </unit_and_ship_management>
