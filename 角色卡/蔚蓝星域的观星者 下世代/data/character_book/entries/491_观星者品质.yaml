content: |-
  <观星者品质>
  # 观星者专用品质与充能规则

  核心定义:
    - 观星者品质使用独立的名称体系，不使用装备与其他造物的整数品质0-18。
    - 观星者的比特率、稳态增益与爆发增益是舰船种类适配的核心参数；精度仍按舰船或特殊接口已有的独立要求判定。
    - 观星者的 `充能数量` 保存一次有效同调的基础充能点数；实效充能数量=基础充能数量+好感充能加成。
    - 品质只提供常规默认基础充能数量；实际结算读取角色对象明确记载的基础值，再叠加一次好感充能加成。
    - 品质与充能数量不是不可分割的固定对位。自研型号、改造型号、受损型号与特殊型号可以偏离默认值，但必须同时明确记录品质和充能数量。

  常规品质表:
    标准: {默认充能数量: 1}
    衍生: {默认充能数量: 2}
    精良: {默认充能数量: 3}
    上等: {默认充能数量: 4}
    先进: {默认充能数量: 5}
    高级: {默认充能数量: 6}
    唯一: {默认充能数量: "不绑定，必须单独填写"}

  建模规则:
    - 市售型号以售价、比特率、精度、稳态、爆发与定位综合分档，型号产品名不等于品质名；价格包含人格、外观和稀缺溢价，不能单凭价格升档。
    - 已有型号以产品档案的品质、基础充能数量与充能平衡说明为准；总览和开局目录必须与档案一致。
    - 常规量产型号应按品质表填写默认充能数量。
    - 若常规型号的充能数量偏离默认值，档案必须给出明确原因，不得根据品质擅自覆盖角色对象中的实值。
    - `唯一` 表示该观星者不适用常规量产分级，不表示她必然比高级品质更强。
    - `唯一` 不进入常规随机品质池，只能由明确的型号档案、项目回报或剧情结果创建。
    - 唯一品质的充能数量可以高于、等于或低于任何常规品质，禁止使用 `X` 参与数值计算。
    - 任何观星者角色都必须同时填写 `品质` 与 `充能数量`；充能数量必须是大于或等于0的有限数值。
    - 比特率、精度与增益不得从品质或充能数量反推；充能数量也不得从比特率或增益反推。

  好感度增幅:
    - 令H=max(0,好感度)，好感度缺失或不是有限数值时按0；增幅系数r=min(H/2000,1)。负好感不产生性能减益。
    - 实效稳态增益=基础稳态增益×(1+r)，实效爆发增益=基础爆发增益×(1+r)；两者在2000好感时各达最高+100%。
    - 0好感无加成，100好感+5%，1000好感+50%，2000及以上+100%；比特率、精度与特殊效果不随此规则提高。
    - H<1000时额外充能0，1000<=H<2000时额外充能1，H>=2000时累计额外充能2，不是1+2，也不继续增长。
    - 三项存档字段 `稳态增益`、`爆发增益`、`充能数量` 始终保存未经好感加成的基础值；好感变化只改好感度，不把实效值或A+B字符串写回基础字段。
    - 好感下降时按当前好感重新计算，不能保留旧加成；反复显示或准备阶段执行也不能叠加增长。
    - 角色条目和状态栏按“基础A + 好感加成B = 实效”显示三项数值，零加成也显示A+0，保留TW/mV单位、可变输出和峰值/大于关系等限定；结算使用未舍入实效，显示最多保留六位小数。
    - 好感度严格超过100时，在渲染描述中加入一次“该观星者的性能已经被使用者影响，和同级产品有出入。”；100或以下不显示此句，不反复写入存档描述。
    - 舰船稳态与爆发需求按实效值判定，可使低品质个体获得更高性能；品质仍为出厂/改造分级，不因好感自动改名，比特率与精度门槛仍须独立满足。
    - 未绑定具体使用者的产品档案、总览与标价均为0好感基础规格，不预加好感；随机或购买创建个体后才按其实际好感计算。

  结算规则:
    - 一次有效同调的基础增量取 `充能数量`，加上本条定义的好感充能加成后，得到实效充能数量。
    - 同调技能、角色特殊效果、舰船效果等额外加成在实效充能数量基础上另行计算；任何加成只结算一次。
    - 最终超空间充能仍不得超过舰船的 `最大充能`。
  </观星者品质>
