keys:
- 隐形轰炸舰
- 高级驱逐舰
- 阴影级
- 阴影
content: |-
  <ship_def>
  级别: 阴影级
  别名: Shadow-class
  舰船类型: SD
  舰种: 隐形轰炸舰
  舰体类别: 高级型
  价格: 22M
  制造商: 帝国海军设计局
  舰体描述: 黄铜色和金色的圆润光滑战舰，头部有帝国的徽记，使用隐形场。
  静态档案:
    规格:
      舰体全长: 210米
      标准船员配置: 4人
    性能评级:
      装甲: 1200
      护盾: 1800
      机动性: 78
      火力输出: 3500
    装配:
      装配资源:
        PG: 132
        CPU: 400
      槽位:
        高能: 6
        低能: 5
      武器座:
      - 名称: M1
        尺寸: M
        类型: 鱼雷武器座
        适配武器:
        - 鱼雷发射器
        - 重型导弹发射器
      - 名称: M2
        尺寸: M
        类型: 鱼雷武器座
        适配武器:
        - 鱼雷发射器
        - 重型导弹发射器
      - 名称: M3
        尺寸: M
        类型: 鱼雷武器座
        适配武器:
        - 鱼雷发射器
        - 重型导弹发射器
      - 名称: M4
        尺寸: M
        类型: 鱼雷武器座
        适配武器:
        - 鱼雷发射器
        - 重型导弹发射器
      船体加成:
      - 鱼雷与巡航导弹伤害 +18%
      - 对护盾造成的最终伤害 +15%
      - 隐形稳定性 +25%
      - EMP与传感压制效果 +20%
      装配减免:
      - 鱼雷武器 PG需求 -10%
      - 隐形与抗干扰模块 CPU需求 -20%
      推荐武器方案:
      - 4x 鱼雷或巡航导弹发射管
    特殊系统:
      名称: 阴影IV型战术隐形力场发生器
      效果:
      - 稳定性与抗干扰能力极强
      - 可在复杂战场环境下长时间维持隐形
      附加系统:
      - 名称: 震爆系列反物质鱼雷
        效果:
        - 对范围内护盾额外造成 50% 伤害
        - 释放的 EMP 可中度干扰 1000 km 内敌舰火控
    观星者需求:
      控制门槛:
        最低稳态增益: 3.2 TW/mV
        最低比特率: 320 TB/s
        最高精度误差: 1.5/1M
      超载门槛:
        最低爆发增益: 6.6 TW/mV
        需要技能: 工程 V
        规则:
        - 爆发增益不足时，不可超载隐形模块与鱼雷主动武器
        - 超载为 2 回合 1 次
        - 超载效果提高至原值的 150%
  跃迁充能: 0
  最大充能: 7
  跃迁消耗: 1
  </ship_def>
