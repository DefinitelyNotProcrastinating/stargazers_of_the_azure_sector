content: |-
  <ship_def>
  级别: 狮鹫级
  别名: Griffin-class
  舰船类型: RC
  舰种: 后勤巡洋舰 (高级巡洋舰)
  价格: 220M
  制造商: 辛迪加联合政府造船厂
  描述: 舰体设计高度模块化，由一个核心的居住/引擎段和外部挂载的多个功能舱室组成。这些舱室包括无人机库、备件仓库和大型数据处理中心，可以通过标准的星港设施进行快速更换和升级。舰体表面涂装着制造商的品牌标志和型号代码，充满了强烈的工业与商业气息。
  舰船单位模板:
    舰船类型: RC
    吨位: L
    驾驶员: ''
    是否旗舰: false
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 6
    跃迁消耗: 2
    制造商: 辛迪加联合政府造船厂
    描述: 舰体设计高度模块化，由一个核心的居住/引擎段和外部挂载的多个功能舱室组成。这些舱室包括无人机库、备件仓库和大型数据处理中心，可以通过标准的星港设施进行快速更换和升级。舰体表面涂装着制造商的品牌标志和型号代码，充满了强烈的工业与商业气息。
    炮位配置: 4S
    装备槽位配置: 8H6L
    装配资源:
      PG: 288
      CPU: 608
    效果:
      船体加成:
      - 特种巡洋舰；依据舰级定位应用：后勤巡洋舰 (高级巡洋舰)。
      装配减免: []
      内置电子系统:
        基础CPU: 内置特种巡洋舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置特种巡洋舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
      特殊系统:
      - 名称: “兼容性矩阵”自适应无人机协议
        描述: “狮鹫”级的核心技术。每一架维护无人机都搭载了一个小型扫描阵列和一个学习型AI核心。在执行维修任务前，无人机会首先环绕目标舰船飞行，扫描其结构蓝图、装甲材质和护盾频率。这些数据会被实时传回母舰的中央服务器进行分析，服务器会立刻生成一套最优化的维修方案，并将相应的指令和工具参数下载到无人机中。这个过程虽然会增加几秒钟的准备时间，但确保了无人机能够像原厂技工一样，对不同势力的舰船进行最高效、最无损的修复，极大地提升了维修的成功率和资源利用率。
    装备: {}
  静态档案:
    观星者需求: 观星者的性能要求相对宽泛，没有特殊要求。
    旧版描述: |-
      -   级别: 狮鹫级 (Griffin-class)
      -   类型: 后勤巡洋舰 (高级巡洋舰)
      -   价格: 220M
      -   形态: 舰体设计高度模块化，由一个核心的居住/引擎段和外部挂载的多个功能舱室组成。这些舱室包括无人机库、备件仓库和大型数据处理中心，可以通过标准的星港设施进行快速更换和升级。舰体表面涂装着制造商的品牌标志和型号代码，充满了强烈的工业与商业气息。
      -   制造商: 辛迪加联合政府造船厂
      -   静态配置文件:
          -   舰体全长: 580米
          -   标准船员配置: 10人
          -   性能评级:
              -   装甲: 11500
              -   护盾: 14000
              -   机动性: 58
              -   火力输出: 300 (自卫无人机)
              -   回复量: 2500
          -   武器系统:
              -   主要系统: 2x “狮鹫之羽”通用维修无人机机库 (每巢18架)
              -   次要系统: 4x “大黄蜂”轻型武装无人机挂架
              -   攻击射程: 75000 km (维修无人机作战半径)
          -   特殊系统:
              -   名称: “兼容性矩阵”自适应无人机协议
              -   描述: “狮鹫”级的核心技术。每一架维护无人机都搭载了一个小型扫描阵列和一个学习型AI核心。在执行维修任务前，无人机会首先环绕目标舰船飞行，扫描其结构蓝图、装甲材质和护盾频率。这些数据会被实时传回母舰的中央服务器进行分析，服务器会立刻生成一套最优化的维修方案，并将相应的指令和工具参数下载到无人机中。这个过程虽然会增加几秒钟的准备时间，但确保了无人机能够像原厂技工一样，对不同势力的舰船进行最高效、最无损的修复，极大地提升了维修的成功率和资源利用率。
          -   观星者需求: 观星者的性能要求相对宽泛，没有特殊要求。
  </ship_def>
