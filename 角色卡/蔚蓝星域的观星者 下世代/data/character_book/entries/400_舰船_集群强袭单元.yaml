keys:
- 强袭单元
- 集群强袭单元
content: |-
  <ship_def>
  级别: 强袭单元
  文明: 漂泊集群
  舰船类型: CA
  舰种: 巡洋舰
  舰体全长: 480米
  船体类型: 例外型
  形态: 短宽多面体核心由两组平行推进框架夹持，护盾发生节点密集分布在外缘，光粒发射器隐藏在框架内侧。
  定位: 集群机动战线的主要战斗单位，以充裕PG/CPU安装更强大的护盾系统。
  分布: 外环集群原生遗迹。
  超空间说明: 缓存、短距传送、节点减耗和稳定性规则见漂泊集群触发区。模板保存基础消耗，动态支援不得永久改写船体白值。
  参考满编火力每dt: 4800
  火力说明: 仅为全部默认武器可同时攻击时的未命中/防御结算前合计，不能作为额外武器重复造成伤害；机群伤害另受减员与接敌限制。
  舰船单位模板:
    文明: 漂泊集群
    舰船类型: CA
    每日补给消耗: 10
    吨位: L
    驾驶员: ''
    是否旗舰: false
    观星者接口角色: ''
    超空间充能: 0
    最大充能: 6
    超空间消耗: 2
    制造商: 漂泊集群标准化工业平台
    描述: 480米短宽多面体由两条平行推进框架夹持中央计算核；四门中型光粒炮沿框架内侧成对排列，密集的护盾节点覆盖外缘。它以宽阔正面维持机动战线，转向时两侧框架分别发光，仍保有清晰的双框剪影。
    炮位配置: 4M
    装备槽位配置: 5H3L
    船体护盾值: 16800
    船体结构值: 4000
    护盾值: 16800
    结构值: 4000
    护盾DR: 30%
    结构DR: 20%
    护盾装甲: 30
    结构装甲: 40
    装配资源:
      PG: 450
      CPU: 950
    效果:
      船体加成:
      - 最终白值按本档案读取，不重复乘人类品质或国家倍率。
      - 两条血条：护盾与结构；H/L槽数按现行舰级上限。
      装配减免: []
      内部结构:
        光子凝聚器: 完好
      内置电子系统:
        电子品质: 10
        内置跟踪: 30
        内置ECCM: 10
        侦测值: 20
        侦测距离km: 180000
        叠加规则: 内置跟踪已包含CPU和侦测器，不重复计算；外装模块另计。
      机动评级: 80
      闪避值: 17
      超空间核心稳定强度: 1
      原生超空间准备时间秒: 20
      特殊系统:
        原生护盾配置: 船体护盾值16800、初始护盾DR30%，已直接写入防御字段；护盾扩展器只按装备自身数值增加护盾，不再应用船体倍率。
    装备:
      中型光粒:
        品质: 12
        效果:
          伤害: 1200
          冷却: 1dt
          基础命中: 4
          跟踪: 0.075
          稳定射程: 45000km
          AP: 0%
          DRP: 0%
          衰竭: 稳定射程外伤害0；射程内不散射
          结算: 最终原生白值，不再乘品质倍率
        安装限定:
          船体文明: 漂泊集群
          所需内部结构:
          - 光子凝聚器
        装配要求: PG：40 | CPU：55 | 吨位：M | 炮位：1M | 装备槽位：无
        描述: 集群原生光粒发射器；只能安装在保有完好内部光子凝聚器的集群舰船上，不能跨文明移植。
        堆叠: 4
  </ship_def>
