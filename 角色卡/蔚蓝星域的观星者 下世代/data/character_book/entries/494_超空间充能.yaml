keys: []
content: |-
  <超空间充能>
  hyperspace_capacitor_system:
    schema_binding: |
      每一艘 `主角.舰船` 下的舰船对象都必须具有以下3个字段：
      - "超空间充能": number
      - "最大充能": int
      - "超空间消耗": int

    执行规则: |
      1. 实际判定读取有效超空间消耗=max(0,基础超空间消耗+明确生效的临时修正)；当前超空间充能必须>=有效超空间消耗。模板和变量中的超空间消耗仍保存船体基础值。
      2. 若有效超空间消耗>0且当前超空间充能<=0，则无法进行超空间航行；完整集群节点同行支援使有效消耗降至0时，零充能也可启动，但所有引擎安全、准备时间、冷却和扰断条件仍须满足。
      3. 每次成功完成超空间航行后，立即一次性扣除【有效超空间消耗】数量的充能；最低扣0，不得生成充能。网络单元共同超空间仅扣网络单元一次有效消耗，被携带舰不扣充能；范围、容量、稳定性和生物安全见漂泊集群触发区。
      4. 任何充能行为都不能让当前超空间充能超过【最大充能】。
      5. 观星者完成一次有效同调时，实效充能增量=角色基础 `充能数量` + 好感充能加成（好感<1000为0、1000至不足2000为1、2000及以上累计为2）；不得从品质推导，也不得把实效写回基础字段。
      6. 若舰长拥有同调技能，每次获取超空间充能时额外获得【同调等级 × 0.5】点充能，最高额外获得 2.5 点；该加成不提高【最大充能】。
      7. 观星者品质只给出常规型号的默认值：标准1、衍生2、精良3、上等4、先进5、高级6；唯一品质没有固定默认值。
      8. 若角色对象的基础 `充能数量` 与常规品质默认值不同，以角色对象明确数值为基础，再加一次好感加成。最终充能=min(最大充能,当前充能+实效充能增量+其他有效加成)。

    每跳充能消耗:
      FF: 1
      DD: 1
      CA: 2
      BC: 2
      BB: 3
      CVL: 3
      CV: 4
      TT: 6

    记忆电容基础上限:
      FF: 8
      DD: 7
      CA: 6
      BC: 5
      BB: 4
      CVL: 4
      CV: 5
      TT: 6

    变体继承:
      AF: FF
      AD: DD
      SD: DD
      TD: DD
      HAC: CA
      ESC: CA
      RC: CA
      BBV: BB
      CVT: CV
      DN: CV
    变体继承规则: |
      变体舰级必须使用其基础舰级的 `超空间消耗` 与 `最大充能`。禁止为变体舰级保留 0 上限或 0 基础消耗；集群节点的临时减耗只影响有效消耗，不改写这些基础值。
      新建舰船的 `超空间充能` 默认仍为 0；只有当前充能会随剧情、补给、观星者能力或装备效果变化。

    建模要求:
      新舰船初始化:
        FF: {"超空间消耗": 1, "最大充能": 8}
        DD: {"超空间消耗": 1, "最大充能": 7}
        CA: {"超空间消耗": 2, "最大充能": 6}
        BC: {"超空间消耗": 2, "最大充能": 5}
        BB: {"超空间消耗": 3, "最大充能": 4}
        CVL: {"超空间消耗": 3, "最大充能": 4}
        CV: {"超空间消耗": 4, "最大充能": 5}
        TT: {"超空间消耗": 6, "最大充能": 6}
      默认当前充能:
        规则: 新建舰船时若没有额外说明，"超空间充能" 默认写为 0。

  </超空间充能>
