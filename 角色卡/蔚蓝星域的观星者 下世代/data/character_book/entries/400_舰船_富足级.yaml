content: |-
  <ship_def>
  舰船类型: MV
  舰种: 采矿驳船
  舰体类别: 常规型
  “帝国的基石并非由黄金铸就，而是由千亿吨的精炼矿石熔炼而成。每一块矿石，都将化为守护陛下的装甲，或是指向敌人的利剑。”——帝国后勤部铭文
  -   级别: 富足级 (Abundance-class)
  -   类型: 采矿驳船 MV
  -   价格: 10M
  -   形态: 舰体设计充满了帝国式的厚重与威严感，呈一个巨大而坚固的长方体。曜石黑的涂装上印有金色的帝国星环与长剑徽记。舰首集成了巨大的、如同巨兽口器的岩石破碎模块，舰体两侧则是标准化的货柜挂点，整艘船看起来就像一座移动的矿山。
  -   制造商: 帝国海军设计局 (后勤装备分部)
  -   静态配置文件:
      -   舰体全长: 1850米
      -   标准船员配置: 25人
      -   性能评级:
          -   装甲: 25000
          -   护盾: 12000
          -   机动性: 10
          -   火力输出: 100 (仅限点防御)
      -   武器系统:
          -   主要系统: 3x MKV 重型小行星破碎器
          -   次要系统: 8x “守护者”轻型点防御激光阵列
          -   攻击射程: 2 km (采矿设备有效范围)
      -   特殊系统:
          -   名称: 帝国标准货柜接口
          -   描述: “富足”级的货仓被设计为可直接与帝国主力运输舰进行模块化对接。这使得矿石的转运过程无需经过空间站中转，极大地提升了整个后勤链条的效率和安全性。在战时，这种标准接口甚至可以被用来紧急运输装甲板或弹药模块。
      -   观星者需求: 对观星者的性能要求极低，只需要最基础的型号即可维持跃迁引擎的运作。大多数“富足”级上搭载的都是即将退役或性能不达标的观星者。

  舰船单位模板:
    舰船类型: MV
    吨位: M
    驾驶员: ''
    是否旗舰: false
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 6
    跃迁消耗: 1
    炮位配置: 3M
    装备槽位配置: 2H4L
    船体护盾值: 240
    船体结构值: 560
    护盾值: 240
    结构值: 560
    装配资源:
      PG: 200
      CPU: 350
    效果:
      船体加成:
      - 采矿模块开采效率 +20%
      - 模块化矿石转运效率 +25%
      内置电子系统:
        基础CPU: 内置民用舰载CPU。
        基础侦测器: 内置矿物勘探扫描器。
    装备: {}
  </ship_def>
