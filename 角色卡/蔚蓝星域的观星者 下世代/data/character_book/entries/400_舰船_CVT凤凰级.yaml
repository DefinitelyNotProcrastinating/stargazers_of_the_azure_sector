content: "<ship_def>\n级别: 凤凰构型\n别名: ''\n舰船类型: CVT\n舰种: 战术超级航母 (CVT)\n价格: 无法购买\n制造商:\
  \ 银河防御联盟 - 第三设计所\n描述: 在巡航模式下，它的形态如同一只收拢翅膀的巨大金属飞鸟，舰体修长而紧凑。进入战斗模式后，层叠的结晶装甲板会如凤凰展翅般从前方两侧和上方展开成为前掠翼，露出内部密集的无人机弹射矩阵和散热结构，整个舰体在瞬间化为一座充满了致命美感的攻击平台。\n\
  舰船单位模板:\n  舰船类型: CVT\n  吨位: T\n  驾驶员: ''\n  是否旗舰: true\n  观星者接口角色: ''\n  跃迁充能: 0\n\
  \  最大充能: 5\n  跃迁消耗: 4\n  制造商: 银河防御联盟 - 第三设计所\n  描述: 在巡航模式下，它的形态如同一只收拢翅膀的巨大金属飞鸟，舰体修长而紧凑。进入战斗模式后，层叠的结晶装甲板会如凤凰展翅般从前方两侧和上方展开成为前掠翼，露出内部密集的无人机弹射矩阵和散热结构，整个舰体在瞬间化为一座充满了致命美感的攻击平台。\n\
  \  炮位配置: 16C1T\n  装备槽位配置: 6H9L\n  船体护盾值: 7200\n  船体结构值: 16800\n  护盾值: 7200\n  结构值:\
  \ 16800\n  装配资源:\n    PG: 1760\n    CPU: 2240\n  效果:\n    船体加成:\n    - 旗舰型舰船；依据舰级定位应用：战术超级航母\
  \ (CVT)。\n    - 装配资源与槽位由本舰船独立定义，不应用常规舰级倍率公式。\n    装配减免: []\n    内置电子系统:\n      基础CPU:\
  \ 内置旗舰级舰载CPU；跟踪与ECCM按电子战规则计算。\n      基础侦测器: 内置旗舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。\n\
  \      旗舰指挥链: 内置多观星者并联与舰队级指挥链；具体接口需求见舰船条目。\n    特殊系统:\n    - 名称: 旗舰级战术变形结构\n   \
  \   描述: 舰船的核心能力。允许其在“巡航模式”和“战斗模式”之间切换。在战斗模式下，机体展开，无人机出动效率提升150%，机动性降低至40，但解锁末日武器的使用权限。废热越高，无人机的发射速度就越快。\n\
  \    - 名称: 集成式物质抹除光束\n      描述: 一种独特的单舰末日武器。激活后，“凤凰”构型展开的“翅膀”上的所有分解炮节点会将能量聚焦于舰首，然后收束场将会将射线收束为同一条，对单个目标造成恐怖的伤害。\n\
  \  装备: {}\n  T槽种类: 银河防御联盟\n</ship_def>"
