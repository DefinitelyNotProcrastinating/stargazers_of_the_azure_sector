keys:
- 攻击单元
- 集群攻击单元
content: |-
  <ship_def>
  级别: 攻击单元
  文明: 漂泊集群
  舰船类型: CA
  舰种: 巡洋舰
  舰体全长: 620米
  船体类型: 例外型
  原生标准船员: 0
  形态: 两条修长约束轨道构成舰体前部，后部是紧凑计算核心与推进环，开火时轨道之间出现蓝白色光粒约束场。
  定位: 集群相对远距离的集中打击单位；以牺牲部分机动与护盾换取能量武器输出。
  分布: 外环集群原生遗迹。
  驾驶限制: 原生版本无人，内部没有可用乘员空间，原生传送会杀死生物乘客。
  观星者需求: 原生无人版本无需观星者；不能将人类观星者直接接入其原生传送系统。
  超空间说明: 缓存、短距传送、节点减耗和稳定性规则见漂泊集群触发区。模板保存基础消耗，动态支援不得永久改写船体白值。
  参考满编火力每dt: 14040
  火力说明: 仅为全部默认武器可同时攻击时的未命中/防御结算前合计，不能作为额外武器重复造成伤害；机群伤害另受减员与接敌限制。
  舰船单位模板:
    文明: 漂泊集群
    舰船类型: CA
    每日补给消耗: 12
    吨位: L
    驾驶员: ''
    是否旗舰: false
    观星者接口角色: ''
    超空间充能: 0
    最大充能: 6
    超空间消耗: 2
    制造商: 漂泊集群标准化工业平台
    描述: 集群相对远距离的集中打击单位；以牺牲部分机动与护盾换取能量武器输出。
    炮位配置: 2L2M
    装备槽位配置: 5H3L
    船体护盾值: 10500
    船体结构值: 3500
    护盾值: 10500
    结构值: 3500
    护盾DR: 20%
    结构DR: 20%
    护盾装甲: 25
    结构装甲: 40
    装配资源:
      PG: 570
      CPU: 800
    效果:
      船体加成:
      - 原生无人战体；最终白值按本档案读取，不重复乘人类品质或国家倍率。
      - 两条血条：护盾与结构；H/L槽数按现行舰级上限。
      装配减免: []
      内部结构:
        光子凝聚器: 完好
      内置电子系统:
        电子品质: 10
        内置跟踪: 30
        内置ECCM: 10
        侦测值: 20
        侦测距离km: 220000
        叠加规则: 内置跟踪已包含CPU和侦测器，不重复计算；外装模块另计。
      机动评级: 65
      闪避值: 14
      超空间核心稳定强度: 1
      原生超空间准备时间秒: 20
      特殊系统:
        能量武器增压器: 所有已安装能量武器基础伤害×1.30，只应用一次；包括光粒，不包括导弹、鱼雷和舰载机中队。
        光粒约束延寿: 光粒稳定射程×1.25，重型112500km、中型56250km；不产生射程外伤害。
    装备:
      重型光粒_1:
        品质: 12
        效果:
          伤害: 4200
          冷却: 1dt
          基础命中: 4
          跟踪: 0.02
          稳定射程: 90000km
          AP: 0%
          DRP: 0%
          衰竭: 稳定射程外伤害0；射程内不散射
          结算: 最终原生白值，不再乘品质倍率
        安装限定:
          船体文明: 漂泊集群
          所需内部结构:
          - 光子凝聚器
        装配要求: PG：100 | CPU：100 | 吨位：L | 炮位：1L | 装备槽位：无
        描述: 集群原生光粒发射器；只能安装在保有完好内部光子凝聚器的集群舰船上，不能跨文明移植。
      重型光粒_2:
