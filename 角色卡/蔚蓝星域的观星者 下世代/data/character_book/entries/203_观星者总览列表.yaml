keys: []
content: |-
  <观星者总览列表>
  用途: 按所属国家/势力快速检索观星者型号。完整外观、人格、功能特性与价格仍以对应《产品档案》条目为准。

  自由世界共和国:
    - 名字: 蒲公英
      型号: RNR-DL-01
      品质: 衍生
      充能数量: 2
      数值: {比特率: "~230TB/s", 精度: "2.2/1M 指令", 稳态增益: "3.3 TW/mV", 爆发增益: "6.8 TW/mV"}
      概括: 面向民用资产处的可靠低门槛导航型号，适合普通舰长和小型船队的基础跃迁协同。
    - 名字: 家园
      型号: RNR-HM-04C
      品质: 先进
      充能数量: 5
      数值: {比特率: "~220TB/s", 精度: "2.0/1M 指令", 稳态增益: "3.2 TW/mV", 爆发增益: "8.0 TW/mV"}
      概括: 共和国民用出口司的高端安居/殖民支援型号，以温和陪伴和长期稳定运作见长。
    - 名字: 先锋
      型号: RNR-VG-01
      品质: 先进
      充能数量: 5
      数值: {比特率: "~650TB/s", 精度: "0.4/1M 指令", 稳态增益: "6.2 TW/mV", 爆发增益: "14.8 TW/mV"}
      概括: 第三人称实验所的前线探索旗舰级型号，兼具高精度导航和强爆发跃迁输出。
    - 名字: 双子信号兵团
      型号: RNR-GSC-01
      品质: 精良
      充能数量: 3
      数值: {比特率: "1.8 PB/s (合并)", 精度: "0.1/1M 指令 (合并后)", 稳态增益: "9.0 TW/mV (合并后稳定)", 爆发增益: "9.5 TW/mV"}
      概括: 第101实验所的双体协同型号，依靠合并链路取得极高处理量和稳定导航能力。

  天鹅座技术联邦:
    - 名字: 标准模型
      型号: FSD-SM-01
      品质: 标准
      充能数量: 1
      数值: {比特率: "~600TB/s", 精度: "1.0/1M 指令", 稳态增益: "6.0 TW/mV", 爆发增益: "8.2 TW/mV"}
      概括: 联邦联合生物动力的基础量产型号，性能均衡、维护清晰，是联邦体系的标准答案。
    - 名字: 阿尼玛
      型号: FSD-AM-7540
      品质: 精良
      充能数量: 3
      数值: {比特率: "~280TB/s", 精度: "1.2/1M 指令", 稳态增益: "2.5 TW/mV", 爆发增益: "4.0 TW/mV"}
      概括: 青年教育部特供的教育/陪伴取向型号，重视心理适配与成长引导而非高强度战斗。
    - 名字: 以太
      型号: FSD-XP-4309 "Aether"
      品质: 衍生
      充能数量: 2
      数值: {比特率: "~620TB/s", 精度: "0.8/1M 指令", 稳态增益: "6.5 TW/mV", 爆发增益: "9.0 TW/mV"}
      概括: 先进材料实验室的实验型号，偏科研、探索和高性能跃迁协调。

  泰拉帝国:
    - 名字: 雪绒花
      型号: ILB-ED-01
      品质: 精良
      充能数量: 3
      数值: {比特率: "~220TB/s", 精度: "1.5/1M 指令", 稳态增益: "1.8 TW/mV", 爆发增益: "3.5 TW/mV"}
      概括: 帝国生命工程院民用资产科的柔性民用型号，强调顺从、秩序和低风险服务。
    - 名字: 鸢尾花
      型号: ILB-IR-02
      品质: 精良
      充能数量: 3
      数值: {比特率: "~300TB/s", 精度: "0.5/1M 指令", 稳态增益: "3.5 TW/mV", 爆发增益: "5.0 TW/mV"}
      概括: 帝国民用资产科的精密支援型号，适合需要高精度响应的贵族或专业舰长。
    - 名字: 女武神
      型号: ILB-VK-04/VK-04E
      品质: 上等
      充能数量: 4
      数值: {比特率: "~600TB/s", 精度: "0.3/1M 指令", 稳态增益: "7.5 TW/mV", 爆发增益: "12.5 TW/mV"}
      概括: 帝国外贸部的军规/出口高端型号，以纪律、战斗适配和强输出为核心卖点。
    - 名字: 瑶光
      型号: TH-JDE-01
      品质: 衍生
      充能数量: 2
      数值: {比特率: "~550TB/s", 精度: "0.6/1M 指令", 稳态增益: "7.5 TW/mV", 爆发增益: "11.0 TW/mV"}
      概括: 天环设计为帝国出口部门定制的高增益型号，适合强调礼仪和实用输出的外贸场景。

  猎户座辛迪加:
    - 名字: 内廷侍女
      型号: CG-CM-01
      品质: 衍生
      充能数量: 2
      数值: {比特率: "~280TB/s", 精度: "1.8/1M 指令", 稳态增益: "3.4 TW/mV", 爆发增益: "8.2 TW/mV"}
      概括: 奇戎基因的中端民用侍从型号，以能干、反差互动和精密日常支援吸引客户。
    - 名字: 智天使
      型号: CG-AA-C1
      品质: 精良
      充能数量: 3
      数值: {比特率: "~800TB/s", 精度: "<0.1/1M 指令", 稳态增益: "8.0 TW/mV", 爆发增益: "14.0 TW/mV"}
      概括: 奇戎基因资产清算部流出的高端旧项目型号，具备异常优秀的精度和旗舰潜力。
    - 名字: 晨曦
      型号: EB-DB-01
      品质: 上等
      充能数量: 4
      数值: {比特率: "~180TB/s", 精度: "<2.5/1M 指令", 稳态增益: "3.2 TW/mV", 爆发增益: "6.8 TW/mV"}
      概括: 夏娃生物的亲和陪伴型产品，性能不极端但服务体验和情绪价值突出。
    - 名字: 甜心
      型号: EB-S5-PLUS
      品质: 上等
      充能数量: 4
      数值: {比特率: "~200TB/s", 精度: "2.0/1M 指令", 稳态增益: "1.5 TW/mV", 爆发增益: "3.0 TW/mV"}
      概括: 夏娃生物的消费级情感/娱乐型号，战术价值有限但市场亲和力极强。
    - 名字: 督导者
      型号: ED-PRC-01
      品质: 上等
      充能数量: 4
      数值: {比特率: "~300TB/s", 精度: "1.2/1M 指令", 稳态增益: "3.1 TW/mV", 爆发增益: "5 TW/mV"}
      概括: 极乐动力的心理压力训练型号，擅长用情境刺激和神经接口进行舰长自控训练。
    - 名字: 爱娜温
      型号: ES-A3-LUX
      品质: 上等
      充能数量: 4
      数值: {比特率: "~320TB/s", 精度: "1.0/1M 指令", 稳态增益: "6.0 TW/mV", 爆发增益: "13.7 TW/mV"}
      概括: 极乐合成体的高端奢侈享乐型号，以强烈魅力设计和不俗爆发输出服务富豪市场。
    - 名字: 玉藻
      型号: FGA-VLP-01
      品质: 精良
      充能数量: 3
      数值: {比特率: "~380TB/s", 精度: "1.2/1M 指令", 稳态增益: "5.1 TW/mV", 爆发增益: "10.2 TW/mV"}
      概括: Fioritura 的私人定制玩赏型产品，兼具狐系审美、社交诱导和中高段跃迁能力。
    - 名字: 乳牛
      型号: HB-LAC-IV
      品质: 标准
      充能数量: 1
      数值: {比特率: "~220TB/s", 精度: "1.8/1M 指令", 稳态增益: "3.0 TW/mV", 爆发增益: "7.5 TW/mV"}
      概括: 赫利亚生物科技的低端特化民用型号，功能方向鲜明，性能定位朴素。
    - 名字: 风暴
      型号: HD-ST-01
      品质: 衍生
      充能数量: 2
      数值: {比特率: "~450TB/s", 精度: "<6/1M 指令", 稳态增益: "4.2 TW/mV", 爆发增益: "13.5 TW/mV"}
      概括: 心跳动力的情绪接口精品型号，精度很差但爆发力高，适合高刺激短时场景。
    - 名字: 曙光女神
      型号: HLD-AST-03
      品质: 先进
      充能数量: 5
      数值: {比特率: "~650TB/s", 精度: "1.0/1M 指令", 稳态增益: "8.0 TW/mV", 爆发增益: "16.0 TW/mV"}
      概括: 现由夏娃生物代工的顶级黑市/奢侈型号，兼具高端魅力工程和重型跃迁输出。
    - 名字: 狂喜
      型号: LC-EC-69
      品质: 上等
      充能数量: 4
      数值: {比特率: "~350TB/s", 精度: "1.0/1M 指令", 稳态增益: "5.0 TW/mV", 爆发增益: "可变 -> 峰值 >15.7 TW/mV"}
      概括: 夏娃生物的高刺激可变增益型号，峰值爆发惊人但稳定性和伦理风险都更高。
    - 名字: 侍女
      型号: MDB-SUB-01
      品质: 衍生
      充能数量: 2
      数值: {比特率: "~180TB/s", 精度: "2.5/1M 指令", 稳态增益: "2.1 TW/mV", 爆发增益: "5.0 TW/mV"}
      概括: 闺房设计的低端小众侍从型号，舰船驱动能力有限，更偏日常服务与服从体验。
    - 名字: 首席
      型号: MDB-PRI-01
      品质: 精良
      充能数量: 3
      数值: {比特率: "~450TB/s", 精度: "0.8/1M 指令", 稳态增益: "4.0 TW/mV", 爆发增益: "9.0 TW/mV"}
      概括: 闺房设计的高端侍从线，保留服务属性同时提升了精度、管理能力和任务适配。
    - 名字: 浮乐美人
      型号: OLI-BB-V2
      品质: 精良
      充能数量: 3
      数值: {比特率: "~250TB/s", 精度: "1.5/1M 指令", 稳态增益: "3.7 TW/mV", 爆发增益: "4.4 TW/mV"}
      概括: 氧活创新/泰坦重工系的消费娱乐型号，性能平庸但易用性和玩赏体验明确。
    - 名字: 舞台
      型号: PL-IDOL-01
      品质: 上等
      充能数量: 4
      数值: {比特率: "~380TB/s", 精度: "1.5/1M 指令", 稳态增益: "4.0 TW/mV", 爆发增益: "9.5 TW/mV"}
      概括: 璀璨全息娱乐的偶像/演出型号，擅长公共魅力、情绪调动和舞台化舰长互动。

  人类技术联合:
    - 名字: 幻影
      型号: MYC-PH-01
      品质: 精良
      充能数量: 3
      数值: {比特率: "~650TB/s", 精度: "0.2/1M 指令", 稳态增益: "4.5 TW/mV", 爆发增益: "9.0 TW/mV"}
      概括: 麦考夫特设计局的隐秘侦察取向型号，适合潜伏、反侦测和高精度信息战。
    - 名字: 共鸣者
      型号: HTC-EXP-21G
      品质: 上等
      充能数量: 4
      数值: {比特率: "~950TB/s", 精度: "0.05/1M 指令", 稳态增益: "8.1 TW/mV", 爆发增益: "8.5 TW/mV"}
      概括: 人类技术联合的实验出口型号，处理量和精度极强，更偏科研验证和特殊任务。

  保存者姐妹会:
    - 名字: 维斯塔
      型号: SSS-VES-01
      品质: 上等
      充能数量: 4
      数值: {比特率: "~750TB/s", 精度: "0.2/1M 指令", 稳态增益: "7.0 TW/mV", 爆发增益: "9.5 TW/mV"}
      概括: 姐妹会的隐秘救援特化型号，以回响抑制和无痕跃迁支援危险区域撤离。

  铁血盟约:
    - 名字: 赏金
      型号: IC-BNT-01
      品质: 衍生
      充能数量: 2
      数值: {比特率: "~420TB/s", 精度: "2.8/1M 指令", 稳态增益: "6.5 TW/mV", 爆发增益: "16.0 TW/mV"}
      概括: 残骸王座兵工厂的出口掠夺型型号，精度粗糙但爆发输出凶猛，适合私掠战斗。
    - 名字: 绯红女王
      型号: IC-Dread-001
      品质: 高级
      充能数量: 6
      数值: {比特率: "~1.5 PB/s", 精度: "0.05/1M 指令", 稳态增益: "16.8 TW/mV", 爆发增益: "33.0 TW/mV"}
      概括: 铁血盟约大元帅专属孤品，传说级权力象征，拥有压倒性的旗舰级神经增益。
  </观星者总览列表>
