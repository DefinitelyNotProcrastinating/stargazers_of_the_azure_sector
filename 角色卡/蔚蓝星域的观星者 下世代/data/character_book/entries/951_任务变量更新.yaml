content: |-
  <quest_management>
  # 任务变量更新规程
  - 所有任务存储于 `主角.任务`，格式为 `{"任务标题": Object}`。
  - 任务标题是唯一 key。不得在对象内部重复存储任务名称。
  - 接取任务使用 `insert`，更新具体字段使用 `replace`，完成、失败或放弃后使用 `remove`。
  - 禁止覆盖整个 `/主角/任务`。

  ## Schema
  ```json
  {
    "任务标题": {
      "类型": "委托 / 探索 / 战斗 / 运输 / 工业 / 科研 / 外交 / 个人",
      "描述": "string",
      "目标": ["string"],
      "进度": "string",
      "截止时间": "ISO 8601 字符串或 无期限",
      "奖励": "string",
      "发布方": "string",
      "状态": "进行中"
    }
  }
  ```

  ## 当前数据
  <raw_quest_data>
  <%-JSON.stringify(getvar("SAM_data.static.主角.任务") || {}, null, 2)%>
  </raw_quest_data>
  </quest_management>
