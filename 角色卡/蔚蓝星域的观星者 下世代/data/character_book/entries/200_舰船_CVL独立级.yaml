- 独立
content: |-
  <ship_desc>
  “自由必以鲜血换取。”
  -   级别: 独立级 (Independence-class)
  -   类型: 轻型航母 CVL
  -   价格: 3.5B
  -   形态: 舰体设计来自约135年前，是共和国鼎盛时期的经典之作，呈一个修长而对称的菱形。四条巨大的引擎舱对称地分布在舰体后方，赋予其强大的机动性。开放式的起降甲板和传送轨道贯穿舰体上层，两侧则是模块化的无人机库和指挥中心。在巴哈姆特级超级航母服役后，决战兵器的地位被巴哈姆特级替代。
  -   制造商: 共和国太空军造船厂
  -   静态配置文件:
      -   舰体全长: 2950米
      -   标准船员配置: 180人
      -   性能评级:
          -   装甲: 62000
          -   护盾: 68000
          -   机动性: 42
          -   火力输出: 35000 (无人机)
          -   回复量: 15000 (维修无人机与护盾传输)
      -   武器系统:
          -   主要系统: 6x 拦截机机库, 6x 轰炸机机库，每个编队8架，可自选战斗机。
          -   次要系统: 30x “暴雨”集群点防御导弹巢
          -   攻击射程: 220000 km (无人机作战半径)
      -   特殊系统:
          -   名称: 独立级指挥网络
          -   描述: 一套经过数十年实战检验和优化的舰队指挥增效系统。作为旗舰时，“独立”级能够大幅提升其所在舰队的作战协同效率。所有在该网络下的友军单位，其无人机的出动和回收速度提升10%，跃迁引擎的充能时间缩短5%。这些看似微小的增益，在长时间、高强度的战斗中，能够累积成决定性的优势。
      -   观星者需求: 需要5TW/mV的稳态增益和小于1的错误率。比特率应当至少是400

  </ship_desc>
