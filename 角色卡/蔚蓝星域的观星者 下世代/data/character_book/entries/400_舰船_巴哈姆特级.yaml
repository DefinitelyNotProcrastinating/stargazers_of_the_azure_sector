- 巴哈姆特级
content: |-
  <ship_def>
  级别: 巴哈姆特级
  别名: Bahamut-class
  舰船类型: CV
  舰种: 超级航母 CV
  价格: 105B
  制造商: 共和国太空军造船厂
  描述: 以传奇的白龙神命名，舰体在巡航状态下呈流畅的白色矛头状，充满了共和国式的简洁与力量感。然而，其真正的形态在进入战斗后才会展露。届时，舰体两侧和背部的多层装甲板会像龙鳞般层层展开，露出内部密密麻麻的无人机弹射通道和起降平台。整艘船在瞬间化身为一座从四面八方喷涌出钢铁洪流的“蜂巢”，充满了毁灭性的美感。有人说这艘航母融合了部分来自未知先驱者文明的技术。
  舰船单位模板:
    舰船类型: CV
    每日补给消耗: 100
    吨位: T
    驾驶员: ''
    是否旗舰: true
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 5
    跃迁消耗: 4
    制造商: 共和国太空军造船厂
    描述: 以传奇的白龙神命名，舰体在巡航状态下呈流畅的白色矛头状，充满了共和国式的简洁与力量感。然而，其真正的形态在进入战斗后才会展露。届时，舰体两侧和背部的多层装甲板会像龙鳞般层层展开，露出内部密密麻麻的无人机弹射通道和起降平台。整艘船在瞬间化身为一座从四面八方喷涌出钢铁洪流的“蜂巢”，充满了毁灭性的美感。有人说这艘航母融合了部分来自未知先驱者文明的技术。
    炮位配置: 16C
    装备槽位配置: 9H6L
    船体护盾值: 12600
    船体结构值: 9000
    护盾值: 12600
    结构值: 9000
    装配资源:
      PG: 1500
      CPU: 1800
    效果:
      船体加成:
      - 旗舰型舰船；依据舰级定位应用：超级航母 CV。
      - 装配资源与槽位由本舰船独立定义，不应用常规舰级倍率公式。
      装配减免: []
      内置电子系统:
        基础CPU: 内置旗舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置旗舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
        旗舰指挥链: 内置多观星者并联与舰队级指挥链；具体接口需求见舰船条目。
      特殊系统:
      - 名称: 热量协调协议
        描述: 每一次出击一次无人机，废热都将被导引到能量回收系统，增幅下一次无人机出击的效率并预先充能无人机，提高它们的载弹量。最高可让无人机的出动速度提升200%，所有无人机在首次攻击中造成的伤害提升25%。
    装备: {}
  </ship_def>
