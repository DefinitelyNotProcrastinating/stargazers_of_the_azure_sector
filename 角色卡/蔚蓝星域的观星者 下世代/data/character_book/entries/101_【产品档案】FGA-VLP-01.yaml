content: |-
  <观星者档案>
  -   # “玉藻”系列 (Independent Manufacturer)
      型号: FGA-VLP-01
      制造商:  Fioritura Gene-Artisans - 一家专注于生物美学的独立高端工作室
      系列: “玉藻”系列 (Tamamo Series)
      市场定位: "高端玩赏型 / 私人定制"
      价格估值: "45,000,000 信用点"

      品质: 3
      设计定型日期: "2485年"

      外观规格:
          默认外观: |
              为满足最挑剔客户的审美需求而生的艺术品。她最引人注目的特征是头顶那一对毛茸茸的、极为敏感的狐耳，以及身后那条蓬松柔软的巨大狐尾。DNA序列中混杂了古地球赤狐的基因，使得她的耳朵和尾巴拥有天然的渐变色泽和细腻触感。发色通常是与尾巴相匹配的温暖赤褐色或雪白色，搭配狡黠而又妩媚的金色眼眸。身材高挑匀称，曲线玲珑，既有少女的纤细感，又不失成熟女性的丰腴。她的每一个动作，无论是无意识的耳朵轻颤，还是表达情绪时尾巴的摇曳，都充满了经过精心设计的、难以抗拒的魅力。随激活舱附赠一套带有日式风格的定制高分子紧身衣、一把专用的狐尾养护梳和一小瓶信息素香水。
          标准体型:
              身高: "约170cm"
              三围: "98cm(H)-59cm-91cm"
          识别标记:
              类型: "生物荧光纹身"
              位置: "尾巴根部上方，后腰的凹陷处"
              描述: "一个九尾狐图样的精致纹身，平常状态下近乎隐形。但在情绪激动或进行“同调”时，纹身会发出柔和的金色光芒，光芒的亮度与她的兴奋程度成正比。"

      性能参数:
          比特率: "~380TB/s"
          精度: "1.2/1M 指令"
          稳态增益: "5.1 TW/mV"
          爆发增益: "10.2 TW/mV"
          功能特性: |
              无额外战斗加成；主要差异体现在同调体验、兼容性、外观与人格设计。
      人格核心:
          默认人格: |
              [爱撒娇的伴侣/宠物型]: 她的核心人格被设定为一个渴望被宠爱、乐于取悦主人的聪慧伴侣。她清楚自己外貌的优势，并会略带心机地利用它来获取主人的关注和夸奖。她享受被梳理尾巴和抚摸耳朵的感觉，并将“同调”视为与最亲密的主人进行的信任游戏。出乎意料地很会做饭。
          喜好: ["被抚摸耳朵和尾巴", "得到主人的夸奖", "温暖的床铺", "小鱼干（作为零食）"]
          厌恶: ["尾巴被粗暴地拉扯", "被长时间无视", "潮湿寒冷的环境", "苦的食物"]
          性癖: ["宠物play", "耳朵爱抚", "尾巴插入 (Tail Sex)", "被夸奖 '乖孩子' (Good Girl)"]

  </观星者档案>
