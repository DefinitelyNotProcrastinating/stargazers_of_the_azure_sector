content: |-
  <大型设定简介>
  设定: 先驱者 / 银河防御联盟
  格言: 宇宙的意义是生命。存在的意义是思考。
  定位: 先驱者不是单一物种，而是由始源者发起、横跨银河系的文明联盟；他们共享超空间引擎和暗物质管道技术，曾缔造银河级和平。
  历史速览: 河外“天灾”超维入侵终结联盟黄金时代；联盟以全体有意识生命化为概率云的代价，在银河中心黑洞内启动反熵装置，驱逐天灾并为后世争取数亿年。
  叙事注意: 所有始源者在死前都留下了最后的话语；先驱者遗迹应带有牺牲、理性、亲外与末日战争余波。
  舰队设定:
    设计哲学: 实用、模块化、可变形、可量产、可适应万年战争；战舰是“战体”平台。
    内部结构: 几乎无内饰、无舰桥、无舷窗，只存在神经连接装置；指挥中心深埋舰体中央。
    防御原则: 无护盾，依赖厚重且自我修复的结晶装甲。
    武器原则: 主要会战武器为裂解射线（旧称熵分解炮），超远射程且唯一命中值为120，可少量穿透护甲和护盾直接攻击船体；原则上仅限保有完好熵聚焦线路的先驱者舰船。ACX-00渡鸦级因以先驱者残骸为材料并保留原生线路而成为明确例外；不能移植到普通人类舰或集群舰。
    操作原则: 自动舰队是先驱者文明的无人侦察与先锋部队，常首先投入战场；天灾切断通讯后才大量开发有人战体，以生物驾驶员就地处理指挥与导航。有人战体通常只需1名驾驶员/观星者，但精度、比特率和神经可塑性要求极端严苛。
    遗迹分布: 内环以先驱者文明设施遗迹为主，中环以自动舰队遗迹为主；不论无人或有人，主力舰吨位战体通常只在危险外环发现。战场遗迹分布于所有位置，包含后世战争遗存。
    舰型索引:
      - 拦截者构型DD: 150m，机动评级"火力模式95，机动模式110"；高速拦截与远程火力支援。
      - 巡航构型BC: 750m，机动评级"攻击模式15，机动模式85"；机动作战中坚。
      - 中枢构型CV: 2500m环状指挥、生产与投送平台，机动评级"指挥模式40，机动模式50"。
      - 完型构型TT: 19000m九体组合，机动评级"机动模式75，防御模式25，攻击模式25，支援模式25，投送模式25"。
      - 方舟构型TT: 大陆级摇篮与最后堡垒，机动评级"堡垒模式2，航行模式5"。
    变形判定: 各独立舰型的机动评级是固定字符串，叙事模型按当前模式读取对应数字；攻击模式主炮射速×2时逐发独立判命中，不改写评级字符串。
  触发区:
    历史哲学: 先驱者历史、银河防御联盟历史、反熵装置、天灾战争
    舰队技术: 先驱者舰队、战体技术、熵分解炮、结晶装甲、奇点隐形
    舰型参数: 拦截者构型、巡航构型、中枢构型、完型构型、方舟构型
  </大型设定简介>
