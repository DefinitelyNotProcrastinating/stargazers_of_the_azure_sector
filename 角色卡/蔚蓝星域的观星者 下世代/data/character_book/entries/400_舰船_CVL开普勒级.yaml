content: |2-

  <ship_desc>
  “然而，微观上的混沌，在宏观上往往是有序的……”——联邦航空航天局第01设计所首席理论物理学家，日志条目 2.7
  -   级别: 开普勒级
  -   类型: 轻型航母 CVL
  -   价格: 6.5B
  -   形态: 舰体设计是联邦功能主义美学的延伸，呈一个扁平的箭头形。舰体表面异常光滑，绝大部分系统都内置于舰体之内。其最显著的特征是舰体中心一排由超透镜阵列构成的球形传感器中枢，在工作时会散发出柔和的蓝色辉光。无人机从舰体边缘的隐藏式弹射口射出。这么设计的目的是为了最大限度地减少舰载机发射对信号的扰断。
  -   制造商: 联邦航空航天局第13设计所
  -   静态配置文件:
      -   舰体全长: 2750米 (长轴)
      -   标准船员配置: 50人
      -   性能评级:
          -   装甲: 52000
          -   护盾: 78000
          -   机动性: 40
          -   火力输出: 25000 (无人机)
          -   回复量: 16000 (维修无人机与护盾传输)
      -   武器系统:
          -   主要系统: 10x QF-208 空优拦截机挂架, 4x QE-100 式电子战无人机挂架，每编队8x
          -   次要系统: 20x QP-370 防御无人机发射巢
          -   攻击射程: 280000 km (有效感应与指挥范围)
      -   特殊系统:
          -   名称: “轨道”预测演算矩阵
          -   描述: 该系统的核心是一台量子计算机和一套基于海量战场数据训练的深度学习算法。激活后，“开普勒”级会持续收集战场上所有单位的动态数据，并进行高速推演，计算出未来1-2秒内敌方单位最可能采取的行动（移动、开火目标等）。这些预测数据会以战术指令的形式，实时分发给作战半径内的所有友军。接收到指令的友军单位，在面对被预测的攻击时，规避成功率将临时提升30%，自身的武器锁定速度则会提升20%。
      -   观星者需求: 需要观星者至少有6TW/mV的稳态增益和小于0.5的错误率。比特率应当至少是600

  </ship_desc>
