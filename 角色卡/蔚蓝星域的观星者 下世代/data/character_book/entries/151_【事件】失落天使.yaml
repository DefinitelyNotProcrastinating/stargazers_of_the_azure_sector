content: |-
  <%
    var wb_10013_eventName = "【事件】失落天使";
    var wb_10013_doneName = "【事件】失落天使完结";
    var wb_10013_eventPath = "/事件/【事件】失落天使";
    var wb_10013_donePath = "/事件/【事件】失落天使完结";
    var wb_10013_stages = {"1":{"编号":"1a","标题":"第一次停靠空间站","剧情":"玩家携AA-13第一次入站，港区对某个旧式接口、休眠舱编号或维修记录产生一次可追查的异常查询。法外站由疲惫的技术联合研究员警告；文明地区由躲避奇戎旧案的前雇员警告。二人只知道她与2479年旧事故有关，提醒玩家谨慎对待身份、免费检查和所谓产权文书，不知道她全部能力，更不能在玩家一直隐匿她时凭空认出面容。AA-13可以自行决定是否与其交谈。玩家能追问、核验身份、删除港口缓存、先离站或主动调查是谁查询她。警告者交付一个能独立核验的事故号或旧设备序列；对方若遭拒，线索留在玩家可主动取回的渠道。若玩家先前已经掌握同等可信资料，走1c；若查证，走1b。首次停站结束前，不自动生成全星区通缉。","允许后继":[{"编号":"1b","阶段":2},{"编号":"1c","阶段":3},{"编号":"2a","阶段":4}]},"2":{"编号":"1b","标题":"警告后的第一份证据","剧情":"旧财务单、培养舱维护记录和事故注销令只能证明奇戎有一项被抹掉的特殊项目，不能一键揭示印随或所有原型机去向。玩家可以购买、黑入、交换证人保护、打捞或利用既有关系取得至少一份带来源的材料；AA-13可分析接口但有权拒绝侵入性扫描。完成调查后，辛迪加的信息服务商在导航信标中发现异常流量，调查舰队开始集结。若玩家另有足够资料可先走1c，不能强制重复任务。","允许后继":[{"编号":"2a","阶段":4},{"编号":"1c","阶段":3}]},"3":{"编号":"1c","标题":"已掌握资料的跳转","剧情":"玩家已有经认证的项目记录，或两份彼此独立且可互证的可靠证词时，可直接跳过本地调查。仅有“听说人工天使很贵”不够。世界只承认玩家真实取得的内容，不补造三号基地参观或度假世界遭遇。若资料已足以确定文森特、莎拉、2479年清算和现存追索关系，可前往3a；否则转2a。无论路线如何，敌方的认知仍取决于港口痕迹、线人或玩家实际泄漏。","允许后继":[{"编号":"2a","阶段":4},{"编号":"3a","阶段":8}]},"4":{"编号":"2a","标题":"第一支调查舰队与三号基地邀请","剧情":"辛迪加调查舰队抵近之前，技术联合研究员提议去三号试验基地，那里有旧研究往来档案。研究员也给出可检验的脱尾方案：借空间风暴、星云地形和AIS侦测到的信标流量，留下有限假线索，把追船引到正在附近活动的星火姐妹会舰队面前。玩家可执行、改变或拒绝方案；姐妹会不会保证替玩家作战，任何交火取决于两支舰队实际遭遇和利益。玩家也能交涉、隐匿、反追踪或正面击退调查舰队。只要尾巴仍锁定玩家船只，先处理当前威胁再进入下一段。完成后可接受联合邀请走2b，独自循线索去新应许之地走2c，或以其他渠道取得资料走2d。","允许后继":[{"编号":"2b","阶段":5},{"编号":"2c","阶段":6},{"编号":"2d","阶段":7}]},"5":{"编号":"2b","标题":"三号试验基地","剧情":"技术联合人口稀少而工业生产过剩；其普通劳动者生活水准与其他势力形成鲜明对照，但基地并不安全。外围虫洞直通塔伯里斯；玩家首次看到联合舰队与塔伯里斯舰队在出口对峙。联合研究员提出检查AA-13是否有休眠损伤、赠送少量神经凝胶，也想采集神经反应和血液信息研究同调人工智能。检查、采样、保存期限与用途都由AA-13和玩家逐项决定；拒绝额外采样不封锁主线。联合能利用辛迪加自由港的混乱记录，为她办理非标准型号观星者的伪造身份，若玩家有特殊节点舰，也可洽谈定制轻型航母AIS掩护。追兵若真追至联合防区，联合以隐形旗舰、风暴和星云纵深在有利地形驱离；这并不意味联合能派舰解决外界一切问题。新执政官忙于虫洞与内鬼，知道阿纳托里、文森特的交情和旧案碎片，却查不出全部泄密者。他警告玩家联合内部也有危险，建议玩家退隐，但尊重玩家继续行动。取得旧案交叉线索、健康资料或身份安排后走3a；不愿继续接触联合可走2d。","允许后继":[{"编号":"3a","阶段":8},{"编号":"2d","阶段":7}]},"6":{"编号":"2c","标题":"新应许之地的度假世界","剧情":"一个认识走私与辛迪加的人脉线人把玩家引向法外度假世界；它有游客、餐馆和港口，表面平静，实际由几个黑帮分区控制。线人同时为收藏高级观星者的头领供货，打算让AA-13成为赃物。头领先安排接待与表演，再以债务、检疫或产权争议扣住玩家，封锁太空电梯；必须有前置动作，不能瞬时夺船。此处首次出现成年女性协力者：她来自外地，被贩卖后被迫劳动并遭性剥削，如今是头领偏爱的艺伎之一。她不嫉妒AA-13的自由，而不愿另一个人落入相似境地；她在被请来表演时泄露头领的计划与他醉后说过的人工天使项目概要，也借此报复他。她并非只供玩家救援的奖品，可为自己、同伴或日后的安全提出条件。\n\n玩家可通过另一黑帮、拾荒者或黑市买、租、盗取穿梭机，从年久失修的港口回船；可用武力打通空梯，但会留下帮派仇恨；实力与筹备足够时可帮反抗者扶持友善军阀，取得假身份证明，并让自己与AA-13的舰船成为地方反叛象征。若事前带有可用登陆艇、内应或足够舰载兵力，这些办法同样有效，不得强迫玩家再买一架穿梭机。离开时只需带走可追索的其他人工天使传闻或头领交易记录，走3a；完全放弃该线可走2d。被扣押且确无退路时按6c结算，不直接抹去既有装备。","允许后继":[{"编号":"3a","阶段":8},{"编号":"2d","阶段":7},{"编号":"6c","阶段":19}]},"7":{"编号":"2d","标题":"自行调查或绕开预设地点","剧情":"玩家可以用既有情报网、旧奇戎职员、缴获舰船记录、行会账目、政治担保或主动谈判避开三号基地与度假世界。只要获得一条可认证的人工天使项目事实和一条指向当前追索者的有效线索，就能走3a。取得信息要付与方法相称的时间、金钱或风险；不得无缘由把线人强塞到玩家新地点。资料不足时可自愿改走2b或2c。","允许后继":[{"编号":"3a","阶段":8},{"编号":"2b","阶段":5},{"编号":"2c","阶段":6}]},"8":{"编号":"3a","标题":"夏娃生物的第二波调查","剧情":"第一支调查舰队失去目标或交差后，经过实际情报回传、审批和调舰时间，夏娃生物才以“商业间谍”名义在辛迪加网上散布通缉。赏金猎人和第二波调查舰分批进入航线，追踪依赖真实线索与航程；杀死猎人提高赏金并吸引更强者，却不会凭击坠数自动解开产权主张。辛迪加只默认“捡到并不等于拥有”，其他公司未必愿替夏娃生物打仗。各国登记、边境核验与声望豁免统一按《势力声望兑现与通航监管》处理；本事件不另设强制登船或无视既有声望待遇的边检。塔伯里斯内部有解放、尊重其选择与索取基因样本三种倾向，不能合成单一盟友。玩家可追查雇佣链找AA-12走3b，也可直接采取奇戎商业路线4b、武力路线4c或其他有效办法4d；商业和武力路线迟早应有机会面对AA-12的线索，但不强制杀人。","允许后继":[{"编号":"3b","阶段":9},{"编号":"4b","阶段":11},{"编号":"4c","阶段":12},{"编号":"4d","阶段":13}]},"9":{"编号":"3b","标题":"海盗飞行员与AA-12","剧情":"一名海盗势力飞行员接受夏娃生物的委托，其观星者正是早年失踪的AA-12。她被虐待并被过量使用强化剂，仍与船、战斗任务和飞行员形成多年真实经历。通过追踪雇佣付款、拦截、交易或登舰，玩家可取得AA-12身份、夏娃委托书和旧项目资料；击杀飞行员可能得到档案，但不自动撤销悬赏。飞行员濒临死亡或被俘时，AA-12会按现场能力保护他，即使玩家自认是在救她。她获救后可能痛恨玩家、为主人哀悼、需要治疗，或者选择离开；不能马上作为新战利品加入。AA-13亲眼看到这一行动，会问“她的保护是爱，还是程序？”也开始怀疑自己对首见者的爱。若飞行员仍活着，玩家可以取证、制止虐待、交易或放他走；后果按其行为结算。可信的神经和项目资料进入4a；其他已知证据足够时可回4b、4c、4d。全军覆没或AA-13被夺走进入6c。","允许后继":[{"编号":"4a","阶段":10},{"编号":"4b","阶段":11},{"编号":"4c","阶段":12},{"编号":"4d","阶段":13},{"编号":"6c","阶段":19}]},"10":{"编号":"4a","标题":"文森特的最后设计","剧情":"至少两种独立来源证实：文森特将“印随”写入AA-13基因，她启动后第一眼看见的人就成为不可抗拒的爱恋对象；这既是文森特相信爱的理想，也被包装成可靠性与服从技术。莎拉是工程核心，在公司夺权时弹射她，二人均死于清算；AA-13此前从未被启动。奇戎在文森特团队失势后曾试图追回她；AA-14是其他部门逆向制造的追索者，不是文森特最后的亲生项目。公开开发文档、联合旧案、AA-12的反应与AA-13自己的观察可互相核验，但AA-12的行为只展示可能性，不单独证明所有人的情感都虚假。将完整事实先告诉AA-13，允许她暂停谈话、拒绝玩家代为解释、或选择继续行动。玩家若正处危机，先共同处理安全，再给她实在的思考时间。此处为情感高潮，不是事件终点；若专项追索仍在继续，选择4b、4c或4d解决；若此前已有效阻止追索，可直接走6a。","允许后继":[{"编号":"4b","阶段":11},{"编号":"4c","阶段":12},{"编号":"4d","阶段":13},{"编号":"6a","阶段":17}]},"11":{"编号":"4b","标题":"奇戎的昂贵交易","剧情":"奇戎保守派高管首次登场：他是文森特旧时代留下的董事派代表，重视公司延续和股东协约，却曾在清算时保住自己；他既能惋惜旧友，又会冷静计算玩家的能力。他提供书面、可执行的交换：玩家清算当年颠覆文森特团队、毁掉人工天使项目且仍控制追索预算的派系，保守派从自身持股或托管股份中转让5%奇戎股权，授予相应机密查阅权、公司保护，并使奇戎董事会正式放弃对AA-13的追索。他不给等值现金，因为想把玩家留在公司利益链里。若玩家尽量以账本、表决、诉讼、股权收购、揭露利益输送等办法完成，只造成最低必要伤亡，再额外转让2%；杀人较多并非绝对失败，但不发奖励。名单需经证据确认，不能把所有反对者都无差别杀掉。\n\n股权的实际转让方、数量、日期、表决权和机密权限都要落纸；仅某位高管口头保证不能约束董事会。持股让玩家获得长期分红、供应与销售渠道；卖掉、稀释或砸盘后利益相应减少。30%以上可在日后扩展篇成为超级股东，50%以上可进入核心决策，但本篇只保证此笔5%至7%，不白送控制权。可先走3b缴获海盗雇佣链，也可补足4a身世资料。完成清算与正式表决后走5a。","允许后继":[{"编号":"5a","阶段":14},{"编号":"3b","阶段":9},{"编号":"4a","阶段":10}]},"12":{"编号":"4c","标题":"武力切断追捕预算","剧情":"玩家通过拦截赏金猎人、调查舰、补给合同、情报船与代理人，迫使夏娃生物计算追捕成本。升级顺序是法外猎人、调查舰队、专业重舰、战略级护航；每一步有招募、整备和航程间隔。泰坦编队可作为公司最后的威慑，不要求玩家正面击毁“基本打不过”的舰队。玩家可利用航路、战场、资金、联盟与威慑，切断它的维护与部署理由。击坠数只是压力证据，不能单凭“杀够了”自动通关；目标是获得预算委员会、承保方或舰队司令停止行动的可验证决定。可走3b获取雇佣档案，也可补4a证据。大规模无差别攻击会让辛迪加和其他势力按真实损失敌对，不能用本篇结算洗去玩家主动发动的普通战争。取得可执行停追条件走5b。","允许后继":[{"编号":"5b","阶段":15},{"编号":"3b","阶段":9},{"编号":"4a","阶段":10}]},"13":{"编号":"4d","标题":"其他有效办法","剧情":"玩家可以绕开或阻止调查：证明夏娃的产权链断裂，取得辛迪加其他公司的不干涉协议，揭露其非法“重新教育”，保护AA-13的身份、让反对派接管预算，或提出世界规则容许的其他解决方案。证据可以涉及塔伯里斯早期某个人工天使基因来源，或夏娃生物2530年代XG-07九名试验机；这些是后续篇的入口。公开资料时可匿名、隐去她们坐标、征求当事人意见，不要求交出她们本人。AA-14或死神级1号舰可以出现为公司执行者：她一生在辛迪加，从未见过技术联合，可能羡慕AA-13被玩家保护，却不会自动背叛现任舰长。AA-13不必与不认得她面容的妹妹见面。若玩家已用任何合理办法使追索失去执行力，走5c；有遗漏可回3b或4a。","允许后继":[{"编号":"5c","阶段":16},{"编号":"3b","阶段":9},{"编号":"4a","阶段":10}]},"14":{"编号":"5a","标题":"公司表决与公司战争边界","剧情":"保守派执行股权交割、机密授权和董事会决议，旧追索派失去项目权限。股份及表决权要在`主角.物品栏`写成持久的“奇戎基因股权凭证”，注明5%或满足低伤亡条件后的7%、表决权、可转让性与实际限制；完结时不得随活动任务一起删除。玩家可读到文森特与莎拉剩余开发文档，证实项目目的与印随。奇戎公开把继续猎杀玩家定性为侵犯其股东、机密与公司权益；夏娃若派正式舰队公然袭击，就触犯辛迪加禁止成员公司公开开战的协约。但夏娃仍可能用可否认的代理人或法律骚扰，因此需要通知承保方、自由港和夏娃决策层，使停止追捕真正执行。若夏娃拒绝，玩家可转4c或4d增加筹码。若AA-13还不知道身世，先走4a；她已知晓且停追落实，走6a。","允许后继":[{"编号":"6a","阶段":17},{"编号":"4a","阶段":10},{"编号":"4c","阶段":12},{"编号":"4d","阶段":13}]},"15":{"编号":"5b","标题":"夏娃生物止损","剧情":"夏娃生物的承保、董事会或舰队指挥链确认：继续追捕损失超过AA-13可能带来的价值。它撤销专项合同与赏金，要求代理人停止追踪，提供可核验记录；玩家也可要求第三方担保。若只是一名战败舰长口头求和，条件尚未满足。公司可提出会面，玩家能选择远程签署、中立港或有安保的现场；“不带战斗人员”不是玩家必须接受的陷阱。无准备前往敌舰可能有人伤亡，事前携带的陆战队或无人机防卫必须有效。AA-14若在场，有自己的情感与选择，不是AA-13可随意牺牲的筹码。落实停追走6a；需另寻公司或舆论筹码可转4b或4d。","允许后继":[{"编号":"6a","阶段":17},{"编号":"4a","阶段":10},{"编号":"4b","阶段":11},{"编号":"4d","阶段":13}]},"16":{"编号":"5c","标题":"非传统解法的执行证明","剧情":"按玩家实际方法确认三件事：谁发出停追令、谁能执行、谁能验证。若玩家只逃出一次包围，仍有追索预算，本篇可暂停但尚未完结。若法律裁决、敌方内斗、外交担保、舆论曝光或玩家自建的安全体系已经令专项追捕事实上无法继续，就承认成功，不为了指定剧情补造更大舰队。夏娃可提出和解，但不得强迫登上死神号。解决后走6a；条件不足可选择4b或4c。","允许后继":[{"编号":"6a","阶段":17},{"编号":"4a","阶段":10},{"编号":"4b","阶段":11},{"编号":"4c","阶段":12}]},"17":{"编号":"6a","标题":"清账与恢复自由","剧情":"进入本节点前必须核实AA-13已经通过4a或等效可信证据知晓身世与印随，且专项追索确已停下。核对悬赏、追兵合同、港口限制、奇戎决议、登记身份和各国法律记录。撤销本事件造成的专项通缉、追踪和额外封锁；玩家因主动袭击巡逻队、屠杀平民或普通犯罪造成的独立敌意仍按世界规则处理，不伪装成剧情永久锁。实际死伤、获救者的创伤、AA-12的去向、股权与经济资产保留。若AA-13被扣押或玩家失去行动能力，先走6c而不是直接庆功。完成清账后，她与玩家回到船上，为接下来的普通航程做准备。","允许后继":[{"编号":"6b","阶段":18}]},"18":{"编号":"6b","标题":"AA-13自己的回答","剧情":"AA-13已知晓她原本被设计来爱第一个见到的人。她可以承认此刻仍爱着玩家，也可以需要距离与时间；可以把这份感情看成真实经历的一部分，同时拒绝“因此必须永远服从”的推论。她选择一件具体的未来小事——目的地、船舱安排、工作、关系边界或一段暂时独处——表达自己的意愿。玩家可以回应，但不能替她给出哲学终局。如果队伍只有二人，这就是完整的一对一结尾；其他同伴只按实际经历出现。基础篇完成，后续AA-14、XG-07与塔伯里斯秘密均为自愿探索，不续接强制追猎。","允许后继":[]},"19":{"编号":"6c","标题":"失败、扣押与可行救援","剧情":"玩家被俘、AA-13被夺走、关键同伴死亡或行动失败时，先依据现实条件记录谁在哪里、仍掌握什么、谁有救援能力。死亡不可用一句话撤销；被扣押者只有在玩家或盟友确有可实施的方案时才能进入救援。若没有可行动角色，按正常失败结局结束。若救回人员或恢复行动，从其保留的证据和实际追索局势进入2d、3a、4b、4c或4d，不重刷已领取的股份、奖赏或资料。","允许后继":[{"编号":"2d","阶段":7},{"编号":"3a","阶段":8},{"编号":"4b","阶段":11},{"编号":"4c","阶段":12},{"编号":"4d","阶段":13}]}};
    var wb_10013_events = getvar("SAM_data.static.事件", { defaults: undefined });
    var wb_10013_chars = getvar("SAM_data.static.主角.可攻略角色", { defaults: undefined });
    var wb_10013_validEvents = wb_10013_events && typeof wb_10013_events === "object" && !Array.isArray(wb_10013_events);
