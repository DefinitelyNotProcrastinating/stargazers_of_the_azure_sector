        wb_10013_rootWrite + "首次在持有AA-13后的停站行动中，用JSON Patch insert " + wb_10013_eventPath + "={\"阶段\":1,\"trigger\":\"已激活\",\"经历\":{}}；若本轮还未停站，只等待，不提前记录警告。" :
        "仅在当前节点的事实与玩家选择支持后继时，用JSON Patch replace " + wb_10013_eventPath + "/阶段 为允许后继中的对应整数；不得推算阶段+1、连跳或补写未走路线。人物、证据、资产与伤亡只记录真实发生之事。";
