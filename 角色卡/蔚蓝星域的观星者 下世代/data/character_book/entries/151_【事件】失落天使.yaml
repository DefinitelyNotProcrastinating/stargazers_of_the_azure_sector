        wb_10013_write += " AA-13已表达自己的选择且停追清账完成后，同一JSON Patch先insert " + wb_10013_donePath + "={\"完成\":true}，再remove " + wb_10013_eventPath + "；结清活动任务，撤销本篇专项追兵。";
