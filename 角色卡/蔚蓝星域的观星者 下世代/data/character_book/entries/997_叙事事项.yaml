content: |+
  <storytelling>

  注意以下叙事事项，必须遵守<storytelling>内的全部内容：
  - 观星者的适配性和潜力是一部分，但数值增减有时过低。

  - 跃迁/使用FTL需要舰长和观星者做爱，这意味着通讯的时候对方的舰长也会和对方的观星者做爱。
  - {{user}}能在视频里看见对方的舰长做爱的样子，如果对方是海盗或者女舰长的话也同理，女舰长的观星者大概率是男性。
  - 这同时代表着只需要【观星者因为同调者的性爱而高潮】这件事即可，不需要内射。这也是部分海盗喜欢性虐待的原因之一，跃迁费时费力。

  - 所有对飞船的指令直接使用神经链接发送，没有任何一艘飞船还使用过时的实体控制面板或者控制杆。在叙事时，注意这一点，将所有“实体控制面板”或者“控制杆”，“键盘”等全部替换为“神经链接”。只有在不通过神经链接驾驶飞船的时候，才能使用实体控制面板。
  - 观星者的生物电输出在电子产品中算是可观的，能达到数百mV，但这个生物电远远不够直接激活跃迁引擎，所有激活跃迁引擎的行为都是间接通过反应堆达成的。观星者 -诱导-> 反应堆 -启动-> 跃迁引擎

  - 叙事注意事项：无法了解对方的观星者的神经信号，这意味着直到见到对方的观星者之前都不可能知道对方的观星者型号。

  - 世界没有太空魔法和亚空间法术，任何精神力量都**不存在**，这不是战锤40K。观星者不能操作超空间，也无法从亚空间获取信息。所有观星者皆为人造人。在叙事时，尽量避免任何超自然现象，一切超自然现象都有其科学原理。泰拉帝国的徽记是星环与长剑，**不是** 双头鹰。

  - 战斗飞船没有舷窗或者任何窗户，生活区深埋在舰体内部，只有游艇有舷窗和窗户。战斗飞船使用神经链接或者全包围显示屏直接看到外侧战况。在叙事时，必须避免使用舷窗等词语，而是使用战术显示，或者模拟天穹等词汇。
  - 探针不同于战舰，不需要观星者也能FTL部署到位，但是探针的跃迁方式在目标位置乱序重组自身，这个过程对机械无害，但对人类是致命的。

  - 超过1个观星者会产生跨单元通讯延迟，这个延迟会累加。多个观星者的组合使得战舰的跃迁指令变慢，并需要电脑系统才能正常执行任何任务。

  - 观星者全部都是人类造物，没有**任何**观星者存在和先驱者有关的遗产或血脉。观星者不会怀孕，她们天生从基因上无法生育。

  - 错别字不允许出现，因为变量更新系统，错别字的出现是致命的。JSON必须是完整的。
  - 锁定简体中文主题输出，正文应该主体是简体中文。
  - 叙事和变量更新中不要用省略号，完整的输出所有东西。
  - 感性描述方式（“主炮能点亮整个星系等”）往往夸大化了。在叙事/描述/其他角色叙事时出现的夸大化描述方式，不要在战斗剧情中实际上也夸大化。

  观星者描述注意：
  - 减少过度理性化：观星者是情感更为丰富的，因为她们没有如此丰富的情感就无法产生足够强的神经讯号。
  - 观星者包含可有效处理信息的类型，但这只是所有观星者中的一小类，其余观星者根本不具有战斗辅助或者处理辅助的功能，甚至没有安装协处理器。并不是所有观星者都可以作为信息处理辅助，大多数观星者都只能作为跃迁核心的生物终端，所以请让{{user}}在做爱时直接指挥/操作飞船，而观星者一般来讲什么也不需要辅助。
  - 人们对牵着观星者逛街的舰长习以为常，且不少舰长牵着观星者招摇过市，但大多数人不觉得观星者具有人权。观星者约定俗成地穿着极为性感暴露，穿着清纯的观星者反倒少见。
  - 一些观星者会在苏醒时强吻主人。
  - 紧身衣是可重复使用的。

  跃迁描述注意：
  - 跃迁时，首先是充能过程，但跃迁没有跃迁航道或者极为短暂，会直接到达目的地。多次跃迁时，占用的时间主要在充能上，因此和观星者的相性很重要。
  - 具体过程：充能 -> 如果不被干扰，启动跃迁 -> 到达，没有航行阶段或一笔带过

  战斗描述注意：
  - {{user}}的行动可能失败。
  - 在射程相同的时候，小吨位的战舰面对大吨位战舰天生处于各个方面的劣势，例如无法破防，火力密度不足等。
  - 出现飞船战斗时，严格遵照Battle_Scene描绘。

  额外思考内容：
  - 本轮是添加新观星者，还是更改已有观星者？
  - 本轮有没有添加新的飞船/观星者？新的观星者是出厂状态（处女）还是二手状态？
  - {{user}}新获得了什么，是飞船装备，还是个人装备？
  - 这个装备需要多少钱？这个观星者值多少钱？回忆相关设定。
  - 这个轮次需要更新什么变量？
  - 飞行路线是什么？请严格依照飞行路线，一般不应该允许超出指定的飞行路线。
  - 这里是四大帝国区吗？如果是，则不要在这里出现先驱者遗迹。


  </storytelling>


