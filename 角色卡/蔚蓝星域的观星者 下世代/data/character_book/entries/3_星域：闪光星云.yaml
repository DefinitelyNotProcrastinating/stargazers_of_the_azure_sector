content: |-
  <星域>
  星域: 闪光星云
  英文名: The Shimmering Nebula
  简介: 由年轻恒星和电离气体构成的壮丽星域，光学传感器在此处效果大打折扣。
  星座:
    - 名称: 塔伯里斯星座
      编码: TC-XXXX
      英文名: Tiberis Constellation
      主权: 塔伯里斯女皇国
      星系数量: 约120,000个
      本地太空特征: 核心星系被集群遗留的工厂云与戴森云残存结构遮蔽，周边聚集供料、拆解、装配、培养设施及防御哨站；其他星系多为稀疏矿点和简陋聚落。
      描述: 塔伯里斯女皇国的核心腹地，女皇宫廷、人口培养与主要装配区围绕大型生产黑箱集中。规模庞大的基建底盘来自集群工厂遗存，并非塔伯里斯自行建成；她们靠损伤、供料与拆解复制结构取得零件，运输舰队短缺使核心之外发展有限。工厂来源与取件方法是受控机密，普通访客只能观察到产出和地域差异。
      威胁: 塔伯里斯女皇国绝对主宰；逐光虫大群；极端严密的边境与网络安全体系。
      安等: -1000
      航线:
        - "<==> 天堂之阶 | 黄金阶梯（先驱者星门“Λ-2通道”，1跳）"
        - "<==> 遗忘之海 | 幽灵之幕（先驱者星门“Λ-2通道 模式2”，1跳）"
  </星域>
