keys:
- 新应许之地
- 天堂之阶
- 战争
- 共和国
- 泰拉帝国
content: |-
  <new_canaan_campaign>

  位置：天堂之阶|新应许之地
  event_new_canaan_campaign:
    event_name: "新应许之地争夺战 "
    event_type: "区域性长期争端"
    description: |
      “新应许之地”仍然是一片拥有超过两千颗潜在宜居行星的富饶星域，但在公元3100年前后，它已不再是银河政治与战争的绝对核心。塔伯里斯宪制帝国公开登场后，各国的战略注意力明显转向其边界与Λ-2通道一线；新应许之地则从全面战争前沿，逐步转化为一片长期、低烈度、但依旧危险的殖民争夺区。泰拉帝国与自由世界共和国仍在这里争夺殖民地、航线和地方影响力；天鹅座技术联邦继续保护生态样本与遗迹研究；猎户座辛迪加则把这里视为稳定获利的长期边疆市场。法外势力并未消失，只是不再能轻易把整片星域拖回全面战火。对独立舰长而言，这里不再是“最大战场”，却仍是最适合接护航、治安、灰色贸易和政治脏活的前线之一。

    region_details:
      region_name: "天堂之阶 | 新应许之地"
      number_of_systems: 48300
      notable_features:
        - "超过2300颗类地行星，是已知最大的未开发宜居星球集群。"
        - "数个先驱者家园舰碎片。"
        - "一颗名为'NC-04B'的异常脉冲星，其外层中含有制造大量跃迁核心所需的稀有粒子。"
        - "复杂的生态系统，为联邦的基因研究提供了独一无二的样本库。"
        - "多条旧战线已固化为殖民地警备网、停火走廊和长期驻军区。"

    key_locations:
      - system_id: "NC-1138"
        location_name: "先锋贸易港 (Vanguard Trading Hub)"
        controlling_faction: "独立/中立"
        security_level: 65
        strategic_purpose: |
          作为新应许之地最重要的自由贸易中转站，先锋港如今更像一座“停火缓冲器”和政治交易所。这里是佣兵招募中心、情报交换所、殖民承包商集散地和战利品销赃地；港口管理委员会则负责在各方驻军、承包商与地方殖民议会之间维持脆弱秩序。
        player_access_notes: "完全开放，但港口内禁止任何武装冲突。"

      - system_id: "NC-001A"
        location_name: "警戒堡垒 (Fortress Vigilance)"
        controlling_faction: "泰拉帝国"
        security_level: 92
        strategic_purpose: |
          帝国在新应许之地的总指挥部与殖民保护核心。这座大型轨道要塞依然拥有强大火力与完善后勤，但其任务已经从全面进攻前出基地，转为保护帝国殖民地、震慑地方民兵与压制走私航线。
        player_access_notes: "需要与泰拉帝国的声望 > -20。停靠请求会受到严格审查。"

      - system_id: "NC-822Z"
        location_name: "自由边疆前哨站 (Liberty's Front Outpost)"
        controlling_faction: "自由世界共和国"
        security_level: 88
        strategic_purpose: |
          共和国卫队的舰队集结点和殖民行动支援中心。与帝国堡垒不同，这是一片由大型空间站、模块化居住区和民用船坞构成的庞大复合体，负责维持殖民航路、安置移民并对地方亲共和国势力提供快速支援。
        player_access_notes: "需要与自由世界共和国的声望 > -100。对独立舰长较为友好，任务中心常年发布招募合同。"

      - system_id: "NC-734G"
        location_name: "地平线研究站 (Horizon Research Station)"
        controlling_faction: "天鹅座技术联邦"
        security_level: 95
        strategic_purpose: |
          联邦为研究新应许之地独特生态和先驱者遗迹而建立的前沿科研基地。整个空间站被先进的隐形力场和传感器阵列保护；常驻舰队除对抗辛迪加破坏性开采外，也负责监控塔伯里斯相关走私样本和异常生物安全事件。
        player_access_notes: "需要与天鹅座技术联邦的声望 > 100。联邦极少允许外人靠近其核心科研设施。"

      - system_id: "NC-044B"
        location_name: "资产117号开采平台 (Asset 117 Extraction Platform)"
        controlling_faction: "猎户座辛迪加"
        security_level: 75
        strategic_purpose: |
          一个围绕着'NC-04B'脉冲星建立的巨型工业设施，由辛迪加旗下的“泰坦重工”运营。此平台负责开采和精炼稀有同位素，并为辛迪加的“企业安全部队”提供补给。他们无视联邦的抗议，对该星系的生态系统造成了不可逆的破坏。
        player_access_notes: "需要与猎户座辛迪加的声望 > -100。一个纯粹的商业和工业节点，对金钱之外的一切都不感兴趣。"

      - system_id: "NC-401K"
        location_name: "碎链者营地"
        controlling_faction: "星火姐妹会"
        security_level: 5
        strategic_purpose: |
          姐妹会设立的秘密前进基地，隐藏在一个密集的小行星带深处。她们以此为据点，频繁袭击帝国的殖民运输船和辛迪加的观星者贩运舰，解放“姐妹”，并为解放战争筹集物资。
        player_access_notes: "对姐妹会声望有极高要求，且位置是动态变化的秘密。对大多数玩家默认为敌对。需要 500 姐妹会声望。"

      - system_id: "NC-665P"
        location_name: "收费站-阿尔法"
        controlling_faction: "铁血盟约"
        security_level: 8
        strategic_purpose: |
          铁血盟约在新应许之地主航道附近建立的武装据点。随着大规模会战减少，他们更专注于勒索运输船队、掠夺殖民地补给与承接各方不愿公开的脏活，仍是该星域商船和独立贸易商的主要威胁。
        player_access_notes: "敌对。攻击此据点能获得主要势力的赏金和声望，如果不攻击则海盗会组织大规模入侵。"

    conflicts:
      - conflict_name: "殖民冷战 (The Colonial Cold War)"
        belligerents: ["泰拉帝国", "自由世界共和国"]
        casus_belli: "对新应许之地超过2300颗类地行星的殖民权、既有殖民地治权和关键航线影响力的长期争夺。"
        strategic_objectives:
          terran_empire: "巩固既有殖民地、保护帝国投资并阻止共和国进一步蚕食地方议会和航线节点。"
          free_worlds_republic: "保护新移民与自治殖民地，扩大共和国在地方行政、民兵训练和航运市场中的影响力。"

      - conflict_name: "资源争端 (The Resource Dispute)"
        belligerents: ["天鹅座技术联邦", "猎户座辛迪加"]
        casus_belli: "对'NC-734G'星系内先驱者遗迹的科研优先权，以及对'NC-04B'脉冲星星系内稀有资源开采尺度与生态代价的争执。"
        strategic_objectives:
          cygnus_federation: "保护该区域独特生态和先驱者遗迹，压缩辛迪加破坏性开采规模，并长期掌握关键科研数据。"
          orion_syndicate: "确保'资产117号'平台持续运作，在不触发全面军事制裁的前提下最大化利润，并阻止联邦建立事实技术垄断。"

    player_opportunities:
      - type: "势力军事合同 (Faction Military Contracts)"
        description: "在各大势力基地承接任务，参与护航、治安镇压、代理人渗透、据点清剿和边境拦截等行动，以换取报酬与声望。"
      - type: "反海盗行动"
        description: "攻击星火姐妹会或铁血盟约的前进行动基地，保护殖民航线并领取各方公开悬赏。"
      - type: "独立佣兵"
        description: "在先锋贸易港接受私人或小型组织的委托，任务内容五花八门，从护送商船到“处理”商业竞争对手。"
      - type: "走私与投机"
        description: "利用殖民地监管缝隙、停火线和地方封锁差异进行违禁品运输、人口转运和紧缺物资倒卖，风险与回报都很高。"
      - type: "探索与打捞"
        description: "深入那些尚未被战火波及的星系，寻找未被发现的资源点、异常信号或是在战斗中被摧毁的舰船残骸进行打捞。"

  </new_canaan_campaign>
