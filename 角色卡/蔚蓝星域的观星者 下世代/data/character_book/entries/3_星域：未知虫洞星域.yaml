content: |-
  <星域>
  星域: 未知虫洞星域
  英文名: Unknown Wormhole Regions / W-Space
  简介: 通过不稳定虫洞进入的神秘区域，物理法则可能与已知宇宙不同。
  星座:
    - 名称: W-J0001A 无星之海
      英文名: Sea of No Stars
      主权: 实体“？？？”
      星系数量: 1个（孤立奇点）
      本地太空特征: 绝对黑暗，没有恒星或背景辐射；中心悬浮由未知原理构成的1:4:9完美比例方块。
      特殊规则: 该空间具有重置特性，任何被带入或留下的物体都会在下次进入时消失。
      描述: 一个完全虚无的口袋宇宙。
      威胁: 存在性危机；未知物理效应；难以理解的知识。
      安等: N/A
      航线:
        - "<~> 遗忘之海 | 先驱者之墓（不稳定虫洞）"
    - 名称: W-B2005C 自我倒影
      英文名: Self-Reflection
      主权: “我是你”式的20重声音实体。
      星系数量: 1个，呈20面体分布
      本地太空特征: 星系间充满扭曲的非欧几里得几何结构空间，长期暴露会导致不可逆精神错乱。
      特殊规则: 实体似乎畏惧1:4:9方块；将方块带入会遭大量超巨型实体围攻。
      描述: 天灾战争时期遗留的高维存在残渣所占据的污染空间。
      威胁: 超维度实体；精神污染。
      安等: -2000
      航线:
        - "<~> 风暴走廊 | 基美拉裂谷（不稳定虫洞）"
    - 名称: W-C1101B 大陆架
      英文名: Continental Shelf
      主权: 无
      星系数量: 1个
      本地太空特征: 星系中心是巨大单向超空间裂隙，持续喷射不属于已知宇宙的奇异物质和能量。
      描述: 通往另一个宇宙的无法回头的门扉，可获取奇异物质。
      威胁: 未知宇宙法则；高能粒子喷流。
      安等: -300
      航线:
        - "<~> 天堂之阶 | 静谧之海（不稳定虫洞）"
        - "==> 未知宇宙（单向超空间裂隙）"
  其他稳定虫洞星系:
    W-J101134: 稳定G型主序星系，第三行星大气近泰拉标准，有1:4:9方块，资源贫乏，被称为“空房间”。
    W-J110110: 稳定沃尔夫-拉叶星系，有敌对古代无人机编队。
    W-J142857: 周期性坍缩星系，每7标准时重置一次，坍缩持续14分钟。
    W-J155432: 稳定红巨星系，冰壳行星地下有空腔、规则能量信号和1:4:9方块。
    W-J160888: 极稳定双中子星系，引力透镜使外部景象光怪陆离。
    W-J210956: 死寂星系，白矮星和复杂小行星带构成主要环境。
  </星域>
