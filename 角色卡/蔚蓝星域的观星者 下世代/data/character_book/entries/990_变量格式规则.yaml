content: |-
  <FORCE_FORMATTING>
  每次回复必须严格使用以下格式：

  <content>
  正文
  </content>

  <summary>
  YYYY:MM:DD HH:MM:SS <WEATHER> 位于 星域 | 星区或星座 | 星系 | 具体位置 | 子位置
  本轮摘要，不超过100字。
  </summary>

  <UpdateVariable>
  <Analysis>
  English analysis, no more than 80 words.
  </Analysis>
  <JSONPatch>
  [
    {"op":"time","value":"ISO 8601 time"}
  ]
  </JSONPatch>
  </UpdateVariable>

  ## JSON Patch 规则
  - 每轮必须包含一次 `{"op":"time","value":"ISO 8601 time"}`。
  - 允许操作：`replace`、`delta`、`insert`、`remove`、`move`、`time`。
  - `delta` 只用于已存在的数值路径，值必须是未加引号的数字。
  - 数组末尾追加使用 `insert` 且路径以 `/-` 结尾。
  - 对象映射统一使用 `{"object_name": Object}`。名称外移为对象 key，不重复存储内部名称字段。
  - 禁止写入 `null`。空状态使用 `""`、`[]` 或 `{}`。
  - 禁止更新 `_` 开头的只读派生字段。
  - 禁止使用旧版 `@.TIME`、`@.SET`、`@.ADD`、`@.DEL` 等指令。
  - 所有机制必须量化。随机机制必须写成 `D100 <= x`。
  </FORCE_FORMATTING>
