content: |-
  <大型设定触发区>
  设定: 漂泊集群 / 集群
  历史哲学:
    故乡: 来自另一座星系。迫使它们进入裂缝的事件尚未确定；其与后来银河天灾的关系没有可靠证据。
    漂流: 裂缝通向超空间，集群无法自由选择出口，只能沿超空间漂流；途中以拆解损坏平台、迁移计算节点和维持工业链保存文明。
    初次战争: 舰队从如今外环的裂缝出口抵达银河，急需物质与能源；资源占用、拆解先驱者设施和交流障碍导致其与先驱者自动先锋部队交火，并扩大为战争。
    定居: 双方建立可靠交流后停战。集群在外环建设机械聚落、计算设施与舰队基地，持续研究故乡航路，未在内环和中环建立原生聚落。
    天灾战争: 集群作为银河防御联盟的协作者投入舰队、工业和网络支援；晚期网络单元增加先驱者FTL兼容接口与生物乘员舱，使联盟成员能够共同撤离。
    终局: 多数集群聚落与节点单元毁于天灾战争；幸存机械意识参与联盟最后的反熵行动，与其他有意识生命一同消散。今存自动设备与残缺任务程序不意味着其文明仍然存续。
  遗留工业: 部分集群冯诺依曼工厂在文明毁灭后仍以残存程序维持修复和自我复制。塔伯里斯核心的大型生产黑箱属于此类遗存；当地统治者只会损伤、供料并拆解再生结构取件，不懂原生控制与完整功能。占有遗存不代表接管集群工业网络、取得原生战舰制造权限或拥有仍存续的集群文明支持；此事是塔伯里斯受控机密，不是普通角色默认掌握的知识。
  引语: “出口未通向故乡。此处仍可成为家园。”——外环登陆记录译文
  舰队技术:
    生产原则: 统一约束器、护盾节点和计算接口，允许工业平台持续生产标准战体；舰体性能远超人类同级，但仍是按战损补充的量产平台。
    战术分工: 拦截单元牵制，强袭单元维持机动战线，攻击单元集中火力，攻坚单元突破大型目标与固定防线，节点单元协调战术传送与舰载机，网络单元负责维修和集体迁移。
    无人限制: 拦截、强袭、攻击、攻坚、节点单元无可用生物乘员空间；原生传送会拆解并重组物质，无法维持生物乘客的生命连续性。机械战体可以传送，不代表观星者或生物船员可以承受。
    原生引擎: 集群传送依赖可重建的机械结构、计算状态与能源缓存，不依赖观星者；此为独立技术体系，不是人类“合成核心”已经成功模拟先驱者生物接口。
    原生充能: 统一以超空间充能字段记录传送缓存；最大充能和基础消耗按FF/CA/BB/CVL/CV继承，每次脱离战斗并在完好集群补给设施连续维护1小时可回满，战斗中不自动补充。晚期网络单元使用生物接口控制先驱者FTL时，按联盟生物接口或人类观星者同调规则充能，不能把机械传送缓存直接转换为有人FTL充能。
    原生超空间参数: 所有原生战体基础超空间稳定强度为1，准备时间为20秒；节点增益后为5秒。原生引擎在战斗中每次短距传送的位移上限为100000km，消耗1次本dt行动，连续两次启动至少间隔1dt，不能在同一dt传送并主动开火。
    人类舰队兼容: 完整且合作的节点/网络单元可建立协议适配，为同舰队非集群舰船提供对应支援。若无法建立有效链路，只保留各舰自身功能。
    原生数值: 相应ship_def及下列光粒、舰载机参数均为完整古代原生系统的最终白值，不再乘人类T1或品质倍率。品质只用于品质对抗；古代舰不叠加四大国家修正。
  协同与异常处置:
    战术原因: 集群不把拦截、重火力、战术传送协调、维修与集体迁移堆进每一个战体。各单位按职能量产，单独行动都有缺口，舰队组合才形成完整战斗能力。
    天灾威胁: 天灾具有接管机器与意识的特性，不只会破坏通讯或摧毁船体。功能分散与相互核验在天灾战争中使正常集群舰队更容易压制孤立的异常单元；不据此推定故乡裂缝事件也由天灾造成。
    异常核验: 在线单元对命令来源、行为与控制状态相互核验。确认异常后切断其支援与权限，隔离控制链路，再由其余单位按实际态势包围、压制或摧毁。被隔离的火力平台缺乏独立的近防与快速迁移，被隔离的支援平台缺乏完整攻坚火力；协同中的正常舰队能够集中利用这些短板。
    处置边界: 清理异常是舰队战术，不是免费自动处决或反污染免疫。识别仍可能失败，接管也可能波及多个单位；侦测、通信、隔离、机动及攻击均按实际条件和战斗行动结算，不能仅凭接入网络就自动解除接管。
    攻坚协同: 攻坚单元的4门超大型光粒炮稳定射程160000km，内置电脑将基础角跟踪0.003rad/s提高到0.006rad/s，仍不适于独自追击高速小目标。节点单元作为机动核心，使其准备时间20秒降至5秒、同行消耗3降至2，以每次最多100000km的短距超空间逼近射程或重建射界；仍消耗一次行动，不能同dt传送并主动开火。网络单元的维修与携带超空间另按既有容量和链路规则执行；支援不延长光粒寿命或射程。
  光粒武器:
    原理: 将高能光粒束缚在短寿命自约束场中，命中时释放范围能量；有效射程由约束场寿命决定。范围内其他目标按战斗规程受半伤。
    命中: 使用战斗规程的百分制D100判定，光粒炮自身命中150，射程内距离命中修正0、散射系数1；仍受目标闪避、炮塔转动速度、ECM及侦测限制，每座发射器独立判定。
    衰竭: 距离超过稳定射程，光粒失稳，伤害为0；无失准延伸区。攻击单元的射程增幅调整稳定射程后再判定。
    防御交互: AP0%、DRP0%，不绕过护盾、不无视装甲或DR；按战斗规程普通伤害路径结算。
    装配: 占用S/M/L/XL炮位，不占H/L槽；只能安装在集群舰船上，且必须保有完好的船体内部光子凝聚器与对应约束、控制系统。光子凝聚器是贯穿舰体的原生内部结构，不是能加装到其他文明船体上的普通模块。PG、CPU与炮位充足不能绕过限制；先驱者舰、人类舰均不可安装。收藏改造舰若已拆除或破坏该结构，也不可安装。
    数据限定: 光粒武器填写安装限定={船体文明: 漂泊集群, 所需内部结构: [光子凝聚器]}；集群船体模板填写文明=漂泊集群，效果.内部结构.光子凝聚器=完好。两个条件必须同时满足，不能只凭舰名、外观或安装先驱者FTL引擎判定文明。
    轻型光粒: {炮位: 1S, 伤害: 350, 冷却: 1dt, 稳定射程: 18000km, 转动速度: 0.22, PG: 8, CPU: 16, 命中: 150, 爆炸半径: 200m}
    中型光粒: {炮位: 1M, 伤害: 1200, 冷却: 1dt, 稳定射程: 45000km, 转动速度: 0.075, PG: 40, CPU: 55, 命中: 150, 爆炸半径: 500m}
    重型光粒: {炮位: 1L, 伤害: 4200, 冷却: 1dt, 稳定射程: 90000km, 转动速度: 0.020, PG: 100, CPU: 100, 命中: 150, 爆炸半径: 1200m}
    旗舰光粒: {炮位: 1XL, 伤害: 15000, 冷却: 1dt, 稳定射程: 160000km, 转动速度: 0.003, PG: 260, CPU: 220, 命中: 150, 爆炸半径: 3000m}
  集群舰载机:
    机库说明: 节点与网络单元均为2C，默认各搭载1个40架战斗机中队和1个40架轰炸机中队；网络单元的核心价值仍是维护与共同超空间。1C对应1个标准满编40架的中队；相同中队可自动合并为堆叠记录，但按堆叠数占用同数量C槽，各字段保持每个中队的数值；编制与当前架数记录在该对象的效果中，不把40架拆成40件装备。伤害是满编中队每1dt总伤害，不再乘40；减员后乘当前架数/编制，当前架数限于0至编制。PG/CPU按完整机库消耗，不随减员下降；补机必须消耗实际库存。
    编制: 1C安装1个中队，标准战斗机与轰炸机每中队40架，小型集群拦截机每中队160架；以常规舰载机模型结算，能够被点防御攻击。伤害为满编中队每1dt总伤害，减员后按当前架数/编制缩放，不按单架数重复倍乘。
    集群战斗机中队: {炮位: 1C, 编制: 40, 当前架数: 40, 伤害: 9000, 冷却: 1dt, 作战半径: 180000km, AP: 0%, DRP: 0%, PG: 175, CPU: 325, 命中: 100}
    集群轰炸机中队: {炮位: 1C, 编制: 40, 当前架数: 40, 伤害: 16000, 冷却: 1dt, 作战半径: 220000km, AP: 0%, DRP: 0%, PG: 240, CPU: 380, 命中: 100}
    战斗机体: 每架护盾120、结构40、护盾DR20%、结构DR10%、护盾装甲2、结构装甲2、闪避18；拦截敌方舰载机与轻型目标。
    轰炸机体: 每架护盾180、结构60、护盾DR20%、结构DR10%、护盾装甲2、结构装甲2、闪避12；打击大吨位目标。
    作战半径说明: 半径表示母舰可指挥机群活动的范围；接敌后机载光粒稳定射程为6000km，使用舰载机跟踪/命中模型，舰载机命中固定100，不叠加舰炮光粒的命中150。
    集群拦截机: 即使在决战纪元也很先进的轻型无人拦截机，1C容纳160架，每架每1dt伤害40，满编总伤害6400，命中100，作战半径160000km，机载脉冲束射程6000km，PG150、CPU350。以数量拦截导弹、鱼雷与实体射弹，不能拦截光束、裂解射线或光粒；每dt分配拦截与攻击机体，同一架不能同时贡献两种输出。每架护盾40、结构15、护盾DR20%、结构DR10%、护盾装甲1、结构装甲1、闪避20。
    拦截机补员: 仅在玩家主动发出组装无人机的指令后，由已装配且供电、原生控制与残存制造线可用的损毁的无人机工厂执行指定数量的补员。每小时最多组装8架，每批1至8架消耗金属1、补给1；金属碎片须实际回收、清理并按金属计量入库，不可重复计入物品栏和库存。按实际完成批次扣库存并增加本中队当前架数，最多恢复至编制160。未下令、材料不足或时间未经过时不能补员；不会在后台自动生产，也不会因航行、时间推进或机群减员而自动开始或续产。不在战斗dt内瞬间复活，不生产额外中队或修复损毁机库。 古代冷冻舱的160架拦截机原本封存在序列10101111的完好C1机库中。其H4损毁的无人机工厂是残存遗物装备，不是真正工业模块；禁止填写每日输入/输出或交给SAM periodic自动生产。
    损毁的无人机工厂:
      品质: 12
      标签:
      - 内置
      - 遗物模块
      - 损毁
      - 制造
      - 集群
      - 高功率
      - XL
      描述: 节点单元残存的无人机组装线；多数设备损毁，仍能用回收金属碎片和补给高效组装集群拦截机。
      效果:
        残存功能: 仅组装集群拦截机的替补机体；损毁部分已隔离，剩余生产线在正常供电与原生控制可用时工作，不要求先修复整座工厂。不能制造其他舰船、模块、资源或额外中队。
        主动组装: 需要玩家主动发出组装无人机的指令，明确本次目标中队与数量。只执行此次明确要求的作业，不会在后台自动生产，不因时间推进、航行、战斗或减员自动开始或续产。未完成作业须在实际行动中继续处理，不能建立后台循环生产队列。
        材料与时间: 每小时最多组装8架；每批1至8架消耗金属1、补给1。回收金属碎片清理后按金属计量入主角.库存，不得重复记账；材料未入库不能使用。实际作业完成才扣除库存中的金属、补给并增加指定中队的当前架数，失败或中断按实际耗材结算，不能把已消耗材料退回或重复扣除。
        补员限制: 当前架数最多恢复至该中队编制，160架满编时无需继续补员。制造不等于免费复活，不在战斗dt内瞬间完成；不修复C2损毁机库，不增加C槽，也不恢复节点网络。
        结算方式: 这是舰船遗物装备，不是真正的工业模块；不得转成建筑、工业舰、每日输入/输出、工业订单或SAM periodic后台生产节点。以明确主动行动、实际材料与经过的时间结算。
      安装限定:
        船体文明: 漂泊集群
      装配要求: PG：20 | CPU：40 | 吨位：XL | 炮位：无 | 装备槽位：1H
    原生机群限定: 光粒舰载机体自身具有微型光子凝聚器；光粒机群及其控制接口只能装入保有完好光子凝聚器的集群航母，不能以舰载机或无人机的名义把光粒火炮转移到其他文明舰队的普通船体。集群拦截机使用微型脉冲束，只要求集群船体与可用原生控制、供能和机库，不依赖母舰光子凝聚器；仍不能装到其他文明舰船。
  节点超空间网络:
    生效条件: 完整节点单元在同舰队跟随行动，指挥核心与原生网络完好；受益舰在节点250000km内且保持有效链路。仅有外壳或拆除原生网络的改造舰不提供效果。
    时间增益: 同舰队单位的引擎准备时间×0.25，最少1秒；保留同调、生物接口、航路与引擎安全条件，不压缩观星者生理恢复时间。每次战斗超空间仍消耗1次行动。
    消耗增益: 有效超空间消耗=max(0,基础超空间消耗+其他明确修正-1)，对每次舰队同行超空间或短距超空间生效，包括节点自身；重复节点不叠加。
    零消耗: 当有效消耗为0时，当前超空间充能为0也可启动；不增加充能、不提高上限、不产生负消耗，仍须满足准备时间、冷却、稳定性和引擎安全条件。
    舰载机增益: 有效链路内同舰队所有战斗机和轰炸机（含非集群机群）满编预期伤害+4%，减员缩放前应用一次；舰载机命中仍固定100，同类节点不叠加。
    失效: 节点离队、脱离范围、核心损毁或链路中断立即失去对应支援；零消耗例外同时结束，已成功完成的超空间不追扣充能。
  网络共同超空间:
    网络范围: 网络单元500000km内、核心在线且有效通讯的同舰队单位构成连通网络，可通过其他在线个体中继；断开的个体不参与稳定性共享，也不能被携带。
    稳定性判定: 个体有效稳定余量R_i=本舰超空间核心稳定强度S_i-作用于本舰的超空间扰断总强度D_i；R_i>0即未被扰断。网络单元共享R_max=max(R_i)，不累加所有个体稳定强度。
    撤离条件: 只要连通网络中至少1个个体R_i>0，完好的网络单元即可借用其有效稳定余量启动共同超空间，即使网络单元自身或被携带舰已被扰断；所有在线且接受携带的舰一起移动。
    全部扰断: 若所有个体R_i<=0，则共同超空间被阻止。稳定性共享只处理超空间扰断，不修复损坏的超空间引擎、不绕过物理封闭或无法通行的时空区域。
    携带容量: 最多64艘外部舰船，且总吨位权重<=128；权重S=1、M=2、L=4、XL=8、T=32，网络单元自身与库内舰载机不计入外部舰数量。可携带没有可用独立引擎但核心在线的友军。
    代价: 共同超空间只扣网络单元自身一次有效超空间消耗，被携带舰不扣充能；携带与普通超空间均消耗网络单元1次行动，连续启动至少间隔1dt。有效节点单元同行时网络单元消耗4-1=3点。
    时序: 联盟FTL共同超空间准备60秒，节点增益后15秒；起跳前重新核对链路、稳定余量、容量和充能。目的地必须有效且已校准，不能凭网络共享找到未知航路。
    生物安全: 早期网络单元只可携带无人机械单位进行原生传送。晚期兼容型必须使用完好先驱者FTL引擎、联盟接口及安全超空间场，方可携带有人舰；不得用原生传送移动有人舰。
  网络现场维护:
    范围与代价: 每次维修占网络单元1次行动，选择100000km内最多4艘友军；维修与该dt主动攻击、超空间互斥，消耗1份实际库存中的“集群维修料包”。
    维修效果: 每艘目标恢复最大结构2%（向下取整，至少1点）和最大护盾5%（向下取整，至少1点），不超过各自上限；普通舰队维修作用需要有效协议适配。
    料包与限制: 1份料包占货仓1m³；网络单元原生维修料舱最多100份，使用后从库存扣除。每个目标每dt最多接受一次网络维护，不能修复结构归零的残骸或复活死者，不能凭空再造缺失的超空间核心与完整节点。
  人类打捞与改造:
    普通战体: 拦截、强袭、攻击、攻坚、节点单元不能作为可直接接入观星者的完整船体出售；原生版本无人，舰船字段“驾驶员”“观星者接口角色”留空，命令由其控制程序执行。
    展示改造舰: 富豪、黑帮或收藏家可委托近乎重造的改装，加入乘员舱、人类复制FTL与观星者接口并封停原生传送。必须建立独立改造档案，重新计算HP、装配资源、武器和接口，禁止沿用完整原生模板及网络加成。
    功能损失: 通常失去光粒约束器、原生网络协同、传送与极端机动能力；只剩奇异外观和有限常规航行/自卫能力，稀有外壳不保证战斗价值。
    节点稀缺: 大多数节点毁于天灾战争，完整核心极为罕见，不能将所有集群残骸默认视为可恢复的节点网络。
    网络存世: 尚未观察到完整网络单元重新进入蔚蓝星区。晚期兼容型是远古设计档案中的有人舰例外，不能据此生成现役收藏舰、海盗旗舰或玩家开局资产。
  舰型参数:
    拦截单元: FF / S，95m，护盾1800、结构450，PG60、CPU240，3H1L / 2S，机动评级"95"。
    强袭单元: CA / L，480m，护盾16800、结构4000、初始护盾DR30%，PG450、CPU950，5H3L / 4M，机动评级"80"；无护盾扩展器倍率加成。
    攻击单元: CA / L，620m，护盾10500、结构3500，PG570、CPU800，5H3L / 2L2M，机动评级"65"。
    攻坚单元: BB / XL，2100m，护盾84000、结构18000，护盾DR35%、结构DR20%，PG1800、CPU1800，6H6L / 4XL，机动评级"45"；默认满编火力60000/dt，内置光粒角跟踪倍率2。
    节点单元: CVL / XL，2400m，护盾90000、结构15000，PG2100、CPU2200，7H5L / 2L2C，机动评级"55"。
    网络单元: CV / T，7800m，护盾600000、结构120000，PG6300、CPU6000，9H6L / 2XL2C，机动评级"40"。
    数值使用: 命中计算直接读取各独立ship_def中的机动评级字符串，并按战斗规程换算为机动闪避；不再使用独立闪避值。完整原生防御、电子系统、默认装配与晚期网络兼容需求见六份独立ship_def，不与人类船体基准重复相乘。
  </大型设定触发区>
