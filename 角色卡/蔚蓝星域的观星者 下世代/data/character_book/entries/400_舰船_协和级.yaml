content: |-
  <ship_def>
  级别: 协和级
  别名: Concord-class
  舰船类型: ESC
  舰种: 干扰巡洋舰 (特种巡洋舰)
  价格: 340M
  制造商: 联邦航空航天局第58设计所
  描述: 舰体呈一个完美对称的椭圆形，表面异常光滑，没有任何外露的天线或武器炮塔。通体覆盖着联邦标志性的哑光白色涂装。当启动其核心系统时，舰体外壳会像花瓣一样向外层层展开，露出内部环形的复杂跃迁干扰矩阵，散发着柔和的蓝色辉光。由于联邦来自其他舰队成员的电子战完全饱和，该巡洋舰只负责跃迁干扰。
  舰船单位模板:
    舰船类型: ESC
    每日补给消耗: 5
    吨位: L
    驾驶员: ''
    是否旗舰: false
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 6
    跃迁消耗: 2
    制造商: 联邦航空航天局第58设计所
    描述: 舰体呈一个完美对称的椭圆形，表面异常光滑，没有任何外露的天线或武器炮塔。通体覆盖着联邦标志性的哑光白色涂装。当启动其核心系统时，舰体外壳会像花瓣一样向外层层展开，露出内部环形的复杂跃迁干扰矩阵，散发着柔和的蓝色辉光。由于联邦来自其他舰队成员的电子战完全饱和，该巡洋舰只负责跃迁干扰。
    炮位配置: 8S
    装备槽位配置: 4H4L
    船体护盾值: 900
    船体结构值: 1080
    护盾值: 900
    结构值: 1080
    装配资源:
      PG: 288
      CPU: 608
    效果:
      船体加成:
      - 特种巡洋舰；依据舰级定位应用：干扰巡洋舰 (特种巡洋舰)。
      装配减免: []
      内置电子系统:
        基础CPU: 内置特种巡洋舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置特种巡洋舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
      特殊系统:
      - 名称: “共鸣”双模态干扰矩阵
        描述: '联邦在跃迁干扰技术上的杰作，允许舰船在两种截然不同的干扰模式间切换。\n**广域模式**: 将能量均匀地辐射到半径**70000公里**的球形空间内，对该区域内的所有敌方舰船施加**1点**强度的持续性跃迁干扰。这是制造大型“陷阱”的理想模式。\n**聚焦模式**: 将所有能量汇聚成一道高强度的干扰长矛，对单一目标施加高达**6点**强度的跃迁干扰。这种模式足以瘫痪一艘航母的跃迁核心，确保其无法逃脱。两种模式的切换需要数秒的充能时间。'
    装备: {}
  </ship_def>
