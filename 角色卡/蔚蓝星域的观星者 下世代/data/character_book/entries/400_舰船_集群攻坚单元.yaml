keys:
- 攻坚单元
- 集群攻坚单元
- 漂泊集群战列舰
content: |-
  <ship_def>
  级别: 攻坚单元
  文明: 漂泊集群
  舰船类型: BB
  机动评级: "45"
  舰种: 战列舰
  舰体全长: 2100米
  船体类型: 例外型
  形态: 四条超大型光粒约束轨沿致密多面体核心平行排列，外围推进框架和护盾节点围绕炮轴分布；舰内被凝聚器、计算线路和供能结构填满。
  定位: 集群战列舰与重型攻坚火力平台；四门超大型光粒炮配合内置跟踪电脑，在航母协调的机动舰队中突破大型目标与固定防线。
  分布: 外环集群原生遗迹。
  超空间说明: 缓存、短距传送、节点减耗和稳定性规则见漂泊集群触发区。模板保存基础消耗，动态支援不得永久改写船体白值。
  参考满编火力每dt: 60000
  火力说明: 60000仅为四门默认光粒炮可同时攻击时的命中与防御结算前合计，每门炮独立判定；不得将此汇总值作为额外武器重复造成伤害。
  舰船单位模板:
    文明: 漂泊集群
    舰船类型: BB
    机动评级: "45"
    每日补给消耗: 45
    吨位: XL
    驾驶员: ''
    是否旗舰: false
    观星者接口角色: ''
    超空间充能: 0
    最大充能: 4
    超空间消耗: 3
    制造商: 漂泊集群标准化工业平台
    描述: 2100米战体以致密多面体核心为轴，四条超大型光粒约束轨平行伸向前方，外层推进框架与护盾节点围绕炮轴排布，远望如四齿穿刺器。中央核心塞满凝聚器、供能和计算线路；转动炮轴缓慢，却能集中四门主炮突破大型目标。
    炮位配置: 4XL
    装备槽位配置: 6H6L
    船体护盾值: 84000
    船体结构值: 18000
    护盾值: 84000
    结构值: 18000
    护盾DR: 35%
    结构DR: 20%
    护盾装甲: 90
    结构装甲: 150
    装配资源:
      PG: 1800
      CPU: 1800
    效果:
      船体加成:
      - 最终白值按本档案读取，不重复乘人类品质或国家倍率。
      - 两条血条：护盾与结构；H/L槽数按现行舰级上限。
      装配减免: []
      内部结构:
        光子凝聚器: 完好
      内置电子系统:
        电子品质: 11
        内置跟踪: 39
        内置ECCM: 13
        侦测值: 26
        侦测距离km: 350000
        叠加规则: 内置跟踪39已包含CPU、侦测器和光粒跟踪电脑的电子火控贡献，不重复加算。角跟踪属于武器运动能力，另按特殊系统的光粒角跟踪倍率结算；外装电子模块另计。
      超空间核心稳定强度: 1
      原生超空间准备时间秒: 20
      特殊系统:
        原生护盾配置: 船体护盾值84000、初始护盾DR35%，已写入防御字段；护盾扩展器只按装备自身数值增加容量，不套用额外船体倍率。
        光粒角跟踪倍率: 2
        内置光粒跟踪电脑: 只将本舰已安装光粒炮的角跟踪乘2，应用一次。默认超大型光粒炮保留基础角跟踪0.003rad/s，有效值0.006rad/s；默认装备中未提前乘倍。不会提高伤害、稳定射程或改变超大型炮的目标大小与运动判定。电脑失效时倍率回到1；外装模块按各自效果另计。
        协同边界: 本舰不自带节点或网络单元的机动支援。单独行动使用20秒原生准备时间、基础超空间消耗3与稳定强度1；获得有效节点支援时准备5秒、消耗2。节点失联或失效即失去其支援，不能把支援值永久写入船体白值。
        异常隔离: 本舰能参与舰队异常核验与清理，但没有独立接管其他单元的主控权限。识别、隔离与攻击按实际链路、观测及行动进行，不具有自动识破或免疫天灾的能力。
    装备:
      超大型光粒:
        品质: 12
        标签:
        - 武器
        - 光粒
        - 集群
        - XL
        描述: 集群原生超大型光粒炮，承担大型目标与固定防线的攻坚；只适配保有完好光子凝聚器的集群船体。
        效果:
          伤害: 15000
          冷却: 1dt
          命中: 150
          转动速度: 0.003
          稳定射程: 160000km
          AP: 0%
          DRP: 0%
          爆炸半径: 3000m
          衰竭: 稳定射程外伤害0；射程内不散射
          结算: 最终原生白值，不再乘品质倍率；角跟踪由本舰内置电脑乘2一次，每门炮独立进行命中与伤害结算。
        安装限定:
          船体文明: 漂泊集群
          所需内部结构:
          - 光子凝聚器
        装配要求: PG：260 | CPU：220 | 吨位：XL | 炮位：1XL | 装备槽位：无
        堆叠: 4
  独立行动短板: 没有小型副炮或舰载机。超大型光粒炮稳定射程160000km，无射程外伤害；即使使用内置跟踪电脑，角跟踪仍低，容易被高速小目标贴近或被更远射程火力消耗。独立原生传送准备较慢、缓存有限，不能靠单舰连续传送弥补全部缺陷。
  舰队协同: 节点单元承担战术机动核心，缩短攻坚单元的超空间准备时间并降低同行消耗，使其通过短距超空间接近目标、重建射界；拦截及强袭单元保护近身与侧翼，攻击单元补充远距打击，航母机群承担拦截。网络单元提供维修与集体迁移。支援生效范围、链路、位移、充能与行动消耗均按集群触发区结算；超空间行动后不能在同dt主动开火，武器射程不因机动支援增长。
  历史位置: 属于外环集群原生舰队的标准量产攻坚平台，天灾战争中随节点和网络单元组成机动作战群。能力分工使它擅长舰队攻坚，却难以独自同时完成追击、近距拦截与撤离；异常个体一旦被隔离支援，正常机群能够利用这些缺口集中清理。
  </ship_def>
