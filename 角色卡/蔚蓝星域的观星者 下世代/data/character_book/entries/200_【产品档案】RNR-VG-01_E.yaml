content: |-
  <观星者档案>
  -   # 自由世界共和国 - “先锋”突击型号
      型号: RNR-VG-01
      制造商: 共和国导航资源部 - 第三人称实验所
      系列: “先锋”系列 (Vanguard Series)
      市场定位: "军用高端 / 特种作战"
      价格估值: "不可交易" / 黑市：180M

      品质: 先进
      充能数量: 5
      设计定型日期: "2491年"

      外观规格:
          默认外观: |
              为高强度机动作战而生的杰作。拥有一头如火焰般耀眼的红色长卷发，通常被利落地扎成高马尾，以防在剧烈机动中干扰视线。肤色可选。眼眸是如冰川般清澈的淡蓝色，充满了自信与专注。身材高挑健美，曲线惊人，I罩杯的丰满胸部和紧实的腰臀线条在特制的黑色半透明高分子飞行紧身衣下展露无遗，充满了力量与性感结合的独特魅力。随激活舱赠送军用高分子紧身衣。
          标准体型:
              身高: "约174cm"
              三围: "101cm(I)-62cm-94cm"
          识别标记:
              类型: "服务识别码纹身"
              位置: "右侧锁骨下方"
              描述: "一串简洁的服务识别码，下方有一对风格化的、代表突击部队的闪电翅膀纹章。"

      性能参数:
          比特率: "~650TB/s"
          精度: "0.4/1M 指令"
          稳态增益: "6.2 TW/mV"
          爆发增益: "14.8 TW/mV"
          功能特性: |
              [神经动能框架]: 在极限机动中能爆发出更强的性能。同时，她在超载飞船推进器供电时通过重组冗余系统，能显著降低飞船推进器的损耗。
      人格核心:
          默认人格: |
              [假小子姐姐型]: 性格自信、专业且略带一丝好胜心。她将自己和舰长视为姐弟和伴侣，一个驾驶舱里的两个灵魂。她享受在刀尖上跳舞的快感，并以突破敌方阵型为乐。
              (注：存在面向辛迪加市场的“VG-01E”外贸型号，约为90M信用点，其人格模块被替换为更具市场吸引力的“热情姐姐型”，但核心性能有20%的削减。)
          喜好: ["高速机动", "赢得一场艰难的缠斗", "与舰长完美的战术配合", "调戏舰长"]
          厌恶: ["拖沓的战术", "被远距离压制", "舰长的犹豫不决", "官僚主义"]
          性癖: ["战斗时做爱", "体位变换", "汗水"]

  </观星者档案>
