content: |-
  <ship_def>
  级别: 朝圣者级
  别名: Pilgrim-class
  舰船类型: CA
  舰种: 重型巡洋舰  CA
  价格: 165M (黑市/打捞修复版价格)
  制造商: 塔伯里斯大回廊 (宪制帝国自动化船坞)
  描述: 舰体明显继承了辛迪加商用与军用混血设计思路，整体呈低阻流线型，但外壳不再追求复杂的仿生鳞片，而是采用易更换的标准化装甲段和外露维护接口。它看起来像一条被压缩、加厚并武装化的高速货运鱼雷艇，审美简洁，维护友好。
  舰船单位模板:
    舰船类型: CA
    每日补给消耗: 5
    吨位: L
    驾驶员: ''
    是否旗舰: false
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 6
    跃迁消耗: 2
    制造商: 塔伯里斯大回廊 (宪制帝国自动化船坞)
    描述: 舰体明显继承了辛迪加商用与军用混血设计思路，整体呈低阻流线型，但外壳不再追求复杂的仿生鳞片，而是采用易更换的标准化装甲段和外露维护接口。它看起来像一条被压缩、加厚并武装化的高速货运鱼雷艇，审美简洁，维护友好。
    炮位配置: 6M6S
    装备槽位配置: 3H5L
    船体护盾值: 480
    船体结构值: 1120
    护盾值: 480
    结构值: 1120
    装配资源:
      PG: 180
      CPU: 380
    效果:
      船体加成:
      - 依据舰级定位应用：重型巡洋舰  CA。
      装配减免: []
      内置电子系统:
        基础CPU: 内置巡洋舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置巡洋舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
      特殊系统:
        名称: 快速换装任务舱
        描述: 舰体腹部保留大尺寸标准化任务舱接口，可在数小时内于“运兵 / 撤离 / 电子战支援 / 武装登临 / 临时货运”之间切换。它没有夸张的单项特化性能，但极其适合塔伯里斯在短时间内大量投放到不同战区。
    装备: {}
