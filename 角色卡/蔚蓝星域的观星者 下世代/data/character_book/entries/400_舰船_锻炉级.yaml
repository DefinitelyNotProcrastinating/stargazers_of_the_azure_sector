keys:
- 锻炉级
content: |-
  <ship_def>
  舰船类型: ICV
  舰种: 工业指挥舰
  舰体类别: 旗舰型
  “每一块从‘锻炉’中运出的精炼合金，都将成为皇帝御座的基石，或是帝国之敌的墓碑。”——帝国矿业行会主席，在“锻炉”级首舰下水仪式上的致辞
  -   级别: 锻炉级 (Forge-class)
  -   类型: 工业枢纽舰 ICV
  -   价格: 4.2B
  -   形态: 舰体设计呈一个巨大而厚重的长方体，如同从太空中直接切割出的一块山脉。舰体表面覆盖着与“禁卫军”级战列舰同等级的泰坦合金装甲板，并点缀着金色的帝国徽记。数个巨大的矿石处理熔炉分布在舰体上层，时刻喷吐着无害化的冷却蒸汽，充满了压倒性的工业力量感。
  -   制造商: 赫克勒斯重工
  -   静态配置文件:
      -   舰体全长: 3200米
      -   标准船员配置: 250人
      -   性能评级:
          -   装甲: 120000
          -   护盾: 80000
          -   机动性: 8
          -   火力输出: 12000 (无人机与点防御)
      -   武器系统:
          -   主要系统: 8x “工蜂”重型采矿无人机机库 (可选挂载)
          -   次要系统: 40x “守护者”重型点防御激光阵列
          -   攻击射程: 50000 km (无人机作战半径)
      -   特殊系统:
          -   名称: 超巨型模块化货仓
          -   描述: “锻炉”级的核心。其内部货仓容积达到了惊人的水平，足以容纳数艘采矿驳船的全部载荷。货仓内部被划分为数千个标准化的磁力约束货柜，能够与帝国所有的运输舰和空间站无缝对接。更重要的是，这些货仓拥有独立的结构支撑和能量护盾，即使在舰体外壳受损的情况下，也能最大程度地保证内部货物的安全。
      -   观星者需求: 需要至少两名观星者进行协作，以稳定其庞大身躯在跃迁时的时空结构。对观星者的性能峰值要求不高。。

  舰船单位模板:
    舰船类型: ICV
    每日补给消耗: 100
    吨位: XL
    驾驶员: ''
    是否旗舰: true
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 4
    跃迁消耗: 3
    炮位配置: 4L
    装备槽位配置: 5H7L
    船体护盾值: 2700
    船体结构值: 6300
    护盾值: 2700
    结构值: 6300
    装配资源:
      PG: 900
      CPU: 1100
    效果:
      船体加成:
      - 工业无人机与舰载机机库容量 +25%
      - 矿石仓与精炼产物仓容量 +30%
      内置电子系统:
        基础CPU: 内置工业指挥舰载CPU。
        基础侦测器: 内置大型矿区调度阵列。
    装备: {}
  </ship_def>
