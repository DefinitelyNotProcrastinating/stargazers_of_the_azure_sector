content: |-
  <星域>
  星域: 天堂之阶
  英文名: Stairway to Heaven
  简介: 通往银河核心的门户，旧殖民前线与新边境博弈并存。
  星座:
    - 名称: 新应许之地
      编码: NC-XXXX
      英文名: The New Canaan
      主权: 共和国/帝国（低烈度争夺区）
      星系数量: 约48,300个（已探明）
      本地太空特征: 大量富氧行星和液态水行星，成熟殖民地、补给船队与地方民兵网络已经成形。
      描述: 曾经的殖民战争核心，如今转为长期低烈度争夺区；大国仍在角力，但更多是通过驻军、承包商与地方代理人维持影响力。
      所属文化: 共和国拓荒者、帝国殖民官、退伍军人、地方民兵与投机商人混杂，战后重建心态与边疆机会主义并存。
      威胁: 共和国与帝国的代理人冲突；殖民地治安恶化；塔伯里斯边境执法舰队与人口走私网络摩擦（中低度）。
      安等: 35-60（中低）
      航线:
        - "<==> 始源之环 | 共和国之心（先驱者管道“Φ-7管道”，约3跳）"
        - "↔ 黄金阶梯（5跳）、静谧之海（6跳）"
    - 名称: 黄金阶梯
      编码: GS-XXXX
      英文名: The Golden Steps
      主权: 猎户座辛迪加（名义）/多方势力角力
      星系数量: 约35,000个
      本地太空特征: Λ-2通道周边布满新建关税站、临时舰队锚地、外交通讯阵列与重武装护航编队。
      描述: 原本由辛迪加推动的经济特区，现已演变为塔伯里斯与四大国家交界的新争夺区；各方都试图控制通道流量、边境法解释权和对塔贸易入口。
      所属文化: 外交掮客、企业承包商、海关武装、佣兵舰长、情报贩子和边境难民交织，合同、停火协议与秘密交易同样常见。
      威胁: 多方代理人冲突；辛迪加企业战争；塔伯里斯边境执法与各国护航舰队的紧张对峙（中度）。
      安等: 30-65（低-中）
      航线:
        - "↔ 新应许之地（5跳）、静谧之海（7跳）"
        - "<==> 闪光星云 | 塔伯里斯星座（先驱者星门“Λ-2通道”，1跳）"
    - 名称: 静谧之海
      编码: TS-XXXX
      英文名: The Tranquil Sea
      主权: 天鹅座技术联邦（探索前沿）
      星系数量: 约29,600个
      本地太空特征: 奇异硅基生态系统和未激活先驱者信标分布其间。
      描述: 联邦深空探索舰队活动区，寻找科学现象与先驱者遗迹。
      所属文化: 联邦探索者文化强，科研舰队重视异常样本、风险评估和先驱遗迹数据。
      威胁: 联邦与辛迪加冲突；未知先驱者造物。
      安等: 30-60（中-低）
      航线:
        - "↔ 新应许之地（6跳）、黄金阶梯（7跳）"
        - "<~> 未知虫洞星域 | W-C1101B 大陆架（不稳定虫洞）"
  </星域>
