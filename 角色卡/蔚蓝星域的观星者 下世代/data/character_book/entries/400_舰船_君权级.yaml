content: |-
  <ship_def>
  级别: 君权级
  别名: ''
  舰船类型: TT
  舰种: 泰坦 (Titan)
  价格: 300B
  制造商: 帝国皇家造船厂 (比邻星)
  描述: 舰体是一柄修长、华丽的星海长剑。舰首尖锐如剑尖，舰身主体则由厚重、光滑的曜石黑装甲板构成，侧面用纯金勾勒出延续数公里的帝国纹章与古典浮雕。舰体中后部的上层结构如同剑柄的护手，数座巨大的太瓦级激光炮塔如宝石般镶嵌其上。整艘船散发着无可匹敌的威严与神圣感，是帝国绝对君权在物理维度的终极体现，也是星环与长剑徽记的构造体。
  舰船单位模板:
    舰船类型: TT
    每日补给消耗: 500
    吨位: T
    驾驶员: ''
    是否旗舰: true
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 6
    跃迁消耗: 6
    制造商: 帝国皇家造船厂 (比邻星)
    描述: 舰体是一柄修长、华丽的星海长剑。舰首尖锐如剑尖，舰身主体则由厚重、光滑的曜石黑装甲板构成，侧面用纯金勾勒出延续数公里的帝国纹章与古典浮雕。舰体中后部的上层结构如同剑柄的护手，数座巨大的太瓦级激光炮塔如宝石般镶嵌其上。整艘船散发着无可匹敌的威严与神圣感，是帝国绝对君权在物理维度的终极体现，也是星环与长剑徽记的构造体。
    炮位配置: 12XL1T
    装备槽位配置: 6H9L
    船体护盾值: 18000
    船体结构值: 42000
    护盾值: 18000
    结构值: 42000
    装配资源:
      PG: 3200
      CPU: 2900
    效果:
      船体加成:
      - 旗舰型舰船；依据舰级定位应用：泰坦 (Titan)。
      - 装配资源与槽位由本舰船独立定义，不应用常规舰级倍率公式。
      装配减免: []
      内置电子系统:
        基础CPU: 内置旗舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置旗舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
        旗舰指挥链: 内置多观星者并联与舰队级指挥链；具体接口需求见舰船条目。
      特殊系统:
      - 名称: “神皇之谕”裁决系统 (三选一装配)
        描述: 泰坦中轴线上搭载的终极武器平台，根据战役需求在船坞中进行模块换装。
    装备: {}
    T槽种类: 帝国
