content: |-
  <星域>
  星域: 始源之环
  英文名: The Origin Ring
  简介: 人类文明的摇篮，四大势力核心疆域，航线最密，冲突最烈。
  星座:
    - 名称: 太阳禁卫区
      英文名: Sol Ward
      主权: 泰拉帝国
      星系数量: 约12,500个
      本地太空特征: 密集轨道防御平台、标准化帝国航道信标，以及太阳中心位置的1:4:9完美比例方块。
      描述: 帝国首都“泰拉”（地球）所在地，泰拉帝国海军“裁决之手”舰队常驻；宏伟、古典、管制严格。
      所属文化: 帝国首都礼制、轨道审查、皇室仪仗和古典宏伟审美构成日常；外来者会持续感到被审视。
      威胁: 塔伯里斯情报渗透与基因样本窃取风险（低）。
      安等: 90-100（极高）
      航线:
        - "↔ 贸易风走廊（跃迁，5跳）"
        - "↔ 共和国之心（跃迁，7跳）"
        - "<==> 天鹅座摇篮（X-783 超大质量惰性虫洞，1跳）"
    - 名称: 共和国之心
      英文名: Heart of the Republic
      主权: 自由世界共和国
      星系数量: 约15,800个
      本地太空特征: 繁忙商业空间站集群、模块化殖民栖息地、无处不在的全息广告。
      描述: 共和国心脏，实用主义、商业繁荣、思想自由，是情报集散地。
      所属文化: 议会政治、媒体直播、商业游说和公民组织高度密集；自由话语和政治交易同时存在。
      威胁: 塔伯里斯情报渗透与基因样本窃取风险（低）。
      安等: 80-95（高）
      航线:
        - "↔ 贸易风走廊（跃迁，5跳）"
        - "↔ 太阳禁卫区（跃迁，7跳）"
    - 名称: 天鹅座摇篮
      英文名: Cygnus Cradle
      主权: 天鹅座技术联邦
      星系数量: 约11,200个
      本地太空特征: 戴森云结构、高度自动化研究前哨、严格管制跃迁信道。
      描述: 联邦科技与工业中心，遍布研究站、工业站与戴森云，监控严格。
      所属文化: 高监控、高自动化、高学历密度；居民习惯用模型、误差和优化参数理解现实。
      威胁: 塔伯里斯情报渗透与基因样本窃取风险（低）。
      安等: 85-98（极高）
      航线:
        - "<==> 太阳禁卫区（X-783 超大质量惰性虫洞，1跳）"
        - "↔ 贸易风走廊（跃迁，6跳）"
        - "<==> 天堂之阶 | 静谧之海（加密先驱者管道“思想者之路”，1跳）"
    - 名称: 贸易风走廊
      英文名: Trade Winds Corridor
      主权: 猎户座辛迪加
      星系数量: 约22,000个
      本地太空特征: 巨型货运船组成的“钢铁长河”、奢华私人空间站、航道阴影中的走私网络。
      描述: 连接三大帝国的黄金航道，宇宙最繁华的商业中心，财富与罪恶交织。
      所属文化: 辛迪加商业文化浓厚，一切都可以谈价；奢侈广告、货运保险和黑市情报并行。
      威胁: 爱巢掠夺者隐秘活动；塔伯里斯大规模军事介入可能性。
      安等: 60-85（中-高）
      航线:
        - "↔ 太阳禁卫区（5跳）、共和国之心（5跳）、天鹅座摇篮（6跳）"
        - "<==> 天穹王冠 | 钴蓝边境（先驱者星门“Ω-1通道”，1跳）"
  </星域>
