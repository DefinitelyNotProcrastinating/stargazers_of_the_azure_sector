keys: []
content: |-
  <NPC舰船生成指南>

  npc_ship_generation:
    适用范围: |
      本规则仅用于新生成的非玩家NPC舰船单位。NPC视为已经完成会战配装，不生成装备、槽位、PG或CPU。
      NPC只保存可直接用于战斗的最终属性。不得反推、展示或虚构其属性来自哪些模块。
      本规则对NPC的血量分配、抗性上限和字段含义优先于玩家舰船装配规则。

    生成顺序:
      - 选择舰船类型、吨位、防御倾向、战术定位、舰长水平与所属者科技水平。
      - 从本条目的T1基准读取同舰级、同防御倾向、同战术定位的数值。
      - 按乘数公式计算最终数值并取整。
      - 将最终最大护盾与最大结构同时写入当前值。禁止保留计算过程或虚构装备栏。

    计算:
      乘数组: "常规作用于总HP、装甲、单炮伤害N、射程与跟踪；抗性、修量、电子分别只作用于同名属性。"
      常规属性: "最终值 = T1基准 × 舰长.常规 × 科技.常规"
      抗性: "最终DR = min(抗性上限, T1基准DR × 舰长.抗性 × 科技.抗性)"
      修量: "最终修量 = T1基准修量 × 舰长.修量 × 科技.修量"
      电子: "最终ECM/ECCM = T1基准 × 舰长.电子 × 科技.电子"
      血量分层: "先计算最终总HP，再按防御倾向分配护盾与结构；盾抗70%/30%，甲抗30%/70%。"
      武器数量: "M不乘任何乘数，只能取舰级基准，或加上具体舰体明确写出的整数炮塔修正。"
      取整:
        HP_伤害_装甲_修量: 四舍五入为整数
        DR_ECM_ECCM_跟踪: 四舍五入为整数
        射程: 四舍五入至最接近的500km
      抗性上限:
        常规NPC: 80%
        官员_剧情首领: 90%

    伤害格式与结算:
      格式: "N×M；炮塔武器中，N为每座炮塔的伤害，M为同型炮塔数量。导弹的M为发射器数量，舰载机的M为中队数量。"
      规则: |
        M座炮塔各自进行命中判定与完整伤害结算；每座炮塔分别扣除当前承伤层的装甲并应用当前承伤层DR。
        不得先计算N×M后只扣一次装甲。某座炮塔击破护盾后，后续炮塔改用结构装甲与结构DR。

    修量规则: |
      修量在每轮所有单位完成行动后结算一次，不在每次受击后结算。
      盾抗默认修复护盾，甲抗默认修复结构；不得超过对应上限。
      结构归零即毁坏，不能被修量复活。舰船结构仍大于0时，护盾修量可以从0重新建立护盾。

    舰长乘数:
      乌合之众: {常规: 0.90, 抗性: 0.90, 修量: 0.80, 电子: 0.80}
      受训: {常规: 1.00, 抗性: 1.00, 修量: 1.00, 电子: 1.00}
      老兵: {常规: 1.05, 抗性: 1.05, 修量: 1.15, 电子: 1.10}
      精英: {常规: 1.10, 抗性: 1.15, 修量: 1.40, 电子: 1.30}
      官员: {常规: 1.20, 抗性: 1.30, 修量: 1.80, 电子: 1.60}

    科技乘数:
      拼装: {常规: 0.85, 抗性: 0.80, 修量: 0.75, 电子: 0.70}
      T1: {常规: 1.00, 抗性: 1.00, 修量: 1.00, 电子: 1.00}
      军用: {常规: 1.10, 抗性: 1.40, 修量: 1.20, 电子: 1.20}
      高级: {常规: 1.25, 抗性: 1.70, 修量: 1.50, 电子: 1.50}
      遗物: {常规: 1.50, 抗性: 2.20, 修量: 2.00, 电子: 2.20}

    T1基准:
      说明: "以下均为完成T1会战配装后的成品白值，不得再次增加模块数值。字段缩写：HP=总HP，修=修量，跟=跟踪，盾甲/构甲=未套防御倾向前的装甲基准，武=武器级，数=标准同型武器数；炮塔武器中即炮塔数量。"
      舰级:
        FF:  {HP: 740,   修: 20,  跟: 1,  ECCM: 0,  ECM: 1,  盾甲: 5,   构甲: 12,  武: S,  数: 3}
        DD:  {HP: 1440,  修: 50,  跟: 4,  ECCM: 1,  ECM: 3,  盾甲: 8,   构甲: 20,  武: S,  数: 5}
        CA:  {HP: 3400,  修: 150, 跟: 7,  ECCM: 2,  ECM: 5,  盾甲: 15,  构甲: 40,  武: M,  数: 4}
        BC:  {HP: 7600,  修: 400, 跟: 9,  ECCM: 3,  ECM: 6,  盾甲: 22,  构甲: 65,  武: M,  数: 6}
        BB:  {HP: 10000, 修: 400, 跟: 9,  ECCM: 3,  ECM: 6,  盾甲: 35,  构甲: 110, 武: L,  数: 6}
        CVL: {HP: 13800, 修: 400, 跟: 9,  ECCM: 3,  ECM: 6,  盾甲: 45,  构甲: 150, 武: C,  数: 5}
        CV:  {HP: 22800, 修: 400, 跟: 18, ECCM: 6,  ECM: 12, 盾甲: 80,  构甲: 260, 武: C,  数: 8}
        DN:  {HP: 26800, 修: 400, 跟: 18, ECCM: 6,  ECM: 12, 盾甲: 95,  构甲: 320, 武: XL, 数: 6}
        TT:  {HP: 70000, 修: 800, 跟: 30, ECCM: 10, ECM: 20, 盾甲: 180, 构甲: 650, 武: XL, 数: 6}

      变体HP覆盖:
        说明: "变体继承对应基础舰级的修量、电子、装甲、武器级与武器数，只将HP替换为下列值；具体舰体有明确单独定义时优先使用单独定义。"
        AF: 1040
        AD: 1640
        SD: 1490
        TD: 1540
        MV: 1440
        HAC: 4000
        ESC: 3600
        RC: 3500
        SC: 3600
        TC: 4000
        BBV: 10400
        ICV: 13800
        JF: 16800
        CVT: 28800
      变体继承: "AF→FF；AD/SD/TD/MV→DD；HAC/ESC/RC/SC/TC→CA；BBV→BB；ICV/JF→CVL；CVT→CV。"

      防御倾向:
        盾抗: {HP分布: [70%, 30%], DR: [30%, 15%], 装甲: [盾甲×2, 构甲×1.25], 修复层: 护盾}
        甲抗: {HP分布: [30%, 70%], DR: [15%, 30%], 装甲: [盾甲, 构甲×1.75], 修复层: 结构}

      武器:
        说明: "格式为[单武器伤害N,射程,极限射程,AP,DRP]；导弹没有极限射程。使用舰级行的武器级与武器数M。"
        S:
          远炮: [100, 9000km, 13500km, 5%, 0%]
          近炮: [120, 4500km, 9000km, 15%, 0%]
          导弹: [70, 22000km, 无, 0%, 0%]
        M:
          远炮: [340, 30000km, 45000km, 8%, 0%]
          近炮: [420, 18000km, 36000km, 25%, 5%]
          导弹: [240, 50000km, 无, 5%, 0%]
        L:
          远炮: [1150, 72000km, 108000km, 10%, 0%]
          近炮: [850, 42000km, 63000km, 0%, 0%]
          导弹: [850, 110000km, 无, 10%, 0%]
        XL:
          远炮: [6200, 200000km, 300000km, 15%, 0%]
          近炮: [4800, 150000km, 225000km, 12%, 0%]
          导弹: [6500, 250000km, 无, 25%, 8%]
        C:
          舰载机: [520, 180000km, 无, 5%, 0%]
          轰炸机: [950, 220000km, 无, 18%, 5%]

      ECM定位: |
        非ECM定位的ECM为0。ECM定位使用同舰级远炮单炮伤害，炮塔数改为ceil(标准武器数÷2)；
        ECM强度取舰级ECM，ECM目标数=max(1,floor(标准武器数÷2))，ECM射程取该舰级远炮射程。
        CVL/CV默认使用舰载机或轰炸机定位；TT的T级武器只能由具体舰体特殊能力定义，不计入常规N×M。

    缺失基准: |
      若目标舰级尚未列入T1基准，不得从裸船、装备模块或其他舰级临时拼装数值。
      应先为该舰级补充T1成品基准，再生成NPC。

    最终字段: |
      必须保存：舰船类型、吨位、防御倾向、战术定位、船体护盾值、船体结构值、护盾值、结构值、
      护盾DR、结构DR、护盾装甲、结构装甲、修复层、修量、单武器伤害、武器数量、伤害表示N×M、射程、跟踪、
      ECM、ECM射程、ECM目标数、ECCM、特殊能力。
      `船体护盾值/船体结构值`对NPC表示配装后的最终上限；`护盾值/结构值`生成时等于对应上限。
      非ECM定位的ECM、ECM射程与ECM目标数均为0；没有极限射程的武器省略该字段。

  </NPC舰船生成指南>
