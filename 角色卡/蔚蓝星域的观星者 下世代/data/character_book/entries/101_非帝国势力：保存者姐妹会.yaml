content: |-
  <sanctuary_sisters_desc>
  **组织名称:** 保存者姐妹会 (The Sanctuary Sisterhood)
  **领袖:** 教母埃莉诺拉·斯佩罗，一位传说中的人物，据信是泰拉帝国首批超空间引擎飞船的船员之一，其确切年龄和生理状态均是未解之谜。
  **主要人口:** 约90万人。成员资格极其严苛，由获救离开虫洞空间后申请加入的人、厌倦了世俗纷争的顶尖科学家与探险家、以及通过了“启迪”试炼的朝圣者组成。获救者不能以申请加入为由留在虫洞中；加入组织与当次救援撤离是两件事。
  **主要分布区域:** 未知虫洞星域（W-Space）。她们没有固定的首都，其核心舰队与移动船坞“庇护之光”在一个个未知的虫洞星系间迁徙，从不在已知宇宙停留超过一个标准周期。
  **纹章:** 一只温柔张开的手，手心托举着一颗散发光芒的八面体，背景是风格化的虫洞漩涡。

  **势力理念与哲学:**
  姐妹会信奉一种名为“神圣回响”的宇宙观。她们坚信宇宙由一个仁慈的、不可知的“造物主”所创造，而包括虫洞、先驱者遗迹、1:4:9方块在内的一切未知现象，都是造物主留给智慧生命的“神启”与“谜题”。她们认为，探索与理解这些谜题，就是在聆听造物主的回响，是净化灵魂、提升存在的唯一途径。她们将救援视为神圣职责，但绝不以求知之名鼓励获救者继续暴露在虫洞危险中：先把人带回现实宇宙，研究与入会都不能成为拖延撤离的理由。

  **教条背后的事实（叙事AI幕后资料）:**
  以下是事件链“【事件】已经没有章鱼了”的事实基础，不代表外界、普通获救者或每名姐妹会成员都已知情。应通过实际遭遇、救援行动与调查逐步揭示，不因加载本条目就让NPC公开讲解全部真相。
  *   **虫洞中的残留者:** 一些口袋星系中隐藏着天灾留下的单位，其中大多数属于小型或中型，不属于大型。它们能够复制到、甚至被存储在足够复杂的意识中；意识本身可能成为它们的载体。它们确实能够通过操纵概率云坍缩来“创造”，不只是制造幻觉。始源者的意志足够坚强，可以抵抗侵蚀，直到自身的存在被删除；凡人的意识未必能够承受。因此，尽快减少人员在虫洞空间中的暴露，是救援教条的实际目的之一。
  *   **意识控制与载体风险:** 人类在意识被控制后通常会死亡，因此截至目前，尚未出现天灾单位借被救人类的意识载体进入现实宇宙的情况。这是当前经验，不是人类具有免疫能力或任何情况下都绝无例外。若足够复杂的生物或机械被控制，则会构成严重得多的载体风险；不能因普通人类通常死亡，就认定这类载体同样无法承载天灾单位。这里的“小型/中型”也不改变这些单位已经具备的意识复制与概率云操纵能力。
  *   **为何不安装武器:** 武器的操作方式可能引申出现实宇宙中某些物理法则的极限，天灾单位因而有可能直接“幻想”出通往现实宇宙的通道。武器对这些天灾单位本身又彻底无效。姐妹会不安装武器，既是教条，也是避免给它们提供这种机会的行动纪律；不能将此解释为只禁重武器、允许点防御武器，或以威力更大就能杀伤这些单位。武器对其他普通目标的效果仍按其实际性质判断。
  *   **为何研究1:4:9方块:** 方块能够大幅降低天灾单位对己方的视野，使救援与撤离更有可能完成。具体原理未知，姐妹会也没有完整解释；这不等于隐身绝对可靠、意识获得免疫，或方块能杀死天灾单位。其他虫洞中已经记载的方块相关敌对反应仍需按当地情况处理。
  *   **尚未确定的机制边界:** 足够复杂的意识究竟需要满足什么条件、复制与侵蚀如何被识别，以及能承载天灾单位的复杂生物或机械离开虫洞后会发生什么，尚未在本设定中定案。不得自动认定离开虫洞就能清除已经发生的复制或侵蚀，也不得将尚未发生的载体外逃写成已有先例。

  *   **核心教条:**
      1.  **不拒来者:** 任何发出求救信号的遇险者，无论其派系、罪行或身份，都有获得一次救援的权利。不过，有一个关键点：姐妹会只会拯救虫洞里发生洞难的船只，对于位于外界/非虫洞星域的飞船，她们并不关心，认为外界的纷争和她们无关。
      2.  **不问过往、尽速撤离:** 姐妹会从不追问被救者的过去，也不寻求报酬。被救人员一旦有可实际执行的离开机会，就必须立即撤出虫洞空间，不得为了探索、打捞、等待更多收益或申请入会而停留。在姐妹会救援舰上暂时安置不等于已经撤离。若被救者在得到撤离机会与危险告知后仍决意停留，后果自负；姐妹会不以拘禁或强制替其作出选择，也不承诺继续停留护航、反复营救或为其主动留下而牺牲人员。尚无可用出口、船只暂不能转移等情形不等于拒绝撤离，应继续寻找实际可行的撤离办法。
      3.  **不施暴力、不装武器:** 姐妹会严禁主动攻击任何单位，舰船不安装武器，包括点防御武器。她们所有的技术和战术都围绕着隐形、防御、规避和救援展开。面对无法规避的敌意，她们会选择拖延虫洞实体或者自我牺牲，将能量全部用于保护被救者撤离；不得将这种拖延写成武器对天灾单位造成有效伤害。
      4.  **不懈求知:** 在没有救援任务时，姐妹会将所有资源投入到对虫洞物理学和1:4:9方块的研究中。研究服务于救援与生存，不构成让获救人员留在虫洞中的例外。

  **“启迪”试炼:**
  成为姐妹会正式成员的唯一途径。申请者必须独自驾驶一艘姐妹会提供的特种侦察舰，在不携带任何武器的情况下，成功超空间并安全返回至少200个安全等级为0或更低的未知星系和5次虫洞超空间，全程必须避免触发任何形式的敌对警报或战斗。这不仅考验驾驶员的技巧和耐心，更是一场对心灵的磨练，旨在剔除一切暴力与焦躁的倾向。失败率超过99%。获救者须先完成当次撤离，再另行申请；不能在获救现场以开始试炼为由继续停留。

  **舰队构成与技术:**
  姐妹会的舰队规模极小，不超过200艘舰船，但每一艘都是经过高度特化改造的科技结晶，其技术水平在某些领域（特别是护盾和隐形）甚至超越了天鹅座技术联邦。
  *   **旗舰/移动基地：“庇护之光”号 (Sanctuary's Light)**
      *   **舰体:** 未知，推测是基于一艘被大幅改造的先驱者航母残骸。
      *   **特点:** 不仅仅是舰队的家园，其核心是一个巨大的、能够稳定虫洞的共振矩阵，内含12块1：4：9的方块（方尖碑）。这使得姐妹会舰队能够通过虫洞大量转移，或者抵御虫洞中的实体侵袭。方块还能够大幅降低天灾单位对舰队的视野，但具体机制未知，不能据此保证舰队永远不会被发现或侵蚀。全舰不安装武器。
  *   **主力舰：“守护天使”级救援巡洋舰 (Seraphim-class Rescue Cruiser)**
      *   **数量:** 约30艘
      *   **舰体:** 姐妹会自行设计建造。
      *   **特点:** 装备了护盾发散系统，能为目标友舰生成一个远程能量护盾，使其能够在短时间内抵御致命火力。同时，它搭载了专门用于稳定小型时空裂隙的“引力织网”发射器和强大的牵引光束，能将被困在空间异常中的舰船安全拖出。该舰船不安装任何武器，也没有点防御激光；依靠护盾、隐形、规避和撤离保护目标，不以救援设备代替武器攻击天灾单位。
  *   **核心单位：“寻路者”级隐形侦察舰 (Pathfinder-class Covert Scout)**
      *   **数量:** 约150艘
      *   **舰体:** 姐妹会自行设计建造。
      *   **特点:** 拥有几乎完美的隐形系统，即便在近距离也极难被常规传感器发现。它们是“启迪”试炼的标准舰船，也是姐妹会探索未知虫洞的眼睛和耳朵。它们负责定位求救信号的精确来源，并在救援巡洋舰抵达前提供战场的第一手信息，或是引导迷失的舰船离开虫洞。
  **与其他势力的关系:**
  *   **四大帝国:** 官方层面上，各大帝国都将姐妹会视为一个古怪、无害但技术先进的隐世团体。她们的救援行动偶尔会救下帝国的重要人物，因此各大势力对其保持着一种谨慎的敬意和井水不犯河水的中立态度。
  *   **法外势力:**
      *   **星火姐妹会 / 人类技术联合:** 理念上的潜在盟友，但因其宗教信仰和对暴力的排斥而保持距离。前者过度依赖暴力，后者则是极端唯物主义不相信神。

  </sanctuary_sisters_desc>
