keys:
- 主宰级
content: |-
  <ship_def>
  级别: 主宰级
  别名: Overmind-class
  舰船类型: CV
  舰种: 超级航母 CV
  价格: 420B (只能依靠蓝图生产或者俘获。)
  制造商: 塔伯里斯大回廊
  描述: 舰体呈扁平宽大的工整楔形，仍带有一点鳐鱼轮廓，但整体更像一座会移动的标准化机库与后勤平台。其内部龙骨结构、弹射轨道和维护甲板明显带有辛迪加大型航母与超级货运平台的血统，几乎把“能快速下线、能快速补机、能快速补人”写在了船体上。
  舰船单位模板:
    舰船类型: CV
    每日补给消耗: 100
    吨位: T
    驾驶员: ''
    是否旗舰: true
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 5
    跃迁消耗: 4
    制造商: 塔伯里斯大回廊
    描述: 舰体呈扁平宽大的工整楔形，仍带有一点鳐鱼轮廓，但整体更像一座会移动的标准化机库与后勤平台。其内部龙骨结构、弹射轨道和维护甲板明显带有辛迪加大型航母与超级货运平台的血统，几乎把“能快速下线、能快速补机、能快速补人”写在了船体上。
    炮位配置: 16C
    装备槽位配置: 6H9L
    船体护盾值: 5400
    船体结构值: 12600
    护盾值: 5400
    结构值: 12600
    装配资源:
      PG: 1100
      CPU: 1400
    效果:
      船体加成:
      - 旗舰型舰船；依据舰级定位应用：超级航母 CV。
      - 装配资源与槽位由本舰船独立定义，不应用常规舰级倍率公式。
      装配减免: []
      内置电子系统:
        基础CPU: 内置旗舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置旗舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
        旗舰指挥链: 内置多观星者并联与舰队级指挥链；具体接口需求见舰船条目。
      特殊系统:
      - 名称: 批量出动管制网络
        描述: 主宰级并不追求最极端的舰载机协同，而是追求最稳定的“大批量起降、补给、回收和再次出动”效率。它能在短时间内持续放飞与回收大量标准化舰载机、拦截机和无人支援艇，是塔伯里斯把中端技术变成数量优势的标志性平台。
    装备: {}
  </ship_def>
