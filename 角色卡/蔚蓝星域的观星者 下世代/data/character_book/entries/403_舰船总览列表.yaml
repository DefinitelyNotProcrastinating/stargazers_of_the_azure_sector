  | | 噪鹃级 | 干扰巡洋舰 | 900 / 1080 | 4H4L / 6S | 辛迪加式模块化设计，外部挂载大量用途各异的电子战天线和信号放大器模块。 |
  | | 寡妇级 | 干扰巡洋舰 | 1260 / 900 | 5H3L / 4S | 设计极为不对称且充满侵略性，一侧被巨型牵引光束发生器占据，如同蛛腿。 |
  | | 布道者级 | 干扰巡洋舰 | 1540 / 1100 | 5H3L / 4S | 修长的尖锐十字形，曜石黑涂装配金色纹路，充满帝国式的威严与神圣感。 |
  | **RC** | 卫士级 | 后勤巡洋舰 | 660 / 1540 | 3H5L / 4S | 帝国庄重设计语言，厚重十字形结构，四向伸出装甲臂，配备传感器阵列。 |
  | | 新生级 | 后勤巡洋舰 | 1540 / 1100 | 5H3L / 2S | 优雅对称的飞翼构型，通体哑光白色，上部是无人机机库，下部是护盾传输装置。 |
  | | 爆发级 | 后勤巡洋舰 | 1540 / 1100 | 5H3L / 6S | 方正粗犷的共和国实用风格，两侧有巨大的可展开半球形护盾投射器。 |
  | | 狮鹫级 | 后勤巡洋舰 | 1540 / 1100 | 5H3L / 4S | 高度模块化设计，由核心段和外部多个功能舱室组成，可通过标准星港设施快速更换。 |
