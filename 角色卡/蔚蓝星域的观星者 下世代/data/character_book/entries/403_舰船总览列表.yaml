  | | 锻炉级 | 工业指挥舰 | 2700 / 6300 | 5H7L / 4L | 内部货仓容积惊人，划分为数千个标准化磁力约束货柜，可与所有帝国运输舰对接。 |
  | **JF** | 巨鲸级 | 超级货舰 | 3600 / 8400 | 5H7L / 无炮位 | 配备独立于主能源的超高功率通讯系统，可利用舰体结构作为天线在全频段广播。 |
