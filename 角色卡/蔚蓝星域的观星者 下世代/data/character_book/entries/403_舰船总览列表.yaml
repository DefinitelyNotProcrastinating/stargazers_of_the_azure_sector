  | | 月鱼级 | 重型甲抗拦截巡洋舰 | 480 / 1120 | 3H5L / 5M4S | 基于“龙马”级改装，焊死模块化接口并加装厚重装甲，背部有巨大电子战天线。 |
  | | 朝圣者级 | 重型巡洋舰 | 480 / 1120 | 3H5L / 6M6S | 继承辛迪加混血设计思路，低阻流线型，采用易更换的标准化装甲段。 |
  | | 决心级 | 重型巡洋舰 | 540 / 1260 | 3H5L / 1L4M6S | 厚重敦实，所有关键部位都有双层装甲保护，如同一块飞行的钢板。 |
  | | 海森堡级 | 指挥巡洋舰 | 1260 / 900 | 5H3L / 4M4S | 复杂的球形与环形结构组合，如同漂浮的原子模型，核心被传感器阵列包裹，最大无人机指挥距离200000km。 |
  | | 龙马级 | 巡洋舰 | 1260 / 900 | 5H3L / 4M2S | 流线型银白色梭形舰体，极其光滑，为减少废热排放而设计。 |
  | **HAC** | 圣骑士级 | 重型突击巡洋舰 | 1200 / 1440 | 4H4L / 4M8S | 庄重威严的弓背型舰体，覆盖额外装甲层如同骑士板甲。 |
  | | 宪法级 | 重型突击巡洋舰 | 1680 / 1200 | 5H3L / 6M4S | 经典碟形设计，哑光白色装甲，武器炮塔和传感器均匀分布在圆盘边缘。 |
  | | 战鹰级 | 重型突击巡洋舰 | 1680 / 1200 | 5H3L / 6M4S | 线条极具侵略性的流线型矛头状，巨大引擎喷口占据舰体后部大部分空间。 |
  | | 独角兽级 | 重型突击巡洋舰 | 1680 / 1200 | 5H3L / 10M18S | 流畅优雅的修长纺锤形，舰首上翘如神话生物犄角，武器系统巧妙内藏，只能使用导弹，PG180。 |
