keys:
- 舰船总览列表
- 舰船总览
- 舰船列表
content: |-
  <舰船总览列表>
  用途: 快速检索各舰船基础防御、槽位配置与战术定位。完整加成、装配资源、特殊系统与观星者门槛仍以对应舰船条目为准。
  说明: 基础防御统一使用护盾 + 结构；槽位配置string格式为“装备槽位 / 炮位配置”。C 槽为舰载机中队槽，T 槽为同族超级武器槽。

  FF:
    - 名称: 枪骑兵级
      舰种: 护卫舰
      基础护盾: 250
      基础结构: 300
      槽位配置string: "2H2L / 3S"
      简述: 舰体修长呈矛尖状，表面覆盖着黑色的吸波涂层和金色的帝国纹章。引擎喷口位于舰尾两侧，如同骑士的长靴。
    - 名称: 刺鳍鱼级
      舰种: 拦截护卫舰
      基础护盾: 250
      基础结构: 300
      槽位配置string: "2H2L / 3S"
      简述: 基于辛迪加“猛禽”级护卫舰的船体进行改装。为了容纳更大的电子战设备，原本流线型的舰体被加装了粗犷的散热格栅和外露的信号放大器。
    - 名称: 守望者级
      舰种: 护卫舰
      基础护盾: 400
      基础结构: 100
      槽位配置string: "3H1L / 3S"
      简述: 方正、粗犷，没有任何多余的线条。像是一块装了引擎的砖头，外露的管线和装甲板显示出极易维修的特性。
    - 名称: 感应级
      舰种: 电子战护卫舰
      基础护盾: 150
      基础结构: 100
      槽位配置string: "1H3L / 3S"
      简述: 碟形舰体，表面覆盖着复杂的相控阵天线纹路。没有任何明显的外露武器，甚至看不到引擎喷口。
    - 名称: 猛禽级
      舰种: 护卫舰
      基础护盾: 350
      基础结构: 300
      槽位配置string: "3H1L / 3S"
      简述: 模块化设计的极致。舰体骨架外露，挂载着各种可更换的任务包，外挂大型护盾发生器。无论如何都是性价比之选。

  AF:
    - 名称: 保镖级
      舰种: 突击护卫舰
      基础护盾: 1000
      基础结构: 600
      槽位配置string: "3H1L / 3S1C"
      简述: 保镖级的标准舰级档案。
    - 名称: 短剑级
      舰种: 突击护卫舰
      基础护盾: 400
      基础结构: 950
      槽位配置string: "3H1L / 4S"
      简述: 短剑级的标准舰级档案。
    - 名称: 脉冲级
      舰种: 突击护卫舰
      基础护盾: 750
      基础结构: 350
      槽位配置string: "1H3L / 3S"
      简述: 脉冲级的标准舰级档案。
    - 名称: 雨燕级
      舰种: 突击护卫舰
      基础护盾: 1100
      基础结构: 250
      槽位配置string: "1H3L / 3S"
      简述: 雨燕级的标准舰级档案。

  DD:
    - 名称: 百夫长级
      舰种: 驱逐舰
      基础护盾: 400
      基础结构: 480
      槽位配置string: "3H3L / 5S"
      简述: 相比枪骑兵级更为厚重，舰首加装了额外的复合装甲板，呈现出坚实的盾牌状轮廓。舰背隆起，容纳了更大的反应堆。
    - 名称: 相对论级
      舰种: 高级驱逐舰
      基础护盾: 400
      基础结构: 500
      槽位配置string: "4H2L / 3S1M"
      简述: 像一把手术刀，细长而锋利。为了容纳那门与其体型不符的主炮，舰体结构经过了特殊的强化。
    - 名称: 解放者级
      舰种: 防空驱逐舰
      基础护盾: 900
      基础结构: 300
      槽位配置string: "2H4L / 6S"
      简述: 小而方的舰体上布满了密密麻麻的小型炮塔，几乎没有死角。雷达天线阵列高高耸立。

  AD:
    - 名称: 保护者级
      舰种: 屏卫驱逐舰
      基础护盾: 3200
      基础结构: 1400
      槽位配置string: "7H6L / 6S"
      简述: 船体设计坚固而厚重，呈对称状的楔形，舰首位置为锤头形，用于安装核心的护盾投射矩阵。舰身两侧是模块化的点防御导弹巢。整体涂装为共和国卫队的标准军灰色。
    - 名称: 封锁者级
      舰种: 屏卫驱逐舰
      基础护盾: 2800
      基础结构: 1200
      槽位配置string: "6H6L / 6S"
      简述: 灰色的船体呈扁平的六边形，如同盾牌。舰体表面布满了密集的点防御炮塔和外露的散热管道，充满了工业化的实用美学。
    - 名称: 盾卫级
      舰种: 屏卫驱逐舰
      基础护盾: 2200
      基础结构: 1600
      槽位配置string: "7H5L / 6S"
      简述: 继承了帝国舰船一贯的威严风格，船体修长而优雅，呈矛头状。舰身两侧安装了多组水晶状的聚焦透镜阵列，在激活时会发出深红色的光芒。

  SD:
    - 名称: 乱序级
      舰种: 隐形轰炸舰
      基础护盾: 2200
      基础结构: 1000
      槽位配置string: "6H6L / 5M"
      简述: 白色的流线梭形，正面有一个空洞，用于不破坏形体的同时发射导弹。
    - 名称: 猎狼级
      舰种: 隐形轰炸舰
      基础护盾: 1500
      基础结构: 900
      槽位配置string: "6H5L / 3M"
      简述: 金属灰色的楔形，使用多边形以最大限度地减少反射面。
    - 名称: 福尔克级
      舰种: 隐形轰炸舰
      基础护盾: 2000
      基础结构: 1500
      槽位配置string: "6H5L / 2C"
      简述: 蓝色的楔形紧凑战舰，舰体头部两侧有用于挂载多用途发射器的发射管。
    - 名称: 阴影级
      舰种: 隐形轰炸舰
      基础护盾: 1800
      基础结构: 1200
      槽位配置string: "6H5L / 4M"
      简述: 黄铜色和金色的圆润光滑战舰，头部有帝国的徽记，使用隐形场。

  TD:
    - 名称: 探路者级
      舰种: 战术驱逐舰
      基础护盾: 2800
      基础结构: 1800
      槽位配置string: "7H6L / 3M2S"
      简述: 舰体呈扁平的对称飞翼构型，通体为联邦标准的哑光白色涂装。舰身上分布着大量传感器阵列和可展开的探测器舱门，充满了科考船的特征，但隐藏在舰体腹部的武器模块暴露...
    - 名称: 未知 / 唯一
      舰种: 唯一科研舰
      基础护盾: 1200
      基础结构: 1440
      槽位配置string: "无装备槽 / 无炮位"
      简述: 该舰船的核心技术。它并非通过扭曲时空来进行跃迁，而是通过一个复杂的量子场发生器，将整个舰船的宏观存在转变为一种概率波函数。驾驶员通过神经接口指定一个目标矢...
    - 名称: 议会级
      舰种: 战术驱逐舰
      基础护盾: 2800
      基础结构: 2200
      槽位配置string: "7H6L / 4M2S"
      简述: 舰体设计敦实可靠，呈长条方形并有上下两层引导天线，外层覆盖着厚重的六角形模块化装甲板。橄榄绿的涂装上印有共和国的星徽。十二个导弹发射单元如獠牙般分布在舰体...
    - 名称: 阐释者级
      舰种: 战术驱逐舰
      基础护盾: 2400
      基础结构: 2000
      槽位配置string: "8H6L / 4M2S"
      简述: 舰体呈优雅的哑光灰色纺锤形，表面几乎没有任何外露的管道或附加结构。武器系统被巧妙地隐藏在装甲之下，只有在开火时才会展开，完美体现了帝国“力量应内敛而非炫耀...
    - 名称: 阿波罗级
      舰种: 战术驱逐舰
      基础护盾: 2700
      基础结构: 1900
      槽位配置string: "8H5L / 3M"
      简述: 舰体线条充满了肌肉感，呈激进的扁平三角形。涂装通常是其所属公司的品牌色。九门中子炮管密集地布置在两侧，散发着危险的光芒。

  MV:
    - 名称: 富足级
      舰种: 采矿驳船
      基础护盾: 240
      基础结构: 560
      槽位配置string: "2H4L / 3M"
      简述: “富足”级的货仓被设计为可直接与帝国主力运输舰进行模块化对接。这使得矿石的转运过程无需经过空间站中转，极大地提升了整个后勤链条的效率和安全性。在战时，这种...
    - 名称: 拓荒级
      舰种: 采矿驳船
      基础护盾: 240
      基础结构: 560
      槽位配置string: "2H4L / 2M"
      简述: “拓荒”级能够将其采矿臂深深地锚定在大型小行星上，形成一个极其稳定的作业平台。在锚定状态下，船体可以展开额外的太阳能帆板，大幅降低对反应堆的能源消耗，使其...
    - 名称: 掘金级
      舰种: 采矿驳船
      基础护盾: 240
      基础结构: 560
      槽位配置string: "2H4L / 2M"
      简述: “掘金”级可以选择安装一套先进的小行星成分扫描阵列。该系统能够快速分析目标小行星的矿物构成和纯度，并实时与星区市场价格进行比对，为操作员计算出开采该小行星...

  CA:
    - 名称: 长剑级
      舰种: 巡洋舰 CA
      基础护盾: 480
      基础结构: 1120
      槽位配置string: "3H5L / 6M8S"
      简述: 经典的帝国十字形舰体设计，左右两侧的武器挂舱如同剑格。黑色的装甲上镶嵌着巨大的散热格栅，在战斗中会发出暗红色的光芒。
    - 名称: 月鱼级
      舰种: 重型巡洋舰 CA
      基础护盾: 1120
      基础结构: 800
      槽位配置string: "5H3L / 5M4S"
      简述: 基于辛迪加“龙马”级重型巡洋舰改装。原版优雅的模块化接口被焊死，加装了厚重的附加装甲板。舰体背部耸立着巨大的电子战天线阵列。
    - 名称: 朝圣者级
      舰种: 重型巡洋舰  CA
      基础护盾: 480
      基础结构: 1120
      槽位配置string: "3H5L / 6M6S"
      简述: 舰体明显继承了辛迪加商用与军用混血设计思路，整体呈低阻流线型，但外壳不再追求复杂的仿生鳞片，而是采用易更换的标准化装甲段和外露维护接口。它看起来像一条被压...
    - 名称: 决心级
      舰种: 重型巡洋舰 CA
      基础护盾: 540
      基础结构: 1260
      槽位配置string: "3H5L / 1L4M6S"
      简述: 厚重、敦实。所有的关键部位都有双层装甲保护，如同一块飞行的钢板。
    - 名称: 海森堡级
      舰种: 指挥巡洋舰 CA
      基础护盾: 1260
      基础结构: 900
      槽位配置string: "5H3L / 4M4C"
      简述: 复杂的球形与环形结构组合，像是一个漂浮的原子模型。核心舱室被层层传感器阵列包裹。
    - 名称: 龙马级
      舰种: 巡洋舰 CA
      基础护盾: 1260
      基础结构: 900
      槽位配置string: "5H3L / 4M2S"
      简述: 流线型的银白色梭形舰体，极其光滑，为了减少废热排放信号而设计。看起来像是一艘武装化的豪华游艇。

  HAC:
    - 名称: 圣骑士级
      舰种: 重型突击巡洋舰 (高级巡洋舰) CA
      基础护盾: 1200
      基础结构: 1440
      槽位配置string: "4H4L / 4M8S"
      简述: 舰体设计充满了帝国的庄重与威严，呈厚重的弓背型，舰首和舰体中轴线覆盖着额外的装甲层，如同古代骑士的全身板甲。主炮塔被整合在舰体背部，数个巨大的散热装置在非...
    - 名称: 宪法级
      舰种: 重型突击巡洋舰 (高级巡洋舰) CA
      基础护盾: 1680
      基础结构: 1200
      槽位配置string: "5H3L / 8M12C"
      简述: 舰体呈经典的碟形，中心隆起部分是舰桥和反应堆所在，圆盘边缘均匀分布着武器炮塔和传感器阵列。通体覆盖着联邦标志性的哑光白色装甲，表面光滑，没有任何多余的装饰...
    - 名称: 战鹰级
      舰种: 重型突击巡洋舰 (高级巡洋舰) CA
      基础护盾: 1680
      基础结构: 1200
      槽位配置string: "5H3L / 6M4S"
      简述: 舰体线条极具侵略性，呈流线型的矛头状。巨大的引擎喷口占据了舰体后部的大部分空间，两侧的武器模块被整合在舰体侧面的机翼结构和舰体头部上。整艘船看起来就像一头...
    - 名称: 独角兽级
      舰种: 重型突击巡洋舰 (高级巡洋舰) CA
      基础护盾: 1680
      基础结构: 1200
      槽位配置string: "5H3L / 10M6C12S"
      简述: 与辛迪加其他舰船棱角分明、充满工业感的设计截然不同，“独角兽”级的舰体线条流畅而优雅，呈修长的纺锤形，舰首微微上翘，如同神话生物的犄角。武器系统被巧妙地内...

  ESC:
    - 名称: 协和级
      舰种: 干扰巡洋舰 (特种巡洋舰)
      基础护盾: 900
      基础结构: 1080
      槽位配置string: "4H4L / 8S"
      简述: 舰体呈一个完美对称的椭圆形，表面异常光滑，没有任何外露的天线或武器炮塔。通体覆盖着联邦标志性的哑光白色涂装。当启动其核心系统时，舰体外壳会像花瓣一样向外层...
    - 名称: 噪鹃级
      舰种: 干扰巡洋舰 (特种巡洋舰) CL
      基础护盾: 900
      基础结构: 1080
      槽位配置string: "4H4L / 6S"
      简述: 舰体设计充满了辛迪加式的模块化和商业化风格。核心是一个标准的巡洋舰舰体，但外部挂载了大量用途各异的电子战天线和信号放大器模块。整艘船看起来就像一个移动的通...
    - 名称: 寡妇级
      舰种: 干扰巡洋舰 (特种巡洋舰)
      基础护盾: 1260
      基础结构: 900
      槽位配置string: "5H3L / 4S"
      简述: 舰体设计得极为不对称且充满了侵略性。船体一侧是巨大的引擎模块和居住区，另一侧则完全被一个狰狞的、如同蛛腿般上下展开的巨型牵引光束发生器占据。整艘船看起来就...
    - 名称: 布道者级
      舰种: 干扰巡洋舰 (特种巡洋舰)
      基础护盾: 1540
      基础结构: 1100
      槽位配置string: "5H3L / 4S"
      简述: 舰体修长，呈尖锐的十字形，中央舰体向后延伸，两侧是巨大的传感器与目标标记阵列吊舱。整体设计充满了帝国式的威严与神圣感，曜石黑的涂装上用金色勾勒出复杂的纹路...

  RC:
    - 名称: 卫士级
      舰种: 后勤巡洋舰 (高级巡洋舰)
      基础护盾: 1540
      基础结构: 1100
      槽位配置string: "5H3L / 4S"
      简述: 舰体继承了帝国海军庄重威严的设计语言，呈厚重的十字形结构。中央舰体宽大，容纳了战巡级别的反应堆和庞大的无人机蜂巢，四向伸出的装甲臂则分别装备了传感器阵列和...
    - 名称: 新生级
      舰种: 后勤巡洋舰 (高级巡洋舰)
      基础护盾: 1540
      基础结构: 1100
      槽位配置string: "5H3L / 2S"
      简述: 舰体设计优雅而对称，呈流畅的飞翼构型，通体覆盖着联邦标志性的哑光白色纳米涂层。舰体上部是扁平的无人机机库，下部则集成了一组紧凑的护盾传输装置阵列，两者完美...
    - 名称: 爆发级
      舰种: 后勤巡洋舰 (高级巡洋舰)
      基础护盾: 1540
      基础结构: 1100
      槽位配置string: "5H3L / 6S"
      简述: 船体方正而粗犷，充满了共和国舰船的实用主义风格。舰体两侧各有一个巨大的、可展开的半球形护盾投射器，在非工作状态下收纳于厚重的装甲板之内。舰身上布满了外露的...
    - 名称: 狮鹫级
      舰种: 后勤巡洋舰 (高级巡洋舰)
      基础护盾: 1540
      基础结构: 1100
      槽位配置string: "5H3L / 4S"
      简述: 舰体设计高度模块化，由一个核心的居住/引擎段和外部挂载的多个功能舱室组成。这些舱室包括无人机库、备件仓库和大型数据处理中心，可以通过标准的星港设施进行快速...

  SC:
