  | | 阿特拉斯级 | 超级货舰 | 3600 / 8400 | 5H7L / 无炮位 | 加装引擎和舰桥的巨型长方体金属砖块，舰长5200米，覆盖重型工业装甲。 |
  | **CV** | 主宰级 | 超级航母 | 5400 / 12600 | 6H9L / 5C | 扁平宽大的工整楔形，像一座移动的标准化机库与后勤平台。 |
  | | 克劳德级 | 联网感应舰 | 12600 / 9000 | 9H6L / 3C | 直径近五公里的巨大白色圆盘，启动系统时表面浮现由能量节点组成的复杂几何图案。 |
