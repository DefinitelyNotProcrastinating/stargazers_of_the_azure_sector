  | | 雅典娜级 | 超级航母 | 5400 / 12600 | 6H9L / 5C | 巨大厚重的六边形棱柱，覆盖层层泰坦合金装甲板，贯穿有直径超百米的机库通道。 |
  | | 克拉肯级 | 工业旗舰 / 超级航母 | 4340 / 3100 | 8H7L / 3C | 极其庞大臃肿，如同移动的方形空间站，布满起重臂、停泊口和生产管线。 |
  | | 拉普拉斯级 | 战略武器运载舰 | 4340 / 3100 | 9H6L / 3C1T | 环形居住舱环绕着中间加速轨道和反应堆，开火时引力波动在轨道中形成。 |
