  <舰船总览列表>
  ### 舰船总览表

  | 代号 | 名称 | 舰种 | 基础防御 (护盾/结构) | 槽位配置 (装备/炮位) | 简述 |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **FF** | 枪骑兵级 | 护卫舰 | 250 / 300 | 2H2L / 3S | 舰体修长呈矛尖状，表面覆盖着黑色的吸波涂层和金色的帝国纹章。 |
  | | 刺鳍鱼级 | 拦截护卫舰 | 250 / 300 | 2H2L / 3S | 基于“猛禽”级船体改装，加装了粗犷的散热格栅和外露的信号放大器。 |
  | | 守望者级 | 护卫舰 | 400 / 100 | 3H1L / 3S | 方正、粗犷，像装了引擎的砖头，外露的管线和装甲板显示易维修特性。 |
  | | 感应级 | 电子战护卫舰 | 150 / 100 | 3H1L / 3S | 碟形舰体，表面覆盖复杂的相控阵天线纹路，无外露武器和引擎喷口。 |
  | | 猛禽级 | 护卫舰 | 350 / 300 | 3H1L / 3S | 模块化设计的极致，舰体骨架外露，挂载各种可更换任务包，性价比之选。 |
  | **AF** | 保镖级 | 突击护卫舰 | 1000 / 600 | 3H1L / 4S | 标准舰级档案。 |
  | | 短剑级 | 突击护卫舰 | 400 / 950 | 1H3L / 4S | 标准舰级档案。 |
  | | 脉冲级 | 突击护卫舰 | 750 / 350 | 3H1L / 3S | 标准舰级档案。 |
  | | 雨燕级 | 突击护卫舰 | 1100 / 250 | 3H1L / 3S | 标准舰级档案。 |
  | **DD** | 百夫长级 | 驱逐舰 | 400 / 480 | 3H3L / 5S | 比枪骑兵级更厚重，舰首加装额外复合装甲，呈盾牌状轮廓。 |
  | | 相对论级 | 高级驱逐舰 | 400 / 500 | 4H2L / 3S1M | 细长锋利如手术刀，为容纳主炮而特别强化了舰体结构。 |
  | | 解放者级 | 防空驱逐舰 | 900 / 300 | 4H2L / 6S | 小而方的舰体上布满小型炮塔，几乎没有死角。 |
  | **AD** | 保护者级 | 屏卫驱逐舰 | 3200 / 1400 | 4H2L / 6S | 坚固厚重的对称楔形，锤头形舰首，涂装为共和国卫队标准军灰色。 |
  | | 封锁者级 | 屏卫驱逐舰 | 2800 / 1200 | 4H2L / 6S | 灰色扁平六边形舰体，表面布满点防御炮塔和散热管道，工业化实用美学。 |
