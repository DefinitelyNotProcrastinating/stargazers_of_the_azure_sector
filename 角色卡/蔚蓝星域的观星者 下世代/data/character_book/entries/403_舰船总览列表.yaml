  | **SD** | 乱序级 | 隐形轰炸舰 | 2200 / 1000 | 0H0L / 2L（仅大型导弹/鱼雷） | 白色流线梭形，正面有空洞用于不破坏形体的情况下发射导弹。 |
  | | 猎狼级 | 隐形轰炸舰 | 1500 / 900 | 0H0L / 2L（仅大型导弹/鱼雷） | 金属灰色楔形，使用多边形设计以最大限度减少反射面。 |
  | | 福尔克级 | 隐形轰炸舰 | 2000 / 1500 | 0H0L / 2L（仅大型导弹/鱼雷） | 蓝色楔形紧凑战舰，舰体头部两侧有挂载多用途发射器的发射管。 |
  | | 阴影级 | 隐形轰炸舰 | 1800 / 1200 | 0H0L / 2L（仅大型导弹/鱼雷） | 黄铜色和金色的圆润战舰，头部有帝国徽记，使用隐形场。 |
