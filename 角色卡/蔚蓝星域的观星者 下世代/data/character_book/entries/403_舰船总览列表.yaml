  | | 独立级 | 轻型航母 | 4500 / 5400 | 6H6L / 2C | 作为旗舰时可大幅提升舰队作战协同效率，优化无人机出动和回收流程。 |
  | | 蛇怪级 | 轻型航母 | 4500 / 5400 | 6H6L / 2C | 专为配合量子传送鱼雷设计的综合目标指示系统，可向单一目标投射锁定信号。 |
