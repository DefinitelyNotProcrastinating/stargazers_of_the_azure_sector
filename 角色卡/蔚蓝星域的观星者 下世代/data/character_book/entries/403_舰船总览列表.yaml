  | **TT** | 君权级 | 泰坦 | 18000 / 42000 | 6H9L / 12XL1T | 修长华丽的星海长剑，曜石黑装甲板配纯金帝国纹章与浮雕，气势威严。 |
  | | 牛顿级 | 泰坦 | 42000 / 30000 | 9H6L / 8XL2C1T | 厚重修长的方形机械体，中段包裹着同心旋转的环状结构阵列。 |
  | | 自由贸易级 | 泰坦 | 42000 / 30000 | 9H6L / 8XL2C1T | 协调的蓝灰色模块化平台，由四个企业合作打造，挂载密密麻麻的武器和功能模块。 |
