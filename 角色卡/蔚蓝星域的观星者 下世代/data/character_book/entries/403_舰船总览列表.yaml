  | | 议会级 | 战术驱逐舰 | 2800 / 2200 | 4H2L / 4M2S | 敦实可靠的长条方形设计，覆盖六角形模块化装甲，橄榄绿涂装。 |
  | | 阐释者级 | 战术驱逐舰 | 2400 / 2000 | 4H2L / 4M2S | 优雅的哑光灰色纺锤形，武器系统隐藏于装甲下，体现帝国内敛风格。 |
  | | 阿波罗级 | 战术驱逐舰 | 2700 / 1900 | 4H2L / 3M | 线条充满肌肉感的扁平三角形，涂装为公司品牌色，两侧密布中子炮管。 |
