  **漂泊集群原生舰队（外环遗迹；不视为现役人类商品舰）：**
  | 舰种 | 单元 | 定位 | 基础护盾 / 基础结构 | 装备槽位 / 炮位 | 主要特性 |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | FF | 拦截单元 | 无人护卫舰 | 1800 / 450 | 3H1L / 2S | 高速、少炮位、高原生护盾，PG60 / CPU240。 |
  | CA | 强袭单元 | 无人机动巡洋舰 | 16800 / 4000 | 5H3L / 4M | 初始护盾DR30%，PG450 / CPU950，无扩展器倍率加成。 |
  | CA | 攻击单元 | 无人远距打击巡洋舰 | 10500 / 3500 | 5H3L / 2L2M | 能量伤害×1.30，光粒稳定射程×1.25。 |
  | CVL | 节点单元 | 战列舰吨位无人航母 | 90000 / 15000 | 7H5L / 2L2C | 超空间准备×0.25、同行超空间消耗-1（最低0）、机群命中侧+4。 |
  | CV | 网络单元 | 超级航母与迁移维护平台 | 600000 / 120000 | 9H6L / 2XL2C | 护盾DR55%、现场维修与共享最稳定在线个体的舰队超空间；晚期型可支持有人FTL。 |
  集群没有战列舰。完整节点极少见，完整网络单元尚未重新进入星区；收藏改造舰不得套用完整原生模板。舰体、默认原生装配与支援边界见对应ship_def和漂泊集群触发区。

  **备注:**
  *   **基础防御**：数值为“基础护盾 / 基础结构”。
  *   **炮位配置**：`S` = 小型炮位，`M` = 中型炮位，`L` = 大型炮位，`XL` = 超大型炮位，`C` = 舰载机中队槽，`T` = 同族超级武器槽。
  *   **C槽资格**：C槽是大型旗舰级机库，常规仅允许 CVL/CV/CVT/TT 使用。低于航母级的舰体必须在独立档案中明确标记 `C槽例外: true`；当前死神级航空战列舰是此类特例。普通航母CVL最多2C，工业旗舰最多3C（固定档案写明机库类别: 工业旗舰），超级航母CV/CVT最多5C；工业旗舰上限优先于CV舰级。泰坦辅助机库最多2C，死神级例外最多2C。上限不是额外赠送的炮位，实际数量仍取舰船固定档案；不得靠品质、模块、扩容或分拆中队增加C槽。1C只生成1个中队装备对象，标准满编40架；编制与当前架数记录在该对象的效果中，不把40架拆成40件装备。伤害是满编中队每1dt总伤害，不再乘40；减员后乘当前架数/编制，当前架数限于0至编制。PG/CPU按完整机库消耗，不随减员下降；补机必须消耗实际库存。
  *   **隐轰固定装配**：所有 SD 隐形轰炸舰均为 `0H0L / 2L`，且两个 L 炮位只能安装大型导弹或大型鱼雷。
  *   **舰种代号**：
      *   `FF`: 护卫舰
      *   `AF`: 突击护卫舰
      *   `DD`: 驱逐舰
      *   `AD`: 屏卫驱逐舰
      *   `SD`: 隐形轰炸舰
      *   `TD`: 战术驱逐舰
      *   `MV`: 采矿驳船
      *   `CA`: 巡洋舰 (含重型、指挥等)
      *   `HAC`: 重型突击巡洋舰
      *   `ESC`: 干扰巡洋舰
      *   `RC`: 后勤巡洋舰
      *   `SC`: 隐形侦察巡洋舰
      *   `BC`: 战列巡洋舰
      *   `BB`: 战列舰 (含无畏舰)
      *   `BBV`: 航空战列舰
      *   `DN`: 无畏舰
      *   `CVL`: 轻型航母
      *   `ICV`: 工业指挥舰
      *   `JF`: 超级货舰 (含隐形货舰)
      *   `CV`: 超级航母 (含工业旗舰、战略武器运载舰)
      *   `CVT`: 战术超级航母
      *   `TT`: 泰坦
  </舰船总览列表>
