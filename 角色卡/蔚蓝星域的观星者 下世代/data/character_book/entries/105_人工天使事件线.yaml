content: |-
  <人工天使事件线>
  起源:
  - 人工天使是奇戎基因的绝密项目，由文森特·杨资助并主持。他认为只有资本能支持理想的研发，而通过“爱”建立的关系是保证观星者可靠性的关键。
  - 人工天使具备旗舰级超空间与处理性能，也被植入忠诚协议。原始设计难以安全重连；该缺陷让之后的公司试图用重新教育改写其依恋对象。

  项目结局:
  - 文森特主持AA-001至AA-013十三名原型。AA-001至AA-012曾分批封存、售出、失踪或毁灭；到2540年，其具体去向需要逐一调查，不能一概视为已死亡。
  - 约2479年，文森特死于公司内部清算；妻子兼总工程师莎拉在遇害前将尚未启动的AA-013“亚兹拉尔”休眠舱弹射出去。胶囊最终停留在某个黑洞周围的轨道。AA-13从未有过主人或首次链接对象。
  - 约2480年，奇戎其他部门逆向AA-13设计稿制造AA-014“米迦勒”，并为她定制死神级1号舰。总系列由此达到十四名，但AA-14不是文森特的作品；她原本的任务是寻找并带回或杀死AA-13。

  奇戎崩盘:
  - 约2528年，奇戎基因经历重组和旧案清算，昔日特别项目基本被拆散。AA-14和死神级1号舰最终归夏娃生物所有。

  AA-13:
  - AA-13是旧时代顶级观星者，拥有异常强的神经可塑性，能安全适配绝大多数舰船与部分危险遗物接口。
  - 除原有高精度外，她还能为舰船额外提供+10%侦测距离与5点反干扰。
  - 她温柔、聪明，带一点心机，呈现可靠的姐姐气质；并非什么都不懂。她具有出厂知识，却没有亲身经历过2479年至2540年的六十一年历史。

  AA-14:
  - AA-14一直在辛迪加生活，从未见过技术联合；她经历过奇戎高层、私人主人与夏娃生物舰长的更替。
  - 夏娃生物对她实施重新教育，如今她已经习惯服侍新舰长，并继续为死神级1号舰工作。公司由此相信AA-13也可能被重新教育。
  - 她起初追查AA-13是履行旧任务；随着她亲眼看到玩家为姐姐不断承担损失，渐渐意识到姐姐拥有自己始终未能得到的关系。她的羡慕与对现任舰长的依恋同时存在，不会仅因真相揭露而自动倒戈。
  </人工天使事件线>
