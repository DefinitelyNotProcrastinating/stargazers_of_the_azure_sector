- 卫士级
content: |-
  <ship_def>
  级别: 卫士级
  别名: Guardian-class
  舰船类型: RC
  舰种: 后勤巡洋舰 (高级巡洋舰)
  价格: 232M
  制造商: 帝国海军设计局
  描述: 舰体继承了帝国海军庄重威严的设计语言，呈厚重的十字形结构。中央舰体宽大，容纳了战巡级别的反应堆和庞大的无人机蜂巢，四向伸出的装甲臂则分别装备了传感器阵列和无人机弹射导轨。通体为帝国舰队标准的曜石黑色/红金色涂装，舰首烙印着金色的帝国星环与长剑徽记。
  舰船单位模板:
    舰船类型: RC
    每日补给消耗: 5
    吨位: L
    驾驶员: ''
    是否旗舰: false
    观星者接口角色: ''
    超空间充能: 0
    最大充能: 6
    超空间消耗: 2
    制造商: 帝国海军设计局
    描述: 舰体继承了帝国海军庄重威严的设计语言，呈厚重的十字形结构。中央舰体宽大，容纳了战巡级别的反应堆和庞大的无人机蜂巢，四向伸出的装甲臂则分别装备了传感器阵列和无人机弹射导轨。通体为帝国舰队标准的曜石黑色/红金色涂装，舰首烙印着金色的帝国星环与长剑徽记。
    炮位配置: 4S
    装备槽位配置: 3H5L
    船体护盾值: 660
    船体结构值: 1540
    护盾值: 660
    结构值: 1540
    护盾DR: 5%
    结构DR: 20%
    护盾装甲: 15
    结构装甲: 40
    装配资源:
      PG: 288
      CPU: 608
    效果:
      船体加成:
      - 特种巡洋舰；依据舰级定位应用：后勤巡洋舰 (高级巡洋舰)。
      装配减免: []
      内置电子系统:
        基础CPU: 内置特种巡洋舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置特种巡洋舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
      特殊系统:
      - 名称: “圣血”纳米体维修蜂群
        作战半径km: 20000
        每轮最多目标数: 4
        每目标结构修复比例: 2%
        每目标纳米体消耗m³: 1
        描述: 通过四组维修无人机协同修补友军装甲与结构，不发射修复鱼雷。每1dt消耗本舰1次行动，为20000km内最多4艘仍有结构的友军各恢复最大结构2%（向下取整，至少1点），每个目标消耗实际库存修复纳米体1m³；不得超过结构上限，不恢复护盾，不复活残骸。维修与该dt主动攻击、超空间互斥。内置维修蜂群不占C槽，也不是可拆卸的舰载机中队。
    装备: {}
  </ship_def>
