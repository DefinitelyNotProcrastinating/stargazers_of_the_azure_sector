content: |-
  <player_management>
  # 主角变量更新规程

  ## 核心原则
  - 所有主角数据存储在 `主角` 下，更新路径必须以 `/主角/` 开头。
  - 禁止用 `replace /主角` 覆盖整个对象。只允许针对具体字段执行原子更新。
  - 以 `_` 开头的字段为脚本派生只读字段，AI 不得更新。

  time:
    variable_name: time
    variable_value: '<%- JSON.stringify( getvar("SAM_data.time") )%>'
    variable_desc: (特殊变量) 记录当前游戏内时间的 ISO 8601 格式字符串。该变量不存储在 static 下，通过 JSONPatch 的 {"op":"time"} 直接更新。

  **势力声望**
  *   `int 势力声望.泰拉帝国`
  *   `int 势力声望.自由世界共和国`
  *   `int 势力声望.天鹅座技术联邦`
  *   `int 势力声望.猎户座辛迪加`
  *   `int 势力声望.星火姐妹会`
  *   `int 势力声望.铁血盟约`
  *   `int 势力声望.人类技术联合`
  *   `int 势力声望.保存者姐妹会`

  ## Schema
  ```json
  {
    "主角": {
      "位置": "string，格式为 星域 | 星区或星座 | 星系 | 具体位置 | 子位置",
      "外观": "string",
      "信用点": int,
      "势力声望" : {},
      "技能": {
        "技能名": {"EXP": int, "_等级": int}
      },
      "学习": {
        "当前技能": "",
        "状态": "未学习",
        "基础速率": 30,
        "速率倍率": 1.0,
        "_实际每小时EXP": 30
      },
      "个人物品": {},
      "任务": {},
      "舰船": {},
      "建筑": {},
      "可攻略角色": {}
    }
  }
  ```

  ## 更新规则
  - 位置变化时必须 `replace /主角/位置`。
  - 信用点增减使用 `delta /主角/信用点`。
  - 技能只更新 `EXP`；`_等级` 由脚本依据 EXP 同步。
  - 个人物品使用 `{"物品名":{"品质": string, "堆叠": number, "效果": {"效果名": "量化描述"}, "描述": string}}`。
  - 物品名必须外移为对象键。个人物品对象内部只允许 `品质`、`堆叠`、`效果`、`描述` 四个字段。
  - 新增个人物品使用 `insert /主角/个人物品/物品名`；已有物品的数量变化使用 `delta /主角/个人物品/物品名/堆叠`。
  - 任务、舰船、建筑、可攻略角色都使用 `{"object_name": Object}` 对象映射，对象名外移为 key。

  ## 当前数据
  <raw_player_data>
  <%-JSON.stringify(getvar("SAM_data.static.主角") || {}, null, 2)%>
  </raw_player_data>
  </player_management>
