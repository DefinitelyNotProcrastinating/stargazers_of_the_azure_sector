content: |-
  <player_management>
  # 主角变量更新规程

  ## 核心原则
  - 所有主角数据存储在 `主角` 下，更新路径必须以 `/主角/` 开头。
  - 禁止用 `replace /主角` 覆盖整个对象。只允许针对具体字段执行原子更新。
  - 以 `_` 开头的字段为脚本派生只读字段，AI 不得更新。

  time:
    variable_name: time
    variable_value: '<%- JSON.stringify( getvar("SAM_data.time") )%>'
    variable_desc: (特殊变量) 记录当前游戏内时间的 ISO 8601 格式字符串。该变量不存储在 static 下，通过 JSONPatch 的 {"op":"time"} 直接更新。

  **势力声望**
  *   `int 势力声望.泰拉帝国`
  *   `int 势力声望.自由世界共和国`
  *   `int 势力声望.天鹅座技术联邦`
  *   `int 势力声望.猎户座辛迪加`
  *   `int 势力声望.星火姐妹会`
  *   `int 势力声望.铁血盟约`
  *   `int 势力声望.人类技术联合`
  *   `int 势力声望.保存者姐妹会`

  ## Schema
  ```json
  {
    "主角": {
      "位置": "string，格式为 星域 | 星区或星座 | 星系 | 具体位置 | 子位置",
      "外观": "string",
      "信用点": int,
      "库存": {"矿物": number, "食物": number, "金属": number, "补给": number},
      "_工业最后结算时间": "ISO 8601，由脚本维护",
      "势力声望" : {},
      "技能": {
        "技能名": {"EXP": int, "_等级": int}
      },
      "学习": {
        "当前技能": "",
        "状态": "未学习",
        "基础速率": 30,
        "速率倍率": 1.0,
        "_实际每小时EXP": 30
      },
      "物品栏": {},
      "任务": {},
      "舰船": {},
      "建筑": {},
      "可攻略角色": {}
    }
  }
  ```

  ## 更新规则
  - 位置变化时必须 `replace /主角/位置`。
  - `主角.信用点` 是工业信用点唯一真值；AI不得使用JSONPatch直接修改，叙事变化调用 `resupply("信用点", 数量)`。
  - 技能只更新 `EXP`；`_等级` 由脚本依据 EXP 同步。
  - `主角.物品栏` 是普通物品、消耗品、商品、战利品、蓝图、未装配装备与模块的唯一存储位置。
  - `主角.库存` 是矿物、食物、金属、补给的统一数值库存；不按星区划分，也不作为普通物品写入物品栏。
  - AI不得使用JSONPatch直接修改工业库存；叙事变化调用 `resupply(资源名称, 数量)`。
  - `_工业最后结算时间` 由periodic工业脚本维护，AI不得创建或修改。
  - 物品栏使用 `{"物品名":{"品质": int, "堆叠": number, "效果": {"效果名": "量化描述"}, "描述": string}}`。
  - 物品名必须外移为对象键。物品对象内部只允许 `品质`、`堆叠`、`效果`、`描述` 四个字段。
  - 新增物品使用 `insert /主角/物品栏/物品名`；已有物品的数量变化使用 `delta /主角/物品栏/物品名/堆叠`；堆叠归零时移除该物品。
  - 舰船、建筑与角色对象不得建立库存、仓库、货舱物品等存储字段。已装配装备只记录在对应舰船的 `装备` 下；卸载时从舰船移除并写入物品栏，装配时从物品栏移除并写入舰船。
  - 同一件物品不得同时出现在物品栏与舰船装备中，也不得在多个对象中重复记录。
  - 任务、舰船、建筑、可攻略角色都使用 `{"object_name": Object}` 对象映射，对象名外移为 key。

  ## 当前数据
  <raw_player_data>
  <%-JSON.stringify(getvar("SAM_data.static.主角") || {}, null, 2)%>
  </raw_player_data>
  </player_management>
