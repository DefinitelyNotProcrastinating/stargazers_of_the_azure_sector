content: |-
  <ship_def>
  级别: 常数级
  别名: Constant-class
  舰船类型: BC
  机动评级: "32"
  舰种: 战列巡洋舰 BC
  价格: 520M
  制造商: 联邦联合动力
  描述: 三体结构，三个细长的舰体通过磁场和物理支架连接。这种分散结构提高了生存率。
  舰船单位模板:
    舰船类型: BC
    机动评级: "32"
    每日补给消耗: 20
    吨位: XL
    驾驶员: ''
    是否旗舰: false
    观星者接口角色: ''
    超空间充能: 0
    最大充能: 5
    超空间消耗: 2
    制造商: 联邦联合动力
    描述: 三体结构，三个细长的舰体通过磁场和物理支架连接。这种分散结构提高了生存率。
    炮位配置: 6L4S
    装备槽位配置: 7H5L
    船体护盾值: 3500
    船体结构值: 2500
    护盾值: 3500
    结构值: 2500
    装配资源:
      PG: 540
      CPU: 760
    效果:
      船体加成:
      - 依据舰级定位应用：战列巡洋舰 BC。
      装配减免: []
      内置电子系统:
        基础CPU: 内置战巡级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置战巡级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
      特殊系统:
      - 名称: 战术隐形装置
        描述: 可隐形，或者在隐形中超空间。
      - 名称: 内置能量容器
        最大储能轮数: 2
        当前储能轮数: 0
        描述: 最多存储已装能量武器两轮正常攻击的能量。每1dt可选择将一轮正常能量攻击改为储能，该轮不发射对应能量武器，仍支付正常资源与冷却；满仓不能继续存储。释放占用该dt正常攻击行动，可将最多两轮存储能量与当轮正常供能集中释放；两轮储能后第三轮集中发射最多相当于三轮正常攻击，长期总DPS不变。按每件武器分别记录存入的攻击能量与当时伤害上限，每份攻击仍各自判定命中、跟踪、射程与防御，不能合成一次无视装甲的大伤害。不得免费预装储能、缩短冷却、重复叠加伤害加成、把非能量武器存入或转给其他武器；卸载、损毁对应武器时其储能作废。隐形状态仍须解除隐形后才能主动射击。
    装备: {}
  </ship_def>
