keys: []
content: |-
  <技能学习与旗舰门槛>
  技能系统:
    核心原则: |
      主角、友方与敌方都可以拥有同一套技能体系。技能系统是长期成长规则，而不是单次战斗 buff。
      技能的唯一真实进度值是 `主角.技能.技能名.EXP`。
      技能等级 `_等级` 是只读派生值，由外部脚本在每次回复结束后根据 EXP 自动同步。
      一次只能学习 1 个技能；当前学习项目存放在 `主角.学习.当前技能`。
      AI 在叙事和计算中读取 `_等级`，脚本在结算中累加 `EXP`。

    技能列表:
      导弹:
        作用: 导弹、鱼雷、巡航导弹、超重型鱼雷及其变体
        每级加成:
          - 所有导弹与鱼雷武器最终伤害 +5%
          - 所有导弹与鱼雷武器制导/命中表现 +5%
      炮术:
        作用: 激光、脉冲激光、正电子束、磁轨炮、自动加农炮及其变体
        每级加成:
          - 所有炮塔武器最终伤害 +5%
          - 所有炮塔武器跟踪 +5%
      战机:
        作用: 无人机、舰载机、轰炸机、拦截机及其母舰机库
        每级加成:
          - 所有舰载机与无人机最终伤害 +5%
          - 所有舰载机与无人机跟踪 +5%
      算法:
        作用: ECM、ECCM、火控协同、干扰网络、指挥算法
        每级加成:
          - 所有干扰能力 +5%
          - 所有抗干扰能力 +5%
      工程:
        作用: 维修模块、后勤模块、超载管理、超级武器控制
        每级加成:
          - 所有模块修复能力 +5%
        特殊规则:
          - 工程 V 允许对可超载模块进行超载
          - 超载后该模块效果提高到原效果的 150%
          - 完成超载的下一个 dt，该模块不可使用
          - 超级武器、舰载机/无人机、被动模块不可超载
      工业:
        作用: 产业设施、制造设施、采矿设施、精炼设施
        每级加成:
          - 所有设施工业效率 +5%
      科学:
        作用: 科研设施、蓝图解析、实验设施、超级武器理论支持
        每级加成:
          - 所有设施科研效率 +5%
      驾驶:
        作用: 飞船操控、跃迁路线管理、旗舰驾驭
        每级加成:
          - 跃迁消耗 -5%
        额外规则:
          - 跃迁消耗点数最终必须为整数
          - 计算后统一向上取整，最低为 1
      装甲:
        作用: 装甲结构、防爆层、外层复合板
        每级加成:
          - 装甲抗性 +2.5%
      护盾:
        作用: 护盾发生器、护盾谐振、护盾稳定性
        每级加成:
          - 护盾抗性 +2.5%
      同调:
        作用: 观星者同调、跃迁充能效率
        每级加成:
          - 每次获取跃迁充能时，额外获得 0.5 点跃迁充能
        额外规则:
          - 同调技能最高为 V，最多使每次充能额外获得 2.5 点跃迁充能
          - 同调技能不提高最大充能，充能后仍不可超过舰船的最大充能

    抗性规则:
      核心: 所有来源叠加后的最终装甲抗性与护盾抗性上限均为 80%
      说明: |
        技能加成、模块加成、舰体被动、指挥加成等都遵守同一个 80% 上限。
        超过上限的部分直接舍弃，不会继续累积。

    学习规则:
      核心: |
        一次只能学习 1 个技能。
        训练进度通过时间流逝获得，推荐由外部脚本依据 `dtime` 自动结算。
      建议变量结构:
        主角.技能: |
          {
            "导弹": {"EXP": 0, "_等级": 0},
            "炮术": {"EXP": 0, "_等级": 0},
            "战机": {"EXP": 0, "_等级": 0},
            "算法": {"EXP": 0, "_等级": 0},
            "工程": {"EXP": 0, "_等级": 0},
            "工业": {"EXP": 0, "_等级": 0},
            "科学": {"EXP": 0, "_等级": 0},
            "驾驶": {"EXP": 0, "_等级": 0},
            "装甲": {"EXP": 0, "_等级": 0},
            "护盾": {"EXP": 0, "_等级": 0},
            "同调": {"EXP": 0, "_等级": 0}
          }
        主角.学习: |
          {
            "当前技能": "",
            "状态": "未学习",
            "基础速率": 30,
            "速率倍率": 1.0,
            "_实际每小时EXP": 30
          }
      结算建议:
        - 增加值 = floor(dtime_ms / 3600000 × 实际每小时EXP)
        - 将增加值累加到 `主角.技能.当前技能.EXP`
        - 再依据统一等级阈值回填 `_等级`
      等级需求表:
        说明: |
          所有技能共用同一套经验阈值。
          下表中的“总 EXP”指达到该等级所需的累计经验；
          “本级新增 EXP”指从上一级升到当前等级还需要额外获得的经验。
        等级I:
          总EXP: 250
          本级新增EXP: 250
        等级II:
          总EXP: 1415
          本级新增EXP: 1165
        等级III:
          总EXP: 8000
          本级新增EXP: 6585
        等级IV:
          总EXP: 45255
          本级新增EXP: 37255
        等级V:
          总EXP: 256000
          本级新增EXP: 210745
      常规学习速度参考:
        说明: |
          这是无加速、无芯片、无特殊设施、无导师加成时的常规训练参考。
          `主角.学习.基础速率` 推荐默认使用 30 EXP/小时，`速率倍率` 默认 1.0。
          实际使用时由 `_实际每小时EXP = floor(基础速率 × 速率倍率)` 或等效规则得出。
        默认速率:
          每小时EXP: 30
          每日EXP: 720
          每30日EXP: 21600
        达成等级I:
          需求总EXP: 250
          参考时长: 8小时20分钟
        达成等级II:
          需求总EXP: 1415
          参考时长: 1天23小时10分钟
        达成等级III:
          需求总EXP: 8000
          参考时长: 11天2小时40分钟
        达成等级IV:
          需求总EXP: 45255
          参考时长: 62天20小时30分钟
        达成等级V:
          需求总EXP: 256000
          参考时长: 355天13小时20分钟
      加速参考:
        说明: 用于世界观和数值手感校准，不强制要求必须采用这些倍率。
        慢速训练:
          速率倍率: 0.5
          每小时EXP: 15
        常规训练:
          速率倍率: 1.0
          每小时EXP: 30
        优质训练环境:
          速率倍率: 1.5
          每小时EXP: 45
        军规训练环境:
          速率倍率: 2.0
          每小时EXP: 60
        高级训练舱或名师指导:
          速率倍率: 3.0
          每小时EXP: 90

    经验获取规则:
      核心原则: |
        学习提供稳定但有限的“低保”经验；实战、科研、工业等实际成就提供额外经验。
        技能经验的多少必须与实际成果挂钩，而不是只与是否执行动作挂钩。
        由于等级阈值采用强乘方增长，后期很难通过大量重复击毁低级目标快速升级，这是正常设计结果。
      通用要求:
        - 所有经验最终都累加到对应技能的 `EXP`
        - AI 可以在结算中给出经验来源说明，但真正的 EXP 累加与 `_等级` 同步由外部脚本完成
        - 未发生实际成果时，不应凭空发放大量经验
      学习低保:
        规则: |
          若 `主角.学习.当前技能` 非空，且状态为 `学习中`，则该技能按时间流逝获得训练经验。
          这是最低保障收益，代表持续训练，而不是高强度实战成长。
      战斗经验:
        核心: |
          只要参与了有效战斗，就总会获得少量相关实战经验；
          若成功击毁、重创、压制或驱离更高等级、更高吨位、更高品质的目标，则经验显著增加。
        增长逻辑:
          - 击毁比自身更高吨位或更高战术价值的飞船，应获得更多经验
          - 击毁旗舰、超级武器平台、航母、重型后勤舰等高价值目标，应给予大额经验
          - 只击毁大量低吨位、小型、低威胁目标时，单次经验应明显偏低
          - 对后期角色而言，低级目标提供的经验应因等级阈值陡增而显得边际很低
        技能映射:
          - 导弹武器造成的有效战果，主要给予导弹经验
          - 炮塔武器造成的有效战果，主要给予炮术经验
          - 舰载机、无人机、轰炸机造成的有效战果，主要给予战机经验
          - ECM、ECCM、旗舰干扰、指挥算法压制等有效电子战成果，主要给予算法经验
          - 维修、后勤、模块抢修、战场工程保障等有效成果，主要给予工程经验
          - 承受高压火力并依靠装甲/护盾体系成功生存，可酌情给予装甲或护盾经验
          - 驾驶经验不通过实战、航行、跃迁、脱离、追击、拦截或日常操舰主动增加，只能通过学习系统、特殊训练或经验注入获得
          - 同调经验不因反复充能或跃迁主动增加，只能通过学习系统、特殊训练或经验注入获得
        成果分级:
          轻微成果: 命中、压制、逼退、拦截、协助击伤
          中等成果: 击伤关键模块、瘫痪目标、造成决定性压制
          重大成果: 击毁主战舰船、旗舰目标、超级武器平台或战役关键单位
      工业经验:
        核心: |
          工业活动会持续提供工业经验，经验值视实际产出、制造规模、设施等级、资源处理量和结果价值而定。
        高经验情形:
          - 建造高等级舰船、旗舰部件、稀有模块、重工业设施
          - 大规模采矿、精炼、制造、装配与物流调度取得显著成果
          - 启用或升级旗舰级工业设施
      科学经验:
        核心: |
          科研活动会持续提供科学经验，经验值视蓝图复杂度、研究层级、实验难度、理论突破与成果价值而定。
        高经验情形:
          - 解析旗舰蓝图、先驱遗物、超级武器理论
          - 完成高难度实验、逆向工程、重大科研突破
          - 启用或推进旗舰级科研设施和重大项目
      驾驶经验例外:
        核心: |
          驾驶是一条明确受控的训练技能线，不会因为“开得多”就自然涨经验。
          其设计逻辑类似于：会开民用车辆，不等于会驾驶坦克、旗舰或复杂工业载具。
        规则:
          - 驾驶 EXP 默认只来自 `主角.学习.当前技能 = 驾驶` 的训练低保
          - 特殊剧情训练、军事模拟器、旗舰驾校、先驱接口校准等可作为额外驾驶经验来源
          - 常规战斗、常规跃迁、普通航行、反复驾驶低级舰船，不会直接给予驾驶 EXP
          - 若剧情需要临时授予驾驶能力，应通过训练、授权接口或训练芯片解释，而不是把普通操作次数视作经验来源
      训练芯片:
        定义: |
          训练芯片是一类特殊装备或特殊消耗品，用于将特定技能的经验直接注入经验池。
          不同品质的训练芯片可以提供不同上限的经验值。
        使用规则:
          - 训练芯片按技能类型区分，例如 `炮术训练芯片`、`工程训练芯片`、`驾驶训练芯片`
          - 若某训练芯片对应 X 技能，且该芯片的目标经验值为 K，则它不是“增加 K 点”，而是“将 X 技能 EXP 直接提升到 K”
          - 若当前 `X技能.EXP >= K`，则该训练芯片无法使用
          - 若当前 `X技能.EXP < K`，则使用后直接将 `X技能.EXP` 设为 `K`
          - 训练芯片只修改对应技能的 `EXP`，随后再由外部脚本自动同步 `_等级`
        结算示例:
          - 当前 `驾驶.EXP = 1200`，使用 `驾驶训练芯片(5000)` 后，结果为 `驾驶.EXP = 5000`
          - 当前 `炮术.EXP = 9000`，使用 `炮术训练芯片(8000)` 时，由于现有 EXP 已超过目标值，因此无法使用
        叙事要求:
          - 训练芯片应被视为稀有、昂贵或受控资源，尤其是高等级驾驶芯片和旗舰级芯片
          - AI 不得把训练芯片描述成无限量、可重复滥用的廉价日用品，除非剧情明确如此设定
      结算口径:
        - 经验结算以“实际成就”为先，以“动作次数”为辅
        - AI 在战斗结算面板中必须写出经验来源，不得只写一个总数
        - 若一次事件同时涉及多个技能，可以分别给予多条技能经验
        - 若经验来源极弱，可只给予象征性增量
        - 若成果极强，可给予一次性大额增量

  旗舰门槛:
    核心原则: |
      只有大口径、旗舰级和超级级内容采用硬门槛。
      常规 S/M/L 武器、常规舰船、常规工业与科研活动不因技能不足而完全锁死，只受数值表现影响。

    硬门槛列表:
      XL炮塔武器:
        条件: 炮术 V
        范围: XL 激光、XL 脉冲激光、XL 正电子束、XL 磁轨炮、XL 自动加农炮及同级炮塔武器
      XL导弹武器:
        条件: 导弹 V
        范围: XL 鱼雷、超重型鱼雷、末日鱼雷及同级导弹武器
      航母与旗舰机库:
        条件: 战机 V
        范围: 航母舰载机机库、旗舰级无人机联队、轰炸机联队
      旗舰工业设施:
        条件: 工业 V
      旗舰蓝图:
        条件: 科学 V
      旗舰船体:
        条件: 驾驶 V
      旗舰级干扰器:
        条件: 算法 V
      旗舰级维修器:
        条件: 工程 V
      超级武器:
        条件:
          - 工程 V
          - 科学 V
          - 炮术 V
        说明: 若超级武器属于导弹系超级武器，也额外需要导弹 V

    使用限制:
      - 未满足硬门槛时，相关装备、设施、蓝图或舰体不可安装、不可激活、不可建造、不可研究、不可驾驶
      - AI 不得以“勉强驱动”“临时试射”等叙事规避技能锁
      - 若剧情明确给出外部授权、先驱接口或特殊代驾系统，可作为一次性例外，但必须明确写出例外来源

  计算口径:
    伤害加成:
      - 同技能多级加成为乘算前的统一百分比修正，通常可写为 `基础值 × (1 + 等级 × 0.05)`
    跟踪与制导:
      - 炮术、战机提供跟踪修正；导弹提供制导/命中表现修正
    抗性:
      - 装甲与护盾技能加成在最终抗性结算时应用，并受 80% 上限约束
    跃迁:
      - 驾驶技能减少跃迁消耗，最终结果必须为整数
      - 同调技能使每次获取跃迁充能时额外获得 `同调等级 × 0.5` 点充能，最高额外获得 2.5 点
    维修:
      - 工程技能提高主动修复类模块、后勤模块、维修无人机、远程维修器等修复能力
    工业与科研:
      - 工业和科学只提升对应设施效率，不直接提高战斗伤害

  叙事规则:
    - 正文中不需要频繁直呼“炮术 V”“工程 V”，可以自然表述为“具备旗舰级炮术许可”“拥有旗舰工程资质”
    - 在规则判断、变量处理、装备限制和战斗计算中，统一按明确等级判定
    - 若角色、舰长、观星者、敌军或 NPC 拥有技能优势，该优势必须真实体现在其装备使用权限和数值表现上
  </技能学习与旗舰门槛>
