content: |-
  <大型设定触发区>
  设定: 先驱者 / 银河防御联盟
  历史哲学:
    发起者: 始源者是头足纲形态的智慧生物，亲外、唯物主义，坚信知识共享与生命延续。
    黄金时代: 联盟将超空间引擎等基石技术无私分享给新兴文明，并建立跨银河暗物质管道系统作为星门。
    河外来客: 漂泊集群从超空间抵达外环，与先驱者交战后停战定居；天灾战争中成为联盟协作者。
    天灾战争: 来自银河之外的超维入侵者试图吞噬一切；始源者自告奋勇成为舰队负责人。天灾截断远程通讯，使自动舰队难以维持统一指挥，联盟才大量开发有人战体。
    终局: 联盟在银河中心黑洞内部建造反熵装置，把每个有意识生物化作概率云消散，成功驱逐天灾。
    引语: “同胞，启动了反熵装置，我们会变成什么样子？”——无名联盟飞行员
    引语2: “不论我们来自何方，不论我们物种如何，今日，我们合而为一。”——无名联盟议员
  舰队技术:
    模块化变形: 战舰核心是战体概念，可现场变形或组合成新形态，执行不同战术任务。各舰机动评级是写有模式与数字的固定字符串，战斗时按叙事上下文读取当前模式数字；不因变形改写字符串。攻击模式如写射速×2，则各次开火独立使用武器唯一命中值。
    自适应处理单元: 每艘战舰搭载可学习、可无限扩展的计算机单元，可兼容几乎任何技术体系；计算接口兼容不能代替船体内部结构，因此不能绕过光粒炮的集群船体与光子凝聚器限制。
    量产原则: 单舰性能远超人类同级，但设计思路仍是高质量消耗品。
    结晶装甲: 所有先驱者战舰无护盾，依赖厚重可自我修复的结晶装甲。
    熵分解炮: 先驱者裂解射线的旧称；主要会战武器，超远射程且唯一命中值为120，可少量穿透护甲和护盾直接攻击船体。
    遗物火炮限制: 裂解射线原则上仅限先驱者舰船，且必须保有完好的船体内部熵聚焦线路；该线路与原生舰体结构深度整合，不能作为普通模块加装到人类舰或集群舰。ACX-00渡鸦级以先驱者残骸为材料并保留原生线路，是明确例外；炮位、PG、CPU或自适应处理单元本身不能提供这项例外资格。
    装配数据限定: 裂解射线及熵分解炮阵列填写安装限定={船体文明: 先驱者, 所需内部结构: [熵聚焦线路], 例外舰型: [ACX-00渡鸦级]}；生成先驱者船体单位时填写文明=先驱者、效果.内部结构.熵聚焦线路=完好。渡鸦级保留文明=人类并填写船体型号=ACX-00渡鸦级，依例外舰型通过文明校验，但仍须线路完好。线路损毁或拆除后不得保留该炮，复制先驱者引擎不会使普通人类船体获得装配资格。
    奇点隐形: 泰坦级战体可利用超空间引擎把舰体藏入微型时空裂缝；越大的先驱者飞船隐身能力越好。
    自动舰队: 本文明的自动化无人部队，负责第一批侦察与先锋投入；中环保留其基地、维护设施与无人战体遗迹，不是独立机械文明。
    有人战体: 天灾战争时期大量开发，以生物驾驶员直接控制，减少对被截断远程通讯的依赖；无人和有人主力舰吨位战体一般只在危险外环出现。
    精确原则: 多意识微小延迟会导致变形或战术链崩溃；有人战体通常只需要1个驾驶员，但精度和比特率要求极端严苛。
    抗干扰: 泰坦级战体免疫心控和常规电子战，错误信息会被其他子个体覆盖，强行入侵可能烧毁攻击者。
  舰型参数:
    拦截者构型:
      级别: DD
      长度: 150m
      角色: 高速拦截与远程火力支援，通常由中枢战体挂载并大规模投送。
      数据: 装甲2500，机动评级"火力模式95，机动模式110"，火力800，射程100000km。
      变形: 火力模式主炮射速×2；机动模式保持常规射速。
      武器: 4x轻型熵分解炮阵列，点防御脉冲波发射器。
      观星者需求: 极高神经反应速度和精度；低端观星者接入瞬间会烧毁神经。
    巡航构型:
      级别: BC
      长度: 750m
      角色: 舰队机动作战单位，战线中坚。
      数据: 装甲90000，机动评级"攻击模式15，机动模式85"，火力参考4500/6500，射程250000km。
      武器: 2x重型熵分解炮组，12x中型熵分解炮阵列，点防御脉冲波发射器。
      特殊: 双相变形；攻击模式主炮射速×2，机动模式常规射速。
      观星者需求: 高神经可塑性，否则变形过程可能损伤舰体结构。
    中枢构型:
      级别: CV
      长度: 2500m环状直径
      角色: 移动指挥中心、生产设施与投送平台。
      数据: 装甲550000，机动评级"指挥模式40，机动模式50"，火力180加挂载战体输出。
      挂载: 8艘巡航构型或32艘拦截者构型。
      特殊: 战体挂载与快速生产、广域指挥脉冲、小型10LY传送通道。
      观星者需求: 恐怖数据处理能力，约900TB/s且错误率0.01/1MOPS。
    完型构型:
      级别: TT
      长度: 19000m组合体
      结构: 由九个分型战体构成；出现时应让全部9个子个体出现，可损坏。
      数据: 装甲900000/1500000，机动评级"机动模式75，防御模式25，攻击模式25，支援模式25，投送模式25"，火力150000/1.0M，射程355000km/10000000km。
      模式: 机动/防御模式、攻击模式热寂空间长枪（主武器射速×2）、支援模式终末光华、投送模式人工虫洞。
      观星者需求: 0/1TOPS错误率，约1PB/s比特率，并需天马行空的灵活思维。
    方舟构型:
      级别: TT
      长度: 大陆级
      角色: 联盟摇篮与最后堡垒，内部容纳大陆级生态系统。
      能力: 守护者之剑、生命温床、超大型船坞、保存数百万FTL物种基因样本。
      机动评级: "堡垒模式2，航行模式5"
      状态: 约一百万个方舟舰均已损毁并遭结构信息扭曲。
  通用指标: Galactic Defense Federation DD/BC/BB/TT为1TW/mV stable，1PB/s Bitrate，0/1MOPS error rate；变形能力需要高神经可塑性。
  </大型设定触发区>
