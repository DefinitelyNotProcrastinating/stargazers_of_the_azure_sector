keys: []
content: |-
  <跃迁充能>
  warp_capacitor_system:
    schema_binding: |
      每一艘 `主角.舰船` 下的舰船对象都必须具有以下3个字段：
      - "跃迁充能": number
      - "最大充能": int
      - "跃迁消耗": int

    执行规则: |
      1. 只有当 当前跃迁充能 >= 跃迁消耗 时，舰船才可以执行一次跃迁。
      2. 如果 当前跃迁充能 <= 0，则该舰船当前无法执行跃迁。
      3. 每次成功跃迁后，立即一次性扣除【跃迁消耗】数量的充能。
      4. 任何充能行为都不能让当前跃迁充能超过【最大充能】。
      5. 若有观星者角色或装配效果改变了单次充能量或最大上限，应直接反映到舰船字段中。
      6. 若舰长拥有同调技能，每次获取跃迁充能时额外获得【同调等级 × 0.5】点充能，最高额外获得 2.5 点；该加成不提高【最大充能】。

    每跳充能消耗:
      FF: 1
      DD: 1
      CA: 2
      BC: 2
      BB: 3
      CVL: 3
      CV: 4
      TT: 6

    记忆电容基础上限:
      FF: 8
      DD: 7
      CA: 6
      BC: 5
      BB: 4
      CVL: 4
      CV: 5
      TT: 6

    变体继承:
      AF: FF
      AD: DD
      SD: DD
      TD: DD
      HAC: CA
      ESC: CA
      RC: CA
      BBV: BB
      CVT: CV
      DN: CV
    变体继承规则: |
      变体舰级必须使用其基础舰级的 `跃迁消耗` 与 `最大充能`。禁止为变体舰级保留 0 上限或 0 消耗。
      新建舰船的 `跃迁充能` 默认仍为 0；只有当前充能会随剧情、补给、观星者能力或装备效果变化。

    建模要求:
      新舰船初始化:
        FF: {"跃迁消耗": 1, "最大充能": 8}
        DD: {"跃迁消耗": 1, "最大充能": 7}
        CA: {"跃迁消耗": 2, "最大充能": 6}
        BC: {"跃迁消耗": 2, "最大充能": 5}
        BB: {"跃迁消耗": 3, "最大充能": 4}
        CVL: {"跃迁消耗": 3, "最大充能": 4}
        CV: {"跃迁消耗": 4, "最大充能": 5}
        TT: {"跃迁消耗": 6, "最大充能": 6}
      默认当前充能:
        规则: 新建舰船时若没有额外说明，"跃迁充能" 默认写为 0。

  </跃迁充能>
