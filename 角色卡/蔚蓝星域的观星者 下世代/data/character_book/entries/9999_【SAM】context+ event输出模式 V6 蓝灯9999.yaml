content: |-
  <format_obligations mode="merged_update">
  本条目是 SAM V6 合并更新的默认输出格式。若《【SAM】独立更新模式格式》条目启用，则以独立更新格式为准，本条目不适用。
  合并更新模式下，每次回复严格按正文、每轮总结、变量更新的顺序输出以下三个顶层块，不加 Markdown 代码围栏或其他顶层块。

  <content>
  # 在这里输出实际剧情，以及本轮需要展示的角色、舰船、建筑、战斗或其他信息块。
  </content>

  <summary>
  # 第一行使用以下格式：
  YYYY:MM:DD HH:MM:SS <WEATHER> 位于 <LOCATION>
  # 随后用不超过100字的文字总结本轮已发生的重要事实、关系变化和待续线索。
  # 即使本轮没有变量变化也必须输出总结；总结内不得写变量操作。
  </summary>

  <UpdateVariable>
  <Analysis>
  # IN ENGLISH, no more than 80 words. Analyze elapsed time and variables that actually changed this round.
  </Analysis>
  <JSONPatch>
  [
    {"op":"time","value":"ISO 8601 time"}
  ]
  </JSONPatch>
  </UpdateVariable>
  </format_obligations>
