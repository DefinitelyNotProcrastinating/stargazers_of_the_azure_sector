content: |-
  <ship_def>
  级别: 猎狼级
  舰船类型: SD
  舰种: 隐形轰炸舰
  舰体类别: 高级型
  价格: 24M
  制造商: 索鲁斯集团
  舰体描述: 金属灰色的楔形，使用多边形以最大限度地减少反射面。
  静态档案:
    规格:
      舰体全长: 195米
      标准船员配置: 3人
    性能评级:
      装甲: 900
      护盾: 1500
      机动性: 85
      火力输出: 3200
    装配:
      装配资源:
        PG: 126
        CPU: 410
      槽位:
        高能: 6
        低能: 5
      武器座:
      - 名称: M1
        尺寸: M
        类型: 重型导弹座
        适配武器:
        - 重型导弹发射器
        - 鱼雷发射器
      - 名称: M2
        尺寸: M
        类型: 重型导弹座
        适配武器:
        - 重型导弹发射器
        - 鱼雷发射器
      - 名称: M3
        尺寸: M
        类型: 重型导弹座
        适配武器:
        - 重型导弹发射器
        - 鱼雷发射器
      船体加成:
      - 重型鱼雷伤害 +20%
      - 对装甲目标造成的最终伤害 +15%
      - 隐形模块持续时间 +25%
      - 静默潜伏状态下被发现概率显著降低
      装配减免:
      - 重型导弹与鱼雷武器 PG需求 -10%
      - 隐形模块 CPU需求 -20%
      推荐武器方案:
      - 3x 重型鱼雷或巡航导弹发射管
    特殊系统:
      名称: 迷雾II战术隐形力场发生器
      效果:
      - 能耗较低，适合长时间静默潜伏
      附加系统:
      - 名称: 雷霆指向性反物质破甲鱼雷
        效果:
        - 对装甲造成高密度破甲融毁
        - 对护盾杀伤低于标准鱼雷
    观星者需求:
      控制门槛:
        最低稳态增益: 3.0 TW/mV
        最低比特率: 300 TB/s
        最高精度误差: 1.8/1M
      超载门槛:
        最低爆发增益: 6.4 TW/mV
        需要技能: 工程 V
        规则:
        - 爆发增益不足时，不可超载鱼雷发射系统或隐形主动模块
        - 超载为 2 回合 1 次
        - 超载效果提高至原值的 150%
  跃迁充能: 0
  最大充能: 7
  跃迁消耗: 1
  </ship_def>
