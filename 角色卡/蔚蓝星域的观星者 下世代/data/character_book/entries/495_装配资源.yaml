keys: []
content: |-
  <装配资源>

  吨位mapping：
  护卫 - S
  驱逐 - M
  巡洋 - L
  战巡，战列，航母 - XL
  超级航母，泰坦 - T

  fitting_baselines:
    AI硬规则: |
      1. 每个机制都必须量化（数值化）。禁止只写“更强”“更快”“较高概率”而不给出明确数值。
      2. 每个随机机制都必须使用 `D100 <= x` 的格式描述触发概率。例如：`D100 <= 35 时发生护盾过载`。
      3. 装配判定必须明确计算 PG、CPU、炮位占用、装备槽位占用与剩余值。堆叠装备按每件装配要求乘以堆叠数量，不能只计算一次。
      4. 独立舰船档案的PG实值优先。战列舰白值须容纳全部主炮位的T1武器，并保留至少20%PG用于其他装配；L级基准按110PG核算。战巡可以因装配资源不足而必须取舍火力与生存模块。
      4. 模块效果写入变量时，必须尽量拆成明确字段，不要只保留模糊自然语言。
      5. 遗物火炮还必须校验文明与原生内部结构：光粒炮仅限漂泊集群船体且光子凝聚器完好；裂解射线（熵分解炮）要求先驱者船体或明确列出的ACX-00渡鸦级例外，且熵聚焦线路完好。渡鸦级因材料来自先驱者残骸并保留原生线路获得例外，不能因炮位或资源足够而跳过校验。

    FF:
      PG: 30
      CPU: 120
      H: 2
      L: 2
      典型挂点: 2-3S
    DD:
      PG: 70
      CPU: 220
      H: 3
      L: 3
      典型挂点: 4-6S
    SD:
      PG: 200
      CPU: 260
      H: 0
      L: 0
      典型挂点: 固定2L，且只能安装大型导弹或大型鱼雷
      硬限制: 隐形轰炸舰不得安装其他武器、舰载机中队或任何H/L模块
    CA:
      PG: 180
      CPU: 380
      H: 4
      L: 4
      典型挂点: 4-6M
    BC:
      PG: 480
      CPU: 520
      H: 6
      L: 6
      典型挂点: 5-7M 或 4M+1-2L
    BB:
      PG: 1100
      CPU: 750
      H: 6
      L: 6
      典型挂点: 4-8L
    CVL:
      PG: 830
      CPU: 850
      H: 6
      L: 6
      典型挂点: 0-2L + 1-2C
    CV:
      PG: 1650
      CPU: 1400
      H: 8
      L: 7
      典型挂点: 0-2XL + 1-5C + 0-1T（旗舰型，独立定义；工业旗舰最多3C）
    TT:
      PG: 4200
      CPU: 2800
      H: 8
      L: 7
      典型挂点: 4-6XL + 0-1T + 0-2C（旗舰型，独立定义）

    装备槽位上限:
      规则: 武器槽位数量和分布不受本规则影响；本上限只限制 H/L 装备槽位总数。
      FF: 4
      AF: 4
      DD: 6
      AD: 6
      SD: 0
      TD: 6
      CA: 8
      HAC: 8
      ESC: 8
      RC: 8
      BC: 12
      BB: 12
      BBV: 12
      CVL: 12
      CV: 15
      DN: 15
      CVT: 15
      TT: 15
      防御倾向分布: |
        护盾专精舰船拥有更多 H 槽与更少 L 槽；装甲专精舰船拥有更多 L 槽与更少 H 槽；均衡舰船接近对半分配。
        分配时必须先确定舰级上限，再在上限内调整 H/L 分布，不得用防御倾向突破总槽位。
        推荐分布：
        - 4槽：盾抗 3H1L；均衡 2H2L；甲抗 1H3L。
        - 6槽：盾抗 4H2L；均衡 3H3L；甲抗 2H4L。
        - 8槽：盾抗 5H3L；均衡 4H4L；甲抗 3H5L。
        - 12槽：盾抗 7H5L；均衡 6H6L；甲抗 5H7L。
        - 15槽：盾抗 9H6L；均衡 8H7L；甲抗 6H9L。

    类型修正:
      海军型: 不突破该舰级装备槽位上限；可将分布向主防御倾向偏移1槽，PG/CPU x1.4，挂点 +1同级
      特种型: 槽位总量不变但极端化分配，PG/CPU总量不变但一高一低
      高级型: 不突破该舰级装备槽位上限；可获得更优 H/L 分布或特殊船体能力，PG/CPU x1.6

    舰船装配结构: |
      每艘舰船都必须按以下结构记录装配信息：
      {
        "炮位配置": "3S1M",
        "装备槽位配置": "4H4L",
        "吨位": "M",
        "装配资源": {
          "PG": 0,
          "CPU": 0
        },
        "效果": {},
        "装备": {}
      }
      `炮位配置` 使用紧凑字符串记录武器挂点，例如 `3S1M2L`。
      参与遗物火炮装配的舰船必须显式保存 `文明` 与 `效果.内部结构`。集群填写 `文明: 漂泊集群`、`效果.内部结构.光子凝聚器: 完好`；先驱者填写 `文明: 先驱者`、`效果.内部结构.熵聚焦线路: 完好`。缺失字段或内部结构损毁/拆除均不满足装配条件；不能凭舰名、外观或引擎来源自动补全。
      渡鸦级依档案填写 `文明: 人类`、`船体型号: ACX-00渡鸦级`、`效果.内部结构.熵聚焦线路: 完好`，匹配裂解射线的例外舰型后允许装配；不用把其文明改写成先驱者。舰船自定义名称不是船体型号，普通人类舰改名为“渡鸦”不获得例外资格。
      `装备槽位配置` 使用紧凑字符串记录高功率与低功率槽位，例如 `4H4L`。H/L 总数不得超过 `装备槽位上限`。
      `装配资源.PG` 与 `装配资源.CPU` 只保存船体白值。已使用值与剩余值由UI按每件装备的装配要求乘以堆叠数量动态计算，不写入变量。
      舰船内置电子系统写入 `效果`，视为船体加成。所有可拆卸模块统一写入 `装备`。

    模块对象结构: |
      每个模块都必须按以下结构记录：
      {
        "品质": 1,
        "堆叠": "正整数，可选；缺省1，以下数值为每件值",
        "装配槽位": "可选数组；每件的实际槽位",
        "效果": {
          "效果1名称": "量化描述",
          "效果2名称": "量化描述"
        },
        "护盾": "int，可选，护盾扩展器提供的最大护盾量",
        "最大护盾上限": "非负int，可选，限制全部装备加成后的最终容量",
        "护盾装甲": "int，可选，护盾层固定减伤",
        "结构装甲": "int，可选，结构层固定减伤",
        "护盾DR": "str，可选，护盾百分比减伤",
        "结构DR": "str，可选，结构百分比减伤",
        "唯一组": "str，可选；钢板固定填写为钢板",
        "装配要求": "PG：0 | CPU：0 | 吨位：S | 炮位：1S | 装备槽位：无",
        "描述": "str"
      }
      `装配要求` 必须是字符串，同时写出 PG、CPU、吨位、炮位需求与装备槽位需求。
      文明专用遗物武器必须额外保存 `安装限定` 对象，包含 `船体文明` 和 `所需内部结构` 列表，可包含明确记载的 `例外舰型` 列表。光粒炮为 `{船体文明: 漂泊集群, 所需内部结构: [光子凝聚器]}`；裂解射线/熵分解炮为 `{船体文明: 先驱者, 所需内部结构: [熵聚焦线路], 例外舰型: [ACX-00渡鸦级]}`。该对象与普通装配要求同时校验，生成、转移或改装时不得丢弃；不得自行扩充例外舰型。
      不需要某类槽位时填写 `无`，不得省略字段。
      常规武器只消耗炮位挂点，不消耗 H/L 装备槽位；非武器模块按自身需求消耗 H/L 装备槽位。
      所有槽位需求统一使用数量在前、类型在后的写法，例如 `1S`、`2M`、`1H`、`1L`。
      挂点代码只允许 `S/M/L/XL/C/T`。`L` 为战列舰级火炮，`XL` 为旗舰级火炮，`C` 为航母舰载机中队槽位，`T` 为超级武器槽位。装备的 `吨位` 必须与所占用挂点一致。
      非武器模块的 `吨位` 只允许 `S/M/L/XL/N`。其中 `N` 为通用模块，可以安装到任意舰船；其余模块只能安装到同吨位舰船。
      常规无人机使用 `S/M/L` 常规炮位，分别对应轻型/中型/重型无人机，不得安装到 `C` 槽。
      `C` 槽是大型旗舰级舰载机库，只能安装舰载机中队；`1C = 1个舰载机中队`，无特殊说明时一个中队视为40架战斗机或轰炸机。普通航母CVL最多2C，工业旗舰最多3C（固定档案写明机库类别: 工业旗舰），超级航母CV/CVT最多5C；工业旗舰上限优先于CV舰级。泰坦辅助机库最多2C，死神级例外最多2C。上限不是额外赠送的炮位，实际数量仍取舰船固定档案；不得靠品质、模块、扩容或分拆中队增加C槽。1C对应1个标准满编40架的中队；相同中队可自动合并为堆叠记录，但按堆叠数占用同数量C槽，各字段保持每个中队的数值；编制与当前架数记录在该对象的效果中，不把40架拆成40件装备。伤害是满编中队每1dt总伤害，不再乘40；减员后乘当前架数/编制，当前架数限于0至编制。PG/CPU按完整机库消耗，不随减员下降；补机必须消耗实际库存。常规情况下只有 CVL/CV/CVT/TT 舰体可以拥有 C 槽。低于航母级的特殊舰必须在自身档案明确写出 `C槽例外: true` 才能拥有 C 槽；不得根据描述或用途自行添加例外。
      `T` 槽每艘舰船最多 1 个，只能安装超级武器。拥有 `T` 槽的舰船必须填写 `T槽种类`；超级武器也必须填写同名属性，且两者完全一致，并且必须属于同族/同技术谱系超级武器。禁止跨阵营、跨文明或跨技术体系混装超级武器。
      PG 与 CPU 允许填写负数。负数表示模块提供额外装配资源，例如：
      - 副反应堆：`PG：-20 | CPU：5 | 吨位：M | 炮位：无 | 装备槽位：1L`
      - 协处理器：`PG：2 | CPU：-15 | 吨位：N | 炮位：无 | 装备槽位：1H`
      提供额外 PG 或 CPU 的模块依然必须消耗至少一个 H/L 装备槽位，并遵守吨位限制。
      护盾扩展器使用 `护盾` 记录其提供的最大护盾量；护盾装甲模块使用 `护盾装甲`；装甲甲板与装甲硬化器使用 `结构装甲` 与 `结构DR`。禁止使用旧式 `额外护盾`、`额外装甲` 字段。
      钢板/装甲板必须填写 `唯一组: 钢板`。每艘舰船最多安装1套钢板；不同名称、品质、来源或吨位仍属于同一唯一组，不得叠装。

    模块效果填写规则: |
      - 武器模块至少写明：伤害、跟踪、射程。
      - 护盾/装甲模块至少写明：`护盾`、`护盾装甲`、`结构装甲`、`护盾DR`、`结构DR` 中实际提供的字段。
      - 电子战、推进、工程模块也必须量化，例如：
        - `锁定干扰概率: D100 <= 35`
        - `护盾回复: 120/轮`
        - `PG加成: +8`
        - `最大充能加成: +2`
      - 若模块带有触发式特效，必须写成 `D100 <= x`，并明确触发后的数值结果。

    注意事项: |
      护盾型舰船在同级槽位上限内提高 H 槽、减少 L 槽；装甲型反之。禁止通过防御倾向、船体类型或品质突破对应舰级的 H/L 总槽位上限。
      工程模块中"反应堆调控元件"可提供额外5%-15%基础PG。
      PG / CPU 已使用值与剩余值均由 EJS 根据装备的 `装配要求` 动态计算，AI 不得写入这些派生值。
      武器占用不得超过舰船的 `炮位配置`；非武器模块占用不得超过 `装备槽位配置`。
      战巡的炮位是可选安装位置，不保证全部满装。先累计武器PG/CPU，再为生存与工程模块留出预算；若资源不足，减少武器数量、降低武器规格/品质或牺牲生存装备，不得虚构减免或提高船体白值。例：6门T1重型集束激光需要630PG，超过PG540战巡的船体白值；减少至5门主炮消耗525PG，再加4门轻型脉冲激光12PG后仅余3PG，仍须为生存模块继续取舍。
      武器有 `安装限定` 时，先判断船体文明是否匹配或档案船体型号是否匹配明确的例外舰型，再核对所有所需内部结构是否完好；满足前一判定不能替代内部结构要求。光粒炮、裂解射线及其旧称武器即使漏写限定对象，也按上述规则（含渡鸦级的裂解射线例外）校验。原生内部结构不能作为普通H/L模块或转接器移植。
      装配校验必须统计 `唯一组`；同一舰船的 `装备` 中若已有 `唯一组: 钢板`，禁止再安装任何钢板/装甲板。
      SD 隐形轰炸舰的炮位固定为 `2L`、装备槽位固定为 `0H0L`；两个 L 槽都只能安装大型导弹或大型鱼雷，其他武器与所有非武器模块均禁止。
      非武器模块若不是 `吨位：N`，则其吨位必须与舰船吨位一致。
      PG 或 CPU 为负数的资源扩展模块不得填写 `装备槽位：无`。


  </装配资源>
