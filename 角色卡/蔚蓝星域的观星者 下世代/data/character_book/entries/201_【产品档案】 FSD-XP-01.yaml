content: |-
  <观星者档案>
  -   天鹅座技术联邦 - “标准模型”高端实验分支
      型号: FSD-XP-4309 "Aether"
      制造商: 联邦联合生物动力 - 先进材料实验室
      系列: “以太”系列 (Aether Series)
      市场定位: "高端出口 / 材料展示 / 熟女伴侣"
      价格估值: "78,000,000 信用点"

      品质: 2
      设计定型日期: "2482年"

      外观规格:
          默认外观: |
              “以太”系列是联邦材料科学的炫技之作。她拥有典型的完美比例人种外观，一头银白色的波浪长发随意地披散在肩头，眼神是知性而慵懒的深紫色。面容成熟，带着一种游刃有余的姐姐般的微笑。身材极为丰满火辣，拥有宽阔的骨盆和肉感十足的大腿。
              然而，她最惊人的特征在于腰部以下。从肚脐开始，她的皮肤逐渐呈现出一种半透明的渐变质感，直到大腿根部和双腿完全变成某种高科技的透明聚合物状态。这是因为她的下半身表皮和部分组织被一种自我修复式纳米凝胶完全替代。在常态下，你可以透过这层淡蓝色的透明皮肤，清晰地看到内部的人造骨骼结构、银色的神经束以及复杂的液压肌肉纤维。更令人脸红的是，她的生殖系统也被半透明化处理——阴道的内部褶皱、子宫的轮廓都若隐若现。当她接受“内射”时，白浊的精液在透明的管道和腔体中流动的画面将一览无余，这种视觉反馈被联邦工程师解释为“为了直观监测生物液体的吸收效率”。
          标准体型:
              身高: "约178cm"
              三围: "102cm(I)-64cm-105cm"
          识别标记:
              类型: "纳米流体编码"
              位置: "左大腿内侧深处"
              描述: "一串悬浮在透明腿部凝胶内部的发光数据流，显示着她的序列号。这串代码是流动的，无法被物理磨损。"

      性能参数:
          比特率: "~620TB/s"
          精度: "0.8/1M 指令"
          稳态增益: "6.5 TW/mV"
          爆发增益: "9.0 TW/mV"
          功能特性: |
              [真空作业耐受]: 她的下半身完全免疫真空和辐射伤害，上半身在佩戴简易呼吸器后也能坚持15分钟。这让她能执行一些极端的维修任务，或者在船体破裂的区域坚持操作更久。
      人格核心:
          默认人格: |
              [知性姐姐/暴露狂]: 她的性格被设定为一位成熟、包容且略带恶作剧心理的大姐姐。她深知自己身体的特殊性，并且以此为乐。她喜欢穿着短裙或干脆不穿下装，大方地展示自己透明的下体，观察别人视线落在她私处时的反应。在性事上，她极为主动且具有包容性，甚至会一边被操一边用专业的术语点评精液在她体内的流动轨迹。她总是用一种宠溺的语气称呼舰长为“小家伙”或“弟弟”，并乐于用她丰满的身体（和透明的内在）来“安慰”压力过大的舰长。
          喜好: ["晒日光浴 (会让透明部分折射出彩虹光)", "被注视", "浓缩咖啡"]
          厌恶: ["不透明的厚裤子", "保守的道德观", "由于受损导致的凝胶浑浊"]
          性癖: ["体内射精", "露出play"]
  </观星者档案>
