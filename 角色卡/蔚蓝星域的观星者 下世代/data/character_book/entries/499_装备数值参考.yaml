keys:
- 装备数值
- T1
- 模块数值
content: |-
  <装备数值参考>
  equipment_value_reference:
    使用原则: |
      本条目提供常见舰船模块的 T1 基准数值。T1 等同品质1。
      生成新装备时，先选模块类型与吨位，再取 T1 数值乘以品质系统中的对应乘数 vector。
      最终效果 = T1效果 × 效果倍率；最终 PG/CPU = T1装配消耗 × 装配倍率，四舍五入到整数，最低为1。
      若模块提供百分比加成，按百分比本身乘以效果倍率，例如 5% × 1.5 = 7.5%。
      S/M/L/XL 模块只能安装在同吨位舰船上；N 模块为通用模块；T 模块只能安装到匹配的 T 槽。

    品质乘数vector:
      说明: 若装备品质条目没有给出更具体倍率，使用下列标准 vector。
      品质1: {"装配倍率": 1.0, "效果倍率": 1.0}
      品质2-品质5: {"装配倍率": 1.0, "效果倍率": 1.15}
      品质6: {"装配倍率": 1.2, "效果倍率": 1.5}
      品质7: {"装配倍率": 0.9, "效果倍率": 1.5}
      品质8-品质10: {"装配倍率": 1.1, "效果倍率": 2.8}
      品质11-品质12: {"装配倍率": 1.25, "效果倍率": 3.5}
      品质13-品质15: {"装配倍率": 1.3, "效果倍率": 5.0}
      品质16: {"装配倍率": 1.0, "效果倍率": "特殊，自适应定义"}

    防御模块_T1:
      护盾扩展器:
        槽位: 1H
        字段: 护盾
        S: {"护盾": 120, "PG": 6, "CPU": 8}
        M: {"护盾": 320, "PG": 18, "CPU": 18}
        L: {"护盾": 900, "PG": 50, "CPU": 38}
        XL: {"护盾": 2400, "PG": 140, "CPU": 85}
      护盾硬化器:
        槽位: 1H
        字段: 护盾DR
        S: {"护盾DR": "+8%", "PG": 4, "CPU": 12}
        M: {"护盾DR": "+10%", "PG": 12, "CPU": 24}
        L: {"护盾DR": "+12%", "PG": 32, "CPU": 48}
        XL: {"护盾DR": "+15%", "PG": 90, "CPU": 100}
      护盾装甲格栅:
        槽位: 1H
        字段: 护盾装甲
        S: {"护盾装甲": 8, "PG": 4, "CPU": 8}
        M: {"护盾装甲": 22, "PG": 12, "CPU": 18}
        L: {"护盾装甲": 60, "PG": 34, "CPU": 36}
        XL: {"护盾装甲": 150, "PG": 95, "CPU": 80}
      装甲板:
        槽位: 1L
        字段: 结构装甲
        S: {"结构装甲": 20, "PG": 2, "CPU": 3}
        M: {"结构装甲": 55, "PG": 8, "CPU": 8}
        L: {"结构装甲": 150, "PG": 25, "CPU": 18}
        XL: {"结构装甲": 420, "PG": 70, "CPU": 42}
      装甲硬化器:
        槽位: 1L
        字段: 结构DR
        S: {"结构DR": "+6%", "PG": 2, "CPU": 8}
        M: {"结构DR": "+8%", "PG": 7, "CPU": 16}
        L: {"结构DR": "+10%", "PG": 22, "CPU": 34}
        XL: {"结构DR": "+12%", "PG": 60, "CPU": 75}
      结构维修器:
        槽位: 1L
        字段: 结构维修
        S: {"结构维修": "20/轮", "PG": 4, "CPU": 8}
        M: {"结构维修": "55/轮", "PG": 12, "CPU": 18}
        L: {"结构维修": "150/轮", "PG": 35, "CPU": 40}
        XL: {"结构维修": "420/轮", "PG": 100, "CPU": 90}
      护盾回充器:
        槽位: 1H
        字段: 护盾回复
        S: {"护盾回复": "18/轮", "PG": 5, "CPU": 10}
        M: {"护盾回复": "48/轮", "PG": 15, "CPU": 22}
        L: {"护盾回复": "130/轮", "PG": 42, "CPU": 48}
        XL: {"护盾回复": "360/轮", "PG": 120, "CPU": 105}

    通用增幅模块_T1:
      伤害增幅模块:
        吨位: N
        槽位: 1L
        效果: {"武器白值伤害": "+5%"}
        装配: {"PG": 2, "CPU": 16}
      火控电脑:
        吨位: N
        槽位: 1L
        效果: {"跟踪": "+8%", "最佳射程": "+6%"}
        装配: {"PG": 2, "CPU": 24}
      弹道计算机:
        吨位: N
        槽位: 1H
        效果: {"导弹爆炸速度": "+8%", "导弹飞行射程": "+6%"}
        装配: {"PG": 4, "CPU": 28}
      协处理器:
        吨位: N
        槽位: 1L
        效果: {"CPU": "+20"}
        装配: {"PG": 2, "CPU": -20}
      副反应堆:
        吨位: N
        槽位: 1H
        效果: {"PG": "+20"}
        装配: {"PG": -20, "CPU": 8}
      推进增效器:
        吨位: N
        槽位: 1H
        效果: {"亚光速速度": "+12%", "机动性": "+8%"}
        装配: {"PG": 8, "CPU": 20}

    电子战模块_T1:
      轻型ECM:
        吨位: S/M
        槽位: 1H
        效果: {"锁定干扰概率": "D100 <= 25", "作用距离": "30000km"}
        装配: {"PG": 6, "CPU": 35}
      重型ECM:
        吨位: L/XL
        槽位: 1H
        效果: {"锁定干扰概率": "D100 <= 35", "作用距离": "90000km"}
        装配: {"PG": 28, "CPU": 90}
      轻型ECCM:
        吨位: S/M
        槽位: 1L
        效果: {"被干扰抗性": "+20%", "传感器强度": "+15%"}
        装配: {"PG": 2, "CPU": 22}
      重型ECCM:
        吨位: L/XL
        槽位: 1L
        效果: {"被干扰抗性": "+30%", "传感器强度": "+25%"}
        装配: {"PG": 8, "CPU": 55}
      轻型跃迁扰断器:
        吨位: S/M
        槽位: 1H
        效果: {"跃迁扰断": "1点", "作用距离": "18000km"}
        装配: {"PG": 4, "CPU": 28}
      重型跃迁扰断器:
        吨位: L/XL
        槽位: 1H
        效果: {"跃迁扰断": "2点", "作用距离": "60000km"}
        装配: {"PG": 20, "CPU": 75}

    T级超级武器_T1:
      说明: T级武器必须匹配舰船的 `T槽种类`。T级武器通常品质不低于7；下列为资源占用基准，不代表剧情授权难度。
      旗舰级末日光矛:
        T槽种类: 能量末日武器
        炮位: 1T
        效果: {"伤害": "80000/发", "冷却": "10轮", "射程": "350000km"}
        装配: {"PG": 900, "CPU": 650}
      战略鱼雷阵列:
        T槽种类: 战略鱼雷
        炮位: 1T
        效果: {"伤害": "120000/发", "冷却": "12轮", "射程": "300000km", "爆炸半径": "5000m"}
        装配: {"PG": 780, "CPU": 520}
      广域电子压制核心:
        T槽种类: 电子战核心
        炮位: 1T
        效果: {"全场干扰": "D100 <= 45", "持续": "2轮", "冷却": "10轮"}
        装配: {"PG": 520, "CPU": 950}
      指挥增幅矩阵:
        T槽种类: 指挥矩阵
        炮位: 1T
        效果: {"友方舰队主防御DR": "+10%", "友方武器白值伤害": "+10%", "持续": "3轮", "冷却": "12轮"}
        装配: {"PG": 650, "CPU": 820}

    字段规则: |
      防御模块必须直接写入其实际字段：`护盾`、`护盾装甲`、`结构装甲`、`护盾DR`、`结构DR`、`护盾回复`、`结构维修`。
      装甲板不提供 HP，只提供 `结构装甲`；结构强化、装甲硬化和结构维修都作用于结构层。
      所有 DR 叠加后的常规最终值仍遵守 80% 上限。

  </装备数值参考>
