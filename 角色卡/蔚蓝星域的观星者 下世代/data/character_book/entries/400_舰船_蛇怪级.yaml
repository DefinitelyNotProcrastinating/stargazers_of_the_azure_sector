keys:
- 蛇怪级
content: |-
  <ship_def>
  “时刻注意目标的位置。”——辛迪加赏金猎人公会《行动手册》
  -   级别: 蛇怪级
  -   类型: 轻型航母 CVL
  -   价格: 4.8B
  -   形态: 舰体设计充满了模块化和不对称风格。核心是一个加长的航母舰体，一侧挂载着数个标准化的无人机库货柜模块，另一侧则加装了一个可展开的远程目标标记阵列。
  -   制造商: 泰坦重工 (无人机作战系统分部)
  -   静态配置文件:
      -   舰体全长: 2850米
      -   标准船员配置: 120人
      -   性能评级:
          -   装甲: 65000
          -   护盾: 65000
          -   机动性: 38
          -   火力输出: 38000 (无人机)
          -   回复量: 12000 (维修无人机)
      -   武器系统:
          -   主要系统: 10x MK-VII重型无人攻击机库（每组8架），可按需求安装无人攻击机
          -   次要系统: 4x MK-VI武装无人机挂架（每组8架）, 1x “石化凝视”远程目标标记阵列
          -   攻击射程: 180000 km (无人机作战半径) / 250000 km (标记有效距离)
      -   特殊系统:
          -   名称: “石化凝视”目标标记系统
          -   描述: 一套为配合量子传送鱼雷而设计的综合目标指示系统。激活后，“蛇怪”级会向单一目标投射一道高频锁定信号。该信号不仅能被友军轰炸机的火控系统接收，将目标的信号特征放大300%，极大提升锁定速度和抗干扰能力；更重要的是，它会在目标周围形成一个临时的微型时空信标。所有以该目标为攻击对象的友军鱼雷，在进行量子传送的终末阶段时，都会被这个信标所“吸引”，使其出跃迁的位置更接近目标，将鱼雷的最终命中率提升至少40%。
      -   观星者需求: 需要神经坚韧度较高的观星者，以长时间维持高强度目标标记信号的稳定输出。需要至少6TW/mV的稳态增益。比特率应当至少是460
  舰船单位模板:
    舰船类型: CVL
    每日补给消耗: 50
    吨位: XL
    驾驶员: ''
    是否旗舰: false
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 4
    跃迁消耗: 2
    制造商: 泰坦重工 (无人机作战系统分部)
    描述: 一套为配合量子传送鱼雷而设计的综合目标指示系统。激活后，“蛇怪”级会向单一目标投射一道高频锁定信号。该信号不仅能被友军轰炸机的火控系统接收，将目标的信号特征放大300%，极大提升锁定速度和抗干扰能力；更重要的是，它会在目标周围形成一个临时的微型时空信标。所有以该目标为攻击对象的友军鱼雷，在进行量子传送的终末阶段时，都会被这个信标所“吸引”，使其出跃迁的位置更接近目标，将鱼雷的最终命中率提升至少40%。
    炮位配置: 8C
    装备槽位配置: 6H6L
    船体护盾值: 4500
    船体结构值: 5400
    护盾值: 4500
    结构值: 5400
    装配资源:
      PG: 360
      CPU: 720
    效果:
      船体加成:
      - 依据舰级定位应用：轻型航母 CVL。
      装配减免: []
      内置电子系统:
        基础CPU: 内置标准舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置标准多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
    装备: {}

  </ship_def>
