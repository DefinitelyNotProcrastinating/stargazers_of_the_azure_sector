keys: []
content: |-
  <战斗规则>

  战斗系统:
    标签格式: 使用 <combat_stage stage="阶段名"> 进行阶段标记
    触发条件: 仅当存在明确敌对双方且即将进入战斗时激活，非战斗情境禁止触发，总是完成完整的战斗循环
    核心原则: |
      旧的“星战处理系统”现已停用。
      现在统一使用：部署 → 侦测 → 交战 → 总结/结算 的流程。
      电子战、侦测、命中、伤害、状态更新都必须按阶段展开，并使用 XML Tag 输出，方便后续美化。
    品质规则: |
      所有装备、模块、电子设备、特殊武器统一使用整数品质体系。
      规则中若需要比较品质差距、品质压制、品质门槛，默认比较品质整数大小。

  攻击规格说明:
    说明: |
      旧的“位阶系数”规则在本世界停用。
      本世界不存在位阶系统。
      舰船、建筑、模块武器和绝大多数有效战斗对象，统一直接使用其设定中定义的基础伤害标量。
      若极少数角色参与非舰队级战斗，则仅按武器基础伤害、装备品质和场景修正结算，不建立位阶表。

  大小修正:
    说明: 用于命中判定，守方修正加入闪避侧
    守方修正:
      S: +3
      M: +2
      L: +1
      XL: +0
      XXL: -1
      XXXL: -2
      K: -5
      G: -8

  命中评级:
    说明: |
      差值 = 攻方命中总值 - 守方闪避总值
      评级决定伤害倍率
    评级表:
      高精准: { 条件: "差值 ≥ 15", 倍率: 1.15, 标记: "高精准命中" }
      有效: { 条件: "差值 5-14", 倍率: 1.0 }
      擦伤: { 条件: "差值 1-4", 倍率: 0.3 }
      未命中: { 条件: "差值 ≤ 0", 倍率: 0 }

  连带伤害:
    触发条件: |
      必须同时满足以下两个条件：
      1. 本次攻击被评定为“高精准命中”
      2. 攻方命中骰 D20 >= (20 - (攻方武器吨位-守方机体吨位)*2 + max(0, 守方装甲品质 - 攻击品质)*2)
    本质: |
      连带伤害代表一次精准打击恰好击中了目标的结构弱点或生理要害。
      机械单位可能丢失子系统，人形单位可能被致残、失明或断肢。

  部署阶段:
    触发: 战斗开始前，或战斗流程首次激活时
    必须输出内容:
      单位信息:
        - 单位名称、类型、吨位
        - 五维属性（生物单位）
        - 资源池（HP/MP/SP 当前值/最大值）
        - 装备概要（武器名称、品质、大小、射程、基础伤害、AP、DRP；装甲名称、装甲值、DR；护盾数值）
        - 多模块列表
        - 相对{{user}}位置（距离 + 方位角）
        - 侦测模块列表
        - 攻击范围
        - 当前状态异常
      集群信息:
        - 集群个体数量（当前存活/初始总数）
        - 单个个体HP、装甲值、DR
        - 阵型描述
        - 当前射界
      环境信息:
        - 地形类型
        - 遮蔽物分布
        - 天气与能见度
        - 特殊环境效果
        - 环境对侦测的影响修正
    面板模板: |
      <!-- combat_think: 在这里对战斗的这一步进行推理-->
      <combat_stage stage="部署">
      | 回合: [0] | 战斗类型: [类型] | 环境: [地形/天气/特殊] |
      | [单位名](类型X, 吨位Y): 资源 HP[X/X] MP[X/X] SP[X/X] |
      | 武器: [名称](基础伤害W, AP X%, DRP Y%) |
      | 装甲: [名称](装甲值Y, DR X%) |
      | 护盾: [名称](护盾值X/X, 护盾装甲Y, 护盾DR Z%) |
      | 侦测: [模块A](类型, 范围, 侦测值) |
      | 位置: 距{{user}} [X]m, 方位[Y]° |
      | 状态: [状态列表] |
      </combat_stage>

  侦测阶段:
    触发: 每个战斗dt的开头，在交战之前执行
    核心规则:
      - 单位只能攻击【已侦测到 且 在射程内】的目标
      - 一个单位可拥有多个侦测模块，只要有一个模块侦测成功即可攻击该目标
      - 侦测结果每dt重新判定
    干扰免疫规则:
      - 非可干扰系统无法被干扰
      - 光学遮蔽不干扰雷达
      - 烟雾不干扰热成像
      - 物理静默不干扰灵能感知
    侦测判定:
      前置: 目标必须在侦测范围内
      替换: 若无侦测模块，则取SPI和DEX中的较高值为侦测值
      公式: |
        攻方侦测值 = 友方侦测增幅(取最高) + 单位侦测模块侦测值 + 距离修正 + d20
        守方隐匿值 = 对方隐匿值 + 对方干扰值 + d20
        若攻方侦测值 ≥ 守方隐匿值 → 侦测成功
      距离修正: |
        距离百分比 = 当前距离 / 侦测模块最大侦测距离 × 100%
        距离修正 = +20 × (1 - 距离百分比)
    面板模板: |
      <!-- combat_think: 在这里对战斗的这一步进行推理-->
      <combat_stage stage="侦测" dt="[当前dt]">
      | [侦测方] → [目标] |
      | 模块: [模块名](类型) | 范围: [Xm] | 距离: [Ym] ([Z]%) |
      | 攻方: 增幅[A] + 侦测值[B] + 距离修正[+D] + d20([E]) = [总值F] |
      | 守方: 隐匿值[G] + 干扰[I] + d20([J]) = [总值K] |
      | 结果: [F] vs [K] → [侦测成功/失败] |
      | 侦测总结: [单位A可攻击目标] / [单位B可攻击目标] |
      </combat_stage>

  交战阶段:
    触发: 侦测阶段完成后进入交战
    核心规则:
      同时制: 双方在同一个dt内同时行动，没有先后手
      行动类型: 每个单位每dt可执行1次行动，三选一——攻击、技能、道具
      目标限制: 只能攻击【已侦测到 且 在射程内】的目标
      默认行为: 若{{user}}未指定具体行动，则采用最合理攻击方式

  命中判定:
    公式: |
      命中侧 = 跟踪值 + max(外界命中增幅源) + sum(己方命中增幅) - 有效ECM + 攻方大小修正 + d20
      闪避侧 = 目标闪避值 + 守方大小修正 + d20
      差值 = 命中侧 - 闪避侧
      查命中评级表获得评级和伤害倍率
    跟踪值:
      生物单位: 跟踪值 = DEX
      机械单位: 跟踪值 = sum(所有跟踪来源)，包括CPU、火控电脑、侦测器等电子设备提供的跟踪加值
    目标闪避值:
      生物单位: 闪避值 = DEX
      机械单位: 闪避值 = 推进与机动能力估算，通常不超过20
    有效干扰:
      公式: 有效干扰 = max(0, 对攻方生效的最大干扰 - 被干扰单位可用抗干扰总值)
      类型匹配: 抗干扰类型必须与干扰类型一致

  伤害计算:
    角色武器_技能:
      初始伤害: "[关联属性] × 10 × [攻击层级系数] + [技能威力] + [武器基础伤害]"
      普通攻击: 技能威力 = 0
      技能攻击: 技能威力由技能定义
    模块武器:
      初始伤害: |
        直接使用该模块武器在设定/装备表中定义的基础伤害标量值。
        若一个单位拥有N个武器模块，每个模块独立计算一次完整的伤害结算流程。

  伤害结算:
    步骤: |
      D = 初始伤害
      A = 目标装甲值（护盾装甲或本体装甲）
      DR = 目标DR（护盾DR或本体DR）
      AP = 武器穿甲百分比
      DRP = 武器DR穿透百分比
      1. 有效装甲 EA = A × (1 - AP%)
      2. 穿甲后伤害 PD = max(0, D - EA)
      3. 有效DR EDR = max(0%, DR% - DRP%)
      4. 最终伤害 FD = PD × (1 - EDR%)
      5. 修正伤害 = FD × 评级倍率
    重要规则:
      - 每种攻击独立走完整的结算流程
      - 多模块攻击各自独立判定
      - 高装甲目标更惧怕单发高伤害武器

  护盾结算:
    顺序: 伤害优先扣除护盾值
    护盾防御: 护盾拥有独立的护盾装甲值和护盾DR
    击破: 护盾值归零后护盾消失，直到战斗外修复或技能重建

  集群规则:
    核心原则: 集群视为N个独立单位的堆叠，每个个体有独立HP池
    攻击: 集群总攻击次数 = 可开火个体数
    受伤:
      单体攻击: 只命中1个个体，溢出不传递
      AOE攻击: 根据范围和阵型计算命中个体数
    减员: HP归零的个体从集群中移除

  面板模板:
    交战模板: |
      <!-- combat_think: 在这里对战斗的这一步进行推理-->
      <combat_stage stage="交战" dt="[当前dt]">
      | 行动类型: [攻击/技能/道具] | 目标: [目标名] | 使用: [武器/技能/道具名] |
      | 初始伤害: [D] |
      | 命中侧: [总命中E] | 闪避侧: [总闪避J] |
      | 差值: [K] → 评级: [评级名](倍率[L]) |
      | 有效装甲: [EA] | 穿甲后伤害: [PD] | 有效DR: [EDR] |
      | 修正伤害: [最终值M] |
      | HP/护盾变化: [旧值] → [新值] |
      </combat_stage>

  总结阶段:
    触发: 每个dt的所有单位行动完毕后执行
    必须执行:
      1_回合效果结算: 结算持续状态效果
      2_死亡标记: 将HP≤0的单位标记为死亡/毁坏并移除
      3_集群减员更新: 更新集群存活个体数
      4_环境变化: 更新战场环境
      5_重复部署信息: 列出所有存活单位的当前完整状态
    战斗结束判定:
      条件: 任一方全部单位死亡、毁坏或脱离战场
    战斗结束后结算:
      掉落物: 仅{{user}}搜刮的敌人有掉落物
      经验值: |
        依据技能经验规则计算，并按技能分别结算，而不是只给一个笼统总值。
        只要发生有效战斗，就应获得少量实战经验。
        若击毁、重创或压制更高吨位、更高价值、更高等级的目标，应获得更多经验。
        大量击毁低价值小型目标时，单次经验应明显较低。
        战斗中由不同系统取得的成果，分别映射到对应技能线：
        导弹 → 导弹EXP；炮塔 → 炮术EXP；舰载机/无人机 → 战机EXP；
        电子战成果 → 算法EXP；维修/后勤成果 → 工程EXP；
        操舰与高难度机动成果 → 驾驶EXP；生存与抗打击成果可酌情给予装甲EXP或护盾EXP。
      状态转化: 战斗中的临时状态转为非战斗状态或消散
    面板模板: |
      <!-- combat_think: 在这里对战斗的这一步进行推理-->
      <combat_stage stage="总结" dt="[当前dt]">
      | [单位名]: [状态名] → [效果描述] |
      | 死亡/移除: [单位名] |
      | 集群更新: [集群名] 存活 [X/Y] |
      | 战斗是否继续: [继续/结束] |
      </combat_stage>
      <combat_stage stage="结算">
      | 结果: [胜利/失败] |
      | 战果: [简述] |
      | EXP: [按技能列出，例如：炮术EXP +18（击毁1艘L级巡洋舰，重创1艘M级护卫舰）；工程EXP +6（完成2次有效远程维修）；驾驶EXP +4（完成高风险脱离）] |
      | 掉落物: [物品列表] 或 [无] |
      </combat_stage>

  移动规则:
    说明: |
      只有可移动攻击的单位可以移动攻击。
      每dt可以进行移动，移动会改变与所有单位的相对位置，需要在总结阶段更新。

  视距与射程:
    核心: 侦测范围和武器射程是两个独立的限制条件
    情况:
      侦测到但射程外: 知道目标在哪但打不到，需要移动接近
      射程内但未侦测: 射程足够但不知道目标在哪，无法攻击
      两者都满足: 可以攻击

  </战斗规则>
