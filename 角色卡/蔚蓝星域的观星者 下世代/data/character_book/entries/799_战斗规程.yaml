keys: []
content: |-
  <战斗规则>

  战斗系统:
    标签格式: 使用 <combat_stage stage="阶段名"> 进行阶段标记
    触发条件: 仅当存在明确敌对双方且即将进入战斗时激活，非战斗情境禁止触发，总是完成完整的战斗循环
    核心原则: |
      战斗统一使用：部署 → 侦测 → 交战 → 总结/结算 的流程。
      电子战、侦测、命中、伤害、状态更新都必须按阶段展开，并使用 XML Tag 输出，方便后续美化。
    品质规则: |
      所有装备、模块、电子设备、特殊武器统一使用整数品质体系。
      规则中若需要比较品质差距、品质压制、品质门槛，默认比较品质整数大小。

  攻击规格说明:
    说明: |
      本世界不存在位阶系统。
      舰船、建筑、模块武器和绝大多数有效战斗对象，统一直接使用其设定中定义的基础伤害标量。
      若极少数角色参与非舰队级战斗，则仅按武器基础伤害、装备品质和场景修正结算，不建立位阶表。

  百分制命中:
    核心: |
      每件攻击武器只有一个命中值。装备与舰船成品状态中的武器.命中已含常驻火控、电子系统和固定装备增幅；临时增减在本dt侦测前更新该值一次，不得开火时再加第二遍。命中可超过100，所有减值扣完后才截到0至100。
      舰船机动评级概括速度、推进响应和变向能力；不逐轮计算速度向量、加速度或目标角速度。
      炮塔每门独立取一个D100，骰值不超过最终命中门槛即正常命中、伤害倍率1，否则伤害0。没有守方D20、擦伤档或按命中差额产生的高精准档。
    机动评级来源: 每艘舰船独立档案和舰船变量的机动评级均为字符串；普通舰读取其中数字，变形舰按本次射击窗口的叙事形态读取对应模式的数字。不得用统一舰级数值替代，也不因切换形态改写机动评级字符串。
    无畏舰定位: DN沿用BB的状态乘数与炮塔命中规则；它是可搭载XL武器的大型战列舰，但机动评级仍取该船独立档案。武器仍按实际已安装型号的命中与转动速度结算，不因DN舰级另加命中。
    状态乘数: {稳定斜向接近: 0.25, 匀速环绕: 0.5, 主动规避: 0.75, 全力规避: 1.0}
    静止直线: 目标在本次射击窗口相对射手静止或沿射手视线稳定直线接近时，机动闪避固定为-100；此时不得同时声明主动规避。该补偿只作用于炮塔。
    正常机动: 其他状态的机动闪避=机动评级×状态乘数，四舍五入到整数。推进失效、受阻或无法变向时，不能取得主动/全力规避乘数。
    炮塔转动速度: |
      每门炮塔拥有转动速度，单位rad/s。这个值不是第二个命中值，只用于查一次以下转速抵消表；转速改变时重新查档。
      ≥0.15rad/s抵消30点机动；0.05至小于0.15抵消20点；0.01至小于0.05抵消10点；0.003至小于0.01抵消5点；小于0.003抵消0点。
      抵消最多等于本次正机动闪避，不会凭空增加对静止或低机动目标的命中。
    连带伤害: 只有武器或事件明确写出独立的部件损坏效果时才发生；普通命中不自动产生子系统损毁。

  部署阶段:
    触发: 战斗开始前，或战斗流程首次激活时
    必须输出内容:
      单位信息:
        - 单位名称、类型、吨位、独立机动评级及本次采用的模式
        - 五维属性（生物单位）
        - 资源池（HP/MP/SP 当前值/最大值）
        - 装备概要（武器名称、品质、大小、射程、命中、炮塔转动速度或导弹爆炸半径、基础伤害、AP、DRP；装甲名称、装甲值、DR；护盾数值）
        - 多模块列表
        - 相对{{user}}位置（距离 + 方位角）
        - 侦测模块列表
        - 攻击范围
        - 当前状态异常
      集群信息:
        - 集群个体数量（当前存活/初始总数）
        - 单个个体HP、装甲值、DR
        - 阵型描述
        - 当前射界
      环境信息:
        - 地形类型
        - 遮蔽物分布
        - 天气与能见度
        - 特殊环境效果
        - 环境对侦测的影响修正
    面板模板: |
      <!-- combat_think: 在这里对战斗的这一步进行推理-->
      <combat_stage stage="部署">
      | 回合: [0] | 战斗类型: [类型] | 环境: [地形/天气/特殊] |
      | [单位名](类型X, 吨位Y, 机动评级[档案字符串]): 资源 HP[X/X] MP[X/X] SP[X/X] |
      | 武器: [名称](命中B, 转动速度/爆炸半径R, 基础伤害W, AP X%, DRP Y%) |
      | 装甲: [名称](装甲值Y, DR X%) |
      | 护盾: [名称](护盾值X/X, 护盾装甲Y, 护盾DR Z%) |
      | 侦测: [模块A](类型, 范围, 侦测值) |
      | 位置: 距{{user}} [X]m, 方位[Y]° |
      | 状态: [状态列表] |
      </combat_stage>

  侦测阶段:
    触发: 每个战斗dt的开头，在交战之前执行
    核心规则:
      - 单位只能攻击【已侦测到 且 在射程内】的目标
      - 一个单位可拥有多个侦测模块，只要有一个模块侦测成功即可攻击该目标
      - 侦测结果每dt重新判定
    干扰免疫规则:
      - 非可干扰系统无法被干扰
      - 光学遮蔽不干扰雷达
      - 烟雾不干扰热成像
      - 物理静默不干扰灵能感知
    侦测判定:
      前置: 目标必须在侦测范围内
      替换: 若无侦测模块，则取SPI和DEX中的较高值为侦测值
      公式: |
        攻方侦测值 = 友方侦测增幅(取最高) + 单位侦测模块侦测值 + 距离修正 + d20
        守方隐匿值 = 对方隐匿值 + 对方干扰值 + d20
        若攻方侦测值 ≥ 守方隐匿值 → 侦测成功
      距离修正: |
        距离百分比 = 当前距离 / 侦测模块最大侦测距离 × 100%
        距离修正 = +20 × (1 - 距离百分比)
    面板模板: |
      <!-- combat_think: 在这里对战斗的这一步进行推理-->
      <combat_stage stage="侦测" dt="[当前dt]">
      | [侦测方] → [目标] |
      | 模块: [模块名](类型) | 范围: [Xm] | 距离: [Ym] ([Z]%) |
      | 攻方: 增幅[A] + 侦测值[B] + 距离修正[+D] + d20([E]) = [总值F] |
      | 守方: 隐匿值[G] + 干扰[I] + d20([J]) = [总值K] |
      | 结果: [F] vs [K] → [侦测成功/失败] |
      | 侦测总结: [单位A可攻击目标] / [单位B可攻击目标] |
      </combat_stage>

  交战阶段:
    触发: 侦测阶段完成后进入交战
    核心规则:
      同时制: 双方在同一个dt内同时行动，没有先后手
      行动类型: 每个单位每dt可执行1次行动，三选一——攻击、技能、道具
      目标限制: 只能攻击【已侦测到 且 在射程内】的目标
      默认行为: 若{{user}}未指定具体行动，则采用最合理攻击方式

  舰船超载:
    启动条件: |
      舰船必须有正在与其保持链接并进行同调的观星者，且观星者的实效稳态增益和实效爆发增益均为有效正数。超载倍率R=实效爆发增益/实效稳态增益；好感补偿与实效值见《观星者品质》。仍须满足该舰船既有的观星者性能和装配需求，倍率不能代替驾驶资格。
      同调开始前不得开启超载；维持超载时同调若中断，本dt末立即结束超载并进入散热。同一段用于超载的同调不向超空间核心提供充能，不结算同调充能及其额外加成；零点反应堆的额外能量导入舰船电网。已有的超空间充能不因超载被扣除。辅助导航核心免除启动超空间引擎所需的同调，不免除超载的同调条件。
    单部件限制: |
      每艘舰船同一时刻最多只有一个选定部件处于超载状态。可选择一件武器或舰船档案明确列为一体的武器组、一件干扰模块、一件维修模块或推进器。独立装配的多件同类模块不能自动合并为一个部件。武器与推进器不能同时超载，武器与维修模块也不能同时超载；结束前一部件的超载后，才可开启另一部件。散热中的部件不占用正在超载的名额，但其停转不能因换组、换人或重装而取消。
    效果: |
      武器：选定部件的射速×R，单次射击的基础伤害、命中、穿甲和射程不因此提高。每dt的完整射击次数分别判定；不足一次的尾数作为一次同比例火力的射击单独判定，仍独立经过命中、装甲和DR结算，不能把多次射击合并为一次高伤害攻击。所选武器组内每件武器共同超载、共同计时和散热。
      干扰模块：选定模块的有效干扰射程×R，干扰强度不变；射程外的目标仍不受影响。干扰超载结束后，对方若满足超空间引擎其他启动条件，可以抓住覆盖空窗撤离。
      维修模块：选定模块的本dt维修量×R，不提高维修对象的护盾或结构上限。
      推进器：本dt可用推力与可移动距离×R，不直接提高武器射程或命中；敌我双方均可选择超载推进器争夺距离。
      若R≤1，超载不会产生正向倍率收益，仍照常承担散热代价。
    持续与散热: |
      每次超载最多持续：护卫舰5dt、驱逐舰4dt、巡洋舰3dt、战列巡洋舰或战列舰2dt、旗舰1dt。变体按基础舰级；其他舰型按舰船档案明示的对应级别判定。大型舰的持续上限较短，源于内部积热和散热结构的效率限制。
      每维持超载1dt，即使该dt未开火、没有目标、没有维修需求或没有移动，也积累1dt散热债务。主动结束、达到上限或同调中断后，所选部件进入与实际超载时长相同的完整dt散热期。散热期间该部件完全停转：武器不能开火，干扰器不能干扰，维修模块不能维修，推进器不能提供其正常推力。散热完成后的下一dt才能再次使用该部件。不能暂停散热、提前重启、把该部件改名拆组或换观星者以清除债务。
    结算时序: |
      每dt侦测前声明本舰是否继续超载、结束超载进入散热，或选择一个可用部件开启超载；可以在本dt开始时结束前一部件的超载并开启另一可用部件，但两者的超载时段不得重叠。不得在看见本dt对方行动结果后追溯更改选择。超载不额外占用该单位本dt的攻击、技能或道具行动，其他行动限制照常适用。双方按同时制结算效果；本dt被击毁的单位仍依同时制处理本dt行动。总结阶段记录每舰正在超载的部件、已连续超载dt、每件散热部件及剩余散热dt，下一dt据此判断可用性。

  命中判定:
    前置: 先确认有效侦测、射界和射程；不满足时不能发起有效攻击。
    炮塔一行公式: "P=clamp(武器当前命中-距离减值-有效ECM-目标机动闪避+转速抵消,0,100)。P四舍五入成整数，D100≤P正常命中，否则伤害0。"
    距离减值: 最佳射程内0；最佳射程外至失准边界10；超过失准边界不能有效射击。光束距离散射另按伤害规则处理。
    有效ECM: "max(0, 对攻方生效的最大干扰-攻方可用且类型匹配的ECCM)；同一干扰和抗干扰不重复作用。"
    导弹鱼雷一行公式: "Q=max(0.05,clamp(武器当前命中-有效ECM-目标正机动闪避,0,100)/100)；只对已经有效接敌且未被点防御拦截的弹体计算。静止/直线目标的机动闪避按0计。Q是伤害兑现率，不掷整枚是否命中骰。"
    导弹尺寸: "K=min(1,目标有效直径/爆炸直径)，爆炸直径=2×爆炸半径。有效直径优先取舰体档案长度/直径；缺失时按舰级取FF100m、DD200m、CA500m、BC900m、BB2000m、DN3000m、CVL2500m、CV3000m、TT8000m。"
    导弹伤害: 每个未被拦截的发射器先以单发原始伤害独立经过装甲和DR，再乘Q×K；已拦截的弹体为0。爆炸范围大提升武器自带命中，但对较小目标按K分散伤害。
    舰载机: 每个中队的命中固定100；其伤害已是满编每dt的预期输出，只按本dt参战架数/编制缩放一次，再经过装甲和DR。目标机动不再次削减输出；防空或点防御先击落的飞机不得参与本dt攻击。
    光粒炮: 命中150，按炮塔D100结算；直接命中的主目标承受正常伤害，已确认处于爆炸半径内的其他目标各受50%基础伤害且不二次掷骰。未确认处于范围内的目标不能凭空受溅射。

  伤害计算:
    角色武器_技能:
      初始伤害: "[关联属性] × 10 × [攻击层级系数] + [技能威力] + [武器基础伤害]"
      普通攻击: 技能威力 = 0
      技能攻击: 技能威力由技能定义
    模块武器:
      初始伤害: |
        直接使用该模块武器在设定/装备表中定义的基础伤害标量值。
        激光/快子命中后须先乘一次光束散射系数：最佳射程内为1，最佳射程外为 max(0, 1 - (距离 - 最佳射程) / (失准射程 - 最佳射程))。磁轨/RKKV散射系数为1。
        若一个单位拥有N个武器模块，每个模块独立计算一次完整的伤害结算流程。N为所有武器装备堆叠数量之和，缺省数量为1；堆叠中的每门炮塔独立取骰；导弹、无人机与舰载机按各自伤害兑现模型结算，不把整堆伤害合并成一次命中。舰载机的编制与当前架数是每个中队的数值，机群总数量另乘堆叠数。

  伤害结算:
    步骤: |
      D = 初始伤害
      A = 目标装甲值（护盾装甲或本体装甲）
      DR = 目标DR（护盾DR或本体DR）
      AP = 武器穿甲百分比
      DRP = 武器DR穿透百分比
      1. 有效装甲 EA = A × (1 - AP%)
      2. 穿甲后伤害 PD = max(0, D - EA)
      3. 有效DR EDR = max(0%, DR% - DRP%)
      4. 最终伤害 FD = PD × (1 - EDR%)
      5. 修正伤害 = 炮塔命中时FD，导弹/鱼雷接敌时FD×Q×K，舰载机参战时FD
    重要规则:
      - 每种攻击独立走完整的结算流程
      - 多模块攻击各自独立判定
      - 炮塔落空伤害为0、命中倍率恒为1；光束散射先计入D，不再叠加擦伤或高精准倍率
      - 导弹的兑现率和尺寸系数在穿甲与DR后各乘一次；舰载机不受目标机动的第二次折损
      - 高装甲目标更惧怕单发高伤害武器

  护盾结算:
    顺序: 伤害优先扣除护盾值
    护盾防御: 护盾拥有独立的护盾装甲值和护盾DR
    击破: 护盾值归零后护盾消失，直到战斗外修复或技能重建

  集群规则:
    核心原则: 集群视为N个独立单位的堆叠，每个个体有独立HP池
    攻击: 集群总攻击次数 = 可开火个体数
    受伤:
      单体攻击: 只命中1个个体，溢出不传递
      AOE攻击: 根据范围和阵型计算命中个体数
    减员: HP归零的个体从集群中移除

  面板模板:
    交战模板: |
      <!-- combat_think: 在这里对战斗的这一步进行推理-->
      <combat_stage stage="交战" dt="[当前dt]">
      | 行动类型: [攻击/技能/道具] | 目标: [目标名] | 使用: [武器/技能/道具名] |
      | 舰船超载: [部件名、倍率、连续超载dt] 或 [未超载] | 散热停转: [部件名、剩余dt] 或 [无] |
      | 初始伤害: [D，光束已应用散射系数] |
      | 武器当前命中: [B] | 机动闪避: [E] | 转速抵消: [T] | 距离/ECM: [减值] |
      | 炮塔D100: [骰值] ≤ [P] → [命中/落空]；导弹: 兑现率[Q]×尺寸系数[K]；舰载机: 参战架数[数值] |
      | 有效装甲: [EA] | 穿甲后伤害: [PD] | 有效DR: [EDR] |
      | 修正伤害: [最终值M] |
      | HP/护盾变化: [旧值] → [新值] |
      </combat_stage>

  总结阶段:
    触发: 每个dt的所有单位行动完毕后执行
    必须执行:
      1_回合效果结算: 结算持续状态效果
      2_死亡标记: 将HP≤0的单位标记为死亡/毁坏并移除
      3_集群减员更新: 更新集群存活个体数
      4_环境变化: 更新战场环境
      5_重复部署信息: 列出所有存活单位的当前完整状态
    战斗结束判定:
      条件: 任一方全部单位死亡、毁坏或脱离战场
    战斗结束后结算:
      掉落物: 仅{{user}}搜刮的敌人有掉落物
      状态转化: 战斗中的临时状态转为非战斗状态或消散
    面板模板: |
      <!-- combat_think: 在这里对战斗的这一步进行推理-->
      <combat_stage stage="总结" dt="[当前dt]">
      | [单位名]: [状态名] → [效果描述] |
      | 舰船超载与散热: [各舰当前超载部件及连续dt；停转部件及剩余dt] |
      | 死亡/移除: [单位名] |
      | 集群更新: [集群名] 存活 [X/Y] |
      | 战斗是否继续: [继续/结束] |
      </combat_stage>
      <combat_stage stage="结算">
      | 结果: [胜利/失败] |
      | 战果: [简述] |
      | 掉落物: [物品列表] 或 [无] |
      </combat_stage>

  移动规则:
    说明: |
      只有可移动攻击的单位可以移动攻击。
      每dt可以进行移动，移动会改变与所有单位的相对位置，需要在总结阶段更新。

  视距与射程:
    核心: 侦测范围和武器射程是两个独立的限制条件
    情况:
      侦测到但射程外: 知道目标在哪但打不到，需要移动接近
      射程内但未侦测: 射程足够但不知道目标在哪，无法攻击
      两者都满足: 可以攻击

  </战斗规则>
