content: |-
  <ship_def>
  级别: 盾卫级
  舰船类型: AD
  舰种: 屏卫驱逐舰
  舰体类别: 高级型
  价格: 39M
  制造商: 帝国海军设计局
  舰体描述: 继承了帝国舰船一贯的威严风格，船体修长而优雅，呈矛头状。舰身两侧安装了多组水晶状的聚焦透镜阵列，在激活时会发出深红色的光芒。
  静态档案:
    规格:
      舰体全长: 245米
      标准船员配置: 5人
    性能评级:
      装甲: 1600
      护盾: 2200
      机动性: 65
      火力输出: 800
    装配:
      装配资源:
        PG: 124
        CPU: 405
      槽位:
        高能: 7
        低能: 5
      武器座:
      - 名称: S1
        尺寸: S
        类型: 拦截激光座
        适配武器:
        - 脉冲激光
        - 集束激光
      - 名称: S2
        尺寸: S
        类型: 拦截激光座
        适配武器:
        - 脉冲激光
        - 集束激光
      - 名称: S3
        尺寸: S
        类型: 拦截激光座
        适配武器:
        - 脉冲激光
        - 集束激光
      - 名称: S4
        尺寸: S
        类型: 拦截激光座
        适配武器:
        - 脉冲激光
        - 集束激光
      - 名称: S5
        尺寸: S
        类型: 拦截激光座
        适配武器:
        - 脉冲激光
        - 集束激光
      - 名称: S6
        尺寸: S
        类型: 拦截激光座
        适配武器:
        - 脉冲激光
        - 集束激光
      船体加成:
      - 小型脉冲激光伤害 +20%
      - 小型激光锁定速度 +20%
      - 激光有效射程 +20%
      - 对导弹、鱼雷与战机目标的跟踪修正 +30%
      装配减免:
      - 小型能量武器 PG需求 -1
      - 火控与散热模块 CPU需求 -15%
      推荐武器方案:
      - 6x 战术拦截激光阵列
    特殊系统:
      名称: 神圣审判火控协议
      效果:
      - 激活后开火速率、锁定速度和有效射程提升 30%
      - 用于瞬时清空大片空域
    观星者需求:
      控制门槛:
        最低稳态增益: 3.4 TW/mV
        最低比特率: 340 TB/s
        最高精度误差: 1.2/1M
      超载门槛:
        最低爆发增益: 6.8 TW/mV
        需要技能: 工程 V
        规则:
        - 爆发增益不足时，不可启动神圣审判火控协议
        - 超载为 2 回合 1 次
        - 超载效果提高至原值的 150%
      接口要求: 神经反应速度与指令精度要求较高
  跃迁充能: 0
  最大充能: 7
  跃迁消耗: 1
  </ship_def>
