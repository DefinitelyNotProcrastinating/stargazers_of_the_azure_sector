content: |-
  <工业基础资源>
  # 工业系统第一阶段：统一库存、固定日产与自动结算

  当前范围:
    启用资源: [信用点, 矿物, 食物, 金属, 补给]
    暂不启用: [工时, 科研]
    暂不启用机制: [输出乘数, 均值, 标准差, 随机波动, 项目推进]

  资源定义:
    信用点: 通用支付与结算单位，可作为建筑维护费、生产投入或产出。
    矿物: 采掘得到的原始工业资源，主要用于冶炼金属。
    食物: 农业与生物生产得到的基础资源，可与金属共同制造补给。
    金属: 由矿物冶炼得到的工业材料，可与食物共同制造补给。
    补给: 约等于一个标准集装箱的综合后勤物资，用于舰船和建筑维护，也可作为生产投入。

  基础产业链:
    - 一级生产设施消耗补给，固定产出矿物和/或食物。
    - 冶炼设施消耗矿物，固定产出金属。
    - 补给制造设施同时消耗金属与食物，固定产出补给。
    - 市场、商业与金融设施可以消耗或产出信用点，但信用点不会自动替代缺少的实体资源。
    - 其他合法产业可以在五种资源之间进行固定交换，但不得生成工时、科研或未登记的新资源。

  当前存储:
    - 分星区库存系统已封存在关闭条目 `分星区库存（封存）` 中，当前不得读取或结算。
    - 信用点唯一真值为 `主角.信用点`。
    - 矿物、食物、金属、补给唯一真值为 `主角.库存` 中的同名数值字段。
    - 所有建筑消耗均从这一个统一库存扣除，所有建筑产出均在本次结算末尾写回统一库存。
    - 叙事造成的资源变化调用 `resupply(资源名称, 数量)`；数量为正数时增加，为负数时扣除。

  当前Schema:
    ```json
    {
      "主角": {
        "信用点": 0,
        "库存": {"矿物": 0, "食物": 0, "金属": 0, "补给": 0},
        "_工业最后结算时间": "ISO 8601"
      }
    }
    ```

  字段约束:
    - 建筑的 `每日维护`、`每日输入` 与 `每日输出` 数值必须是大于或等于0的有限数值。
    - `每日维护`只完整保留信用点与补给两个键；`每日输入`和`每日输出`完整保留五种资源键；未使用的资源填写0。
    - 当前阶段禁止出现 `工时`、`科研`、`浮动均值`、`浮动标差`、`输出乘数`或其他随机字段。
    - 每个已部署建筑都必须拥有独立的信用点维护费和补给维护费；常规运行建筑的两项维护费都必须大于0。
    - 不生产资源的防御、居住或中继设施使用 `无产业` 模型，输出全部为0，但仍支付维护费。
    - `堆叠` 表示同类建筑数量；日产、需求与公平分配权重均按堆叠数计算。

  舰船补给消耗:
    - 每艘已部署舰船从统一库存按 `每日补给消耗` 扣除补给。
    - Worker只读取舰船对象中的明确数值，不在每日结算时重新根据舰级计算。
    - 标准新建默认值为：FF/DD 1，CA 5，BC 20，BB/CVL 50，CV/DN 100，TT 500。
    - 本项目既有变体默认值为：AF/AD/SD/TD 1，HAC/ESC/RC/SC 5，BBV/TC 50，CVT/ICV/JF 100；MV为1。
    - 舰船档案可以明确写入不同于默认值的消耗，包括0；明确实值永远优先于默认表。
    - 打包舰船尚未部署，不属于 `主角.舰船`，不产生每日补给消耗。

  自动结算:
    - periodic函数依据 `state.dtime` 的毫秒数换算经过天数，允许结算不足一日或跨越多日的时间。
    - 只结算 `状态=运行` 且已经到达 `部署日` 的建筑；部署日在时间区间内时只计算部署后的部分。
    - 本次结算只读取结算开始时的库存；全部产出在所有建筑计算完毕后统一入库，不得在同一次调用中进入下一道产业链。
    - 对每一种不足的资源，按需要该资源的建筑数量等额分配；堆叠建筑按实际建筑数量取得对应份数。
    - 若某建筑需要多种资源，其运行比例取各资源满足比例中的最低值；维护、输入与输出均按该比例结算。
    - 等额分配允许低效率旧建筑拖低总产出，不搜索最优生产组合，也不循环尝试其他调度方案。
    - 资源为0或某建筑所得份额为0时，该建筑本回合停产。
    - `_工业最后结算时间` 用于防止相同游戏时间被重复结算；刷新、重载与消息重刷不得重复产出。
    - 结算结果不得使任何资源小于0；数值统一清理浮点误差。
  </工业基础资源>
