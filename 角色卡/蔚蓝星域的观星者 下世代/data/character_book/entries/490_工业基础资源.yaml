content: |-
  <工业基础资源>
  # 工业系统第二阶段：固定日产、统一存取与事件驱动

  核心结构:
    - 产业模板、产业模型、旧专用补给接口与建筑独立存储均已移除。
    - 建筑和工业舰只记录稀疏的每日 `输入`、`输出`；没有的资源键不写。
    - `信用点` 读写 `主角.信用点`；矿物、食物、金属、补给读写 `主角.库存`；其他商品读写 `主角.物品栏` 的同名堆叠。
    - 建筑与舰船不得拥有独立库存。当前接受跨星区即时汇总，直到物流系统另行实装。
    - 舰船输入/输出禁止包含补给；舰船补给仍由 `每日补给消耗` 的既有Worker独立处理。

  自动结算:
    - SAM periodic函数是唯一权威结算器；UI只展示结果，即使UI关闭也会运行。
    - 只按完整经过日结算。十次一天与一次十天必须得到相同经济结果。
    - 每日先按当日开局库存公平分配全部输入，再统一写入输出；当天上游产出从次日开始可供下游使用。
    - 建筑仅在 `状态=运行` 时生产；工业舰在无停用状态或状态为运行/现役/可用时生产。
    - 输入不足时，节点按满足比例降产；任何资源不得被扣至负数。
    - 全部运行态保存在 `主角._工业系统`，AI不得读取或修改。

  随机事件:
    - 每个SAM回复全局最多新建一个事件；多数轮次不生成事件，已有事件可累积。
    - 事件目标只可能是建筑，绝不选择舰船。舰船遇敌应由叙事按正常NPC舰队规则处理。
    - 风险综合建筑安等、防御指数、势力声望与已有事件数。防御指数范围0至100；过高时不会抽到入侵。
    - 入侵按 `预警→准备中→航行中→成功终态` 推进；准备与航行使用固定星图坐标计算，不会瞬间到达。
    - 入侵、破坏、掠夺成功后会应用永久结果并停留，直到AI调用 `close_event(id)`；关闭事件不会回滚永久损失。
    - 缺货、研究突破、机遇有明确持续时间，到期自动删除。研究突破在持续期间提高科研效率投影。
    - 事件ID为可读文本，如 `工业站入侵事件1`。确定性哈希替代随机数，重刷与重放不会漂移。

  AI接口:
    - AI只接收 `工业资产简表`、`特殊事件`、`科研进展`，不接收建筑/舰船的输入输出与工业内部状态。
    - 唯一开放的事件函数是 `close_event(id)`；不存在create_event或resolve_event。
    - 剧情已经处理、拦截或放弃事件时调用close_event。若建筑已损毁/被接管，修复或夺回须另行更新建筑状态。
  </工业基础资源>
