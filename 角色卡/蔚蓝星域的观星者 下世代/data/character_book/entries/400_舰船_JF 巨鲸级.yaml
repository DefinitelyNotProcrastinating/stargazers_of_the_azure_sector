content: "<ship_def>\n舰船类型: JF\n舰种: 超级货舰\n舰体类别: 常规型\n“工业是贸易的基石。”——《星际航运导报》评测\n-  \
  \ 级别: 巨鲸级\n-   类型: 超级货舰 (Jumbo Freighter) - JF\n-   价格: 12B (120亿 信用点)\n-   形态:\
  \ 舰体是一个长达6000米的矩形框架，内部密集堆叠着标准化的超巨型货柜。为了保护这些脆弱的货物，舰体外层覆盖着厚重的工业级复合装甲板，没有任何流线型设计，看起来就像一块漂浮在太空中的巨大金属砖块。舰桥位于舰体尾部的上方，极其微小，仿佛是大象背上的一只苍蝇。引擎喷口巨大而粗糙，喷射着浑浊的等离子流。\n\
  -   制造商: 辛迪加联合政府造船厂 (重型工业运输部)\n-   静态配置文件:\n    -   舰体全长: 6200米\n    -   标准船员配置:\
  \ 15人\n    -   性能评级:\n        -   装甲: 220000\n        -   护盾: 500\n        -   机动性:\
  \ 5\n        -   火力输出: 0\n        -   运载能力: 2,500,000 m³ (常规货舱) + 500,000 m³ (舰队维护舱)\n\
  \    -   武器系统:\n        -   主要系统: 无\n        -   次要系统: 无\n        -   攻击射程: N/A\n\
  \    -   特殊系统:\n        -   名称: “求生者”紧急呼叫阵列\n        -   描述: 辛迪加为了保护其资产而专门设计的超高功率通讯系统。该系统独立于舰船主能源，拥有自己的备用电池组。一旦激活，它会利用舰体巨大的结构作为天线，在全频段通过安赛波广播明文求救信号（SOS）。这种信号具有极强的穿透力和抗干扰性，普通的电子战干扰很难将其完全压制。这确保了即便在海盗的电子封锁下，也能将遇袭坐标发送给最近的企业安全部队（CSF）或保险公司。\n\
  \    -   观星者需求: 只需要4TW/mV的稳态增益即可。\n\n舰船单位模板:\n  舰船类型: JF\n  吨位: XL\n  驾驶员: ''\n\
  \  是否旗舰: true\n  观星者接口角色: ''\n  跃迁充能: 0\n  最大充能: 3\n  跃迁消耗: 2\n  炮位配置: ''\n  装备槽位配置:\
  \ 5H7L\n  船体护盾值: 3600\n  船体结构值: 8400\n  护盾值: 3600\n  结构值: 8400\n  装配资源:\n    PG:\
  \ 600\n    CPU: 760\n  效果:\n    船体加成:\n    - 常规货舱容量 2500000 m³\n    - 舰队维护舱容量 500000\
  \ m³\n    内置电子系统:\n      基础CPU: 内置民用运输舰载CPU。\n      基础侦测器: 内置民用航行侦测器。\n  装备: {}\n\
  </ship_def>"
