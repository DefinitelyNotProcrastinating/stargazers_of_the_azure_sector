    <body>
      <script id="data-source" type="text/plain">$1</script>
      <div id="app"></div>
      <script>
        const QUALITY_MAP = {
          1: { name: "粗制", accent: "#8ca0b4", soft: "rgba(140,160,180,0.18)", strong: "rgba(140,160,180,0.36)" },
          2: { name: "标准", accent: "#5bd0a5", soft: "rgba(91,208,165,0.18)", strong: "rgba(91,208,165,0.36)" },
          3: { name: "精良", accent: "#66b8ff", soft: "rgba(102,184,255,0.18)", strong: "rgba(102,184,255,0.36)" },
          4: { name: "上等", accent: "#a78bfa", soft: "rgba(167,139,250,0.18)", strong: "rgba(167,139,250,0.36)" },
          5: { name: "史诗", accent: "#ffcf6d", soft: "rgba(255,207,109,0.18)", strong: "rgba(255,207,109,0.36)" },
          6: { name: "传奇", accent: "#ff879b", soft: "rgba(255,135,155,0.18)", strong: "rgba(255,135,155,0.36)" },
          7: { name: "神话", accent: "#86f6ff", soft: "rgba(134,246,255,0.18)", strong: "rgba(134,246,255,0.36)" }
        };
        const QUALITY_ALIAS = { "粗制": 1, "标准": 2, "精良": 3, "上等": 4, "史诗": 5, "传奇": 6, "神话": 7 };
        function escapeHtml(value) {
          const map = {};
          map["&"] = "&" + "amp;";
          map["<"] = "&" + "lt;";
          map[">"] = "&" + "gt;";
          map['"'] = "&" + "quot;";
          map["'"] = "&" + "#39;";
          map["`"] = String.fromCharCode(92, 96);
          return String(value ?? "").replace(/[&<>"'`]/g, (ch) => map[ch]);
        }
        function formatValue(value) {
          if (value === undefined || value === null || value === "") return "未记录";
          if (Array.isArray(value)) return value.length ? value.map(formatValue).join(" / ") : "无";
          if (typeof value === "object") return Object.entries(value).map(([k, v]) => `${escapeHtml(k)}: ${formatValue(v)}`).join("<br>");
          return escapeHtml(value);
        }
        function formatText(value) {
          return escapeHtml(value ?? "暂无描述").replace(/\n/g, "<br>");
        }
        function parseQuality(raw) {
          if (typeof raw === "number" && QUALITY_MAP[raw]) return raw;
          if (typeof raw === "string") {
            if (/^\d+$/.test(raw.trim()) && QUALITY_MAP[Number(raw.trim())]) return Number(raw.trim());
            for (const [name, index] of Object.entries(QUALITY_ALIAS)) if (raw.includes(name)) return index;
          }
          return 2;
        }
        function setTheme(quality) {
          const info = QUALITY_MAP[quality] || QUALITY_MAP[2];
          document.documentElement.style.setProperty("--accent", info.accent);
          document.documentElement.style.setProperty("--accent-soft", info.soft);
          document.documentElement.style.setProperty("--accent-strong", info.strong);
          return info;
        }
        function renderStats(entries) {
          return `<div class="grid">${entries.map(([label, value]) => `<div class="stat"><div class="label">${escapeHtml(label)}</div><div class="value">${formatValue(value)}</div></div>`).join("")}</div>`;
        }
        function renderEffects(effects) {
          if (!effects || typeof effects !== "object" || !Object.keys(effects).length) return `<div class="empty">暂无建筑效果</div>`;
          return `<div class="effect-grid">${Object.entries(effects).map(([k, v]) => `<div class="effect"><strong>${escapeHtml(k)}</strong><br>${formatValue(v)}</div>`).join("")}</div>`;
        }
        function init() {
          const raw = document.getElementById("data-source").textContent.trim();
          const app = document.getElementById("app");
          try {
            const data = jsyaml.load(raw);
            const name = Object.keys(data || {})[0];
            const building = name ? data[name] : null;
            if (!name || !building || typeof building !== "object") throw new Error("未读取到有效建筑对象。");
            const theme = setTheme(parseQuality(building["品质"]));
            const hp = Number(building["HP"] || 0);
            const maxHp = Math.max(Number(building["最大HP"] || 0), 0);
            const hpRate = maxHp > 0 ? Math.max(0, Math.min(100, hp / maxHp * 100)) : 0;
            const stats = [
              ["类型", building["类型"]],
              ["吨位", building["吨位"]],
              ["科技等级", building["科技等级"]],
              ["产业模型", building["产业模型"]],
              ["部署日", building["部署日"]],
              ["位置", building["位置"]],
              ["阵营", building["阵营"]],
              ["安等", building["安等"]],
              ["状态", building["状态"]],
              ["堆叠", building["堆叠"] ?? 1]
            ];
            app.innerHTML = `
              <section class="card">
                <header class="head">
                  <div class="head-top">
                    <div>
                      <div class="eyebrow">Orbital Structure / 轨道设施档案</div>
                      <h1>${escapeHtml(name)}</h1>
                      <div class="hero-badges">
                        <span class="badge quality">${escapeHtml(theme.name)}</span>
                        <span class="badge">${escapeHtml(building["类型"] || "未分类")}</span>
                        <span class="badge">${escapeHtml(building["吨位"] || "固定")}</span>
                      </div>
                    </div>
                    <div class="crest">
                      <div class="big">${escapeHtml(String(building["安等"] ?? "N/A"))}</div>
                      <div class="small">SECURITY LEVEL</div>
                    </div>
                  </div>
                  <div class="desc">${formatText(building["描述"])}</div>
                </header>
                <div class="body">
                  <div>
                    <h2 class="section-title">基础参数</h2>
                    ${renderStats(stats)}
                  </div>
                  ${Array.isArray(building["标签"]) && building["标签"].length ? `<div><h2 class="section-title">标签</h2><div class="tag-row">${building["标签"].map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div></div>` : ""}
                  ${maxHp > 0 ? `<div class="panel"><h2 class="section-title">结构完整度</h2><div class="grid" style="grid-template-columns: 110px 1fr 90px;align-items:center;"><div class="label" style="margin:0;">HP</div><div class="bar"><div style="width:${hpRate}%"></div></div><div class="value" style="text-align:right;">${escapeHtml(String(hp))} / ${escapeHtml(String(maxHp))}</div></div></div>` : ""}
                  <div>
                    <h2 class="section-title">每日产业结算</h2>
                    ${renderStats([
                      ["维护", building["每日维护"]],
                      ["输入", building["每日输入"]],
                      ["输出", building["每日输出"]]
                    ])}
                  </div>
                  <div>
                    <h2 class="section-title">设施效果</h2>
                    ${renderEffects(building["效果"])}
                  </div>
                </div>
              </section>
            `;
          } catch (error) {
            app.innerHTML = `<div class="card" style="padding:20px;"><div class="empty">建筑卡解析失败：${escapeHtml(error.message)}</div></div>`;
          }
        }
        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
        else init();
      </script>
    </body>
    </html>
    ```
