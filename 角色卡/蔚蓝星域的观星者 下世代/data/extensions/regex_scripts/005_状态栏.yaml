        `;

        $("characters-view").querySelectorAll(".character-tab").forEach(tab => {
          tab.addEventListener("click", () => activateCharacterPanel(tab.dataset.characterTab));
        });

        $("characters-view").querySelectorAll('[data-action="open-visual-bind"]').forEach(avatar => {
          avatar.addEventListener("click", event => {
            event.preventDefault();
            event.stopPropagation();
            openVisualBindModal(avatar.dataset.characterName || "");
          });
          avatar.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
