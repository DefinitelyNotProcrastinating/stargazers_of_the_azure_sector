阶", sec: "35", owner: "争议 (帝国/共和国)", desc: "大量类地行星，两大势力殖民冲突区，拓荒者的机遇与混乱之地。\n<b>本地太空特征:</b> 拥有大量富氧行星和液态水行星，两大帝国的勘探舰队和殖民船频繁出没。" }, { id: "golden_steps", name: "黄金阶梯", x: 950, y: 350, region: "天堂之阶", sec: "55", owner: "猎户座辛迪加", desc: "辛迪加的“经济特区”，试图打造第二个“贸易风走廊”。\n<b>本地太空特征:</b> 正在建设中的巨型商业枢纽站，充满了企业勘探队和雇佣兵舰队。" }, { id: "tranquil_sea", name: "静谧之海", x: 1000, y: 150, region: "天堂之阶", sec: "45", owner: "天鹅座联邦", desc: "联邦深空探索舰队活动区，寻找科学现象与先驱者遗迹。\n<b>本地太空特征:</b> 分布着奇异的硅基生态系统和未被激活的先驱者信标。" }, { id: "taboris", name: "塔伯里斯星座", x: 1200, y: 1000, region: "闪光星云", sec: "-1000", owner: "归元共同体", desc: "共同体的首都和克隆中心所在的星座，隐藏在一片被人工戴森云包裹的星系内。\n<b>本地太空特征:</b> 星座中心被巨大的不透明戴森云笼罩，外围星系遍布自动化的资源采集平台和防御哨站。" }, { id: "dark_constellation", name: "暗色星座", x: 100, y: 850, region: "大荒野", sec: "-200", owner: "争议 (共同体/铁血)", desc: "归元共同体的自动化船坞与铁血盟约的秘密矿场在此犬牙交错。\n<b>本地太空特征:</b> 高度放射性的熔岩行星，以及双方势力建造的武装采矿平台。" }, { id: "banshee", name: "女妖星旋", x: -50, y: 950, region: "大荒野", sec: "-500", owner: "无", desc: "两颗中子星相互绕行形成的极端引力与辐射环境，是宇宙中最危险的航道之一。\n<b>本地太空特征:</b> 强大的引力场和X射线暴，任何常规护盾都会被迅速剥离。" }, { id: "cobalt_frontier", name: "钴蓝边境", x: 978, y: 672, region: "天穹王冠", sec: "50", owner: "猎户座辛迪加 / 独立军阀", desc: "传统的“灰色地带”，由各路海盗领主和独立军阀割据。走私、赏金猎杀和非正规采矿是这里的日常。\n<b>本地太空特征:</b> 弥漫着淡蓝色的电离气体云，传感器效率中等。小行星带富含钴与铱。" }, { id: "crimson_constellation", name: "暗红星座", x: 998, y: 750, region: "天穹王冠", sec: "88", owner: "泰拉帝国 (军事管制区)", desc: "帝国的战略要塞区。这里不仅是重要的能源产地，更是通往边缘世界的咽喉。帝国海军在此部署了重兵。\n<b>本地太空特征:</b> 密集分布的老年红巨星使得整个星区沐浴在暗红色的光辉中。" }, { id: "splendor_constellation", name: "璨辉星座", x: 968, y: 700, region: "天穹王冠", sec: "68", owner: "泰拉帝国 / 猎户座辛迪加", desc: "被誉为“王冠上的宝石”。这里既有全银河最奢华的度假行星，也有高效运转的高科技工业世界。帝国与辛迪加在此设立了巨大的自由贸易区。\n<b>本地太空特征:</b> 壮丽的蓝巨星和稳定的主序星交相辉映，风景绝美。" }, { id: "w_no_stars", name: "W-J0001A 无星之海", x: 1300, y: 700, region: "虫洞空间", sec: "N/A", owner: "???", desc: "一个完全虚无的口袋宇宙。\n<b>本地太空特征:</b> 绝对的黑暗，没有任何恒星或背景辐射。空间中心悬浮着一个由未知原理构成的1:4:9完美比例方块。该空间具有重置特性。", isWormhole: true }, { id: "w_reflection", name: "W-B2005C 自我倒影", x: 0, y: 100, region: "虫洞空间", sec: "-2000", owner: "高维回响", desc: "天灾战争时期遗留下来的高维存在残渣所占据的污染空间。\n<b>本地太空特征:</b> 星系间充满着扭曲的、非欧几里得几何结构的空间。长期暴露会导致不可逆转的精神错乱。", isWormhole: true }, { id: "w_shelf", name: "W-C1101B 大陆架", x: 1250, y: 50, region: "虫洞空间", sec: "-300", owner: "无", desc: "通往另一个宇宙的无法回头的门扉。\n<b>本地太空特征:</b> 星系中心是一个巨大的、单向通行的超空间裂隙，不断向外喷射出不属于已知宇宙的奇异物质和能量。", isWormhole: true }, { id: "w_j101134", name: "W-J101134 空房间", x: 600, y: 50, region: "虫洞空间", sec: "-100", owner: "无", desc: "G型主序星，含1:4:9方块。资源贫乏，被探险家们戏称为“空房间”。", isWormhole: true }, { id: "w_j110110", name: "W-J110110", x: 50, y: 400, region: "虫洞空间", sec: "-500", owner: "敌对无人机", desc: "沃尔夫-拉叶星，古代无人机编队。", isWormhole: true }, { id: "w_j142857", name: "W-J142857 循环", x: 1350, y: 250, region: "虫洞空间", sec: "-1000", owner: "时空异常", desc: "每7小时发生一次时空坍缩重置。", isWormhole: true }, { id: "w_j155432", name: "W-J155432 冰壳", x: 1000, y: 1100, region: "虫洞空间", sec: "-200", owner: "无", desc: "红巨星，冰封行星下的巨大空腔与方块。", isWormhole: true }, { id: "w_j160888", name: "W-J160888 双星", x: 1400, y: 900, region: "虫洞空间", sec: "-1000", owner: "无", desc: "双中子星系统，引力透镜效应。", isWormhole: true }, { id: "w_j210956", name: "W-J210956 死寂", x: -100, y: 600, region: "虫洞空间", sec: "-100", owner: "无", desc: "熄灭的恒星，白矮星与小行星带。", isWormhole: true } ],
              links: [ { s: "sol_ward", t: "trade_winds", type: "jump", jumps: 5 },{ s: "sol_ward", t: "heart_republic", type: "jump", jumps: 7 },{ s: "sol_ward", t: "cygnus_cradle", type: "wormhole_stable", jumps: 1 },{ s: "heart_republic", t: "trade_winds", type: "jump", jumps: 5 },{ s: "cygnus_cradle", t: "trade_winds", type: "jump", jumps: 6 },{ s: "cygnus_cradle", t: "tranquil_sea", type: "pipe", jumps: 1 },{ s: "heart_republic", t: "new_promised", type: "pipe", jumps: 3 },{ s: "heart_republic", t: "charon", type: "pipe", jumps: 3 },{ s: "trade_winds", t: "cobalt_frontier", type: "gate", jumps: 1 },{ s: "sol_ward", t: "crimson_constellation", type: "pipe", jumps: 1 },{ s: "cobalt_frontier", t: "splendor_constellation", type: "jump", jumps: 6 },{ s: "crimson_constellation", t: "splendor_constellation", type: "jump", jumps: 8 },{ s: "crimson_constellation", t: "new_promised", type: "gate", jumps: 1 },{ s: "crimson_constellation", t: "dark_constellation", type: "gate", jumps: 1 },{ s: "charon", t: "serpent_maw", type: "jump", jumps: 8 },{ s: "charon", t: "sanctuary", type: "jump", jumps: 10 },{ s: "serpent_maw", t: "dark_constellation", type: "gate", jumps: 1 },{ s: "dark_constellation", t: "banshee", type: "jump", jumps: 15 },{ s: "new_promised", t: "golden_steps", type: "jump", jumps: 5 },{ s: "new_promised", t: "tranquil_sea", type: "jump", jumps: 6 },{ s: "golden_steps", t: "tranquil_sea", type: "jump", jumps: 7 },{ s: "golden_steps", t: "taboris", type: "gate", jumps: 1 },{ s: "taboris", t: "veil_ghosts", type: "gate", jumps: 1 },{ s: "veil_ghosts", t: "forerunners_tomb", type: "jump", jumps: 12 },{ s: "forerunners_tomb", t: "abyss", type: "jump", jumps: 15 },{ s: "forerunners_tomb", t: "w_no_stars", type: "wormhole_unstable", jumps: 1 },{ s: "tranquil_sea", t: "w_shelf", type: "wormhole_unstable", jumps: 1 },{ s: "serpent_maw", t: "w_reflection", type: "wormhole_unstable", jumps: 1 },{ s: "heart_republic", t: "w_j101134", type: "wormhole_unstable", jumps: 1 }, { s: "sanctuary", t: "w_j110110", type: "wormhole_unstable", jumps: 1 }, { s: "taboris", t: "w_j142857", type: "wormhole_unstable", jumps: 1 },{ s: "abyss", t: "w_j160888", type: "wormhole_unstable", jumps: 1 },{ s: "new_promised", t: "w_j155432", type: "wormhole_unstable", jumps: 1 },{ s: "banshee", t: "w_j210956", type: "wormhole_unstable", jumps: 1 }]
          };

      const STAR_MAP_CENTER = { x: 600, y: 500 };
      let starmapRuntime = null;
      let pendingMapStaticData = null;
      let starmapAnimationId = null;

      function toStarmapNode(row) {
        return {
          id: row[0],
          name: row[1],
          region: row[2],
          x: row[3],
          y: row[4],
          sec: row[5],
          owner: row[6],
          desc: row[7],
          isWormhole: Boolean(row[8])
        };
      }

      function toStarmapLink(row) {
        const type = row[2] === "worm" ? "wormhole_unstable" : row[2] === "gate" ? "pipe" : "jump";
        return { s: row[0], t: row[1], type, jumps: row[2] ? 1 : 5 };
      }

      function getStarmapData() {
        if (typeof LEGACY_STAR_MAP_DATA !== "undefined") {
          return LEGACY_STAR_MAP_DATA;
        }
        return {
          nodes: MAP.nodes.map(toStarmapNode),
          links: MAP.links.map(toStarmapLink)
        };
      }

      function getPseudoRandomZ(value) {
        const str = String(value || "");
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          hash = ((hash << 5) - hash) + str.charCodeAt(i);
          hash |= 0;
        }
        return (hash % 300) - 150;
      }

      function normalizeLocationParts(value) {
        return text(value)
          .split(/[|>＞\/\\，,;；\n\r]+/)
          .map(v => v.trim())
          .filter(Boolean);
      }

      function collectLocationText(item) {
        const keys = ["位置", "所在地", "地点", "坐标", "部署位置", "停泊位置", "所在星区", "星区", "星域", "地址", "location"];
        const chunks = [];

        keys.forEach(key => {
          if (item && item[key] !== undefined && item[key] !== null) chunks.push(text(item[key]));
        });

        if (!chunks.length && item && typeof item === "object") {
          entries(item).forEach(([k, v]) => {
            if (/位置|地点|坐标|星区|星域|地址|location/i.test(k)) chunks.push(text(v));
          });
        }

        if (!chunks.length) chunks.push(text(item));
        return chunks.join(" | ");
      }

      function matchNodeFromLocation(locationText, nodes) {
        const parts = normalizeLocationParts(locationText);
        const byName = new Map(nodes.map(node => [node.name, node]));

        for (let i = parts.length - 1; i >= 0; i--) {
          const part = parts[i];
          if (byName.has(part)) {
            return { node: byName.get(part), matchedIndex: i, matchedPart: part, finePath: parts.slice(i + 1).join(" | ") };
          }
        }

        for (let i = parts.length - 1; i >= 0; i--) {
          const part = parts[i];
          const found = nodes.find(node => part.includes(node.name) || node.name.includes(part));
          if (found) return { node: found, matchedIndex: i, matchedPart: part, finePath: parts.slice(i + 1).join(" | ") };
        }

        for (let i = parts.length - 1; i >= 0; i--) {
          const part = parts[i];
          const found = nodes.find(node => node.region === part || part.includes(node.region));
          if (found) return { node: found, matchedIndex: i, matchedPart: part, finePath: parts.slice(i + 1).join(" | ") };
        }

        const found = nodes.find(node => locationText.includes(node.name));
        return found ? { node: found, matchedIndex: -1, matchedPart: found.name, finePath: "" } : null;
      }

      function collectBuildingsForMap(staticData, nodes) {
        const mc = staticData.主角 || {};
        const raw = mc.建筑 || mc.产业 || mc.industry || {};
        const list = Array.isArray(raw) ? raw.map((item, index) => [item && item.名称 || item && item.name || `建筑 ${index + 1}`, item]) : entries(raw);

        return list.map(([name, item]) => {
          const locationText = collectLocationText(item || {});
          const match = matchNodeFromLocation(locationText, nodes);
          return {
            name,
            data: item || {},
            locationText,
            match,
            nodeId: match && match.node ? match.node.id : ""
          };
        }).filter(item => item.nodeId);
      }

      function mapRows(obj) {
        return entries(obj || {}).map(([k, v]) => `
          <div class="map-detail-row">
            <strong>${escapeHtml(k)}</strong>
            <div>${display(v)}</div>
          </div>
        `).join("");
      }

      function secColor(sec) {
        const value = parseFloat(sec);
        if (Number.isNaN(value)) return "var(--muted)";
        if (value >= 75) return "#7ffcff";
        if (value >= 40) return "var(--gold)";
        return "var(--danger)";
      }

      function showMapNodeDetails(node) {
        const panel = $("starmap-info-panel");
        const content = $("starmap-panel-content");
        if (!panel || !content) return;

        const runtime = starmapRuntime;
        const localBuildings = runtime && runtime.buildingsByNode ? runtime.buildingsByNode.get(node.id) || [] : [];
        const buildingSummary = localBuildings.length ? `
          <div class="section-title">本地建筑</div>
          <div class="map-detail-list">
            ${localBuildings.map(item => `
              <div class="map-detail-row">
                <strong>${escapeHtml(item.name)}</strong>
                <div>${escapeHtml(item.match && item.match.finePath || item.locationText || "未记录细分位置")}</div>
              </div>
            `).join("")}
          </div>
        ` : "";

        content.innerHTML = `
          <h2>${escapeHtml(node.name)}</h2>
          <div class="map-detail-list">
            <div class="map-detail-row"><strong>所属星域</strong><div>${escapeHtml(node.region)}</div></div>
            <div class="map-detail-row"><strong>主权归属</strong><div>${escapeHtml(node.owner)}</div></div>
            <div class="map-detail-row"><strong>安全等级</strong><div style="color:${secColor(node.sec)};font-weight:700;">${escapeHtml(node.sec)}</div></div>
          </div>
          <div class="section-title">情报摘要</div>
          <p class="desc">${escapeHtml(node.desc)}</p>
          ${node.isWormhole ? `<div class="map-detail-row" style="color:var(--danger);border-color:rgba(255,127,168,.45);text-align:center;">>>> 检测到高维异常 <<<</div>` : ""}
          ${buildingSummary}
        `;
        panel.classList.add("visible");
      }

      function showMapBuildingDetails(node, buildingItems) {
        const panel = $("starmap-info-panel");
        const content = $("starmap-panel-content");
        if (!panel || !content) return;

        const list = buildingItems || [];
        content.innerHTML = `
          <h2>${escapeHtml(node.name)} / 建筑定位</h2>
          <p class="desc">已将建筑位置向下匹配到星图可识别的最细节点；节点以下的空间站、轨道、行星等层级保留为细分位置。</p>
          <div class="map-detail-list">
            ${list.map(item => `
              <div class="map-detail-row">
                <strong>${escapeHtml(item.name)}</strong>
                <div><span class="muted">匹配星区：</span>${escapeHtml(node.name)}</div>
                <div><span class="muted">细分位置：</span>${escapeHtml(item.match && item.match.finePath || "未记录")}</div>
                <div><span class="muted">原始位置：</span>${escapeHtml(item.locationText)}</div>
                <details style="margin-top:7px;">
                  <summary>完整字段</summary>
                  <div class="map-detail-list">${mapRows(item.data)}</div>
                </details>
              </div>
            `).join("")}
          </div>
        `;
        panel.classList.add("visible");
      }

      window.closeMapPanel = function() {
        const panel = $("starmap-info-panel");
        if (panel) panel.classList.remove("visible");
      };

      function disposeStarmapRuntime() {
        if (!starmapRuntime) return;
        if (starmapAnimationId) cancelAnimationFrame(starmapAnimationId);
        starmapAnimationId = null;
        window.removeEventListener("resize", refreshStarMapSize);
        if (starmapRuntime.renderer) {
          starmapRuntime.renderer.dispose();
          const canvas = starmapRuntime.renderer.domElement;
          if (canvas && canvas.parentNode) canvas.parentNode.removeChild(canvas);
        }
        starmapRuntime = null;
      }

      function initStarMapEngine(staticData) {
        const container = $("webgl-layer");
        const uiLayer = $("ui-overlay");
        const svgLayer = $("connection-svg");
        const mapRoot = $("starmap-container");
        if (!container || !uiLayer || !svgLayer || !mapRoot) return;
        if (starmapRuntime) return;
        if (!window.THREE || !THREE.OrbitControls) {
          mapRoot.innerHTML = empty("Three.js 或 OrbitControls 未加载，无法渲染交互星图");
          return;
        }
        if (mapRoot.clientWidth < 20 || mapRoot.clientHeight < 20) return;

        const starMapData = getStarmapData();
        const mc = staticData.主角 || {};
        const location = text(mc.位置);
        const locParts = normalizeLocationParts(location);
        const currentName = locParts.length > 1 ? locParts[1] : "";

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, mapRoot.clientWidth / mapRoot.clientHeight, 1, 5000);
        camera.position.set(0, 0, 820);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(mapRoot.clientWidth, mapRoot.clientHeight);
        container.innerHTML = "";
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 50;
        controls.maxDistance = 2000;
        controls.enableRotate = false;
        controls.mouseButtons = {
          LEFT: THREE.MOUSE.PAN,
          MIDDLE: THREE.MOUSE.DOLLY,
          RIGHT: THREE.MOUSE.PAN
        };
        controls.touches = {
          ONE: THREE.TOUCH.PAN,
          TWO: THREE.TOUCH.DOLLY_PAN
        };

        const mapObjects = {};
        const mapLinks = [];
        let currentPlayerNodeId = "";

        starMapData.nodes.forEach(node => {
          const x = node.x - STAR_MAP_CENTER.x;
          const y = -(node.y - STAR_MAP_CENTER.y);
          const z = getPseudoRandomZ(node.id);
          const anchor = new THREE.Object3D();
          anchor.position.set(x, y, z);
          scene.add(anchor);

          const el = document.createElement("div");
          el.className = "map-node";
          if (node.isWormhole) el.classList.add("node-wormhole");
          if (currentName && (node.name === currentName || node.name.includes(currentName) || location.includes(node.name))) {
            el.classList.add("node-player");
            currentPlayerNodeId = node.id;
            camera.position.set(x, y + 50, z + 430);
            controls.target.set(x, y, z);
          }
          el.innerHTML = `<div class="node-dot"></div><div class="node-label">${escapeHtml(node.name)}</div>`;
          el.addEventListener("click", () => showMapNodeDetails(node));
          uiLayer.appendChild(el);
          mapObjects[node.id] = { anchor, element: el, data: node, screenX: 0, screenY: 0 };
        });

        starMapData.links.forEach(link => {
          if (!mapObjects[link.s] || !mapObjects[link.t]) return;
          const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.setAttribute("class", "connection-line");
          if (link.type.includes("wormhole")) line.classList.add("line-wormhole");
          else if (link.type === "jump") line.classList.add("line-jump");
          else line.classList.add("line-pipe");
          svgLayer.appendChild(line);
          mapLinks.push({ from: link.s, to: link.t, element: line });
        });

        const buildings = collectBuildingsForMap(staticData, starMapData.nodes);
        const buildingsByNode = new Map();
        buildings.forEach(item => {
          if (!buildingsByNode.has(item.nodeId)) buildingsByNode.set(item.nodeId, []);
          buildingsByNode.get(item.nodeId).push(item);
        });

        buildingsByNode.forEach((items, nodeId) => {
          const obj = mapObjects[nodeId];
          if (!obj) return;
          const icon = document.createElement("div");
          icon.className = "building-icon";
          icon.title = `建筑：${items.map(v => v.name).join("、")}`;
          icon.innerHTML = `<span>${items.length > 1 ? items.length : ""}</span>`;
          icon.addEventListener("click", event => {
            event.stopPropagation();
            showMapBuildingDetails(obj.data, items);
          });
          obj.element.appendChild(icon);
        });

        function focusPlayer() {
          if (!currentPlayerNodeId || !mapObjects[currentPlayerNodeId]) return;
          const pos = mapObjects[currentPlayerNodeId].anchor.position;
          controls.target.copy(pos);
          camera.position.set(pos.x, pos.y + 50, pos.z + 430);
        }

        const lockButton = $("btn-lock-player");
        if (lockButton) lockButton.onclick = focusPlayer;

        starmapRuntime = { scene, camera, renderer, controls, mapObjects, mapLinks, currentPlayerNodeId, buildingsByNode };
        window.addEventListener("resize", refreshStarMapSize);
        updateOverlayPositions();
        animateStarmap();
        if (currentPlayerNodeId) showMapNodeDetails(mapObjects[currentPlayerNodeId].data);
      }

      function refreshStarMapSize() {
        if (!starmapRuntime) return;
        const mapRoot = $("starmap-container");
        if (!mapRoot || mapRoot.clientWidth < 20 || mapRoot.clientHeight < 20) return;
        starmapRuntime.camera.aspect = mapRoot.clientWidth / mapRoot.clientHeight;
        starmapRuntime.camera.updateProjectionMatrix();
        starmapRuntime.renderer.setSize(mapRoot.clientWidth, mapRoot.clientHeight);
        updateOverlayPositions();
      }

      function updateOverlayPositions() {
        if (!starmapRuntime) return;
        const mapRoot = $("starmap-container");
        if (!mapRoot) return;
        const width = mapRoot.clientWidth;
        const height = mapRoot.clientHeight;
        const halfWidth = width / 2;
        const halfHeight = height / 2;

        entries(starmapRuntime.mapObjects).forEach(([id, obj]) => {
          const pos = obj.anchor.position.clone();
          pos.project(starmapRuntime.camera);
          obj.element.style.display = pos.z > 1 ? "none" : "flex";
          const x = (pos.x * halfWidth) + halfWidth;
          const y = -(pos.y * halfHeight) + halfHeight;
          obj.element.style.left = `${x}px`;
          obj.element.style.top = `${y}px`;
          obj.screenX = x;
          obj.screenY = y;
        });

        starmapRuntime.mapLinks.forEach(link => {
          const source = starmapRuntime.mapObjects[link.from];
          const target = starmapRuntime.mapObjects[link.to];
          const hidden = source.element.style.display === "none" || target.element.style.display === "none";
          link.element.style.opacity = hidden ? 0 : 1;
          link.element.setAttribute("x1", source.screenX);
          link.element.setAttribute("y1", source.screenY);
          link.element.setAttribute("x2", target.screenX);
          link.element.setAttribute("y2", target.screenY);
        });
      }

      function animateStarmap() {
        starmapAnimationId = requestAnimationFrame(animateStarmap);
        if (!starmapRuntime) return;
        starmapRuntime.controls.update();
        if ($("map-view") && $("map-view").classList.contains("active")) {
          updateOverlayPositions();
          starmapRuntime.renderer.render(starmapRuntime.scene, starmapRuntime.camera);
        }
      }

      function ensureStarMapReady() {
        if (!pendingMapStaticData) return;
        if (starmapRuntime) {
          refreshStarMapSize();
          return;
        }
        initStarMapEngine(pendingMapStaticData);
        refreshStarMapSize();
      }

      function renderMap(staticData) {
        pendingMapStaticData = staticData;
        disposeStarmapRuntime();

        $("map-view").innerHTML = `
          <div class="map-wrap" id="starmap-container">
            <div id="webgl-layer"></div>
            <svg id="connection-svg"></svg>
            <div id="ui-overlay"></div>
            <div class="map-controls">
              <div class="legend">
                <span><span style="color:#d9b7ff;font-weight:bold;">━</span> 星门航路</span>
                <span><span style="border-top:1px dashed #bda4d4;display:inline-block;width:16px;margin-right:5px;vertical-align:middle;"></span> 跃迁航线</span>
                <span><span style="color:#c980ff;">---</span> 虫洞连接</span>
                <span><span style="color:var(--gold);">◆</span> 自有建筑</span>
              </div>
              <button id="btn-lock-player" class="btn-center">⌖ 定位至玩家</button>
            </div>
            <div id="starmap-info-panel">
              <div class="panel-close" onclick="closeMapPanel()">&times;</div>
              <div id="starmap-panel-content">
                <h2>星区情报</h2>
                <p class="desc">拖拽平移，滚轮缩放；点击星区或建筑图标查看详细位置。</p>
              </div>
            </div>
          </div>
        `;

        if ($("map-view").classList.contains("active")) {
          requestAnimationFrame(ensureStarMapReady);
        }
      }


      function setupVisualBindControls() {
        const modal = $("visual-bind-modal");
        const fileInput = $("visual-bind-file-input");
        if (!modal || !fileInput) return;

        modal.querySelectorAll("[data-visual-bind-action]").forEach(btn => {
          btn.addEventListener("click", () => {
            const action = btn.dataset.visualBindAction;
            if (action === "cancel") closeVisualBindModal();
            if (action === "local-profile") { pendingVisualBindField = "profile_link"; fileInput.click(); }
            if (action === "local-illust") { pendingVisualBindField = "illust_link"; fileInput.click(); }
            if (action === "online-profile") { pendingVisualBindField = "profile_link"; bindCharacterVisualFromOnlineUrl("profile_link"); }
            if (action === "online-illust") { pendingVisualBindField = "illust_link"; bindCharacterVisualFromOnlineUrl("illust_link"); }
          });
        });

        fileInput.addEventListener("change", () => {
          const file = fileInput.files && fileInput.files[0];
          if (file) bindCharacterVisualFromFile(file);
        });

        modal.addEventListener("click", event => {
          if (event.target === modal) closeVisualBindModal();
        });
      }

      async function init() {
        const variables = await getVariables();
        characterVisualBinds = await loadVisualBinds();
        const staticData = variables.SAM_data.static;
        currentStaticData = staticData;
        setupVisualBindControls();
        const gameTime = variables.SAM_data.time;
        const mc = staticData.主角 || {};

        $("top-meta").innerHTML = `
          ${escapeHtml(gameTime)}<br>
          ${escapeHtml(mc.位置 || "位置未同步")}
        `;

        renderHome(staticData, gameTime);
        renderCharacters(staticData);
        renderShips(staticData);
        renderBases(staticData);
        renderAssets(staticData);
        renderMissions(staticData);
        renderMap(staticData);

        document.querySelectorAll(".nav-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            document.querySelectorAll(".nav-btn").forEach(v => v.classList.toggle("active", v === btn));
            document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === btn.dataset.view));
            if (btn.dataset.view === "map-view") {
              requestAnimationFrame(ensureStarMapReady);
            }
          });
        });
      }

      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
  </html>
