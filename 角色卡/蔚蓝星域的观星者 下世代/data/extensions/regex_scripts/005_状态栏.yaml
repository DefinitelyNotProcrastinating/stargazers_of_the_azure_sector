      <section class="main">
        <header class="topbar">
          <div class="top-title">蔚蓝星区状态栏</div>
          <div class="top-meta" id="top-meta">正在接入蔚蓝星区状态数据流...</div>
        </header>

        <main id="home-view" class="view active"></main>
        <main id="characters-view" class="view"></main>
        <main id="ships-view" class="view"></main>
        <main id="bases-view" class="view"></main>
        <main id="assets-view" class="view"></main>
        <main id="missions-view" class="view"></main>
        <main id="map-view" class="view"></main>
      </section>
    </div>


    <div id="visual-bind-modal" class="visual-bind-overlay" aria-hidden="true">
      <div class="visual-bind-dialog" role="dialog" aria-modal="true" aria-labelledby="visual-bind-title">
        <h3 id="visual-bind-title">选择本地图片 / 选择线上图片</h3>
