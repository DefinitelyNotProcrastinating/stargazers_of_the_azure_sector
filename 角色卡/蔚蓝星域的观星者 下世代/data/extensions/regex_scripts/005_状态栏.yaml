        <button class="nav-btn" data-view="ships-view"><span>03</span>舰船系统</button>
        <button class="nav-btn" data-view="bases-view"><span>04</span>建筑</button>
        <button class="nav-btn" data-view="assets-view"><span>05</span>资产与声望</button>
        <button class="nav-btn" data-view="missions-view"><span>06</span>任务</button>
        <button class="nav-btn" data-view="map-view"><span>07</span>星图</button>
