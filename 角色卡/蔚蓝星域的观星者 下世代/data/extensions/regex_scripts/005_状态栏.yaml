      function shortDescription(item, fallback) {
        if (!item || typeof item !== "object") return fallback || "暂无简介";
        return item.简介 || item.描述 || item.目标 || item.内容 || item.说明 || fallback || "暂无简介";
      }

      function statusOf(item) {
        if (!item || typeof item !== "object") return "";
        return item.状态 || item.完成状态 || item.进度 || item.阶段 || "";
      }

      function activateIndexedPanel(containerId, key) {
        const root = $(containerId);
        if (!root) return;

        root.querySelectorAll(".index-card").forEach(card => {
          card.classList.toggle("active", card.dataset.itemKey === key);
        });

        root.querySelectorAll(".detail-panel").forEach(panel => {
          panel.classList.toggle("active", panel.dataset.itemKey === key);
        });
      }

