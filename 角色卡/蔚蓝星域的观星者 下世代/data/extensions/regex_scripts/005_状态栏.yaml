          ["w3","W-C1101B 大陆架","未知虫洞星域",1070,105,"-300","无","通往未知宇宙的单向超空间裂隙。",1],
          ["w4","W-J101134 空房间","未知虫洞星域",490,70,"N/A","无","含有 1:4:9 方块的稳定 G 型主序星系。",1],
          ["w5","W-J110110","未知虫洞星域",80,350,"N/A","敌对无人机","存在敌对古代无人机编队的沃尔夫-拉叶星系。",1],
          ["w6","W-J142857 循环","未知虫洞星域",1040,225,"N/A","时空异常","每七标准时发生一次周期性坍缩。",1],
          ["w7","W-J155432 冰壳","未知虫洞星域",905,750,"N/A","无","冰壳行星地下存在空腔与规则能量信号。",1],
          ["w8","W-J160888 双星","未知虫洞星域",1180,585,"N/A","无","引力透镜效应强烈的双中子星系统。",1],
          ["w9","W-J210956 死寂","未知虫洞星域",70,570,"N/A","无","白矮星与复杂小行星带构成的死寂星系。",1]
        ],
        links: [
          ["sol","trade"],["sol","republic"],["sol","cygnus","gate"],["republic","trade"],["cygnus","trade"],
          ["cygnus","tranquil","gate"],["republic","canaan","gate"],["republic","charon","gate"],["trade","cobalt","gate"],
          ["sol","crimson","gate"],["cobalt","splendor"],["crimson","splendor"],["crimson","canaan","gate"],["crimson","murky","gate"],
          ["charon","serpent"],["charon","sanctuary"],["serpent","murky","gate"],["murky","banshee"],["canaan","golden"],
          ["canaan","tranquil"],["golden","tranquil"],["golden","taboris","gate"],["taboris","veil","gate"],["veil","tomb"],
          ["tomb","abyss"],["tomb","w1","worm"],["tranquil","w3","worm"]
        ]
      };

      const $ = id => document.getElementById(id);
      const entries = value => Object.entries(value || {});
      const text = value => value === undefined || value === null || value === "" ? "未记录" : String(value);

      /*
        Important:
        Do not use literal HTML entities like &quot; inside this script.
        Some srcdoc pipelines decode entities before script execution, which can turn:
            '"': "&quot;"
        into invalid JavaScript:
            '"': """
        Therefore entities are assembled through string concatenation.
      */
      function escapeHtml(value) {
        const str = text(value);
        const map = {};
        map["&"] = "&" + "amp;";
        map["<"] = "&" + "lt;";
        map[">"] = "&" + "gt;";
        map['"'] = "&" + "quot;";
        map["'"] = "&" + "#39;";
        return str.replace(/[&<>"']/g, ch => map[ch]);
      }

      const display = value => {
        if (Array.isArray(value)) {
          return value.length
            ? value.map(v => typeof v === "object" ? display(v) : escapeHtml(v)).join(" / ")
            : "无";
        }

        if (value && typeof value === "object") {
          return entries(value).map(([k, v]) => {
            return `<div><span class="muted">${escapeHtml(k)}：</span>${display(v)}</div>`;
          }).join("");
        }

        return escapeHtml(value);
      };

      const stat = (label, value) => `
        <div class="stat">
          <div class="label">${escapeHtml(label)}</div>
          <div class="value">${display(value)}</div>
        </div>
      `;

      const detail = obj => `
        <div class="detail-grid">
          ${entries(obj).map(([k, v]) => stat(k, v)).join("")}
        </div>
      `;

      const empty = message => `<div class="empty">${escapeHtml(message)}</div>`;

      const objectCards = (obj, renderer) => {
        const list = entries(obj);
        return list.length ? `<div class="cards">${list.map(renderer).join("")}</div>` : empty("暂无记录");
      };


      function normalizeVisualBind(value) {
        if (!value || typeof value !== "object") return { profile_link: "", illust_link: "" };
        return {
          profile_link: typeof value.profile_link === "string" ? value.profile_link : "",
          illust_link: typeof value.illust_link === "string" ? value.illust_link : ""
        };
      }

      function getCharacterVisualBind(name) {
        return normalizeVisualBind(characterVisualBinds && characterVisualBinds[name]);
      }

      function renderCharacterAvatar(name, sizeClass, editable) {
        const bind = getCharacterVisualBind(name);
        const cls = (sizeClass ? "character-avatar " + sizeClass : "character-avatar") + (editable ? " editable" : "");
        const fallbackStyle = bind.profile_link ? "display:none;" : "";
        const actionAttrs = editable
          ? ` role="button" tabindex="0" title="更换 ${escapeHtml(name)} 的头像" data-action="open-visual-bind" data-character-name="${escapeHtml(name)}"`
          : "";
        const img = bind.profile_link
          ? `<img src="${escapeHtml(bind.profile_link)}" alt="${escapeHtml(name)} 头像" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">`
          : "";
        return `<span class="${cls}"${actionAttrs}>${img}<span class="avatar-fallback" style="${fallbackStyle}">♥</span></span>`;
      }

      function renderCharacterIllust(name) {
        const bind = getCharacterVisualBind(name);
        if (!bind.illust_link) {
          return `
            <aside class="character-illust empty" aria-label="${escapeHtml(name)} 立绘未绑定">
              <div class="illust-fallback">
                <div class="illust-heart">♥</div>
                <div>未绑定立绘</div>
                <div class="muted">点击角色头像可选择本地/线上头像与立绘</div>
              </div>
            </aside>
          `;
        }
        return `
          <aside class="character-illust">
            <img src="${escapeHtml(bind.illust_link)}" alt="${escapeHtml(name)} 立绘" loading="lazy" onerror="this.closest('.character-illust').classList.add('empty');this.closest('.character-illust').innerHTML='<div class=&quot;illust-fallback&quot;><div class=&quot;illust-heart&quot;>♥</div><div>立绘加载失败</div></div>';">
            <div class="character-illust-caption">ILLUSTRATION / ${escapeHtml(name)}</div>
          </aside>
        `;
      }

      async function loadVisualBinds() {
        try {
          if (typeof getWorldbook !== "function") return {};
          const worldbook = await getWorldbook(VISUAL_BINDS_WORLDBOOK_NAME);
          const entry = (worldbook || []).find(item => item && (item.name === "VISUAL_BINDS" || item.comment === "VISUAL_BINDS"));
          if (!entry || !entry.content) return {};
          const parsed = JSON.parse(entry.content);
          const out = {};
          Object.keys(parsed || {}).forEach(name => {
            out[name] = normalizeVisualBind(parsed[name]);
          });
          return out;
        } catch (err) {
          console.warn("VISUAL_BINDS 读取失败", err);
          return {};
        }
      }


      function getVisualBindsEntry(worldbook) {
        return (worldbook || []).find(item => item && (item.name === VISUAL_BINDS_ENTRY_NAME || item.comment === VISUAL_BINDS_ENTRY_NAME));
      }

      function parseVisualBindsContent(content) {
        try {
          const parsed = JSON.parse(content || "{}");
          const out = {};
          Object.keys(parsed || {}).forEach(name => {
            out[name] = normalizeVisualBind(parsed[name]);
          });
          return out;
        } catch (err) {
          console.warn("VISUAL_BINDS JSON 解析失败，将以空对象覆盖", err);
          return {};
        }
      }

          function makeVisualBindsEntry(content, uid) {
        return {
          uid: uid,
          name: VISUAL_BINDS_ENTRY_NAME,
          enabled: false,
          strategy: {
            type: "constant",
            keys: [],
            keys_secondary: { logic: "and_any", keys: [] },
            scan_depth: "same_as_global"
          },
          position: {
            type: "at_depth",
            role: "system",
            depth: 0,
            order: 0
          },
          content: content,
          probability: 100,
          recursion: {
            prevent_incoming: true,
            prevent_outgoing: true,
            delay_until: null
          },
          effect: {
            sticky: null,
            cooldown: null,
            delay: null
          },
          extra: { purpose: "status_bar_visual_binds" }
        };
      }

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.onerror = () => reject(reader.error || new Error("文件读取失败"));
          reader.readAsDataURL(file);
        });
      }

      function loadImageFromDataUrl(dataUrl) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error("图片解码失败"));
          img.src = dataUrl;
        });
      }

      function estimateDataUrlBytes(dataUrl) {
        return new Blob([String(dataUrl || "")]).size;
      }

      function canvasToJpegDataUrl(canvas, quality) {
        return canvas.toDataURL("image/jpeg", quality);
      }

      async function compressImageToDataUrl(file, maxBytes) {
        if (!file || !file.type || !/^image\//i.test(file.type)) {
          throw new Error("请选择图片文件。");
        }

        const originalDataUrl = await readFileAsDataUrl(file);
        const originalBytes = estimateDataUrlBytes(originalDataUrl);
        if (originalBytes <= maxBytes) return originalDataUrl;

        const img = await loadImageFromDataUrl(originalDataUrl);
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        if (!ctx) throw new Error("当前浏览器无法创建图片压缩画布。");

        let width = img.naturalWidth || img.width;
        let height = img.naturalHeight || img.height;
        if (!width || !height) throw new Error("图片尺寸无效。");

        const maxSide = 1800;
        if (Math.max(width, height) > maxSide) {
          const ratio = maxSide / Math.max(width, height);
          width = Math.max(1, Math.round(width * ratio));
          height = Math.max(1, Math.round(height * ratio));
        }

        let best = "";
        let scale = 1;

        for (let scalePass = 0; scalePass < 9; scalePass++) {
          canvas.width = Math.max(1, Math.round(width * scale));
          canvas.height = Math.max(1, Math.round(height * scale));
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          for (let quality = 0.88; quality >= 0.42; quality -= 0.08) {
            const dataUrl = canvasToJpegDataUrl(canvas, quality);
            const bytes = estimateDataUrlBytes(dataUrl);
            if (!best || bytes < estimateDataUrlBytes(best)) best = dataUrl;
            if (bytes <= maxBytes) return dataUrl;
          }

          scale *= 0.82;
        }

        if (best && estimateDataUrlBytes(best) <= maxBytes) return best;
        throw new Error("图片已尝试压缩，但仍超过 1048576 bytes。请先裁剪或换用更小图片。");
      }

      async function uploadVisualLocalFile(file) {
        return compressImageToDataUrl(file, LOCAL_VISUAL_MAX_DATA_URL_BYTES);
      }

      function setVisualBindStatus(message) {
        const el = $("visual-bind-status");
        if (el) el.textContent = message || "";
      }

      function closeVisualBindModal() {
        pendingVisualBindCharacterName = "";
        pendingVisualBindField = "profile_link";
        setVisualBindStatus("");
        const modal = $("visual-bind-modal");
        if (modal) {
          modal.style.display = "none";
          modal.setAttribute("aria-hidden", "true");
        }
        const input = $("visual-bind-file-input");
        if (input) input.value = "";
      }

      function openVisualBindModal(characterName) {
        pendingVisualBindCharacterName = characterName;
        setVisualBindStatus("");
        const modal = $("visual-bind-modal");
        const desc = $("visual-bind-desc");
        if (desc) desc.textContent = "将为「" + characterName + "」绑定头像或立绘。本地图片会先压缩到 1048576 bytes 以下并以 Base64 写入；线上图片继续保存原始链接。";
        if (modal) {
          modal.style.display = "flex";
          modal.setAttribute("aria-hidden", "false");
        }
      }

      function refreshCharactersAfterVisualBind(characterName) {
        if (!currentStaticData) return;
        renderCharacters(currentStaticData);
        activateCharacterPanel(characterName);
      }

      async function updateVisualBindForCharacter(characterName, patch) {
        if (!characterName) throw new Error("缺少角色名");
        if (typeof updateWorldbookWith !== "function") {
          throw new Error("当前环境缺少 updateWorldbookWith，无法写入主世界书 VISUAL_BINDS。");
        }

        const worldbookName = VISUAL_BINDS_WORLDBOOK_NAME;
        const normalizedPatch = normalizeVisualPatch(patch);
        let nextBind = null;

        await updateWorldbookWith(worldbookName, worldbook => {
          const list = Array.isArray(worldbook) ? worldbook.slice() : [];
          let entry = getVisualBindsEntry(list);
          const binds = entry ? parseVisualBindsContent(entry.content) : {};
          nextBind = Object.assign({}, normalizeVisualBind(binds[characterName]), normalizedPatch);
          binds[characterName] = nextBind;
          const nextContent = JSON.stringify(binds, null, 2);

          if (entry) {
            entry.content = nextContent;
            entry.name = VISUAL_BINDS_ENTRY_NAME;
          } else {
            let maxUid = 0;
            list.forEach(item => {
              if (item && Number(item.uid) > maxUid) maxUid = Number(item.uid);
            });
            list.push(makeVisualBindsEntry(nextContent, maxUid + 1));
          }
          return list;
        }, { render: "immediate" });

        characterVisualBinds[characterName] = nextBind || Object.assign({}, getCharacterVisualBind(characterName), normalizedPatch);
        refreshCharactersAfterVisualBind(characterName);
      }

      function visualFieldLabel(field) {
        return field === "illust_link" ? "立绘" : "头像";
      }

      function makeVisualPatch(field, link) {
        const patch = {};
        patch[field === "illust_link" ? "illust_link" : "profile_link"] = String(link || "");
        return patch;
      }

      function normalizeVisualPatch(patch) {
        const out = {};
        if (patch && Object.prototype.hasOwnProperty.call(patch, "profile_link")) {
          out.profile_link = typeof patch.profile_link === "string" ? patch.profile_link : "";
        }
        if (patch && Object.prototype.hasOwnProperty.call(patch, "illust_link")) {
          out.illust_link = typeof patch.illust_link === "string" ? patch.illust_link : "";
        }
        return out;
      }

      async function bindCharacterVisualFromFile(file) {
        if (!pendingVisualBindCharacterName || !file) return;
        const field = pendingVisualBindField || "profile_link";
        const label = visualFieldLabel(field);
        setVisualBindStatus("正在读取并压缩本地" + label + "图片到 1048576 bytes 以下...");
        try {
          const link = await uploadVisualLocalFile(file);
          if (!link || !/^data:image\//i.test(link)) throw new Error("未能取得压缩后的图片 Base64。");
          await updateVisualBindForCharacter(pendingVisualBindCharacterName, makeVisualPatch(field, link));
          setVisualBindStatus(label + " Base64 已写入主世界书 VISUAL_BINDS。");
          setTimeout(closeVisualBindModal, 450);
        } catch (err) {
          console.error(err);
          setVisualBindStatus("写入失败：" + (err && err.message ? err.message : String(err)));
        }
      }

      async function bindCharacterVisualFromOnlineUrl(field) {
        const name = pendingVisualBindCharacterName;
        if (!name) return;
        const targetField = field || pendingVisualBindField || "profile_link";
        const label = visualFieldLabel(targetField);
        const current = getCharacterVisualBind(name)[targetField];
        const link = window.prompt("请输入线上" + label + "图片链接", current && /^https?:\/\//i.test(current) ? current : "https://");
        if (!link) return;
        const clean = String(link).trim();
        if (!/^https?:\/\//i.test(clean)) {
          setVisualBindStatus("线上图片链接必须以 http:// 或 https:// 开头。");
          return;
        }
        setVisualBindStatus("正在写入 VISUAL_BINDS...");
        try {
          await updateVisualBindForCharacter(name, makeVisualPatch(targetField, clean));
          setVisualBindStatus("线上" + label + "链接已写入主世界书 VISUAL_BINDS。");
          setTimeout(closeVisualBindModal, 450);
        } catch (err) {
          console.error(err);
          setVisualBindStatus("写入失败：" + (err && err.message ? err.message : String(err)));
        }
      }

      function activateCharacterPanel(target) {
        if (!target || !$("characters-view")) return;
        $("characters-view").querySelectorAll(".character-tab").forEach(v => {
          v.classList.toggle("active", v.dataset.characterTab === target);
        });
        $("characters-view").querySelectorAll(".character-panel").forEach(panel => {
          panel.classList.toggle("active", panel.dataset.characterPanel === target);
        });
      }

      function expProgress(exp) {
        const total = Number(exp) || 0;
        let level = 0;

        for (let i = 1; i < SKILL_THRESHOLDS.length; i++) {
          if (total >= SKILL_THRESHOLDS[i]) level = i;
        }

        if (level >= SKILL_THRESHOLDS.length - 1) {
          return { level, percent: 100, caption: `${total.toLocaleString()} EXP / MAX` };
        }

        const start = SKILL_THRESHOLDS[level];
        const end = SKILL_THRESHOLDS[level + 1];
        const percent = ((total - start) / (end - start)) * 100;

        return {
          level,
          percent: Math.max(0, Math.min(100, percent)),
          caption: `${total.toLocaleString()} / ${end.toLocaleString()} EXP`
        };
      }

      function renderHome(staticData, gameTime) {
        const mc = staticData.主角 || {};
        const learning = mc.学习 || {};
        const path = text(mc.位置).split("|").map(v => v.trim());

        const skills = entries(mc.技能).map(([name, item]) => {
          const progress = expProgress(item && item.EXP);
