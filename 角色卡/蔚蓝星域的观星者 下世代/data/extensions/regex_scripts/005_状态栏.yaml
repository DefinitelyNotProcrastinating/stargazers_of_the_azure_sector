      /* Three.js starmap ported from the legacy tactical UI */
      #map-view.active {
        display: block;
        padding: 0;
        overflow: hidden;
      }

      #starmap-container {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 30% 20%, rgba(145, 103, 255, .15), transparent 26%),
          radial-gradient(circle at 70% 78%, rgba(203, 128, 255, .12), transparent 34%),
          #000;
      }

      #webgl-layer,
      #connection-svg,
      #ui-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #webgl-layer { z-index: 0; pointer-events: all; }
      #connection-svg { z-index: 1; pointer-events: none; }
      #ui-overlay { z-index: 2; pointer-events: none; }

      .connection-line {
        stroke-linecap: round;
        vector-effect: non-scaling-stroke;
        transition: stroke-width .2s, opacity .2s;
      }

      .line-pipe {
        stroke: #d9b7ff;
        stroke-opacity: .62;
        stroke-width: 1.5px;
      }

      .line-wormhole {
        stroke: #c980ff;
        stroke-width: 1.5px;
        stroke-dasharray: 2, 4;
        stroke-opacity: .86;
      }

      .line-jump {
        stroke: #bda4d4;
        stroke-opacity: .42;
        stroke-width: 1px;
        stroke-dasharray: 4, 4;
      }

      .map-node {
        position: absolute;
        width: 16px;
        height: 16px;
        transform: translate(-50%, -50%);
        display: flex;
        justify-content: center;
        align-items: center;
        pointer-events: auto;
        cursor: pointer;
        z-index: 8;
      }

      .node-dot {
        width: 8px;
        height: 8px;
        background-color: #fff;
        border: 1px solid #05030a;
        transform: rotate(45deg);
        box-shadow: 0 0 8px rgba(255,255,255,.58);
        transition: all .2s;
        z-index: 10;
      }

      .map-node:hover .node-dot {
        transform: rotate(45deg) scale(1.55);
        background-color: var(--cyan);
        border-color: #fff;
        box-shadow: 0 0 14px rgba(217,183,255,.9);
      }

      .node-player .node-dot {
        background-color: #7ffcff;
        border-color: #fff;
        box-shadow: 0 0 16px #7ffcff, 0 0 26px rgba(217,183,255,.55);
      }

      .node-wormhole .node-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        transform: rotate(0deg);
        background-color: #c980ff;
        border-color: #fff;
        box-shadow: 0 0 14px rgba(203,128,255,.82);
      }

      .node-wormhole:hover .node-dot {
        transform: scale(1.55);
        background-color: #e0b7ff;
      }

      .node-label {
        position: absolute;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 180px;
        padding: 1px 5px;
        border: 1px solid rgba(226,190,255,.16);
        color: var(--muted);
        background: rgba(0,0,0,.72);
        font-size: 10px;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        text-shadow: 0 0 3px #000;
        white-space: nowrap;
        pointer-events: none;
        opacity: .68;
        transition: all .2s;
        z-index: 5;
      }

      .map-node:hover .node-label,
      .node-player .node-label {
        opacity: 1;
        color: #fff;
        border-color: var(--line-hot);
        background: rgba(11,4,20,.92);
      }

      .building-icon {
        position: absolute;
        top: -7px;
        right: -8px;
        min-width: 12px;
        height: 12px;
        padding: 0 3px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #1b0d22;
        background: var(--gold);
        border: 1px solid rgba(0,0,0,.65);
        font-size: 8px;
        line-height: 1;
        font-weight: 700;
        clip-path: polygon(50% 0%,100% 50%,50% 100%,0% 50%);
        transform: rotate(-45deg);
        z-index: 12;
        pointer-events: auto;
        box-shadow: 0 0 12px rgba(241,199,255,.65);
      }

      .building-icon span {
        transform: rotate(45deg);
        display: block;
      }

      .map-controls {
        position: absolute;
        left: 18px;
        bottom: 18px;
        z-index: 10;
        padding: 10px;
        border: 1px solid rgba(226,190,255,.24);
        background: rgba(10, 5, 18, .90);
        pointer-events: auto;
        box-shadow: 0 16px 42px rgba(0,0,0,.34);
        clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
      }

      .map-controls .legend {
        display: grid;
        gap: 5px;
        margin-bottom: 9px;
        color: var(--muted);
        font-size: 10px;
      }

      .btn-center {
        width: 100%;
        padding: 7px 10px;
        border: 1px solid var(--line-hot);
        color: var(--cyan);
        background: rgba(145,103,255,.13);
        cursor: pointer;
        font-size: 11px;
        letter-spacing: 1px;
        transition: .18s;
      }

      .btn-center:hover {
        color: #15051f;
        background: var(--cyan);
        box-shadow: 0 0 18px rgba(217,183,255,.5);
      }

      #starmap-info-panel {
        position: absolute;
        top: 18px;
        right: 18px;
        width: min(320px, calc(100% - 36px));
        max-height: calc(100% - 36px);
        overflow: auto;
        border: 1px solid rgba(226,190,255,.28);
        background: rgba(18, 7, 31, .96);
        box-shadow: -8px 8px 0 rgba(0,0,0,.32), 0 20px 70px rgba(0,0,0,.45);
        transform: translateX(120%);
        transition: transform .28s cubic-bezier(.4,0,.2,1);
        z-index: 20;
        pointer-events: auto;
      }

      #starmap-info-panel.visible { transform: translateX(0); }
      #starmap-panel-content { padding: 14px; }

      .panel-close {
        position: absolute;
        top: 5px;
        right: 10px;
        z-index: 25;
        color: var(--muted);
        font-size: 20px;
        cursor: pointer;
      }

      .panel-close:hover { color: #fff; }

      .map-detail-list {
        display: grid;
        gap: 6px;
        margin-top: 10px;
      }

      .map-detail-row {
        padding: 7px 8px;
        border: 1px solid rgba(226,190,255,.18);
        border-radius: 12px;
        background: rgba(255,255,255,.035);
        font-size: 12px;
      }

      .map-detail-row strong {
        display: block;
        margin-bottom: 3px;
        color: var(--cyan);
        font-size: 10px;
        letter-spacing: 1px;
      }

      @media (max-width: 820px) {
        #map-view.active { overflow: hidden; }
        .map-controls { left: 10px; bottom: 10px; }
        #starmap-info-panel { top: 10px; right: 10px; width: calc(100% - 20px); }
      }



      /* Wide-screen scrollbar fix: allow desktop grid children to shrink so inner overflow can scroll. */
      .main,
      .view,
      .ship-panels,
      .ship-panel,
      .ship-detail-shell,
      .map-side {
        min-height: 0;
        min-width: 0;
      }

      .view {
        overflow-y: auto;
        overflow-x: hidden;
      }

      .ship-tab-list {
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: thin;
        scrollbar-gutter: stable;
      }

      /* Keep the WebGL starmap canvas fixed; its info drawer scrolls independently. */
      #map-view.active {
        overflow: hidden;
      }

      #starmap-info-panel {
        overflow-y: auto;
      }

    </style>
  </head>

