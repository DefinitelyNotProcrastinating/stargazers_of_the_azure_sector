        $("home-view").innerHTML = `
          <div class="panel hero">
            <div>
              <div class="label">当前位置</div>
              <div class="place">${escapeHtml(path.slice(0, 2).join(" / "))}</div>
              <div class="subplace">${escapeHtml(path.slice(2).join(" / ") || "未记录详细坐标")}</div>
            </div>
            <div>
              <div class="label">信用点</div>
              <div class="credits">${Number(mc.信用点 || 0).toLocaleString()} C</div>
            </div>
          </div>

          <div class="grid">
            ${stat("当前外貌", mc.外貌 || mc.外观)}
            ${stat("游戏时间", gameTime)}
            ${stat("训练状态", `${learning.状态 || "未学习"}${learning.当前技能 ? ` / ${learning.当前技能}` : ""}`)}
            ${stat("训练速率", `${learning._实际每小时EXP || 0} EXP / 小时`)}
          </div>

          <details class="collapse-section" open>
            <summary>技能许可与经验</summary>
            <div class="collapse-body">
              <div class="grid wide">${skills || empty("尚未登记技能")}</div>
            </div>
          </details>

          <details class="collapse-section" open>
            <summary>物品栏</summary>
            <div class="collapse-body">
              ${itemCards ? `<div class="item-list">${itemCards}</div>` : empty("物品栏为空")}
            </div>
          </details>

          <section class="collapse-section">
            <div class="section-title">新闻与邂逅</div>
            ${newsCards ? `<div class="news-list">${newsCards}</div>` : empty("暂无新闻")}
          </section>
        `;
      }

      function renderCharacters(staticData) {
