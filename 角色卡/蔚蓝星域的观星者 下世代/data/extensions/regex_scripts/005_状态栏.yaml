      function parseDynamicSlotConfig(config) {
        /*
          动态槽位解析：
          - 支持 4S3M2L
          - 支持 4C1T
          - 支持未来新增槽位 ID，例如 2X3Q
          - 支持空格：4 C 1 T
          返回顺序按配置文本出现顺序保留。
        */
        const source = text(config);
        const result = [];
        const re = /(\d+)\s*([A-Za-z]+)/g;
        let m;

        while ((m = re.exec(source))) {
          const count = Number(m[1]) || 0;
          const slotId = String(m[2] || "").toUpperCase();
          if (count > 0 && slotId) {
            result.push({ slotId, count });
          }
        }

        return result;
      }

      function inferSlotKind(slotId, sourceKind) {
        /*
          kind 只用于环形布局与视觉分组，不用于限制槽位 ID。
        */
        if (sourceKind === "weapon") return "weapon";
        if (slotId === "H") return "high";
        if (slotId === "L") return "low";
        return "module";
      }

      function makeDynamicSlots(config, sourceKind, prefix) {
        const specs = parseDynamicSlotConfig(config);
        const slots = [];

        specs.forEach(spec => {
          for (let i = 1; i <= spec.count; i++) {
            slots.push({
              id: `${prefix}${spec.slotId}${i}`,
              slot: `${spec.slotId}${i}`,
              slotType: spec.slotId,
              sourceKind,
              kind: inferSlotKind(spec.slotId, sourceKind),
              module: "无装备",
              empty: true
            });
          }
        });

        return slots;
      }

      function extractRequirementField(reqText, fieldNames) {
        const req = String(reqText || "");
        for (let i = 0; i < fieldNames.length; i++) {
          const name = fieldNames[i];
          const re = new RegExp(name + "\\s*[：:]\\s*([^|/，,;；\\n\\r]+)", "i");
          const m = req.match(re);
          if (m) return String(m[1] || "").trim();
        }
        return "";
      }

      function normalizeSlotToken(value) {
        /*
          从 “S槽”、“C 机库槽”、“T 超级武器槽”、“1T”、“XL炮位” 等文本中提取槽位 ID。
          注意：XL 是多字符槽位 ID，必须保留完整。
        */
        const textValue = String(value || "").toUpperCase().trim();
        let m = textValue.match(/^([A-Z]+)/);
        if (m) return m[1];
        m = textValue.match(/[A-Z]+/);
        return m ? m[0] : "";
      }

      function getShipWeaponSlotTypes(ship) {
        return parseDynamicSlotConfig(ship && ship.炮位配置).map(v => v.slotId);
      }

      function getShipModuleSlotTypes(ship) {
        return parseDynamicSlotConfig(ship && ship.装备槽位配置).map(v => v.slotId);
      }

      function inferWeaponSlotFromText(reqText, ship) {
        /*
          武器的槽位 ID 必须从舰船自身的炮位配置中反查。
          这样可以支持 S / XL / C / T / 未来任意 ID。
          例如舰船只有 4S，装备要求中出现 “S炮位” 或 “炮位：S” 才匹配 S。
        */
        const req = String(reqText || "").toUpperCase();
        const slotTypes = getShipWeaponSlotTypes(ship).sort((a, b) => b.length - a.length);

        for (let i = 0; i < slotTypes.length; i++) {
          const id = slotTypes[i];
          const escaped = id.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const re = new RegExp("(^|[^A-Z])" + escaped + "([^A-Z]|$)", "i");
          if (re.test(req)) return id;
        }

        return "";
      }

      function inferModuleSlotFromText(reqText, ship) {
        const req = String(reqText || "").toUpperCase();
        const slotTypes = getShipModuleSlotTypes(ship).sort((a, b) => b.length - a.length);

        for (let i = 0; i < slotTypes.length; i++) {
          const id = slotTypes[i];
          const escaped = id.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const re = new RegExp("(^|[^A-Z])" + escaped + "([^A-Z]|$)", "i");
          if (re.test(req)) return id;
        }

        return "";
      }

      function parseEquipRequirementSlot(moduleData, ship) {
        const req = String((moduleData && moduleData.装配要求) || "");
        const tags = moduleData && moduleData.标签 ? moduleData.标签 : [];
        const tagText = Array.isArray(tags) ? tags.join(" ") : String(tags);

        const mountText = extractRequirementField(req, ["炮位", "武器槽位", "武器槽", "挂点"]);
        const moduleText = extractRequirementField(req, ["装备槽位", "模块槽位", "模块槽"]);

        if (mountText && mountText !== "无") {
          const explicitType = normalizeSlotToken(mountText);
          return {
            type: explicitType,
            sourceKind: "weapon",
            kind: "weapon",
            strict: true
          };
        }

        if (moduleText && moduleText !== "无") {
          const explicitType = normalizeSlotToken(moduleText);
          return {
            type: explicitType,
            sourceKind: "module",
            kind: inferSlotKind(explicitType, "module"),
            strict: true
          };
        }

        /*
          没有标准字段时，尝试从整个装配要求文本里根据舰船现有槽位 ID 反查。
        */
        const inferredWeaponType = inferWeaponSlotFromText(req, ship);
        if (inferredWeaponType) {
          return {
            type: inferredWeaponType,
            sourceKind: "weapon",
            kind: "weapon",
            strict: true
          };
        }

        const inferredModuleType = inferModuleSlotFromText(req, ship);
        if (inferredModuleType) {
          return {
            type: inferredModuleType,
            sourceKind: "module",
            kind: inferSlotKind(inferredModuleType, "module"),
            strict: true
          };
        }

        /*
          标签只能判断大类，不能判断具体槽位 ID。
          对武器来说，这里不再允许“任意 weapon 槽”兜底。
          否则 4S 这种配置可能被错误扩展/错误占用。
        */
        if (tagText.includes("武器") || tagText.includes("炮塔") || tagText.includes("机库") || tagText.includes("超级武器")) {
          return { type: "", sourceKind: "weapon", kind: "weapon", strict: false };
        }

        if (tagText.includes("防御") || tagText.includes("护盾")) {
          return { type: "H", sourceKind: "module", kind: "high", strict: false };
        }

        if (tagText.includes("电子") || tagText.includes("辅助")) {
          return { type: "L", sourceKind: "module", kind: "low", strict: false };
        }

        return { type: "", sourceKind: "", kind: "module", strict: false };
      }

      function buildAllShipSlots(ship) {
        /*
          槽位数量与槽位 ID 只来自舰船数据：
          - 炮位配置
          - 装备槽位配置

          不硬编码 S/M/L/XL/H/L。
          例如 4C1T 会生成 C1 C2 C3 C4 T1。
        */
        const weaponSlots = makeDynamicSlots(
          ship && ship.炮位配置,
          "weapon",
          "W-"
        );

        const moduleSlots = makeDynamicSlots(
          ship && ship.装备槽位配置,
          "module",
          "M-"
        );

        return weaponSlots.concat(moduleSlots);
      }

      function assignEquipmentToSlots(slots, ship) {
        const equipment = entries((ship && ship.装备) || {});
        const used = new Set();

        equipment.forEach(([moduleName, moduleData]) => {
          const req = parseEquipRequirementSlot(moduleData, ship);
          let index = -1;

          /*
            第一优先级：精确匹配来源类型 + 槽位 ID。
            武器必须匹配炮位配置中真实存在的槽位 ID。
          */
          if (req.type && req.sourceKind) {
            index = slots.findIndex(slot =>
              !used.has(slot.id) &&
              slot.sourceKind === req.sourceKind &&
              slot.slotType === req.type
            );
          }

          /*
            第二优先级：只匹配槽位 ID。
            仅用于明确给出了 type 的情况。
          */
          if (index < 0 && req.type) {
            index = slots.findIndex(slot =>
              !used.has(slot.id) &&
              slot.slotType === req.type
            );
          }

          /*
            第三优先级：
            只允许模块使用大类兜底。
            武器不允许用 sourceKind=weapon 兜底，否则装备无法识别槽位时可能错误占用。
          */
          if (index < 0 && req.sourceKind === "module" && !req.strict) {
            index = slots.findIndex(slot =>
              !used.has(slot.id) &&
              slot.sourceKind === "module" &&
              (slot.kind === req.kind || req.kind === "module")
            );
          }

          /*
            关键约束：
            找不到可兼容槽位时，不创建额外节点。
            槽位总数永远等于舰船配置解析出的槽位总数。
          */
          if (index >= 0) {
            slots[index].module = moduleName;
            slots[index].empty = false;
            used.add(slots[index].id);
          }
        });

        return slots;
      }

      function shipModuleNodes(ship) {
        const slots = buildAllShipSlots(ship);
        if (!slots.length) return [];
        return assignEquipmentToSlots(slots, ship);
      }

      function polarNodes(items, radius, startDeg, endDeg) {
        if (!items.length) return "";

        return items.map((item, i) => {
          const deg = items.length === 1
            ? (startDeg + endDeg) / 2
            : startDeg + (endDeg - startDeg) * (i / (items.length - 1));

          const rad = deg * Math.PI / 180;
          const x = 50 + Math.cos(rad) * radius;
          const y = 50 + Math.sin(rad) * radius;

          return `
            <div class="module-node ${escapeHtml(item.kind)} ${item.empty ? "empty-slot" : ""}" style="--x:${x.toFixed(2)}%;--y:${y.toFixed(2)}%" title="${escapeHtml(item.slot)}">
              <span class="module">${escapeHtml(item.module || "无装备")}</span>
            </div>
          `;
        }).join("");
      }

      function renderShipOrbital(name, ship) {
        const nodes = shipModuleNodes(ship);
        const weapons = nodes.filter(v => v.kind === "weapon");
        const highs = nodes.filter(v => v.kind === "high");
        const lows = nodes.filter(v => v.kind === "low");
        const others = nodes.filter(v => !["weapon", "high", "low"].includes(v.kind));

        return `
          <div class="ship-orbital">
            <div class="ship-ring inner"></div>
            ${polarNodes(weapons, 39, -155, 155)}
            ${polarNodes(highs, 26, 110, 250)}
            ${polarNodes(lows, 26, -70, 70)}
            ${polarNodes(others, 34, 200, 340)}
            <div class="ship-core">
              <strong>${escapeHtml(name)}</strong>
              <small>
                ${escapeHtml(ship && ship.舰船类型 || "舰船")} / ${escapeHtml(ship && ship.吨位 || "未知吨位")}<br>
                ${escapeHtml(ship && ship.炮位配置 || "无炮位记录")} · ${escapeHtml(ship && ship.装备槽位配置 || "无槽位记录")}
              </small>
            </div>
          </div>
        `;
      }

      function findShipStargazer(staticData, shipName, ship) {
        const chars = staticData.主角 && staticData.主角.可攻略角色 ? staticData.主角.可攻略角色 : {};
        const candidates = [
          shipName,
          ship && ship.舰船ID,
          ship && ship.舰船id,
          ship && ship.ID,
          ship && ship.id,
          ship && ship.编号,
          ship && ship.观星者接口角色
        ].filter(Boolean).map(String);

        let found = null;

        entries(chars).some(([charName, c]) => {
          const info = c && c.附加信息 ? c.附加信息 : {};
          const linked = [
            c && c.分配舰船,
            c && c.舰船ID,
            c && c.舰船id,
            info.舰船ID,
            info.舰船id,
            info.舰船,
            info.舰船名称
          ].filter(Boolean).map(String);

          if (candidates.includes(charName) || linked.some(v => candidates.includes(v))) {
            found = { name: charName, data: c };
            return true;
          }

          return false;
        });

        return found;
      }

      function renderStargazerForShip(staticData, shipName, ship) {
        const sg = findShipStargazer(staticData, shipName, ship);

        if (!sg) {
          return `
            <div class="stargazer-link">
              <div class="label">观星者接口</div>
              <div class="value muted">未找到匹配的观星者。</div>
            </div>
          `;
        }

        return `
          <div class="stargazer-link">
            <div class="label">观星者接口 / 来自可攻略角色</div>
            <div class="ship-stargazer-card">
              ${renderCharacterAvatar(sg.name, "small", false)}
              <div class="value">
                <strong>${escapeHtml(sg.name)}</strong><br>
                ${escapeHtml(sg.data && (sg.data.型号ID || sg.data.身份) || "未记录型号")} · ${escapeHtml(sg.data && sg.data.种族 || "未记录种族")}
              </div>
            </div>
          </div>
        `;
      }

      function propRows(obj, skipKeys) {
        const skip = new Set(skipKeys || []);
        return entries(obj || {}).filter(([k]) => !skip.has(k)).map(([k, v]) => `
          <div class="prop-row">
            <div class="prop-key">${escapeHtml(k)}</div>
            <div class="prop-val">${display(v)}</div>
          </div>
        `).join("");
      }

      function numericField(obj, key) {
        const raw = obj && obj[key] !== undefined ? obj[key] : 0;
        const num = parseFloat(String(raw).replace(/[^0-9.-]/g, ""));
        return Number.isFinite(num) ? num : 0;
      }

      function sumEquipmentField(equipment, key) {
        return entries(equipment || {}).reduce((sum, [, item]) => sum + numericField(item || {}, key), 0);
      }

      function shipHpStatus(ship) {
        const baseShield = numericField(ship, "船体护盾值");
        const baseStructure = numericField(ship, "船体结构值");
        const bonusShield = sumEquipmentField(ship && ship.装备, "护盾");
        const bonusStructure = sumEquipmentField(ship && ship.装备, "结构值");
        const maxShield = baseShield + bonusShield;
        const maxStructure = baseStructure + bonusStructure;
        const currentShield = ship && ship.护盾值 !== undefined ? numericField(ship, "护盾值") : baseShield;
        const currentStructure = ship && ship.结构值 !== undefined ? numericField(ship, "结构值") : baseStructure;

        return {
          currentShield,
          maxShield,
          bonusShield,
          currentStructure,
          maxStructure,
          bonusStructure
        };
      }

      function hpBar(label, current, max, bonus, kind) {
        const pct = max > 0 ? Math.max(0, Math.min(100, current / max * 100)) : 0;
        const bonusText = bonus > 0 ? `装备 +${bonus}` : "无装备容量加成";
        return `
          <div class="ship-health-card">
