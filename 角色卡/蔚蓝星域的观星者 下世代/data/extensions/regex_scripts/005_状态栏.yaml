        return `
          <div class="equipment-list">
            ${list.map(([name, item]) => `
              <article class="equipment-entry">
                <div class="equipment-entry-title">${escapeHtml(name)}</div>
                <div class="prop-list">
                  ${propRows(item || {})}
                </div>
              </article>
            `).join("")}
          </div>
