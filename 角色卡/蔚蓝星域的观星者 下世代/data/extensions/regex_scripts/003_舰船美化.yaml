      <script id="data-source" type="text/plain">$1</script>
      <div id="app"></div>
      <script>
        const QUALITY_MAP = {
          1: { name: "粗制", accent: "#8ca0b4", soft: "rgba(140,160,180,0.18)", strong: "rgba(140,160,180,0.36)" },
          2: { name: "标准", accent: "#5bd0a5", soft: "rgba(91,208,165,0.18)", strong: "rgba(91,208,165,0.36)" },
          3: { name: "精良", accent: "#66b8ff", soft: "rgba(102,184,255,0.18)", strong: "rgba(102,184,255,0.36)" },
          4: { name: "上等", accent: "#a78bfa", soft: "rgba(167,139,250,0.18)", strong: "rgba(167,139,250,0.36)" },
          5: { name: "史诗", accent: "#ffcf6d", soft: "rgba(255,207,109,0.18)", strong: "rgba(255,207,109,0.36)" },
          6: { name: "传奇", accent: "#ff879b", soft: "rgba(255,135,155,0.18)", strong: "rgba(255,135,155,0.36)" },
          7: { name: "神话", accent: "#86f6ff", soft: "rgba(134,246,255,0.18)", strong: "rgba(134,246,255,0.36)" }
        };
        const QUALITY_ALIAS = { "粗制": 1, "标准": 2, "精良": 3, "上等": 4, "史诗": 5, "传奇": 6, "神话": 7 };

        function escapeHtml(value) {
          const map = {};
          map["&"] = "&" + "amp;";
          map["<"] = "&" + "lt;";
          map[">"] = "&" + "gt;";
          map['"'] = "&" + "quot;";
          map["'"] = "&" + "#39;";
          map["`"] = String.fromCharCode(92, 96);
          return String(value ?? "").replace(/[&<>"'`]/g, (ch) => map[ch]);
        }
        function formatValue(value) {
          if (value === undefined || value === null || value === "") return "未记录";
          if (Array.isArray(value)) return value.length ? value.map(formatValue).join(" / ") : "无";
          if (typeof value === "object") return Object.entries(value).map(([k, v]) => `${escapeHtml(k)}: ${formatValue(v)}`).join("<br>");
          return escapeHtml(value);
        }
        function textBlock(value) {
          return escapeHtml(value ?? "暂无描述").replace(/\n/g, "<br>");
        }
        function parseQuality(raw) {
          if (typeof raw === "number" && QUALITY_MAP[raw]) return raw;
          if (typeof raw === "string") {
            if (/^\d+$/.test(raw.trim()) && QUALITY_MAP[Number(raw.trim())]) return Number(raw.trim());
            for (const [name, index] of Object.entries(QUALITY_ALIAS)) {
              if (raw.includes(name)) return index;
            }
          }
          return 2;
        }
        function pickShipQuality(ship) {
          if (ship && ship["品质"] !== undefined) return parseQuality(ship["品质"]);
          const equipment = ship && ship["装备"] && typeof ship["装备"] === "object" ? Object.values(ship["装备"]) : [];
          let highest = 2;
          equipment.forEach((item) => {
            if (item && item["品质"] !== undefined) highest = Math.max(highest, parseQuality(item["品质"]));
          });
          return highest;
        }
        function setTheme(quality) {
          const info = QUALITY_MAP[quality] || QUALITY_MAP[2];
          document.documentElement.style.setProperty("--accent", info.accent);
          document.documentElement.style.setProperty("--accent-soft", info.soft);
          document.documentElement.style.setProperty("--accent-strong", info.strong);
          return info;
        }
        function compactRequirement(value) {
          if (!value) return "未声明";
          return escapeHtml(String(value)).replace(/\s*\|\s*/g, " · ");
        }
        function renderStats(entries) {
          return `<div class="grid">${entries.map(([label, value]) => `<div class="stat"><div class="label">${escapeHtml(label)}</div><div class="value">${formatValue(value)}</div></div>`).join("")}</div>`;
        }
        function renderEffects(obj) {
          if (!obj || typeof obj !== "object" || !Object.keys(obj).length) return `<div class="empty">暂无系统效果</div>`;
          return `<div class="effect-list">${Object.entries(obj).map(([k, v]) => `<div class="effect-item"><strong>${escapeHtml(k)}</strong><br>${formatValue(v)}</div>`).join("")}</div>`;
        }
        function renderEquipment(obj) {
          if (!obj || typeof obj !== "object" || !Object.keys(obj).length) return `<div class="empty">暂无装载装备</div>`;
          return `<div class="equip-grid">${Object.entries(obj).map(([name, item]) => {
            const q = QUALITY_MAP[parseQuality(item && item["品质"])];
            const tags = Array.isArray(item && item["标签"]) ? item["标签"] : [];
            return `<article class="subcard" style="box-shadow: inset 0 0 0 1px ${q.strong};">
              <div class="subhead">
                <div>
                  <div class="subname">${escapeHtml(name)}</div>
                  <div class="mini">${escapeHtml(q.name)} · ${compactRequirement(item && item["装配要求"])}</div>
                </div>
                <div class="pill quality" style="margin:0;color:${q.accent};border-color:${q.strong};background:${q.soft};">${escapeHtml(item && item["品质"] !== undefined ? String(item["品质"]) : q.name)}</div>
              </div>
              ${tags.length ? `<div class="tag-row">${tags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>` : ""}
              ${item && item["描述"] ? `<div class="value" style="color:var(--muted);margin-bottom:8px;">${textBlock(item["描述"])}</div>` : ""}
              ${renderEffects(item && item["效果"])}
            </article>`;
          }).join("")}</div>`;
        }
        function attachTabs() {
          document.querySelectorAll(".tab-btn").forEach((button) => {
            button.addEventListener("click", () => {
              const tab = button.getAttribute("data-tab");
              document.querySelectorAll(".tab-btn").forEach((node) => node.classList.toggle("active", node === button));
              document.querySelectorAll(".tab-panel").forEach((panel) => panel.classList.toggle("active", panel.id === tab));
            });
          });
        }
        function init() {
          const raw = document.getElementById("data-source").textContent.trim();
          const app = document.getElementById("app");
          try {
            const data = jsyaml.load(raw);
            const shipName = Object.keys(data || {})[0];
            const ship = shipName ? data[shipName] : null;
            if (!shipName || !ship || typeof ship !== "object") throw new Error("未读取到有效舰船对象。");
            const quality = pickShipQuality(ship);
            const theme = setTheme(quality);
            const currentCharge = Number(ship["跃迁充能"] || 0);
            const maxCharge = Math.max(Number(ship["最大充能"] || 0), 1);
            const chargeRate = Math.max(0, Math.min(100, currentCharge / maxCharge * 100));
            const tonnage = ship["吨位"] || "S";
            const overviewStats = [
              ["舰船类型", ship["舰船类型"]],
              ["吨位", tonnage],
              ["每日补给消耗", ship["每日补给消耗"] ?? "未登记"],
              ["制造商", ship["制造商"]],
              ["驾驶员", ship["驾驶员"]],
              ["是否旗舰", ship["是否旗舰"] ? "是" : "否"],
              ["观星者接口角色", ship["观星者接口角色"] || "无"],
              ["炮位配置", ship["炮位配置"] || "未登记"],
              ["T槽种类", ship["T槽种类"] || "无"],
              ["装备槽位配置", ship["装备槽位配置"] || "未登记"],
              ["跃迁消耗", ship["跃迁消耗"] ?? "未登记"]
            ];
            const resourceStats = [
              ["PG", ship["装配资源"] && ship["装配资源"]["PG"]],
              ["CPU", ship["装配资源"] && ship["装配资源"]["CPU"]]
            ];
            app.innerHTML = `
              <section class="ship-card">
                <header class="hero">
                  <div class="hero-top">
                    <div>
                      <div class="eyebrow">Ship Manifest / 舰船档案</div>
                      <h1 class="ship-name">${escapeHtml(shipName)}</h1>
                      <div class="meta">
                        <span class="pill quality">${escapeHtml(theme.name)}</span>
                        <span class="pill">${escapeHtml(ship["舰船类型"] || "未分类")}</span>
                        <span class="pill">${escapeHtml(tonnage)}</span>
                        ${ship["驾驶员"] ? `<span class="pill">驾驶员 · ${escapeHtml(ship["驾驶员"])}</span>` : ""}
                      </div>
                    </div>
                    <div class="glyph">
                      <div class="glyph-inner">${escapeHtml(String(tonnage).toUpperCase())}</div>
                    </div>
                  </div>
                  <div class="desc">${textBlock(ship["描述"])}</div>
                </header>
                <nav class="tabs">
                  <button class="tab-btn active" data-tab="ship-tab-overview">概览</button>
                  <button class="tab-btn" data-tab="ship-tab-equipment">装备</button>
                  <button class="tab-btn" data-tab="ship-tab-systems">系统</button>
                </nav>
                <section class="tab-panel active" id="ship-tab-overview">
                  <div class="stack">
                    <div>
                      <h2 class="section-title">舰体参数</h2>
                      ${renderStats(overviewStats)}
                    </div>
                    <div>
                      <h2 class="section-title">跃迁状态</h2>
                      <div class="subcard">
                        <div class="energy">
                          <div class="bar-row">
                            <div class="label" style="margin:0;">跃迁充能</div>
                            <div class="bar-track"><div class="bar-fill" style="width:${chargeRate}%"></div></div>
                            <div class="mini" style="text-align:right;">${escapeHtml(String(currentCharge))} / ${escapeHtml(String(maxCharge))}</div>
                          </div>
                          <div class="grid">
                            <div class="stat"><div class="label">当前充能</div><div class="value">${escapeHtml(String(currentCharge))}</div></div>
                            <div class="stat"><div class="label">最大充能</div><div class="value">${escapeHtml(String(ship["最大充能"] ?? "未登记"))}</div></div>
                            <div class="stat"><div class="label">单次跃迁消耗</div><div class="value">${escapeHtml(String(ship["跃迁消耗"] ?? "未登记"))}</div></div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </section>
                <section class="tab-panel" id="ship-tab-equipment">
                  <h2 class="section-title">舰载装备</h2>
                  ${renderEquipment(ship["装备"])}
                </section>
                <section class="tab-panel" id="ship-tab-systems">
                  <div class="stack">
                    <div>
                      <h2 class="section-title">装配资源</h2>
                      ${renderStats(resourceStats)}
                    </div>
                    <div>
                      <h2 class="section-title">船体效果</h2>
                      ${renderEffects(ship["效果"])}
                    </div>
                  </div>
                </section>
              </section>
            `;
            attachTabs();
          } catch (error) {
            app.innerHTML = `<div class="ship-card" style="padding:20px;"><div class="empty">舰船卡解析失败：${escapeHtml(error.message)}</div></div>`;
          }
        }
        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
        else init();
      </script>
    </body>
    </html>
    ```
  </ship>
