              state.fitting.stargazer = null;
          }

          async function startGame() {
              state.captain.name = document.getElementById('captain-name').value.replace(/^\s+|\s+$/g, "") || "{{user}}";
              state.captain.appearance = document.getElementById('captain-appearance').value.replace(/^\s+|\s+$/g, "");
              document.getElementById('screen-0').classList.remove('active');
              document.getElementById('main-ui').classList.add('flex');
              document.getElementById('main-ui').classList.remove('hidden');
              gameData = await fetchGameData();
              goToPhase(0);
          }

          function goToPhase(index) {
              currentPhaseIndex = index;
              currentCategory = phases[currentPhaseIndex];
              updateNavUI();
              renderPhase();
          }

          function updateNavUI() {
              var info = phaseTitles[currentPhaseIndex];
              var i = 0;
              document.getElementById('phase-title').textContent = info.t;
              document.getElementById('phase-desc').textContent = info.d;
              document.getElementById('phase-help').textContent = info.help;
              for (i = 0; i < phases.length; i++) {
                  document.getElementById('dot-' + (i + 1)).classList.toggle('active', i <= currentPhaseIndex);
              }
              document.getElementById('btn-prev').disabled = currentPhaseIndex === 0;
              document.getElementById('btn-next').textContent = currentPhaseIndex === phases.length - 1 ? "生成协议 >>>" : "继续 >>>";
              renderSummary();
          }

          function renderSummary() {
              var ship = getSelectedShipName() || "未选";
              var fitCount = countKeys(state.fitting.weapons) + countKeys(state.fitting.modules);
              var summary = [];
              summary.push("舰船: " + ship);
              summary.push("装配模块: " + fitCount);
              summary.push("观星者: " + (state.fitting.stargazer ? state.fitting.stargazer._key : "未装配"));
              summary.push("物品: " + state.selections.items.length);
              summary.push("剧情: " + state.selections.init_stories.length);
              document.getElementById('selection-summary').innerHTML = summary.join("<br>");
          }

          function countKeys(obj) {
              var n = 0, k = "";
              for (k in obj) if (Object.prototype.hasOwnProperty.call(obj, k)) n++;
              return n;
          }

          function escapeHtml(value) {
              var str = value === undefined || value === null ? "" : String(value);
              var map = {};
              map["&"] = "&" + "amp;";
              map["<"] = "&" + "lt;";
              map[">"] = "&" + "gt;";
              map['"'] = "&" + "quot;";
              map["'"] = "&" + "#39;";
              return str.replace(/[&<>"']/g, function(ch) { return map[ch]; });
          }

          function formatValue(value) {
              var rows = [], k = "";
              if (value === undefined || value === null || value === "") return "未记录";
              if (Array.isArray(value)) return value.length ? value.map(formatValue).join(" / ") : "无";
              if (typeof value === "object") {
                  for (k in value) if (Object.prototype.hasOwnProperty.call(value, k)) rows.push('<div class="kv-row"><div class="kv-key">' + escapeHtml(k) + '</div><div class="kv-val">' + formatValue(value[k]) + '</div></div>');
                  return rows.join("");
              }
              return escapeHtml(value);
          }

          function previewText(category, item) {
              if (category === "ships") return item["描述"] || ((item["舰船类型"] || "舰船") + " / " + (item["吨位"] || "未知吨位"));
              if (category === "items") return item["描述"] || "未记录描述";
              if (category === "init_stories") return item["描述"] || "未记录描述";
              return "未记录描述";
          }

          function renderBadges(category, item) {
              var badges = [], html = [], i = 0;
              if (category === "ships") { if (item["舰船类型"]) badges.push(item["舰船类型"]); if (item["吨位"]) badges.push(item["吨位"]); }
              if (category === "items" && item["品质"] !== undefined) badges.push("品质 " + item["品质"]);
              if (category === "init_stories" && item["时间"]) badges.push(item["时间"]);
              for (i = 0; i < badges.length; i++) html.push('<span class="text-[10px] px-2 py-1 border border-[var(--border-main)] text-[var(--accent-main)]">' + escapeHtml(badges[i]) + '</span>');
              return html.join(" ");
          }

          function renderPhase() {
              if (currentCategory === "fitting") renderFitting();
              else renderCatalog();
          }

          function renderCatalog() {
              var grid = document.getElementById('catalog-grid');
              var data = gameData[currentCategory] || {};
              var selected = state.selections[currentCategory] || [];
              var entries = [], html = [], key = "", i = 0, j = 0;
              grid.className = "grid-container flex-1";
              for (key in data) if (Object.prototype.hasOwnProperty.call(data, key)) entries.push([key, data[key]]);
              if (!entries.length) { grid.innerHTML = '<div class="panel p-6 text-[var(--text-muted)]">当前分类没有可用数据。</div>'; return; }
              for (i = 0; i < entries.length; i++) {
                  var itemKey = entries[i][0];
                  var item = entries[i][1];
                  var enriched = JSON.parse(JSON.stringify(item));
                  var isSelected = false;
                  enriched._key = itemKey;
                  for (j = 0; j < selected.length; j++) if (selected[j]._key === itemKey) { isSelected = true; break; }
                  html.push('<article class="item-card ' + (isSelected ? 'selected' : '') + '" onclick="openDetailModal(\'' + encodeURIComponent(JSON.stringify(enriched)) + '\')">' +
                      '<div class="flex justify-between items-start gap-2"><h3 class="text-lg font-bold text-[var(--accent-main)]">' + escapeHtml(itemKey) + '</h3></div>' +
                      '<div class="flex flex-wrap gap-1">' + renderBadges(currentCategory, item) + '</div>' +
                      '<div class="text-sm text-[var(--text-muted)] leading-6">' + escapeHtml(previewText(currentCategory, item)) + '</div>' +
                  '</article>');
              }
              grid.innerHTML = html.join("");
          }

          function parseCountMap(config, keys) {
              var map = {}, i = 0, regex, match;
              for (i = 0; i < keys.length; i++) {
                  regex = new RegExp('(\\d+)' + keys[i], 'g');
                  match = regex.exec(config || "");
                  map[keys[i]] = match ? parseInt(match[1], 10) : 0;
              }
              return map;
          }

          function buildWeaponSlots(ship) {
              var counts = parseCountMap(ship["炮位配置"], ["S","M","L","XL","C","T"]);
              var slots = [], key = "", i = 0;
              for (key in counts) if (counts[key] > 0) for (i = 1; i <= counts[key]; i++) slots.push({ id: key + i, mount: key, label: key + i });
              return slots;
          }

          function buildModuleSlots(ship) {
              var counts = parseCountMap(ship["装备槽位配置"], ["H","L"]);
              var slots = [], i = 0;
              for (i = 1; i <= counts["H"]; i++) slots.push({ id: "H" + i, slotType: "H", label: "H" + i });
              for (i = 1; i <= counts["L"]; i++) slots.push({ id: "L" + i, slotType: "L", label: "L" + i });
              return slots;
          }

          function parseRequirement(reqText) {
              var out = { PG: 0, CPU: 0, "吨位": "", "炮位": "无", "装备槽位": "无" };
              var parts = (reqText || "").split("|"), i = 0, segment = "", pair, key, value;
              for (i = 0; i < parts.length; i++) {
                  segment = parts[i].replace(/^\s+|\s+$/g, "");
                  pair = segment.split("：");
                  if (pair.length < 2) pair = segment.split(":");
                  if (pair.length >= 2) {
                      key = pair[0].replace(/^\s+|\s+$/g, "");
                      value = pair.slice(1).join(":").replace(/^\s+|\s+$/g, "");
                      out[key] = value;
                  }
              }
              out.PG = parseFloat(out.PG || 0) || 0;
              out.CPU = parseFloat(out.CPU || 0) || 0;
              return out;
          }

          function parseBitrate(value) {
              var num = parseFloat(String(value || "").replace(/[^0-9.]/g, ""));
              if (!num) return 0;
              if (String(value).indexOf("PB") > -1) return num * 1000;
              return num;
          }

          function parsePlainNumber(value) {
              var num = parseFloat(String(value || "").replace(/[^0-9.]/g, ""));
              return num || 0;
          }

          function firstNonEmpty(values) {
              var i = 0;
              for (i = 0; i < values.length; i++) {
                  if (values[i] !== undefined && values[i] !== null && values[i] !== "") return values[i];
              }
              return "";
          }

          function normalizeStargazerRecord(key, raw) {
              var src = JSON.parse(JSON.stringify(raw || {}));
              var profile = src["静态档案"] || {};
              var perf = profile["性能参数"] || {};
              var prefs = profile["偏好"] || {};
              var normalized = {
                  "种族": src["种族"] || "观星者",
                  "阵营": src["阵营"] || "",
                  "身份": src["身份"] || "",
                  "好感度": src["好感度"] || 0,
                  "想法": src["想法"] || "",
                  "历史": firstNonEmpty([src["历史"], (src["附加信息"] || {})["历史"]]),
                  "型号ID": src["型号ID"] || key || "",
                  "制造商": firstNonEmpty([src["制造商"], profile["制造商"]]),
                  "描述": firstNonEmpty([src["描述"], profile["描述"], src["备注"]]),
                  "外貌": firstNonEmpty([src["外貌"], profile["外貌"]]),
                  "身份标识": firstNonEmpty([src["身份标识"], (profile["身份标识"] || {})["类型"] ? ((profile["身份标识"] || {})["类型"] + " / " + ((profile["身份标识"] || {})["位置"] || "未记录位置")) : ""]),
                  "比特率": firstNonEmpty([src["比特率"], perf["比特率"]]),
                  "精度": firstNonEmpty([src["精度"], perf["精度"]]),
                  "稳态增益": firstNonEmpty([src["稳态增益"], perf["稳态增益"]]),
                  "爆发增益": firstNonEmpty([src["爆发增益"], perf["爆发增益"]]),
                  "特殊效果": src["特殊效果"] || profile["特殊能力"] || {},
                  "性格": src["性格"] || profile["性格"] || [],
                  "喜欢": src["喜欢"] || prefs["喜欢"] || [],
                  "讨厌": src["讨厌"] || prefs["讨厌"] || [],
                  "性癖": src["性癖"] || prefs["性癖"] || [],
                  "外貌记录": src["外貌记录"] || { "身体": "", "胸部": "", "私处": "" },
                  "性经历": src["性经历"] || "未知",
                  "分配舰船": firstNonEmpty([src["分配舰船"], (src["附加信息"] || {})["舰船ID"]])
              };
              normalized._key = key;
              return normalized;
          }

          function normalizeStargazerMap(source) {
              var out = {}, key = "";
              for (key in source) if (Object.prototype.hasOwnProperty.call(source, key)) out[key] = normalizeStargazerRecord(key, source[key]);
              return out;
          }

          function getShipRequirement(shipName) {
              return shipRequirementMap[shipName] || { minStable: 0, minBitrate: 0, maxError: 99, minBurst: 0 };
          }

          function getStargazerMetrics(stargazer) {
              var perf = (((stargazer || {})["静态档案"] || {})["性能参数"]) || {};
              return {
                  stable: parsePlainNumber(firstNonEmpty([(stargazer || {})["稳态增益"], perf["稳态增益"]])),
                  burst: parsePlainNumber(firstNonEmpty([(stargazer || {})["爆发增益"], perf["爆发增益"]])),
                  bitrate: parseBitrate(firstNonEmpty([(stargazer || {})["比特率"], perf["比特率"]])),
                  error: parsePlainNumber(firstNonEmpty([(stargazer || {})["精度"], perf["精度"]]))
              };
          }

          function isStargazerCompatible(shipName, stargazer) {
              var req = getShipRequirement(shipName);
              var m = getStargazerMetrics(stargazer);
              if (m.stable < req.minStable) return "稳态增益不足";
              if (m.bitrate < req.minBitrate) return "比特率不足";
              if (m.error > req.maxError) return "精度误差过高";
              if (m.burst < req.minBurst) return "爆发增益不足";
              return "";
          }

          function getCurrentFittingEntries() {
              var list = [], k = "";
              for (k in state.fitting.weapons) if (Object.prototype.hasOwnProperty.call(state.fitting.weapons, k) && state.fitting.weapons[k]) list.push(state.fitting.weapons[k]);
              for (k in state.fitting.modules) if (Object.prototype.hasOwnProperty.call(state.fitting.modules, k) && state.fitting.modules[k]) list.push(state.fitting.modules[k]);
              return list;
          }

          function getSlotCurrentRequirement(kind, slotId) {
              var current = null;
              if (kind === "weapon") current = state.fitting.weapons[slotId];
              else if (kind === "module") current = state.fitting.modules[slotId];
              if (!current) return null;
              return parseRequirement(current["装配要求"]);
          }

          function getResourceStatus(extraRequirement, removedRequirement) {
              var ship = getSelectedShip();
              var entries = getCurrentFittingEntries();
              var usedPG = 0, usedCPU = 0, i = 0, req;
              var totalPG = ship ? parsePlainNumber(ship["装配资源"] && ship["装配资源"]["PG"]) : 0;
              var totalCPU = ship ? parsePlainNumber(ship["装配资源"] && ship["装配资源"]["CPU"]) : 0;
              for (i = 0; i < entries.length; i++) {
                  req = parseRequirement(entries[i]["装配要求"]);
                  usedPG += req.PG;
                  usedCPU += req.CPU;
              }
              if (removedRequirement) {
                  usedPG -= removedRequirement.PG;
                  usedCPU -= removedRequirement.CPU;
              }
              if (extraRequirement) {
                  usedPG += extraRequirement.PG;
                  usedCPU += extraRequirement.CPU;
              }
              return {
                  totalPG: totalPG,
                  totalCPU: totalCPU,
                  usedPG: usedPG,
                  usedCPU: usedCPU,
                  remainPG: totalPG - usedPG,
                  remainCPU: totalCPU - usedCPU
              };
          }

          function buildSlotButton(x, y, label, text, className, clickCode) {
              return '<button class="ring-slot ' + className + '" style="left:' + x + 'px;top:' + y + 'px;" onclick="' + clickCode + '"><span class="slot-name">' + escapeHtml(label) + '</span><span class="slot-text">' + escapeHtml(text) + '</span></button>';
          }

          function buildRingPositions(count, radius, startDeg, endDeg, centerX, centerY) {
              var points = [], i = 0, deg, rad;
              if (count <= 0) return points;
              if (count === 1) {
                  deg = (startDeg + endDeg) / 2;
                  rad = deg * Math.PI / 180;
                  points.push({ x: centerX + Math.cos(rad) * radius, y: centerY + Math.sin(rad) * radius });
                  return points;
              }
              for (i = 0; i < count; i++) {
                  deg = startDeg + (endDeg - startDeg) * (i / (count - 1));
                  rad = deg * Math.PI / 180;
                  points.push({ x: centerX + Math.cos(rad) * radius, y: centerY + Math.sin(rad) * radius });
              }
              return points;
          }

          function renderFitting() {
              var ship = getSelectedShip();
              var grid = document.getElementById('catalog-grid');
              var centerX = 360, centerY = 370;
              var weapons, modules, weaponPos, highSlots, lowSlots, highPos, lowPos;
              var i = 0, weaponHtml = [], moduleHtml = [], fitList = [], status, stargazerLabel;
              if (!ship) {
                  grid.innerHTML = '<div class="panel p-6 text-[var(--text-muted)]">请先返回上一步选择舰船。</div>';
                  return;
              }
              weapons = buildWeaponSlots(ship);
              modules = buildModuleSlots(ship);
              weaponPos = buildRingPositions(weapons.length, 250, -160, 160, centerX, centerY);
              highSlots = [];
              lowSlots = [];
              for (i = 0; i < modules.length; i++) {
                  if (modules[i].slotType === "H") highSlots.push(modules[i]);
                  else if (modules[i].slotType === "L") lowSlots.push(modules[i]);
              }
              highPos = buildRingPositions(highSlots.length, 165, 110, 250, centerX, centerY);
              lowPos = buildRingPositions(lowSlots.length, 165, -70, 70, centerX, centerY);
              for (i = 0; i < weapons.length; i++) {
                  var w = state.fitting.weapons[weapons[i].id];
                  weaponHtml.push(buildSlotButton(weaponPos[i].x, weaponPos[i].y, weapons[i].label, w ? w.name : ("空槽 / " + weapons[i].mount), w ? "filled" : "empty", "openFittingSelector(\\'weapon\\',\\'" + weapons[i].id + "\\')"));
              }
              for (i = 0; i < highSlots.length; i++) {
                  var h = state.fitting.modules[highSlots[i].id];
                  moduleHtml.push(buildSlotButton(highPos[i].x, highPos[i].y, highSlots[i].label, h ? h.name : "高功率槽", h ? "filled" : "empty", "openFittingSelector(\\'module\\',\\'" + highSlots[i].id + "\\')"));
              }
              for (i = 0; i < lowSlots.length; i++) {
                  var l = state.fitting.modules[lowSlots[i].id];
                  moduleHtml.push(buildSlotButton(lowPos[i].x, lowPos[i].y, lowSlots[i].label, l ? l.name : "低功率槽", l ? "filled" : "empty", "openFittingSelector(\\'module\\',\\'" + lowSlots[i].id + "\\')"));
              }
              status = getResourceStatus();
              for (i = 0; i < weapons.length; i++) if (state.fitting.weapons[weapons[i].id]) fitList.push('<div class="fit-row">' + escapeHtml(weapons[i].label) + ' / ' + escapeHtml(state.fitting.weapons[weapons[i].id].name) + '</div>');
              for (i = 0; i < modules.length; i++) if (state.fitting.modules[modules[i].id]) fitList.push('<div class="fit-row">' + escapeHtml(modules[i].label) + ' / ' + escapeHtml(state.fitting.modules[modules[i].id].name) + '</div>');
              stargazerLabel = state.fitting.stargazer ? state.fitting.stargazer._key : "点击装配观星者";
              grid.className = "flex-1";
              grid.innerHTML = '<div class="fitting-shell">' +
                  '<div class="fitting-stage">' +
                      weaponHtml.join("") +
                      moduleHtml.join("") +
                      '<button class="center-core" onclick="openFittingSelector(\\'stargazer\\',\\'CENTER\\')"><strong>' + escapeHtml(stargazerLabel) + '</strong><small>' + escapeHtml(ship._key) + ' / 中心接口</small></button>' +
                  '</div>' +
                  '<div class="fitting-side">' +
                      '<div class="panel p-4"><div class="text-lg font-bold text-[var(--accent-main)]">' + escapeHtml(ship._key) + '</div><div class="text-sm text-[var(--text-muted)] mt-2">' + escapeHtml(ship["炮位配置"] || "") + ' / ' + escapeHtml(ship["装备槽位配置"] || "") + '</div></div>' +
                      '<div class="panel p-4"><div class="resource-grid">' +
                          '<div class="resource-box"><strong>PG</strong><div>总计 ' + status.totalPG + '</div><div>已用 ' + status.usedPG + '</div><div>剩余 ' + status.remainPG + '</div></div>' +
                          '<div class="resource-box"><strong>CPU</strong><div>总计 ' + status.totalCPU + '</div><div>已用 ' + status.usedCPU + '</div><div>剩余 ' + status.remainCPU + '</div></div>' +
                      '</div></div>' +
                      '<div class="panel p-4"><div class="text-sm text-[var(--accent-main)] mb-2">已装配清单</div><div class="fit-list">' + (fitList.length ? fitList.join("") : '<div class="fit-row">尚未装配模块</div>') + '</div></div>' +
                  '</div>' +
              '</div>';
          }

          function openDetailModal(encoded) {
              var clone = null;
              modalMode = "detail";
              selectorContext = null;
              currentViewingItem = JSON.parse(decodeURIComponent(encoded));
              clone = JSON.parse(JSON.stringify(currentViewingItem));
              delete clone._key;
              document.getElementById('modal-title').textContent = currentViewingItem._key;
              document.getElementById('modal-body').innerHTML = formatValue(clone);
              document.getElementById('modal-primary-action').style.display = 'inline-block';
              document.getElementById('modal-primary-action').textContent = '选择';
              document.getElementById('modal-details').style.display = 'flex';
          }

          function openFittingSelector(kind, slotId) {
              var ship = getSelectedShip(), title = "", candidates = [], i = 0, slotType = "";
              if (!ship) return;
              modalMode = "selector";
              selectorContext = { kind: kind, slotId: slotId };
              if (kind === "weapon") {
                  var mount = slotId.replace(/[0-9]/g, "");
                  title = "选择武器 / " + slotId;
                  for (i = 0; i < fittingLibrary.length; i++) if (fittingLibrary[i].slotFamily === "weapon" && fittingLibrary[i].mount === mount) candidates.push(fittingLibrary[i]);
              } else if (kind === "module") {
                  slotType = slotId.charAt(0);
                  title = "选择模块 / " + slotId;
                  for (i = 0; i < fittingLibrary.length; i++) if (fittingLibrary[i].slotFamily === "module" && fittingLibrary[i].slotType === slotType) candidates.push(fittingLibrary[i]);
              } else {
                  title = "选择观星者 / 中央接口";
                  for (i = 0; i < getStargazerEntries().length; i++) candidates.push(getStargazerEntries()[i]);
              }
              document.getElementById('modal-title').textContent = title;
              document.getElementById('modal-body').innerHTML = renderCandidateList(kind, candidates);
              document.getElementById('modal-primary-action').style.display = 'none';
              document.getElementById('modal-details').style.display = 'flex';
          }

          function getStargazerEntries() {
              var out = [], key = "";
              for (key in (gameData.stargazers || {})) if (Object.prototype.hasOwnProperty.call(gameData.stargazers, key)) out.push(normalizeStargazerRecord(key, gameData.stargazers[key]));
              return out;
          }

          function renderCandidateList(kind, candidates) {
              var html = ['<div class="candidate-list">'], i = 0;
              if (kind !== "stargazer") html.push('<button class="btn px-3 py-2 mb-2" onclick="clearFittingSlot()">清空当前槽位</button>');
              else html.push('<button class="btn px-3 py-2 mb-2" onclick="clearFittingStargazer()">清空观星者</button>');
              for (i = 0; i < candidates.length; i++) {
                  var candidate = JSON.parse(JSON.stringify(candidates[i]));
                  if (!candidate._key) candidate._key = candidate.name;
                  var evalResult = evaluateCandidate(kind, candidate);
                  html.push('<div class="candidate-card ' + (evalResult.ok ? '' : 'disabled') + '">' +
                      '<div class="head"><strong>' + escapeHtml(candidate._key || candidate.name) + '</strong><span>' + escapeHtml(kind === "stargazer" ? (candidate["型号ID"] || "") : (candidate["品质"] !== undefined ? ("品质 " + candidate["品质"]) : "")) + '</span></div>' +
                      '<div class="meta">' + escapeHtml(kind === "stargazer" ? buildStargazerMeta(candidate) : candidate["装配要求"]) + '</div>' +
                      '<div class="desc">' + escapeHtml(kind === "stargazer" ? previewStargazer(candidate) : (candidate["描述"] || "")) + '</div>' +
                      (evalResult.ok ? '<div class="mt-3"><button class="btn px-3 py-2" onclick="applyFittingSelection(\'' + kind + '\', \'' + escapeJsString(encodeURIComponent(JSON.stringify(candidate))) + '\')">装配</button></div>' : '<div class="reason">' + escapeHtml(evalResult.reason) + '</div>') +
                  '</div>');
              }
              html.push('</div>');
              return html.join("");
          }

          function buildStargazerMeta(candidate) {
              var m = getStargazerMetrics(candidate);
              return '稳态 ' + m.stable + ' TW/mV | 爆发 ' + m.burst + ' TW/mV | 比特率 ' + m.bitrate + ' TB/s | 误差 ' + m.error;
          }

          function previewStargazer(candidate) {
              if (candidate["外貌"]) return candidate["外貌"];
              if (candidate["描述"]) return candidate["描述"];
              if (candidate["静态档案"] && candidate["静态档案"]["描述"]) return candidate["静态档案"]["描述"];
              return "未记录描述";
          }

          function evaluateCandidate(kind, candidate) {
              var ship = getSelectedShip(), resourceStatus, req, compatible, removedRequirement;
              if (kind === "stargazer") {
                  compatible = isStargazerCompatible(getSelectedShipName(), candidate);
                  if (compatible) return { ok: false, reason: compatible };
                  return { ok: true, reason: "" };
              }
              req = parseRequirement(candidate["装配要求"]);
              removedRequirement = getSlotCurrentRequirement(kind, selectorContext.slotId);
              resourceStatus = getResourceStatus(req, removedRequirement);
              if (resourceStatus.remainPG < 0) return { ok: false, reason: "PG 不足" };
              if (resourceStatus.remainCPU < 0) return { ok: false, reason: "CPU 不足" };
              if (kind === "weapon") {
                  if ((req["炮位"] || "").indexOf(selectorContext.slotId.replace(/[0-9]/g, "")) === -1 && req["炮位"] !== "无") return { ok: false, reason: "炮位尺寸不匹配" };
              } else {
                  if ((req["装备槽位"] || "").indexOf(selectorContext.slotId.charAt(0)) === -1 && req["装备槽位"] !== "无") return { ok: false, reason: "装备槽位不匹配" };
              }
              return { ok: true, reason: "" };
          }

          function applyFittingSelection(kind, encoded) {
              var candidate = JSON.parse(decodeURIComponent(encoded));
              if (kind === "weapon") state.fitting.weapons[selectorContext.slotId] = sanitizeEquipment(candidate);
              else if (kind === "module") state.fitting.modules[selectorContext.slotId] = sanitizeEquipment(candidate);
              else state.fitting.stargazer = candidate;
              closeModal();
              renderSummary();
              renderPhase();
          }

          function sanitizeEquipment(item) {
              var clone = JSON.parse(JSON.stringify(item));
              delete clone._key;
              delete clone.slotFamily;
              delete clone.slotType;
              delete clone.mount;
              return clone;
          }

          function clearFittingSlot() {
              if (!selectorContext) return;
              if (selectorContext.kind === "weapon") delete state.fitting.weapons[selectorContext.slotId];
              else delete state.fitting.modules[selectorContext.slotId];
              closeModal();
              renderSummary();
              renderPhase();
          }

          function clearFittingStargazer() {
              state.fitting.stargazer = null;
              closeModal();
              renderSummary();
              renderPhase();
          }

          function escapeJsString(value) {
              return String(value).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
          }

          function closeModal() {
              document.getElementById('modal-details').style.display = 'none';
          }

          function selectCurrentItem() {
              var list = state.selections[currentCategory];
              var idx = -1, limit = selectionLimits[currentCategory], i = 0;
              for (i = 0; i < list.length; i++) if (list[i]._key === currentViewingItem._key) { idx = i; break; }
              if (idx > -1) list.splice(idx, 1);
              else if (limit === 1) {
                  state.selections[currentCategory] = [currentViewingItem];
                  if (currentCategory === "ships") resetFitting();
              } else list.push(currentViewingItem);
              closeModal();
              renderSummary();
              renderPhase();
          }

          function prevPhase() {
              if (currentPhaseIndex > 0) goToPhase(currentPhaseIndex - 1);
          }

          function nextPhase() {
              if (currentCategory === "ships" && state.selections.ships.length === 0) { alert("必须先选择一艘起始舰船。"); return; }
              if (currentCategory === "fitting" && !state.fitting.stargazer) { alert("必须在装配中心选择一名观星者。"); return; }
              if (currentCategory === "init_stories" && state.selections.init_stories.length === 0) { alert("必须选择一个开局剧情。"); return; }
              if (currentPhaseIndex < phases.length - 1) goToPhase(currentPhaseIndex + 1);
              else exportData();
          }

          function formatSelection(arr) {
              var res = {}, i = 0;
              for (i = 0; i < arr.length; i++) { var item = JSON.parse(JSON.stringify(arr[i])); var key = item._key; delete item._key; res[key] = item; }
              return res;
          }

          function buildEquippedShip() {
              var ship = JSON.parse(JSON.stringify(getSelectedShip()));
              var weaponSlots = state.fitting.weapons, moduleSlots = state.fitting.modules, k = "", name, clone;
              ship["驾驶员"] = state.captain.name;
              ship["是否旗舰"] = true;
              ship["观星者接口角色"] = state.fitting.stargazer ? state.fitting.stargazer._key : "";
              ship["装备"] = {};
              for (k in weaponSlots) if (Object.prototype.hasOwnProperty.call(weaponSlots, k) && weaponSlots[k]) { name = k + " " + (weaponSlots[k]["描述"] ? weaponSlots[k]["描述"].split("。")[0] : "武器"); clone = JSON.parse(JSON.stringify(weaponSlots[k])); ship["装备"][name] = clone; }
              for (k in moduleSlots) if (Object.prototype.hasOwnProperty.call(moduleSlots, k) && moduleSlots[k]) { name = k + " " + (moduleSlots[k]["描述"] ? moduleSlots[k]["描述"].split("。")[0] : "模块"); clone = JSON.parse(JSON.stringify(moduleSlots[k])); ship["装备"][name] = clone; }
              return ship;
          }

          function buildEquippedStargazer() {
              var stargazer = normalizeStargazerRecord(state.fitting.stargazer._key, state.fitting.stargazer);
              stargazer["分配舰船"] = getSelectedShipName();
              delete stargazer._key;
              return stargazer;
          }

          function exportData() {
              var ship = buildEquippedShip();
              var stargazer = buildEquippedStargazer();
              var story = state.selections.init_stories[0];
              var items = formatSelection(state.selections.items);
              var yamlStr = "";
              var cb = String.fromCharCode(96, 96, 96);
              var promptStr = "";
              var finalPayload = null;
              if (!story || !ship || !stargazer) { alert("请完成舰船、装配、观星者与开局剧情后再生成协议。"); return; }
              finalPayload = {
                  System: { Module: "Azure_Sector_Init", Version: "2.1.0" },
                  Captain: { Name: state.captain.name, Appearance: state.captain.appearance },
                  ships: (function(){ var obj = {}; obj[getSelectedShipName()] = ship; return obj; })(),
                  stargazers: (function(){ var obj = {}; obj[state.fitting.stargazer._key] = JSON.parse(JSON.stringify(stargazer)); return obj; })(),
                  items: items,
                  init_stories: formatSelection(state.selections.init_stories)
              };
              yamlStr = jsyaml.dump(finalPayload);
              promptStr = `[系统指令：玩家已完成新版开局装配。请严格根据以下 YAML 初始化本次开局。]

              1. 先读取 ships 与 stargazers。舰船已经完成装配，必须原样使用其 装备、驾驶员、是否旗舰、观星者接口角色。
              2. 将 ships 写入 主角.舰船，将 items 写入 主角.个人物品，将 stargazers 写入 主角.可攻略角色。
              3. 开局剧情以 init_stories 为唯一叙事锚点，必须根据其中的 时间、地点、描述 开场。
              4. 主角姓名使用 Captain.Name。如果 Captain.Appearance 非空，则写入 主角.外貌。
              5. 将 主角.位置 设置为所选开局剧情中的 地点。
              6. 输出开场叙事后，立刻进行相应的变量更新，并严格遵守当前世界书中的主角、舰船、角色、新闻更新规则。
              
              以下为初始化配置：
              ${cb}yaml
              ${yamlStr}
              ${cb}
              请开始输出：`;
              if (typeof createChatMessages !== "undefined") {
                  try { createChatMessages([{ role: "user", message: promptStr }]); document.getElementById('btn-next').textContent = "已注入 (SENT)"; } catch (e) { console.error(e); }
              } else if (navigator.clipboard) {
                  navigator.clipboard.writeText(promptStr).then(function() { alert("协议已复制到剪贴板，请手动粘贴到聊天框。"); }).catch(function() { console.log(promptStr); alert("无法写入剪贴板，请按 F12 从控制台复制。"); });
              } else console.log(promptStr);
          }

      </script>
  </body>
  </html>
  ```
