      <div id="screen-0" class="screen active justify-center items-center relative overflow-hidden min-h-screen">
          <h1 class="text-5xl font-bold text-[var(--accent-main)] mb-2 tracking-widest z-10" style="text-shadow:var(--glow-main);">蔚蓝星区</h1>
          <p class="text-[var(--text-muted)] font-mono mb-10 tracking-widest uppercase z-10">STARGAZER // STARTUP SEQUENCE</p>
          <button class="btn px-8 py-3 text-xl tracking-widest z-10" onclick="startGame()">建立连接 [CONNECT]</button>
          <p id="load-status" class="font-mono text-xs text-[var(--text-muted)] mt-4 z-10">等待读取 __init_data__。</p>
      </div>
      <div id="main-ui" class="hidden flex-col flex-1 min-h-screen p-4 relative">
          <div class="flex justify-between items-end border-b border-[var(--border-main)] pb-2 mb-4 shrink-0"><div><h2 class="text-2xl font-bold text-[var(--accent-main)]" id="phase-title">PHASE_1: 舰船选择</h2><div class="text-xs text-[var(--text-muted)] font-mono" id="phase-desc">Select starting ship</div></div><div class="text-right font-mono"><div class="text-[var(--accent-main)] font-bold text-lg">TP: <span id="tp-display">24</span></div></div></div>
          <div class="step-indicator shrink-0"><div class="step-dot active" id="dot-1"></div><div class="step-dot" id="dot-2"></div><div class="step-dot" id="dot-3"></div><div class="step-dot" id="dot-4"></div></div>
          <div id="screen-1" class="screen !p-0 flex-1 overflow-y-auto min-h-[620px]"><div class="grid grid-cols-1 xl:grid-cols-[1fr_360px] gap-6 h-full"><div class="panel p-4 flex flex-col gap-4 min-h-0"><div class="grid grid-cols-1 md:grid-cols-2 gap-3 shrink-0"><div><label class="text-xs text-[var(--text-muted)]">舰船名称</label><input id="ship-name" class="w-full" value=""></div><div><label class="text-xs text-[var(--text-muted)]">筛选</label><input id="search-bar" class="w-full" placeholder="搜索舰船" oninput="renderCurrentPhase()"></div></div><div id="ship-grid" class="grid-container min-h-0"></div></div><div id="summary-1" class="panel p-4 font-mono text-sm overflow-y-auto"></div></div></div>
          <div id="screen-2" class="screen !p-0 flex-1 overflow-y-auto min-h-[620px]"><div class="grid grid-cols-1 xl:grid-cols-[1fr_360px] gap-6 h-full"><div class="panel p-4 flex flex-col gap-4 min-h-0"><div><label class="text-xs text-[var(--text-muted)]">观星者称呼</label><input id="stargazer-name" class="w-full" value=""></div><div id="stargazer-grid" class="grid-container min-h-0"></div></div><div id="summary-2" class="panel p-4 font-mono text-sm overflow-y-auto"></div></div></div>
          <div id="screen-3" class="screen !p-0 flex-1 overflow-y-auto min-h-[620px]"><div class="grid grid-cols-1 xl:grid-cols-[1fr_360px] gap-6 h-full"><div class="panel p-4 flex flex-col gap-4 min-h-0"><div id="preset-grid" class="grid-container min-h-0"></div></div><div id="summary-3" class="panel p-4 font-mono text-sm overflow-y-auto"></div></div></div>
          <div id="screen-4" class="screen !p-0 flex-1 overflow-y-auto min-h-[620px]"><div class="grid grid-cols-1 xl:grid-cols-[1fr_360px] gap-6 h-full"><div class="panel p-4 flex flex-col gap-4 min-h-0"><div id="story-grid" class="grid-container min-h-0"></div></div><div id="summary-4" class="panel p-4 font-mono text-sm overflow-y-auto"></div></div></div>
          <div class="flex justify-between items-center pt-4 border-t border-[var(--border-main)] shrink-0 mt-4"><button class="btn px-6 py-2" id="btn-prev" onclick="prevPhase()"><<< 后退 (BACK)</button><button class="btn px-6 py-2 bg-[rgba(0,212,255,0.1)]" id="btn-next" onclick="nextPhase()">继续 (NEXT) >>></button></div>
      </div>
      <script>
          var gameData = null; var currentPhaseIndex = 1; var phaseTitles = ['', { t:'PHASE_1: 舰船选择', d:'Select starting ship' }, { t:'PHASE_2: 观星者链接', d:'Select stargazer interface' }, { t:'PHASE_3: 技能预设', d:'Select skill preset' }, { t:'PHASE_4: 开局锚点', d:'Select beginning plot' }]; var state = { tp:24, shipKey:'', stargazerKey:'', skillPreset:'', skills:{}, storyKey:'' };
          function esc(v){ return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
          function clone(v){ return JSON.parse(JSON.stringify(v == null ? null : v)); }
          function getApi(name){ try { if (window[name]) return window[name]; } catch(e){} try { if (parent && parent[name]) return parent[name]; } catch(e){} return null; }
          function entryMatches(e){ var n = String((e && (e.name || e.comment)) || '').toLowerCase(); return n === '__init_data__'; }
          async function fetchGameData(){ var api = getApi('getWorldbook'); var bookApi = getApi('getCurrentCharPrimaryLorebook'); var bookName = bookApi ? bookApi() : '蔚蓝星域的观星者 下世代'; try { if (!api) throw new Error('getWorldbook unavailable'); var wb = await api(bookName); var entry = wb.find(entryMatches); if (entry && entry.content) return JSON.parse(entry.content); throw new Error('__init_data__ not found in ' + bookName); } catch(e) { console.warn('Using fallback JSON data. Reason:', e.message); document.getElementById('load-status').textContent = '世界书读取失败，已使用内置数据：' + e.message; return JSON.parse(document.getElementById('fallback-json').textContent); } }
          async function startGame(){ document.getElementById('screen-0').classList.remove('active'); document.getElementById('main-ui').classList.remove('hidden'); document.getElementById('main-ui').classList.add('flex'); gameData = await fetchGameData(); state.tp = 24; document.getElementById('ship-name').value = '{{user}}号'; goToPhase(1); }
          function priceOf(kind, key){ if (kind === 'ship') return Number(((gameData.ships || {})[key] || {})['转生点价格'] || 0); if (kind === 'stargazer') return Number(((gameData.stargazers || {})[key] || {})['转生点价格'] || 0); if (kind === 'skills') return Object.values(state.skills || {}).reduce(function(a,b){return a + Number(b || 0);}, 0); return 0; }
          function usedTp(){ return priceOf('ship', state.shipKey) + priceOf('stargazer', state.stargazerKey) + priceOf('skills'); } function remainingTp(){ return state.tp - usedTp(); } function kv(k,v){ return '<div class="kv-row"><div class="kv-key">' + esc(k) + '</div><div class="kv-val">' + esc(v) + '</div></div>'; }
          function renderSummary(){ var html = '<h3 class="text-[var(--accent-main)] mb-3">当前配置</h3>' + kv('剩余TP', remainingTp() + ' / ' + state.tp) + kv('舰船', state.shipKey || '未选择') + kv('舰名', document.getElementById('ship-name') ? document.getElementById('ship-name').value : '') + kv('观星者', state.stargazerKey || '未选择') + kv('称呼', document.getElementById('stargazer-name') ? document.getElementById('stargazer-name').value : '') + kv('技能', state.skillPreset || '未选择') + kv('开局', state.storyKey || '未选择'); document.getElementById('tp-display').textContent = String(remainingTp()); for (var i=1; i<=4; i++) { var node = document.getElementById('summary-' + i); if (node) node.innerHTML = html; } }
          function renderShips(){ var data = gameData.ships || {}; var q = (document.getElementById('search-bar').value || '').toLowerCase(); var html = ''; Object.keys(data).forEach(function(key){ if (q && key.toLowerCase().indexOf(q) === -1) return; var item = data[key] || {}; var selected = state.shipKey === key ? ' selected' : ''; html += '<div class="item-card' + selected + '" data-ship="' + esc(key) + '"><strong class="text-[var(--accent-main)]">' + esc(key) + '</strong><div class="flex gap-1 flex-wrap"><span class="badge">' + esc(item['舰船类型'] || '') + '</span><span class="badge">' + esc(item['吨位'] || '') + '</span><span class="badge">' + priceOf('ship', key) + ' TP</span></div>' + kv('制造商', item['制造商'] || '') + kv('炮位', item['炮位配置'] || '') + kv('槽位', item['装备槽位配置'] || '') + '<div class="text-xs text-[var(--text-muted)] overflow-hidden">' + esc(item['描述'] || '') + '</div></div>'; }); document.getElementById('ship-grid').innerHTML = html || '<div class="text-[var(--text-muted)]">没有可选舰船。</div>'; }
          function selectShip(key){ var oldCost = priceOf('ship', state.shipKey); var newCost = priceOf('ship', key); if (remainingTp() + oldCost - newCost < 0) return alert('转生点不足。'); state.shipKey = key; if (!document.getElementById('ship-name').value) document.getElementById('ship-name').value = key; renderCurrentPhase(); }
          function renderStargazers(){ var data = gameData.stargazers || {}; var html = ''; Object.keys(data).forEach(function(key){ var item = data[key] || {}; var selected = state.stargazerKey === key ? ' selected' : ''; html += '<div class="item-card' + selected + '" data-stargazer="' + esc(key) + '"><strong class="text-[var(--accent-main)]">' + esc(key) + '</strong><div class="flex gap-1 flex-wrap"><span class="badge">' + esc(item['阵营'] || '') + '</span><span class="badge">' + priceOf('stargazer', key) + ' TP</span></div>' + kv('身份', item['身份'] || '') + kv('型号', item['型号ID'] || '') + '<div class="text-xs text-[var(--text-muted)] overflow-hidden">' + esc(item['备注'] || item['外貌'] || '') + '</div></div>'; }); document.getElementById('stargazer-grid').innerHTML = html || '<div class="text-[var(--text-muted)]">没有可选观星者。</div>'; }
          function selectStargazer(key){ var oldCost = priceOf('stargazer', state.stargazerKey); var newCost = priceOf('stargazer', key); if (remainingTp() + oldCost - newCost < 0) return alert('转生点不足。'); state.stargazerKey = key; if (!document.getElementById('stargazer-name').value) document.getElementById('stargazer-name').value = key; renderCurrentPhase(); }
          function renderPresets(){ var data = gameData.skill_presets || {}; var html = ''; Object.keys(data).forEach(function(key){ var item = data[key] || {}; var cost = Object.values(item).reduce(function(a,b){return a + Number(b || 0);}, 0); var selected = state.skillPreset === key ? ' selected' : ''; html += '<div class="item-card' + selected + '" data-preset="' + esc(key) + '"><strong class="text-[var(--accent-main)]">' + esc(key) + '</strong><span class="badge">' + cost + ' TP</span>'; Object.keys(item).forEach(function(skill){ if (item[skill]) html += kv(skill, 'LV ' + item[skill]); }); html += '</div>'; }); document.getElementById('preset-grid').innerHTML = html || '<div class="text-[var(--text-muted)]">没有技能预设。</div>'; }
          function selectPreset(key){ var oldCost = priceOf('skills'); var next = clone((gameData.skill_presets || {})[key] || {}); var newCost = Object.values(next).reduce(function(a,b){return a + Number(b || 0);}, 0); if (remainingTp() + oldCost - newCost < 0) return alert('转生点不足。'); state.skillPreset = key; state.skills = next; renderCurrentPhase(); }
          function renderStories(){ var data = gameData.init_stories || {}; var html = ''; Object.keys(data).forEach(function(key){ var item = data[key] || {}; var selected = state.storyKey === key ? ' selected' : ''; html += '<div class="item-card' + selected + '" data-story="' + esc(key) + '"><strong class="text-[var(--accent-main)]">' + esc(key) + '</strong>' + kv('位置', item['位置'] || '') + '<div class="text-xs text-[var(--text-muted)] overflow-hidden">' + esc(item['描述'] || item['前置剧情'] || '') + '</div></div>'; }); document.getElementById('story-grid').innerHTML = html || '<div class="text-[var(--text-muted)]">没有开局剧情。</div>'; }
          function selectStory(key){ state.storyKey = key; renderCurrentPhase(); }
          function renderCurrentPhase(){ if (!gameData) return; document.getElementById('phase-title').textContent = phaseTitles[currentPhaseIndex].t; document.getElementById('phase-desc').textContent = phaseTitles[currentPhaseIndex].d; for (var i=1;i<=4;i++) { document.getElementById('screen-' + i).classList.toggle('active', i === currentPhaseIndex); document.getElementById('dot-' + i).className = i <= currentPhaseIndex ? 'step-dot active' : 'step-dot'; } document.getElementById('btn-prev').style.visibility = currentPhaseIndex === 1 ? 'hidden' : 'visible'; document.getElementById('btn-next').textContent = currentPhaseIndex === 4 ? '生成协议 (FINISH) >>>' : '继续 (NEXT) >>>'; if (currentPhaseIndex === 1) renderShips(); if (currentPhaseIndex === 2) renderStargazers(); if (currentPhaseIndex === 3) renderPresets(); if (currentPhaseIndex === 4) renderStories(); renderSummary(); }
          function goToPhase(n){ currentPhaseIndex = Math.max(1, Math.min(4, n)); renderCurrentPhase(); } function prevPhase(){ goToPhase(currentPhaseIndex - 1); }
          function nextPhase(){ if (currentPhaseIndex === 1 && (!state.shipKey || !document.getElementById('ship-name').value.trim())) return alert('请先选择舰船并填写舰名。'); if (currentPhaseIndex === 2 && !state.stargazerKey) return alert('请先选择观星者。'); if (currentPhaseIndex === 3 && remainingTp() < 0) return alert('转生点不足。'); if (currentPhaseIndex < 4) return goToPhase(currentPhaseIndex + 1); if (!state.storyKey) return alert('请先选择开局剧情。'); exportData(); }
