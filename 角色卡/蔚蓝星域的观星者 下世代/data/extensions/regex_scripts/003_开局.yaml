          :root { --bg-dark:#05070f; --bg-panel:#0b1021; --border-main:#1f305c; --accent-main:#00d4ff; --text-main:#e2e8f0; --text-muted:#64748b; --glow-main:0 0 12px rgba(0,212,255,.5); }
          body { background:var(--bg-dark); color:var(--text-main); font-family:'Noto Sans SC',sans-serif; margin:0; min-height:100vh; overflow:auto; }
          .font-mono { font-family:'JetBrains Mono',monospace; }
          .panel { background:rgba(11,16,33,.82); border:1px solid var(--border-main); backdrop-filter:blur(5px); }
          .btn { background:transparent; border:1px solid var(--border-main); color:var(--accent-main); text-transform:uppercase; font-weight:bold; cursor:pointer; transition:all .2s; }
          .btn:hover:not(:disabled) { background:var(--accent-main); color:#000; box-shadow:var(--glow-main); }
          .screen { display:none; height:100%; flex-direction:column; padding:20px; box-sizing:border-box; }
          .screen.active { display:flex; animation:fadeIn .35s ease-out; }
          @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
          input { background:rgba(0,212,255,.05); border:1px solid var(--border-main); color:#fff; padding:8px; outline:none; font-family:'JetBrains Mono',monospace; }
          .grid-container { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); grid-auto-rows:200px; align-content:start; gap:20px; overflow-y:auto; padding-right:5px; flex:1; }
          .item-card { background:rgba(13,20,40,.62); border:1px solid var(--border-main); padding:10px; cursor:pointer; transition:transform .1s,border-color .2s; display:flex; flex-direction:column; gap:5px; height:100%; }
          .item-card:hover { border-color:var(--accent-main); transform:scale(1.02); }
          .item-card.selected { border:2px solid var(--accent-main); background:rgba(0,80,120,.4); box-shadow:var(--glow-main); }
          .kv-row { display:flex; font-size:.85rem; border-bottom:1px dashed rgba(0,212,255,.2); padding:4px 0; }
          .kv-key { color:var(--text-muted); width:88px; flex-shrink:0; }
          .kv-val { color:var(--text-main); flex-grow:1; word-break:break-word; }
          .step-indicator { display:flex; gap:5px; margin-bottom:15px; }
          .step-dot { flex:1; height:4px; background:var(--border-main); }
          .step-dot.active { background:var(--accent-main); box-shadow:var(--glow-main); }
          .badge { border:1px solid var(--border-main); color:var(--text-muted); padding:2px 6px; font-size:11px; }
