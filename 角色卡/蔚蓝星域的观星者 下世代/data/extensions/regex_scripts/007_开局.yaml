          function openCustomFormatter(kind, sourceItem, sourceType, sourceIndex) {
              customFormatterContext = { kind: kind, source: sourceType || "manual", index: sourceIndex === undefined ? -1 : sourceIndex, key: sourceItem && sourceItem._key ? sourceItem._key : "" };
              document.getElementById('custom-formatter-error').style.display = 'none';
              document.getElementById('custom-formatter-error').textContent = '';
              document.getElementById('custom-name-input').value = '';
              document.getElementById('custom-module-kind-row').style.display = kind === 'module' ? 'grid' : 'none';
              if (kind === 'ship') {
                  document.getElementById('custom-formatter-title').textContent = '自定义舰船 Formatter';
                  document.getElementById('custom-formatter-hint').innerHTML = '填写舰船名称与 JSON/YAML 内容。必须包含 <b>炮位配置</b>、<b>装备槽位配置</b>、<b>装配资源.PG</b>、<b>装配资源.CPU</b>。加入后会直接进入舰船列表并自动选中。';
                  document.getElementById('custom-name-input').placeholder = '例如：苍蓝试作护卫舰';
                  document.getElementById('custom-json-input').value = JSON.stringify(sourceItem || getCustomShipTemplate(), null, 2);
              } else if (kind === 'stargazer') {
                  document.getElementById('custom-formatter-title').textContent = sourceItem ? '编辑观星者 Formatter' : '自定义观星者 Formatter';
                  document.getElementById('custom-formatter-hint').innerHTML = '填写观星者名称与 JSON/YAML 内容。必须包含 <b>比特率</b>、<b>精度</b>、<b>稳态增益</b>、<b>爆发增益</b>。保存后会写入本 session 的观星者列表，可立即装配。';
                  document.getElementById('custom-name-input').placeholder = '例如：粉心试作观星者';
                  document.getElementById('custom-name-input').value = sourceItem && sourceItem._key ? sourceItem._key : '';
                  document.getElementById('custom-json-input').value = JSON.stringify(sourceItem || getCustomStargazerTemplate(), null, 2);
              } else {
                  document.getElementById('custom-formatter-title').textContent = '自定义模块 Formatter';
                  document.getElementById('custom-formatter-hint').innerHTML = '填写模块名称与 JSON/YAML 内容。武器写入 weapons 并按 <b>炮位</b> 进入武器列表；装备写入 equipment 并按 <b>装备槽位</b> 进入 H/L 模块列表。';
                  document.getElementById('custom-name-input').placeholder = '例如：试作相位护盾';
                  document.getElementById('custom-json-input').value = JSON.stringify(sourceItem || getCustomEquipmentTemplate(), null, 2);
              }
              document.getElementById('modal-custom-formatter').style.display = 'flex';
