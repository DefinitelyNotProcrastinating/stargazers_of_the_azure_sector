              .custom-toolbar { justify-content: stretch; }
              .custom-toolbar .btn { width: 100%; }
          }

  @media (max-width: 980px) {
    .ship-tabs-layout {
      grid-template-columns: 1fr;
    }

    .ship-detail-shell {
      grid-template-columns: 1fr;
    }
  }

          @media (max-width: 980px) {
              .fitting-side { grid-template-columns: 1fr; }
              .fitting-stage { min-height: 760px; border-radius: 32px; }
          }
          @media (max-width: 620px) {
              body { background-size: auto; }
              #screen-0 { padding: 16px !important; }
              #main-ui { padding: 12px !important; }
              .panel { border-radius: 22px; }
              .modal-content { border-radius: 24px; padding: 18px; width: 96%; }
              .grid-container { grid-template-columns: 1fr; }
              .ship-grid-container { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
              .ship-grid-container .item-card { min-height: 168px; padding: 12px; }
              .ship-grid-container .item-card h3 { font-size: 0.95rem; line-height: 1.35; }
              .fitting-stage { min-height: 700px; border-radius: 28px; }
              .ring-slot { width: 92px; padding: 7px 5px; }
              .stargazer-dock { grid-template-columns: 1fr; text-align: center; bottom: 18px; }
              .stargazer-dock .btn { width: 100%; padding: 10px; }
              .stargazer-actions { justify-content: stretch; }
              .center-core { top: 40%; }
              .fitting-stage::before, .fitting-stage::after, .dial-ring { top: 40%; }
          }

          /* Unified Azure glass system v3 — all controls and interaction states */
          :root {
              color-scheme: dark;
              --bg-dark: #030d19;
              --bg-panel: rgba(12, 29, 49, 0.62);
              --bg-panel-strong: rgba(18, 41, 65, 0.82);
              --bg-control: rgba(3, 17, 31, 0.78);
              --bg-control-hover: linear-gradient(135deg, rgba(32, 77, 108, 0.92), rgba(18, 49, 78, 0.92));
              --bg-inset: rgba(5, 22, 39, 0.76);
              --bg-card: linear-gradient(145deg, rgba(23, 51, 78, 0.82), rgba(8, 26, 45, 0.80));
              --shadow-soft: 0 12px 32px rgba(0, 7, 18, 0.28), inset 0 1px 0 rgba(194, 235, 255, 0.08);
              --border-main: rgba(166, 222, 255, 0.28);
              --border-soft: rgba(166, 222, 255, 0.20);
              --accent-main: #7be0ff;
              --accent-deep: #a9ecff;
              --accent-soft: rgba(123, 224, 255, 0.18);
              --text-main: #f4f9ff;
              --text-muted: #adc2d5;
              --danger: #ff7d8f;
              --glow-main: 0 20px 56px rgba(21, 137, 196, 0.26), 0 0 0 1px rgba(194,235,255,.26) inset;
          }
          body {
              background:
                  radial-gradient(circle at 14% 8%, rgba(43,168,221,.30), transparent 32%),
                  radial-gradient(circle at 88% 12%, rgba(118,105,255,.22), transparent 31%),
                  radial-gradient(circle at 68% 88%, rgba(25,103,170,.24), transparent 40%),
                  linear-gradient(145deg, #020912, #07182b 54%, #030b16);
          }
          html { background: #020912; }
          body::before { opacity:.78; mask-image:radial-gradient(circle at center,#000,transparent 82%); -webkit-mask-image:radial-gradient(circle at center,#000,transparent 82%); }
          .screen { min-height: 720px; }
          .panel, .modal-content, .item-card, .fitting-stage,
          .ring-slot, .stargazer-dock, .formatter-hint, .gacha-card {
              color: var(--text-main);
              border-color: var(--border-main);
              background-color: rgba(12,29,49,.62);
              box-shadow: 0 22px 68px rgba(0,7,18,.38), inset 0 1px 0 rgba(255,255,255,.10);
              backdrop-filter: blur(18px) saturate(1.24);
              -webkit-backdrop-filter: blur(18px) saturate(1.24);
          }
          .panel, .modal-content {
              background: linear-gradient(145deg,rgba(19,43,68,.76),rgba(5,18,34,.70));
          }
          .panel { position:relative; isolation:isolate; }
          .panel::before { content:""; position:absolute; inset:0; pointer-events:none; border-radius:inherit; background:linear-gradient(145deg,rgba(255,255,255,.07),transparent 42%); }
          .panel > * { position:relative; }
          .btn {
              color: var(--accent-deep);
              border-color: rgba(123,224,255,.34);
              background: linear-gradient(135deg,rgba(28,68,100,.78),rgba(12,39,66,.72));
              box-shadow: 0 10px 26px rgba(0,7,18,.24), inset 0 1px 0 rgba(255,255,255,.11);
          }
          .btn:hover:not(:disabled), .btn:focus-visible, .btn.touch-active {
              color:var(--text-main); border-color:rgba(123,224,255,.66);
              background:var(--bg-control-hover);
              box-shadow:0 12px 32px rgba(14,91,132,.24),inset 0 0 0 1px rgba(194,235,255,.12);
          }
          input, textarea, select { color:var(--text-main); border:1px solid var(--border-main); border-radius:var(--radius-sm); background:var(--bg-control); box-shadow:inset 0 1px 0 rgba(194,235,255,.06); padding:11px 13px; font-family:'JetBrains Mono',monospace; outline:none; }
          select option { color:var(--text-main); background:#0b1d31; }
          input:focus, textarea:focus, select:focus { border-color:var(--accent-main); box-shadow:0 0 0 3px rgba(76,185,224,.14),inset 0 1px 0 rgba(194,235,255,.06); }
          input::placeholder, textarea::placeholder { color:#8299ad; }
          .item-card { background:linear-gradient(150deg,rgba(23,51,78,.66),rgba(8,26,45,.58)); }
          .item-card:hover, .item-card:focus-visible, .item-card.touch-active { border-color:rgba(123,224,255,.66); }
          .item-card.selected { border-color:rgba(123,224,255,.82); background:linear-gradient(150deg,rgba(32,78,112,.82),rgba(20,48,82,.72)); box-shadow:0 20px 58px rgba(32,143,198,.24),inset 0 0 0 1px rgba(194,235,255,.14); }
          .kv-row { border-bottom-color:rgba(166,222,255,.16); }
          .modal-overlay { background:rgba(0,8,18,.70); }
          .fitting-stage { background:radial-gradient(circle at 50% 42%,rgba(123,224,255,.14),transparent 22%),radial-gradient(circle at 50% 45%,rgba(127,153,255,.10),transparent 44%),rgba(3,15,29,.74); }
          .ring-slot { background:rgba(13,37,61,.78); }
          .ring-slot:hover, .ring-slot:focus-visible, .ring-slot.touch-active { background:var(--bg-control-hover); border-color:rgba(123,224,255,.66); box-shadow:var(--shadow-soft),0 0 0 1px rgba(123,224,255,.16); }
          .ring-slot.filled { background:linear-gradient(145deg,rgba(35,88,120,.86),rgba(23,47,83,.80)); box-shadow:var(--shadow-soft),inset 0 0 0 1px rgba(123,224,255,.18); }
          .center-core { background:radial-gradient(circle at 32% 20%,rgba(37,85,116,.92),rgba(17,44,71,.94) 55%,rgba(8,27,47,.96)); border-color:var(--border-main); box-shadow:0 20px 50px rgba(0,7,18,.36),inset 0 1px 0 rgba(194,235,255,.10); }
          .core-resource div, .resource-box, .fit-row { background:var(--bg-inset); border-color:var(--border-soft); box-shadow:inset 0 1px 0 rgba(194,235,255,.06); }
          .candidate-card { background:var(--bg-card); border-color:var(--border-soft); box-shadow:var(--shadow-soft); }
          .fitting-stage::before { box-shadow:inset 0 0 42px rgba(46,156,205,.08),0 0 0 22px rgba(123,224,255,.035); }
          .modal-content .bg-\[rgba\(0\,212\,255\,0\.05\)\] { background:var(--bg-inset) !important; }
          .stargazer-dock { background:linear-gradient(135deg,rgba(19,48,75,.84),rgba(11,31,53,.78)); }
          .formatter-error { color:#ffd8de; border-color:rgba(255,125,143,.46); background:rgba(100,22,40,.64); }
          .formatter-hint { color:var(--text-muted); background:rgba(16,43,68,.64); }
          .gacha-card { color:var(--text-main); background:radial-gradient(circle at 50% 24%,rgba(255,255,255,.10),transparent 28%),radial-gradient(circle at 35% 42%,rgba(127,153,255,.18),transparent 36%),linear-gradient(145deg,rgba(24,55,83,.82),rgba(10,28,49,.74)); }
          .gacha-card::before { color:rgba(123,224,255,.20); filter:drop-shadow(0 8px 18px rgba(39,155,210,.20)); }
          .gacha-card.revealed { background:linear-gradient(145deg,rgba(31,72,103,.88),rgba(16,38,65,.82)); }
          .gacha-rarity { color:#9c9dff; }
          .gacha-name { color:#f4f9ff; }
          .gacha-meta { color:var(--text-muted); }
          .gacha-card.selected { border-color:rgba(123,224,255,.88); background:linear-gradient(145deg,rgba(35,88,120,.90),rgba(24,48,85,.84)); box-shadow:0 20px 50px rgba(14,91,132,.24),inset 0 0 0 1px rgba(123,224,255,.20); }
          .gacha-card.selected::after { color:#d7f6ff; border-color:rgba(123,224,255,.52); background:rgba(11,45,70,.88); }
          .gacha-card:hover, .gacha-card:focus-visible, .gacha-card.touch-active { border-color:rgba(123,224,255,.66); box-shadow:0 20px 50px rgba(0,7,18,.36),inset 0 1px 0 rgba(194,235,255,.10); }
          .step-dot { background:rgba(93,135,163,.42); box-shadow:inset 0 1px 0 rgba(255,255,255,.08); }
          .step-dot.active { background:linear-gradient(90deg,#398bb4,#60b9d7); box-shadow:0 0 12px rgba(123,224,255,.20); }
          ::-webkit-scrollbar-track { background:rgba(3,17,31,.70); }
          ::-webkit-scrollbar-thumb { background:rgba(91,145,177,.46); }
          button:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--accent-main); outline-offset:3px; }
          @supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))) {
              .panel,.modal-content{background:#0b1d31}.item-card,.fitting-stage,.ring-slot,.stargazer-dock,.formatter-hint,.gacha-card,.candidate-card{background:#142c46}
          }
          @media (prefers-reduced-motion: reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition-duration:.01ms!important; animation-duration:.01ms!important; } }
          .preset-controls { display:flex; flex-wrap:wrap; align-items:end; gap:10px; margin-top:14px; }
          .preset-controls > div { flex:1 1 210px; display:grid; gap:6px; }
          .preset-controls label,.picker-label { font-size:12px; color:var(--text-muted); }
          .preset-controls select,.preset-controls input { width:100%; min-width:0; }
          .inventory-layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px; align-items:start; }
          .inventory-layout h3 { font-weight:700; color:var(--accent-main); font-size:18px; }
          .picker-label { display:block; margin:16px 0 6px; }
          .tag-filter { display:flex; flex-wrap:wrap; gap:6px; margin:14px 0; }
          .tag-filter .btn { font-size:12px; padding:6px 10px; }
          .tag-filter .tag-active { border-color:var(--accent-main); background:rgba(40,111,150,.6); color:var(--text-main); }
          .picker-preview { background:var(--bg-inset); padding:16px; border-radius:12px; margin:14px 0; min-height:96px; line-height:1.8; overflow-wrap:anywhere; }
          .selected-item-list { display:grid; gap:12px; margin-top:16px; }
          .selected-item-row { display:grid; grid-template-columns:minmax(0,1fr) 80px auto; align-items:center; gap:10px; border-bottom:1px solid var(--border-soft); padding-bottom:12px; }
          .selected-item-row strong { overflow-wrap:anywhere; }
          .selected-item-row input { width:100%; padding:8px; }
          .selected-item-row label { font-size:12px; color:var(--text-muted); }
          details summary { cursor:pointer; color:var(--accent-main); }
          @media(max-width:720px) { .inventory-layout { grid-template-columns:1fr; } .preset-controls > .btn { flex:1 1 auto; } .selected-item-row { grid-template-columns:minmax(0,1fr) 70px; } .selected-item-row > .btn { grid-column:1/-1; } }
      </style>
  </head>
  <body>
      <div id="screen-0" class="screen active items-center justify-center p-8">
          <div class="panel max-w-4xl w-full p-8 text-center">
              <div class="font-mono text-sm tracking-[0.4em] text-[var(--text-muted)]">AZURE SECTOR / INITIALIZATION</div>
              <h1 class="text-5xl font-bold text-[var(--accent-main)] mt-4">蔚蓝星域的观星者</h1>
              <p class="text-[var(--text-muted)] mt-5 leading-8">
                  载入新的开局协议。<br>
                  你可以建立个人档案，选择舰船并完成装配，配置初始物资、开局剧情、工业基地与势力声望。读取开局预设可以自动填写这些选择。确认后直接写入变量，聊天框填入背景故事与预设开局行动，不发送配置或数值。
              </p>
              <section class="panel p-5 mt-6 text-left"><h2 class="text-lg font-bold">开局预选</h2><div class="preset-controls">
                  <div><label for="welcome-preset-select">已保存的开局预选</label><select id="welcome-preset-select"><option value="">选择已保存的开局</option></select></div>
                  <button class="btn px-4 py-2" data-action="load-opening-preset" data-prefix="welcome">读取预选</button>
                  <button class="btn px-4 py-2" data-action="reload-opening-presets">刷新</button>
                  <div><label for="welcome-preset-name">预选名称</label><input id="welcome-preset-name" placeholder="例如：远征舰长 / 采矿队"></div>
                  <button class="btn px-4 py-2" data-action="save-opening-preset" data-prefix="welcome">保存 / 覆盖当前设置</button>
              </div><p id="welcome-preset-status" class="text-sm text-[var(--text-muted)] mt-3" role="status" aria-live="polite">预选会保存全部开局设置，读取后仍可继续编辑。</p></section>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-8 text-left">
                  <div>
                      <label class="text-xs text-[var(--text-muted)]">舰长名称</label>
                      <input type="text" id="captain-name" class="w-full mt-1" value="{{user}}">
                  </div>
                  <div>
                      <label class="text-xs text-[var(--text-muted)]">主角外貌</label>
                      <input type="text" id="captain-appearance" class="w-full mt-1" placeholder="例如：穿着常服的年轻舰长，眼下带着轻微熬夜痕迹">
                  </div>
                  <div class="md:col-span-2">
                      <label class="text-xs text-[var(--text-muted)]">背景故事 / 个人档案</label>
                      <textarea id="captain-background" class="w-full mt-1" maxlength="1200" rows="6" placeholder="写下主角已经真实拥有的职业、训练、长期经历、人际关系或重要往事。明确写出的经历会在相关行动中成为叙事优势；无需填写技能等级。"></textarea>
                      <div class="text-[11px] text-[var(--text-muted)] mt-2">建议保持在 100–300 字。档案会被永久提供给叙事 AI，因此只写值得长期记住的内容。</div>
                  </div>
                  <div class="md:col-span-2">
                      <label for="welcome-difficulty-select">难度</label>
                      <select id="welcome-difficulty-select" class="w-full mt-1" data-difficulty><option>正常难度</option><option>高难度</option><option>天灾难度</option></select>
                      <p id="welcome-difficulty-hint" class="text-sm text-[var(--text-muted)] mt-2"></p>
                      <button id="welcome-difficulty-confirm" class="btn px-4 py-2 mt-3" data-action="confirm-difficulty">确认难度</button>
                      <p id="welcome-difficulty-status" class="text-sm text-[var(--text-muted)] mt-2" role="status" aria-live="polite">选择后确认，立即应用难度。</p>
                  </div>
              </div>
              <button class="btn px-8 py-3 text-xl tracking-widest mt-8" id="btn-start" data-action="start-game">建立连接 [CONNECT]</button>
          </div>
      </div>

      <div id="main-ui" class="hidden flex-col p-4">
          <div class="flex justify-between items-end border-b border-[var(--border-main)] pb-2 mb-4">
              <div>
                  <h2 class="text-2xl font-bold text-[var(--accent-main)]" id="phase-title">PHASE_1: 开局剧情</h2>
                  <div class="text-xs text-[var(--text-muted)] font-mono" id="phase-desc">Select opening story</div>
              </div>
              <div class="text-right font-mono text-xs text-[var(--text-muted)]" id="selection-summary"></div>
          </div>
          <details class="panel p-4 mb-4"><summary>保存 / 读取完整开局预选</summary><div class="preset-controls">
                  <div><label for="setup-preset-select">已保存的开局预选</label><select id="setup-preset-select"><option value="">选择已保存的开局</option></select></div>
                  <button class="btn px-4 py-2" data-action="load-opening-preset" data-prefix="setup">读取预选</button>
                  <button class="btn px-4 py-2" data-action="reload-opening-presets">刷新</button>
                  <div><label for="setup-preset-name">预选名称</label><input id="setup-preset-name" placeholder="例如：远征舰长 / 采矿队"></div>
                  <button class="btn px-4 py-2" data-action="save-opening-preset" data-prefix="setup">保存 / 覆盖当前设置</button>
              </div><p id="setup-preset-status" class="text-sm text-[var(--text-muted)] mt-3" role="status" aria-live="polite">预选会保存全部开局设置，读取后仍可继续编辑。</p></details>
          <div class="panel p-4 mb-4"><label for="setup-difficulty-select">难度</label><select id="setup-difficulty-select" class="w-full mt-1" data-difficulty><option>正常难度</option><option>高难度</option><option>天灾难度</option></select><p id="setup-difficulty-hint" class="text-sm text-[var(--text-muted)] mt-2"></p><button id="setup-difficulty-confirm" class="btn px-4 py-2 mt-3" data-action="confirm-difficulty">确认难度</button><p id="setup-difficulty-status" class="text-sm text-[var(--text-muted)] mt-2" role="status" aria-live="polite">选择后确认，立即应用难度。</p></div>
          <div class="flex gap-2 mb-4">
              <div class="step-dot" id="dot-1"></div>
              <div class="step-dot" id="dot-2"></div>
              <div class="step-dot" id="dot-3"></div>
              <div class="step-dot" id="dot-4"></div>
              <div class="step-dot" id="dot-5"></div>
              <div class="step-dot" id="dot-6"></div>
          </div>
          <div class="panel p-4 mb-4">
              <div class="text-sm text-[var(--text-muted)]" id="phase-help"></div>
          </div>
          <div id="catalog-grid" class="grid-container flex-1"></div>
          <div class="flex justify-between items-center pt-4 mt-4 border-t border-[var(--border-main)]">
              <button class="btn px-6 py-2" id="btn-prev" data-action="prev-phase"><<< 后退</button>
              <button class="btn px-6 py-2" id="btn-next" data-action="next-phase">继续 >>></button>
          </div>
      </div>

      <div id="modal-details" class="modal-overlay">
          <div class="modal-content relative">
              <button class="absolute top-3 right-3 text-[var(--accent-main)] font-bold" data-action="close-modal">[X]</button>
              <h2 id="modal-title" class="text-2xl font-bold text-[var(--accent-main)] mb-4"></h2>
              <div id="modal-body" class="font-mono text-sm"></div>
              <div class="mt-6 pt-4 border-t border-[var(--border-main)] flex justify-end gap-2">
                  <button class="btn px-4 py-2" data-action="close-modal">取消</button>
                  <button class="btn px-4 py-2" id="modal-primary-action" data-action="select-current-item">选择</button>
              </div>
          </div>
      </div>



      <div id="modal-custom-formatter" class="modal-overlay">
          <div class="modal-content relative">
              <button class="absolute top-3 right-3 text-[var(--accent-main)] font-bold" data-action="close-custom-formatter">[X]</button>
              <h2 id="custom-formatter-title" class="text-2xl font-bold text-[var(--accent-main)] mb-4">自定义格式器</h2>
              <div class="formatter-grid">
                  <div class="formatter-hint" id="custom-formatter-hint"></div>
                  <div class="formatter-row">
                      <label for="custom-name-input">条目名称</label>
                      <input id="custom-name-input" type="text" placeholder="例如：苍蓝试作护卫舰 / 试作相位护盾">
                  </div>
                  <div class="formatter-row" id="custom-module-kind-row" style="display:none;">
                      <label for="custom-module-kind">模块类型</label>
                      <select id="custom-module-kind" class="w-full mt-1">
                          <option value="equipment">装备模块 / H-L 槽</option>
                          <option value="weapon">武器模块 / S-M-L-XL 炮位</option>
                      </select>
                  </div>
                  <div class="formatter-actions">
                      <button class="btn px-4 py-2" data-action="fill-custom-template">填入模板</button>
                      <button class="btn px-4 py-2" data-action="format-custom-json">整理格式</button>
                  </div>
                  <textarea id="custom-json-input" spellcheck="false"></textarea>
                  <div class="formatter-error" id="custom-formatter-error"></div>
              </div>
              <div class="mt-6 pt-4 border-t border-[var(--border-main)] flex justify-end gap-2">
                  <button class="btn px-4 py-2" data-action="close-custom-formatter">取消</button>
                  <button class="btn px-4 py-2" id="save-custom-ship-button" style="display:none;" data-action="save-custom-ship-worldbook">保存到世界书并选用</button>
                  <button class="btn px-4 py-2" data-action="apply-custom-formatter">加入列表</button>
              </div>
          </div>
      </div>

      <div id="modal-gacha-results" class="modal-overlay">
          <div class="modal-content relative" style="max-width:980px;">
              <h2 class="text-2xl font-bold text-[var(--accent-main)] mb-2">观星者十连抽取</h2>
              <div class="text-sm text-[var(--text-muted)] leading-7 mb-4">点击卡面翻开。翻开后可查看详情并对比多个观星者；只有点击卡片下方的“选择”才会装配该观星者。点击底部“确定”关闭抽卡界面。</div>
              <div class="gacha-controls">
                  <div class="font-mono text-xs text-[var(--text-muted)]" id="gacha-summary">READY</div>
                  <div class="flex flex-wrap gap-2">
                      <button class="btn px-4 py-2" data-action="roll-gacha-ten">重新十连</button>
                      <button class="btn px-4 py-2" data-action="open-custom-stargazer-formatter">+ 自定义观星者</button>
                  </div>
              </div>
              <div id="gacha-card-grid" class="gacha-grid"></div>
              <div class="gacha-footer">
                  <div class="font-mono text-xs text-[var(--text-muted)]" id="gacha-selected-summary">未选择观星者</div>
                  <button class="btn px-6 py-2" data-action="confirm-gacha-results">确定</button>
              </div>
          </div>
      </div>


      <script>
          var gameData = null;
          var currentPhaseIndex = 0;
          var phases = ["ships", "fitting", "items", "init_stories", "industries", "reputations"];
          var phaseTitles = [
              { t: "PHASE_1: 起始舰船", d: "Select starting ship", help: "选择起始舰船。所有开局预选共用候选库与装配界面，自定义舰船不限舰级，可保存到世界书供以后开局选择。" },
              { t: "PHASE_2: 舰船装配", d: "Fit your ship", help: "舰船与观星者均可跳过。已选择舰船时，外环为武器拨码环，中环为 H/L 模块拨码环；未选择舰船时仍可单独选择观星者。" },
              { t: "PHASE_3: 初始物资", d: "Select inventory items", help: "先按名称或标签筛选，再用选择框加入物品。已选物品可取消或修改数量，也可创建新物品；资源类物资计入库存。" },
              { t: "PHASE_4: 开局类型", d: "Select opening", help: "选择开局剧情。读取开局预选可一并恢复舰船、装配、背景、物资与声望；在此更换剧情不会重置其他选择。" },
              { t: "PHASE_5: 工业基地", d: "Configure industries", help: "从预设增加任意数量的基地，并编辑名称、位置、防御指数、每日输入与每日输出。" },
              { t: "PHASE_6: 势力声望", d: "Set reputations", help: "设定与各势力的初始声望。海盗势力与铁血盟约固定从 -50 开始。" }
          ];
          var selectionLimits = {
              ships: 1,
              items: null,
              init_stories: 1,
              industries: null
          };
          var fittingCatalog = { weaponsByMount: { S: [], M: [], L: [], XL: [], C: [], T: [] }, modulesBySlot: { H: [], L: [] } };
          var state = {
              difficulty: "正常难度",
              captain: { name: "{{user}}", appearance: "", background: "" },
              selections: { ships: [], items: [], init_stories: [] },
              fitting: { weapons: {}, modules: {}, stargazer: null },
              industries: [],
              reputations: {}
          };
          var currentViewingItem = null;
          var currentCategory = "";
          var modalMode = "detail";
          var selectorContext = null;
          var customFormatterContext = { kind: "ship", source: "manual", index: -1, key: "" };
          var gachaSessionCards = [];
          var selectedGachaIndex = -1;
          var openingBusy = false;
          var openingDone = false;

          var openingWorldbookName = "蔚蓝星域的观星者 下世代";
          var presetStore = {};
          var presetBusy = false;
          var openingDataPromise = null;
          var itemFilters = { query: "", tags: [] };
          var difficultyBusy = false;
          var difficultyConfirmed = "";
          var difficultyFeedback = "";

          function copyOpening(value) { return JSON.parse(JSON.stringify(value)); }
          function normalizeDifficulty(value) { return ["正常难度", "高难度", "天灾难度"].includes(value) ? value : "正常难度"; }
          function getDifficultyEntries(worldbook) {
              return ["正常难度", "高难度", "天灾难度"].map(function(mode) {
                  var name = "难度设置：" + mode;
                  var matches = worldbook.filter(function(entry) { return entry.name === name; });
                  if (matches.length !== 1) throw new Error("世界书必须且只能有一个「" + name + "」条目。");
                  return matches[0];
              });
          }
          async function applyDifficultySettings() {
              var previous;
              var selected = "难度设置：" + normalizeDifficulty(state.difficulty);
              await updateWorldbookWith(openingWorldbookName, function(worldbook) {
                  var entries = getDifficultyEntries(worldbook);
                  previous = entries.map(function(entry) { return { uid: entry.uid, enabled: entry.enabled }; });
                  return worldbook.map(function(entry) {
                      return entries.includes(entry) ? Object.assign({}, entry, { enabled: entry.name === selected }) : entry;
                  });
              }, { render: 'immediate' });
              return previous;
          }
          async function restoreDifficultySettings(previous) {
              await updateWorldbookWith(openingWorldbookName, function(worldbook) {
                  return worldbook.map(function(entry) {
                      var saved = previous.find(function(item) { return item.uid === entry.uid; });
                      return saved ? Object.assign({}, entry, { enabled: saved.enabled }) : entry;
                  });
              }, { render: 'immediate' });
          }
          async function confirmDifficultySettings() {
              if (difficultyBusy || openingBusy || openingDone) return false;
              difficultyBusy = true;
              difficultyFeedback = "";
              renderDifficultySettings();
              try {
                  await applyDifficultySettings();
                  difficultyConfirmed = normalizeDifficulty(state.difficulty);
                  return true;
              } catch (error) {
                  console.error(error);
                  difficultyFeedback = "难度应用失败：" + (error && error.message ? error.message : error);
                  return false;
              } finally {
                  difficultyBusy = false;
                  renderDifficultySettings();
              }
          }
          function renderDifficultySettings() {
              state.difficulty = normalizeDifficulty(state.difficulty);
              var connect = document.getElementById('btn-start');
              if (connect) connect.disabled = difficultyBusy || openingBusy || openingDone;
              var hints = {
                  "正常难度": "任务声望 +5～+10；守法中立者可安心持有遗物，受欢迎者免于内部暗害；常见探索任务大多安全。",
                  "高难度": "任务声望最多 +5；奖励克扣、夺宝、内部暗害与敌对势力猎杀持续存在；小舰队尤其危险。",
                  "天灾难度": "继承高难度；半主动集群芯片预警识海终末最迟100年后回归，随后自毁。回归只可提前。"
              };
              ["welcome", "setup"].forEach(function(place) {
                  var select = document.getElementById(place + '-difficulty-select');
                  var hint = document.getElementById(place + '-difficulty-hint');
                  var button = document.getElementById(place + '-difficulty-confirm');
                  var status = document.getElementById(place + '-difficulty-status');
                  var disabled = difficultyBusy || openingBusy || openingDone;
                  if (select) { select.value = state.difficulty; select.disabled = disabled; }
                  if (button) button.disabled = disabled;
                  if (hint) hint.textContent = hints[state.difficulty];
                  if (status) status.textContent = difficultyBusy ? "正在应用难度……" : (difficultyFeedback || (difficultyConfirmed === state.difficulty ? "已生效：" + state.difficulty + "，其余难度已关闭。" : "选择后点击确认难度，立即生效。"));
              });
          }
          function buildCatastropheWarning(time) {
              var learned = new Date(time), deadline = new Date(time), month = learned.getUTCMonth();
              if (!Number.isFinite(learned.getTime())) throw new Error("天灾预警需要有效的开局时间。");
              deadline.setUTCFullYear(deadline.getUTCFullYear() + 100);
              if (deadline.getUTCMonth() !== month) deadline.setUTCDate(0);
              return { "获知时间": learned.toISOString(), "最迟回归时间": deadline.toISOString(), "芯片状态": "已自毁" };
          }
          function openingObject(value) { return !!value && typeof value === 'object' && !Array.isArray(value); }
          function findOpeningEntry(worldbook) {
              return worldbook.find(function(entry) { return entry.comment === '__INIT_DATA__' || entry.name === '__INIT_DATA__'; });
          }
          async function ensureOpeningData() {
              if (gameData) return gameData;
              if (!openingDataPromise) openingDataPromise = fetchGameData().then(function(data) {
                  gameData = data;
                  state.reputations = copyOpening(data.reputations || {});
                  state.reputations['铁血盟约'] = -50;
                  state.reputations['海盗势力'] = -50;
                  return data;
              }).finally(function() { openingDataPromise = null; });
              return openingDataPromise;
          }
          function presetStatus(message, failed) {
              ['welcome-preset-status', 'setup-preset-status'].forEach(function(id) {
                  var node = document.getElementById(id);
                  if (node) { node.textContent = message; node.style.color = failed ? 'var(--danger)' : ''; }
              });
          }
          function renderOpeningPresets(selectedName) {
              ['welcome-preset-select', 'setup-preset-select'].forEach(function(id) {
                  var select = document.getElementById(id);
                  if (!select) return;
                  var previous = selectedName || select.value;
                  select.innerHTML = '<option value="">选择已保存的开局</option>' + Object.keys(presetStore).map(function(name) {
                      return '<option value="' + escapeHtml(name) + '">' + escapeHtml(name) + '</option>';
                  }).join('');
                  if (Object.prototype.hasOwnProperty.call(presetStore, previous)) select.value = previous;
              });
          }
          async function refreshOpeningPresets() {
              var entry = findOpeningEntry(await getWorldbook(openingWorldbookName));
              if (!entry || !entry.content) throw new Error('找不到开局数据条目。');
              var data = JSON.parse(entry.content);
              if (data.opening_presets !== undefined && !openingObject(data.opening_presets)) throw new Error('预选库格式错误。');
              presetStore = copyOpening(data.opening_presets || {});
              renderOpeningPresets();
              return presetStore;
          }
          function validateItemQuantities() {
              if (typeof document.querySelector === 'function') {
                  var invalid = document.querySelector('[data-item-index]:invalid');
                  if (invalid) { invalid.reportValidity(); throw new Error('物品数量必须是正整数。'); }
              }
              if (state.selections.items.some(function(item) { return !Number.isSafeInteger(Number(item['堆叠'] === undefined ? 1 : item['堆叠'])) || Number(item['堆叠'] === undefined ? 1 : item['堆叠']) < 1; })) throw new Error('物品数量必须是正整数。');
          }
          function captureOpeningPreset() {
              validateItemQuantities();
              state.difficulty = normalizeDifficulty(state.difficulty);
              ['name', 'appearance', 'background'].forEach(function(field) {
                  var input = document.getElementById('captain-' + field);
                  if (input) state.captain[field] = input.value;
              });
              var catalogs = {};
              ['ships', 'items', 'weapons', 'equipment', 'stargazers', 'init_stories', 'industries'].forEach(function(key) {
                  catalogs[key] = copyOpening(gameData[key] || {});
              });
              return { version: 1, state: copyOpening(state), catalogs: catalogs,
                  gachaCards: copyOpening(gachaSessionCards), gachaSelectedIndex: selectedGachaIndex,
                  itemFilters: copyOpening(itemFilters) };
          }
          function validateOpeningPreset(preset) {
              if (!openingObject(preset) || preset.version !== 1 || !openingObject(preset.state) || !openingObject(preset.catalogs)) throw new Error('无法识别此预选格式。');
              var restored = preset.state;
              if (restored.difficulty !== undefined && !["正常难度", "高难度", "天灾难度"].includes(restored.difficulty)) throw new Error('难度必须是正常难度、高难度或天灾难度。');
              if (!openingObject(restored.captain) || !openingObject(restored.selections) || !openingObject(restored.fitting) || !Array.isArray(restored.industries) || !openingObject(restored.reputations)) throw new Error('预选缺少完整开局设置。');
              if (Object.values(restored.reputations).some(function(value) { return !Number.isInteger(value) || value < -1000 || value > 1000; })) throw new Error('势力声望必须是 -1000 至 1000 的整数。');
              ['ships', 'items', 'init_stories'].forEach(function(key) {
                  if (!Array.isArray(restored.selections[key]) || restored.selections[key].some(function(item) { return !openingObject(item) || typeof item._key !== 'string' || !item._key.trim(); })) throw new Error('预选中的选择列表无效。');
              });
              if (restored.selections.items.some(function(item) { return !Number.isSafeInteger(Number(item['堆叠'] === undefined ? 1 : item['堆叠'])) || Number(item['堆叠'] === undefined ? 1 : item['堆叠']) < 1; })) throw new Error('预选中的物品数量无效。');
              if (restored.selections.ships.length > 1 || restored.selections.init_stories.length > 1) throw new Error('预选只能选择一艘舰船和一个剧情。');
              if (!openingObject(restored.fitting.weapons) || !openingObject(restored.fitting.modules) || (restored.fitting.stargazer !== null && (!openingObject(restored.fitting.stargazer) || !restored.fitting.stargazer._key))) throw new Error('预选中的装配或观星者无效。');
              ['ships', 'items', 'weapons', 'equipment', 'stargazers', 'init_stories', 'industries'].forEach(function(key) {
                  if (!openingObject(preset.catalogs[key])) throw new Error('预选缺少候选库：' + key);
              });
              if (restored.industries.some(function(item) { return !openingObject(item) || !item._key; })) throw new Error('预选中的工业基地无效。');
              ['name', 'appearance', 'background'].forEach(function(field) { if (typeof restored.captain[field] !== 'string') throw new Error('舰长档案无效。'); });
          }
          async function saveOpeningPreset(prefix) {
              if (presetBusy || openingBusy || openingDone) return;
              presetBusy = true;
              try {
                  await ensureOpeningData();
                  var name = document.getElementById(prefix + '-preset-name').value.trim();
                  if (!name) throw new Error('请输入预选名称。');
                  var preset = captureOpeningPreset();
                  validateOpeningPreset(preset);
                  if (typeof updateWorldbookWith !== 'function') throw new Error('当前环境无法保存世界书，请启用酒馆助手。');
                  await updateWorldbookWith(openingWorldbookName, function(worldbook) {
                      var entry = findOpeningEntry(worldbook);
                      if (!entry) throw new Error('找不到开局数据条目。');
                      var data = JSON.parse(entry.content);
                      if (data.opening_presets !== undefined && !openingObject(data.opening_presets)) throw new Error('预选库格式错误。');
                      var presets = data.opening_presets || {};
                      Object.defineProperty(presets, name, { value: copyOpening(preset), enumerable: true, configurable: true, writable: true });
                      data.opening_presets = presets;
                      return worldbook.map(function(item) { return item === entry ? Object.assign({}, item, { content: JSON.stringify(data, null, 2), enabled: false }) : item; });
                  }, { render: 'none' });
                  await refreshOpeningPresets();
                  renderOpeningPresets(name);
                  presetStatus('已保存预选「' + name + '」，之后的新开局可以读取。');
              } catch (error) { presetStatus('保存失败：' + error.message, true); }
              finally { presetBusy = false; }
          }
          async function loadOpeningPreset(prefix) {
              if (presetBusy || openingBusy || openingDone || difficultyBusy) return;
              var name = document.getElementById(prefix + '-preset-select').value;
              if (!name) { presetStatus('请先选择一个预选。', true); return; }
              presetBusy = true;
              try {
                  await ensureOpeningData();
                  await refreshOpeningPresets();
                  var preset = copyOpening(presetStore[name]);
                  validateOpeningPreset(preset);
                  var restoredData = await fetchGameData();
                  Object.keys(preset.catalogs).forEach(function(key) { restoredData[key] = Object.assign({}, restoredData[key] || {}, copyOpening(preset.catalogs[key])); });
                  restoredData.fittingCatalog = buildFittingCatalog(restoredData);
                  gameData = restoredData;
                  state = copyOpening(preset.state);
                  difficultyFeedback = "";
                  renderDifficultySettings();
                  gachaSessionCards = Array.isArray(preset.gachaCards) ? copyOpening(preset.gachaCards) : [];
                  selectedGachaIndex = Number.isInteger(preset.gachaSelectedIndex) ? preset.gachaSelectedIndex : -1;
                  itemFilters = openingObject(preset.itemFilters) && Array.isArray(preset.itemFilters.tags) ? copyOpening(preset.itemFilters) : { query: '', tags: [] };
                  ['name', 'appearance', 'background'].forEach(function(field) { document.getElementById('captain-' + field).value = state.captain[field]; });
                  ['welcome', 'setup'].forEach(function(place) { document.getElementById(place + '-preset-name').value = name; });
                  renderOpeningPresets(name);
                  if (currentCategory) { closeModal(); closeCustomFormatter(); document.getElementById('modal-gacha-results').style.display = 'none'; renderPhase(); renderSummary(); }
                  presetStatus('已读取「' + name + '」的完整设置；可以继续修改后开始游戏。');
              } catch (error) { presetStatus('读取失败：' + error.message, true); }
              finally { presetBusy = false; }
          }
          async function reloadOpeningPresets() {
              try { await ensureOpeningData(); await refreshOpeningPresets(); presetStatus('已读取 ' + Object.keys(presetStore).length + ' 份预选。'); }
              catch (error) { presetStatus('预选读取失败：' + error.message, true); }
          }

          function itemTags(item) {
              var tags = item && item['标签'];
              var normalized = (Array.isArray(tags) ? tags : typeof tags === 'string' ? tags.split(/[,，]/) : []).map(function(tag) { return String(tag).trim(); }).filter(Boolean);
              return normalized.length ? normalized : ['未分类'];
          }
          function getFilteredItems() {
              var query = itemFilters.query.trim().toLowerCase();
              return Object.keys(gameData.items || {}).filter(function(key) {
                  var item = gameData.items[key], tags = itemTags(item);
                  return (!query || (key + ' ' + (item['描述'] || '') + ' ' + tags.join(' ')).toLowerCase().includes(query)) && itemFilters.tags.every(function(tag) { return tags.includes(tag); });
              });
          }
          function renderItemChoices() {
              var select = document.getElementById('item-choice');
              if (!select) return;
              var previous = select.value, names = getFilteredItems();
              select.innerHTML = '<option value="">选择一种物品（' + names.length + '项）</option>' + names.map(function(name) { return '<option value="' + escapeHtml(name) + '">' + escapeHtml(name) + '</option>'; }).join('');
              if (names.includes(previous)) select.value = previous;
              renderItemPreview();
          }
          function renderItemPreview() {
              var select = document.getElementById('item-choice'), box = document.getElementById('item-choice-preview');
              if (!select || !box) return;
              var item = gameData.items[select.value];
              box.innerHTML = item ? '<strong>' + escapeHtml(select.value) + '</strong><p>' + escapeHtml(item['描述'] || '未记录描述') + '</p><small>' + escapeHtml(itemTags(item).join(' / ')) + '</small>' : '使用名称搜索或标签缩小范围，再选择物品。多个标签需同时匹配。';
              var button = document.getElementById('item-add-button');
              if (button) { button.disabled = !item; button.textContent = state.selections.items.some(function(selected) { return selected._key === select.value; }) ? '已选择' : '加入开局'; }
          }
          function renderItems() {
              var grid = document.getElementById('catalog-grid'), tags = [];
              Object.keys(gameData.items || {}).forEach(function(key) { itemTags(gameData.items[key]).forEach(function(tag) { if (!tags.includes(tag)) tags.push(tag); }); });
              grid.className = 'inventory-layout flex-1';
              grid.innerHTML = '<section class="panel p-5"><h3>选择物品</h3><label class="picker-label" for="item-search">搜索名称或描述</label><input id="item-search" class="w-full" type="search" placeholder="例如：补给、急救、冷却" value="' + escapeHtml(itemFilters.query) + '"><div class="tag-filter">' +
                  '<button class="btn ' + (!itemFilters.tags.length ? 'tag-active' : '') + '" data-action="clear-item-tags">全部</button>' + tags.sort().map(function(tag) { return '<button class="btn ' + (itemFilters.tags.includes(tag) ? 'tag-active' : '') + '" data-action="toggle-item-tag" data-tag="' + escapeHtml(encodeURIComponent(tag)) + '">' + escapeHtml(tag) + '</button>'; }).join('') +
                  '</div><label class="picker-label" for="item-choice">候选物品</label><select id="item-choice" class="w-full"></select><div id="item-choice-preview" class="picker-preview"></div><div class="flex flex-wrap gap-2"><button class="btn px-4 py-2" id="item-add-button" data-action="add-opening-item">加入开局</button><button class="btn px-4 py-2" data-action="open-custom-item-formatter">+ 创建新物品</button></div></section>' +
                  '<section class="panel p-5"><h3>已选物品 · ' + state.selections.items.length + '</h3><div class="selected-item-list">' + (state.selections.items.length ? state.selections.items.map(function(item, index) {
                      return '<article class="selected-item-row"><div><strong>' + escapeHtml(item._key) + '</strong><div class="text-sm text-[var(--text-muted)]">' + escapeHtml(itemTags(item).join(' / ')) + '</div></div><label>数量<input type="number" min="1" step="1" data-item-index="' + index + '" value="' + escapeHtml(item['堆叠'] === undefined ? 1 : item['堆叠']) + '"></label><button class="btn px-3 py-2" data-action="remove-opening-item" data-index="' + index + '">取消选择</button></article>';
                  }).join('') : '<p class="text-[var(--text-muted)]">尚未选择物品，可直接继续。</p>') + '</div></section>';
              renderItemChoices();
          }
          function addOpeningItem() {
              var key = document.getElementById('item-choice').value;
              if (!Object.prototype.hasOwnProperty.call(gameData.items, key) || state.selections.items.some(function(item) { return item._key === key; })) return;
              var item = copyOpening(gameData.items[key]);
              item._key = key;
              if (item['堆叠'] === undefined) item['堆叠'] = 1;
              state.selections.items.push(item);
              renderItems(); renderSummary();
          }
          function getCustomItemTemplate() { return { '品质': 1, '堆叠': 1, '标签': ['杂项'], '描述': '填写用途、外观和来源。', '效果': {} }; }
          function normalizeCustomItem(item) {
              if (!openingObject(item)) throw new Error('物品内容必须是对象。');
              var result = copyOpening(item);
              var amount = Number(result['堆叠'] === undefined ? 1 : result['堆叠']);
              if (!Number.isSafeInteger(amount) || amount < 1) throw new Error('物品数量必须是正整数。');
              result['堆叠'] = amount;
              result['标签'] = itemTags(result);
              result['品质'] = result['品质'] === undefined ? 1 : result['品质'];
              result['效果'] = result['效果'] || {};
              return result;
          }
          function formatMetric(value, suffix) {
              var text = String(value === undefined || value === null ? '' : value);
              return !text || text.endsWith(suffix) ? text : text + suffix;
          }
          document.addEventListener('DOMContentLoaded', function() { renderDifficultySettings(); reloadOpeningPresets(); });

          async function fetchGameData() {
              var wb = await getWorldbook("蔚蓝星域的观星者 下世代");
              var entry = null;
              var parsed = null;
              var i = 0;
              for (i = 0; i < wb.length; i++) {
                  if (wb[i].comment === "__INIT_DATA__" || wb[i].name === "__INIT_DATA__") { entry = wb[i]; break; }
              }
              if (!entry || !entry.content) throw new Error("INIT_DATA not found");
              parsed = JSON.parse(entry.content);
              parsed.init_stories = parsed.init_stories || {};
              parsed.ships = parsed.ships || {};
              parsed.items = parsed.items || {};
              parsed.stargazers = normalizeStargazerMap(parsed.stargazers || {});
              parsed.weapons = parsed.weapons || {};
              parsed.equipment = parsed.equipment || {};
              parsed.gacha_data = parsed.gacha_data || {};
              parsed.fittingCatalog = buildFittingCatalog(parsed);
              return parsed;
          }

          function getSelectedShip() { return state.selections.ships.length ? state.selections.ships[0] : null; }
          function getSelectedShipName() { return getSelectedShip() ? getSelectedShip()._key : ""; }
          function getSelectedStargazer() { return state.fitting.stargazer; }
          // MODULE_STACKING_HELPERS_BEGIN
          function moduleStackCount(item) {
            const value = item && item.堆叠 !== undefined ? Number(item.堆叠) : 1;
            return Number.isSafeInteger(value) && value > 0 ? value : 0;
          }

          function moduleStackSignature(item) {
            if (!item || typeof item !== 'object' || Array.isArray(item)) return '';
            const canonical = (value, field) => {
              if (Array.isArray(value)) {
                const array = value.map(entry => canonical(entry));
                return field === '标签' ? Array.from(new Set(array)).sort() : array;
              }
              if (value && typeof value === 'object') {
                return Object.fromEntries(Object.keys(value).sort().map(key => [key, canonical(value[key], key)]));
              }
              return value;
            };
            const copy = Object.assign({}, item);
            delete copy.堆叠;
            delete copy._key;
            delete copy.装配槽位;
            return JSON.stringify(canonical(copy));
          }

          function stackModuleDictionary(dictionary, equipped = false) {
            if (!dictionary || typeof dictionary !== 'object' || Array.isArray(dictionary)) return;
            const groups = new Map();
            for (const name of Object.keys(dictionary)) {
              const item = dictionary[name];
              if (!item || typeof item !== 'object' || Array.isArray(item) || typeof item.装配要求 !== 'string') continue;
              const count = moduleStackCount(item);
              if (!count) continue;
              if (!equipped) delete item.装配槽位;
              const signature = moduleStackSignature(item);
              const firstName = groups.get(signature);
              if (firstName !== undefined) {
                const first = dictionary[firstName];
                const total = moduleStackCount(first) + count;
                if (!Number.isSafeInteger(total)) continue;
                if (equipped) {
                  const positions = (key, value) => {
                    if (Array.isArray(value.装配槽位) && value.装配槽位.length === moduleStackCount(value)) return value.装配槽位;
                    const slot = key.match(/^([A-Z]+\d+)\s+/);
                    return slot && moduleStackCount(value) === 1 ? [slot[1]] : [];
                  };
                  const slots = positions(firstName, first).concat(positions(name, item));
                  if (slots.length === total && new Set(slots).size === total) first.装配槽位 = slots;
                  else delete first.装配槽位;
                }
                first.堆叠 = total;
                delete dictionary[name];
              } else groups.set(signature, name);
            }
          }

          function moduleStackHpStatus(ship) {
            ship = ship || {};
            const number = value => {
              const parsed = typeof value === 'number' ? value : parseFloat(String(value ?? '').replace(/[^0-9.+-]/g, ''));
              return Number.isFinite(parsed) ? parsed : 0;
            };
            const equipment = Object.values(ship.装备 || {});
            const sum = key => equipment.reduce((total, item) => total + number(item && item[key]) * moduleStackCount(item), 0);
            const baseShield = number(ship.船体护盾值), baseStructure = number(ship.船体结构值);
            const bonusShield = sum('护盾'), bonusStructure = sum('结构值');
            const shieldLimit = equipment.reduce((limit, item) => item && item.最大护盾上限 !== undefined
              ? Math.min(limit, Math.max(0, number(item.最大护盾上限))) : limit, Infinity);
            const maxShield = Math.max(0, Math.min(baseShield + bonusShield, shieldLimit));
            const maxStructure = Math.max(0, baseStructure + bonusStructure);
            return { maxShield, maxStructure, bonusShield, bonusStructure, shieldLimit,
              currentShield: Math.max(0, Math.min(maxShield, ship.护盾值 === undefined ? baseShield : number(ship.护盾值))),
              currentStructure: Math.max(0, Math.min(maxStructure, ship.结构值 === undefined ? baseStructure : number(ship.结构值))) };
          }

          function stackPlayerModules(state) {
            const hero = state && state.static && state.static.主角;
            if (!hero || typeof hero !== 'object') return;
            stackModuleDictionary(hero.物品栏);
            for (const ship of Object.values(hero.舰船 || {})) {
              if (ship && typeof ship === 'object' && !Array.isArray(ship)) {
                stackModuleDictionary(ship.装备, true);
                const hp = moduleStackHpStatus(ship);
                if (ship.船体护盾值 !== undefined && ship.护盾值 !== undefined) ship.护盾值 = hp.currentShield;
                if (ship.船体结构值 !== undefined && ship.结构值 !== undefined) ship.结构值 = hp.currentStructure;
              }
            }
          }
          // MODULE_STACKING_HELPERS_END

          function isBuiltinEquipment(item) { return itemTags(item).includes('内置'); }
          function getFittingItem(kind, slotId) {
              return kind === 'weapon' ? state.fitting.weapons[slotId] : state.fitting.modules[slotId];
          }

          function normalizeStartingShipType(value) {
              var type = String(value === undefined || value === null ? "" : value).replace(/^\s+|\s+$/g, "").toUpperCase();
              if (type === "FF" || type === "护卫舰") return "FF";
              if (type === "MV" || type === "矿船" || type === "采矿船" || type === "采矿驳船") return "MV";
              return type;
          }

          function isAllowedStartingShip(ship) {
              var type = ship && normalizeStartingShipType(ship["舰船类型"]);
              return !!ship && typeof ship === "object" && !Array.isArray(ship) && !!type;
          }

          function resetFitting() {
              state.fitting.weapons = {};
              state.fitting.modules = {};
              state.fitting.stargazer = null;
              var ship = getSelectedShip();
              if (!ship) return;
              var slots = buildWeaponSlots(ship).map(function(slot) { return { id: slot.id, type: slot.mount, kind: 'weapon' }; })
                  .concat(buildModuleSlots(ship).map(function(slot) { return { id: slot.id, type: slot.slotType, kind: 'module' }; }));
              var records = Object.keys(ship['装备'] || {}).map(function(name) {
                  var item = ship['装备'][name], req = parseRequirement(item['装配要求']);
                  var kind = req['炮位'] && req['炮位'] !== '无' ? 'weapon' : 'module';
                  return { name: name, item: item, kind: kind, remaining: moduleStackCount(item),
                      type: kind === 'weapon' ? getRequirementMount(req) : getRequirementSlotType(req) };
              });
              function mapFor(record) { return record.kind === 'weapon' ? state.fitting.weapons : state.fitting.modules; }
              function claim(record, slot) {
                  var item = copyOpening(record.item); delete item.堆叠; delete item.装配槽位;
                  item._key = record.name.replace(/^[A-Z]+\d+\s+/, '');
                  mapFor(record)[slot.id] = item; record.remaining--;
              }
              records.forEach(function(record) {
                  var prefix = record.name.match(/^([A-Z]+\d+)\s+/);
                  var positions = Array.isArray(record.item.装配槽位) ? record.item.装配槽位 : prefix ? [prefix[1]] : [];
                  positions.forEach(function(position) {
                      var slot = slots.find(function(slot) { return slot.kind === record.kind && slot.type === record.type && !mapFor(record)[slot.id] && slot.id === position; });
                      if (slot && record.remaining > 0) claim(record, slot);
                  });
              });
              records.forEach(function(record) {
                  while (record.remaining > 0) {
                      var slot = slots.find(function(slot) { return slot.kind === record.kind && slot.type === record.type && !mapFor(record)[slot.id]; });
                      if (!slot) break;
                      claim(record, slot);
                  }
              });
          }

          async function startGame() {
              if (!(await confirmDifficultySettings())) return;
              renderDifficultySettings();
              state.captain.name = document.getElementById('captain-name').value.replace(/^\s+|\s+$/g, "") || "{{user}}";
              state.captain.appearance = document.getElementById('captain-appearance').value.replace(/^\s+|\s+$/g, "");
              state.captain.background = document.getElementById('captain-background').value.replace(/^\s+|\s+$/g, "");
              document.getElementById('screen-0').classList.remove('active');
              document.getElementById('main-ui').classList.add('flex');
              document.getElementById('main-ui').classList.remove('hidden');
              try {
                  await ensureOpeningData();
              } catch (e) {
                  alert("无法读取 INIT_DATA。装配界面不会使用任何 fallback data，请检查世界书中 __INIT_DATA__ 是否存在且为合法 JSON。\n" + (e && e.message ? e.message : e));
                  console.error(e);
                  gameData = { init_stories: {}, industries: {}, reputations: {}, ships: {}, items: {}, stargazers: {}, weapons: {}, equipment: {}, gacha_data: {}, fittingCatalog: buildEmptyFittingCatalog() };
              }
              state.reputations["铁血盟约"] = -50;
              state.reputations["海盗势力"] = -50;
              goToPhase(0);
          }

          function goToPhase(index) {
              currentPhaseIndex = index;
              currentCategory = phases[currentPhaseIndex];
              updateNavUI();
              renderPhase();
              resetAutoHeight();
          }

          function resetAutoHeight() {
              document.documentElement.style.height = "auto";
              document.body.style.height = "auto";
              window.scrollTo(0, 0);
              requestAnimationFrame(function() {
                  window.dispatchEvent(new Event("resize"));
              });
          }

          function updateNavUI() {
              var info = phaseTitles[currentPhaseIndex];
              var i = 0;
              document.getElementById('phase-title').textContent = info.t;
              document.getElementById('phase-desc').textContent = info.d;
              document.getElementById('phase-help').textContent = info.help;
              for (i = 0; i < phases.length; i++) {
                  document.getElementById('dot-' + (i + 1)).classList.toggle('active', i <= currentPhaseIndex);
              }
              document.getElementById('btn-prev').disabled = currentPhaseIndex === 0;
              document.getElementById('btn-next').textContent = openingDone ? "开局已写入" : (currentPhaseIndex === phases.length - 1 ? "确认并开始游戏 >>>" : (currentCategory === "fitting" ? "继续 / 跳过 >>>" : "继续 >>>"));
              document.getElementById('btn-next').disabled = openingBusy || openingDone;
              renderSummary();
          }

          function renderSummary() {
              var ship = getSelectedShipName() || "未选";
              var fitCount = countKeys(state.fitting.weapons) + countKeys(state.fitting.modules);
              var summary = [];
              summary.push("难度: " + normalizeDifficulty(state.difficulty));
              summary.push("舰船: " + ship);
              summary.push("装配模块: " + fitCount);
              summary.push("观星者: " + (state.fitting.stargazer ? state.fitting.stargazer._key : "未装配"));
              summary.push("物品: " + state.selections.items.length);
              summary.push("剧情: " + state.selections.init_stories.length);
              summary.push("工业基地: " + state.industries.length);
              document.getElementById('selection-summary').innerHTML = summary.join("<br>");
          }

          function countKeys(obj) {
              var n = 0, k = "";
              for (k in obj) if (Object.prototype.hasOwnProperty.call(obj, k)) n++;
              return n;
          }

          function escapeHtml(value) {
              var str = value === undefined || value === null ? "" : String(value);
              var map = {};
              map["&"] = "&" + "amp;";
              map["<"] = "&" + "lt;";
              map[">"] = "&" + "gt;";
              map['"'] = "&" + "quot;";
              map["'"] = "&" + "#39;";
              map["`"] = String.fromCharCode(92, 96);
              return str.replace(/[&<>"'`]/g, function(ch) { return map[ch]; });
          }

          function formatValue(value) {
              var rows = [], k = "";
              if (value === undefined || value === null || value === "") return "未记录";
              if (Array.isArray(value)) return value.length ? value.map(formatValue).join(" / ") : "无";
              if (typeof value === "object") {
                  for (k in value) if (Object.prototype.hasOwnProperty.call(value, k)) rows.push('<div class="kv-row"><div class="kv-key">' + escapeHtml(k) + '</div><div class="kv-val">' + formatValue(value[k]) + '</div></div>');
                  return rows.join("");
              }
              return escapeHtml(value);
          }

          function previewText(category, item) {
              if (category === "ships") return item["描述"] || ((item["舰船类型"] || "舰船") + " / " + (item["吨位"] || "未知吨位"));
              if (category === "items") return item["描述"] || "未记录描述";
              if (category === "init_stories") return item["描述"] || "未记录描述";
              return "未记录描述";
          }

          function renderBadges(category, item) {
              var badges = [], html = [], i = 0;
              if (category === "ships") { if (item["舰船类型"]) badges.push(item["舰船类型"]); if (item["吨位"]) badges.push(item["吨位"]); }
              if (category === "items" && item["品质"] !== undefined) badges.push("品质 " + item["品质"]);
              if (category === "init_stories" && item["时间"]) badges.push(item["时间"]);
              for (i = 0; i < badges.length; i++) html.push('<span class="text-[10px] px-2 py-1 border border-[var(--border-main)] text-[var(--accent-main)]">' + escapeHtml(badges[i]) + '</span>');
              return html.join(" ");
          }

          function getSelectedStory() {
              return state.selections.init_stories.length ? state.selections.init_stories[0] : null;
          }

          function uniqueIndustryName(base) {
              var name = base || "新工业基地", suffix = 2, exists = true, i = 0;
              while (exists) {
                  exists = false;
                  for (i = 0; i < state.industries.length; i++) if (state.industries[i]._key === name) { exists = true; break; }
                  if (exists) name = (base || "新工业基地") + suffix++;
              }
              return name;
          }

          function addIndustryPreset(presetName) {
              var preset = gameData && gameData.industries && gameData.industries[presetName];
              if (!preset) return;
              var clone = JSON.parse(JSON.stringify(preset));
              clone._key = uniqueIndustryName(presetName);
              var story = getSelectedStory();
              if (story && story["地点"] && (!clone["位置"] || clone["位置"].indexOf("未指定") >= 0)) clone["位置"] = story["地点"];
              state.industries.push(clone);
              renderSummary();
              renderIndustries();
          }

          function ensureColonistIndustry() {
              var story = getSelectedStory();
              if (!story || story["开局类型"] !== "殖民者" || state.industries.length) return;
              var preset = story["默认工业"] || Object.keys(gameData.industries || {})[0];
              addIndustryPreset(preset);
          }

          function renderIndustries() {
              var grid = document.getElementById('catalog-grid');
              var presets = gameData.industries || {}, presetButtons = [], cards = [], key = "", i = 0, item;
              ensureColonistIndustry();
              for (key in presets) if (Object.prototype.hasOwnProperty.call(presets, key)) {
                  presetButtons.push('<button class="btn px-4 py-2" data-action="add-industry" data-preset="' + escapeHtml(encodeURIComponent(key)) + '">+ ' + escapeHtml(key) + '</button>');
              }
              for (i = 0; i < state.industries.length; i++) {
                  item = state.industries[i];
                  cards.push('<section class="panel p-5" style="display:grid;gap:12px;">' +
                    '<div class="flex justify-between gap-3"><strong class="text-[var(--accent-main)]">工业基地 ' + (i + 1) + '</strong><button class="btn px-3 py-1" data-action="remove-industry" data-index="' + i + '">移除</button></div>' +
                    '<label>名称<input class="w-full mt-1" data-industry-index="' + i + '" data-industry-field="_key" value="' + escapeHtml(item._key || '') + '"></label>' +
                    '<label>位置<input class="w-full mt-1" data-industry-index="' + i + '" data-industry-field="位置" value="' + escapeHtml(item["位置"] || '') + '"></label>' +
                    '<div class="grid grid-cols-1 md:grid-cols-3 gap-3"><label>类型<input class="w-full mt-1" data-industry-index="' + i + '" data-industry-field="类型" value="' + escapeHtml(item["类型"] || '') + '"></label><label>状态<input class="w-full mt-1" data-industry-index="' + i + '" data-industry-field="状态" value="' + escapeHtml(item["状态"] || '运行') + '"></label><label>防御指数 0-100<input type="number" min="0" max="100" class="w-full mt-1" data-industry-index="' + i + '" data-industry-field="防御指数" value="' + escapeHtml(item["防御指数"] || 0) + '"></label></div>' +
                    '<label>描述<textarea class="w-full mt-1" data-industry-index="' + i + '" data-industry-field="描述">' + escapeHtml(item["描述"] || '') + '</textarea></label>' +
                    '<div class="grid grid-cols-1 md:grid-cols-2 gap-3"><label>每日输入 JSON<textarea class="w-full mt-1" data-industry-index="' + i + '" data-industry-map="输入">' + escapeHtml(JSON.stringify(item["输入"] || {})) + '</textarea></label><label>每日输出 JSON<textarea class="w-full mt-1" data-industry-index="' + i + '" data-industry-map="输出">' + escapeHtml(JSON.stringify(item["输出"] || {})) + '</textarea></label></div>' +
                  '</section>');
              }
              grid.className = "grid-container flex-1";
              grid.innerHTML = '<div class="panel p-4" style="grid-column:1/-1;"><div class="font-bold mb-3">工业预设</div><div class="flex flex-wrap gap-2">' + presetButtons.join('') + '</div><div class="text-xs text-[var(--text-muted)] mt-3">输入与输出使用稀疏 JSON，例如 {"矿物":2}。殖民者至少保留一座基地。</div></div>' + (cards.join('') || '<div class="panel p-6 text-[var(--text-muted)]">当前没有初始工业基地；可从上方预设添加。</div>');
          }

          function renderReputations() {
              var grid = document.getElementById('catalog-grid');
              var html = [], name = "", locked;
              state.reputations["铁血盟约"] = -50;
              state.reputations["海盗势力"] = -50;
              for (name in state.reputations) if (Object.prototype.hasOwnProperty.call(state.reputations, name)) {
                  locked = name === "铁血盟约" || name === "海盗势力";
                  html.push('<label class="panel p-4"><div class="flex justify-between gap-3"><strong>' + escapeHtml(name) + '</strong><span class="font-mono">' + escapeHtml(state.reputations[name]) + '</span></div><input class="w-full mt-3" type="number" min="-1000" max="1000" step="1" data-reputation="' + escapeHtml(name) + '" value="' + escapeHtml(state.reputations[name]) + '" ' + (locked ? 'disabled' : '') + '></label>');
              }
              grid.className = "grid-container flex-1";
              grid.innerHTML = '<div class="panel p-4" style="grid-column:1/-1;"><strong>初始势力声望</strong><div class="text-sm text-[var(--text-muted)] mt-2">范围 -1000 至 1000。大于50免高安编队搜查，达到200可获旗舰准入。海盗势力与铁血盟约固定为 -50。</div></div>' + html.join('');
          }

          function renderPhase() {
              if (currentCategory === "fitting") renderFitting();
              else if (currentCategory === "items") renderItems();
              else if (currentCategory === "industries") renderIndustries();
              else if (currentCategory === "reputations") renderReputations();
              else renderCatalog();
          }

          function renderCatalog() {
              var grid = document.getElementById('catalog-grid');
              var data = gameData[currentCategory] || {};
              var selected = state.selections[currentCategory] || [];
              var entries = [], html = [], key = "", i = 0, j = 0;
              grid.className = currentCategory === "ships" ? "ship-grid-container flex-1" : "grid-container flex-1";
              for (key in data) if (Object.prototype.hasOwnProperty.call(data, key)) {
                  entries.push([key, data[key]]);
              }
              if (!entries.length) {
                  grid.innerHTML = buildCustomToolbar(currentCategory) + '<div class="panel p-6 text-[var(--text-muted)]">当前分类没有可用数据。</div>';
                  return;
              }
              for (i = 0; i < entries.length; i++) {
                  var itemKey = entries[i][0];
                  var item = entries[i][1];
                  var enriched = JSON.parse(JSON.stringify(item));
                  var isSelected = false;
                  enriched._key = itemKey;
                  for (j = 0; j < selected.length; j++) if (selected[j]._key === itemKey) { isSelected = true; break; }
                  html.push('<article class="item-card ' + (isSelected ? 'selected' : '') + '" data-action="open-detail" data-payload="' + escapeHtml(encodeURIComponent(JSON.stringify(enriched))) + '">' +
                      '<div class="flex justify-between items-start gap-2"><h3 class="text-lg font-bold text-[var(--accent-main)]">' + escapeHtml(itemKey) + '</h3></div>' +
                      '<div class="flex flex-wrap gap-1">' + renderBadges(currentCategory, item) + '</div>' +
                      '<div class="text-sm text-[var(--text-muted)] leading-6">' + escapeHtml(previewText(currentCategory, item)) + '</div>' +
                  '</article>');
              }
              grid.innerHTML = buildCustomToolbar(currentCategory) + html.join("");
          }

          function parseCountMap(config, keys) {
              var map = {}, i = 0, regex, match;
              for (i = 0; i < keys.length; i++) {
                  regex = new RegExp('(\\d+)' + keys[i], 'g');
                  match = regex.exec(config || "");
                  map[keys[i]] = match ? parseInt(match[1], 10) : 0;
              }
              return map;
          }

          function buildWeaponSlots(ship) {
              var counts = parseCountMap(ship["炮位配置"], ["S","M","L","XL","C","T"]);
              var slots = [], key = "", i = 0;
              for (key in counts) if (counts[key] > 0) for (i = 1; i <= counts[key]; i++) slots.push({ id: key + i, mount: key, label: key + i });
              return slots;
          }

          function buildModuleSlots(ship) {
              var counts = parseCountMap(ship["装备槽位配置"], ["H","L"]);
              var slots = [], i = 0;
              for (i = 1; i <= counts["H"]; i++) slots.push({ id: "H" + i, slotType: "H", label: "H" + i });
              for (i = 1; i <= counts["L"]; i++) slots.push({ id: "L" + i, slotType: "L", label: "L" + i });
              return slots;
          }

          function parseRequirement(reqText) {
              var out = { PG: 0, CPU: 0, "吨位": "", "炮位": "无", "装备槽位": "无" };
              var parts = (reqText || "").split("|"), i = 0, segment = "", pair, key, value;
              for (i = 0; i < parts.length; i++) {
                  segment = parts[i].replace(/^\s+|\s+$/g, "");
                  pair = segment.split("：");
                  if (pair.length < 2) pair = segment.split(":");
                  if (pair.length >= 2) {
                      key = pair[0].replace(/^\s+|\s+$/g, "");
                      value = pair.slice(1).join(":").replace(/^\s+|\s+$/g, "");
                      out[key] = value;
                  }
              }
              out.PG = parseFloat(out.PG || 0) || 0;
              out.CPU = parseFloat(out.CPU || 0) || 0;
              return out;
          }

          function buildEmptyFittingCatalog() {
              return { weaponsByMount: { S: [], M: [], L: [], XL: [], C: [], T: [] }, modulesBySlot: { H: [], L: [] } };
          }

          function getRequirementMount(req) {
              var value = String((req || {})["炮位"] || "").toUpperCase();
              var m = value.match(/(XL|S|M|L|C|T)/);
              return m ? m[1] : "";
          }

          function getRequirementSlotType(req) {
              var value = String((req || {})["装备槽位"] || "").toUpperCase();
              var m = value.match(/[HL]/);
              return m ? m[0] : "";
          }

          function enrichFittingItem(key, item) {
              var clone = JSON.parse(JSON.stringify(item || {}));
              clone._key = key;
              return clone;
          }

          function buildFittingCatalog(data) {
              var catalog = buildEmptyFittingCatalog();
              var key = "", req, mount, slotType;
              for (key in (data.weapons || {})) if (Object.prototype.hasOwnProperty.call(data.weapons, key)) {
                  req = parseRequirement((data.weapons[key] || {})["装配要求"]);
                  mount = getRequirementMount(req);
                  if (catalog.weaponsByMount[mount]) catalog.weaponsByMount[mount].push(enrichFittingItem(key, data.weapons[key]));
              }
              for (key in (data.equipment || {})) if (Object.prototype.hasOwnProperty.call(data.equipment, key)) {
                  req = parseRequirement((data.equipment[key] || {})["装配要求"]);
                  slotType = getRequirementSlotType(req);
                  if (catalog.modulesBySlot[slotType]) catalog.modulesBySlot[slotType].push(enrichFittingItem(key, data.equipment[key]));
              }
              return catalog;
          }

          function getWeaponCandidatesByMount(mount) {
              var catalog = (gameData && gameData.fittingCatalog) ? gameData.fittingCatalog : buildEmptyFittingCatalog();
              return (catalog.weaponsByMount[mount] || []).slice();
          }

          function getModuleCandidatesBySlot(slotType) {
              var catalog = (gameData && gameData.fittingCatalog) ? gameData.fittingCatalog : buildEmptyFittingCatalog();
              return (catalog.modulesBySlot[slotType] || []).slice();
          }

          function getEquipmentDisplayName(item) {
              return (item && (item._key || item.name || item["名称"] || item["型号ID"])) || "未命名装配";
          }

          function parseBitrate(value) {
              var num = parseFloat(String(value || "").replace(/[^0-9.+-]/g, ""));
              if (!num) return 0;
              if (String(value).indexOf("PB") > -1) return num * 1000;
              return num;
          }

          function parsePlainNumber(value) {
              var num = parseFloat(String(value || "").replace(/[^0-9.+-]/g, ""));
              return num || 0;
          }

          function getEquipmentNumber(item, keys) {
              var i = 0, total = 0;
              for (i = 0; i < keys.length; i++) {
                  if (item && item[keys[i]] !== undefined) total += parsePlainNumber(item[keys[i]]);
              }
              return total * moduleStackCount(item);
          }

          function firstNonEmpty(values) {
              var i = 0;
              for (i = 0; i < values.length; i++) {
                  if (values[i] !== undefined && values[i] !== null && values[i] !== "") return values[i];
              }
              return "";
          }

          function normalizeStargazerRecord(key, raw) {
              var src = JSON.parse(JSON.stringify(raw || {}));
              var profile = src["静态档案"] || {};
              var perf = profile["性能参数"] || {};
              var prefs = profile["偏好"] || {};
              var normalized = {
                  "种族": src["种族"] || "观星者",
                  "阵营": src["阵营"] || "",
                  "身份": src["身份"] || "",
                  "好感度": src["好感度"] || 0,
                  "想法": src["想法"] || "",
                  "历史": firstNonEmpty([src["历史"], (src["附加信息"] || {})["历史"]]),
                  "型号ID": src["型号ID"] || key || "",
                  "制造商": firstNonEmpty([src["制造商"], profile["制造商"]]),
                  "品质": src["品质"] === undefined ? "" : src["品质"],
                  "充能数量": src["充能数量"],
                  "描述": firstNonEmpty([src["描述"], profile["描述"], src["备注"]]),
                  "外貌": firstNonEmpty([src["外貌"], profile["外貌"]]),
                  "身份标识": firstNonEmpty([src["身份标识"], (profile["身份标识"] || {})["类型"] ? ((profile["身份标识"] || {})["类型"] + " / " + ((profile["身份标识"] || {})["位置"] || "未记录位置")) : ""]),
                  "比特率": firstNonEmpty([src["比特率"], perf["比特率"]]),
                  "精度": formatMetric(firstNonEmpty([src["精度"], perf["精度"]]), "/MOps"),
                  "稳态增益": formatMetric(firstNonEmpty([src["稳态增益"], perf["稳态增益"]]), "TW/mV"),
                  "爆发增益": formatMetric(firstNonEmpty([src["爆发增益"], perf["爆发增益"]]), "TW/mV"),
                  "特殊效果": src["特殊效果"] || profile["特殊能力"] || {},
                  "性格": src["性格"] || profile["性格"] || [],
                  "喜欢": src["喜欢"] || prefs["喜欢"] || [],
                  "讨厌": src["讨厌"] || prefs["讨厌"] || [],
                  "性癖": src["性癖"] || prefs["性癖"] || [],
                  "外貌记录": src["外貌记录"] || { "身体": "", "胸部": "", "私处": "" },
                  "性经历": src["性经历"] || "未知",
                  "分配舰船": firstNonEmpty([src["分配舰船"], (src["附加信息"] || {})["舰船ID"]])
              };
              normalized._key = key;
              return normalized;
          }

          function normalizeStargazerMap(source) {
              var out = {}, key = "";
              for (key in source) if (Object.prototype.hasOwnProperty.call(source, key)) out[key] = normalizeStargazerRecord(key, source[key]);
              return out;
          }

          function getShipRequirement(shipName) {
              var ship = (gameData && gameData.ships) ? gameData.ships[shipName] : null;
              return ship ? (ship["观星者装配要求"] || ship["观星者需求"] || ship["接口需求"] || null) : null;
          }

          // STARGAZER_PERFORMANCE_BEGIN
          // Pure derived values. Saved fields always contain factory/modification baselines.
          function stargazerPerformance(character) {
              if (!character || character["种族"] !== "观星者") return null;
              const affection = Number(character["好感度"]);
              const positive = Number.isFinite(affection) ? Math.max(0, affection) : 0;
              const rate = Math.min(positive / 2000, 1);
              const extra = positive >= 2000 ? 2 : positive >= 1000 ? 1 : 0;
              const rounded = value => Number(value.toFixed(6));
              const metric = value => {
                  let raw = String(value ?? "");
                  const match = raw.match(/(?:\d+(?:\.\d+)?|\.\d+)(?:e[+-]?\d+)?/i);
                  if (!match) return { "显示": raw || "未记录", "有效值": null };
                  const base = Number(match[0]);
                  if (!Number.isFinite(base)) return { "显示": raw, "有效值": null };
                  if (!/TW\s*\/\s*mV/i.test(raw)) raw += " TW/mV";
                  const bonus = rounded(base * rate);
                  const total = base * (1 + rate);
                  return { "显示": raw.replace(match[0], `${base} + ${bonus} = ${rounded(total)}`), "有效值": total };
              };
              const stable = metric(character["稳态增益"]);
              const burst = metric(character["爆发增益"]);
              const charge = character["充能数量"];
              const validCharge = typeof charge === "number" && Number.isFinite(charge) && charge >= 0;
              const notice = "该观星者的性能已经被使用者影响，和同级产品有出入。";
              const description = String(character["描述"] ?? "").split(notice).join("").trim();
              return {
                  "好感增幅": `+${rounded(rate * 100)}%`,
                  "稳态增益": stable["显示"],
                  "爆发增益": burst["显示"],
                  "充能数量": validCharge ? `${charge} + ${extra} = ${rounded(charge + extra)}` : "未记录",
                  "有效稳态增益": stable["有效值"],
                  "有效爆发增益": burst["有效值"],
                  "有效充能数量": validCharge ? rounded(charge + extra) : null,
                  "描述": description + (positive > 100 ? (description ? "\n" : "") + notice : "")
              };
          }
          // STARGAZER_PERFORMANCE_END

          function getStargazerMetrics(stargazer) {
              var perf = (((stargazer || {})["静态档案"] || {})["性能参数"]) || {};
              var effective = stargazerPerformance(Object.assign({}, stargazer, {
                  "种族": "观星者",
                  "稳态增益": firstNonEmpty([(stargazer || {})["稳态增益"], perf["稳态增益"]]),
                  "爆发增益": firstNonEmpty([(stargazer || {})["爆发增益"], perf["爆发增益"]])
              }));
              return {
                  stable: effective["有效稳态增益"] || 0,
                  burst: effective["有效爆发增益"] || 0,
                  bitrate: parseBitrate(firstNonEmpty([(stargazer || {})["比特率"], perf["比特率"]])),
                  error: parsePlainNumber(firstNonEmpty([(stargazer || {})["精度"], perf["精度"]]))
              };
          }

          function isStargazerCompatible(shipName, stargazer) {
              var req = getShipRequirement(shipName);
              var m = getStargazerMetrics(stargazer);
              if (!req) return "";
              if (req.minStable !== undefined && m.stable < parsePlainNumber(req.minStable)) return "稳态增益不足";
              if (req.minBitrate !== undefined && m.bitrate < parsePlainNumber(req.minBitrate)) return "比特率不足";
              if (req.maxError !== undefined && m.error > parsePlainNumber(req.maxError)) return "精度误差过高";
              if (req.minBurst !== undefined && m.burst < parsePlainNumber(req.minBurst)) return "爆发增益不足";
              return "";
          }

          function getCurrentFittingEntries() {
              var list = [], k = "";
              for (k in state.fitting.weapons) if (Object.prototype.hasOwnProperty.call(state.fitting.weapons, k) && state.fitting.weapons[k]) list.push(state.fitting.weapons[k]);
              for (k in state.fitting.modules) if (Object.prototype.hasOwnProperty.call(state.fitting.modules, k) && state.fitting.modules[k]) list.push(state.fitting.modules[k]);
              return list;
          }

          function getFittingHpStatus(ship) {
              var items = getCurrentFittingEntries();
              var equipped = Object.fromEntries(items.map(function(item, index) { return [String(index), item]; }));
              return moduleStackHpStatus(Object.assign({}, ship || {}, { '装备': equipped }));
          }

          function syncSelectedShipHpToMax() {
              var ship = getSelectedShip();
              var hpStatus = null;
              if (!ship) return;
              hpStatus = getFittingHpStatus(ship);
              ship["护盾值"] = hpStatus.currentShield;
              ship["结构值"] = hpStatus.currentStructure;
          }

          function getSlotCurrentRequirement(kind, slotId) {
              var current = null;
              if (kind === "weapon") current = state.fitting.weapons[slotId];
              else if (kind === "module") current = state.fitting.modules[slotId];
              if (!current) return null;
              return parseRequirement(current["装配要求"]);
          }

          function getResourceStatus(extraRequirement, removedRequirement) {
              var ship = getSelectedShip();
              var entries = getCurrentFittingEntries();
              var usedPG = 0, usedCPU = 0, i = 0, req;
              var totalPG = ship ? parsePlainNumber(ship["装配资源"] && ship["装配资源"]["PG"]) : 0;
              var totalCPU = ship ? parsePlainNumber(ship["装配资源"] && ship["装配资源"]["CPU"]) : 0;
              for (i = 0; i < entries.length; i++) {
                  req = parseRequirement(entries[i]["装配要求"]);
                  usedPG += req.PG * moduleStackCount(entries[i]);
                  usedCPU += req.CPU * moduleStackCount(entries[i]);
              }
              if (removedRequirement) {
                  usedPG -= removedRequirement.PG;
                  usedCPU -= removedRequirement.CPU;
              }
              if (extraRequirement) {
                  usedPG += extraRequirement.PG;
                  usedCPU += extraRequirement.CPU;
              }
              return {
                  totalPG: totalPG,
                  totalCPU: totalCPU,
                  usedPG: usedPG,
                  usedCPU: usedCPU,
                  remainPG: totalPG - usedPG,
                  remainCPU: totalCPU - usedCPU
              };
          }

          function buildSlotButton(x, y, label, text, className, kind, slotId) {
              return '<button class="ring-slot ' + className + '" style="left:' + x + '%;top:' + y + '%;" data-action="open-fitting-slot" data-kind="' + escapeHtml(kind) + '" data-slot-id="' + escapeHtml(slotId || "") + '" aria-label="' + escapeHtml(label + " " + text) + '"><span class="slot-name">' + escapeHtml(label) + '</span><span class="slot-text">' + escapeHtml(text) + '</span></button>';
          }

          function buildRingPositions(count, radiusX, radiusY, startDeg, endDeg, centerX, centerY) {
              var points = [], i = 0, deg, rad;
              if (count <= 0) return points;
              if (count === 1) {
                  deg = (startDeg + endDeg) / 2;
                  rad = deg * Math.PI / 180;
                  points.push({ x: centerX + Math.cos(rad) * radiusX, y: centerY + Math.sin(rad) * radiusY });
                  return points;
              }
              for (i = 0; i < count; i++) {
                  deg = startDeg + (endDeg - startDeg) * (i / (count - 1));
                  rad = deg * Math.PI / 180;
                  points.push({ x: centerX + Math.cos(rad) * radiusX, y: centerY + Math.sin(rad) * radiusY });
              }
              return points;
          }

          function renderFitting() {
              var ship = getSelectedShip();
              var grid = document.getElementById('catalog-grid');
              var centerX = 50, centerY = 41;
              var weapons, modules, weaponPos, highSlots, lowSlots, highPos, lowPos;
              var i = 0, weaponHtml = [], moduleHtml = [], fitList = [], status, hpStatus, stargazerLabel, stargazerMeta;
              if (!ship) {
                  stargazerLabel = state.fitting.stargazer ? state.fitting.stargazer._key : "未选择观星者";
                  stargazerMeta = state.fitting.stargazer ? buildStargazerMeta(state.fitting.stargazer) : "可选择一名观星者，也可保持为空并继续盲盒开局。";
                  grid.className = "flex-1";
                  grid.innerHTML = buildCustomToolbar('fitting') +
                      '<div class="panel p-6 mt-4"><div class="text-xl font-bold text-[var(--accent-main)]">已跳过起始舰船</div>' +
                      '<div class="text-sm text-[var(--text-muted)] mt-3">无法进行武器与模块装配，但仍可独立选择观星者。</div>' +
                      '<div class="stargazer-dock mt-5"><div><div class="label">STARGAZER INTERFACE</div><div class="name">' + escapeHtml(stargazerLabel) + '</div><div class="text-xs text-[var(--text-muted)] mt-1">' + escapeHtml(stargazerMeta) + '</div></div>' +
                      '<div class="stargazer-actions"><button class="btn px-5 py-3" data-action="open-fitting-selector" data-kind="stargazer" data-slot-id="CENTER">选择观星者</button><button class="btn px-5 py-3" data-action="edit-selected-stargazer"' + (state.fitting.stargazer ? '' : ' disabled') + '>编辑观星者</button></div></div></div>';
                  return;
              }
              weapons = buildWeaponSlots(ship);
              modules = buildModuleSlots(ship);
              weaponPos = buildRingPositions(weapons.length, 40, 31, -160, 160, centerX, centerY);
              highSlots = [];
              lowSlots = [];
              for (i = 0; i < modules.length; i++) {
                  if (modules[i].slotType === "H") highSlots.push(modules[i]);
                  else if (modules[i].slotType === "L") lowSlots.push(modules[i]);
              }
              highPos = buildRingPositions(highSlots.length, 25, 19, 112, 248, centerX, centerY);
              lowPos = buildRingPositions(lowSlots.length, 25, 19, -68, 68, centerX, centerY);
              for (i = 0; i < weapons.length; i++) {
                  var w = state.fitting.weapons[weapons[i].id];
                  weaponHtml.push(buildSlotButton(weaponPos[i].x.toFixed(2), weaponPos[i].y.toFixed(2), weapons[i].label, w ? getEquipmentDisplayName(w) : ("空槽 / " + weapons[i].mount), w ? "filled" : "empty", "weapon", weapons[i].id));
              }
              for (i = 0; i < highSlots.length; i++) {
                  var h = state.fitting.modules[highSlots[i].id];
                  moduleHtml.push(buildSlotButton(highPos[i].x.toFixed(2), highPos[i].y.toFixed(2), highSlots[i].label, h ? getEquipmentDisplayName(h) : "高功率槽", h ? "filled" : "empty", "module", highSlots[i].id));
              }
              for (i = 0; i < lowSlots.length; i++) {
                  var l = state.fitting.modules[lowSlots[i].id];
                  moduleHtml.push(buildSlotButton(lowPos[i].x.toFixed(2), lowPos[i].y.toFixed(2), lowSlots[i].label, l ? getEquipmentDisplayName(l) : "低功率槽", l ? "filled" : "empty", "module", lowSlots[i].id));
              }
              status = getResourceStatus();
              hpStatus = getFittingHpStatus(ship);
              for (i = 0; i < weapons.length; i++) if (state.fitting.weapons[weapons[i].id]) fitList.push('<div class="fit-row">' + escapeHtml(weapons[i].label) + ' / ' + escapeHtml(getEquipmentDisplayName(state.fitting.weapons[weapons[i].id])) + '</div>');
              for (i = 0; i < modules.length; i++) if (state.fitting.modules[modules[i].id]) fitList.push('<div class="fit-row">' + escapeHtml(modules[i].label) + ' / ' + escapeHtml(getEquipmentDisplayName(state.fitting.modules[modules[i].id])) + '</div>');
              stargazerLabel = state.fitting.stargazer ? state.fitting.stargazer._key : "未选择观星者";
              stargazerMeta = state.fitting.stargazer ? buildStargazerMeta(state.fitting.stargazer) : "从下方接口选择一名观星者";
              grid.className = "flex-1";
              grid.innerHTML = '<div class="fitting-shell">' +
                  buildCustomToolbar('fitting') +
                  '<div class="fitting-stage">' +
                      '<div class="dial-ring outer"></div><div class="dial-ring middle"></div>' +
                      weaponHtml.join("") +
                      moduleHtml.join("") +
                      '<div class="center-core" aria-label="剩余装配资源与舰船耐久"><strong>REMAINING</strong><small>' + escapeHtml(ship._key) + ' / PG-CPU-HP</small><div class="core-resource"><div><span>PG</span><b>' + status.remainPG + '</b></div><div><span>CPU</span><b>' + status.remainCPU + '</b></div><div><span>护盾</span><b>' + hpStatus.currentShield + '/' + hpStatus.maxShield + '</b></div><div><span>结构</span><b>' + hpStatus.currentStructure + '/' + hpStatus.maxStructure + '</b></div></div></div>' +
                      '<div class="stargazer-dock"><div><div class="label">STARGAZER INTERFACE</div><div class="name">' + escapeHtml(stargazerLabel) + '</div><div class="text-xs text-[var(--text-muted)] mt-1">' + escapeHtml(stargazerMeta) + '</div></div><div class="stargazer-actions"><button class="btn px-5 py-3" data-action="open-fitting-selector" data-kind="stargazer" data-slot-id="CENTER">选择观星者</button><button class="btn px-5 py-3" data-action="edit-selected-stargazer"' + (state.fitting.stargazer ? '' : ' disabled') + '>编辑观星者</button></div></div>' +
                  '</div>' +
                  '<div class="fitting-side">' +
                      '<div class="panel p-4"><div class="text-lg font-bold text-[var(--accent-main)]">' + escapeHtml(ship._key) + '</div><div class="text-sm text-[var(--text-muted)] mt-2">' + escapeHtml(ship["炮位配置"] || "") + ' / ' + escapeHtml(ship["装备槽位配置"] || "") + '</div></div>' +
                      '<div class="panel p-4"><div class="text-sm text-[var(--accent-main)] mb-2">已装配清单</div><div class="fit-list">' + (fitList.length ? fitList.join("") : '<div class="fit-row">尚未装配模块</div>') + '</div></div>' +
                  '</div>' +
              '</div>';
          }

          function openDetailModal(encoded) {
              var clone = null;
              modalMode = "detail";
              selectorContext = null;
              currentViewingItem = JSON.parse(decodeURIComponent(encoded));
              clone = JSON.parse(JSON.stringify(currentViewingItem));
              delete clone._key;
              document.getElementById('modal-title').textContent = currentViewingItem._key;
              document.getElementById('modal-body').innerHTML = formatValue(clone);
              document.getElementById('modal-primary-action').style.display = 'inline-block';
              document.getElementById('modal-primary-action').textContent = '选择';
              document.getElementById('modal-primary-action').disabled = false;
              document.getElementById('modal-primary-action').setAttribute('data-action', 'select-current-item');
              document.getElementById('modal-details').style.display = 'flex';
          }

          function openFittingSlot(kind, slotId) {
              var current = null;
              if (kind === "weapon") current = state.fitting.weapons[slotId];
              else if (kind === "module") current = state.fitting.modules[slotId];
              if (current) openEquippedModal(kind, slotId, current);
              else openFittingSelector(kind, slotId);
          }

          function openEquippedModal(kind, slotId, item) {
              var clone = JSON.parse(JSON.stringify(item));
              var req = parseRequirement(clone["装配要求"]);
              var statusIfRemoved = getResourceStatus(null, req);
              modalMode = "equipped";
              selectorContext = { kind: kind, slotId: slotId };
              currentViewingItem = clone;
              document.getElementById('modal-title').textContent = slotId + " / " + getEquipmentDisplayName(clone);
              delete clone._key;
              document.getElementById('modal-body').innerHTML =
                  '<div class="mb-4 p-3 border border-[var(--border-main)] bg-[rgba(232,248,255,0.74)]">' +
                  '<div class="text-[var(--accent-main)] mb-2">装配资源</div>' +
                  '<div class="font-mono text-xs text-[var(--text-muted)]">当前占用 PG ' + req.PG + ' / CPU ' + req.CPU + '。' + (isBuiltinEquipment(item) ? '内置装备不能在装配界面拆卸。' : '卸载后剩余 PG ' + statusIfRemoved.remainPG + ' / CPU ' + statusIfRemoved.remainCPU + '。') + '</div>' +
                  '</div>' + formatValue(clone);
              document.getElementById('modal-primary-action').style.display = 'inline-block';
              document.getElementById('modal-primary-action').textContent = isBuiltinEquipment(item) ? '内置（不可拆卸）' : '卸载';
              document.getElementById('modal-primary-action').disabled = isBuiltinEquipment(item);
              document.getElementById('modal-primary-action').setAttribute('data-action', 'unequip-current-slot');
              document.getElementById('modal-details').style.display = 'flex';
          }

          function openFittingSelector(kind, slotId) {
              var ship = getSelectedShip(), title = "", candidates = [], i = 0, slotType = "";
              if (!ship && kind !== "stargazer") return;
              if (kind !== 'stargazer' && isBuiltinEquipment(getFittingItem(kind, slotId))) {
                  openEquippedModal(kind, slotId, getFittingItem(kind, slotId));
                  return;
              }
              modalMode = "selector";
              selectorContext = { kind: kind, slotId: slotId };
              if (kind === "weapon") {
                  var mount = slotId.replace(/[0-9]/g, "");
                  title = "选择武器 / " + slotId;
                  candidates = getWeaponCandidatesByMount(mount);
              } else if (kind === "module") {
                  slotType = slotId.charAt(0);
                  title = "选择模块 / " + slotId;
                  candidates = getModuleCandidatesBySlot(slotType);
              } else {
                  title = "选择观星者 / 中央接口";
                  for (i = 0; i < getStargazerEntries().length; i++) candidates.push(getStargazerEntries()[i]);
              }
              document.getElementById('modal-title').textContent = title;
              document.getElementById('modal-body').innerHTML = renderCandidateList(kind, candidates);
              document.getElementById('modal-primary-action').style.display = 'none';
              document.getElementById('modal-details').style.display = 'flex';
          }

          function getStargazerEntries() {
              var out = [], key = "";
              for (key in (gameData.stargazers || {})) if (Object.prototype.hasOwnProperty.call(gameData.stargazers, key)) out.push(normalizeStargazerRecord(key, gameData.stargazers[key]));
              return out;
          }

          function renderCandidateList(kind, candidates) {
              var html = ['<div class="candidate-list">'], i = 0;
              if (kind !== "stargazer") html.push('<button class="btn px-3 py-2 mb-2" data-action="clear-fitting-slot">清空当前槽位</button>');
              else html.push('<button class="btn px-3 py-2 mb-2" data-action="clear-fitting-stargazer">清空观星者</button>');
              for (i = 0; i < candidates.length; i++) {
                  var candidate = JSON.parse(JSON.stringify(candidates[i]));
                  if (!candidate._key) candidate._key = getEquipmentDisplayName(candidate);
                  var evalResult = evaluateCandidate(kind, candidate);
                  html.push('<div class="candidate-card ' + (evalResult.ok ? '' : 'disabled') + '">' +
                      '<div class="head"><strong>' + escapeHtml(candidate._key || candidate.name) + '</strong><span>' + escapeHtml(kind === "stargazer" ? (candidate["型号ID"] || "") : (candidate["品质"] !== undefined ? ("品质 " + candidate["品质"]) : "")) + '</span></div>' +
                      '<div class="meta">' + escapeHtml(kind === "stargazer" ? buildStargazerMeta(candidate) : candidate["装配要求"]) + '</div>' +
                      '<div class="desc">' + escapeHtml(kind === "stargazer" ? previewStargazer(candidate) : (candidate["描述"] || "")) + '</div>' +
                      (evalResult.ok ? '<div class="mt-3"><button class="btn px-3 py-2" data-action="apply-fitting-selection" data-kind="' + escapeHtml(kind) + '" data-payload="' + escapeHtml(encodeURIComponent(JSON.stringify(candidate))) + '">装配</button></div>' : '<div class="reason">' + escapeHtml(evalResult.reason) + '</div>') +
                  '</div>');
              }
              html.push('</div>');
              return html.join("");
          }

          function buildStargazerMeta(candidate) {
              var m = getStargazerMetrics(candidate);
              var p = stargazerPerformance(candidate);
              return '稳态 ' + (p ? p["稳态增益"] : m.stable) + ' | 爆发 ' + (p ? p["爆发增益"] : m.burst) + ' | 充能 ' + (p ? p["充能数量"] : '未记录') + ' | 比特率 ' + m.bitrate + ' TB/s | 误差 ' + m.error;
          }

          function previewStargazer(candidate) {
              if (candidate["外貌"]) return candidate["外貌"];
              if (candidate["描述"]) return candidate["描述"];
              if (candidate["静态档案"] && candidate["静态档案"]["描述"]) return candidate["静态档案"]["描述"];
              return "未记录描述";
          }

          function evaluateCandidate(kind, candidate) {
              var ship = getSelectedShip(), resourceStatus, req, compatible, removedRequirement, uniqueGroup, slotId, fitted;
              if (kind === "stargazer") {
                  compatible = isStargazerCompatible(getSelectedShipName(), candidate);
                  if (compatible) return { ok: false, reason: compatible };
                  return { ok: true, reason: "" };
              }
              if (!selectorContext) return { ok: false, reason: '请选择装配槽位。' };
              if (moduleStackCount(candidate) !== 1) return { ok: false, reason: '请在每个槽位逐件装配；相同装备会自动堆叠保存。' };
              if (isBuiltinEquipment(getFittingItem(kind, selectorContext.slotId))) return { ok: false, reason: '内置装备不能拆卸或替换。' };
              req = parseRequirement(candidate["装配要求"]);
              removedRequirement = getSlotCurrentRequirement(kind, selectorContext.slotId);
              resourceStatus = getResourceStatus(req, removedRequirement);
              if (resourceStatus.remainPG < 0) return { ok: false, reason: "PG 不足" };
              if (resourceStatus.remainCPU < 0) return { ok: false, reason: "CPU 不足" };
              if (kind === "weapon") {
                  var mount = selectorContext.slotId.replace(/[0-9]/g, "");
                  if (getRequirementMount(req) !== mount) return { ok: false, reason: "炮位尺寸不匹配" };
                  if (mount === 'T' && (!candidate['T槽种类'] || candidate['T槽种类'] !== ship['T槽种类'])) return { ok: false, reason: '超级武器种类不匹配' };
                  if ((req["炮位"] || "").indexOf(selectorContext.slotId.replace(/[0-9]/g, "")) === -1 && req["炮位"] !== "无") return { ok: false, reason: "炮位尺寸不匹配" };
              } else {
                  if ((req["装备槽位"] || "").indexOf(selectorContext.slotId.charAt(0)) === -1 && req["装备槽位"] !== "无") return { ok: false, reason: "装备槽位不匹配" };
                  uniqueGroup = String(candidate["唯一组"] || "").replace(/^\s+|\s+$/g, "");
                  if (uniqueGroup) {
                      for (slotId in state.fitting.modules) if (Object.prototype.hasOwnProperty.call(state.fitting.modules, slotId) && slotId !== selectorContext.slotId) {
                          fitted = state.fitting.modules[slotId];
                          if (fitted && String(fitted["唯一组"] || "").replace(/^\s+|\s+$/g, "") === uniqueGroup) return { ok: false, reason: "唯一装备组“" + uniqueGroup + "”已安装" };
                      }
                  }
              }
              return { ok: true, reason: "" };
          }

          function applyFittingSelection(kind, encoded) {
              var candidate = JSON.parse(decodeURIComponent(encoded));
              if (!evaluateCandidate(kind, candidate).ok) return;
              if (kind === "weapon") state.fitting.weapons[selectorContext.slotId] = sanitizeEquipment(candidate);
              else if (kind === "module") state.fitting.modules[selectorContext.slotId] = sanitizeEquipment(candidate);
              else state.fitting.stargazer = candidate;
              syncSelectedShipHpToMax();
              closeModal();
              renderSummary();
              renderPhase();
