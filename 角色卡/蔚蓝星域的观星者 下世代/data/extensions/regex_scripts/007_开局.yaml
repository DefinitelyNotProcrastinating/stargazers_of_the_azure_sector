              document.getElementById('custom-name-input').value = '';
              document.getElementById('custom-module-kind-row').style.display = kind === 'module' ? 'grid' : 'none';
              document.getElementById('save-custom-ship-button').style.display = kind === 'ship' ? '' : 'none';
              if (kind === 'ship') {
                  document.getElementById('custom-formatter-title').textContent = '自定义舰船 Formatter';
                  document.getElementById('custom-formatter-hint').innerHTML = '填写舰船名称与 JSON/YAML 内容，舰级不限。必须包含 <b>炮位配置</b>、<b>装备槽位配置</b>、<b>装配资源.PG</b>、<b>装配资源.CPU</b>。“加入列表”用于本次开局；“保存到世界书并选用”会永久加入开局候选库，同名舰船自动添加编号。';
                  document.getElementById('custom-name-input').placeholder = '例如：苍蓝试作护卫舰';
                  document.getElementById('custom-json-input').value = JSON.stringify(sourceItem || getCustomShipTemplate(), null, 2);
              } else if (kind === 'item') {
                  document.getElementById('custom-formatter-title').textContent = '创建新物品';
                  document.getElementById('custom-formatter-hint').innerHTML = '填写物品名称、数量、标签和效果。创建后加入候选库并选入开局，保存预选后可在其他开局继续使用。';
                  document.getElementById('custom-name-input').placeholder = '例如：便携观测工具箱';
                  document.getElementById('custom-json-input').value = JSON.stringify(sourceItem || getCustomItemTemplate(), null, 2);
              } else if (kind === 'stargazer') {
                  document.getElementById('custom-formatter-title').textContent = sourceItem ? '编辑观星者 Formatter' : '自定义观星者 Formatter';
                  document.getElementById('custom-formatter-hint').innerHTML = '填写观星者名称与 JSON/YAML 内容。必须包含 <b>比特率</b>、<b>精度</b>、<b>稳态增益</b>、<b>爆发增益</b>。保存后会写入本 session 的观星者列表，可立即装配。';
                  document.getElementById('custom-name-input').placeholder = '例如：粉心试作观星者';
