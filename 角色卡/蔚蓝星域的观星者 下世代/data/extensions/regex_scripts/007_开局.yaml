          function closeCustomFormatter() {
              document.getElementById('modal-custom-formatter').style.display = 'none';
          }

          function fillCustomTemplate() {
              if (customFormatterContext.kind === 'ship') {
                  document.getElementById('custom-json-input').value = JSON.stringify(getCustomShipTemplate(), null, 2);
                  return;
              }
              if (customFormatterContext.kind === 'stargazer') {
                  document.getElementById('custom-json-input').value = JSON.stringify(getCustomStargazerTemplate(), null, 2);
                  return;
              }
              if (document.getElementById('custom-module-kind').value === 'weapon') document.getElementById('custom-json-input').value = JSON.stringify(getCustomWeaponTemplate(), null, 2);
              else document.getElementById('custom-json-input').value = JSON.stringify(getCustomEquipmentTemplate(), null, 2);
          }

          function showCustomFormatterError(message) {
              var box = document.getElementById('custom-formatter-error');
              box.textContent = message;
              box.style.display = 'block';
          }

          function parseCustomFormatterInput() {
              var raw = document.getElementById('custom-json-input').value;
              if (!raw.replace(/^\s+|\s+$/g, "")) throw new Error("内容不能为空。");
              try { return JSON.parse(raw); }
              catch (jsonError) {
                  if (typeof jsyaml !== "undefined") return jsyaml.load(raw);
                  throw jsonError;
              }
          }

          function formatCustomJson() {
              try {
                  var obj = parseCustomFormatterInput();
                  document.getElementById('custom-json-input').value = JSON.stringify(obj, null, 2);
                  document.getElementById('custom-formatter-error').style.display = 'none';
              } catch (e) {
                  showCustomFormatterError("无法解析 JSON/YAML：" + (e && e.message ? e.message : e));
              }
          }

          function normalizeCustomShip(obj) {
              var ship = JSON.parse(JSON.stringify(obj || {}));
              ship["舰船类型"] = ship["舰船类型"] || "自定义舰船";
              ship["吨位"] = ship["吨位"] || "自定义吨位";
              ship["描述"] = ship["描述"] || "玩家自定义舰船。";
              ship["炮位配置"] = ship["炮位配置"] || "0S";
              ship["装备槽位配置"] = ship["装备槽位配置"] || "0H 0L";
              ship["船体护盾值"] = parsePlainNumber(firstNonEmpty([ship["船体护盾值"], ship["舰体参数"] && ship["舰体参数"]["护盾"]]));
              ship["船体结构值"] = parsePlainNumber(firstNonEmpty([ship["船体结构值"], ship["舰体参数"] && ship["舰体参数"]["结构"], ship["舰体参数"] && ship["舰体参数"]["装甲"]]));
              ship["护盾值"] = parsePlainNumber(firstNonEmpty([ship["护盾值"], ship["船体护盾值"]]));
              ship["结构值"] = parsePlainNumber(firstNonEmpty([ship["结构值"], ship["船体结构值"]]));
              ship["装配资源"] = ship["装配资源"] || {};
              ship["装配资源"]["PG"] = parsePlainNumber(ship["装配资源"]["PG"]);
              ship["装配资源"]["CPU"] = parsePlainNumber(ship["装配资源"]["CPU"]);
              ship["观星者装配要求"] = ship["观星者装配要求"] || { "minStable": 0, "minBitrate": 0, "maxError": 999, "minBurst": 0 };
              ship["来源"] = ship["来源"] || "玩家自定义";
              return ship;
          }

          function validateCustomShip(ship) {
              if (!ship || typeof ship !== "object" || Array.isArray(ship)) return "舰船内容必须是对象。";
              if (!ship["炮位配置"]) return "缺少 炮位配置，例如：2S 1M。";
              if (!ship["装备槽位配置"]) return "缺少 装备槽位配置，例如：2H 2L。";
              if (!ship["装配资源"] || parsePlainNumber(ship["装配资源"]["PG"]) <= 0 || parsePlainNumber(ship["装配资源"]["CPU"]) <= 0) return "装配资源.PG 与 装配资源.CPU 必须大于 0。";
              return "";
          }

          function normalizeCustomModule(obj, moduleKind) {
              var item = JSON.parse(JSON.stringify(obj || {}));
              var req = parseRequirement(item["装配要求"] || "");
              item["品质"] = item["品质"] === undefined ? 1 : item["品质"];
              item["描述"] = item["描述"] || "玩家自定义模块。";
              if (!item["装配要求"]) {
                  if (moduleKind === "weapon") item["装配要求"] = "PG：10 | CPU：10 | 吨位：无 | 炮位：S | 装备槽位：无";
                  else item["装配要求"] = "PG：10 | CPU：10 | 吨位：无 | 炮位：无 | 装备槽位：H";
              }
              item["来源"] = item["来源"] || "玩家自定义";
              return item;
          }

          function validateCustomModule(item, moduleKind) {
              var req;
              if (!item || typeof item !== "object" || Array.isArray(item)) return "模块内容必须是对象。";
              if (!item["装配要求"]) return "缺少 装配要求。";
              req = parseRequirement(item["装配要求"]);
              if (req.PG < 0 || req.CPU < 0) return "PG/CPU 不能为负数。";
              if (moduleKind === "weapon" && !getRequirementMount(req)) return "武器模块必须在 装配要求 中填写炮位：S、M、L 或 XL。";
              if (moduleKind === "equipment" && !getRequirementSlotType(req)) return "装备模块必须在 装配要求 中填写装备槽位：H 或 L。";
              return "";
          }

          function applyCustomFormatter() {
              var name = document.getElementById('custom-name-input').value.replace(/^\s+|\s+$/g, "");
              var obj, err, key, moduleKind;
              try { obj = parseCustomFormatterInput(); }
              catch (e) { showCustomFormatterError("无法解析 JSON/YAML：" + (e && e.message ? e.message : e)); return; }
              if (!name) { showCustomFormatterError("条目名称不能为空。"); return; }
              if (customFormatterContext.kind === 'ship') {
                  obj = normalizeCustomShip(obj);
                  err = validateCustomShip(obj);
                  if (err) { showCustomFormatterError(err); return; }
                  key = makeKeyUnique(gameData.ships, name);
                  gameData.ships[key] = obj;
                  obj._key = key;
                  state.selections.ships = [JSON.parse(JSON.stringify(obj))];
                  resetFitting();
                  closeCustomFormatter();
                  goToPhase(0);
                  return;
              }
              if (customFormatterContext.kind === 'stargazer') {
                  obj = normalizeCustomStargazer(obj, name);
                  err = validateCustomStargazer(obj);
                  if (err) { showCustomFormatterError(err); return; }
                  gameData.stargazers = gameData.stargazers || {};
                  if (customFormatterContext.source === 'selected-stargazer' && customFormatterContext.key) {
                      key = customFormatterContext.key;
                  } else {
                      key = makeKeyUnique(gameData.stargazers || {}, name);
                  }
                  obj._key = key;
                  gameData.stargazers[key] = normalizeStargazerRecord(key, obj);
                  if (customFormatterContext.source === 'gacha' && gachaSessionCards[customFormatterContext.index]) {
                      gachaSessionCards[customFormatterContext.index] = normalizeStargazerRecord(key, obj);
                      gachaSessionCards[customFormatterContext.index]._revealed = true;
                      gachaSessionCards[customFormatterContext.index]._savedSessionKey = key;
                      if (selectedGachaIndex === customFormatterContext.index) state.fitting.stargazer = gameData.stargazers[key];
                      renderGachaCards();
                  }
                  if (customFormatterContext.source === 'selected-stargazer') {
                      state.fitting.stargazer = gameData.stargazers[key];
                      if (selectedGachaIndex >= 0 && gachaSessionCards[selectedGachaIndex]) {
                          gachaSessionCards[selectedGachaIndex] = JSON.parse(JSON.stringify(gameData.stargazers[key]));
                          gachaSessionCards[selectedGachaIndex]._revealed = true;
                          gachaSessionCards[selectedGachaIndex]._savedSessionKey = key;
                      }
                  }
                  closeCustomFormatter();
                  renderSummary();
                  renderPhase();
                  alert("已保存观星者：" + key);
                  return;
              }
              moduleKind = document.getElementById('custom-module-kind').value;
              obj = normalizeCustomModule(obj, moduleKind);
              err = validateCustomModule(obj, moduleKind);
              if (err) { showCustomFormatterError(err); return; }
              if (moduleKind === 'weapon') {
                  key = makeKeyUnique(gameData.weapons, name);
                  gameData.weapons[key] = obj;
              } else {
                  key = makeKeyUnique(gameData.equipment, name);
                  gameData.equipment[key] = obj;
              }
              gameData.fittingCatalog = buildFittingCatalog(gameData);
              closeCustomFormatter();
              renderSummary();
              renderPhase();
              alert("已加入模块列表：" + key);
          }


          document.addEventListener('change', function(event) {
              if (event.target && event.target.id === 'custom-module-kind' && customFormatterContext.kind === 'module') fillCustomTemplate();
          });


          function getCustomStargazerTemplate() {
              return {
                  "种族": "观星者",
                  "阵营": "玩家自定义",
                  "身份": "舰载观测接口人格",
                  "好感度": 0,
                  "想法": "等待与舰长建立同步。",
                  "型号ID": "CUSTOM-SG-001",
                  "制造商": "玩家自定义",
                  "描述": "填写观星者的设计理念、人格轮廓与接口特性。",
                  "外貌": "填写外貌、常服、发色、眼睛颜色、肤色与身材记录。",
                  "身份标识": "粉色爱心卡面 / 自定义接口标记",
                  "比特率": "450TB/s",
                  "精度": 1.0,
                  "稳态增益": 5.0,
                  "爆发增益": 10.0,
                  "特殊效果": { "接口效果": "填写观测、导航、火控或剧情向能力。" },
                  "性格": ["自定义"],
                  "喜欢": [],
                  "讨厌": [],
                  "性癖": [],
                  "外貌记录": { "身体": "", "胸部": "", "私处": "" },
                  "性经历": "未知"
              };
          }

          function getGachaDefinition() {
              var gd = (gameData && gameData.gacha_data) ? gameData.gacha_data : {};
              return gd.gacha_pool_definition || gd || {};
          }

          function getPoolArray(def, key) {
              var value = def ? def[key] : null;
              if (!Array.isArray(value)) return [];
              return value.filter(function(x) { return x !== undefined && x !== null && String(x).indexOf('[list of str') === -1 && String(x).indexOf('list of str') === -1; });
          }

          function choiceFromPool(pool, fallback) {
              var arr = Array.isArray(pool) ? pool : [];
              var i = 0, total = 0, r = 0, p = 0;
              if (!arr.length) return fallback;
              for (i = 0; i < arr.length; i++) if (arr[i] && typeof arr[i] === 'object' && arr[i]["概率"] !== undefined) total += parseFloat(arr[i]["概率"]) || 0;
              if (total > 0) {
                  r = Math.random() * total;
                  for (i = 0; i < arr.length; i++) {
                      p = arr[i] && typeof arr[i] === 'object' ? (parseFloat(arr[i]["概率"]) || 0) : 0;
                      if (r <= p) return arr[i];
                      r -= p;
                  }
              }
              return arr[Math.floor(Math.random() * arr.length)];
          }

          function normalish() {
              var s = 0, i = 0;
              for (i = 0; i < 6; i++) s += Math.random();
              return (s - 3) / 3;
          }

          function clampNumber(value, min, max) {
              value = parseFloat(value) || 0;
              if (min !== undefined && value < min) value = min;
              if (max !== undefined && value > max) value = max;
              return value;
          }

          function randomAround(base, spread, min, decimals) {
              var n = (parseFloat(base) || 0) * (1 + normalish() * spread);
              n = clampNumber(n, min, undefined);
              return parseFloat(n.toFixed(decimals === undefined ? 2 : decimals));
          }

          function formatBitrateTB(tb) {
              tb = Math.max(1, parseFloat(tb) || 1);
              if (tb >= 1000) return parseFloat((tb / 1000).toFixed(2)) + "PB/s";
              return Math.round(tb) + "TB/s";
          }

          function buildGachaName(source, quality, index) {
              var code = Math.floor(1000 + Math.random() * 9000);
              var sourceLabel = String(source || "未知来源").replace(/\s+/g, "");
              return sourceLabel + " Q" + quality + "-观星者-" + code + "-" + (index + 1);
          }

          function asText(value, fallback) {
              if (value === undefined || value === null || value === "") return fallback || "";
              if (typeof value === "object") return JSON.stringify(value);
              return String(value);
          }

          function pickText(def, key, fallback) {
              return asText(choiceFromPool(getPoolArray(def, key), fallback), fallback);
          }

          function pickMany(def, key, count) {
              var pool = getPoolArray(def, key), out = [], picked = {}, item = "", guard = 0;
              count = count || 1;
              while (out.length < count && guard < 40) {
                  item = asText(choiceFromPool(pool, ""), "");
                  if (item && !picked[item]) { out.push(item); picked[item] = true; }
                  guard++;
                  if (!pool.length) break;
              }
              return out;
          }

          function generateGachaStargazer(index) {
              var def = getGachaDefinition();
              var qualityPool = getPoolArray(def, "品质池");
              var q = choiceFromPool(qualityPool, { "品质": 1, "比特率基准": "150TB/s", "精度基准": 3.0, "稳态增益基准": 2.0, "爆发增益基准": 5.0 });
              var quality = parseInt(q["品质"] || 1, 10);
              var source = pickText(def, "设计来源", "未知设计局");
              var body = choiceFromPool(getPoolArray(def, "身材池"), { bwh: "未记录", "身高": "未记录" }) || {};
              var skin = pickText(def, "皮肤池", "白皙");
              var eyes = pickText(def, "眼睛颜色池", "蓝色");
              var hair = pickText(def, "发色池", "银色");
              var outfitMain = pickText(def, "常服主元素", "粉色接口制服");
              var outfitColor = pickText(def, "常服颜色", "粉色");
              var outfitSub1 = pickText(def, "常服副元素1", "爱心发饰");
              var outfitSub2 = pickText(def, "常服副元素2", "发光参数电子项圈");
              var bitrateTB = parseBitrate(q["比特率基准"] || "150TB/s");
              var bitrate = formatBitrateTB(randomAround(bitrateTB, 0.13, 1, 0));
              var precision = randomAround(q["精度基准"], 0.20, 0.001, quality >= 5 ? 3 : 2);
              var stable = randomAround(q["稳态增益基准"], 0.14, 0.1, 2);
              var burst = randomAround(q["爆发增益基准"], 0.16, 0.1, 2);
              var traits = pickMany(def, "额外特性池", 2);
              var speech = pickText(def, "说话方式池", "温柔姐姐系少女风格。");
              var name = buildGachaName(source, quality, index);
              return normalizeStargazerRecord(name, {
                  "种族": "观星者",
                  "阵营": source,
                  "身份": "观星者",
                  "好感度": 0,
                  "想法": "无",
                  "型号ID": "Q" + quality + "-" + Math.floor(10000 + Math.random() * 90000),
                  "制造商": source,
                  "品质": quality,
                  "描述":  (traits.length ? " 特性：" + traits.join("、") + "。" : ""),
                  "外貌": asText(body.bwh, "未记录") + " / " + asText(body["身高"], "未记录") + "，" + skin + "肤色，" + hair + "发，" + eyes + "眼。常服为" + outfitColor + "系" + outfitMain + "，附带" + outfitSub1 + "与" + outfitSub2 + "。",
                  "身份标识": "臀部条形码纹身",
                  "比特率": bitrate,
                  "精度": precision,
                  "稳态增益": stable,
                  "爆发增益": burst,
                  "特殊效果": {
                      "特殊特性": traits.length ? traits.join(" / ") : "标准观测接口",
                      "说话方式": speech
                  },
                  "性格": traits.concat([speech]),
                  "喜欢": pickMany(def, "常规喜好池", 3),
                  "讨厌": pickMany(def, "常规厌恶池", 2),
                  "性癖": pickMany(def, "亲密喜好池", 2),
                  "外貌记录": { "身体": asText(body.bwh, "未记录") + " / " + asText(body["身高"], "未记录"), "胸部": "由身材记录", "私处": "由身材定义" },
                  "性经历": "无",
              });
          }

          function rollGachaTen() {
              var i = 0;
              if (!gameData) return;
              selectedGachaIndex = -1;
              gachaSessionCards = [];
              for (i = 0; i < 10; i++) gachaSessionCards.push(generateGachaStargazer(i));
              renderGachaCards();
              document.getElementById('modal-gacha-results').style.display = 'flex';
          }

          function closeGachaResults() {
              document.getElementById('modal-gacha-results').style.display = 'none';
          }

          function updateGachaSelectedSummary() {
              var el = document.getElementById('gacha-selected-summary');
              var card = gachaSessionCards[selectedGachaIndex];
              if (!el) return;
              el.textContent = card ? ('已选择：' + (card._key || card["型号ID"] || '未命名观星者')) : '未选择观星者';
          }

          function renderGachaCards() {
              var grid = document.getElementById('gacha-card-grid');
              var html = [], i = 0, c, revealed = false, selected = false;
              document.getElementById('gacha-summary').textContent = '已生成 10 张观星者卡片。点击卡面翻开；翻开后可分别查看详情或选择。';
              for (i = 0; i < gachaSessionCards.length; i++) {
                  c = gachaSessionCards[i];
                  revealed = !!c._revealed;
                  selected = selectedGachaIndex === i;
                  html.push('<div class="gacha-card ' + (revealed ? 'revealed ' : '') + (selected ? 'selected' : '') + '" data-action="flip-gacha-card" data-index="' + i + '" tabindex="0">' +
                      (revealed ? renderRevealedGachaCard(c, i) : '<div class="gacha-face"><div class="gacha-rarity">STARGAZER</div><div class="gacha-name">♥ 观星者 ♥</div><div class="gacha-meta">点击翻卡</div></div>') +
                  '</div>');
              }
              grid.innerHTML = html.join("");
              updateGachaSelectedSummary();
          }

          function renderRevealedGachaCard(card, index) {
              var q = card["品质"] || "?";
              var selected = selectedGachaIndex === index;
              return '<div class="gacha-back"><div class="gacha-rarity">Q' + escapeHtml(q) + ' / ' + escapeHtml(card["制造商"] || card["阵营"] || "未知") + '</div>' +
                  '<div class="gacha-name">' + escapeHtml(card._key || card["型号ID"] || "未命名观星者") + '</div>' +
                  '<div class="gacha-meta">' + escapeHtml(buildStargazerMeta(card)) + '</div>' +
                  '<div class="gacha-card-actions">' +
                      '<button class="btn" data-action="open-gacha-card-detail" data-index="' + index + '">查看详情</button>' +
                      '<button class="btn" data-action="select-gacha-card" data-index="' + index + '">' + (selected ? '已选择' : '选择') + '</button>' +
                  '</div></div>';
          }

          function flipGachaCard(index) {
              if (!gachaSessionCards[index]) return;
              gachaSessionCards[index]._revealed = true;
              renderGachaCards();
          }

          function openGachaCardDetail(index) {
              var card = gachaSessionCards[index], clone;
              if (!card) return;
              card._revealed = true;
              currentViewingItem = card;
              selectorContext = { kind: "gacha-stargazer-detail", index: index };
              modalMode = "gacha-card-detail";
              clone = JSON.parse(JSON.stringify(card));
              delete clone._revealed;
              delete clone._savedSessionKey;
              document.getElementById('modal-title').textContent = card._key || "观星者卡片";
              document.getElementById('modal-body').innerHTML = '<div class="mb-4 flex flex-wrap gap-2"><button class="btn px-3 py-2" data-action="edit-gacha-card" data-index="' + index + '">编辑并保存为新观星者</button></div>' + formatValue(clone);
              document.getElementById('modal-primary-action').style.display = 'none';
              document.getElementById('modal-details').style.display = 'flex';
          }

          function selectGachaCard(index) {
              var card = gachaSessionCards[index], saved, incompatible;
              if (!card) return;
              card._revealed = true;
              incompatible = isStargazerCompatible(getSelectedShipName(), card);
              if (incompatible) { alert("该观星者与当前舰船不兼容：" + incompatible); return; }
              if (card._savedSessionKey && gameData.stargazers && gameData.stargazers[card._savedSessionKey]) saved = gameData.stargazers[card._savedSessionKey];
              else {
                  saved = saveStargazerToSession(card._key, card);
                  card._savedSessionKey = saved._key;
              }
              selectedGachaIndex = index;
              state.fitting.stargazer = saved;
              renderGachaCards();
              renderSummary();
              renderPhase();
          }

          function confirmGachaResults() {
              closeGachaResults();
          }

          function saveStargazerToSession(baseName, obj) {
              var key = makeKeyUnique(gameData.stargazers || {}, baseName || obj._key || obj["型号ID"] || "自定义观星者");
              var clone = JSON.parse(JSON.stringify(obj || {}));
              delete clone._key;
              delete clone._revealed;
              gameData.stargazers = gameData.stargazers || {};
              gameData.stargazers[key] = normalizeStargazerRecord(key, clone);
              return gameData.stargazers[key];
          }

          function applyGachaCard() {
              var index = selectorContext && selectorContext.index !== undefined ? selectorContext.index : selectedGachaIndex;
              selectGachaCard(index);
          }

          function editSelectedStargazer() {
              var current = state.fitting.stargazer;
              if (!current) { alert("请先选择观星者。"); return; }
              openCustomFormatter('stargazer', current, 'selected-stargazer', -1);
          }

          function editGachaCard(index) {
              var card = gachaSessionCards[index];
              if (!card) return;
              openCustomFormatter('stargazer', card, 'gacha', index);
          }

          function normalizeCustomStargazer(obj, baseName) {
              var sg = normalizeStargazerRecord(baseName || "自定义观星者", obj || {});
              sg["种族"] = sg["种族"] || "观星者";
              sg["阵营"] = sg["阵营"] || "玩家自定义";
              sg["身份"] = sg["身份"] || "舰载观测接口人格";
              sg["型号ID"] = sg["型号ID"] || baseName || "CUSTOM-SG";
              sg["制造商"] = sg["制造商"] || "玩家自定义";
              sg["描述"] = sg["描述"] || "玩家自定义观星者。";
              sg["身份标识"] = sg["身份标识"] || "粉色爱心卡面 / 自定义观星者";
              sg["比特率"] = sg["比特率"] || "450TB/s";
              sg["精度"] = sg["精度"] === undefined || sg["精度"] === "" ? 1.0 : sg["精度"];
              sg["稳态增益"] = sg["稳态增益"] === undefined || sg["稳态增益"] === "" ? 5.0 : sg["稳态增益"];
              sg["爆发增益"] = sg["爆发增益"] === undefined || sg["爆发增益"] === "" ? 10.0 : sg["爆发增益"];
              sg["卡面"] = sg["卡面"] || "粉色爱心";
              return sg;
          }

          function validateCustomStargazer(sg) {
              if (!sg || typeof sg !== "object" || Array.isArray(sg)) return "观星者内容必须是对象。";
              if (!sg["比特率"] || parseBitrate(sg["比特率"]) <= 0) return "比特率必须填写，例如：450TB/s 或 1.2PB/s。";
              if (parsePlainNumber(sg["精度"]) < 0) return "精度不能为负数。";
              if (parsePlainNumber(sg["稳态增益"]) <= 0) return "稳态增益必须大于 0。";
              if (parsePlainNumber(sg["爆发增益"]) <= 0) return "爆发增益必须大于 0。";
              return "";
          }

          function selectCurrentItem() {
              var list = state.selections[currentCategory];
              var idx = -1, limit = selectionLimits[currentCategory], i = 0;
              for (i = 0; i < list.length; i++) if (list[i]._key === currentViewingItem._key) { idx = i; break; }
              if (idx > -1) list.splice(idx, 1);
              else if (limit === 1) {
                  state.selections[currentCategory] = [currentViewingItem];
                  if (currentCategory === "ships") { resetFitting(); syncSelectedShipHpToMax(); }
              } else list.push(currentViewingItem);
              closeModal();
              renderSummary();
              renderPhase();
          }

          function prevPhase() {
              if (currentPhaseIndex > 0) goToPhase(currentPhaseIndex - 1);
          }

          function nextPhase() {
              if (currentCategory === "init_stories" && state.selections.init_stories.length === 0) { alert("必须选择一个开局剧情。"); return; }
              if (currentPhaseIndex < phases.length - 1) goToPhase(currentPhaseIndex + 1);
              else exportData();
          }

          function formatSelection(arr) {
              var res = {}, i = 0;
              for (i = 0; i < arr.length; i++) { var item = JSON.parse(JSON.stringify(arr[i])); var key = item._key; delete item._key; res[key] = item; }
              return res;
          }

          function buildEquippedShip() {
              if (!getSelectedShip()) return null;
              syncSelectedShipHpToMax();
              var ship = JSON.parse(JSON.stringify(getSelectedShip()));
              var weaponSlots = state.fitting.weapons, moduleSlots = state.fitting.modules, k = "", name, clone;
              ship["驾驶员"] = state.captain.name;
              ship["是否旗舰"] = true;
              ship["观星者接口角色"] = state.fitting.stargazer ? state.fitting.stargazer._key : "";
              ship["装备"] = {};
              for (k in weaponSlots) if (Object.prototype.hasOwnProperty.call(weaponSlots, k) && weaponSlots[k]) { name = k + " " + getEquipmentDisplayName(weaponSlots[k]); clone = JSON.parse(JSON.stringify(weaponSlots[k])); delete clone._key; ship["装备"][name] = clone; }
              for (k in moduleSlots) if (Object.prototype.hasOwnProperty.call(moduleSlots, k) && moduleSlots[k]) { name = k + " " + getEquipmentDisplayName(moduleSlots[k]); clone = JSON.parse(JSON.stringify(moduleSlots[k])); delete clone._key; ship["装备"][name] = clone; }
              return ship;
          }

          function buildEquippedStargazer() {
              if (!state.fitting.stargazer) return null;
              var stargazer = normalizeStargazerRecord(state.fitting.stargazer._key, state.fitting.stargazer);
              stargazer["分配舰船"] = getSelectedShipName();
              delete stargazer._key;
              return stargazer;
          }

          function exportData() {
              var ship = buildEquippedShip();
              var stargazer = buildEquippedStargazer();
              var story = state.selections.init_stories[0];
              var items = formatSelection(state.selections.items);
              var yamlStr = "";
              var cb = String.fromCharCode(96, 96, 96);
              var promptStr = "";
              var finalPayload = null;
              var selectedShips = {};
              var selectedStargazers = {};
              if (!story) { alert("请选择一个开局剧情后再生成协议。"); return; }
              if (ship) selectedShips[getSelectedShipName()] = ship;
              if (stargazer) selectedStargazers[state.fitting.stargazer._key] = JSON.parse(JSON.stringify(stargazer));
              finalPayload = {
                  System: { Module: "Azure_Sector_Init", Version: "2.3.0", StartingSkillLevel: 10 },
                  Captain: { Name: state.captain.name, Appearance: state.captain.appearance },
                  ships: selectedShips,
                  stargazers: selectedStargazers,
                  items: items,
                  init_stories: formatSelection(state.selections.init_stories)
              };
              yamlStr = jsyaml.dump(finalPayload);
              promptStr = `[系统指令：玩家已完成开局装配。请严格根据以下 YAML 初始化本次开局。]

              1. 先读取 ships 与 stargazers。只处理其中实际存在的条目；空对象表示玩家主动跳过该项，不得擅自补发舰船或观星者。已有舰船必须原样使用其 装备、驾驶员、是否旗舰、观星者接口角色。
              2. 将非空 ships 写入 主角.舰船，将 items 写入 主角.物品栏，将非空 stargazers 写入 主角.可攻略角色。
              3. 开局剧情以 init_stories 为唯一叙事锚点，必须根据其中的 时间、地点、描述 开场。
              4. 主角姓名使用 Captain.Name。如果 Captain.Appearance 非空，则写入 主角.外貌。
              5. 将 主角.位置 设置为所选开局剧情中的 地点。
              6. 开局技能等级固定为 10 级，不允许选择其它等级。
              7. 输出开场叙事后，立刻进行相应的变量更新，并严格遵守当前世界书中的主角、舰船、角色、新闻更新规则。

              以下为初始化配置：
              ${cb}yaml
              ${yamlStr}
              ${cb}
              请开始输出：`;
              if (typeof createChatMessages !== "undefined") {
                  try { createChatMessages([{ role: "user", message: promptStr }]); document.getElementById('btn-next').textContent = "已注入"; } catch (e) { console.error(e); }
              } else if (navigator.clipboard) {
                  navigator.clipboard.writeText(promptStr).then(function() { alert("协议已复制到剪贴板，请手动粘贴到聊天框。"); }).catch(function() { console.log(promptStr); alert("无法写入剪贴板，请按 F12 从控制台复制。"); });
              } else console.log(promptStr);
          }

      </script>
  </body>
  </html>
