                  if (story && story['开局行动']) narrative = '蔚蓝星域 · 开局预设「' + story._key + '」\n\n' + story['开局行动'];
                  updated = (narrative || "蔚蓝星域 · 开局档案已建立。")
                      + '\n\n<UpdateVariables>\n<JSONPatch>\n' + serializeOpeningState(patch)
                      + '\n</JSONPatch>\n</UpdateVariables>\n\n'
                      + marker + 'data_block' + marker + '\n' + serializeOpeningState(initialized)
                      + '\n' + marker + 'data_block_end' + marker;
                  if (SillyTavern.getContext().chat !== chat || chat.length !== 1 || chat[0].mes !== original) throw new Error("聊天已变化，停止开局写入。");
                  difficultyPrevious = await applyDifficultySettings();
                  if (SillyTavern.getContext().chat !== chat || chat.length !== 1 || chat[0].mes !== original) throw new Error("聊天已变化，停止开局写入。");
                  await setChatMessages([{ message_id: 0, message: updated }], { refresh: 'none' });
                  written = true;
                  if (SillyTavern.getContext().chat !== chat || chat.length !== 1 || chat[0].mes !== updated) throw new Error("聊天已变化，停止变量写入。");
                  await updateVariablesWith(function(vars) { vars.SAM_data = initialized; return vars; }, { type: 'chat' });
                  committed = true;
                  difficultyConfirmed = normalizeDifficulty(state.difficulty);
                  openingDone = true;
                  if (SillyTavern.getContext().chat !== chat) throw new Error("聊天已切换；开局已保存到原聊天，请返回原聊天继续。");
