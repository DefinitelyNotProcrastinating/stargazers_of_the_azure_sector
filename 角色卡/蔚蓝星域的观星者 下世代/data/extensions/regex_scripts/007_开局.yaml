          function openCustomFormatter(kind, sourceItem, sourceType, sourceIndex) {
              customFormatterContext = { kind: kind, source: sourceType || "manual", index: sourceIndex === undefined ? -1 : sourceIndex, key: sourceItem && sourceItem._key ? sourceItem._key : "" };
              document.getElementById('custom-formatter-error').style.display = 'none';
