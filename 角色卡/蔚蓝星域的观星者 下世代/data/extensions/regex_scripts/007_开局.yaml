          function nextPhase() {
              if (openingBusy || openingDone) return;
              try { validateItemQuantities(); } catch (error) { alert(error.message); return; }
              if (currentCategory === "ships" && (!getSelectedShip() || !isAllowedStartingShip(getSelectedShip()))) { alert("请选择一艘开局舰船，舰级不限。"); return; }
              if (currentCategory === "init_stories" && state.selections.init_stories.length === 0) { alert("必须选择一个开局剧情。"); return; }
              if (currentCategory === "init_stories") ensureColonistIndustry();
              if (currentCategory === "industries") {
                  ensureColonistIndustry();
                  if (getSelectedStory() && getSelectedStory()["开局类型"] === "殖民者" && state.industries.length === 0) { alert("殖民者开局必须拥有至少一座工业基地。"); return; }
              }
              if (currentPhaseIndex < phases.length - 1) goToPhase(currentPhaseIndex + 1);
              else exportData();
          }

          function formatSelection(arr) {
              var res = {}, i = 0;
              for (i = 0; i < arr.length; i++) { var item = JSON.parse(JSON.stringify(arr[i])); var key = item._key; delete item._key; res[key] = item; }
              return res;
          }

          function buildEquippedShip() {
              if (!getSelectedShip()) return null;
              syncSelectedShipHpToMax();
              var ship = JSON.parse(JSON.stringify(getSelectedShip()));
              var weaponSlots = state.fitting.weapons, moduleSlots = state.fitting.modules, k = "", name, clone;
              ship["驾驶员"] = getCurrentFittingEntries().some(function(item) { return item['效果'] && item['效果']['无人控制'] === true; }) ? '' : state.captain.name;
              ship["是否旗舰"] = true;
              ship["观星者接口角色"] = state.fitting.stargazer ? state.fitting.stargazer._key : "";
              ship["装备"] = {};
              for (k in weaponSlots) if (Object.prototype.hasOwnProperty.call(weaponSlots, k) && weaponSlots[k]) { name = k + " " + getEquipmentDisplayName(weaponSlots[k]); clone = JSON.parse(JSON.stringify(weaponSlots[k])); delete clone._key; ship["装备"][name] = clone; }
              for (k in moduleSlots) if (Object.prototype.hasOwnProperty.call(moduleSlots, k) && moduleSlots[k]) { name = k + " " + getEquipmentDisplayName(moduleSlots[k]); clone = JSON.parse(JSON.stringify(moduleSlots[k])); delete clone._key; ship["装备"][name] = clone; }
              stackModuleDictionary(ship["装备"], true);
              delete ship._key;
              return ship;
          }

          function buildEquippedStargazer() {
              if (!state.fitting.stargazer) return null;
              var stargazer = normalizeStargazerRecord(state.fitting.stargazer._key, state.fitting.stargazer);
              stargazer["分配舰船"] = getSelectedShipName();
              delete stargazer._key;
              return stargazer;
          }

          function buildStartingEvents(story) {
              var events = {};
              if (story && story['仅开局预设']) return events;
              var openingType = story && story["开局类型"] ? String(story["开局类型"]) : "自定义";
              var openingEvent = story && story["启动事件"] ? String(story["启动事件"]) : "【事件】自定义开局";
              events["【事件】初入星区"] = {
                  "阶段": 1
              };
              events[openingEvent] = { "阶段": 1 };
              return events;
          }

          function buildStartingIndustries() {
              var result = {}, used = {}, i = 0, clone, name, mapName, cleanMap, resource, amount;
              for (i = 0; i < state.industries.length; i++) {
                  clone = JSON.parse(JSON.stringify(state.industries[i] || {}));
                  name = String(clone._key || ("工业基地" + (i + 1))).replace(/^\s+|\s+$/g, "") || ("工业基地" + (i + 1));
                  while (used[name]) name += "副站";
                  used[name] = true;
                  delete clone._key;
                  clone["状态"] = clone["状态"] || "运行";
                  clone["防御指数"] = Math.max(0, Math.min(100, Number(clone["防御指数"]) || 0));
                  for (mapName of ["输入", "输出"]) {
                      cleanMap = {};
                      if (clone[mapName] && typeof clone[mapName] === "object" && !Array.isArray(clone[mapName])) {
                          for (resource in clone[mapName]) if (Object.prototype.hasOwnProperty.call(clone[mapName], resource)) {
                              amount = Number(clone[mapName][resource]);
                              if (Number.isFinite(amount) && amount > 0) cleanMap[resource] = amount;
                          }
                      }
                      if (Object.keys(cleanMap).length) clone[mapName] = cleanMap; else delete clone[mapName];
                  }
                  result[name] = clone;
              }
              return result;
          }

          function buildOpeningState(base, story) {
              var ship = buildEquippedShip();
              var stargazer = buildEquippedStargazer();
              var items = formatSelection(state.selections.items);
              var inventory = { "矿物": 0, "食物": 0, "金属": 0, "补给": 0 };
              var selectedShips = {};
              var selectedStargazers = {};
              var resource, amount;
              if (!story) throw new Error("请选择一个开局剧情。");
              if (!story["时间"] || !Number.isFinite(Date.parse(story["时间"]))) throw new Error("开局剧情必须包含有效的初始时间。");
              ensureColonistIndustry();
              if (story["开局类型"] === "殖民者" && state.industries.length === 0) throw new Error("殖民者开局必须拥有至少一座工业基地。");
              if (ship && !isAllowedStartingShip(ship)) throw new Error("开局舰船缺少有效舰船类型。");
              for (resource in inventory) if (Object.prototype.hasOwnProperty.call(items, resource)) {
                  amount = Number(items[resource]["堆叠"]);
                  if (!Number.isFinite(amount) || amount < 0) throw new Error(resource + "的初始数量无效。");
                  inventory[resource] = amount;
                  delete items[resource];
              }
              if (ship) selectedShips[getSelectedShipName()] = ship;
              stackModuleDictionary(items);
              if (stargazer) selectedStargazers[state.fitting.stargazer._key] = JSON.parse(JSON.stringify(stargazer));
              var result = JSON.parse(JSON.stringify(base));
              var hero = result.static["主角"];
              hero["姓名"] = state.captain.name;
              hero["外貌"] = state.captain.appearance;
              hero["背景故事"] = state.captain.background;
              if (normalizeDifficulty(state.difficulty) === "天灾难度") hero["天灾预警"] = buildCatastropheWarning(story["时间"]);
              else delete hero["天灾预警"];
              hero["位置"] = story["地点"] || "";
              hero["舰船"] = selectedShips;
              hero["可攻略角色"] = selectedStargazers;
              hero["物品栏"] = items;
              hero["库存"] = inventory;
              hero["建筑"] = buildStartingIndustries();
              hero["势力声望"] = JSON.parse(JSON.stringify(state.reputations));
              hero["势力声望"]["铁血盟约"] = -50;
              hero["势力声望"]["海盗势力"] = -50;
              result.static["事件"] = buildStartingEvents(story);
              result.time = story["时间"];
              // 初始化不是时间推进，不应产生工业产出或消耗。
              result.dtime = 0;
              return result;
          }

          function openingDraft() {
              var story = getSelectedStory();
              var draft = story && story['开局行动'] ? state.captain.background + '\n\n开局行动：\n' + story['开局行动'] : state.captain.background;
              if (normalizeDifficulty(state.difficulty) === "天灾难度") draft += '\n\n天灾情报：开局初期，一个半主动集群芯片预警识海终末最迟将在100年后返回并入侵银河系，两大超级文明已经消逝；芯片随即自毁。此情报只演出一次，最迟回归日期以天灾预警记录为准，只能提前。';
              // 开局数值只保存在 SAM；普通开局保留玩家原样填写的背景故事。
              return draft;
          }

          function serializeOpeningState(value) {
              // 玩家文本中的标签或状态标记不能截断更新块/检查点；JSON 解析会还原原文。
              return JSON.stringify(value, null, 2).replace(/[<>$]/g, function(character) {
                  return '\\u' + character.charCodeAt(0).toString(16).padStart(4, '0');
              });
          }

          async function exportData() {
              if (openingBusy || openingDone || difficultyBusy) return;
              try { validateItemQuantities(); } catch (error) { alert(error.message); return; }
              var button = document.getElementById('btn-next');
              var written = false, committed = false, original, updated, chat, difficultyPrevious;
              openingBusy = true;
              renderDifficultySettings();
              button.disabled = true;
              button.textContent = "正在写入开局……";
              try {
                  if (typeof setChatMessages !== "function" || typeof updateVariablesWith !== "function") throw new Error("缺少酒馆助手变量写入接口，请检查扩展是否启用。");
                  var input = window.parent.document.querySelector('#send_textarea');
                  if (!input) throw new Error("找不到酒馆聊天输入框。");
                  if (input.value.trim()) throw new Error("聊天输入框已有内容，请先发送或清空。");
                  chat = SillyTavern.getContext().chat;
                  if (!chat || chat.length !== 1 || chat[0].is_user) throw new Error("只能在尚未开始的首楼设置开局，请使用新聊天。");
                  original = String(chat[0].mes || "");
                  if (original.indexOf('$开始游戏$') === -1) throw new Error("本聊天的开局已经写入，不能重复初始化。");
                  var marker = String.fromCharCode(36, 36, 36, 36, 36, 36);
                  var escapedMarker = marker.replace(/\$/g, '\\$');
                  var blockPattern = escapedMarker + 'data_block' + escapedMarker + '\\s*([\\s\\S]*?)\\s*' + escapedMarker + 'data_block_end' + escapedMarker;
                  var match = original.match(new RegExp(blockPattern));
                  if (!match) throw new Error("首楼缺少 SAM 初始状态块，未写入开局。");
                  var base = JSON.parse(match[1]);
                  if (!base.static || !base.static["主角"]) throw new Error("SAM 初始状态缺少主角对象。");
                  var story = state.selections.init_stories[0];
                  var initialized = buildOpeningState(base, story);
                  var draft = openingDraft();
                  // 逐字段记录，遵守主角更新规则；完整检查点保证重载时不重复执行。
                  var patch = Object.keys(initialized.static["主角"]).map(function(key) {
                      return { op: Object.prototype.hasOwnProperty.call(base.static["主角"], key) ? "replace" : "insert", path: "/主角/" + key.replace(/~/g, '~0').replace(/\//g, '~1'), value: initialized.static["主角"][key] };
                  });
                  patch.push({ op: "replace", path: "/事件", value: initialized.static["事件"] });
                  patch.push({ op: "time", value: initialized.time });
                  var narrative = original.replace(new RegExp(blockPattern, 'g'), '')
                      .replace(/(?:<!-- SAM_CHECKPOINT -->\s*)?<SAMCheckpoint>[\s\S]*?<\/SAMCheckpoint>/g, '')
