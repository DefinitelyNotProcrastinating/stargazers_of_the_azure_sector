              if (action === 'open-fitting-selector') { openFittingSelector(el.getAttribute('data-kind') || "", el.getAttribute('data-slot-id') || ""); return; }
              if (action === 'apply-fitting-selection') { applyFittingSelection(el.getAttribute('data-kind') || "", el.getAttribute('data-payload') || ""); return; }
              if (action === 'clear-fitting-slot') { clearFittingSlot(); return; }
              if (action === 'clear-fitting-stargazer') { clearFittingStargazer(); return; }
              if (action === 'unequip-current-slot') { unequipCurrentSlot(); return; }
              if (action === 'open-custom-ship-formatter') { openCustomFormatter('ship'); return; }
              if (action === 'open-custom-module-formatter') { openCustomFormatter('module'); return; }
              if (action === 'close-custom-formatter') { closeCustomFormatter(); return; }
              if (action === 'fill-custom-template') { fillCustomTemplate(); return; }
              if (action === 'format-custom-json') { formatCustomJson(); return; }
              if (action === 'apply-custom-formatter') { applyCustomFormatter(); return; }
              if (action === 'open-gacha-results') { rollGachaTen(); return; }
              if (action === 'roll-gacha-ten') { rollGachaTen(); return; }
              if (action === 'close-gacha-results') { closeGachaResults(); return; }
              if (action === 'confirm-gacha-results') { confirmGachaResults(); return; }
              if (action === 'flip-gacha-card') { flipGachaCard(parseInt(el.getAttribute('data-index') || '0', 10)); return; }
              if (action === 'open-gacha-card-detail') { event.stopPropagation(); openGachaCardDetail(parseInt(el.getAttribute('data-index') || '0', 10)); return; }
              if (action === 'select-gacha-card') { event.stopPropagation(); selectGachaCard(parseInt(el.getAttribute('data-index') || '0', 10)); return; }
              if (action === 'apply-gacha-card') { applyGachaCard(); return; }
              if (action === 'edit-gacha-card') { editGachaCard(parseInt(el.getAttribute('data-index') || '0', 10)); return; }
              if (action === 'open-custom-stargazer-formatter') { openCustomFormatter('stargazer'); return; }
              if (action === 'edit-selected-stargazer') { editSelectedStargazer(); return; }
          });


          function buildCustomToolbar(category) {
              if (category === "ships") {
                  return '<div class="custom-toolbar"><button class="btn px-4 py-2" data-action="open-custom-ship-formatter">+ 自定义舰船</button></div>';
              }
              if (category === "fitting") {
                  return '<div class="custom-toolbar"><button class="btn px-4 py-2" data-action="open-gacha-results">观星者十连抽</button><button class="btn px-4 py-2" data-action="open-custom-stargazer-formatter">+ 自定义观星者</button><button class="btn px-4 py-2" data-action="open-custom-module-formatter">+ 自定义模块</button></div>';
              }
              return "";
          }

          function makeKeyUnique(map, baseName) {
              var clean = String(baseName || "").replace(/^\s+|\s+$/g, "") || "未命名自定义条目";
              var key = clean;
              var n = 2;
              while (map && Object.prototype.hasOwnProperty.call(map, key)) {
                  key = clean + " #" + n;
                  n++;
              }
              return key;
          }

