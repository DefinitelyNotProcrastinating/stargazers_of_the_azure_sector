  @media (max-width: 980px) {
    .ship-tabs-layout {
      grid-template-columns: 1fr;
    }

    .ship-detail-shell {
      grid-template-columns: 1fr;
    }
  }

          @media (max-width: 980px) {
              .fitting-side { grid-template-columns: 1fr; }
              .fitting-stage { min-height: 760px; border-radius: 32px; }
          }
          @media (max-width: 620px) {
              body { background-size: auto; }
              #screen-0 { padding: 16px !important; }
              #main-ui { padding: 12px !important; }
              .panel { border-radius: 22px; }
              .modal-content { border-radius: 24px; padding: 18px; width: 96%; }
              .grid-container { grid-template-columns: 1fr; }
              .ship-grid-container { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
              .ship-grid-container .item-card { min-height: 168px; padding: 12px; }
              .ship-grid-container .item-card h3 { font-size: 0.95rem; line-height: 1.35; }
              .fitting-stage { min-height: 700px; border-radius: 28px; }
              .ring-slot { width: 92px; padding: 7px 5px; }
              .stargazer-dock { grid-template-columns: 1fr; text-align: center; bottom: 18px; }
              .stargazer-dock .btn { width: 100%; padding: 10px; }
              .stargazer-actions { justify-content: stretch; }
              .center-core { top: 40%; }
              .fitting-stage::before, .fitting-stage::after, .dial-ring { top: 40%; }
          }
      </style>
  </head>
  <body>
      <div id="screen-0" class="screen active items-center justify-center p-8">
          <div class="panel max-w-4xl w-full p-8 text-center">
              <div class="font-mono text-sm tracking-[0.4em] text-[var(--text-muted)]">AZURE SECTOR / INITIALIZATION</div>
              <h1 class="text-5xl font-bold text-[var(--accent-main)] mt-4">蔚蓝星域的观星者</h1>
              <p class="text-[var(--text-muted)] mt-5 leading-8">
                  载入新的开局协议。<br>
                  你可以选择舰船并完成装配，也可以跳过舰船或观星者，以盲盒物资开始游戏；随后选择初始物资与开局剧情，并将结果注入聊天。
              </p>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-8 text-left">
                  <div>
                      <label class="text-xs text-[var(--text-muted)]">舰长名称</label>
                      <input type="text" id="captain-name" class="w-full mt-1" value="{{user}}">
                  </div>
                  <div>
                      <label class="text-xs text-[var(--text-muted)]">主角外貌</label>
                      <input type="text" id="captain-appearance" class="w-full mt-1" placeholder="例如：穿着常服的年轻舰长，眼下带着轻微熬夜痕迹">
                  </div>
              </div>
              <button class="btn px-8 py-3 text-xl tracking-widest mt-8" id="btn-start" data-action="start-game">建立连接 [CONNECT]</button>
          </div>
      </div>

      <div id="main-ui" class="hidden flex-col p-4">
          <div class="flex justify-between items-end border-b border-[var(--border-main)] pb-2 mb-4">
              <div>
                  <h2 class="text-2xl font-bold text-[var(--accent-main)]" id="phase-title">PHASE_1: 开局剧情</h2>
                  <div class="text-xs text-[var(--text-muted)] font-mono" id="phase-desc">Select opening story</div>
              </div>
              <div class="text-right font-mono text-xs text-[var(--text-muted)]" id="selection-summary"></div>
          </div>
          <div class="flex gap-2 mb-4">
              <div class="step-dot" id="dot-1"></div>
              <div class="step-dot" id="dot-2"></div>
              <div class="step-dot" id="dot-3"></div>
              <div class="step-dot" id="dot-4"></div>
          </div>
          <div class="panel p-4 mb-4">
              <div class="text-sm text-[var(--text-muted)]" id="phase-help"></div>
          </div>
          <div id="catalog-grid" class="grid-container flex-1"></div>
          <div class="flex justify-between items-center pt-4 mt-4 border-t border-[var(--border-main)]">
              <button class="btn px-6 py-2" id="btn-prev" data-action="prev-phase"><<< 后退</button>
              <button class="btn px-6 py-2" id="btn-next" data-action="next-phase">继续 >>></button>
          </div>
      </div>

      <div id="modal-details" class="modal-overlay">
          <div class="modal-content relative">
              <button class="absolute top-3 right-3 text-[var(--accent-main)] font-bold" data-action="close-modal">[X]</button>
              <h2 id="modal-title" class="text-2xl font-bold text-[var(--accent-main)] mb-4"></h2>
              <div id="modal-body" class="font-mono text-sm"></div>
              <div class="mt-6 pt-4 border-t border-[var(--border-main)] flex justify-end gap-2">
                  <button class="btn px-4 py-2" data-action="close-modal">取消</button>
                  <button class="btn px-4 py-2" id="modal-primary-action" data-action="select-current-item">选择</button>
              </div>
          </div>
      </div>



      <div id="modal-custom-formatter" class="modal-overlay">
          <div class="modal-content relative">
              <button class="absolute top-3 right-3 text-[var(--accent-main)] font-bold" data-action="close-custom-formatter">[X]</button>
              <h2 id="custom-formatter-title" class="text-2xl font-bold text-[var(--accent-main)] mb-4">自定义格式器</h2>
              <div class="formatter-grid">
                  <div class="formatter-hint" id="custom-formatter-hint"></div>
                  <div class="formatter-row">
                      <label for="custom-name-input">条目名称</label>
                      <input id="custom-name-input" type="text" placeholder="例如：苍蓝试作护卫舰 / 试作相位护盾">
                  </div>
                  <div class="formatter-row" id="custom-module-kind-row" style="display:none;">
                      <label for="custom-module-kind">模块类型</label>
                      <select id="custom-module-kind" class="w-full mt-1" style="background:rgba(255,255,255,0.72);border:1px solid rgba(98,175,210,0.44);border-radius:var(--radius-sm);padding:11px 13px;color:var(--text-main);font-family:'JetBrains Mono', monospace;">
                          <option value="equipment">装备模块 / H-L 槽</option>
                          <option value="weapon">武器模块 / S-M-L-XL 炮位</option>
                      </select>
                  </div>
                  <div class="formatter-actions">
                      <button class="btn px-4 py-2" data-action="fill-custom-template">填入模板</button>
                      <button class="btn px-4 py-2" data-action="format-custom-json">整理格式</button>
                  </div>
                  <textarea id="custom-json-input" spellcheck="false"></textarea>
                  <div class="formatter-error" id="custom-formatter-error"></div>
              </div>
              <div class="mt-6 pt-4 border-t border-[var(--border-main)] flex justify-end gap-2">
                  <button class="btn px-4 py-2" data-action="close-custom-formatter">取消</button>
                  <button class="btn px-4 py-2" data-action="apply-custom-formatter">加入列表</button>
              </div>
          </div>
      </div>

      <div id="modal-gacha-results" class="modal-overlay">
          <div class="modal-content relative" style="max-width:980px;">
              <h2 class="text-2xl font-bold text-[var(--accent-main)] mb-2">观星者十连抽取</h2>
              <div class="text-sm text-[var(--text-muted)] leading-7 mb-4">点击卡面翻开。翻开后可查看详情并对比多个观星者；只有点击卡片下方的“选择”才会装配该观星者。点击底部“确定”关闭抽卡界面。</div>
              <div class="gacha-controls">
                  <div class="font-mono text-xs text-[var(--text-muted)]" id="gacha-summary">READY</div>
                  <div class="flex flex-wrap gap-2">
                      <button class="btn px-4 py-2" data-action="roll-gacha-ten">重新十连</button>
                      <button class="btn px-4 py-2" data-action="open-custom-stargazer-formatter">+ 自定义观星者</button>
                  </div>
              </div>
              <div id="gacha-card-grid" class="gacha-grid"></div>
              <div class="gacha-footer">
                  <div class="font-mono text-xs text-[var(--text-muted)]" id="gacha-selected-summary">未选择观星者</div>
                  <button class="btn px-6 py-2" data-action="confirm-gacha-results">确定</button>
              </div>
          </div>
      </div>


      <script>
          var gameData = null;
          var currentPhaseIndex = 0;
          var phases = ["ships", "fitting", "items", "init_stories"];
          var phaseTitles = [
              { t: "PHASE_1: 起始舰船", d: "Select starting ship", help: "可选择一艘起始舰船，也可直接跳过以进行盲盒开局。下一步进入舰船装配与观星者选择。" },
              { t: "PHASE_2: 舰船装配", d: "Fit your ship", help: "舰船与观星者均可跳过。已选择舰船时，外环为武器拨码环，中环为 H/L 模块拨码环；未选择舰船时仍可单独选择观星者。" },
              { t: "PHASE_3: 初始物资", d: "Select inventory items", help: "可多选初始物品。导出时会写入主角.物品栏。" },
              { t: "PHASE_4: 开局剧情", d: "Select opening story", help: "最后选择开局剧情，它将作为时间、地点与初始叙事锚点。" }
          ];
          var selectionLimits = {
              ships: 1,
              items: null,
              init_stories: 1
          };
          var fittingCatalog = { weaponsByMount: { S: [], M: [], L: [], XL: [] }, modulesBySlot: { H: [], L: [] } };
          var state = {
              captain: { name: "{{user}}", appearance: "" },
              selections: { ships: [], items: [], init_stories: [] },
              fitting: { weapons: {}, modules: {}, stargazer: null }
          };
          var currentViewingItem = null;
          var currentCategory = "";
          var modalMode = "detail";
          var selectorContext = null;
          var customFormatterContext = { kind: "ship", source: "manual", index: -1, key: "" };
          var gachaSessionCards = [];
          var selectedGachaIndex = -1;

          async function fetchGameData() {
              var wb = await getWorldbook("蔚蓝星域的观星者 下世代");
              var entry = null;
              var parsed = null;
              var i = 0;
              for (i = 0; i < wb.length; i++) {
                  if (wb[i].comment === "__INIT_DATA__" || wb[i].name === "__INIT_DATA__") { entry = wb[i]; break; }
              }
              if (!entry || !entry.content) throw new Error("INIT_DATA not found");
              parsed = JSON.parse(entry.content);
              parsed.init_stories = parsed.init_stories || {};
              parsed.ships = parsed.ships || {};
              parsed.items = parsed.items || {};
              parsed.stargazers = normalizeStargazerMap(parsed.stargazers || {});
              parsed.weapons = parsed.weapons || {};
              parsed.equipment = parsed.equipment || {};
              parsed.gacha_data = parsed.gacha_data || {};
              parsed.fittingCatalog = buildFittingCatalog(parsed);
              return parsed;
          }

          function getSelectedShip() { return state.selections.ships.length ? state.selections.ships[0] : null; }
          function getSelectedShipName() { return getSelectedShip() ? getSelectedShip()._key : ""; }
          function getSelectedStargazer() { return state.fitting.stargazer; }

          function resetFitting() {
              state.fitting.weapons = {};
              state.fitting.modules = {};
              state.fitting.stargazer = null;
          }

          async function startGame() {
              state.captain.name = document.getElementById('captain-name').value.replace(/^\s+|\s+$/g, "") || "{{user}}";
              state.captain.appearance = document.getElementById('captain-appearance').value.replace(/^\s+|\s+$/g, "");
              document.getElementById('screen-0').classList.remove('active');
              document.getElementById('main-ui').classList.add('flex');
              document.getElementById('main-ui').classList.remove('hidden');
              try {
                  gameData = await fetchGameData();
              } catch (e) {
                  alert("无法读取 INIT_DATA。装配界面不会使用任何 fallback data，请检查世界书中 __INIT_DATA__ 是否存在且为合法 JSON。\n" + (e && e.message ? e.message : e));
                  console.error(e);
                  gameData = { init_stories: {}, ships: {}, items: {}, stargazers: {}, weapons: {}, equipment: {}, gacha_data: {}, fittingCatalog: buildEmptyFittingCatalog() };
              }
              goToPhase(0);
          }

          function goToPhase(index) {
              currentPhaseIndex = index;
              currentCategory = phases[currentPhaseIndex];
              updateNavUI();
              renderPhase();
              resetAutoHeight();
          }

          function resetAutoHeight() {
              document.documentElement.style.height = "auto";
              document.body.style.height = "auto";
              window.scrollTo(0, 0);
              requestAnimationFrame(function() {
                  window.dispatchEvent(new Event("resize"));
              });
          }

          function updateNavUI() {
              var info = phaseTitles[currentPhaseIndex];
              var i = 0;
              document.getElementById('phase-title').textContent = info.t;
              document.getElementById('phase-desc').textContent = info.d;
              document.getElementById('phase-help').textContent = info.help;
              for (i = 0; i < phases.length; i++) {
                  document.getElementById('dot-' + (i + 1)).classList.toggle('active', i <= currentPhaseIndex);
              }
              document.getElementById('btn-prev').disabled = currentPhaseIndex === 0;
              document.getElementById('btn-next').textContent = currentPhaseIndex === phases.length - 1 ? "生成协议 >>>" : (currentCategory === "ships" || currentCategory === "fitting" ? "继续 / 跳过 >>>" : "继续 >>>");
              renderSummary();
          }

          function renderSummary() {
              var ship = getSelectedShipName() || "未选";
              var fitCount = countKeys(state.fitting.weapons) + countKeys(state.fitting.modules);
              var summary = [];
              summary.push("舰船: " + ship);
              summary.push("装配模块: " + fitCount);
              summary.push("观星者: " + (state.fitting.stargazer ? state.fitting.stargazer._key : "未装配"));
              summary.push("物品: " + state.selections.items.length);
              summary.push("剧情: " + state.selections.init_stories.length);
              document.getElementById('selection-summary').innerHTML = summary.join("<br>");
          }

          function countKeys(obj) {
              var n = 0, k = "";
              for (k in obj) if (Object.prototype.hasOwnProperty.call(obj, k)) n++;
              return n;
          }

          function escapeHtml(value) {
              var str = value === undefined || value === null ? "" : String(value);
              var map = {};
              map["&"] = "&" + "amp;";
              map["<"] = "&" + "lt;";
              map[">"] = "&" + "gt;";
              map['"'] = "&" + "quot;";
              map["'"] = "&" + "#39;";
              return str.replace(/[&<>"']/g, function(ch) { return map[ch]; });
          }

          function formatValue(value) {
              var rows = [], k = "";
              if (value === undefined || value === null || value === "") return "未记录";
              if (Array.isArray(value)) return value.length ? value.map(formatValue).join(" / ") : "无";
              if (typeof value === "object") {
                  for (k in value) if (Object.prototype.hasOwnProperty.call(value, k)) rows.push('<div class="kv-row"><div class="kv-key">' + escapeHtml(k) + '</div><div class="kv-val">' + formatValue(value[k]) + '</div></div>');
                  return rows.join("");
              }
              return escapeHtml(value);
          }

          function previewText(category, item) {
              if (category === "ships") return item["描述"] || ((item["舰船类型"] || "舰船") + " / " + (item["吨位"] || "未知吨位"));
              if (category === "items") return item["描述"] || "未记录描述";
              if (category === "init_stories") return item["描述"] || "未记录描述";
              return "未记录描述";
          }

          function renderBadges(category, item) {
              var badges = [], html = [], i = 0;
              if (category === "ships") { if (item["舰船类型"]) badges.push(item["舰船类型"]); if (item["吨位"]) badges.push(item["吨位"]); }
              if (category === "items" && item["品质"] !== undefined) badges.push("品质 " + item["品质"]);
              if (category === "init_stories" && item["时间"]) badges.push(item["时间"]);
              for (i = 0; i < badges.length; i++) html.push('<span class="text-[10px] px-2 py-1 border border-[var(--border-main)] text-[var(--accent-main)]">' + escapeHtml(badges[i]) + '</span>');
              return html.join(" ");
          }

          function renderPhase() {
              if (currentCategory === "fitting") renderFitting();
              else renderCatalog();
          }

          function renderCatalog() {
              var grid = document.getElementById('catalog-grid');
              var data = gameData[currentCategory] || {};
              var selected = state.selections[currentCategory] || [];
              var entries = [], html = [], key = "", i = 0, j = 0;
              grid.className = currentCategory === "ships" ? "ship-grid-container flex-1" : "grid-container flex-1";
              for (key in data) if (Object.prototype.hasOwnProperty.call(data, key)) entries.push([key, data[key]]);
              if (!entries.length) {
                  grid.innerHTML = buildCustomToolbar(currentCategory) + '<div class="panel p-6 text-[var(--text-muted)]">当前分类没有可用数据。</div>';
                  return;
              }
              for (i = 0; i < entries.length; i++) {
                  var itemKey = entries[i][0];
                  var item = entries[i][1];
                  var enriched = JSON.parse(JSON.stringify(item));
                  var isSelected = false;
                  enriched._key = itemKey;
                  for (j = 0; j < selected.length; j++) if (selected[j]._key === itemKey) { isSelected = true; break; }
                  html.push('<article class="item-card ' + (isSelected ? 'selected' : '') + '" data-action="open-detail" data-payload="' + escapeHtml(encodeURIComponent(JSON.stringify(enriched))) + '">' +
                      '<div class="flex justify-between items-start gap-2"><h3 class="text-lg font-bold text-[var(--accent-main)]">' + escapeHtml(itemKey) + '</h3></div>' +
                      '<div class="flex flex-wrap gap-1">' + renderBadges(currentCategory, item) + '</div>' +
                      '<div class="text-sm text-[var(--text-muted)] leading-6">' + escapeHtml(previewText(currentCategory, item)) + '</div>' +
                  '</article>');
              }
              grid.innerHTML = buildCustomToolbar(currentCategory) + html.join("");
          }

          function parseCountMap(config, keys) {
              var map = {}, i = 0, regex, match;
              for (i = 0; i < keys.length; i++) {
                  regex = new RegExp('(\\d+)' + keys[i], 'g');
                  match = regex.exec(config || "");
                  map[keys[i]] = match ? parseInt(match[1], 10) : 0;
              }
              return map;
          }

          function buildWeaponSlots(ship) {
              var counts = parseCountMap(ship["炮位配置"], ["S","M","L","XL","C","T"]);
              var slots = [], key = "", i = 0;
              for (key in counts) if (counts[key] > 0) for (i = 1; i <= counts[key]; i++) slots.push({ id: key + i, mount: key, label: key + i });
              return slots;
          }

          function buildModuleSlots(ship) {
              var counts = parseCountMap(ship["装备槽位配置"], ["H","L"]);
              var slots = [], i = 0;
              for (i = 1; i <= counts["H"]; i++) slots.push({ id: "H" + i, slotType: "H", label: "H" + i });
              for (i = 1; i <= counts["L"]; i++) slots.push({ id: "L" + i, slotType: "L", label: "L" + i });
              return slots;
          }

          function parseRequirement(reqText) {
              var out = { PG: 0, CPU: 0, "吨位": "", "炮位": "无", "装备槽位": "无" };
              var parts = (reqText || "").split("|"), i = 0, segment = "", pair, key, value;
              for (i = 0; i < parts.length; i++) {
                  segment = parts[i].replace(/^\s+|\s+$/g, "");
                  pair = segment.split("：");
                  if (pair.length < 2) pair = segment.split(":");
                  if (pair.length >= 2) {
                      key = pair[0].replace(/^\s+|\s+$/g, "");
                      value = pair.slice(1).join(":").replace(/^\s+|\s+$/g, "");
                      out[key] = value;
                  }
              }
              out.PG = parseFloat(out.PG || 0) || 0;
              out.CPU = parseFloat(out.CPU || 0) || 0;
              return out;
          }

          function buildEmptyFittingCatalog() {
              return { weaponsByMount: { S: [], M: [], L: [], XL: [] }, modulesBySlot: { H: [], L: [] } };
          }

          function getRequirementMount(req) {
              var value = String((req || {})["炮位"] || "").toUpperCase();
              var m = value.match(/(XL|S|M|L)/);
              return m ? m[1] : "";
          }

          function getRequirementSlotType(req) {
              var value = String((req || {})["装备槽位"] || "").toUpperCase();
              var m = value.match(/[HL]/);
              return m ? m[0] : "";
          }

          function enrichFittingItem(key, item) {
              var clone = JSON.parse(JSON.stringify(item || {}));
              clone._key = key;
              return clone;
          }

          function buildFittingCatalog(data) {
              var catalog = buildEmptyFittingCatalog();
              var key = "", req, mount, slotType;
              for (key in (data.weapons || {})) if (Object.prototype.hasOwnProperty.call(data.weapons, key)) {
                  req = parseRequirement((data.weapons[key] || {})["装配要求"]);
                  mount = getRequirementMount(req);
                  if (catalog.weaponsByMount[mount]) catalog.weaponsByMount[mount].push(enrichFittingItem(key, data.weapons[key]));
              }
              for (key in (data.equipment || {})) if (Object.prototype.hasOwnProperty.call(data.equipment, key)) {
                  req = parseRequirement((data.equipment[key] || {})["装配要求"]);
                  slotType = getRequirementSlotType(req);
                  if (catalog.modulesBySlot[slotType]) catalog.modulesBySlot[slotType].push(enrichFittingItem(key, data.equipment[key]));
              }
              return catalog;
          }

          function getWeaponCandidatesByMount(mount) {
              var catalog = (gameData && gameData.fittingCatalog) ? gameData.fittingCatalog : buildEmptyFittingCatalog();
              return (catalog.weaponsByMount[mount] || []).slice();
          }

          function getModuleCandidatesBySlot(slotType) {
              var catalog = (gameData && gameData.fittingCatalog) ? gameData.fittingCatalog : buildEmptyFittingCatalog();
              return (catalog.modulesBySlot[slotType] || []).slice();
          }

          function getEquipmentDisplayName(item) {
              return (item && (item._key || item.name || item["名称"] || item["型号ID"])) || "未命名装配";
          }

          function parseBitrate(value) {
              var num = parseFloat(String(value || "").replace(/[^0-9.]/g, ""));
              if (!num) return 0;
              if (String(value).indexOf("PB") > -1) return num * 1000;
              return num;
          }

          function parsePlainNumber(value) {
              var num = parseFloat(String(value || "").replace(/[^0-9.]/g, ""));
              return num || 0;
          }

          function getEquipmentNumber(item, keys) {
              var i = 0, total = 0;
              for (i = 0; i < keys.length; i++) {
                  if (item && item[keys[i]] !== undefined) total += parsePlainNumber(item[keys[i]]);
              }
              return total;
          }

          function firstNonEmpty(values) {
              var i = 0;
              for (i = 0; i < values.length; i++) {
                  if (values[i] !== undefined && values[i] !== null && values[i] !== "") return values[i];
              }
              return "";
          }

          function normalizeStargazerRecord(key, raw) {
              var src = JSON.parse(JSON.stringify(raw || {}));
              var profile = src["静态档案"] || {};
              var perf = profile["性能参数"] || {};
              var prefs = profile["偏好"] || {};
              var normalized = {
                  "种族": src["种族"] || "观星者",
                  "阵营": src["阵营"] || "",
                  "身份": src["身份"] || "",
                  "好感度": src["好感度"] || 0,
                  "想法": src["想法"] || "",
                  "历史": firstNonEmpty([src["历史"], (src["附加信息"] || {})["历史"]]),
                  "型号ID": src["型号ID"] || key || "",
                  "制造商": firstNonEmpty([src["制造商"], profile["制造商"]]),
                  "品质": src["品质"] === undefined ? "" : src["品质"],
                  "描述": firstNonEmpty([src["描述"], profile["描述"], src["备注"]]),
                  "外貌": firstNonEmpty([src["外貌"], profile["外貌"]]),
                  "身份标识": firstNonEmpty([src["身份标识"], (profile["身份标识"] || {})["类型"] ? ((profile["身份标识"] || {})["类型"] + " / " + ((profile["身份标识"] || {})["位置"] || "未记录位置")) : ""]),
                  "比特率": firstNonEmpty([src["比特率"], perf["比特率"]]),
                  "精度": firstNonEmpty([src["精度"], perf["精度"]]) + "/MOps",
                  "稳态增益": firstNonEmpty([src["稳态增益"], perf["稳态增益"]]) + "TW/mV",
                  "爆发增益": firstNonEmpty([src["爆发增益"], perf["爆发增益"]]) + "TW/mV",
                  "特殊效果": src["特殊效果"] || profile["特殊能力"] || {},
                  "性格": src["性格"] || profile["性格"] || [],
                  "喜欢": src["喜欢"] || prefs["喜欢"] || [],
                  "讨厌": src["讨厌"] || prefs["讨厌"] || [],
                  "性癖": src["性癖"] || prefs["性癖"] || [],
                  "外貌记录": src["外貌记录"] || { "身体": "", "胸部": "", "私处": "" },
                  "性经历": src["性经历"] || "未知",
                  "分配舰船": firstNonEmpty([src["分配舰船"], (src["附加信息"] || {})["舰船ID"]])
              };
              normalized._key = key;
              return normalized;
          }

          function normalizeStargazerMap(source) {
              var out = {}, key = "";
              for (key in source) if (Object.prototype.hasOwnProperty.call(source, key)) out[key] = normalizeStargazerRecord(key, source[key]);
              return out;
          }

          function getShipRequirement(shipName) {
              var ship = (gameData && gameData.ships) ? gameData.ships[shipName] : null;
              return ship ? (ship["观星者装配要求"] || ship["观星者需求"] || ship["接口需求"] || null) : null;
          }

          function getStargazerMetrics(stargazer) {
              var perf = (((stargazer || {})["静态档案"] || {})["性能参数"]) || {};
              return {
                  stable: parsePlainNumber(firstNonEmpty([(stargazer || {})["稳态增益"], perf["稳态增益"]])),
                  burst: parsePlainNumber(firstNonEmpty([(stargazer || {})["爆发增益"], perf["爆发增益"]])),
                  bitrate: parseBitrate(firstNonEmpty([(stargazer || {})["比特率"], perf["比特率"]])),
                  error: parsePlainNumber(firstNonEmpty([(stargazer || {})["精度"], perf["精度"]]))
              };
          }

          function isStargazerCompatible(shipName, stargazer) {
              var req = getShipRequirement(shipName);
              var m = getStargazerMetrics(stargazer);
              if (!req) return "";
              if (req.minStable !== undefined && m.stable < parsePlainNumber(req.minStable)) return "稳态增益不足";
              if (req.minBitrate !== undefined && m.bitrate < parsePlainNumber(req.minBitrate)) return "比特率不足";
              if (req.maxError !== undefined && m.error > parsePlainNumber(req.maxError)) return "精度误差过高";
              if (req.minBurst !== undefined && m.burst < parsePlainNumber(req.minBurst)) return "爆发增益不足";
              return "";
          }

          function getCurrentFittingEntries() {
              var list = [], k = "";
              for (k in state.fitting.weapons) if (Object.prototype.hasOwnProperty.call(state.fitting.weapons, k) && state.fitting.weapons[k]) list.push(state.fitting.weapons[k]);
              for (k in state.fitting.modules) if (Object.prototype.hasOwnProperty.call(state.fitting.modules, k) && state.fitting.modules[k]) list.push(state.fitting.modules[k]);
              return list;
          }

          function getFittingHpStatus(ship) {
              var entries = getCurrentFittingEntries();
              var baseShield = parsePlainNumber(ship && ship["船体护盾值"]);
              var baseStructure = parsePlainNumber(ship && ship["船体结构值"]);
              var bonusShield = 0, bonusStructure = 0, i = 0;
              for (i = 0; i < entries.length; i++) {
                  bonusShield += getEquipmentNumber(entries[i], ["护盾", "护盾值", "船体护盾值", "护盾上限"]);
                  bonusStructure += getEquipmentNumber(entries[i], ["结构", "结构值", "船体结构值", "结构上限"]);
              }
              return {
                  currentShield: baseShield + bonusShield,
                  maxShield: baseShield + bonusShield,
                  currentStructure: baseStructure + bonusStructure,
                  maxStructure: baseStructure + bonusStructure,
                  bonusShield: bonusShield,
                  bonusStructure: bonusStructure
              };
          }

          function syncSelectedShipHpToMax() {
              var ship = getSelectedShip();
              var hpStatus = null;
              if (!ship) return;
              hpStatus = getFittingHpStatus(ship);
              ship["护盾值"] = hpStatus.maxShield;
              ship["结构值"] = hpStatus.maxStructure;
          }

          function getSlotCurrentRequirement(kind, slotId) {
              var current = null;
              if (kind === "weapon") current = state.fitting.weapons[slotId];
              else if (kind === "module") current = state.fitting.modules[slotId];
              if (!current) return null;
              return parseRequirement(current["装配要求"]);
          }

          function getResourceStatus(extraRequirement, removedRequirement) {
              var ship = getSelectedShip();
              var entries = getCurrentFittingEntries();
              var usedPG = 0, usedCPU = 0, i = 0, req;
              var totalPG = ship ? parsePlainNumber(ship["装配资源"] && ship["装配资源"]["PG"]) : 0;
              var totalCPU = ship ? parsePlainNumber(ship["装配资源"] && ship["装配资源"]["CPU"]) : 0;
              for (i = 0; i < entries.length; i++) {
                  req = parseRequirement(entries[i]["装配要求"]);
                  usedPG += req.PG;
                  usedCPU += req.CPU;
              }
              if (removedRequirement) {
                  usedPG -= removedRequirement.PG;
                  usedCPU -= removedRequirement.CPU;
              }
              if (extraRequirement) {
                  usedPG += extraRequirement.PG;
                  usedCPU += extraRequirement.CPU;
              }
              return {
                  totalPG: totalPG,
                  totalCPU: totalCPU,
                  usedPG: usedPG,
                  usedCPU: usedCPU,
                  remainPG: totalPG - usedPG,
                  remainCPU: totalCPU - usedCPU
              };
          }

          function buildSlotButton(x, y, label, text, className, kind, slotId) {
              return '<button class="ring-slot ' + className + '" style="left:' + x + '%;top:' + y + '%;" data-action="open-fitting-slot" data-kind="' + escapeHtml(kind) + '" data-slot-id="' + escapeHtml(slotId || "") + '" aria-label="' + escapeHtml(label + " " + text) + '"><span class="slot-name">' + escapeHtml(label) + '</span><span class="slot-text">' + escapeHtml(text) + '</span></button>';
          }

          function buildRingPositions(count, radiusX, radiusY, startDeg, endDeg, centerX, centerY) {
              var points = [], i = 0, deg, rad;
              if (count <= 0) return points;
              if (count === 1) {
                  deg = (startDeg + endDeg) / 2;
                  rad = deg * Math.PI / 180;
                  points.push({ x: centerX + Math.cos(rad) * radiusX, y: centerY + Math.sin(rad) * radiusY });
                  return points;
              }
              for (i = 0; i < count; i++) {
                  deg = startDeg + (endDeg - startDeg) * (i / (count - 1));
                  rad = deg * Math.PI / 180;
                  points.push({ x: centerX + Math.cos(rad) * radiusX, y: centerY + Math.sin(rad) * radiusY });
              }
              return points;
          }

          function renderFitting() {
              var ship = getSelectedShip();
              var grid = document.getElementById('catalog-grid');
              var centerX = 50, centerY = 41;
              var weapons, modules, weaponPos, highSlots, lowSlots, highPos, lowPos;
              var i = 0, weaponHtml = [], moduleHtml = [], fitList = [], status, hpStatus, stargazerLabel, stargazerMeta;
              if (!ship) {
                  stargazerLabel = state.fitting.stargazer ? state.fitting.stargazer._key : "未选择观星者";
                  stargazerMeta = state.fitting.stargazer ? buildStargazerMeta(state.fitting.stargazer) : "可选择一名观星者，也可保持为空并继续盲盒开局。";
                  grid.className = "flex-1";
                  grid.innerHTML = buildCustomToolbar('fitting') +
                      '<div class="panel p-6 mt-4"><div class="text-xl font-bold text-[var(--accent-main)]">已跳过起始舰船</div>' +
                      '<div class="text-sm text-[var(--text-muted)] mt-3">无法进行武器与模块装配，但仍可独立选择观星者。</div>' +
                      '<div class="stargazer-dock mt-5"><div><div class="label">STARGAZER INTERFACE</div><div class="name">' + escapeHtml(stargazerLabel) + '</div><div class="text-xs text-[var(--text-muted)] mt-1">' + escapeHtml(stargazerMeta) + '</div></div>' +
                      '<div class="stargazer-actions"><button class="btn px-5 py-3" data-action="open-fitting-selector" data-kind="stargazer" data-slot-id="CENTER">选择观星者</button><button class="btn px-5 py-3" data-action="edit-selected-stargazer"' + (state.fitting.stargazer ? '' : ' disabled') + '>编辑观星者</button></div></div></div>';
                  return;
              }
              weapons = buildWeaponSlots(ship);
              modules = buildModuleSlots(ship);
              weaponPos = buildRingPositions(weapons.length, 40, 31, -160, 160, centerX, centerY);
              highSlots = [];
              lowSlots = [];
              for (i = 0; i < modules.length; i++) {
                  if (modules[i].slotType === "H") highSlots.push(modules[i]);
                  else if (modules[i].slotType === "L") lowSlots.push(modules[i]);
              }
              highPos = buildRingPositions(highSlots.length, 25, 19, 112, 248, centerX, centerY);
              lowPos = buildRingPositions(lowSlots.length, 25, 19, -68, 68, centerX, centerY);
              for (i = 0; i < weapons.length; i++) {
                  var w = state.fitting.weapons[weapons[i].id];
                  weaponHtml.push(buildSlotButton(weaponPos[i].x.toFixed(2), weaponPos[i].y.toFixed(2), weapons[i].label, w ? getEquipmentDisplayName(w) : ("空槽 / " + weapons[i].mount), w ? "filled" : "empty", "weapon", weapons[i].id));
              }
              for (i = 0; i < highSlots.length; i++) {
                  var h = state.fitting.modules[highSlots[i].id];
                  moduleHtml.push(buildSlotButton(highPos[i].x.toFixed(2), highPos[i].y.toFixed(2), highSlots[i].label, h ? getEquipmentDisplayName(h) : "高功率槽", h ? "filled" : "empty", "module", highSlots[i].id));
              }
              for (i = 0; i < lowSlots.length; i++) {
                  var l = state.fitting.modules[lowSlots[i].id];
                  moduleHtml.push(buildSlotButton(lowPos[i].x.toFixed(2), lowPos[i].y.toFixed(2), lowSlots[i].label, l ? getEquipmentDisplayName(l) : "低功率槽", l ? "filled" : "empty", "module", lowSlots[i].id));
              }
              status = getResourceStatus();
              hpStatus = getFittingHpStatus(ship);
              for (i = 0; i < weapons.length; i++) if (state.fitting.weapons[weapons[i].id]) fitList.push('<div class="fit-row">' + escapeHtml(weapons[i].label) + ' / ' + escapeHtml(getEquipmentDisplayName(state.fitting.weapons[weapons[i].id])) + '</div>');
              for (i = 0; i < modules.length; i++) if (state.fitting.modules[modules[i].id]) fitList.push('<div class="fit-row">' + escapeHtml(modules[i].label) + ' / ' + escapeHtml(getEquipmentDisplayName(state.fitting.modules[modules[i].id])) + '</div>');
              stargazerLabel = state.fitting.stargazer ? state.fitting.stargazer._key : "未选择观星者";
              stargazerMeta = state.fitting.stargazer ? buildStargazerMeta(state.fitting.stargazer) : "从下方接口选择一名观星者";
              grid.className = "flex-1";
              grid.innerHTML = '<div class="fitting-shell">' +
                  buildCustomToolbar('fitting') +
                  '<div class="fitting-stage">' +
                      '<div class="dial-ring outer"></div><div class="dial-ring middle"></div>' +
                      weaponHtml.join("") +
                      moduleHtml.join("") +
                      '<div class="center-core" aria-label="剩余装配资源与舰船耐久"><strong>REMAINING</strong><small>' + escapeHtml(ship._key) + ' / PG-CPU-HP</small><div class="core-resource"><div><span>PG</span><b>' + status.remainPG + '</b></div><div><span>CPU</span><b>' + status.remainCPU + '</b></div><div><span>护盾</span><b>' + hpStatus.currentShield + '/' + hpStatus.maxShield + '</b></div><div><span>结构</span><b>' + hpStatus.currentStructure + '/' + hpStatus.maxStructure + '</b></div></div></div>' +
                      '<div class="stargazer-dock"><div><div class="label">STARGAZER INTERFACE</div><div class="name">' + escapeHtml(stargazerLabel) + '</div><div class="text-xs text-[var(--text-muted)] mt-1">' + escapeHtml(stargazerMeta) + '</div></div><div class="stargazer-actions"><button class="btn px-5 py-3" data-action="open-fitting-selector" data-kind="stargazer" data-slot-id="CENTER">选择观星者</button><button class="btn px-5 py-3" data-action="edit-selected-stargazer"' + (state.fitting.stargazer ? '' : ' disabled') + '>编辑观星者</button></div></div>' +
                  '</div>' +
                  '<div class="fitting-side">' +
                      '<div class="panel p-4"><div class="text-lg font-bold text-[var(--accent-main)]">' + escapeHtml(ship._key) + '</div><div class="text-sm text-[var(--text-muted)] mt-2">' + escapeHtml(ship["炮位配置"] || "") + ' / ' + escapeHtml(ship["装备槽位配置"] || "") + '</div></div>' +
                      '<div class="panel p-4"><div class="text-sm text-[var(--accent-main)] mb-2">已装配清单</div><div class="fit-list">' + (fitList.length ? fitList.join("") : '<div class="fit-row">尚未装配模块</div>') + '</div></div>' +
                  '</div>' +
              '</div>';
          }

          function openDetailModal(encoded) {
              var clone = null;
              modalMode = "detail";
              selectorContext = null;
              currentViewingItem = JSON.parse(decodeURIComponent(encoded));
              clone = JSON.parse(JSON.stringify(currentViewingItem));
              delete clone._key;
              document.getElementById('modal-title').textContent = currentViewingItem._key;
              document.getElementById('modal-body').innerHTML = formatValue(clone);
              document.getElementById('modal-primary-action').style.display = 'inline-block';
              document.getElementById('modal-primary-action').textContent = '选择';
              document.getElementById('modal-primary-action').setAttribute('data-action', 'select-current-item');
              document.getElementById('modal-details').style.display = 'flex';
          }

          function openFittingSlot(kind, slotId) {
              var current = null;
              if (kind === "weapon") current = state.fitting.weapons[slotId];
              else if (kind === "module") current = state.fitting.modules[slotId];
              if (current) openEquippedModal(kind, slotId, current);
              else openFittingSelector(kind, slotId);
          }

          function openEquippedModal(kind, slotId, item) {
              var clone = JSON.parse(JSON.stringify(item));
              var req = parseRequirement(clone["装配要求"]);
              var statusIfRemoved = getResourceStatus(null, req);
              modalMode = "equipped";
              selectorContext = { kind: kind, slotId: slotId };
              currentViewingItem = clone;
              document.getElementById('modal-title').textContent = slotId + " / " + getEquipmentDisplayName(clone);
              document.getElementById('modal-body').innerHTML =
                  '<div class="mb-4 p-3 border border-[var(--border-main)] bg-[rgba(232,248,255,0.74)]">' +
                  '<div class="text-[var(--accent-main)] mb-2">装配资源</div>' +
                  '<div class="font-mono text-xs text-[var(--text-muted)]">当前占用 PG ' + req.PG + ' / CPU ' + req.CPU + '。卸载后剩余 PG ' + statusIfRemoved.remainPG + ' / CPU ' + statusIfRemoved.remainCPU + '。</div>' +
                  '</div>' + formatValue(clone);
              document.getElementById('modal-primary-action').style.display = 'inline-block';
              document.getElementById('modal-primary-action').textContent = '卸载';
              document.getElementById('modal-primary-action').setAttribute('data-action', 'unequip-current-slot');
              document.getElementById('modal-details').style.display = 'flex';
          }

          function openFittingSelector(kind, slotId) {
              var ship = getSelectedShip(), title = "", candidates = [], i = 0, slotType = "";
              if (!ship && kind !== "stargazer") return;
              modalMode = "selector";
              selectorContext = { kind: kind, slotId: slotId };
              if (kind === "weapon") {
                  var mount = slotId.replace(/[0-9]/g, "");
                  title = "选择武器 / " + slotId;
                  candidates = getWeaponCandidatesByMount(mount);
              } else if (kind === "module") {
                  slotType = slotId.charAt(0);
                  title = "选择模块 / " + slotId;
                  candidates = getModuleCandidatesBySlot(slotType);
              } else {
                  title = "选择观星者 / 中央接口";
                  for (i = 0; i < getStargazerEntries().length; i++) candidates.push(getStargazerEntries()[i]);
              }
              document.getElementById('modal-title').textContent = title;
              document.getElementById('modal-body').innerHTML = renderCandidateList(kind, candidates);
              document.getElementById('modal-primary-action').style.display = 'none';
              document.getElementById('modal-details').style.display = 'flex';
          }

          function getStargazerEntries() {
              var out = [], key = "";
              for (key in (gameData.stargazers || {})) if (Object.prototype.hasOwnProperty.call(gameData.stargazers, key)) out.push(normalizeStargazerRecord(key, gameData.stargazers[key]));
              return out;
          }

          function renderCandidateList(kind, candidates) {
              var html = ['<div class="candidate-list">'], i = 0;
              if (kind !== "stargazer") html.push('<button class="btn px-3 py-2 mb-2" data-action="clear-fitting-slot">清空当前槽位</button>');
              else html.push('<button class="btn px-3 py-2 mb-2" data-action="clear-fitting-stargazer">清空观星者</button>');
              for (i = 0; i < candidates.length; i++) {
                  var candidate = JSON.parse(JSON.stringify(candidates[i]));
                  if (!candidate._key) candidate._key = getEquipmentDisplayName(candidate);
                  var evalResult = evaluateCandidate(kind, candidate);
                  html.push('<div class="candidate-card ' + (evalResult.ok ? '' : 'disabled') + '">' +
                      '<div class="head"><strong>' + escapeHtml(candidate._key || candidate.name) + '</strong><span>' + escapeHtml(kind === "stargazer" ? (candidate["型号ID"] || "") : (candidate["品质"] !== undefined ? ("品质 " + candidate["品质"]) : "")) + '</span></div>' +
                      '<div class="meta">' + escapeHtml(kind === "stargazer" ? buildStargazerMeta(candidate) : candidate["装配要求"]) + '</div>' +
                      '<div class="desc">' + escapeHtml(kind === "stargazer" ? previewStargazer(candidate) : (candidate["描述"] || "")) + '</div>' +
                      (evalResult.ok ? '<div class="mt-3"><button class="btn px-3 py-2" data-action="apply-fitting-selection" data-kind="' + escapeHtml(kind) + '" data-payload="' + escapeHtml(encodeURIComponent(JSON.stringify(candidate))) + '">装配</button></div>' : '<div class="reason">' + escapeHtml(evalResult.reason) + '</div>') +
                  '</div>');
              }
              html.push('</div>');
              return html.join("");
          }

          function buildStargazerMeta(candidate) {
              var m = getStargazerMetrics(candidate);
              return '稳态 ' + m.stable + ' TW/mV | 爆发 ' + m.burst + ' TW/mV | 比特率 ' + m.bitrate + ' TB/s | 误差 ' + m.error;
          }

          function previewStargazer(candidate) {
              if (candidate["外貌"]) return candidate["外貌"];
              if (candidate["描述"]) return candidate["描述"];
              if (candidate["静态档案"] && candidate["静态档案"]["描述"]) return candidate["静态档案"]["描述"];
              return "未记录描述";
          }

          function evaluateCandidate(kind, candidate) {
              var ship = getSelectedShip(), resourceStatus, req, compatible, removedRequirement;
              if (kind === "stargazer") {
                  compatible = isStargazerCompatible(getSelectedShipName(), candidate);
                  if (compatible) return { ok: false, reason: compatible };
                  return { ok: true, reason: "" };
              }
              req = parseRequirement(candidate["装配要求"]);
              removedRequirement = getSlotCurrentRequirement(kind, selectorContext.slotId);
              resourceStatus = getResourceStatus(req, removedRequirement);
              if (resourceStatus.remainPG < 0) return { ok: false, reason: "PG 不足" };
              if (resourceStatus.remainCPU < 0) return { ok: false, reason: "CPU 不足" };
              if (kind === "weapon") {
                  if ((req["炮位"] || "").indexOf(selectorContext.slotId.replace(/[0-9]/g, "")) === -1 && req["炮位"] !== "无") return { ok: false, reason: "炮位尺寸不匹配" };
              } else {
                  if ((req["装备槽位"] || "").indexOf(selectorContext.slotId.charAt(0)) === -1 && req["装备槽位"] !== "无") return { ok: false, reason: "装备槽位不匹配" };
              }
              return { ok: true, reason: "" };
          }

          function applyFittingSelection(kind, encoded) {
              var candidate = JSON.parse(decodeURIComponent(encoded));
              if (kind === "weapon") state.fitting.weapons[selectorContext.slotId] = sanitizeEquipment(candidate);
              else if (kind === "module") state.fitting.modules[selectorContext.slotId] = sanitizeEquipment(candidate);
              else state.fitting.stargazer = candidate;
              syncSelectedShipHpToMax();
              closeModal();
              renderSummary();
              renderPhase();
          }

          function sanitizeEquipment(item) {
              return JSON.parse(JSON.stringify(item));
          }

          function unequipCurrentSlot() {
              if (!selectorContext) return;
              clearFittingSlot();
          }

          function clearFittingSlot() {
              if (!selectorContext) return;
              if (selectorContext.kind === "weapon") delete state.fitting.weapons[selectorContext.slotId];
              else delete state.fitting.modules[selectorContext.slotId];
              syncSelectedShipHpToMax();
              closeModal();
              renderSummary();
              renderPhase();
          }

          function clearFittingStargazer() {
              state.fitting.stargazer = null;
              closeModal();
              renderSummary();
              renderPhase();
          }

          function escapeJsString(value) {
              return String(value).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
          }

          function closeModal() {
              document.getElementById('modal-details').style.display = 'none';
          }

          document.addEventListener('pointerdown', function(event) {
              var el = event.target.closest('.ring-slot, .btn, .center-core, .gacha-card');
              if (el) el.classList.add('touch-active');
          });
          document.addEventListener('pointerup', function() {
              var active = document.querySelectorAll('.touch-active'), i = 0;
              for (i = 0; i < active.length; i++) active[i].classList.remove('touch-active');
          });
          document.addEventListener('pointercancel', function() {
              var active = document.querySelectorAll('.touch-active'), i = 0;
              for (i = 0; i < active.length; i++) active[i].classList.remove('touch-active');
          });

          document.addEventListener('click', function(event) {
              var el = event.target.closest('[data-action]');
              var action = "";
              if (!el) return;
              action = el.getAttribute('data-action');
              if (action === 'start-game') { startGame(); return; }
              if (action === 'prev-phase') { prevPhase(); return; }
              if (action === 'next-phase') { nextPhase(); return; }
              if (action === 'close-modal') { closeModal(); return; }
              if (action === 'select-current-item') { selectCurrentItem(); return; }
              if (action === 'open-detail') { openDetailModal(el.getAttribute('data-payload') || ""); return; }
