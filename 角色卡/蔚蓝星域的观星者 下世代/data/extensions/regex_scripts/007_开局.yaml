findRegex: \$开始游戏\$
replaceString: |-
  <start>
  ```html
  <!DOCTYPE html>
  <html lang="zh-CN">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>TERMINAL // 蔚蓝星域初始化</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
      <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
      <style>
          :root {
              --bg-dark: #05070f;
              --bg-panel: #0b1021;
              --border-main: #1f305c;
              --accent-main: #00d4ff;
              --text-main: #e2e8f0;
              --text-muted: #64748b;
              --glow-main: 0 0 12px rgba(0, 212, 255, 0.5);
          }
          body {
              background-color: var(--bg-dark);
              color: var(--text-main);
              font-family: 'Noto Sans SC', sans-serif;
              margin: 0;
              min-height: 100vh;
              overflow-y: auto;
              overflow-x: hidden;
          }
          .font-mono { font-family: 'JetBrains Mono', monospace; }
          .panel {
              background: rgba(11, 16, 33, 0.82);
              border: 1px solid var(--border-main);
              backdrop-filter: blur(5px);
          }
          .btn {
              background: transparent;
              border: 1px solid var(--border-main);
              color: var(--accent-main);
              text-transform: uppercase;
              font-weight: bold;
              cursor: pointer;
              transition: all 0.2s;
          }
          .btn:hover:not(:disabled) {
              background: var(--accent-main);
              color: #000;
              box-shadow: var(--glow-main);
          }
          .btn:disabled { opacity: 0.5; cursor: not-allowed; }
          input, textarea {
              background: rgba(0, 212, 255, 0.05);
              border: 1px solid var(--border-main);
              color: #fff;
              padding: 8px;
              outline: none;
              font-family: 'JetBrains Mono', monospace;
          }
          .screen { display: none; min-height: 100vh; }
          .screen.active { display: flex; }
          .grid-container {
              display: grid;
              grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
              gap: 16px;
          }
          .item-card {
              background: rgba(13, 20, 40, 0.6);
              border: 1px solid var(--border-main);
              padding: 12px;
              cursor: pointer;
              transition: transform 0.1s, border-color 0.2s;
              display: flex;
              flex-direction: column;
              gap: 8px;
              min-height: 220px;
          }
          .item-card:hover { border-color: var(--accent-main); transform: scale(1.01); }
          .item-card.selected { border: 2px solid var(--accent-main); background: rgba(0, 80, 120, 0.35); box-shadow: var(--glow-main); }
          .kv-row { display: flex; font-size: 0.85rem; border-bottom: 1px dashed rgba(0, 212, 255, 0.15); padding: 4px 0; }
          .kv-key { color: var(--text-muted); width: 92px; flex-shrink: 0; }
          .kv-val { color: var(--text-main); flex-grow: 1; word-break: break-word; }
          .modal-overlay {
              position: fixed;
              inset: 0;
              background: rgba(0, 0, 0, 0.78);
              backdrop-filter: blur(3px);
              display: none;
              justify-content: center;
              align-items: center;
              z-index: 50;
          }
          .modal-content {
              background: var(--bg-panel);
              border: 1px solid var(--accent-main);
              width: 92%;
              max-width: 760px;
              max-height: 86vh;
              overflow-y: auto;
              padding: 20px;
          }
          .step-dot { flex: 1; height: 4px; background: var(--border-main); }
          .step-dot.active { background: var(--accent-main); box-shadow: var(--glow-main); }
      </style>
  </head>
  <body>
      <div id="screen-0" class="screen active items-center justify-center p-8">
          <div class="panel max-w-4xl w-full p-8 text-center">
              <div class="font-mono text-sm tracking-[0.4em] text-[var(--text-muted)]">AZURE SECTOR / INITIALIZATION</div>
              <h1 class="text-5xl font-bold text-[var(--accent-main)] mt-4">蔚蓝星域的观星者</h1>
              <p class="text-[var(--text-muted)] mt-5 leading-8">
                  载入新的开局协议。<br>
                  你将依次选择开局剧情、舰船、个人物品与观星者，并将结果注入聊天。
              </p>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-8 text-left">
                  <div>
                      <label class="text-xs text-[var(--text-muted)]">舰长名称</label>
                      <input type="text" id="captain-name" class="w-full mt-1" value="{{user}}">
                  </div>
                  <div>
                      <label class="text-xs text-[var(--text-muted)]">主角外貌</label>
                      <input type="text" id="captain-appearance" class="w-full mt-1" placeholder="例如：穿着常服的年轻舰长，眼下带着轻微熬夜痕迹">
                  </div>
              </div>
              <button class="btn px-8 py-3 text-xl tracking-widest mt-8" onclick="startGame()">建立连接 [CONNECT]</button>
          </div>
      </div>

      <div id="main-ui" class="hidden flex-col min-h-screen p-4">
          <div class="flex justify-between items-end border-b border-[var(--border-main)] pb-2 mb-4">
              <div>
                  <h2 class="text-2xl font-bold text-[var(--accent-main)]" id="phase-title">PHASE_1: 开局剧情</h2>
                  <div class="text-xs text-[var(--text-muted)] font-mono" id="phase-desc">Select opening story</div>
              </div>
              <div class="text-right font-mono text-xs text-[var(--text-muted)]" id="selection-summary"></div>
          </div>
          <div class="flex gap-2 mb-4">
              <div class="step-dot" id="dot-1"></div>
              <div class="step-dot" id="dot-2"></div>
              <div class="step-dot" id="dot-3"></div>
              <div class="step-dot" id="dot-4"></div>
          </div>
          <div class="panel p-4 mb-4">
              <div class="text-sm text-[var(--text-muted)]" id="phase-help"></div>
          </div>
          <div id="catalog-grid" class="grid-container flex-1"></div>
          <div class="flex justify-between items-center pt-4 mt-4 border-t border-[var(--border-main)]">
              <button class="btn px-6 py-2" id="btn-prev" onclick="prevPhase()"><<< 后退</button>
              <button class="btn px-6 py-2" id="btn-next" onclick="nextPhase()">继续 >>></button>
          </div>
      </div>

      <div id="modal-details" class="modal-overlay">
          <div class="modal-content relative">
              <button class="absolute top-3 right-3 text-[var(--accent-main)] font-bold" onclick="closeModal()">[X]</button>
              <h2 id="modal-title" class="text-2xl font-bold text-[var(--accent-main)] mb-4"></h2>
              <div id="modal-body" class="font-mono text-sm"></div>
              <div class="mt-6 pt-4 border-t border-[var(--border-main)] flex justify-end gap-2">
                  <button class="btn px-4 py-2" onclick="closeModal()">取消</button>
                  <button class="btn px-4 py-2" onclick="selectCurrentItem()">选择</button>
              </div>
          </div>
      </div>

      <script>
          var gameData = null;
          var currentPhaseIndex = 0;
          var phases = ["init_stories", "ships", "items", "stargazers"];
          var phaseTitles = [
              { t: "PHASE_1: 开局剧情", d: "Select opening story", help: "必须选择一个开局剧情，它将作为时间、地点与初始叙事锚点。" },
              { t: "PHASE_2: 起始舰船", d: "Select starting ship", help: "选择 1 艘属于主角的起始舰船。导出时会写入主角.舰船。" },
              { t: "PHASE_3: 随身物资", d: "Select personal items", help: "可多选个人物品。导出时会写入主角.个人物品。" },
              { t: "PHASE_4: 观星者接口", d: "Select starting stargazer", help: "选择 1 名随舰观星者。导出时会写入主角.可攻略角色。" }
          ];
          var selectionLimits = {
              init_stories: 1,
              ships: 1,
              items: null,
              stargazers: 1
          };
          var state = {
              captain: {
                  name: "{{user}}",
                  appearance: ""
              },
              selections: {
                  init_stories: [],
                  ships: [],
                  items: [],
                  stargazers: []
              }
          };
          var currentViewingItem = null;
          var currentCategory = "";

          async function fetchGameData() {
              try {
                  var wb = await getWorldbook("蔚蓝星域的观星者 下世代");
                  var entry = null;
                  var i = 0;
                  for (i = 0; i < wb.length; i++) {
                      if (wb[i].comment === "__INIT_DATA__" || wb[i].name === "__INIT_DATA__") {
                          entry = wb[i];
                          break;
                      }
                  }
                  if (entry && entry.content) {
                      return JSON.parse(entry.content);
                  }
              } catch (e) {
                  console.warn("INIT_DATA load failed:", e.message);
              }
              return { init_stories: {}, ships: {}, items: {}, stargazers: {} };
          }

          async function startGame() {
              state.captain.name = document.getElementById('captain-name').value.replace(/^\s+|\s+$/g, "") || "{{user}}";
              state.captain.appearance = document.getElementById('captain-appearance').value.replace(/^\s+|\s+$/g, "");
              document.getElementById('screen-0').classList.remove('active');
              document.getElementById('main-ui').classList.add('flex');
              document.getElementById('main-ui').classList.remove('hidden');
              gameData = await fetchGameData();
              goToPhase(0);
          }

          function goToPhase(index) {
              currentPhaseIndex = index;
              currentCategory = phases[currentPhaseIndex];
              updateNavUI();
              renderCatalog();
          }

          function updateNavUI() {
              var info = phaseTitles[currentPhaseIndex];
              var i = 0;
              document.getElementById('phase-title').textContent = info.t;
              document.getElementById('phase-desc').textContent = info.d;
              document.getElementById('phase-help').textContent = info.help;
              for (i = 0; i < phases.length; i++) {
                  document.getElementById('dot-' + (i + 1)).classList.toggle('active', i <= currentPhaseIndex);
              }
              document.getElementById('btn-prev').disabled = currentPhaseIndex === 0;
              document.getElementById('btn-next').textContent = currentPhaseIndex === phases.length - 1 ? "生成协议 >>>" : "继续 >>>";
              renderSummary();
          }

          function renderSummary() {
              var summary = [];
              summary.push("剧情: " + state.selections.init_stories.length);
              summary.push("舰船: " + state.selections.ships.length);
              summary.push("物品: " + state.selections.items.length);
              summary.push("观星者: " + state.selections.stargazers.length);
              document.getElementById('selection-summary').innerHTML = summary.join("<br>");
          }

          function escapeHtml(value) {
              var str = value === undefined || value === null ? "" : String(value);
              var map = {};
              map["&"] = "&" + "amp;";
              map["<"] = "&" + "lt;";
              map[">"] = "&" + "gt;";
              map['"'] = "&" + "quot;";
              map["'"] = "&" + "#39;";
              return str.replace(/[&<>"']/g, function(ch) {
                  return map[ch];
              });
          }

          function formatValue(value) {
              var rows = [];
              var k = "";
              if (value === undefined || value === null || value === "") return "未记录";
              if (Array.isArray(value)) return value.length ? value.map(formatValue).join(" / ") : "无";
              if (typeof value === "object") {
                  for (k in value) {
                      if (Object.prototype.hasOwnProperty.call(value, k)) {
                          rows.push('<div class="kv-row"><div class="kv-key">' + escapeHtml(k) + '</div><div class="kv-val">' + formatValue(value[k]) + '</div></div>');
                      }
                  }
                  return rows.join("");
              }
              return escapeHtml(value);
          }

          function previewText(category, item) {
              if (category === "init_stories") return item["描述"] || "未记录描述";
              if (category === "ships") return item["描述"] || ((item["舰船类型"] || "舰船") + " / " + (item["吨位"] || "未知吨位"));
              if (category === "items") return item["描述"] || "未记录描述";
              if (category === "stargazers") {
                  if (item["外貌"]) return item["外貌"];
                  if (item["静态档案"] && item["静态档案"]["描述"]) return item["静态档案"]["描述"];
              }
              return "未记录描述";
          }

          function renderBadges(category, item) {
              var badges = [];
              var html = [];
              var i = 0;
              if (category === "ships") {
                  if (item["舰船类型"]) badges.push(item["舰船类型"]);
                  if (item["吨位"]) badges.push(item["吨位"]);
              }
              if (category === "items" && item["品质"] !== undefined) badges.push("品质 " + item["品质"]);
              if (category === "stargazers") {
                  if (item["型号ID"]) badges.push(item["型号ID"]);
                  if (item["阵营"]) badges.push(item["阵营"]);
              }
              if (category === "init_stories" && item["时间"]) badges.push(item["时间"]);
              for (i = 0; i < badges.length; i++) {
                  html.push('<span class="text-[10px] px-2 py-1 border border-[var(--border-main)] text-[var(--accent-main)]">' + escapeHtml(badges[i]) + '</span>');
              }
              return html.join(" ");
          }

          function renderCatalog() {
              var grid = document.getElementById('catalog-grid');
              var data = gameData[currentCategory] || {};
              var selected = state.selections[currentCategory];
              var entries = [];
              var key = "";
              var i = 0;
              var j = 0;
              var html = [];
              for (key in data) {
                  if (Object.prototype.hasOwnProperty.call(data, key)) {
                      entries.push([key, data[key]]);
                  }
              }
              if (!entries.length) {
                  grid.innerHTML = '<div class="panel p-6 text-[var(--text-muted)]">当前分类没有可用数据。</div>';
                  return;
              }
              for (i = 0; i < entries.length; i++) {
                  var itemKey = entries[i][0];
                  var item = entries[i][1];
                  var enriched = JSON.parse(JSON.stringify(item));
                  var isSelected = false;
                  enriched._key = itemKey;
                  for (j = 0; j < selected.length; j++) {
                      if (selected[j]._key === itemKey) {
                          isSelected = true;
                          break;
                      }
                  }
                  var encoded = encodeURIComponent(JSON.stringify(enriched));
                  html.push(
                      '<article class="item-card ' + (isSelected ? 'selected' : '') + '" onclick="openModal(\'' + encoded + '\')">' +
                          '<div class="flex justify-between items-start gap-2">' +
                              '<h3 class="text-lg font-bold text-[var(--accent-main)]">' + escapeHtml(itemKey) + '</h3>' +
                          '</div>' +
                          '<div class="flex flex-wrap gap-1">' + renderBadges(currentCategory, item) + '</div>' +
                          '<div class="text-sm text-[var(--text-muted)] leading-6">' + escapeHtml(previewText(currentCategory, item)) + '</div>' +
                      '</article>'
                  );
              }
              grid.innerHTML = html.join("");
          }

          function openModal(encoded) {
              var clone = null;
              currentViewingItem = JSON.parse(decodeURIComponent(encoded));
              document.getElementById('modal-title').textContent = currentViewingItem._key;
              clone = JSON.parse(JSON.stringify(currentViewingItem));
              delete clone._key;
              document.getElementById('modal-body').innerHTML = formatValue(clone);
              document.getElementById('modal-details').style.display = 'flex';
          }

          function closeModal() {
              document.getElementById('modal-details').style.display = 'none';
          }

          function selectCurrentItem() {
              var list = state.selections[currentCategory];
              var idx = -1;
              var limit = selectionLimits[currentCategory];
              var i = 0;
              for (i = 0; i < list.length; i++) {
                  if (list[i]._key === currentViewingItem._key) {
                      idx = i;
                      break;
                  }
              }
              if (idx > -1) {
                  list.splice(idx, 1);
              } else if (limit === 1) {
                  state.selections[currentCategory] = [currentViewingItem];
              } else {
                  list.push(currentViewingItem);
              }
              closeModal();
              renderSummary();
              renderCatalog();
          }

          function prevPhase() {
              if (currentPhaseIndex > 0) goToPhase(currentPhaseIndex - 1);
          }

          function nextPhase() {
              if (currentPhaseIndex === 0 && state.selections.init_stories.length === 0) {
                  alert("必须先选择一个开局剧情。");
                  return;
              }
              if (currentPhaseIndex === 1 && state.selections.ships.length === 0) {
                  alert("必须先选择一艘起始舰船。");
                  return;
              }
              if (currentPhaseIndex === 3 && state.selections.stargazers.length === 0) {
                  alert("必须先选择一名观星者。");
                  return;
              }
              if (currentPhaseIndex < phases.length - 1) {
                  goToPhase(currentPhaseIndex + 1);
              } else {
                  exportData();
              }
          }

          function formatSelection(arr) {
              var res = {};
              var i = 0;
              for (i = 0; i < arr.length; i++) {
                  var item = JSON.parse(JSON.stringify(arr[i]));
                  var key = item._key;
                  delete item._key;
                  res[key] = item;
              }
              return res;
          }

          function exportData() {
              var story = state.selections.init_stories[0];
              var ship = state.selections.ships[0];
              var stargazer = state.selections.stargazers[0];
              var finalPayload = null;
              var yamlStr = "";
              var cb = "";
              var promptStr = "";
              if (!story || !ship || !stargazer) {
                  alert("请完成剧情、舰船与观星者的选择后再生成协议。");
                  return;
              }

              finalPayload = {
                  System: {
                      Module: "Azure_Sector_Init",
                      Version: "1.0.0"
                  },
                  Captain: {
                      Name: state.captain.name,
                      Appearance: state.captain.appearance
                  },
                  init_stories: formatSelection(state.selections.init_stories),
                  ships: formatSelection(state.selections.ships),
                  items: formatSelection(state.selections.items),
                  stargazers: formatSelection(state.selections.stargazers)
              };

              yamlStr = jsyaml.dump(finalPayload);
              cb = String.fromCharCode(96, 96, 96);
              promptStr = `[系统指令：玩家已完成开局协议选择。请严格根据以下 YAML 初始化本次开局。]

              1. 严格使用 YAML 中提供的 init_stories、ships、items、stargazers，不得擅自替换为其他对象。
              2. 开局剧情以 init_stories 为唯一叙事锚点，必须根据其中的 时间、地点、描述 开场。
              3. 将选中的舰船写入 主角.舰船，将选中的个人物品写入 主角.个人物品，将选中的观星者写入 主角.可攻略角色。
              4. 主角姓名使用 Captain.Name。如果 Captain.Appearance 非空，则写入 主角.外貌。
              5. 将 主角.位置 设置为所选开局剧情中的 地点。
              6. 为了保持最小可用一致性：
                 - 选中舰船的 驾驶员 设为 Captain.Name
                 - 选中舰船的 是否旗舰 设为 true
                 - 选中舰船的 观星者接口角色 设为所选观星者名称
                 - 所选观星者的 附加信息.舰船ID 设为所选舰船名称
              7. 输出开场叙事后，立刻进行相应的变量更新。严格遵守当前世界书中的主角、舰船、角色、新闻更新规则。

              以下为初始化配置：
              ${cb}yaml
              ${yamlStr}
              ${cb}
              请开始输出：`;

              if (typeof createChatMessages !== "undefined") {
                  try {
                      createChatMessages([{ role: "user", message: promptStr }]);
                      document.getElementById('btn-next').textContent = "已注入 (SENT)";
                  } catch (e) {
                      console.error(e);
                  }
              } else if (navigator.clipboard) {
                  navigator.clipboard.writeText(promptStr).then(function() {
                      alert("协议已复制到剪贴板，请手动粘贴到聊天框。");
                  }).catch(function() {
                      console.log(promptStr);
                      alert("无法写入剪贴板，请按 F12 从控制台复制。");
                  });
              } else {
                  console.log(promptStr);
              }
          }

      </script>
  </body>
  </html>
  ```
  </start>
