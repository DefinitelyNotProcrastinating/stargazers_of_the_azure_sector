    <body>
      <script id="data-source" type="text/plain">$1</script>
      <div id="app"></div>
      <script>
        function escapeHtml(value) {
          return String(value ?? "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
        }
        function formatValue(value) {
          if (value === undefined || value === null || value === "") return "未记录";
          if (Array.isArray(value)) return value.length ? value.map(formatValue).join(" / ") : "无";
          if (typeof value === "object") return Object.entries(value).map(([k, v]) => `${escapeHtml(k)}: ${formatValue(v)}`).join("<br>");
          return escapeHtml(value);
        }
        function formatText(value) {
          return escapeHtml(value ?? "暂无记录").replace(/\n/g, "<br>");
        }
        function renderStats(entries) {
          return `<div class="grid">${entries.map(([label, value]) => `<div class="stat"><div class="label">${escapeHtml(label)}</div><div class="value">${formatValue(value)}</div></div>`).join("")}</div>`;
        }
        function renderKV(obj) {
          if (!obj || typeof obj !== "object" || !Object.keys(obj).length) return `<div class="empty">暂无扩展记录</div>`;
          return `<div class="kv">${Object.entries(obj).map(([k, v]) => `<div class="kv-item"><strong>${escapeHtml(k)}</strong><br>${formatValue(v)}</div>`).join("")}</div>`;
        }
        function init() {
          const raw = document.getElementById("data-source").textContent.trim().replace(/^\s*```(?:json|yaml)?/i, "").replace(/```\s*$/i, "").trim();
          const app = document.getElementById("app");
          try {
            const data = jsyaml.load(raw);
            const name = Object.keys(data || {})[0];
            const chara = name ? data[name] : null;
            if (!name || !chara || typeof chara !== "object") throw new Error("未读取到有效角色对象。");
            const isStargazer = chara["种族"] === "观星者";
            const coreStats = [
              ["种族", chara["种族"]],
              ["阵营", chara["阵营"]],
              ["身份", chara["身份"]],
              ["关系状态", chara["关系状态"]],
              ["可互动定位", chara["可互动定位"]],
              ["好感度", chara["好感度"] ?? 0]
            ];
            const tags = []
              .concat(Array.isArray(chara["性格"]) ? chara["性格"] : [])
              .concat(Array.isArray(chara["喜欢"]) ? chara["喜欢"].map((v) => `喜欢:${v}`) : [])
              .concat(Array.isArray(chara["讨厌"]) ? chara["讨厌"].map((v) => `讨厌:${v}`) : [])
              .concat(Array.isArray(chara["性癖"]) ? chara["性癖"].map((v) => `性癖:${v}`) : []);
            app.innerHTML = `
              <section class="sheet ${isStargazer ? "stargazer" : "civilian"}">
                <header class="head">
                  <div class="head-top">
                    <div>
                      <div class="eyebrow">${isStargazer ? "Stargazer Dossier / 观星者档案" : "Character Record / 人员记录"}</div>
                      <h1>${escapeHtml(name)}</h1>
                      <div class="meta">
                        <span class="pill quality">${escapeHtml(isStargazer ? "观星者专用卡" : "普通角色卡")}</span>
                        <span class="pill">${escapeHtml(chara["种族"] || "未分类")}</span>
                        ${chara["身份"] ? `<span class="pill">${escapeHtml(chara["身份"])}</span>` : ""}
                        ${isStargazer && chara["型号ID"] ? `<span class="pill">型号 ${escapeHtml(chara["型号ID"])}</span>` : ""}
                      </div>
                    </div>
                    <div class="sigil">
                      <div class="sigil-text">${escapeHtml(isStargazer ? "SYNTHETIC STARFRAME" : "CREW MEMBER PROFILE")}</div>
                    </div>
                  </div>
                  ${chara["想法"] ? `<div class="thought">“ ${formatText(chara["想法"])} ”</div>` : ""}
                </header>
                <div class="body">
                  <div>
                    <h2 class="section-title">核心信息</h2>
                    ${renderStats(coreStats)}
                  </div>
                  ${chara["外貌"] ? `<div class="panel"><h2 class="section-title">外貌记录</h2><div class="value">${formatText(chara["外貌"])}</div></div>` : ""}
                  ${tags.length ? `<div><h2 class="section-title">人物标签</h2><div class="tag-row">${tags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div></div>` : ""}
                  ${isStargazer ? `
                    <div class="two-col">
                      <div class="subpanel">
                        <h2 class="section-title">静态档案</h2>
                        ${renderKV(chara["静态档案"])}
                      </div>
                      <div class="subpanel">
                        <h2 class="section-title">动态好感</h2>
                        ${renderKV(chara["动态好感"])}
                      </div>
                    </div>
                    <div class="two-col">
                      <div class="subpanel">
                        <h2 class="section-title">外貌扩展</h2>
                        ${renderKV(chara["外貌记录"])}
                      </div>
                      <div class="subpanel">
                        <h2 class="section-title">附加信息</h2>
                        ${renderKV(chara["附加信息"])}
                      </div>
                    </div>
                    ${chara["性经历"] ? `<div class="panel"><h2 class="section-title">性经历</h2><div class="value">${formatText(chara["性经历"])}</div></div>` : ""}
                  ` : `
                    <div class="two-col">
                      <div class="subpanel">
                        <h2 class="section-title">偏好摘要</h2>
                        ${renderKV({ 喜欢: chara["喜欢"] || [], 讨厌: chara["讨厌"] || [], 性癖: chara["性癖"] || [] })}
                      </div>
                      <div class="subpanel">
                        <h2 class="section-title">备注</h2>
                        <div class="value">${formatText(chara["备注"] || "暂无备注")}</div>
                      </div>
                    </div>
                  `}
                </div>
              </section>
            `;
          } catch (error) {
            app.innerHTML = `<div class="sheet" style="padding:20px;"><div class="empty">角色卡解析失败：${escapeHtml(error.message)}</div></div>`;
          }
        }
        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
        else init();
      </script>
    </body>
    </html>
    ```
