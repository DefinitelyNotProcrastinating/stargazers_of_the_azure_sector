content: |-
  <ship_def>
  级别: 克劳德级
  别名: Claude-class
  舰船类型: CV
  舰种: 联网感应舰 CV
  价格: 202B
  制造商: 联邦航空航天局第01设计所
  描述: 舰体是一个直径接近五公里的巨大白色圆盘，表面光滑如镜，没有任何可见的武器或突出结构。当启动核心系统时，舰体表面会浮现出由无数微型能量节点组成的、不断变化的复杂蓝色几何图案，这些是其覆盖整个战区的分布式传感器与通讯矩阵的外在显现。
  舰船单位模板:
    舰船类型: CV
    吨位: XL
    驾驶员: ''
    是否旗舰: true
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 5
    跃迁消耗: 4
    制造商: 联邦航空航天局第01设计所
    描述: 舰体是一个直径接近五公里的巨大白色圆盘，表面光滑如镜，没有任何可见的武器或突出结构。当启动核心系统时，舰体表面会浮现出由无数微型能量节点组成的、不断变化的复杂蓝色几何图案，这些是其覆盖整个战区的分布式传感器与通讯矩阵的外在显现。
    炮位配置: 20C
    装备槽位配置: 9H10L
    装配资源:
      PG: 1050
      CPU: 1800
    效果:
      船体加成:
      - 旗舰型舰船；依据舰级定位应用：联网感应舰 CV。
      - 装配资源与槽位由本舰船独立定义，不应用常规舰级倍率公式。
      装配减免: []
      内置电子系统:
        基础CPU: 内置旗舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置旗舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
        旗舰指挥链: 内置多观星者并联与舰队级指挥链；具体接口需求见静态档案。
      特殊系统:
      - 名称: 多重信息优势矩阵
        描述: 联邦信息战技术的顶峰。激活后，“克劳德”级会成为一个巨大的信号增幅和过滤中心。友军方面，所有单位的数据链带宽提升500%，抗干扰能力大幅增强，几乎免疫常规电子战影响。敌军方面，该系统会发动“熵增攻击”，向敌方网络注入大量经过精确计算的冗余数据包，大幅增加敌方火控计算机的运算负荷，导致其锁定时间平均延长150%，并有一定概率造成短时间的系统宕机。拥有隐形装置，但无法在跃迁时隐形。
    装备: {}
  静态档案:
    观星者需求: 需要四名观星者进行并联的“内部程序通讯”（IPC）协作才能运行。这套复杂的系统确保了超级航母庞大身躯的稳定跃迁（跃迁核心稳定+20），但代价是指令传导链条更长，使其战术反应速度远慢于常规舰船。
    旧版描述: |-
      “搜寻，定位，摧毁。”——中央逻辑（战争节点）
      -   级别: 克劳德级 (Claude-class)
      -   类型: 联网感应舰 CV
      -   价格: 202B
      -   形态: 舰体是一个直径接近五公里的巨大白色圆盘，表面光滑如镜，没有任何可见的武器或突出结构。当启动核心系统时，舰体表面会浮现出由无数微型能量节点组成的、不断变化的复杂蓝色几何图案，这些是其覆盖整个战区的分布式传感器与通讯矩阵的外在显现。
      -   制造商: 联邦航空航天局第01设计所
      -   静态配置文件:
          -   舰体全长: 4950米 (直径)
          -   标准船员配置: 700人
          -   性能评级:
              -   装甲: 110000
              -   护盾: 295000
              -   机动性: 18
              -   火力输出: 35000 (无人机)
              -   回复量: 35000 (护盾传输与系统重启)
          -   武器系统:
              -   主要系统: 20x 重型无人舰挂架 (专注于 QE-100 电子战无人机和 QF-208 空优拦截机)，每编队8x
              -   次要系统: 40x QP-370 防御无人机发射巢
              -   攻击射程: 350000 km (电子战/通讯增益有效范围)
          -   特殊系统:
              -   名称: 多重信息优势矩阵
              -   描述: 联邦信息战技术的顶峰。激活后，“克劳德”级会成为一个巨大的信号增幅和过滤中心。友军方面，所有单位的数据链带宽提升500%，抗干扰能力大幅增强，几乎免疫常规电子战影响。敌军方面，该系统会发动“熵增攻击”，向敌方网络注入大量经过精确计算的冗余数据包，大幅增加敌方火控计算机的运算负荷，导致其锁定时间平均延长150%，并有一定概率造成短时间的系统宕机。拥有隐形装置，但无法在跃迁时隐形。
          -   观星者需求: 需要四名观星者进行并联的“内部程序通讯”（IPC）协作才能运行。这套复杂的系统确保了超级航母庞大身躯的稳定跃迁（跃迁核心稳定+20），但代价是指令传导链条更长，使其战术反应速度远慢于常规舰船。
  </ship_def>
