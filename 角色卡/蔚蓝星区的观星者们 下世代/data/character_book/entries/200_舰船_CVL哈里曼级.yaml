content: |-
  <ship_desc>
  “当万虫之潮吞噬星辰，唯有哈里曼将军的座舰化作最后的防线。他将自己的丰碑，用敌人的残骸筑于帝国的疆界之上。”——帝国海军学院，战史教科书《暗红星区之战》节选
  -   级别: 哈里曼级 (Harriman-class)
  -   类型: 轻型航母 CVL
  -   价格: 4B
  -   形态: 此舰致敬战死于暗红星区的哈里曼将军，他用自己的战舰撑到增援抵达殖民地，也点醒了帝国海军航母在空优上的短板。舰体设计继承了帝国海军厚重威严的风格，呈流线型，舰体中部宽阔，集成了装甲化的舰桥与传感器阵列，而后部则收窄为引擎区。起降入口位于舰船侧面。
  -   制造商: 帝国海军设计局
  -   静态配置文件:
      -   舰体全长: 2800米
      -   标准船员配置: 150人
      -   性能评级:
          -   装甲: 75000
          -   护盾: 55000
          -   机动性: 35
          -   火力输出: 28000 (无人机)
          -   回复量: 18000 (维修无人机)
      -   武器系统:
          -   主要系统: 20x “圣殿骑士”重型拦截无人机蜂巢 (专注于区域防空)，每个编队8架
          -   次要系统: 4x “军团”攻击无人机机库, 40x “守护者”重型点防御激光阵列
          -   攻击射程: 200000 km (无人机作战半径)
      -   特殊系统:
          -   名称: 联网式拦截矩阵
          -   描述: 一套先进的防空指挥系统。激活后，“哈里曼”级将接管其作战半径内所有友军单位的点防御火控权限。通过其强大的舰载服务器进行弹道统合计算，它能指挥整个舰队的防御火力，以最优化的方案拦截来袭的导弹与无人机，形成一道几乎没有死角的弹幕。在此矩阵覆盖下，所有友军单位的点防御系统射程提升15%，锁定速度提升40%，拦截效率提升25%。
      -   观星者需求: 需要5TW/mV的观星者和1错误率以下 比特率应当至少是500

  </ship_desc>
