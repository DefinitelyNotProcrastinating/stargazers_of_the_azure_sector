content: |-
  <ship_def>
  级别: 保镖级
  别名: Bodyguard-class
  舰船类型: AF
  舰种: 突击护卫舰
  舰体类别: 高级型
  价格: 10M
  制造商: 星轨航天公司
  描述: 保镖级的标准舰级档案。
  舰船单位模板:
    舰船类型: AF
    吨位: S
    驾驶员: ''
    是否旗舰: false
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 8
    跃迁消耗: 1
    制造商: 星轨航天公司
    描述: 保镖级的标准舰级档案。
    炮位配置: 3S1C
    装备槽位配置: 5H4L
    装配资源:
      PG: 48
      CPU: 190
    效果:
      船体加成:
      - 小型脉冲激光伤害 +20%
      - 小型脉冲激光跟踪 +15%
      - 轻型攻击无人机伤害 +20%
      - 跃迁扰断器与跃迁扰频器作用距离 +25%
      装配减免:
      - 小型能量武器 PG需求 -1
      - 轻型攻击无人机联队 CPU需求 -20%
      - 跃迁干扰模块 CPU需求 -15%
      内置电子系统:
        基础CPU: 内置舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置基础侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
      特殊系统:
        名称: 堡垒协议护盾回充器
        效果:
        - 激活后受损护盾抗性 +30%
        - 护盾回充速度显著提升
        备注:
        - 可选安装跃迁扰断器或跃迁扰频器接口
    装备: {}
  静态档案:
    舰种: 突击护卫舰
    舰体类别: 高级型
    价格: 10M
    规格:
      舰体全长: 140米
      标准船员配置: 6人
    性能评级:
      装甲: 600
      护盾: 1000
      机动性: 87
      火力输出: 450
    炮位明细:
    - 名称: S1
      尺寸: S
      类型: 能量炮座
      适配武器:
      - 脉冲激光
      - 集束激光
    - 名称: S2
      尺寸: S
      类型: 能量炮座
      适配武器:
      - 脉冲激光
      - 集束激光
    - 名称: S3
      尺寸: S
      类型: 通用突击武器座
      适配武器:
      - 能量武器
      - 导弹发射器
    - 名称: C1
      尺寸: C
      类型: 轻型机库
      适配武器:
      - 轻型攻击无人机
    推荐装备方案:
    - 3x 小型脉冲激光
    - 1x 轻型攻击无人机联队
    观星者需求:
      控制门槛:
        最低稳态增益: 1.8 TW/mV
        最高精度误差: 2.5/1M
        最低比特率: 180 TB/s
      超载门槛:
        最低爆发增益: 4.0 TW/mV
        需要技能: 工程 V
        规则:
        - 爆发增益不足时，不可超载护盾回充器与跃迁干扰主动模块
        - 超载为 2 回合 1 次
        - 超载效果提高至原值的 150%
      接口要求: 稳定兼容多种第三方硬件升级
      特性要求:
      - 性能峰值要求不高
      - 可靠性要求极高
      - 维护周期应尽可能低
  </ship_def>
