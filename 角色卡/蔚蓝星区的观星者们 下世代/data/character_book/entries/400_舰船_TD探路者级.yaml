content: |-
  <ship_def>
  级别: 探路者级
  舰船类型: TD
  舰种: 战术驱逐舰
  舰体类别: 高级型
  价格: 100M
  制造商: 联邦航空航天局第51设计所
  舰体描述: 舰体呈扁平的对称飞翼构型，通体为联邦标准的哑光白色涂装。舰身上分布着大量传感器阵列和可展开的探测器舱门，充满了科考船的特征，但隐藏在舰体腹部的武器模块暴露了其致命的本质。该战舰不仅仅是太空飞船，也可在大气层中高效飞行。
  静态档案:
    设计语: 几百年前，我们的先辈在末日的阴影中登上了月球，今日我们亦将前仆后继，一往无前！
    规格:
      舰体全长: 270米
      标准船员配置: 3人 + 最大150人
    性能评级:
      装甲: 1800
      护盾: 2800
      机动性: 86
      火力输出: 1900
    装配:
      装配资源:
        PG: 150
        CPU: 460
      槽位:
        高能: 7
        低能: 6
      武器座:
      - 名称: M1
        尺寸: M
        类型: 阳电子束座
        适配武器:
        - 中型能量武器
      - 名称: M2
        尺寸: M
        类型: 阳电子束座
        适配武器:
        - 中型能量武器
      - 名称: M3
        尺寸: M
        类型: 阳电子束座
        适配武器:
        - 中型能量武器
      - 名称: S1
        尺寸: S
        类型: 反导武器座
        适配武器:
        - 点防御激光
        - 火箭弹发射器
      - 名称: S2
        尺寸: S
        类型: 辅助工具座
        适配武器:
        - 牵引光束
        - 电子战投射器
      船体加成:
      - 中型能量武器伤害 +15%
      - 攻击模式下火力输出与护盾回充效率 +25%
      - 低可视模式下隐形性能显著提升
      - 探测、扫描与样本分析效率 +25%
      装配减免:
      - 传感、扫描与科研辅助模块 CPU需求 -20%
      - 隐形模块 CPU需求 -15%
      推荐武器方案:
      - 3x 轻型阳电子束发生器
      - 1x 反导拦截器
      - 1x 牵引光束
    特殊系统:
      名称: 战术舰体转换器
      效果:
      - 低可视模式下武器锁定但大幅降低被发现概率
      - 攻击模式下火力输出和护盾回充效率提升 25%
      附加系统:
      - 名称: 密封样本舱
        效果: 可安全存储和分析高危生物或物质样本
    观星者需求:
      控制门槛:
        最低稳态增益: 3.8 TW/mV
        最低比特率: 420 TB/s
        最高精度误差: 1.2/1M
      超载门槛:
        最低爆发增益: 7.5 TW/mV
        需要技能: 工程 V
        规则:
        - 爆发增益不足时，不可超载模式切换后的主动武器与护盾模块
        - 超载为 2 回合 1 次
        - 超载效果提高至原值的 150%
      接口要求: 需要心理稳定，避免隐形状态散发噪音
  跃迁充能: 0
  最大充能: 7
  跃迁消耗: 1
  </ship_def>
