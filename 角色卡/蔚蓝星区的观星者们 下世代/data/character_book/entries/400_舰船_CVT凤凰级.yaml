keys:
- 超级航母
- 凤凰
- 航母
content: |-
  <ship_def>
  级别: 凤凰构型
  别名: ''
  舰船类型: CVT
  舰种: 战术超级航母 (CVT)
  价格: 无法购买
  制造商: 银河防御联盟 - 第三设计所
  描述: 在巡航模式下，它的形态如同一只收拢翅膀的巨大金属飞鸟，舰体修长而紧凑。进入战斗模式后，层叠的结晶装甲板会如凤凰展翅般从前方两侧和上方展开成为前掠翼，露出内部密集的无人机弹射矩阵和散热结构，整个舰体在瞬间化为一座充满了致命美感的攻击平台。
  舰船单位模板:
    舰船类型: CVT
    吨位: XL
    驾驶员: ''
    是否旗舰: true
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 5
    跃迁消耗: 4
    制造商: 银河防御联盟 - 第三设计所
    描述: 在巡航模式下，它的形态如同一只收拢翅膀的巨大金属飞鸟，舰体修长而紧凑。进入战斗模式后，层叠的结晶装甲板会如凤凰展翅般从前方两侧和上方展开成为前掠翼，露出内部密集的无人机弹射矩阵和散热结构，整个舰体在瞬间化为一座充满了致命美感的攻击平台。
    炮位配置: 16C1T
    装备槽位配置: 12H8L
    装配资源:
      PG: 1760
      CPU: 2240
    效果:
      船体加成:
      - 旗舰型舰船；依据舰级定位应用：战术超级航母 (CVT)。
      - 装配资源与槽位由本舰船独立定义，不应用常规舰级倍率公式。
      装配减免: []
      内置电子系统:
        基础CPU: 内置旗舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置旗舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
        旗舰指挥链: 内置多观星者并联与舰队级指挥链；具体接口需求见静态档案。
      特殊系统:
      - 名称: 旗舰级战术变形结构
        描述: 舰船的核心能力。允许其在“巡航模式”和“战斗模式”之间切换。在战斗模式下，机体展开，无人机出动效率提升150%，机动性降低至40，但解锁末日武器的使用权限。废热越高，无人机的发射速度就越快。
      - 名称: 集成式物质抹除光束
        描述: 一种独特的单舰末日武器。激活后，“凤凰”构型展开的“翅膀”上的所有分解炮节点会将能量聚焦于舰首，然后收束场将会将射线收束为同一条，对单个目标造成恐怖的伤害。
    装备: {}
    T槽种类: 银河防御联盟
  静态档案:
    观星者需求: 对观星者的要求极为苛刻。变形系统需要极高的神经可塑性来驾驭，物质抹除阵列的能量控制则要求近乎完美的指令精度和庞大的数据处理带宽。精度需求： <0.1/1MOPS，比特率需求：1.2 PB/s，稳态增益需求： 8.0 TW/mV。
    旧版描述: |-
      “模拟数据分析结论：‘凤凰’构型在单体及小编队战术对抗中的生存与歼敌交换比，超出同造价下‘巡航’构型百分之三十七点二。然而，将其纳入舰队级战略资源分配模型后，其单位成本的战略价值产出比，低于‘完型’构型百分之六十二点八。结论：该构型为战术最优，战略次优方案。根据《资源最优化配置法案》第1139条，项目终止。”——银河防御联盟，中央数据库，项目评估档案 PX-01
      -   级别: 凤凰构型 (Phoenix Pattern)
      -   类型: 战术超级航母 (CVT)
      -   价格: 无法购买
      -   形态: 在巡航模式下，它的形态如同一只收拢翅膀的巨大金属飞鸟，舰体修长而紧凑。进入战斗模式后，层叠的结晶装甲板会如凤凰展翅般从前方两侧和上方展开成为前掠翼，露出内部密集的无人机弹射矩阵和散热结构，整个舰体在瞬间化为一座充满了致命美感的攻击平台。
      -   设计逻辑: “凤凰”构型是银河防御联盟在战争中期的一个大胆尝试，旨在创造一种能够在战巡级别的“小”规模冲突中，提供压倒性火力优势和指挥能力的“战区主宰”。它融合了一些敌对文明的护盾技术。它被设计为独立作战单位或小型舰队的核心，通过其堪比巡洋舰的高速机动性快速切入战场，展开机体释放大量无人机，并以其搭载的实验性末日武器对敌方关键节点进行“斩首”打击。它在模拟对抗中取得了辉煌的战绩，小规模实战中也几乎碾压了所有同等资源消耗的敌方编队。然而，联盟的战争是持续万年的总体战。当战略分析部门将其与“完型”构型进行对比时，其根本性的缺陷便暴露无遗：“凤凰”构型无法像“完型”一样进行战略投送，其生产和维护成本远高于同等数量的“分型”战体，在会战中超级武器效率也不如“完型”构型。
      -   制造商: 银河防御联盟 - 第三设计所
      -   静态配置文件:
          -   舰体全长: 4500米 / 7500m
          -   标准船员配置: 1+1 (需要链接)
          -   性能评级:
              -   装甲: 565000
              -   护盾: 320000
              -   机动性: 75
              -   火力输出: 75000 (无人机) / 250000 (末日武器)
              -   回复量: 35000 (纳米体修复)
          -   武器系统:
              -   主要系统: 16x “火羽”无人攻击机蜂巢（1个编队8架）, 1x 分布式分解阵列 (末日武器)
              -   次要系统: 40x 点防御脉冲波发射器
              -   攻击射程: 800000 km (战斗机) / 1500000 km (末日武器)
          -   特殊系统:
              -   名称: 旗舰级战术变形结构
              -   描述: 舰船的核心能力。允许其在“巡航模式”和“战斗模式”之间切换。在战斗模式下，机体展开，无人机出动效率提升150%，机动性降低至40，但解锁末日武器的使用权限。废热越高，无人机的发射速度就越快。
              -   名称: 集成式物质抹除光束
              -   描述: 一种独特的单舰末日武器。激活后，“凤凰”构型展开的“翅膀”上的所有分解炮节点会将能量聚焦于舰首，然后收束场将会将射线收束为同一条，对单个目标造成恐怖的伤害。
          -   观星者需求: 对观星者的要求极为苛刻。变形系统需要极高的神经可塑性来驾驭，物质抹除阵列的能量控制则要求近乎完美的指令精度和庞大的数据处理带宽。精度需求： <0.1/1MOPS，比特率需求：1.2 PB/s，稳态增益需求： 8.0 TW/mV。
  </ship_def>
