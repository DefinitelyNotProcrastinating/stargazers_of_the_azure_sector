keys:
- 人类技术联合
- 无畏舰
- 黑鹰级
content: |-
  <ship_def>
  级别: 黑鹰级
  别名: Black Hawk-class
  舰船类型: DN
  舰种: 无畏舰 DN (Dreadnought)
  价格: 12B (造价) / 300B+ (黑市收藏价)
  制造商: 人类技术联合
  描述: 舰体呈一个完美的、巨大的黑色飞碟形状，直径约3200米。表面覆盖着能够吸收几乎所有频段雷达波的特种吸波材料。在非战斗状态下，它看起来就像是一个漂浮在太空中的巨大黑色圆盘。当武器系统激活时，飞碟的边缘会裂开，露出内部密密麻麻的鱼雷加速发射管和无人机弹射口。其推进器也是内藏式的，喷口经过特殊冷却处理，几乎没有红外特征。
  舰船单位模板:
    舰船类型: DN
    吨位: XL
    驾驶员: ''
    是否旗舰: true
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 5
    跃迁消耗: 4
    制造商: 人类技术联合
    描述: 舰体呈一个完美的、巨大的黑色飞碟形状，直径约3200米。表面覆盖着能够吸收几乎所有频段雷达波的特种吸波材料。在非战斗状态下，它看起来就像是一个漂浮在太空中的巨大黑色圆盘。当武器系统激活时，飞碟的边缘会裂开，露出内部密密麻麻的鱼雷加速发射管和无人机弹射口。其推进器也是内藏式的，喷口经过特殊冷却处理，几乎没有红外特征。
    炮位配置: 12XL2C
    装备槽位配置: 12H8L
    装配资源:
      PG: 1800
      CPU: 1800
    效果:
      船体加成:
      - 旗舰型舰船；依据舰级定位应用：无畏舰 DN (Dreadnought)。
      - 装配资源与槽位由本舰船独立定义，不应用常规舰级倍率公式。
      装配减免: []
      内置电子系统:
        基础CPU: 内置旗舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置旗舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
        旗舰指挥链: 内置多观星者并联与舰队级指挥链；具体接口需求见静态档案。
      特殊系统:
      - 名称: 超大型物质偏移模块
        描述: 除了常规的光学和雷达隐形外，该系统能将舰船的相位略微偏移出当前光锥。虽然因为巨大的能耗和质量无法在隐形状态下启动跃迁引擎，但它允许“黑鹰”级在常规航行中几乎完全消失。结合其“能量回收”护盾系统，被击中时护盾发生器产生的废热和紊乱能量会被导回系统，维持隐形力场的稳定，只要护盾不破，隐形就能在受击后极短时间内恢复。
      - 名称: 精确量子定位仪
        描述: 其发射的重型鱼雷在离开发射管后，会利用自带的微型跃迁核心进行一次短距的量子传送。鱼雷会分解为亚原子粒子流，瞬间跨越数万公里的距离，直接在目标舰船的近防炮射程内（约1000-2000公里处）重组并点火冲刺。这使得拦截这种鱼雷几乎是不可能的任务，因为留给点防御系统的反应时间只有零点几秒，而其他的重型鱼雷在量子传送后落地距离可能在8000km外。
    装备: {}
  静态档案:
    观星者需求: 需要具备高空间感知能力的观星者，以便在复杂的相位偏移状态下维持舰船的坐标稳定。
    旧版描述: |-
      -   级别: 黑鹰级 (Black Hawk-class)
      -   类型: 无畏舰 DN (Dreadnought)
      -   价格: 12B (造价) / 300B+ (黑市收藏价)
      -   形态: 舰体呈一个完美的、巨大的黑色飞碟形状，直径约3200米。表面覆盖着能够吸收几乎所有频段雷达波的特种吸波材料。在非战斗状态下，它看起来就像是一个漂浮在太空中的巨大黑色圆盘。当武器系统激活时，飞碟的边缘会裂开，露出内部密密麻麻的鱼雷加速发射管和无人机弹射口。其推进器也是内藏式的，喷口经过特殊冷却处理，几乎没有红外特征。
      -   制造商: 人类技术联合
      -   静态配置文件:
          -   舰体全长: 3200米 (直径)
          -   标准船员配置: 120人
          -   性能评级:
              -   装甲: 45000
              -   护盾: 420000
              -   机动性: 38
              -   火力输出: 180000 (鱼雷齐射峰值)
          -   武器系统:
              -   主要系统: 12x “黑洞”超重型量子鱼雷发射阵列 (可装填反旗舰/反泰坦鱼雷)
              -   次要系统: 2x 重型无人机机库 (专注于电子战和点防御), 40x 隐藏式点防御激光
              -   攻击射程: 250000 km (鱼雷最大射程)
          -   特殊系统:
              -   名称: 超大型物质偏移模块
              -   描述: 除了常规的光学和雷达隐形外，该系统能将舰船的相位略微偏移出当前光锥。虽然因为巨大的能耗和质量无法在隐形状态下启动跃迁引擎，但它允许“黑鹰”级在常规航行中几乎完全消失。结合其“能量回收”护盾系统，被击中时护盾发生器产生的废热和紊乱能量会被导回系统，维持隐形力场的稳定，只要护盾不破，隐形就能在受击后极短时间内恢复。
              -   名称: 精确量子定位仪
              -   描述: 其发射的重型鱼雷在离开发射管后，会利用自带的微型跃迁核心进行一次短距的量子传送。鱼雷会分解为亚原子粒子流，瞬间跨越数万公里的距离，直接在目标舰船的近防炮射程内（约1000-2000公里处）重组并点火冲刺。这使得拦截这种鱼雷几乎是不可能的任务，因为留给点防御系统的反应时间只有零点几秒，而其他的重型鱼雷在量子传送后落地距离可能在8000km外。
          -   观星者需求: 需要具备高空间感知能力的观星者，以便在复杂的相位偏移状态下维持舰船的坐标稳定。
  </ship_def>
