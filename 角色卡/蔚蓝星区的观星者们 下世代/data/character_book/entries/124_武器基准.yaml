content: |-
  <武器基准>

  ### 3.1 能量武器（激光/脉冲激光/正电子束）

  | 大小 | 代表武器               | 伤害/轮 | 最佳射程  | 失准射程  | 跟踪(rad/s) | PG   | CPU  |
  |------|------------------------|---------|-----------|-----------|-------------|------|------|
  | S    | MK-II 轻型脉冲激光    | 80      | 6,000km   | 12,000km  | 0.18        | 3    | 8    |
  | S    | MK-II 轻型集束激光    | 100     | 9,000km   | 18,000km  | 0.12        | 4    | 10   |
  | M    | MK-IV 中型脉冲激光    | 250     | 15,000km  | 30,000km  | 0.06        | 14   | 22   |
  | M    | MK-IV 中型集束激光    | 320     | 30,000km  | 55,000km  | 0.035       | 16   | 25   |
  | L    | MK-VI 重型脉冲激光    | 800     | 40,000km  | 75,000km  | 0.012       | 38   | 48   |
  | L    | MK-VI 重型集束激光    | 1,100   | 70,000km  | 130,000km | 0.007       | 42   | 52   |
  | XL   | 太瓦级聚焦光矛        | 4,500   | 150,000km | 280,000km | 0.002       | 110  | 90   |
  | XL   | 阳电子光矛            | 6,000   | 200,000km | 375,000km | 0.001       | 130  | 100  |

  备注：
  - 脉冲激光：高跟踪、低伤害、短射程。适合打小目标。
  - 集束激光：低跟踪、高伤害、长射程。适合打大目标。
  - 正电子束/光矛：XL专用，极低跟踪，极高伤害和射程。
  - 能量武器无弹药消耗，但产生废热。废热累积到阈值时武器强制冷却（约2dt）。
  - 失准射程：超出最佳射程后伤害线性衰减，到失准射程边界时伤害降为0。

  ### 3.2 动能武器（磁轨炮/自动加农炮）

  | 大小 | 代表武器                | 伤害/轮 | 最佳射程  | 失准射程  | 跟踪(rad/s) | PG   | CPU  |
  |------|-------------------------|---------|-----------|-----------|-------------|------|------|
  | S    | 150mm 速射磁轨炮       | 90      | 5,000km   | 10,000km  | 0.20        | 2    | 7    |
  | S    | 200mm 自动加农炮       | 120     | 3,000km   | 7,000km   | 0.25        | 3    | 6    |
  | M    | 280mm 中型磁轨炮       | 280     | 20,000km  | 40,000km  | 0.05        | 12   | 18   |
  | M    | 425mm 中型自动加农炮   | 380     | 8,000km   | 18,000km  | 0.09        | 10   | 15   |
  | L    | 2800mm 旋转磁轨炮      | 950     | 55,000km  | 100,000km | 0.010       | 35   | 42   |
  | L    | 5000mm 重型磁轨炮      | 1,400   | 80,000km  | 140,000km | 0.006       | 45   | 50   |
  | XL   | 40000mm 超重型磁轨炮   | 5,500   | 180,000km | 350,000km | 0.0015      | 120  | 85   |
  | XL   | 90000mm 超重型磁轨炮   | 8,000   | 200,000km | 400,000km | 0.001       | 150  | 95   |

  备注：
  - 磁轨炮：高伤害、长射程、低射速、低跟踪。适合远距离狙击。
  - 自动加农炮：近距离高DPS、高跟踪、短射程。适合缠斗。
  - 动能武器消耗弹药（炮弹），不同弹药类型影响伤害和射程。
  - 超出最佳射程后动能武器受弹道散布影响，命中率下降（非线性衰减）。
  - 动能弹丸在超过1000km时进行量子传送至目标附近5%距离处重组后飞行。

  ### 3.3 导弹/鱼雷系统

  | 大小 | 代表武器                 | 伤害/发 | 飞行射程   | 爆炸半径 | 爆炸速度(m/s) | PG  | CPU  |
  |------|--------------------------|---------|------------|----------|---------------|-----|------|
  | S    | 轻型导弹发射器           | 70      | 20,000km   | 50m      | 3,500         | 2   | 10   |
  | S    | 火箭弹发射器             | 50      | 8,000km    | 30m      | 5,000         | 1   | 6    |
  | M    | 重型导弹发射器           | 220     | 45,000km   | 150m     | 2,000         | 10  | 24   |
  | M    | 重型突击导弹发射器       | 300     | 25,000km   | 100m     | 2,800         | 12  | 20   |
  | L    | 巡航导弹发射器           | 750     | 100,000km  | 400m     | 1,200         | 30  | 55   |
  | L    | 鱼雷发射管               | 1,800   | 80,000km   | 800m     | 600           | 40  | 50   |
  | XL   | 超重型鱼雷发射阵列       | 6,000   | 250,000km  | 2,000m   | 300           | 100 | 80   |
  | XL   | 末日鱼雷（单发超重型）   | 25,000  | 300,000km  | 5,000m   | 150           | 140 | 110  |

  备注：
  - 导弹在发射后量子传送至目标附近约5%距离处重组，然后靠推进器飞行最后1000-2000km。
  - 导弹伤害公式：基础伤害 × (重合体积/爆炸球体积) × min(1, 爆炸速度/目标速度)
  - 轻型导弹打小目标效率最高；鱼雷打大目标效率最高。
  - 巡航导弹对FF/DD：因爆炸半径远大于目标长轴，重合体积比极低（约5-15%），但基础伤害高，
    实际伤害约38-113点。并非完全无效，但效率极低。
  - 鱼雷对FF/DD：爆炸速度极低(600m/s)，高速FF(2000+m/s)的速度系数仅0.3，
    叠加极低的重合体积比(约3-8%)，实际伤害约16-43点。基本无效。
  - 导弹消耗弹药。不同弹头类型影响伤害类别。
  - 点防御系统可在导弹飞行阶段拦截（见防御系统表）。

  ### 3.4 无人机/舰载机系统

  | 大小 | 代表载具             | 每架伤害/轮 | 作战半径    | 跟踪(rad/s) | C挂点占用 | PG  | CPU  |
  |------|----------------------|-------------|-------------|-------------|-----------|-----|------|
  | S    | 轻型攻击无人机(x8)   | 15          | 30,000km    | 0.22        | 1C        | 5   | 15   |
  | M    | 中型攻击无人机(x8)   | 50          | 60,000km    | 0.08        | 1C        | 15  | 30   |
  | L    | 重型攻击无人机(x8)   | 150         | 120,000km   | 0.03        | 1C        | 35  | 55   |
  | L    | 重型轰炸机(x8)       | 250         | 180,000km   | 0.015       | 1C        | 40  | 60   |
  | XL   | 旗舰级无人攻击机(x8) | 500         | 250,000km   | 0.01        | 1C        | 80  | 90   |

  备注：
  - 每个C挂点容纳1个编队（8架）。表中伤害为单架伤害。
  - 无人机从母舰量子传送至目标附近后自主作战，跟踪判定与炮塔一致。
  - 无人机可被点防御系统击落。被击落的无人机在返回母舰后需要时间补充。
  - 轻型无人机：高跟踪，适合打小目标和护卫舰。
  - 重型轰炸机：低跟踪，高伤害，适合打大目标。
  - 维修无人机(R挂点)不造成伤害，以回复量/轮计算（见防御表）。

  </武器基准>
