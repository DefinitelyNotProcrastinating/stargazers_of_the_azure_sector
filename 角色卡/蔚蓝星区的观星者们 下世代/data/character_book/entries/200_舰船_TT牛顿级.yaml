content: |-
  <ship_def>
  级别: 牛顿级
  别名: ''
  舰船类型: TT
  舰种: 泰坦 (TT)
  价格: 400B
  制造商: 联邦航空航天局第01设计所
  描述: 舰体是一个厚重，修长的方形机械体，表面布满护盾发生器和常规炮塔。舰体中段包裹着一个由数个同心旋转的环状结构组成的复杂阵列，这些环在启动末日武器时会以不同的速度旋转，并发出幽蓝色的辉光。
  舰船单位模板:
    舰船类型: TT
    吨位: XL
    驾驶员: ''
    是否旗舰: true
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 6
    跃迁消耗: 6
    制造商: 联邦航空航天局第01设计所
    描述: 舰体是一个厚重，修长的方形机械体，表面布满护盾发生器和常规炮塔。舰体中段包裹着一个由数个同心旋转的环状结构组成的复杂阵列，这些环在启动末日武器时会以不同的速度旋转，并发出幽蓝色的辉光。
    炮位配置: 8XL10C1T
    装备槽位配置: 11H11L
    装配资源:
      PG: 2800
      CPU: 3400
    效果:
      船体加成:
      - 旗舰型舰船；依据舰级定位应用：泰坦 (TT)。
      - 装配资源与槽位由本舰船独立定义，不应用常规舰级倍率公式。
      装配减免: []
      内置电子系统:
        基础CPU: 内置旗舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置旗舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
        旗舰指挥链: 内置多观星者并联与舰队级指挥链；具体接口需求见静态档案。
      特殊系统:
      - 名称: “第一推动力”多相态打击系统 (三选一装配)
        描述: 位于舰体中心环状阵列内的多功能武器核心。
    装备: {}
    T槽种类: 联邦
  静态档案:
    观星者需求: 跃迁核心稳定度+25。需要至少20名拥有顶级计算精度和能量调控能力的观星者组成“逻辑矩阵”，或一名传说中拥有超过20TW/mV稳定增益的观星者才能驾驭。
    旧版描述: |-
      “宇宙的法则冰冷而精确。引力束缚群星，熵增决定终末。”——“中央逻辑”对“牛顿”级泰坦的战术评估摘要
      -   级别: 牛顿级
      -   类型: 泰坦 (TT)
      -   价格: 400B
      -   形态: 舰体是一个厚重，修长的方形机械体，表面布满护盾发生器和常规炮塔。舰体中段包裹着一个由数个同心旋转的环状结构组成的复杂阵列，这些环在启动末日武器时会以不同的速度旋转，并发出幽蓝色的辉光。
      -   制造商: 联邦航空航天局第01设计所
      -   静态配置文件:
          -   舰体全长: 19200米
          -   标准船员配置: 4500人
          -   性能评级:
              -   装甲: 1,900,000
              -   护盾: 2,800,000
              -   机动性: 6
              -   火力输出: 320,000 / 1000 000（末日武器）
          -   武器系统:
              -   主要系统: 8x 旗舰级阳电子光矛
              -   次要系统: 200x QP-370 防御无人机发射巢, 10x QE-900 式重型隐形电子战无人机集群
              -   攻击射程: 375,000 km
          -   特殊系统:
              -   名称: “第一推动力”多相态打击系统 (三选一装配)
              -   描述: 位于舰体中心环状阵列内的多功能武器核心。
                  1.  **“引力透镜”时空奇点长枪**: 利用跃迁引擎生成一个庞大的引力长枪。该武器能够无视任何常规护盾和装甲，直接扭曲和撕裂目标舰体的时空结构。
                  2.  **“麦克斯韦妖”散射正电子风暴**: 向前方扇形区域释放一团高度定向的正电子云。这团风暴能瞬间瘫痪和烧毁大范围内所有敌舰的电子系统，并对其护盾造成持续性的湮灭伤害。
                  3.  **“拉普拉斯妖”电子干扰场**: 产生一个覆盖整个战区的超光速信息干扰场。该力场不会直接造成伤害，但会向敌方所有单位的火控和导航系统中注入具有误导性的未来状态预测数据，使其武器失准率飙升。
          -   观星者需求: 跃迁核心稳定度+25。需要至少20名拥有顶级计算精度和能量调控能力的观星者组成“逻辑矩阵”，或一名传说中拥有超过20TW/mV稳定增益的观星者才能驾驭。
  </ship_def>
