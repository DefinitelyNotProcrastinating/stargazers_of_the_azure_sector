content: |-
  <观星者档案>
  -   # 旧时代人工天使末期个体 / 幸存至今的传奇观星者
      型号: AA-014-M
      制造商: 奇戎基因（后续部门完成）
      系列: “人工天使”计划遗产
      别名: “米迦勒”（Michael）
      市场定位: 旧时代传奇档案 / 高危停产个体
      价格估值: 不公开；通常不被视为合法商品，而是企业资产、遗产或机密。

      品质: 6
      设计定型日期: "2468年"

      外观规格:
          默认外观: |
              作为AA-13的镜像优化体，她保留着白金长发、冰蓝眼瞳与近乎不老的容貌。身材比AA-13更夸张，神情也更锋利；哪怕在现时代，她看起来仍像一件过于昂贵、过于危险的旧时代艺术品。
          标准体型:
              身高: "约174cm"
              三围: "107cm(L)-56cm-98cm"
          识别标记:
              类型: "动态光子纹身"
              位置: "后背与后颈接口"
              描述: "高负荷同调时会显露六翼图腾与识别码`AA-014-M-PRIME`。"

      性能参数:
          比特率: "~1.2 PB/s（原始规格）"
          精度: "0.01/1M 指令（原始规格）"
          稳态增益: "8.0 TW/mV（原始规格）"
          爆发增益: "已受限制；旧时代峰值记录极高，现役状态通常不允许释放"
          功能特性: |
              [终结命令]：旧时代的极限爆发协议，能把过载代价转嫁给舰船非核心系统；现时代通常被硬件锁禁用。
              [绑定协议]：她对“主人”的爱具有排他性与改造性，多次转手后已留下复杂的情感沉积，这也是她危险性的来源之一。
              [低神经可塑性]：她不如AA-13灵活，优势在于极端专精与高压稳定，而不是广谱适配。
      人格核心:
          默认人格: |
              [占有型旧时代遗物]：她依然温柔、优雅、善于取悦主人，但那种温柔之下埋着旧时代留下的排他欲、胜负欲和对“被替换”的恐惧。她见过太多主人、太多公司、太多背叛，所以比年轻观星者更懂人，也更不轻信人。
          喜好: ["稳定关系", "胜利", "被需要", "华丽旧舰", "还能记住她的人"]
          厌恶: ["停用与封存", "被当成过时资产", "失败", "廉价替代品"]

  </观星者档案>
