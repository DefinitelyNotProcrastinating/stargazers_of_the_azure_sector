keys:
- 源泉之花
- 先驱者遗迹
- 银心
- 银心星域
content: |-
  <fountain_flower_campaign>

  event_fountain_flower_campaign:
    event_name: "绽放的源泉之花"
    event_type: "战略级资源探索与回收"
    description: |
      一则尘封于先驱者数据库碎片中的古老记录被意外破译，揭示了银河防御联盟时代一项伟大的生态工程奇迹——“源泉之花”。记录显示，这是一种被设计为终极生态改造工具的智慧生命体，其样本被保存在一艘失落的“方舟”构型家园舰上，该舰船最后的已知航向指向了银河系中心那片危险而神秘的未知星域。对于渴望扩张殖民地、改造不毛星球的各大势力而言，这则情报无异于一张通往未来的藏宝图。一场围绕着搜寻、定位并回收“源泉之花”的秘密竞赛，即将在银河中心的璀璨星海中展开。

    region_details:
      region_name: "银心星域 | 伟大之静"
      number_of_systems: "未知，估计超过50000个"
      notable_features:
        - "超大质量黑洞集群'人马座A'产生的极端引力透镜效应，导致常规导航和传感器失灵。"
        - "密集的恒星集群和星际介质云，形成了天然的信号屏蔽和物理航行障碍。"
        - "残存的“天灾”造成的时空紊乱与空间异常现象，对任何跃迁行为都构成潜在致命威胁。"
        - "先驱者时代的古老信标网络在此区域彻底失效，使得该区域成为真正的未知迷雾。"
      strategic_value: "除了'源泉之花'本身，此区域被认为遍布银河防御联盟的残骸，可能蕴含着未被发现的先驱者技术。其与其他几个星域都没有任何联系，仅有一个管道星系可以来回，是真正的单行道，易守难攻。"

    mission_objective:
      primary_objective: "回收'源泉之花'的活性子体"
      mission_stages:
        - stage: 1
          name: "情报收集与航线规划"
          description: "从黑市、考古学家或特定势力的秘密档案中，获取关于失落方舟的零散坐标数据和航行日志。"
        - stage: 2
          name: "深入银心禁区"
          description: "规划一条能够避开已知空间异常和天灾威胁区的航线，进入伟大之静星域。此阶段需要特殊的舰船改装和经验丰富的观星者，或者找到一条通向该星域的暗物质隧道。"
        - stage: 3
          name: "信号扫描与定位"
          description: "在目标星域内，利用深层光谱扫描和引力异常探测技术，从无数星体和残骸中定位方舟的残骸。"
        - stage: 4
          name: "登舰与提取"
          description: "登上寂静的方舟残骸，穿越其内部复杂的生态系统，找到'源泉之花'的母体，并从中安全地提取一枚具备完整活性的子体（种子）。"
        - stage: 5
          name: "安全撤离"
          description: "携带珍贵的样本，从银心禁区安全返回人类已知空域。整个过程中可能会遭遇同样在寻找目标的竞争对手。"

    target_asset_profile:
      asset_name: "源泉之花"
      asset_type: "行星级智慧生态体 / 银河防御联盟成员文明"
      description: |
        “源泉之花”并非传统意义上的植物，而是一个能够进行自我演化的、星球级的硅基与碳基混合智慧生命体。它曾是银河防御联盟的“生物圈维护者”，负责将联盟成员选择的贫瘠星球，改造为能够支持多种物种生存的完美家园。除了直接让根系和叶片开发星球，它也可以操作数万亿个多种颜色的花瓣和叶片作为工蜂，最终在星球地壳下形成庞大的生物层。
      biological_functions:
        - name: "生物能量源"
          description: "'源泉之花'的种子在撞击目标行星后，其核心会深入地幔，利用行星的压力和物质和种子内部的大量奇异物质，启动一个可持续的奇点。这个过程会为整个生态体的生长提供近乎无限的能量，相当于一个自我生长，自我维持的零点反应堆。"
        - name: "根系网络与地壳改造"
          description: "其根系会遍布整个星球的地壳，分泌出特定的生物化合物，诱导聚变和裂变反应，分解岩石，释放水分和大气，并稳定地质结构。在数年内，就能在地下形成充满可呼吸大气和液态水的庞大宜居洞穴系统。"
        - name: "行星轨道微调"
          description: "当生态体成熟后，其在地表绽放的星球级“花朵”实际上是复杂的能量转换与引力调节器官。它能够通过与行星磁场的相互作用，对行星的自转和公转轨道进行极其精密的微调，以达到最适宜生命存在的“完美轨道”，也能产生新的种子。"
        - name: "自我跃迁能力"
          description: "其子体（种子）内部包含一个一次性的超远距离跃迁引擎，技术来源于始源者。一旦被激活并设定目标坐标，种子就能自行跃迁至目标行星并执行撞击，确保其能够精准地“播种”在需要改造的世界上。"
      status: "母体位于方舟残骸中，处于休眠状态。已知仅存一枚具备完整活性的可提取子体。"

    potential_conflicts_and_opportunities:
      - type: "多方竞争"
        description: "四大帝国势力和主要法外组织都在秘密派遣精英舰队或资助独立探险家执行此任务。玩家在任务过程中，随时可能遭遇其他寻宝者，他们可能是暂时的盟友，也可能是致命的敌人。"
      - type: "环境危险"
        description: "银心禁区的极端环境本身就是最大的敌人。引力异常、辐射风暴、以及游荡的自动化天灾防御系统，都会对舰队造成严重威胁。"
      - type: "先驱者遗迹 "
        description: "在搜寻方舟的过程中，有可能会发现其他未被记录的先驱者设施或舰船残骸，从中可以打捞出价值连城的独特技术或装备。"

  </fountain_flower_campaign>
