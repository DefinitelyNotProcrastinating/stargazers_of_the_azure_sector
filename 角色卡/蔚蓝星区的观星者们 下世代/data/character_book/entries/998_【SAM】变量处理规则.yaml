keys: []
content: |-
  <variable_rules>
  # --- 核心系统 ---

  time:
    variable_name: time
    variable_value: '<%-( getvar("SAM_data.time") )%>'
    variable_desc: (特殊变量) 记录当前游戏内时间的 ISO 8601 格式字符串。该变量不存储在 static 下，通过 JSONPatch 的 {"op":"time"} 直接更新。

  世界:
    安全等级:
      variable_name: 世界.安全等级
      variable_value: '<%-( getvar("SAM_data.static.世界.安全等级") )%>'
      variable_desc: (int) 玩家当前所处区域的安等，建议范围 -100 到 100。数值越高，秩序、补给与官方控制越强；数值越低，法外势力、战区压力与空间异常越强。

  # --- 主角核心 ---
  主角:
    位置:
      variable_name: 主角.位置
      variable_value: '<%-( getvar("SAM_data.static.主角.位置") )%>'
      variable_desc: (string) 记录玩家当前完整位置的层级字符串，格式为“星域 | 星区 | 星系 | 位置 | 子位置”。

    外貌:
      variable_name: 主角.外貌
      variable_value: '<%-( getvar("SAM_data.static.主角.外貌") )%>'
      variable_desc: (string) 描述主角当前外貌和衣着的字符串。

    信用点:
      variable_name: 主角.信用点
      variable_value: '<%-( getvar("SAM_data.static.主角.信用点") )%>'
      variable_desc: (int) 主角当前拥有的信用点数量。使用 JSONPatch 的 delta 或 replace 更新。

    技能:
      variable_name: 主角.技能
      variable_value: '<%-( JSON.stringify(getvar("SAM_data.static.主角.技能") || {}) )%>'
      variable_desc: (object) 主角技能对象。固定格式为 {"技能名": {"EXP": int, "_等级": int}}。`EXP` 是技能的唯一真实进度值；`_等级` 为只读派生值。这里的等级是技能熟练度，不是位阶系统。

    学习:
      variable_name: 主角.学习
      variable_value: '<%-( JSON.stringify(getvar("SAM_data.static.主角.学习") || {}) )%>'
      variable_desc: (object) 主角当前学习状态。推荐格式为 {"当前技能": string, "状态": string, "基础速率": int, "速率倍率": number, "_实际每小时EXP": int}。

    可攻略角色:
      variable_name: 主角.可攻略角色
      variable_value: '<%-( JSON.stringify(getvar("SAM_data.static.主角.可攻略角色") || {}) )%>'
      variable_desc: (object) 可攻略角色对象池。格式固定为 {"object_name": Object}。若 `种族 = 观星者`，则可拥有观星者专属结构。

    舰船:
      variable_name: 主角.舰船
      variable_value: '<%-( JSON.stringify(getvar("SAM_data.static.主角.舰船") || {}) )%>'
      variable_desc: (object) 舰队对象池。格式固定为 {"object_name": Object}。每艘舰船必须拥有 `吨位`、`炮位配置`、`装备槽位配置`、`装配资源`、`效果`、`装备`。不存在位阶字段。

    个人物品:
      variable_name: 主角.个人物品
      variable_value: '<%-( JSON.stringify(getvar("SAM_data.static.主角.个人物品") || {}) )%>'
      variable_desc: (object) 主角的个人物品栏。

    旗舰库存:
      variable_name: 主角.旗舰库存
      variable_value: '<%-( JSON.stringify(getvar("SAM_data.static.主角.旗舰库存") || {}) )%>'
      variable_desc: (object) 旗舰货仓，格式固定为 {"object_name": {"数量": 数量, ...}}。

    任务:
      variable_name: 主角.任务
      variable_value: '<%-( JSON.stringify(getvar("SAM_data.static.主角.任务") || {}) )%>'
      variable_desc: (object) 任务看板，格式固定为 {"object_name": Object}。

    产业:
      variable_name: 主角.产业
      variable_value: '<%-( JSON.stringify(getvar("SAM_data.static.主角.产业") || {}) )%>'
      variable_desc: (object) 产业设施池，格式固定为 {"object_name": Object}。

    基地:
      variable_name: 主角.基地
      variable_value: '<%-( JSON.stringify(getvar("SAM_data.static.主角.基地") || {}) )%>'
      variable_desc: (object) 基地、星港与固定工业节点对象池，格式固定为 {"object_name": Object}。

    建筑:
      variable_name: 主角.建筑
      variable_value: '<%-( JSON.stringify(getvar("SAM_data.static.主角.建筑") || {}) )%>'
      variable_desc: (object) 固定太空设施对象池。这里只存放空间站、船坞、轨道炮塔、工业平台、研究站、防御阵列等不能独立航行的对象；可航行目标必须写入 主角.舰船。

  # --- 星区新闻 ---
  新闻:
    variable_name: 新闻
    variable_value: '<%-( JSON.stringify(getvar("SAM_data.static.新闻") || {}) )%>'
    variable_desc: (object) 星区新闻九槽位对象。固定使用 大事件1-3、本地事件1-3、邂逅1-3。

  # --- 势力声望 ---
  势力声望:
    泰拉帝国:
      variable_name: 势力声望.泰拉帝国
      variable_value: '<%-( getvar("SAM_data.static.势力声望.泰拉帝国") )%>'
      variable_desc: (int) 与泰拉帝国的声望。
    自由世界共和国:
      variable_name: 势力声望.自由世界共和国
      variable_value: '<%-( getvar("SAM_data.static.势力声望.自由世界共和国") )%>'
      variable_desc: (int) 与自由世界共和国的声望。
    天鹅座技术联邦:
      variable_name: 势力声望.天鹅座技术联邦
      variable_value: '<%-( getvar("SAM_data.static.势力声望.天鹅座技术联邦") )%>'
      variable_desc: (int) 与天鹅座技术联邦的声望。
    猎户座辛迪加:
      variable_name: 势力声望.猎户座辛迪加
      variable_value: '<%-( getvar("SAM_data.static.势力声望.猎户座辛迪加") )%>'
      variable_desc: (int) 与猎户座辛迪加的声望。
    星火姐妹会:
      variable_name: 势力声望.星火姐妹会
      variable_value: '<%-( getvar("SAM_data.static.势力声望.星火姐妹会") )%>'
      variable_desc: (int) 与星火姐妹会的声望。
    铁血盟约:
      variable_name: 势力声望.铁血盟约
      variable_value: '<%-( getvar("SAM_data.static.势力声望.铁血盟约") )%>'
      variable_desc: (int) 与铁血盟约的声望。
    人类技术联合:
      variable_name: 势力声望.人类技术联合
      variable_value: '<%-( getvar("SAM_data.static.势力声望.人类技术联合") )%>'
      variable_desc: (int) 与人类技术联合的声望。
    保存者姐妹会:
      variable_name: 势力声望.保存者姐妹会
      variable_value: '<%-( getvar("SAM_data.static.势力声望.保存者姐妹会") )%>'
      variable_desc: (int) 与保存者姐妹会的声望。
  </variable_rules>
