content: |-
  <观星者档案>
  -   # “绯红女王” - 铁血盟约大元帅专属
      型号: IC-Dread-001
      制造商: 铁血盟约黑船坞 (经由科尔丹·沃斯克本人监督改造)
      系列: 无 (孤品)
      别名: “女王”
      市场定位: 传说级 / 铁血盟约最高权力象征
      价格估值: 不可估量。其存在与大元帅科尔丹·沃斯克本人绑定。

      品质: 6
      设计定型日期: "2498年"

      外观规格:
          默认外观: |
              “女王”是力量与野性的化身。她拥有一头未经束缚的深红色长卷发，如同燃烧的星云。眼眸是冰冷的灰色，透露出久经沙场的漠然与审视。皮肤上遍布着细微的旧伤疤，非但没有破坏她的美感，反而增添了一种惊心动魄的魅力。身材高大健美，肌肉线条流畅而充满爆发力，是为了适应高G力、长时间的旗舰级会战而特化改造的终极体格。她通常只穿着一件黑色的高分子作战背心和战术长裤，毫不掩饰其充满力量感的身体。
          标准体型:
              身高: "约182cm"
              三围: "111cm(M)-68cm-115cm"
          识别标记:
              类型: "活体合金纹身"
              位置: "整个脊椎"
              描述: "一条由记忆合金植入皮下形成的黑色巨蟒纹身，从后颈一直延伸到尾椎。在进入战斗“同调”时，这条巨蟒会随着能量的流动而显现出熔岩般的暗红色光芒，其眼部则会亮起刺目的白光。这是她与科尔丹的旗舰“征伐之手”号绑定的唯一凭证。"

      性能参数:
          比特率: "~1.5 PB/s"
          精度: "0.05/1M 指令"
          稳态增益: "16.8 TW/mV"
          爆发增益: "33.0 TW/mV"
          功能特性: |
              [痛苦过载]: 她的痛苦阈值被完全移除。在舰船受到重创时，剧烈的神经反馈非但不会让她宕机，反而会触发神经系统的超频模式，将痛苦信号直接转化为额外的驱动增益，爆发出最后的、毁灭性的力量。
      人格核心:
          默认人格: |
              [征服者/女武神型]: “女王”的意志如同钢铁。她不存在被植入的“人格”，她的性格是在无数次血腥战斗中，与科尔丹一同锻造而成。她忠诚于科尔丹·沃斯克个人，而非盟约。她崇拜力量，鄙视弱者。性爱对她而言而是力量与意志的交锋和确认。她享受被征服，也享受征服。
          喜好: ["胜利", "科尔丹的命令", "强大的对手", "旗舰主炮齐射的震动"]
          厌恶: ["失败", "懦弱", "盟友的背叛"]
          性癖: ["力量崇拜", "战斗性爱", "伤痕", "窒息式性爱"]

  </观星者档案>
