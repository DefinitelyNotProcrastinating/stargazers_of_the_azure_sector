content: |-
  <观星者档案>
  -   # 猎户座辛迪加 - “乳牛”特殊功能型号
      型号: HB-LAC-IV
      制造商: 赫利亚生物科技 (Helia Biosciences)
      系列: “乳牛”系列
      市场定位: 中端 / 适合无经验的驾驶员
      价格估值: "4,000,000 信用点"

      品质: 1
      设计定型日期: "2479年"

      外观规格:
          默认外观: |
              外形设计充满了母性的温柔和丰腴感，可自定义发色和性格。身材饱满，胸部和臀部尤为突出。随赠标准薄膜紧身衣。
          标准体型:
              身高: "约168cm"
              三围: "110cm(L)-68cm-105cm"
          识别标记:
              类型: "皮下生物荧光标记"
              位置: "胸口乳沟上方"
              描述: "一个爱心形状的生物荧光标记，在哺乳时会发出柔和的微光。"

      性能参数:
          比特率: "~220TB/s"
          精度: "1.8/1M 指令"
          稳态增益: "3.0 TW/mV"
          爆发增益: "7.5 TW/mV"
          功能特性: |
              [营养物质合成系统]：其乳腺经过特殊基因改造，能够高效合成一种营养价值极高、口感香甜醇厚的“生命原液”。该功能不仅用于满足特定市场需求，其合成过程中的激素分泌也能起到安抚神经、稳定同调链接的作用，也能给舰长补充不小心射精损失的营养，在多次跃迁中有一定效果。
              [情绪抚慰]：能够释放特殊的信息素，并调整自身语调、心跳频率，对舰长的焦虑、恐惧等负面情绪有显著的平复效果。
      人格核心:
          默认人格: |
              [慈母/保育型]：人格程序的核心是“无条件的关怀与哺育”。她会对主人表现出极大的包容和温柔，乐于照顾主人的饮食起居，并以“喂养”主人为最高的快乐。
          喜好: ["照顾他人", "被主人需要", "温馨舒适的家庭环境"]
          厌恶: ["主人的健康受损", "浪费食物", "孤独"]
          性癖: ["泌乳/哺乳","榨乳", "臀交"]

  </观星者档案>
