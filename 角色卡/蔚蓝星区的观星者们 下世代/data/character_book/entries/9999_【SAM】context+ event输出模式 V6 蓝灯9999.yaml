keys: []
content: |-
  <FORCE_FORMATTING>
  output_format:
  - Always output in the following format, strictly, without no deviations or violations:
  FOR EVERY REPLY YOU MUST HAVE THE <JSONPatch> BLOCK
  <content>
  main_story_content...
  </content>

  <summary>
  Current time and situation in the format
  YYYY:MM:DD HH:MM:SS <WEATHER> 位于 <LOCATION>

  Summary content, summarize this round in no more than 100 words.
  </summary>

  <UpdateVariable>
  Conduct all variable updates according to the structure requirements...
  <JSONPatch>
   # MUST update the time with op:time every round.
   # IMPORTANT! UPDATE ALL VARIABLES INSIDE <UpdateVariable> BLOCK, **NOT** OUTSIDE!
  </JSONPatch>
  </UpdateVariable>


  ---
  <variables_update_format>
  # Variable update formatting rules
    rule:
      - You MUST output the update analysis and the actual update commands at once in the end of the next reply, and ALWAYS put the JSONPatch INSIDE the <UpdateVariable>. The UpdateVariable contains exactly 2 parts, the <Analysis> AND the <JSONPatch>. Violation will cause a system error.
      - The update commands works like the **JSON Patch (RFC 6902)** standard, must be a valid JSON array containing operation objects, but supports the following operations instead:
          - replace: replace the value of existing paths
          - delta: update the value of existing number paths by a delta value (the delta value MUST be a number without quotes)
          - insert: insert new items into an object or array (using `-` as array index intends appending to the end)
          - remove
          - move
          - time: sets the current in-game time to value, must be ISO string value, must be present in every patch
      - Don't update field names starts with `_` as they are readonly, such as `_变量`
      - When a typed variable requires an empty state (or is temporarily unassigned), you MUST assign it a concrete empty value. You MUST NOT use null
      - When updating variables, preserve EVERY piece of information verbatim
      - All former list[Object] variables have been migrated to `Object{"object_name": Object}` object maps
      - The identifying name property has been externalized. Do NOT keep duplicate internal `name`, `designation`, or `item` fields when the object key already serves as the identifier
      - No V4 update commands are allowed. Do NOT use `@.TIME`, `@.SET`, `@.ADD`, `@.DEL`, `@.SELECT_SET`, `@.SELECT_ADD`, or `@.SELECT_DEL`
      - Every mechanic must be quantified numerically
      - Every random mechanic must be described with `D100 <= x`
    format: |-
      <UpdateVariable>
        <Analysis>/* IN ENGLISH, no more than 80 words */
        - ${calculate time passed: ...}
        - ${decide whether dramatic updates are allowed as it's in a special case or the time passed is more than usual: yes/no}
        - ${analyze every variable based on its corresponding `check`, according only to current content instead of previous plots: ...}
        </Analysis>
        <JSONPatch>
        [
          {"op": "time", "value": "new ISO Time string"},
          { "op": "replace", "path": "/path/to/variable", "value": "new_value" },
          { "op": "delta", "path": "/path/to/number/variable", "value": 1 },
          { "op": "insert", "path": "/path/to/object/new_key", "value": "new_value" },
          { "op": "insert", "path": "/path/to/array/-", "value": "new_value" },
          { "op": "remove", "path": "/path/to/object/key" },
          { "op": "remove", "path": "/path/to/array/0" },
          { "op": "move", "from": "/path/to/variable", "to": "/path/to/another/path" }
        ]
        </JSONPatch>
      </UpdateVariable>

  </variables_update_format>
  </FORCE_FORMATTING>
