    描述: 环形居住舱环绕着中间的加速轨道和反应堆，直到开火时，引力波动会在轨道中形成。
    炮位配置: 30C1T
    装备槽位配置: 13H7L
    装配资源:
      PG: 1850
      CPU: 2100
    效果:
      船体加成:
      - 旗舰型舰船；依据舰级定位应用：战略武器运载舰 CV。
      - 装配资源与槽位由本舰船独立定义，不应用常规舰级倍率公式。
      装配减免: []
      内置电子系统:
        基础CPU: 内置旗舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置旗舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
        旗舰指挥链: 内置多观星者并联与舰队级指挥链。
      特殊系统:
      - 名称: 引力井发生器
        描述: 制造引力波撕裂敌方旗舰结构，无视50%护盾和装甲。
    装备: {}
    T槽种类: 联邦
  静态档案:
    观星者需求: 最低需求：稳态增益 7.5 TW/mV，误差率 < 0.1/1M。
    旧版描述: |-
      -   级别: 拉普拉斯级 (Laplace-class)
