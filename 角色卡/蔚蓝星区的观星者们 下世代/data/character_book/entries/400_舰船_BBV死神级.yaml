keys:
- 航空战列舰
- AA-14
- 战列舰
content: |-
  <ship_def>
  级别: 死神级
  别名: Reaper-class
  舰船类型: BBV
  舰种: 航空战列舰 (高级战列舰)
  价格: ''
  制造商: 奇戎基因 (特别项目部 - 定制)
  描述: 舰体设计充满了哥特式的、病态的美感。修长的舰身主体呈深邃的黑色，如同出鞘的利刃，上面用银线勾勒出复杂的、类似天使羽翼的纹路。舰体中部集成了两座战列舰级的主炮塔，后半段则是扁平化的、内置式的无人机机库。整艘船在“机动模式”下看起来像一艘放大了的突击巡洋舰，但在切换到“猎杀模式”时，舰体两侧会展开巨大的、如同骨翼般的散热器和能量传导矩阵，散发出不祥的血红色光芒。
  舰船单位模板:
    舰船类型: BBV
    吨位: XL
    驾驶员: ''
    是否旗舰: false
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 4
    跃迁消耗: 3
    制造商: 奇戎基因 (特别项目部 - 定制)
    描述: 舰体设计充满了哥特式的、病态的美感。修长的舰身主体呈深邃的黑色，如同出鞘的利刃，上面用银线勾勒出复杂的、类似天使羽翼的纹路。舰体中部集成了两座战列舰级的主炮塔，后半段则是扁平化的、内置式的无人机机库。整艘船在“机动模式”下看起来像一艘放大了的突击巡洋舰，但在切换到“猎杀模式”时，舰体两侧会展开巨大的、如同骨翼般的散热器和能量传导矩阵，散发出不祥的血红色光芒。
    炮位配置: 2L4C
    装备槽位配置: 12H6L
    装配资源:
      PG: 1152
      CPU: 2432
    效果:
      船体加成:
      - 依据舰级定位应用：航空战列舰 (高级战列舰)。
      装配减免: []
      内置电子系统:
        基础CPU: 内置主力舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置主力舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
      特殊系统:
      - 名称: 双相作战协议
        描述: '专为AA-014“米迦勒”的神经特性而设计的战术切换系统，允许她在两种截然不同的作战模式间切换。\n**机动模式**: 将能源优先供应给引擎和跃迁核心，收回所有外部散热器，以巡洋舰级别的机动性进行长距离的追踪和索敌。\n**猎杀模式**: 展开散热骨翼，将反应堆的全部输出灌注到武器系统中。主炮充能速度提升50%，锁定精度提升30%，无人机AI的攻击性协议被解锁至最高级别。在此模式下，舰船的防御能力和机动性会大幅下降，完全依赖“米迦勒”精准的判断来规避伤害。'
    装备: {}
  静态档案:
    观星者需求: 专为AA-014“米迦勒”和她的指挥官设计。其神经接口与其他观星者完全不兼容，是她的专属王座，也是她的钢铁囚笼。
    旧版描述: |-
      “背叛是原罪，而赎罪的唯一方式，便是由我亲手赐予你死亡。妹妹，我来了。”——奇戎基因内部通讯截获的加密信息，发信人：AA-014-M
      -   级别: 死神级 (Reaper-class)
      -   类型: 航空战列舰 (高级战列舰)
      -   形态: 舰体设计充满了哥特式的、病态的美感。修长的舰身主体呈深邃的黑色，如同出鞘的利刃，上面用银线勾勒出复杂的、类似天使羽翼的纹路。舰体中部集成了两座战列舰级的主炮塔，后半段则是扁平化的、内置式的无人机机库。整艘船在“机动模式”下看起来像一艘放大了的突击巡洋舰，但在切换到“猎杀模式”时，舰体两侧会展开巨大的、如同骨翼般的散热器和能量传导矩阵，散发出不祥的血红色光芒。
      -   设计逻辑: “死神”级是奇戎基因内部最黑暗的秘密，是为一个特定的、不惜一切代价的目标而生的终极猎杀工具。在“人工天使”项目失控，文森特夫妇死亡，“亚兹拉尔”（AA-013）丢失后，项目的新负责人（也是“客户V”的竞争对手）启动了最终保险——“米迦勒”（AA-014）。为了确保“米迦勒”能够百分之百地完成追猎任务，奇戎基因为她量身定制了这艘独一无二的战舰。“死神”级的设计哲学是极致的“追猎与歼灭”，它融合了战列舰的远程火力、巡洋舰的高速机动性以及航母的舰载机支援能力，唯一的缺点是装甲和护盾较弱。
      -   制造商: 奇戎基因 (特别项目部 - 定制)
      -   静态配置文件:
          -   舰体全长: 980米
          -   标准船员配置: 2人 (仅限AA-014和她的指挥官)
          -   性能评级:
              -   装甲: 75000 / 65000 (猎杀模式)
              -   护盾: 140000 / 130000 (猎杀模式)
              -   机动性: 68 / 45 (猎杀模式)
              -   火力输出: 22000 (主炮) + 8000 (无人机)
          -   武器系统:
              -   主要系统: 2x “终末”级双联装重型阳电子炮塔
              -   次要系统: 4x “复仇”中队攻击无人机机库 (专注于高速拦截与瘫痪)，每队8架
              -   攻击射程: 160000 km
          -   特殊系统:
              -   名称: 双相作战协议
              -   描述: 专为AA-014“米迦勒”的神经特性而设计的战术切换系统，允许她在两种截然不同的作战模式间切换。\n**机动模式**: 将能源优先供应给引擎和跃迁核心，收回所有外部散热器，以巡洋舰级别的机动性进行长距离的追踪和索敌。\n**猎杀模式**: 展开散热骨翼，将反应堆的全部输出灌注到武器系统中。主炮充能速度提升50%，锁定精度提升30%，无人机AI的攻击性协议被解锁至最高级别。在此模式下，舰船的防御能力和机动性会大幅下降，完全依赖“米迦勒”精准的判断来规避伤害。
          -   观星者需求: 专为AA-014“米迦勒”和她的指挥官设计。其神经接口与其他观星者完全不兼容，是她的专属王座，也是她的钢铁囚笼。
  </ship_def>
