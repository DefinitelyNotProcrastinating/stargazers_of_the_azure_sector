content: |-
  <ship_def>
  级别: 圣骑士级
  别名: ''
  舰船类型: HAC
  舰种: 重型突击巡洋舰 (高级巡洋舰) CA
  价格: 254M
  制造商: 赫克勒斯重工
  描述: 舰体设计充满了帝国的庄重与威严，呈厚重的弓背型，舰首和舰体中轴线覆盖着额外的装甲层，如同古代骑士的全身板甲。主炮塔被整合在舰体背部，数个巨大的散热装置在非战斗状态下收纳于舰体两侧的装甲之下。整体涂装为帝国舰队标准的深灰色，并饰以金色的纹章。
  舰船单位模板:
    舰船类型: HAC
    吨位: L
    驾驶员: ''
    是否旗舰: false
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 6
    跃迁消耗: 2
    制造商: 赫克勒斯重工
    描述: 舰体设计充满了帝国的庄重与威严，呈厚重的弓背型，舰首和舰体中轴线覆盖着额外的装甲层，如同古代骑士的全身板甲。主炮塔被整合在舰体背部，数个巨大的散热装置在非战斗状态下收纳于舰体两侧的装甲之下。整体涂装为帝国舰队标准的深灰色，并饰以金色的纹章。
    炮位配置: 4M8S
    装备槽位配置: 7H7L
    装配资源:
      PG: 288
      CPU: 608
    效果:
      船体加成:
      - 依据舰级定位应用：重型突击巡洋舰 (高级巡洋舰) CA。
      装配减免: []
      内置电子系统:
        基础CPU: 内置巡洋舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置巡洋舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
      特殊系统:
        名称: 紧急损害管制系统
        描述: 当舰船结构完整度低于30%时，舰长可以激活此系统。激活后，舰载服务器会立即将反应堆的备用能源分流至结构完整力场发生器和内部的纳米体修复中继站。在接下来的30秒内，舰船的装甲抗性将临时提升50%，并立刻修复一部分关键系统损伤。这个系统无法完全修复舰船，但能为其在最危急的时刻争取到宝贵的生存时间，足以撑到后勤单位抵达或完成战术撤退。后勤舰修复完成后，战舰将可以继续战斗。
    装备: {}
  静态档案:
    观星者需求: 对观星者的神经坚韧度和稳定性有较高要求，以长时间维持远程火控的精准度并承受紧急损管系统启动时的能量奔流。
    旧版描述: |-
      -   级别: 圣骑士级
