      -   形态: 舰体设计充满了帝国的庄重与威严，呈厚重的弓背型，舰首和舰体中轴线覆盖着额外的装甲层，如同古代骑士的全身板甲。主炮塔被整合在舰体背部，数个巨大的散热装置在非战斗状态下收纳于舰体两侧的装甲之下。整体涂装为帝国舰队标准的深灰色，并饰以金色的纹章。
      -   制造商: 赫克勒斯重工
      -   静态配置文件:
          -   舰体全长: 590米
          -   标准船员配置: 22人
          -   性能评级:
              -   装甲: 28000
              -   护盾: 17000
              -   机动性: 48
              -   火力输出: 2800
          -   武器系统:
              -   主要系统: 4x FLS-M IV型 远程聚焦激光炮台
              -   次要系统: 8x “守护者”中程防御激光阵列
