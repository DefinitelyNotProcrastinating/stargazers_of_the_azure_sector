content: |-
  <ship_def>
  级别: 枪骑兵级
  别名: ''
  舰船类型: FF
  舰种: 护卫舰
  舰体类别: 海军型
  价格: 0.5M
  制造商: 帝国海军设计局
  描述: 舰体修长呈矛尖状，表面覆盖着黑色的吸波涂层和金色的帝国纹章。引擎喷口位于舰尾两侧，如同骑士的长靴。
  舰船单位模板:
    舰船类型: FF
    吨位: S
    驾驶员: ''
    是否旗舰: false
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 8
    跃迁消耗: 1
    制造商: 帝国海军设计局
    描述: 舰体修长呈矛尖状，表面覆盖着黑色的吸波涂层和金色的帝国纹章。引擎喷口位于舰尾两侧，如同骑士的长靴。
    炮位配置: 3S
    装备槽位配置: 4H3L
    装配资源:
      PG: 42
      CPU: 168
    效果:
      船体加成:
      - 小型脉冲激光伤害 +15%
      - 小型脉冲激光跟踪 +20%
      - 点防御激光循环时间 -15%
      装配减免:
      - 小型能量武器 PG需求 -1
      - 小型能量武器 CPU需求 -1
      内置电子系统:
        基础CPU: 内置舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置基础侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
      特殊系统:
        名称: 快速截击引擎超载器
        效果:
        - 短时间内亚光速引擎推力提升至 150%
        - 每 20 秒允许一次超载
    装备: {}
  静态档案:
    舰种: 护卫舰
    舰体类别: 海军型
    价格: 0.5M
    规格:
      舰体全长: 60米
      标准船员配置: 2人
    性能评级:
      装甲: 350
      护盾: 120
      机动性: 90
      火力输出: 200
    炮位明细:
    - 名称: S1
      尺寸: S
      类型: 能量炮座
      适配武器:
      - 脉冲激光
      - 集束激光
    - 名称: S2
      尺寸: S
      类型: 能量炮座
      适配武器:
      - 脉冲激光
      - 集束激光
    - 名称: S3
      尺寸: S
      类型: 防御武器座
      适配武器:
      - 点防御激光
      - 火箭弹发射器
    推荐装备方案:
    - 2x 小型脉冲激光
    - 1x 点防御激光
    观星者需求:
      控制门槛:
        最低稳态增益: 1.0 TW/mV
        最低比特率: 150 TB/s
        最高精度误差: 2.5/1M
      超载门槛:
        最低爆发增益: 2.6 TW/mV
        需要技能: 工程 V
        规则:
        - 爆发增益不足时，不可启动快速截击引擎超载器
        - 超载为 2 回合 1 次
        - 超载后的主动模块或武器效果提高至原值的 150%
      接口要求: 标准帝国军用接口
    设计语: 它不仅仅是一艘船，它是皇帝意志的延伸，是秩序的铁锤。当它的阴影投下，叛乱者将学会敬畏。
    引文来源: 帝国海军战术手册·序言
  </ship_def>
