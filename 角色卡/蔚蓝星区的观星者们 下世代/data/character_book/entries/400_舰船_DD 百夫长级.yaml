      适配武器:
      - 点防御激光
      - 火箭弹发射器
    推荐装备方案:
    - 2x 小型脉冲激光
    - 3x 点防御激光或火箭弹发射器
    观星者需求:
      控制门槛:
        最低稳态增益: 2.0 TW/mV
        最低比特率: 220 TB/s
        最高精度误差: 1.8/1M
