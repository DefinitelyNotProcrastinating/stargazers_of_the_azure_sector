        基础侦测器: 内置基础侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
      特殊系统:
        名称: 舰队防御链接投射器
        效果:
        - 将点防御火控数据共享给周围友军护卫舰
        - 提高小队整体防空效率
    装备: {}
  静态档案:
    舰种: 驱逐舰
    舰体类别: 海军型
    价格: 5.5M
    规格:
      舰体全长: 180米
      标准船员配置: 2人
    性能评级:
      装甲: 1200
      护盾: 400
      机动性: 65
      火力输出: 650
