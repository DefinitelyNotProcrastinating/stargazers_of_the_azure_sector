content: |-
  <ship_def>
  级别: 布道者级
  别名: Evangelist-class
  舰船类型: ESC
  舰种: 干扰巡洋舰 (特种巡洋舰)
  价格: 280M
  制造商: 比邻星造船厂
  描述: 舰体修长，呈尖锐的十字形，中央舰体向后延伸，两侧是巨大的传感器与目标标记阵列吊舱。整体设计充满了帝国式的威严与神圣感，曜石黑的涂装上用金色勾勒出复杂的纹路，如同移动的教堂。在非工作状态下，阵列会收拢，紧贴舰身，使其看起来像一把蓄势待发的长枪。
  舰船单位模板:
    舰船类型: ESC
    吨位: L
    驾驶员: ''
    是否旗舰: false
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 6
    跃迁消耗: 2
    制造商: 比邻星造船厂
    描述: 舰体修长，呈尖锐的十字形，中央舰体向后延伸，两侧是巨大的传感器与目标标记阵列吊舱。整体设计充满了帝国式的威严与神圣感，曜石黑的涂装上用金色勾勒出复杂的纹路，如同移动的教堂。在非工作状态下，阵列会收拢，紧贴舰身，使其看起来像一把蓄势待发的长枪。
    炮位配置: 4S
    装备槽位配置: 9H5L
    装配资源:
      PG: 288
      CPU: 608
    效果:
      船体加成:
      - 特种巡洋舰；依据舰级定位应用：干扰巡洋舰 (特种巡洋舰)。
      装配减免: []
      内置电子系统:
        基础CPU: 内置特种巡洋舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置特种巡洋舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
      特殊系统:
      - 名称: “真理之光”目标标记系统
        描述: “布道者”级的核心。激活后，舰船会向单一目标投射一道高强度的共振能量束。这道能量束本身伤害极低，但会像灯塔一样“点亮”目标。任何接收到该共振广播的友方帝国舰船，其火控系统在攻击该目标时，锁定速度将提升30%，武器失准率降低50%。更重要的是，该信标能作为一个临时的量子传送锚点，使得友军发射的制导导弹在跃迁至目标附近时，出跃迁的位置会更加精准，极大缩短了导弹的末端冲刺距离，显著提升了命中率。
    装备: {}
  静态档案:
    观星者需求: 需求并不高。大部分算力都被交给了电脑处理。
    旧版描述: |-
      -   级别: 布道者级 (Evangelist-class)
      -   类型: 干扰巡洋舰 (特种巡洋舰)
      -   价格: 280M
      -   形态: 舰体修长，呈尖锐的十字形，中央舰体向后延伸，两侧是巨大的传感器与目标标记阵列吊舱。整体设计充满了帝国式的威严与神圣感，曜石黑的涂装上用金色勾勒出复杂的纹路，如同移动的教堂。在非工作状态下，阵列会收拢，紧贴舰身，使其看起来像一把蓄势待发的长枪。
      -   制造商: 比邻星造船厂
      -   静态配置文件:
          -   舰体全长: 540米
          -   标准船员配置: 14人
          -   性能评级:
              -   装甲: 9000
              -   护盾: 8500
              -   机动性: 62
              -   火力输出: 500 (仅限自卫无人机)
          -   武器系统:
              -   主要系统: 2x “神谕”远程目标标记阵列
              -   次要系统: 4x “侍从”轻型防御无人机挂架
              -   攻击射程: 210000 km (标记有效距离)
          -   特殊系统:
              -   名称: “真理之光”目标标记系统
              -   描述: “布道者”级的核心。激活后，舰船会向单一目标投射一道高强度的共振能量束。这道能量束本身伤害极低，但会像灯塔一样“点亮”目标。任何接收到该共振广播的友方帝国舰船，其火控系统在攻击该目标时，锁定速度将提升30%，武器失准率降低50%。更重要的是，该信标能作为一个临时的量子传送锚点，使得友军发射的制导导弹在跃迁至目标附近时，出跃迁的位置会更加精准，极大缩短了导弹的末端冲刺距离，显著提升了命中率。
          -   观星者需求: 需求并不高。大部分算力都被交给了电脑处理。
  </ship_def>
