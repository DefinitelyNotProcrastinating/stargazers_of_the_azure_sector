content: |-
  <ship_def>
  级别: 守望者级
  别名: ''
  舰船类型: FF
  舰种: 护卫舰
  舰体类别: 常规型
  价格: 0.4M
  制造商: 共和国达科塔星港 / 索鲁斯集团
  描述: 方正、粗犷，没有任何多余的线条。像是一块装了引擎的砖头，外露的管线和装甲板显示出极易维修的特性。
  舰船单位模板:
    舰船类型: FF
    吨位: S
    驾驶员: ''
    是否旗舰: false
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 8
    跃迁消耗: 1
    制造商: 共和国达科塔星港 / 索鲁斯集团
    描述: 方正、粗犷，没有任何多余的线条。像是一块装了引擎的砖头，外露的管线和装甲板显示出极易维修的特性。
    炮位配置: 3S
    装备槽位配置: 3H2L
    装配资源:
      PG: 30
      CPU: 120
    效果:
      船体加成:
      - 小型磁轨炮伤害 +10%
      - 小型磁轨炮最佳射程 +20%
      - 点防御与拦截导弹锁定速度 +25%
      装配减免:
      - 小型动能武器 CPU需求 -1
      - 防御武器座上安装的导弹或点防御武器 PG需求 -1
      内置电子系统:
        基础CPU: 内置舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置基础侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
      特殊系统:
        名称: 加力燃烧室
        效果:
        - 亚光速航速 +15%
        - 转向响应 +10%
    装备: {}
  静态档案:
    舰种: 护卫舰
    舰体类别: 常规型
    价格: 0.4M
    规格:
      舰体全长: 70米
      标准船员配置: 8人
    性能评级:
      装甲: 100
      护盾: 400
      机动性: 95
      火力输出: 180
    炮位明细:
    - 名称: S1
      尺寸: S
      类型: 通用炮座
      适配武器:
      - 能量武器
      - 动能武器
    - 名称: S2
      尺寸: S
      类型: 通用炮座
      适配武器:
      - 能量武器
      - 动能武器
    - 名称: S3
      尺寸: S
      类型: 防御武器座
      适配武器:
      - 导弹发射器
      - 火箭弹发射器
      - 点防御激光
    推荐装备方案:
    - 2x 小型磁轨炮
    - 1x 点防御激光或拦截导弹发射器
    观星者需求:
      控制门槛:
        最低稳态增益: 0.8 TW/mV
        最高精度误差: 8.0/1M
      超载门槛:
        最低爆发增益: 1.6 TW/mV
        需要技能: 工程 V
        规则:
        - 爆发增益不足时，不可使用本舰超载能力
        - 超载为 2 回合 1 次
        - 超载仅适用于主动武器与主动模块，效果提高至原值的 150%
      接口要求: 极低，兼容老旧型号
    设计语: 它是廉价的，它是丑陋的，但它保护了你的家园。
  </ship_def>
