content: |-
  <ship_def>
  级别: 克拉肯级
  别名: ''
  舰船类型: CV
  舰种: 工业旗舰 / 超级航母 CV
  价格: 160B
  制造商: 辛迪加联合船坞
  描述: 极其庞大臃肿，如同一个移动的方形空间站，充满了工业气息。舰体上有无数的起重臂、停泊口和生产管线。
  舰船单位模板:
    舰船类型: CV
    吨位: XL
    驾驶员: ''
    是否旗舰: true
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 5
    跃迁消耗: 4
    制造商: 辛迪加联合船坞
    描述: 极其庞大臃肿，如同一个移动的方形空间站，充满了工业气息。舰体上有无数的起重臂、停泊口和生产管线。
    炮位配置: 50C
    装备槽位配置: 10H10L
    装配资源:
      PG: 1450
      CPU: 1900
    效果:
      船体加成:
      - 旗舰型舰船；依据舰级定位应用：工业旗舰 / 超级航母 CV。
      - 装配资源与槽位由本舰船独立定义，不应用常规舰级倍率公式。
      装配减免: []
      内置电子系统:
        基础CPU: 内置旗舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置旗舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
        旗舰指挥链: 内置多观星者并联与舰队级指挥链；具体接口需求见静态档案。
      特殊系统:
      - 名称: 移动制造中心
        描述: 内部拥有完整的战舰生产线。只要有原材料，就能在战场边缘源源不断地补充己方损失的无人机。
    装备: {}
  静态档案:
    观星者需求: 最低需求：3名以上观星者，单体稳态增益 5.0 TW/mV。
    旧版描述: |-
      “我们的规模，就是我们的信誉。”
      -   级别: 克拉肯级
      -   类型: 工业旗舰 / 超级航母 CV
      -   价格: 160B
      -   形态: 极其庞大臃肿，如同一个移动的方形空间站，充满了工业气息。舰体上有无数的起重臂、停泊口和生产管线。
      -   制造商: 辛迪加联合船坞
      -   静态配置文件:
          -   舰体全长: 5800米
          -   标准船员配置: 5000人 (含大量工人)
          -   性能评级:
              -   装甲: 120000
              -   护盾: 150000
              -   机动性: 5
              -   火力输出: 45000
          -   武器系统:
              -   主要系统: 50x 工业/战斗无人机机库 (混合编队)，每编队8架
              -   次要系统: 40x 重型防空激光
              -   攻击射程: 200000 km (无人机)
          -   特殊系统:
              -   名称: 移动制造中心
              -   描述: 内部拥有完整的战舰生产线。只要有原材料，就能在战场边缘源源不断地补充己方损失的无人机。
          -   观星者需求: 最低需求：3名以上观星者，单体稳态增益 5.0 TW/mV。
  </ship_def>
