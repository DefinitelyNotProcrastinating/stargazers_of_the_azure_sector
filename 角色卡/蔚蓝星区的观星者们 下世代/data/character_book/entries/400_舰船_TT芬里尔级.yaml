content: |-
  <ship_def>
  级别: 芬里尔级
  别名: Fenrir-class
  舰船类型: TT
  舰种: 泰坦 (TT)
  价格: 290B
  制造商: 共和国太空军造船厂
  描述: 舰体粗犷而充满力量感，如同一头蓄势待发的钢铁巨龙。舰首是巨大的收束器和主武器发射口，舰身两侧布满了外露的散热管道和白色的装甲鳞片。舰体后部是四台巨大的高出力效率推进器，喷射着炽热的等离子体。整艘船没有丝毫多余的装饰，每一寸结构都在为最纯粹的破坏力服务。
  舰船单位模板:
    舰船类型: TT
    吨位: XL
    驾驶员: ''
    是否旗舰: true
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 6
    跃迁消耗: 6
    制造商: 共和国太空军造船厂
    描述: 舰体粗犷而充满力量感，如同一头蓄势待发的钢铁巨龙。舰首是巨大的收束器和主武器发射口，舰身两侧布满了外露的散热管道和白色的装甲鳞片。舰体后部是四台巨大的高出力效率推进器，喷射着炽热的等离子体。整艘船没有丝毫多余的装饰，每一寸结构都在为最纯粹的破坏力服务。
    炮位配置: 10XL12C1T
    装备槽位配置: 14H8L
    装配资源:
      PG: 3600
      CPU: 2800
    效果:
      船体加成:
      - 旗舰型舰船；依据舰级定位应用：泰坦 (TT)。
      - 装配资源与槽位由本舰船独立定义，不应用常规舰级倍率公式。
      装配减免: []
      内置电子系统:
        基础CPU: 内置旗舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置旗舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
        旗舰指挥链: 内置多观星者并联与舰队级指挥链；具体接口需求见静态档案。
      特殊系统:
      - 名称: “诸神黄昏”末日武器系统 (二选一装配)
        描述: 位于舰首的超常规武器发射装置。
    装备: {}
    T槽种类: 共和国
  静态档案:
    观星者需求: 跃迁核心稳定度+25。需要至少20名拥有极高神经韧性和承受力的观星者进行协议链接，或一名传说中拥有超过20TW/mV稳定增益的观星者才能驾驭。
    旧版描述: |-
      “他们用锁链束缚我们，用律法定义我们，用神权恐吓我们。但他们忘了，锁链终将被挣断，律法终将被改写，诸神也终将迎来黄昏。”——共和国卫队第一元帅，伊莲娜·科沃，在“芬里尔”级命名仪式上的演讲
      -   级别: 芬里尔级 (Fenrir-class)
      -   类型: 泰坦 (TT)
      -   价格: 290B
      -   形态: 舰体粗犷而充满力量感，如同一头蓄势待发的钢铁巨龙。舰首是巨大的收束器和主武器发射口，舰身两侧布满了外露的散热管道和白色的装甲鳞片。舰体后部是四台巨大的高出力效率推进器，喷射着炽热的等离子体。整艘船没有丝毫多余的装饰，每一寸结构都在为最纯粹的破坏力服务。
      -   制造商: 共和国太空军造船厂
      -   静态配置文件:
          -   舰体全长: 18900米
          -   标准船员配置: 7200人
          -   性能评级:
              -   装甲: 2,200,000
              -   护盾: 2,200,000
              -   机动性: 7
              -   火力输出: 400,000
          -   武器系统:
              -   主要系统: 10x “咆哮”级90000mm超重型磁轨炮
              -   次要系统: 180x “雷震”集群点防御发射器, 12x “利刃”重型轰炸机机库
              -   攻击射程: 320,000 km
          -   特殊系统:
              -   名称: “诸神黄昏”末日武器系统 (二选一装配)
              -   描述: 位于舰首的超常规武器发射装置。
                  1.  **“耀星”伽马射线暴发生器**: 在舰首前方引爆一颗微型人造超新星，释放出一道毁灭性的、高度聚焦的伽马射线束。该武器的多频射线能够烧穿几乎所有已知物质，对直线路径上的所有目标造成灾难性的辐射和热能伤害。该系统拥有独立的能量循环装置，可以稳定地重复使用。
                  2.  **“繁星”制导鱼雷集群**: 一次性发射数千枚搭载了量子传送和自适应AI的重型鱼雷。这些鱼雷如同一场无法躲避的流星雨，会自动寻找并摧毁区域内除旗舰外的所有高价值目标（如战列舰、航母），是清理敌方主力舰队的终极武器。
          -   观星者需求: 跃迁核心稳定度+25。需要至少20名拥有极高神经韧性和承受力的观星者进行协议链接，或一名传说中拥有超过20TW/mV稳定增益的观星者才能驾驭。
  </ship_def>
