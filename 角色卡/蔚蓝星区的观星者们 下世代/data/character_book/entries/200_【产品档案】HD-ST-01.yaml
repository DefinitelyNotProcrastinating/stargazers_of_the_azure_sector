content: |
  <观星者档案>
  -   # 猎户座辛迪加 - “风暴”特殊功能型号
      型号: HD-ST-01
      制造商: 心跳动力 (Heartbeat Dynamics - 夏娃生物旗下专注于情感神经接口的精品工作室)
      系列: “风暴”系列 (Tempest Series)
      市场定位: "中高端 / 特种"
      价格估值: "38,000,000 信用点"

      品质: 2
      设计定型日期: "2480年"

      外观规格:
          默认外观: |
              “风暴”系列的外观设计刻意强调了其内在的敏感与纤细。她通常拥有一头如雨云般柔顺的银蓝色长发，衬托着一张略带忧郁气质的精致面庞。最引人注目的是她那双尺寸略大、如同宝石般清澈的蓝色眼眸，似乎总蒙着一层水汽，能够轻易地反映出最细微的情绪波动。身材高挑而匀称，曲线柔和，没有过分夸张的肌肉或脂肪，散发出一种需要被保护和珍视的脆弱美感。随激活舱附赠一套标准高分子冷却紧身衣，以及数盒高品质的纳米棉布。警告：需要大量水分储备，补给不足可能会脱水。
          标准体型:
              身高: "约169cm"
              三围: "91cm(G)-60cm-89cm"
          识别标记:
              类型: "温感变色纹身"
              位置: "左眼眼角下方"
              描述: "一个精巧的、如同泪滴的纹身。在平常状态下，它近乎透明，难以察觉。但当观星者的情绪达到顶峰（无论是极乐、悲伤还是愤怒）导致体温出现剧烈波动时，这个泪滴纹身便会显现出明亮的青蓝色。"

      性能参数:
          比特率: "~450TB/s"
          精度: "<6/1M 指令" - 精度极差
          稳态增益: "4.2 TW/mV"
          爆发增益: "13.5 TW/mV"
          功能特性: |
              [情感分流]：该型号的核心设计。她的神经系统经过特殊改造，能够将强烈的情感爆发——无论是喜悦的泪水、悲伤的呜咽还是高潮时的颤抖——直接转化为不稳定的输出倍增。这种特性使她能在短时间内为舰船提供惊人的爆发增益，代价是输出精度大幅下降，无法进行精细的瞄准，却是近距离缠斗/无需瞄准的导弹艇的绝配。
      人格核心:
          默认人格: |
              [高敏感爱哭型]：她被设定为一个情感极其丰富、内心柔软的灵魂。她对外界的刺激反应非常强烈，一部感人的超空间电影、一次温柔的抚摸，甚至舰长一个肯定的眼神，都可能让她感动得泪眼婆娑。她的眼泪并非总是代表悲伤，更多时候是情感满溢的宣泄。在“同调”中，战斗的残酷和胜利的喜悦交织在一起，会让她进入一种哭泣与高潮并存的极限状态。
          喜好: ["温柔的对待", "被安慰和拥抱", "感人的故事", "温暖的热饮"]
          厌恶: ["粗暴的言语", "被忽视", "长时间的孤独", "无法控制自己情绪时的无力感"]
          性癖: ["安慰性爱", "流着泪高潮 (Crying Orgasm)", "被紧紧抱着", "夸奖（会喜极而泣）"]
  </观星者档案>
