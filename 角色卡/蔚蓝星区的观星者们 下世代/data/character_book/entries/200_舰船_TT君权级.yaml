content: |-
  <ship_def>
  级别: 君权级
  别名: ''
  舰船类型: TT
  舰种: 泰坦 (Titan)
  价格: 300B
  制造商: 帝国皇家造船厂 (比邻星)
  描述: 舰体是一柄修长、华丽的星海长剑。舰首尖锐如剑尖，舰身主体则由厚重、光滑的曜石黑装甲板构成，侧面用纯金勾勒出延续数公里的帝国纹章与古典浮雕。舰体中后部的上层结构如同剑柄的护手，数座巨大的太瓦级激光炮塔如宝石般镶嵌其上。整艘船散发着无可匹敌的威严与神圣感，是帝国绝对君权在物理维度的终极体现，也是星环与长剑徽记的构造体。
  舰船单位模板:
    舰船类型: TT
    吨位: XL
    驾驶员: ''
    是否旗舰: true
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 6
    跃迁消耗: 6
    制造商: 帝国皇家造船厂 (比邻星)
    描述: 舰体是一柄修长、华丽的星海长剑。舰首尖锐如剑尖，舰身主体则由厚重、光滑的曜石黑装甲板构成，侧面用纯金勾勒出延续数公里的帝国纹章与古典浮雕。舰体中后部的上层结构如同剑柄的护手，数座巨大的太瓦级激光炮塔如宝石般镶嵌其上。整艘船散发着无可匹敌的威严与神圣感，是帝国绝对君权在物理维度的终极体现，也是星环与长剑徽记的构造体。
    炮位配置: 12XL20L1T
    装备槽位配置: 12H10L
    装配资源:
      PG: 3200
      CPU: 2900
    效果:
      船体加成:
      - 旗舰型舰船；依据舰级定位应用：泰坦 (Titan)。
      - 装配资源与槽位由本舰船独立定义，不应用常规舰级倍率公式。
      装配减免: []
      内置电子系统:
        基础CPU: 内置旗舰级舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置旗舰级多谱段侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
        旗舰指挥链: 内置多观星者并联与舰队级指挥链；具体接口需求见静态档案。
      特殊系统:
      - 名称: “神皇之谕”裁决系统 (三选一装配)
        描述: 泰坦中轴线上搭载的终极武器平台，根据战役需求在船坞中进行模块换装。
    装备: {}
    T槽种类: 帝国
  静态档案:
    观星者需求: 跃迁核心稳定度+25。需要至少20名观星者进行并联，或一名传说中拥有超过20TW/mV稳定增益的观星者才能驾驭。
    旧版描述: |-
      “朕即帝国。朕之所指，皆为王土；朕之王土，皆为繁荣。”——泰拉帝国第三十七任皇帝，奥古斯都·泰拉，于第一艘“君权”级泰坦下水仪式上的敕令
      -   级别: 君权级
      -   类型: 泰坦 (Titan)
      -   价格: 300B
      -   形态: 舰体是一柄修长、华丽的星海长剑。舰首尖锐如剑尖，舰身主体则由厚重、光滑的曜石黑装甲板构成，侧面用纯金勾勒出延续数公里的帝国纹章与古典浮雕。舰体中后部的上层结构如同剑柄的护手，数座巨大的太瓦级激光炮塔如宝石般镶嵌其上。整艘船散发着无可匹敌的威严与神圣感，是帝国绝对君权在物理维度的终极体现，也是星环与长剑徽记的构造体。
      -   制造商: 帝国皇家造船厂 (比邻星)
      -   静态配置文件:
          -   舰体全长: 19500米
          -   标准船员配置: 8500人
          -   性能评级:
              -   装甲: 2,500,000
              -   护盾: 1,800,000
              -   机动性: 5
              -   火力输出: 350,000
          -   武器系统:
              -   主要系统: 12x “神怒”太瓦级聚焦光矛阵列
              -   次要系统: 250x “守护者”重型点防御激光阵列, 20x “惩戒者”重型导弹发射巢
              -   攻击射程: 350,000 km
          -   特殊系统:
              -   名称: “神皇之谕”裁决系统 (三选一装配)
              -   描述: 泰坦中轴线上搭载的终极武器平台，根据战役需求在船坞中进行模块换装。
                  1.  **“地壳崩裂者”地幔钻探鱼雷**: 发射一枚搭载了奇点炸弹的超重型鱼雷。该鱼雷能穿透行星地壳，在地幔深处引爆，引发全球性的地震和火山喷发，彻底摧毁行星生态圈。对舰船目标无效。
                  2.  **“净化之光”聚焦光束**: 将全船反应堆的能量汇聚于舰首的主炮口，发射一道持续数秒的、直径超过百米的超高能光束，能够瞬间熔化和气化路径上的一切物质，足以将数艘战列舰串联摧毁。
                  3.  **“天命光环”指挥增幅矩阵**: 放弃直接攻击能力，转而将能量用于生成一个覆盖整个战区的广域增益力场。力场内的所有友方帝国舰船，其装甲抗性、武器开火速率和索敌精度均提升25%，是一个能扭转大型会战战局的终极辅助系统。
          -   观星者需求: 跃迁核心稳定度+25。需要至少20名观星者进行并联，或一名传说中拥有超过20TW/mV稳定增益的观星者才能驾驭。
  </ship_def>
