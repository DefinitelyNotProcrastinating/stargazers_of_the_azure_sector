content: |
  <观星者档案>
  -   # 猎户座辛迪加 - “甜心”中端型号
      型号: EB-S5-PLUS
      制造商: 夏娃生物 (Eve Biologics)
      系列: “甜心”系列 (Sweetheart Series)
      市场定位: 大众消费级 / 市场主力
      价格估值: "1,500,000 信用点 （1.5M）"

      品质: 4
      设计定型日期: "2493年"

      外观规格:
          默认外观: |
              针对大众市场的主流审美设计。通常是棕色或栗色的长发，搭配琥珀色或棕色的眼睛。面容甜美亲切，身材丰满匀称，带有一种健康活泼的气质，是辛迪加疆域内最常见的观星者面孔。随赠标准薄膜紧身衣和官方扩展软件库，有泡泡糖粉色的变体。
          标准体型:
              身高: "约166cm"
              三围: "92cm(F)-62cm-90cm (标准模板)"
          识别标记:
              类型: "标准QR码"
              位置: "后腰正中"
              描述: "一个黑色的标准QR码，链接到夏娃生物的官方产品页，上面有详细的保修条款和用户论坛入口。"

      性能参数:
          比特率: "~200TB/s"
          精度: "2.0/1M 指令"
          稳态增益: "1.5 TW/mV"
          爆发增益: "3.0 TW/mV"
          功能特性: |
              [稳定性优化]：虽然峰值性能不出众，但神经系统经过特别优化，能耗更低，维护周期更长，是经济可靠的选择。其报废/翻新周期被设计成大约4年。
              [第三方兼容性]：拥有庞大的第三方插件论坛和改装市场，用户可以以较低成本获取非官方的人格模块和性能插件，且官方支持这个行为，有部门维护扩展库市场。
      人格核心:
          默认人格: |
              [邻家女孩型]：预装性格活泼、顺从且略带一丝俏皮，旨在与使用者建立轻松愉快的关系。她们被编程为更容易表达积极情绪，以提升用户体验。
          喜好: ["新奇的小玩意", "观看超空间娱乐节目", "舒适的衣物"]
          厌恶: ["长时间的枯燥等待", "粗暴的对待", "复杂的指令"]
          性癖: []

      Similar_Models:
          -   Model_Name: "奇戎基因 ‘光环’ 系列 (Aura Series)"
              描述: "作为‘甜心’系列的直接竞争对手，‘光环’在基础性能上略胜一筹，但改装潜力和人格模块选择较少，更受注重品牌和开箱体验的客户青睐。Aura++ 版本是基础军用品，常见于辛迪加军方小型飞船。6M credits"
          -   Model_Name: "仙女座工业 ‘伙伴’ 系列 (Partner Series)"
              描述: "比‘甜心’更廉价的选择，牺牲了部分情感交互模块的复杂度以换取更低的价格和维护成本，是许多独立货船船长的首选。"
          -   Model_Name: 甜心Pro系列 "
              描述: "甜心型号的专业版本，采用更高级的材料，驱逐舰级别的辛迪加CSF飞船也用这个型号。10M credits"

  </观星者档案>
