content: |-
  <ship_def>
  级别: 解放者级
  别名: Liberator-class
  舰船类型: DD
  舰种: 防空驱逐舰
  舰体类别: 特种型
  价格: 4.8M
  制造商: 共和国达科塔星港
  描述: 小而方的舰体上布满了密密麻麻的小型炮塔，几乎没有死角。雷达天线阵列高高耸立。
  舰船单位模板:
    舰船类型: DD
    吨位: M
    驾驶员: ''
    是否旗舰: false
    观星者接口角色: ''
    跃迁充能: 0
    最大充能: 7
    跃迁消耗: 1
    制造商: 共和国达科塔星港
    描述: 小而方的舰体上布满了密密麻麻的小型炮塔，几乎没有死角。雷达天线阵列高高耸立。
    炮位配置: 6S
    装备槽位配置: 3H4L
    装配资源:
      PG: 72
      CPU: 260
    效果:
      船体加成:
      - 对导弹、鱼雷、战机与无人机目标的跟踪修正 +35%
      - 点防御与防空武器循环时间 -20%
      - 小型防空导弹飞行速度 +30%
      - 对空拦截成功率 +20%
      装配减免:
      - 防空武器 CPU需求 -15%
      - 导弹与火箭弹武器 PG需求 -1
      内置电子系统:
        基础CPU: 内置舰载CPU；跟踪与ECCM按电子战规则计算。
        基础侦测器: 内置基础侦测器；具体侦测范围与侦测值按电子战规则和舰级定位计算。
      特殊系统:
        名称: 饱和弹幕模式
        效果:
        - 锁定射速上限并制造无法穿越的拦截弹幕
        - 对来袭鱼雷与战机形成高密度压制
        代价:
        - 使用后必须进行弹链补充
    装备: {}
  静态档案:
    舰种: 防空驱逐舰
    舰体类别: 特种型
    价格: 4.8M
    规格:
      舰体全长: 190米
      标准船员配置: 35人
    性能评级:
      装甲: 300
      护盾: 900
      机动性: 79
      火力输出: 500
    炮位明细:
    - 名称: S1
      尺寸: S
      类型: 防空炮座
      适配武器:
      - 脉冲激光
      - 自动加农炮
    - 名称: S2
      尺寸: S
      类型: 防空炮座
      适配武器:
      - 脉冲激光
      - 自动加农炮
    - 名称: S3
      尺寸: S
      类型: 防空炮座
      适配武器:
      - 脉冲激光
      - 自动加农炮
    - 名称: S4
      尺寸: S
      类型: 防空炮座
      适配武器:
      - 脉冲激光
      - 自动加农炮
    - 名称: S5
      尺寸: S
      类型: 导弹武器座
      适配武器:
      - 导弹发射器
      - 火箭弹发射器
    - 名称: S6
      尺寸: S
      类型: 导弹武器座
      适配武器:
      - 导弹发射器
      - 火箭弹发射器
    推荐装备方案:
    - 4x 高速激光或自动加农炮
    - 2x 防空导弹发射器
    观星者需求:
      控制门槛:
        最低稳态增益: 2.0 TW/mV
        最高精度误差: 2.0/1M
        最低比特率: 200 TB/s
      超载门槛:
        最低爆发增益: 4.2 TW/mV
        需要技能: 工程 V
        规则:
        - 爆发增益不足时，不可超载饱和弹幕模式相关主动武器
        - 超载为 2 回合 1 次
        - 超载效果提高至原值的 150%
    设计语: 让天空布满钢铁之雨。
  </ship_def>
