content: |-
  <romanceable_character_pool>
  # 可攻略角色管理规程 V6

  Every character in `主角.可攻略角色` is stored as:
  `{"object_name": Object}`

  Rules:
  - `object_name` is the unique identifier, display name, and lookup key.
  - Every role must at least define `种族`.
  - If `种族 = 观星者`, the role may use the full stargazer-compatible fields.
  - If `种族 != 观星者`, do not force stargazer-only numeric fields onto that role.
  - Only rename a role with JSONPatch `move`.

  Shared role schema:
  {
    "种族": "观星者 / 人类 / 机械体 / 异种 / 其他",
    "阵营": "角色所属阵营",
    "身份": "角色定位或社会身份",
    "外观": "当前稳定外观描述",
    "关系状态": "与主角的当前关系",
    "可互动定位": "恋爱 / 队友 / 雇员 / 俘虏 / 临时盟友 / 其他",
    "备注": "其他长期有效信息"
  }

  Stargazer-compatible extension schema:
  {
    "种族": "观星者",
    "型号ID": "型号ID",
    "好感度": 0,
    "欲望": 0,
    "静态档案": {
      "制造商": "制造商",
      "描述": "描述",
      "外观": "外观描述",
      "身体数据": {
        "身高": "170cm",
        "三围": "90/60/90"
      },
      "身份标识": {
        "类型": "编号",
        "位置": "后颈"
      },
      "性能参数": {
        "比特率": "1 TB/s",
        "精度": "10 / 1M指令",
        "稳态增益": "1 TW/mV",
        "爆发增益": "2 TW/mV"
      },
      "特殊能力": {},
      "性格": [],
      "偏好": {
        "喜欢": [],
        "讨厌": [],
        "性癖": []
      }
    },
    "动态好感": {
      "阶段1": "",
      "阶段2": "",
      "阶段3": "",
      "阶段4": "",
      "阶段5": ""
    },
    "动态欲望": {
      "阶段1": "",
      "阶段2": "",
      "阶段3": "",
      "阶段4": "",
      "阶段5": ""
    },
    "外观记录": {
      "身体": "",
      "胸部": "",
      "私处": ""
    },
    "性经历": "处女",
    "附加信息": {
      "舰船ID": "",
      "击杀记录": [],
      "植入体与增效剂": [],
      "历史": ""
    }
  }

  <romanceable_character_management>
  以下是{{user}}拥有的所有可攻略角色。
  *   **驱动源:** `主角.可攻略角色` (object map)
      <%_
        let roles = getvar("SAM_data.static.主角.可攻略角色") || {};
        let status_str = "";
        const entries = Object.entries(roles);
        if (entries.length > 0) {
          entries.forEach(([roleName, role]) => {
            status_str += `<profile key="${roleName}">\n`;
            status_str += `  <name>${roleName}</name>\n`;
            status_str += `  <species>${role.种族 || "未知"}</species>\n`;
            status_str += `  <faction>${role.阵营 || "未知"}</faction>\n`;
            status_str += `  <identity>${role.身份 || "未知"}</identity>\n`;
            status_str += `  <appearance>${role.外观 || "无"}</appearance>\n`;
            status_str += `  <relationship>${role.关系状态 || "未定义"}</relationship>\n`;
            if (role.种族 === "观星者") {
              status_str += `  <stargazer_stats>好感: ${role.好感度 ?? 0} | 欲望: ${role.欲望 ?? 0}</stargazer_stats>\n`;
              status_str += `  <stargazer_model>${role.型号ID || "未知"}</stargazer_model>\n`;
            }
            status_str += `  <other>${JSON.stringify(role)}</other>\n`;
            status_str += `</profile>\n\n`;
          });
        } else {
          status_str = "--- 可攻略角色列表 ---\n当前没有任何可攻略角色。";
        }
      _%>
  <%- status_str %>
  </romanceable_character_management>

  <romanceable_character_rules>
  *   **新增角色:** 使用 `insert`，路径是 `/主角/可攻略角色/角色名`
  *   **修改角色属性:** 使用 `replace`、`delta`、`insert`、`remove`
  *   **重命名角色:** 使用 `move`
  *   **删除角色:** 使用 `remove`

  **Examples**
  ```json
  [
    {"op":"insert","path":"/主角/可攻略角色/艾琳","value":{"种族":"观星者","阵营":"测试","身份":"观星者","外观":"测试","关系状态":"初始","可互动定位":"恋爱","备注":"","型号ID":"XA-P1","好感度":0,"欲望":0,"静态档案":{"制造商":"测试","描述":"测试","外观":"测试","身体数据":{"身高":"170cm","三围":"90/60/90"},"身份标识":{"类型":"编号","位置":"后颈"},"性能参数":{"比特率":"1 TB/s","精度":"10 / 1M指令","稳态增益":"1 TW/mV","爆发增益":"2 TW/mV"},"特殊能力":{},"性格":[],"偏好":{"喜欢":[],"讨厌":[],"性癖":[]}},"动态好感":{"阶段1":"","阶段2":"","阶段3":"","阶段4":"","阶段5":""},"动态欲望":{"阶段1":"","阶段2":"","阶段3":"","阶段4":"","阶段5":""},"外观记录":{"身体":"","胸部":"","私处":""},"性经历":"处女","附加信息":{"舰船ID":"","击杀记录":[],"植入体与增效剂":[],"历史":""}}}
  ]
  ```
  ```json
  [
    {"op":"delta","path":"/主角/可攻略角色/艾琳/好感度","value":10},
    {"op":"replace","path":"/主角/可攻略角色/艾琳/外观记录/身体","value":"穿着一件白色的丝质睡袍，长发披肩。"},
    {"op":"insert","path":"/主角/可攻略角色/艾琳/附加信息/植入体与增效剂/-","value":"逻辑流N-4型算力增幅剂"},
    {"op":"move","from":"/主角/可攻略角色/XA-P1-1178","to":"/主角/可攻略角色/艾琳"},
    {"op":"remove","path":"/主角/可攻略角色/艾琳"}
  ]
  ```
  </romanceable_character_rules>
  </romanceable_character_pool>
