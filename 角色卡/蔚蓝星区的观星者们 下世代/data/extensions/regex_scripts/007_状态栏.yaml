            ["abyss","阿比斯深渊","遗忘之海",1100,690,"-1000","无","超大质量黑洞周围的极端引力异常区。"],
            ["cobalt","钴蓝边境","天穹王冠",685,450,"50","辛迪加 / 独立军阀","灰色贸易与非正规采矿频繁的争议区。"],
            ["crimson","暗红星座","天穹王冠",785,405,"88","泰拉帝国","帝国重兵把守的能源产地与战略咽喉。"],
            ["splendor","璨辉星座","天穹王冠",790,490,"68","帝国 / 辛迪加","奢华度假世界与自由贸易区并存。"],
            ["canaan","新应许之地","天堂之阶",620,180,"35","共和国 / 帝国","类地行星密集的殖民冲突前线。"],
            ["golden","黄金阶梯","天堂之阶",760,235,"55","猎户座辛迪加","正在建设中的第二贸易枢纽。"],
            ["tranquil","静谧之海","天堂之阶",770,115,"45","天鹅座技术联邦","联邦探索舰队搜寻先驱遗迹的前沿。"],
            ["taboris","塔伯里斯星座","闪光星云",1050,470,"-1000","塔伯里斯宪制帝国","戴森云笼罩下的合成人文明工业心脏。"],
            ["murky","暗色星座","大荒野",185,685,"-200","塔伯里斯 / 铁血盟约","战略矿产与武装采矿平台密布的争议区。"],
            ["banshee","女妖星旋","大荒野",65,760,"-500","无","双中子星构成的极端引力与辐射航道。"],
            ["w1","W-J0001A 无星之海","未知虫洞星域",1110,505,"N/A","???","绝对黑暗的口袋宇宙，中心悬浮着 1:4:9 方块。",1],
            ["w2","W-B2005C 自我倒影","未知虫洞星域",70,110,"-2000","高维残渣","非欧几里得结构充斥的精神危害空间。",1],
            ["w3","W-C1101B 大陆架","未知虫洞星域",1070,105,"-300","无","通往未知宇宙的单向超空间裂隙。",1],
            ["w4","W-J101134 空房间","未知虫洞星域",490,70,"N/A","无","含有 1:4:9 方块的稳定 G 型主序星系。",1],
            ["w5","W-J110110","未知虫洞星域",80,350,"N/A","敌对无人机","存在敌对古代无人机编队的沃尔夫-拉叶星系。",1],
            ["w6","W-J142857 循环","未知虫洞星域",1040,225,"N/A","时空异常","每七标准时发生一次周期性坍缩。",1],
            ["w7","W-J155432 冰壳","未知虫洞星域",905,750,"N/A","无","冰壳行星地下存在空腔与规则能量信号。",1],
            ["w8","W-J160888 双星","未知虫洞星域",1180,585,"N/A","无","引力透镜效应强烈的双中子星系统。",1],
            ["w9","W-J210956 死寂","未知虫洞星域",70,570,"N/A","无","白矮星与复杂小行星带构成的死寂星系。",1]
          ],
          links: [
            ["sol","trade"],["sol","republic"],["sol","cygnus","gate"],["republic","trade"],["cygnus","trade"],
            ["cygnus","tranquil","gate"],["republic","canaan","gate"],["republic","charon","gate"],["trade","cobalt","gate"],
            ["sol","crimson","gate"],["cobalt","splendor"],["crimson","splendor"],["crimson","canaan","gate"],["crimson","murky","gate"],
            ["charon","serpent"],["charon","sanctuary"],["serpent","murky","gate"],["murky","banshee"],["canaan","golden"],
            ["canaan","tranquil"],["golden","tranquil"],["golden","taboris","gate"],["taboris","veil","gate"],["veil","tomb"],
            ["tomb","abyss"],["tomb","w1","worm"],["tranquil","w3","worm"]
          ]
        };
        const $ = id => document.getElementById(id);
        const entries = value => Object.entries(value || {});
        const text = value => value === undefined || value === null || value === "" ? "未记录" : String(value);
        const escapeHtml = value => text(value).replace(/[&<>"']/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[ch]));
        const display = value => {
          if (Array.isArray(value)) return value.length ? value.map(v => typeof v === "object" ? display(v) : escapeHtml(v)).join(" / ") : "无";
          if (value && typeof value === "object") return entries(value).map(([k,v]) => `<div><span class="muted">${escapeHtml(k)}：</span>${display(v)}</div>`).join("");
          return escapeHtml(value);
        };
        const stat = (label, value) => `<div class="stat"><div class="label">${escapeHtml(label)}</div><div class="value">${display(value)}</div></div>`;
        const tags = values => (values || []).map(v => `<span class="tag">${escapeHtml(v)}</span>`).join("");
        const detail = obj => `<div class="detail-grid">${entries(obj).map(([k,v]) => stat(k,v)).join("")}</div>`;
        const empty = message => `<div class="empty">${message}</div>`;
        const objectCards = (obj, renderer) => entries(obj).length ? `<div class="cards">${entries(obj).map(renderer).join("")}</div>` : empty("暂无记录");
        function expProgress(exp) {
          const total = Number(exp) || 0;
          let level = 0;
          for (let i = 1; i < SKILL_THRESHOLDS.length; i++) if (total >= SKILL_THRESHOLDS[i]) level = i;
          if (level >= 5) return { level, percent: 100, caption: `${total.toLocaleString()} EXP / MAX` };
          const start = SKILL_THRESHOLDS[level], end = SKILL_THRESHOLDS[level + 1];
          return { level, percent: Math.max(0, Math.min(100, (total - start) / (end - start) * 100)), caption: `${total.toLocaleString()} / ${end.toLocaleString()} EXP` };
        }
        function renderHome(data) {
          const mc = data.static?.主角 || {}, world = data.static?.世界 || {};
          const path = text(mc.位置).split("|").map(v => v.trim());
          const learning = mc.学习 || {};
          const skills = entries(mc.技能).map(([name, item]) => {
            const progress = expProgress(item?.EXP);
            const isLearning = learning.当前技能 === name && learning.状态 === "学习中";
            return `<div class="skill-card ${isLearning ? "learning" : ""}">
              <div class="skill-head"><strong>${escapeHtml(name)}</strong><span class="level">LV ${item?._等级 ?? progress.level}${isLearning ? " · 学习中" : ""}</span></div>
              <div class="bar"><div class="fill" style="width:${progress.percent}%"></div></div>
              <div class="skill-foot"><span>${progress.caption}</span><span>${progress.percent.toFixed(1)}%</span></div>
            </div>`;
          }).join("");
          $("home-view").innerHTML = `
            <div class="panel hero">
              <div><div class="label">当前位置</div><div class="place">${escapeHtml(path.slice(0,2).join(" / "))}</div><div class="subplace">${escapeHtml(path.slice(2).join(" / ") || "未记录详细坐标")}</div></div>
              <div><div class="label">信用点</div><div class="credits">${Number(mc.信用点 || 0).toLocaleString()} C</div></div>
            </div>
            <div class="grid">${stat("当前外观", mc.外观)}${stat("世界安全等级", world.安全等级)}${stat("训练状态", `${learning.状态 || "未学习"}${learning.当前技能 ? ` / ${learning.当前技能}` : ""}`)}${stat("训练速率", `${learning._实际每小时EXP ?? 0} EXP / 小时`)}</div>
            <div class="section-title">技能许可与经验</div>
            <div class="grid wide">${skills || empty("尚未登记技能")}</div>
            <div class="section-title">随身物品</div>
            <div class="panel value">${display(mc.个人物品 || [])}</div>`;
        }
        function renderCharacters(mc) {
          $("characters-view").innerHTML = `<h1>可攻略角色</h1><p class="desc">统一展示观星者与普通人类角色。观星者会额外显示专属参数。</p>` +
            objectCards(mc.可攻略角色, ([name, c]) => {
              const isStargazer = c.种族 === "观星者";
              const common = { 阵营:c.阵营, 身份:c.身份, 关系状态:c.关系状态, 可互动定位:c.可互动定位, 想法:c.想法 };
              const stargazer = { 型号ID:c.型号ID, 好感度:c.好感度, 欲望:c.欲望, 静态档案:c.静态档案, 动态好感:c.动态好感, 动态欲望:c.动态欲望, 外观记录:c.外观记录, 性经历:c.性经历, 附加信息:c.附加信息 };
              return `<article class="card"><div class="card-head"><h3>${escapeHtml(name)}</h3><span class="badge ${isStargazer ? "" : "human"}">${escapeHtml(c.种族 || "未分类")}</span></div>
                <p class="desc">${escapeHtml(c.外观 || c.静态档案?.描述 || "暂无描述")}</p>
                ${detail(common)}${isStargazer ? `<details><summary>观星者专属档案</summary>${detail(stargazer)}</details>` : ""}${c.备注 ? `<details><summary>备注</summary><div class="desc">${escapeHtml(c.备注)}</div></details>` : ""}</article>`;
            });
        }
        function renderShips(mc) {
          const renderCollection = (title, obj) => `<div class="section-title">${title}</div>` + objectCards(obj, ([name,item]) =>
            `<article class="card"><div class="card-head"><h3>${escapeHtml(name)}</h3><span class="badge">${escapeHtml(item.吨位 || item.舰船类型 || "已登记")}</span></div>${detail(item)}</article>`);
          $("ships-view").innerHTML = `<h1>舰船系统</h1><p class="desc">这里只展示属于玩家的可航行舰船。固定太空设施已转入建筑系统，不再显示陆地单位或旧单位条目。</p>` + renderCollection("舰船", mc.舰船);
        }
        function renderBases(mc) {
          const renderCollection = (title, obj, kind) => `<div class="section-title">${title}</div>` + objectCards(obj, ([name,item]) =>
            `<article class="card"><div class="card-head"><h3>${escapeHtml(name)}</h3><span class="badge">${kind}</span></div><p class="desc">${escapeHtml(item.描述 || "暂无描述")}</p>${detail(item)}</article>`);
          $("bases-view").innerHTML = `<h1>基地系统</h1><p class="desc">基地、空间站、船坞和固定建筑已按新表拆分管理。</p>` +
            renderCollection("基地与固定节点", mc.基地, "基地") + renderCollection("建筑与登记工业资产", mc.建筑, "建筑") + renderCollection("产业设施", mc.产业, "产业");
        }
        function renderAssets(data) {
          const mc = data.static?.主角 || {}, standings = data.static?.势力声望 || {};
          $("assets-view").innerHTML = `<h1>资产与声望</h1>
            <div class="section-title">旗舰库存</div><div class="panel">${detail(mc.旗舰库存 || {})}</div>
            <div class="section-title">势力声望</div><div class="grid">${entries(standings).map(([k,v]) => stat(k, Number(v).toFixed(2))).join("") || empty("暂无声望记录")}</div>`;
        }
        function renderMissions(mc) {
          $("missions-view").innerHTML = `<h1>任务</h1><p class="desc">任务名直接作为对象键，保留新表中的全部任务字段。</p>` +
            objectCards(mc.任务, ([name,item]) => `<article class="card"><div class="card-head"><h3>${escapeHtml(name)}</h3><span class="badge">${escapeHtml(item.状态 || "进行中")}</span></div>${detail(item)}</article>`);
        }
        function renderMap(mc) {
          const location = text(mc.位置), playerNode = MAP.nodes.find(n => location.includes(n[1]));
          const byId = Object.fromEntries(MAP.nodes.map(n => [n[0], n]));
          const lines = MAP.links.map(([a,b,type]) => `<line class="route ${type || ""}" x1="${byId[a][3]}" y1="${byId[a][4]}" x2="${byId[b][3]}" y2="${byId[b][4]}"/>`).join("");
          const nodes = MAP.nodes.map(n => `<g class="node ${n[8] ? "worm" : ""} ${playerNode?.[0] === n[0] ? "player" : ""}" data-node="${n[0]}"><circle cx="${n[3]}" cy="${n[4]}" r="4"/><text x="${n[3]+8}" y="${n[4]-8}">${escapeHtml(n[1])}</text></g>`).join("");
          $("map-view").innerHTML = `<div class="map-wrap"><svg viewBox="0 0 1220 820" preserveAspectRatio="xMidYMid meet">${lines}${nodes}</svg></div>
            <aside class="map-side"><div class="panel"><h2>星图导航</h2><p class="desc">已重新填入全部已登记星域、星座与虫洞节点。点击节点查看情报。</p><div class="legend"><span><i class="dot"></i>常规星区</span><span><i class="dot worm"></i>虫洞星区</span></div></div><div id="map-info">${playerNode ? mapInfo(playerNode) : empty("请选择星图节点")}</div></aside>`;
          $("map-view").querySelectorAll(".node").forEach(el => el.addEventListener("click", () => $("map-info").innerHTML = mapInfo(byId[el.dataset.node])));
        }
        function mapInfo(node) {
          return `<div class="panel"><h2>${escapeHtml(node[1])}</h2><div class="detail-grid">${stat("所属星域",node[2])}${stat("安全等级",node[5])}${stat("主权归属",node[6])}</div><div class="section-title">情报摘要</div><p class="desc">${escapeHtml(node[7])}</p></div>`;
        }
        async function init() {
          const fallback = { static:{ 世界:{安全等级:85}, 主角:{位置:"始源之环 | 太阳禁卫区 | 泰拉近地轨道",外观:"未登记",信用点:0,技能:{导弹:{EXP:0,_等级:0},炮术:{EXP:0,_等级:0},战机:{EXP:0,_等级:0},算法:{EXP:0,_等级:0},工程:{EXP:0,_等级:0},工业:{EXP:0,_等级:0},科学:{EXP:0,_等级:0},驾驶:{EXP:0,_等级:0},装甲:{EXP:0,_等级:0},护盾:{EXP:0,_等级:0}},学习:{当前技能:"",状态:"未学习",基础速率:30,速率倍率:1,_实际每小时EXP:30},个人物品:[],旗舰库存:{},任务:{},舰船:{},产业:{},基地:{},建筑:{},可攻略角色:{}}, 势力声望:{} }, time:new Date().toISOString() };
          let data = fallback;
