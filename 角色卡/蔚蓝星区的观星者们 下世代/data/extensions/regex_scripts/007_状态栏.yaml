      <script>
        const SKILL_THRESHOLDS = [0, 250, 1415, 8000, 45255, 256000];
        const MAP = {
          nodes: [
            ["sol","太阳禁卫区","始源之环",230,205,"95","泰拉帝国","帝国首都泰拉所在的核心星区。"],
            ["republic","共和国之心","始源之环",385,145,"88","自由世界共和国","商业繁荣、思想自由、情报密集的共和国心脏。"],
            ["cygnus","天鹅座摇篮","始源之环",190,330,"92","天鹅座技术联邦","联邦科技与工业中心，戴森云和研究站密布。"],
            ["trade","贸易风走廊","始源之环",390,320,"73","猎户座辛迪加","连接三大强权的黄金航道，财富与罪恶交织。"],
            ["serpent","巨蛇之喉","蛮荒边界",135,530,"10","铁血盟约","舰船残骸和掏空小行星构成的海盗都市。"],
            ["sanctuary","避难所星团","蛮荒边界",255,585,"5","星火姐妹会","脉冲星辐射笼罩下的叛逃者避风港。"],
            ["charon","卡戎之渡","蛮荒边界",275,495,"20","无","废弃战场与太空坟场，小型掠夺者活动频繁。"],
            ["veil","幽灵之幕","遗忘之海",845,565,"-10 / 99","人类技术联合","暗物质星云深处的秘密根据地。"],
